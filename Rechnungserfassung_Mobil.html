<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<script>
// =====================================================================
// Umstieg Beta -> Hauptversion (laeuft einmalig je Geraet)
// =====================================================================
// Die Beta (frueher im Ordner beta/) hatte einen eigenen Speicherbereich:
// alle Schluessel mit "beta_" davor. Beim ersten Start der Hauptversion
// werden deren Daten uebernommen:
//  - Faelle: die der Beta, dazu Faelle, die erst NACH dem Beta-Start noch in
//    der alten Version angelegt wurden (sonst gingen sie verloren)
//  - Bestatter: beide Listen zusammen
//  - alles andere (Einstellungen, Anmeldung, unfertige Rechnungen, ...) aus der Beta
// Die beta_-Eintraege werden verschoben statt kopiert (Speicherplatz).
// "beta___init" bleibt stehen, damit eine noch zwischengespeicherte alte
// Beta-Seite nicht erneut alles kopiert.
(function(){
  try{
    var ls = window.localStorage;
    if(ls.getItem('hauptversion_v1') !== null) return;
    var start = ls.getItem('beta___init');
    if(start !== null){
      var P = 'beta_', i, k, keys = [];
      var json = function(t, f){ try{ return t === null ? f : JSON.parse(t); }catch(e){ return f; } };
      var betaStart = Number(start) || 0;
      ['faelle_ls', 'faelle_pt'].forEach(function(name){
        var b = ls.getItem(P + name); if(b === null) return;
        var faelle = json(b, []), bekannt = {};
        faelle.forEach(function(f){ if(f && f.zeitstempel) bekannt[f.zeitstempel] = 1; });
        json(ls.getItem(name), []).forEach(function(f){
          if(!f || !f.zeitstempel || bekannt[f.zeitstempel]) return;
          var t = Date.parse(f.zeitstempel);
          if(!isNaN(t) && t > betaStart) faelle.push(f);
        });
        ls.removeItem(P + name);
        ls.setItem(name, JSON.stringify(faelle));
      });
      var bb = ls.getItem(P + 'bestatter_katalog');
      if(bb !== null){
        var liste = json(bb, []), namen = {};
        liste.forEach(function(x){ if(x && x.name) namen[String(x.name).toLowerCase()] = 1; });
        json(ls.getItem('bestatter_katalog'), []).forEach(function(x){ if(x && x.name && !namen[String(x.name).toLowerCase()]) liste.push(x); });
        ls.removeItem(P + 'bestatter_katalog');
        ls.setItem('bestatter_katalog', JSON.stringify(liste));
      }
      for(i = 0; i < ls.length; i++){ k = ls.key(i); if(k && k.indexOf(P) === 0 && k !== 'beta___init') keys.push(k); }
      keys.forEach(function(k){
        var v = ls.getItem(k); if(v === null) return;
        ls.removeItem(k);
        try{ ls.setItem(k.slice(P.length), v); }catch(e){}
      });
    }
    ls.setItem('hauptversion_v1', String(Date.now()));
  }catch(e){}
})();
</script>

<style>
  /* BETA: eigenes Fenster (statt Browser-Popups) mit Ladeanimation */

  @keyframes betaDreh{to{transform:rotate(360deg);}}
  .beta-fortschritt{height:6px; background:var(--rand); border-radius:3px; overflow:hidden; margin:2px 0 12px;}
  .beta-fortschritt > div{height:100%; width:0; background:#2f6fed; transition:width .35s ease;}
  .beta-erg{white-space:normal; padding:8px 0; border-bottom:1px solid var(--rand);}
  .beta-erg:last-of-type{border-bottom:none;}
  .beta-erg-klein{font-size:12.5px; color:var(--text-schwach);}
  .beta-erg .aktionen{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;}
  .beta-erg .aktionen button{width:auto; padding:7px 12px; font-size:13.5px; border-radius:8px; border:1px solid var(--rand); background:var(--karte); color:var(--text);}

  .gesamt-knoepfe{display:flex; gap:8px; flex-wrap:wrap; margin:8px 0 6px;}

  /* Einstellungen: einklappbare Abschnitte */
  .abschnitt.einklappbar > .trennlinie{cursor:pointer; display:flex; align-items:center; gap:8px; user-select:none;}

     Opera Mobile) pruefen fuer ihre eigene "Nachtmodus"-Heuristik offenbar
     eher das Wurzelelement als den body. Wird unten (body{color-scheme:...})

<style>
  :root{

    --bg:#1b2028;
    --karte:#242b36;
    --text:#dde2e8;
    --text-schwach:#9aa4ad;
    --rand:#333b42;
    /* --titelfarbe bewusst NICHT umdefiniert -- die Kopfzeile/Abschnitts-
       leisten sollen im Dunkelmodus dieselbe (dunkle) Farbe wie im
       Hellmodus behalten statt auf ein helles Grau umzuschalten, das mit
       weißer Schrift viel zu hell/blass wirkte. */
    --warnung-bg:#3a2c10;
    --warnung-rand:#c78a2e;
    --warnung-text:#f0c98a;
    --fehler:#ff6b60;
    --grau-feld:#2a3138;

  *{box-sizing:border-box;}
  body{
    margin:0; font-family:"Segoe UI",-apple-system,Roboto,Arial,sans-serif;
    background:var(--bg); color:var(--text); padding-bottom:16px;
    /* WICHTIG: das <meta name="color-scheme" content="light dark"> im <head>
       erlaubt dem Browser, native Formularelemente (v.a. Checkboxen) nach dem
       OS-Farbschema zu zeichnen -- das kann z.B. bei einem Handy im
       System-Dunkelmodus dazu fuehren, dass Checkboxen dunkel wirken, OBWOHL
       die App selbst gerade im hellen Design steht (App-Dunkelmodus ist ein
       eigener, unabhaengiger Schalter, kein OS-Schalter). "color-scheme" hier
       gezielt je nach App-Zustand setzen, damit native Checkboxen IMMER zum
       tatsaechlich aktiven App-Design passen -- unabhaengig vom OS-Schalter. */
    color-scheme: light;
  }
  body.dunkel{ color-scheme: dark; }

     ohne dass dort noch Inhalt kommt). Auf ein normales Mass reduziert. */
  main{padding:14px 14px 24px;}

  .ar-knoepfe{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:8px; padding-top:8px; border-top:1px solid var(--rand);}
  .ar-knoepfe button{width:auto; margin:0; padding:6px 12px; font-size:13px; border-radius:8px; border:1px solid var(--rand); background:var(--karte); color:var(--text);}
  .ar-knoepfe button[data-ar-neu]{background:#7d4e9e; border-color:#7d4e9e; color:#fff; font-weight:600;}
  .ar-renu{font-size:12.5px; font-weight:600; margin-right:auto;}
  .ar-renu small{display:block; font-weight:400; color:var(--text-schwach);}
  .ar-renu small.ar-abw{color:#b9770e; font-weight:600;}
  .ar-renu small.ar-bezahlt{color:#1f8a4c; font-weight:600;}
  .ar-renu small.ar-offen{color:var(--text-schwach);}
  .ar-knoepfe button[data-ar-erh].an{background:#1f8a4c; border-color:#1f8a4c; color:#fff;}
  .ar-knoepfe button.ar-weg{background:#c0392b; border-color:#c0392b; color:#fff; padding:6px 10px;}
  .ar-liste{margin:2px 0 8px; padding-left:18px; font-size:13.5px;}
  /* Am PC: Inhalt mittig in Handybreite, Maus statt Wischen */
  @media (min-width: 760px){
    main{max-width:680px; margin-left:auto; margin-right:auto;}
    header{padding-left:max(16px, calc(50% - 340px)); padding-right:max(16px, calc(50% - 340px));}
    .gesamt-aktionen{max-width:680px; margin-left:auto; margin-right:auto; border-left:1px solid var(--rand); border-right:1px solid var(--rand);}
  }
  @media (hover: hover) and (pointer: fine){
    .wisch-huelle > .fall-zeile, .wisch-huelle > .position-zeile{cursor:pointer; user-select:none;}
  }
  .ar-dienst{display:flex; align-items:center; gap:8px; margin:4px 0; font-size:13.5px;}
  .ar-dienst span{flex:1; min-width:0;}
  .ar-dienst small{display:block; font-size:11.5px; color:var(--text-schwach);}
  .ar-dienst input{width:96px !important; display:inline-block !important; text-align:right; margin:0 !important;}
  .ar-summe{text-align:right; margin-top:8px; font-size:14.5px;}
  .fd-jahre{display:flex; flex-wrap:wrap; gap:6px; margin:0 0 8px;}
  .fd-jahr-summe{font-size:13px; background:var(--karte); border:1px solid var(--rand); border-radius:10px; padding:8px 10px; margin-bottom:10px; line-height:1.5;}
  .gkv-profile{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:4px;}
  .gkv-profil-hinweis{flex-basis:100%; font-size:12.5px; color:var(--text-schwach); margin-top:2px;}
  .gkv-profil-hinweis a{color:inherit;}
  .ebm-tab{width:100%; border-collapse:collapse; font-size:13.5px;}
  .ebm-tab th, .ebm-tab td{text-align:left; padding:4px 6px; border-bottom:1px solid var(--rand);}
  .ebm-tab td:nth-child(n+2), .ebm-tab th:nth-child(n+2){text-align:right; white-space:nowrap;}
  .ebm-wege-raster{display:grid; grid-template-columns:1fr 1fr; gap:0 10px;}
  .ebm-wege-raster .fb-lbl{font-size:11.5px;}
  .karte .icon{font-size:46px; display:block; margin-bottom:12px;}
  .karte .unter{font-size:12.5px; font-weight:400; opacity:.9; margin-top:4px;}

  .btn-sekundaer{
    display:block; width:100%; background:var(--karte); border:1px solid var(--rand);
    color:var(--text); border-radius:10px; padding:14px; font-size:15px; margin-bottom:10px; cursor:pointer;
  }
  .btn-sekundaer .unter{display:block; font-size:12px; color:var(--text-schwach); margin-top:2px; font-weight:400;}
  /* "Rechnungsübersicht" (Startseite): war zunächst reines Karten-Weiß, dann
     dezentes Grau -- beides ging optisch unter. Jetzt deutlich groesser,
     dunkles Grau mit weisser, fetter Schrift (analog zu den LS/PT-Kacheln),
     damit sich der wichtigste Button der Startseite klar abhebt. */
  .btn-uebersicht{
    background:#3f4753; border-color:#3f4753; color:#fff;
    padding:26px 16px; font-size:19px; font-weight:700;
  }
  /* FIX: vorheriges Dunkelmodus-Hintergrund (#1c212a) war fast identisch mit
     dem Seiten-Hintergrund (--bg:#1b2028 im Dunkelmodus) -- der Button
     verschwand dadurch optisch fast vollständig. Deutlich hellerer Ton mit
     sichtbarem Rand, damit er sich klar abhebt (wie im Hellmodus gewollt). */
  body.dunkel .btn-uebersicht{background:#454e5c; color:#fff; border-color:#5a6472;}
  .btn-uebersicht .unter{color:#fff; opacity:.85; font-weight:400;}
  /* Abstand zum naechsten Element (Sync-Box) ebenfalls auf 14px vereinheit­
     licht statt der allgemeinen .btn-sekundaer-Regel (10px). */
  .btn-uebersicht{margin-bottom:14px;}
  .btn-export{border-color:#e8a33d; color:#7a4a00; background:#fff4e5;}
  body.dunkel .btn-export{background:#3a2c10; color:#f0c98a; border-color:#c78a2e;}
  .btn-import{border-color:#3d8ee8; color:#00427a; background:#e5f1ff;}
  body.dunkel .btn-import{background:#10263a; color:#8ac2f0; border-color:#2e6ec7;}
  /* Sync-Button: ROT (auffällig) in jedem Zustand, in dem gerade KEINE
     aktive Verbindung besteht -- egal ob noch nie eingerichtet, Berechtigung
     abgelaufen, oder gar nicht unterstützt; GRÜN nur wenn wirklich verbunden. */
  .btn-sync.sync-rot{border-color:#d64545; color:#a01e1e; background:#fdeaea;}
  body.dunkel .btn-sync.sync-rot{background:#3a1414; color:#f0a3a3; border-color:#b23a3a;}
  .btn-sync.sync-verbunden{border-color:#3ba55c; color:#1e6b37; background:#e6f7ea;}
  body.dunkel .btn-sync.sync-verbunden{background:#123a1f; color:#8fd9a8; border-color:#2e8a4c;}
  /* Export/Import/Sync nebeneinander als gleich breite, wieder near-quadra­
     tische Buttons (wie ursprünglich) -- die einzelnen .btn-sekundaer-Regeln
     (width:100% etc.) bleiben dabei unveraendert, nur die Anordnung wird per
     Flex-Reihe ueberschrieben. Kompaktere Schrift/Abstände als der normale
     .btn-sekundaer, damit die Buttons trotz Titel+Untertext nicht in die
     Länge gezogen werden. */
  .datensicherung-reihe{display:flex; gap:8px; align-items:stretch;}
  /* KORREKTUR (Rueckmeldung): "schmaler" war als Hoehe gemeint, nicht
     Breite -- Breite/Innenabstand links-rechts zurueckgesetzt, dafuer
     Innenabstand oben/unten reduziert (10px -> 6px). */
  .datensicherung-reihe .btn-sekundaer{
    flex:1; margin-bottom:0; padding:6px 8px;
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    text-align:center; font-size:13.5px;
  }
  .datensicherung-reihe .icon-pfeil{display:block; font-size:16px; margin-bottom:2px;}
  /* Feste (aber knappe) Mindesthöhe für Titel und Untertext: die Texte
     ändern sich je nach Sync-Status unterschiedlich lang ("Sync
     einrichten" vs. "Verbunden") -- ohne das würde die ganze Reihe (alle
     3 Buttons gleich hoch) beim Verbinden sichtbar "springen". Die Texte
     wurden bewusst kurz gehalten, damit hier nur 1-2 Zeilen reserviert
     werden müssen statt eines hohen, lang gezogenen Buttons.
     Mindesthöhen (Rueckmeldung "schmaler in der Höhe") reduziert. */
  .datensicherung-reihe .btn-sekundaer .btn-titel{display:block; min-height:26px; font-weight:700;}
  .datensicherung-reihe .btn-sekundaer .unter{min-height:22px; font-size:11px;}
  /* Die 3 Speicher-Buttons stecken jetzt in einer eigenen, klar abgetrennten
     Box mit Überschrift "Sync" (wie die Boxen "Excel-Dateien öffnen" /
     "Werkzeuge" weiter unten) -- vorher standen sie unbeschriftet direkt
     unter der Rechnungsübersicht und wirkten optisch dazugehörig. */
  .sync-box .datensicherung-reihe{margin-bottom:6px;}
  /* "Excel-Dateien öffnen" und "Werkzeuge": je 2 Buttons nebeneinander
     (statt untereinander), wieder als groessere Karte (Icon oben, Titel +
     Untertext) -- auf Nutzerwunsch zurueck vom kompakten einzeiligen Design.
     Die dezente Icon-Farbe zieht jetzt ueber den GANZEN Button (nicht nur
     das kleine Badge): .btn-icon-blau/-rot/-grau faerben den Button-
     Hintergrund leicht ein, das Icon selbst sitzt gross in einem weissen
     Kreis-Badge darauf. */
  /* KORREKTUR (Rückmeldung: Abstand unterhalb der Buttons zu klein):
     .abschnitt selbst hat nur 4px Padding unten (siehe .abschnitt-Regel) --
     die Sync-Box gleicht das schon mit einem eigenen margin-bottom auf ihrer
     Button-Reihe aus (.sync-box .datensicherung-reihe oben), hier bisher
     aber gefehlt. Gleicher Wert wie dort, damit alle Boxen einheitlich
     wirken. */
  /* KORREKTUR (Rueckmeldung: unterer Abstand zu den Buttons soll gleich dem
     oberen sein): oberer Abstand (Trennlinie -> Buttons) betraegt 14px
     (.trennlinie margin-bottom). Unterer Abstand (Buttons -> Boxrand) war
     bisher nur 4px (.abschnitt Padding unten) + 6px (hier) = 10px --
     margin-bottom hier auf 10px erhoeht, damit zusammen mit dem
     .abschnitt-Padding ebenfalls 14px herauskommen. */
  /* KORREKTUR (Rueckmeldung: Abstand zwischen den Buttons in "Excel-Dateien
     oeffnen"/"Werkzeuge" soll exakt so gross sein wie zwischen den LS/PT-
     Kacheln oben) -- von 8px auf denselben Wert wie .kachelreihe (12px)
     angeglichen. */
  .icon-buttons-2{display:flex; gap:12px; margin-bottom:10px;}
  .icon-buttons-2 .btn-icon{
    flex:1; margin-bottom:0; padding:18px 10px 14px;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    text-align:center; font-size:13.5px; border-radius:12px;
  }
  .btn-icon-symbol{
    display:flex; align-items:center; justify-content:center;
    width:58px; height:58px; border-radius:16px; flex-shrink:0;
    background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.15); font-size:34px;
  }
  body.dunkel .btn-icon-symbol{background:#1b2028;}
  /* Grauer Standard-Ton wie die PC-Icons AUSSERHALB des optionalen
     Buntmodus (.zahnrad dort: #eef1f6 hell / #2a3140 dunkel) -- Fahrtenbuch
     und Rechnungsübersicht bleiben hier bewusst neutral statt fest
     eingefärbt, damit Handy und PC im Normalzustand gleich aussehen. */
  .btn-icon.btn-icon-grau{background:#eef1f6; border-color:#dde2ea;}
  /* KORREKTUR (Rueckmeldung: Buttons von "Excel-Dateien oeffnen" heben sich
     im Dunkelmodus zu wenig vom Karten-Hintergrund ab): vorheriger Ton
     (#232936) lag fast auf demselben Grauwert wie --karte (#242b36) im
     Dunkelmodus -- kaum Kontrast. Deutlich helleres Grau + sichtbarerer
     Rand, damit die Buttons als eigene Flaeche erkennbar bleiben (wie im
     Hellmodus, wo sie sich klar vom weissen Kartenhintergrund abheben). */
  body.dunkel .btn-icon.btn-icon-grau{background:#333e4f; border-color:#4a5772;}
  /* Luftlinie: dezentes Blau ueber den ganzen Button (statt nur das
     Icon-Badge), Apotheke: sanftes Rot -- wie gewuenscht. */
  .btn-icon.btn-icon-blau{background:#eaf1fb; border-color:#cfe0f7;}
  body.dunkel .btn-icon.btn-icon-blau{background:#16243a; border-color:#274469;}
  .btn-icon.btn-icon-rot{background:#fdeaea; border-color:#f3d3d3;}
  body.dunkel .btn-icon.btn-icon-rot{background:#3a1717; border-color:#5c2828;}
  .icon-buttons-2 .btn-icon .btn-titel{display:block; font-weight:700; font-size:14.5px; line-height:1.25;}
  .icon-buttons-2 .btn-icon .unter{font-size:11.5px; margin-top:0;}
  /* Startseite: einheitlicher vertikaler Abstand zwischen allen Boxen
     ("Sync", "Excel-Dateien öffnen", "Werkzeuge") -- orientiert am Abstand
     der Kacheln zum Rand (14px, main-Padding), statt bisher uneinheit­
     licher 20/22/24px-Werte. Ersetzt fuer diese Boxen das allgemeine
     .abschnitt-margin-bottom (24px). */
  .abschnitt.start-abschnitt{margin-top:0; margin-bottom:14px;}
  /* "Lokale Rechnungen" + "Rechnungsverwaltung" nebeneinander statt
     untereinander -- die einzelne .btn-uebersicht-Regel (Padding/Schrift­
     größe) bleibt unveraendert, nur margin-bottom wandert auf die
     gemeinsame Zeile, damit beide exakt gleich hoch bleiben (flex
     align-items:stretch, Standardverhalten). */
  .uebersicht-reihe{display:flex; gap:12px; margin-bottom:14px; align-items:stretch;}
  .uebersicht-reihe .btn-uebersicht{flex:1; min-width:0; margin-bottom:0;}
  /* "Rechnungsverwaltung" ist jetzt immer sichtbar, aber ohne aktive
     OneDrive-Anmeldung ausgegraut statt komplett zu verschwinden -- Klick
     bleibt moeglich und fuehrt direkt zur Anmeldung (siehe Wiring).
     KORREKTUR (Rückmeldung: Grauton zu kräftig, wirkte nicht "inaktiv"):
     statt einer alternativen kräftigen Grau-Farbe jetzt einfach die normale
     dunkle .btn-uebersicht-Optik stark abgeblendet (opacity), genau wie
     deaktivierte Buttons an anderer Stelle in der App (z.B.
     .aktionen-buttons button:disabled) -- liest sich damit eindeutig als
     "inaktiv", statt wie eine zweite, ebenso kräftige Farbvariante. */
  .btn-uebersicht.deaktiviert{opacity:.25;}

  /* Jeder Formularabschnitt bekommt eine eigene "Karte" mit Rand und
     Hintergrund -- deutlich klarere optische Trennung als vorher nur mit
     einer kleinen Textzeile. */
  .abschnitt{
    background:var(--karte); border:1px solid var(--rand); border-radius:12px;
    padding:14px 14px 4px; margin-bottom:24px; box-shadow:0 1px 3px rgba(0,0,0,.05);
  }
  .abschnitt .feld:last-child{margin-bottom:4px;}
  /* WICHTIG (Korrektur): eine allgemeine ".abschnitt > :last-child"-Regel
     traf hier ungewollt auch Abschnitte, die GAR KEIN Problem hatten (z.B.
     "Excel-Dateien öffnen"/"Werkzeuge" auf der Startseite, deren Buttons
     als .btn-sekundaer bereits eigenes margin-bottom mitbringen) -- die
     wurden dadurch unnötig länger. Stattdessen jetzt gezielt nur dort, wo es
     tatsächlich fehlt (kein eigenes margin-bottom vorhanden): der
     .btn-primaer-Button im "Sync-Ordner"-Bereich der Einstellungen (siehe
     autoSyncAbschnittHtml) sowie die Ergebnis-Box im Luftlinien-Tool
     (siehe .luft-ergebnis unten). */
  .abschnitt > .btn-primaer:last-child{margin-bottom:14px;}
  /* Die beiden Sync-Wege (Microsoft/OneDrive, Ordner-Sync) stecken auf
     Nutzerwunsch in EINER gemeinsamen Box statt zwei getrennten -- eigene
     Unter-Überschriften trennen sie optisch weiterhin voneinander. */
  .sync-unter-titel{font-size:13px; font-weight:700; margin-bottom:6px;}
  .sync-empfehlung{font-weight:400; color:var(--text-schwach); font-size:11.5px; text-transform:none;}
  .sync-trenner{border-top:1px solid var(--rand); margin:16px 0 14px;}
  .trennlinie{
    font-size:12.5px; font-weight:700; color:#fff; margin:-14px -14px 14px;
    text-transform:uppercase; letter-spacing:.04em; background:var(--titelfarbe);
    padding:9px 14px; border-radius:11px 11px 0 0;
  }
  .maske.pt .abschnitt .trennlinie{background:var(--pt-farbe);}
  .maske.ls .abschnitt .trennlinie{background:var(--ls-farbe);}
  .feld{margin-bottom:12px;}
  .feld label{display:block; font-size:12.5px; color:var(--text-schwach); margin-bottom:3px;}
  .feld input, .feld select, .feld textarea{
    width:100%; padding:10px 11px; border:1px solid var(--rand); border-radius:8px;
    font-size:15px; background:var(--karte); color:var(--text);
  }
  .feld input.grau{background:var(--grau-feld);}
  .feld input:focus, .feld select:focus{outline:2px solid var(--ls-farbe); outline-offset:0;}
  .maske.pt .feld input:focus, .maske.pt .feld select:focus{outline-color:var(--pt-farbe);}
  /* Beim Klick auf "Speichern" fehlende Pflichtfelder rot umranden --
     deutlicher als nur der Text im Hinweisbanner oben, besonders bei
     längeren Masken, wo das fehlende Feld weit unten stehen kann. */
  .feld input.pflichtfeld-fehlt{border:2px solid var(--fehler);}
  /* Gleiche rote Markierung auch für Pflicht-"Felder", die kein <input> in
     einem .feld-Wrapper sind -- z.B. der "Rechnungspositionen auswählen"-
     Button, wenn noch keine Position gewählt wurde. */
  .btn-primaer.pflichtfeld-fehlt{border:2px solid var(--fehler) !important;}
  .warnhinweis{
    background:var(--warnung-bg); border:1px solid var(--warnung-rand); color:var(--warnung-text);
    border-radius:8px; padding:9px 11px; font-size:13px; margin-top:6px; display:none;
  }
  .warnhinweis.aktiv{display:block;}
  .versteckt{display:none;}
  .warnhinweis .aktionen{margin-top:8px; display:flex; gap:8px;}
  .warnhinweis button{
    border:1px solid var(--warnung-rand); background:transparent; color:var(--warnung-text);
    border-radius:6px; padding:6px 10px; font-size:12.5px; cursor:pointer;
  }
  .autocomplete-liste{
    border:1px solid var(--rand); border-top:3px solid var(--ls-farbe); border-radius:8px; background:var(--karte);
    max-height:160px; overflow-y:auto; display:none; margin-top:6px; margin-bottom:12px;
    box-shadow:0 2px 6px rgba(0,0,0,.08);
  }
  /* Die farbige Linie markiert deutlich den oberen Rand des scrollbaren
     Vorschlagsbereichs (statt wie vorher unauffaellig in Randfarbe) --
     Farbe je nach Maske (ls/pt), analog zu den Abschnitts-Trennlinien. */
  .maske.pt .autocomplete-liste{border-top-color:var(--pt-farbe);}
  .autocomplete-liste.aktiv{display:block;}
  .autocomplete-liste div{padding:9px 11px; font-size:14px; border-bottom:1px solid var(--rand); cursor:pointer;}
  .autocomplete-liste div:last-child{border-bottom:none;}
  /* Freitext-Diagnose-Option optisch von den echten Katalog-Treffern
     absetzen (kursiv + Akzentfarbe), damit klar ist, dass das kein
     ICD-Katalogeintrag ist, sondern der frei eingetippte Text. */
  .autocomplete-liste div.diag-freitext{font-style:italic; color:var(--pt-farbe); font-weight:600;}
  .btn-primaer{
    background:var(--ls-farbe); color:#fff; border:none; border-radius:10px; padding:14px;
    font-size:15px; font-weight:600; width:100%; margin-top:6px; cursor:pointer;
  }
  /* Bewusst UNDURCHSICHTIGER Hintergrund (statt transparent): ein
     transparenter Hintergrund liess Android-Chrome (Force-Dark-Heuristik)
     gelegentlich auch die Textfarbe umfaerben, wodurch der Button auf
     manchen Geraeten wie unbeschriftet wirkte. */
  .btn-primaer.blass{background:var(--karte); color:var(--ls-farbe); font-weight:600; border:2px solid var(--ls-farbe);}
  .maske.pt .btn-primaer{background:var(--pt-farbe);}
  /* WICHTIG: ".maske.pt .btn-primaer" (3 Klassen-Selektoren) ist
     spezifischer als ".btn-primaer.blass" (2 Klassen-Selektoren) und hätte
     sonst dessen Hintergrundfarbe überschrieben -- das war der tatsächliche
     Grund für den "Aus Zwischenablage"-Button ohne sichtbare Beschriftung
     in der Privatrechnung-Maske: grüne Schrift auf grünem statt weißem
     Hintergrund. Hintergrund hier deshalb explizit erneut setzen. */
  .maske.pt .btn-primaer.blass{background:var(--karte); color:var(--pt-farbe); border-color:var(--pt-farbe);}
  .btn-primaer.blass .unter{display:block; font-size:12px; margin-top:2px; font-weight:400; opacity:.85;}
  /* "Aus Zwischenablage einfügen" (Luftlinie-Tool): kleines Karten-Icon
     LINKS neben dem Button, als eigenes Element (nicht im Button-Text) --
     eigenes, generisches Symbol (derselbe Pin-Umriss wie der blaue Pin im
     Luftlinie-Icon, nur rot) statt des original markenrechtlich
     geschuetzten Google-Maps-Logos (gleiche Ueberlegung wie beim
     Apotheken-Symbol weiter oben). Blauer Rahmen umrandet das GANZE
     Icon-Badge, Klick darauf oeffnet Maps mit der eingetragenen Adresse
     (siehe Wiring). align-items:stretch + aspect-ratio:1/1 (statt fester
     Pixelmasse) -- Badge passt sich dadurch automatisch der tatsaechlichen
     Hoehe des Buttons daneben an, bleibt aber quadratisch. */
  .luft-zwischenablage-reihe{display:flex; align-items:stretch; gap:10px; margin-bottom:16px;}
  .luft-zwischenablage-reihe .btn-primaer{margin-bottom:0; margin-top:0; flex:1;}
  .luft-maps-icon{
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    aspect-ratio:1/1; height:auto; border-radius:12px; background:#eaf1fb;
    border:2px solid #2f6fed; box-shadow:0 1px 3px rgba(0,0,0,.15); cursor:pointer;
  }
  body.dunkel .luft-maps-icon{background:#16243a;}
  /* "Sterbeort abweichend?" sitzt wie am PC (btnSterbeAbw: gleiche Zeile wie
     "PLZ + Stadt", rechtsbuendig, kompakte Schaltflaeche) rechts NEBEN dem
     PLZ/Ort-Feld statt als eigene volle Zeile darunter. */
  .feld-zeile-mit-btn{display:flex; gap:8px; align-items:flex-end;}
  .feld-zeile-mit-btn .feld{flex:1; margin-bottom:12px;}
  /* Ergebnis-Ausgabe "Luftlinie berechnen" (Startseite -> Werkzeuge) --
     bewusst deutlich groesser/auffaelliger als eine normale .warnhinweis:
     das Ergebnis IST der Zweck dieses Werkzeugs, und auf dem sonst recht
     leeren Bildschirm ist genug Platz dafuer. */
  .luft-ergebnis{
    display:none; margin-top:18px; margin-bottom:20px; padding:16px 18px; border-radius:12px;
    background:var(--karte); border:2px solid var(--ls-farbe);
  }
  .luft-ergebnis.aktiv{display:block;}
  .luft-ergebnis-zeile{font-size:20px; font-weight:700; color:var(--text); margin-bottom:8px; line-height:1.35;}
  .luft-ergebnis-zeile:last-child{margin-bottom:0;}
  .luft-ergebnis-zeile strong{font-weight:700;}
  .luft-ergebnis-hinweis{font-size:14px; font-weight:400; color:var(--text-schwach);}
  .luft-ergebnis.fehler{
    border-color:var(--warnung-rand); background:var(--warnung-bg);
    font-size:14px; font-weight:400; color:var(--warnung-text);
  }
  .luft-ergebnis.fehler .luft-ergebnis-zeile{font-size:14px; font-weight:400; color:var(--warnung-text);}
  .btn-inline-blass{
    flex:0 0 auto; margin-bottom:12px; padding:10px 12px; font-size:12.5px; font-weight:600;
    border-radius:8px; background:var(--karte); border:1.5px solid var(--ls-farbe); color:var(--ls-farbe);
    cursor:pointer; white-space:nowrap;
  }
  /* "Aus Zwischenablage einlesen" steht direkt unter der Abschnitt-Titelzeile
     (trennlinie) -- deren eigener unterer Rand liefert bereits 14px Abstand
     nach oben; der Button-Standard-Rand (margin-top:6px) addierte sich
     bisher noch obendrauf, waehrend nach unten gar kein Rand gesetzt war --
     dadurch wirkte der Button spuerbar zu tief/asymmetrisch platziert.
     Hier bewusst gleicher Abstand (14px) ober- und unterhalb. */
  .trennlinie + .btn-primaer.blass{margin-top:0; margin-bottom:14px;}
  /* Der Hinweis zum Zwischenablage-Import (erkannter Sterbezeitpunkt etc.)
     folgt direkt auf den Button oben -- dessen eigener unterer Rand (14px)
     reicht als Abstand bereits aus. Der normale warnhinweis-margin-top
     (6px) addierte sich bisher zusaetzlich dazu und wirkte im Vergleich zum
     sonstigen 12px-Rhythmus zwischen den Feldern spuerbar zu groß.
     NACH UNTEN fehlte dagegen JEDER Abstand: anders als ein normaler
     warnhinweis (der innerhalb eines .feld sitzt und dessen 12px
     margin-bottom den Abstand zum naechsten Feld liefert) steht dieser
     Hinweis freistehend direkt vor dem "Nachname, Vorname"-Feld -- ohne
     eigenen unteren Rand stieß die Box direkt an das Feld/Label darunter.
     Jetzt mit demselben 12px-Rhythmus wie zwischen den uebrigen Feldern. */
  #zwischenablageHinweis{margin-top:0; margin-bottom:12px;}
  .streckeninfo{font-size:12.5px; color:var(--text-schwach); margin-top:4px; min-height:16px;}
  /* Solange noch keine Strecke berechnet wurde, ist streckeninfo leer -- die
     feste Mindesthoehe sorgte dann trotzdem fuer einen spuerbar zu grossen
     Abstand zwischen dem km-Feld und dem Alternativrouten-Button darunter.
     Im leeren Zustand daher keinen Platz reservieren. */
  .streckeninfo:empty{margin-top:0; min-height:0;}
  /* Analog zur PC-Maske (KmBerechnen/RoutenAnzeigen: eine "Fahrstrecke i"-
     Schaltflaeche je Routenalternative + separate "Google Maps"-Schaltflaeche
     zum Pruefen/Oeffnen der Route). In der Mobil-Maske dafuer 2 feste
     Buttons statt dynamisch erzeugter PC-Buttons: "Alternativrouten" oeffnet
     eine Auswahlliste (routenoptionen), "Google Maps Route" oeffnet direkt
     die Google-Maps-App/-Webseite mit der Strecke. */
  .route-btn-reihe{display:flex; gap:8px; margin-top:10px; margin-bottom:12px;}
  .route-btn-reihe button{
    flex:1; padding:10px 6px; font-size:12.5px; font-weight:600; border-radius:8px;
    background:var(--karte); cursor:pointer; border:1.5px solid var(--ls-farbe); color:var(--ls-farbe);
  }
  .maske.pt .route-btn-reihe button{border-color:var(--pt-farbe); color:var(--pt-farbe);}
  .routenoptionen{margin-top:8px; display:none;}
  .routenoptionen.aktiv{display:block;}
  .routenoptionen button{
    display:block; width:100%; text-align:left; padding:10px 11px; margin-bottom:6px;
    border:1px solid var(--rand); border-radius:8px; background:var(--grau-feld); color:var(--text);
    font-size:13px; cursor:pointer;
  }
  .routenoptionen .routenoptionen-hinweis{font-size:12.5px; color:var(--text-schwach); padding:2px 2px 6px;}
  /* Kurzer Einblend-Hinweis fuer die Handy-"Zurück"-Taste (z.B. "nochmal
     zurück zum Beenden") -- liegt AUSSERHALB von #app, damit er einen
     Ansichtswechsel (app.innerHTML wird komplett neu geschrieben) übersteht. */
  .app-toast{
    position:fixed; left:16px; right:16px; bottom:18px; z-index:50;
    background:var(--text); color:var(--karte); font-size:13.5px; text-align:center;
    padding:11px 16px; border-radius:10px; box-shadow:0 2px 10px rgba(0,0,0,.25);
    opacity:0; pointer-events:none; transform:translateY(6px);
    transition:opacity .18s, transform .18s;
  }
  .app-toast.aktiv{opacity:.95; transform:translateY(0);}
  .fall-zeile{
    background:var(--karte); border:1px solid var(--rand); border-left:4px solid var(--rand); border-radius:10px; padding:12px 14px;
    margin-bottom:8px; cursor:pointer; display:flex; align-items:flex-start; gap:10px;
  }
  .fall-zeile .chk{width:20px; height:20px; flex-shrink:0; margin-top:2px;}
  .fall-zeile .inhalt{flex:1; min-width:0;}
  /* Auswahlleiste oben in der Rechnungsübersicht: sticky direkt unter der
     Kopfzeile, damit "Löschen"/"Kopieren" auch bei langen Listen immer
     erreichbar sind, ohne erst hochscrollen zu müssen. */
  .auswahlleiste{
    position:sticky; top:0; z-index:5; background:var(--bg); padding:10px 0 12px;
    margin:-14px -14px 14px; padding-left:14px; padding-right:14px;
    border-bottom:1px solid var(--rand);
  }
  /* Reihenfolge auf Nutzerwunsch getauscht: "Alle auswählen" steht jetzt
     UNTER den Buttons statt darüber -- deshalb jetzt margin-TOP statt
     -bottom, damit weiterhin ein Abstand zu den Buttons darüber besteht. */
  .auswahlleiste .zeile1{display:flex; align-items:center; gap:8px; font-size:13.5px; margin-top:10px;}
  .auswahlleiste .zeile1 label{display:flex; align-items:center; gap:6px; cursor:pointer;}
  .auswahlleiste .aktionen-reihe{display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end;}
  /* KORREKTUR (Rueckmeldung): "Ausgewaehlte loeschen" wich in der Groesse
     von den beiden Buttons daneben ab -- Ursache war min-width:110px in
     Kombination mit flex-wrap: je nach Bildschirmbreite wanderte mal dieser,
     mal ein anderer Button allein in eine neue Zeile und wurde dort, da
     flex:1 ohne Geschwister, auf die volle Zeilenbreite gestreckt. Die 3
     Buttons stecken jetzt (analog .datensicherung-reihe) in einem eigenen,
     NICHT umbrechenden Flex-Container -- dadurch bleiben sie immer exakt
     gleich breit in einer Zeile, unabhaengig von der Bildschirmbreite. Nur
     das separate "Letzte Nr."-Feld (rn-mini) darf bei Bedarf weiterhin in
     eine eigene Zeile umbrechen (siehe .aktionen-reihe selbst, weiterhin
     flex-wrap:wrap). */
  .auswahlleiste .aktionen-buttons{display:flex; gap:8px; flex:1 1 100%; align-items:stretch;}
  .auswahlleiste .aktionen-buttons button{
    flex:1; min-width:0; min-height:46px; padding:9px 6px; font-size:12px; font-weight:600;
    border-radius:8px; line-height:1.2;
    background:var(--karte); cursor:pointer; border:1.5px solid var(--rand); color:var(--text);
  }
  .auswahlleiste .aktionen-buttons button:disabled{opacity:.45; cursor:default;}
  .auswahlleiste .aktionen-buttons button.gefahr{border-color:var(--fehler); color:var(--fehler);}
  .auswahlleiste .aktionen-buttons button.betont{border-color:var(--ls-farbe); color:var(--ls-farbe);}
  /* "Letzte Rechnungsnummer" -- auf Nutzerwunsch zusaetzlich ganz rechts bei
     den Buttons der Rechnungsuebersicht anzeig- und bearbeitbar (bisher nur
     in den Einstellungen). "margin-left:auto" schiebt es innerhalb der
     Button-Reihe (bzw. bei Zeilenumbruch: innerhalb der eigenen Zeile) ganz
     nach rechts. Dieselbe Wiring-Logik wie in den Einstellungen, siehe
     rnLetzteFeldEinrichten(). */
  .auswahlleiste .aktionen-reihe .rn-mini{
    flex:0 0 auto; margin-left:auto; display:flex; flex-direction:column; align-items:center; gap:3px;
  }
  .auswahlleiste .aktionen-reihe .rn-mini label{font-size:10.5px; color:var(--text-schwach); white-space:nowrap;}
  .auswahlleiste .aktionen-reihe .rn-mini input{
    width:60px; padding:7px 4px; font-size:13px; text-align:center; border:1.5px solid var(--rand);
    border-radius:8px; background:var(--karte); color:var(--text);
  }
  /* Farbcode wie in der Maske selbst: LS/PT-Fälle in "Rechnung korrigieren"
     bekommen denselben Rand-/Badge-Farbton wie ihre Bearbeitungsmaske
     (ls-farbe/pt-farbe), statt alle Fälle mit derselben neutralen Farbe
     anzuzeigen -- so ist auf einen Blick erkennbar, um welche Art Rechnung
     es sich handelt, bevor man zum Bearbeiten hineintippt. */
  .fall-zeile.ls{border-left-color:var(--ls-farbe);}
  .fall-zeile.pt{border-left-color:var(--pt-farbe);}
  .fall-zeile .name{font-weight:600;}
  .fall-zeile .info{font-size:12.5px; color:var(--text-schwach); margin-top:2px;}
  /* KORREKTUR (Rueckmeldung "Backup Ansicht seltsam"): die Backup-Zeilen
     nutzen .fall-zeile (display:flex) mit dem "Wiederherstellen"-Button aus
     .btn-sekundaer -- die dort geerbten "display:block; width:100%"
     wurden als flex-basis:100% interpretiert, wodurch der Button fast die
     GANZE Zeile beanspruchte und .inhalt (min-width:0) auf eine winzige
     Spalte zusammengequetscht wurde (Datum/Anzahl wirkten dadurch
     abgeschnitten/umgebrochen, hinter dem Button verschwindend). Hier
     gezielt auf Inhaltsbreite zurueckgesetzt, damit der Button rechts nur
     so breit wie sein Text ist und .inhalt links den Rest der Zeile
     bekommt. */
  .fall-zeile .btn-backup-wiederherstellen{
    display:block; width:auto; flex:0 0 auto; margin-bottom:0;
    padding:10px 14px; font-size:13.5px; white-space:nowrap; align-self:center;
  }
  /* NUTZERWUNSCH: Backup-Zeile antippen klappt die enthaltenen Rechnungen
     (LS+PT) darunter auf. Der Abstand zwischen Eintraegen sitzt jetzt am
     Wrapper statt an .fall-zeile selbst, damit Zeile + aufgeklapptes Panel
     optisch als EIN Block zusammengehoeren. */
  .backup-eintrag-wrapper{margin-bottom:8px;}
  .backup-eintrag-wrapper .backup-zeile{margin-bottom:0;}
  .backup-rechnungen{
    margin:0 0 2px 4px; padding:4px 0 4px 12px; border-left:2px solid var(--rand);
  }
  .backup-rechnung-zeile{
    display:flex; align-items:center; gap:8px; padding:6px 0; font-size:13px;
    border-bottom:1px solid var(--rand);
  }
  /* Zweiter "Wiederherstellen"-Button unten im aufgeklappten Panel (NUTZER-
     WUNSCH: Wiederherstellen soll auch im ausgeklappten Zustand moeglich
     sein, ohne erst wieder zuklappen zu muessen) -- hier normale Blockbreite
     (kein Flex-Kontext wie beim oberen Button), nur etwas Abstand nach oben. */
  .backup-rechnungen .btn-backup-wiederherstellen{margin-top:8px;}
  .backup-rechnung-zeile:last-child{border-bottom:none;}
  .backup-rechnung-zeile .name{
    font-weight:600; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .backup-rechnung-zeile .info{font-size:11.5px; color:var(--text-schwach); white-space:nowrap;}
  .renu-reset{text-decoration:underline dotted; text-underline-offset:2px; cursor:pointer;}
  .einstellung-zeile{
    display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--rand); cursor:pointer;
  }
  .einstellung-zeile input{width:20px; height:20px; flex-shrink:0;}
  .einstellung-zeile .txt{font-size:14.5px;}
  .einstellung-zeile .txt .hinweis{display:block; font-size:12px; color:var(--text-schwach);}
  .leer-hinweis{text-align:center; color:var(--text-schwach); font-size:14px; padding:30px 10px;}

  /* Fahrdienst-Auswertung (Werkzeug "Fahrtenbuch öffnen") -- Diensttage-
     Tabelle + nach Quartal/Arzt gruppierte Karten, analog zur gleichnamigen
     Ansicht in der HTA am PC (reine Anzeige, kein Zurückschreiben von hier
     aus möglich). */
  .fahrdienst-tabelle{width:100%; border-collapse:collapse; font-size:12px;}
  .fahrdienst-tabelle th{background:var(--rand); padding:5px 6px; text-align:left; white-space:nowrap;}
  .fahrdienst-tabelle td{padding:4px 6px; border-bottom:1px solid var(--rand); white-space:nowrap;}
  .fahrdienst-quartal-titel{font-size:15px; font-weight:700; margin:18px 0 8px; color:var(--titelfarbe);}
  /* --titelfarbe ist ein dunkles Navyblau -- als Text auf der (im
     Dunkelmodus ebenfalls dunklen) Kartenfarbe kaum noch zu erkennen, anders
     als in der Kopfzeile, wo dieselbe Farbe als HELLER Hintergrund hinter
     weisser Schrift steht. Im Dunkelmodus deshalb ein helleres Blau. */
  body.dunkel .fahrdienst-quartal-titel{color:#8ac2f0;}
  .fahrdienst-arzt-karte{background:var(--karte); border:1px solid var(--rand); border-radius:10px; padding:10px 14px; margin-bottom:10px;}
  .fahrdienst-arzt-name{font-weight:700; font-size:14px; margin-bottom:4px;}
  .fahrdienst-arzt-karte ul{margin:4px 0 8px; padding-left:18px; font-size:13px;}
  .fahrdienst-arzt-summe{font-size:13px; color:var(--text-schwach);}
  /* Wie am PC (Rechnungsverwaltung): farbiges L/P-Badge VOR dem Namen statt
     ausgeschriebenem "LS"/"PT" dahinter -- gleiche Form/Groesse wie dort
     (18x18px, abgerundetes Quadrat, ein Buchstabe). */
  .badge-neu{display:inline-block; width:18px; height:18px; line-height:18px; text-align:center;
    background:var(--titelfarbe); color:#fff; font-size:11px; font-weight:bold; border-radius:4px;
    margin-right:8px; vertical-align:middle;}
  .badge-neu.ls{background:var(--ls-farbe);}
  .badge-neu.pt{background:var(--pt-farbe);}
  /* Versand-/PDF-Status, nur in der Rechnungsverwaltung (ansichtAlleRechnungen):
     Brief-Symbol = bereits versendet, Dokument-Symbol = PDF vorhanden und
     antippbar. Ein goldenes "S" ("bereits in der Übersicht vorhanden") gibt
     es bewusst nicht mehr: in "Lokale Rechnungen" ist jede verbleibende
     Zeile per Definition NOCH NICHT übernommen (sie verschwindet automatisch
     sobald doch, siehe lokaleFaelleBereitsUebernommenEntfernen), und in der
     Rechnungsverwaltung ist jede Zeile per Definition BEREITS übernommen --
     das "S" wäre in beiden Ansichten immer redundant gewesen. */
  /* Rechte Symbolspalte in der Rechnungsverwaltung (Brief/PDF/Warnsymbol):
     eigene Spalte statt inline neben dem Namen -- rechtsbuendig, vertikal
     zur ganzen Zeile (Name+Info) zentriert, Symbole deutlich groesser als
     vorher, damit sie auf einen Blick erfassbar sind. */
  .fall-zeile .fall-icons{
    flex-shrink:0; align-self:center; display:flex; align-items:center; justify-content:flex-end;
    gap:8px; min-width:30px;
  }
  .sync-status{margin-left:6px; white-space:nowrap;}
  .badge-brief{display:inline-block; font-size:28px; line-height:1; vertical-align:middle;}
  .badge-termin{display:inline-block; font-size:28px; line-height:1; vertical-align:middle; cursor:pointer;}
  .fall-zeile .info.termin-text{color:#b9770e; font-weight:600;}
  .badge-pdf{display:inline-block; font-size:28px; line-height:1; vertical-align:middle; cursor:pointer;}
  /* Fall steht zwar schon in der Rechnungsuebersicht (nur solche Zeilen
     zeigt die Rechnungsverwaltung ueberhaupt), aber die stille Erzeugung am
     PC konnte noch kein PDF dazu erstellen (Feld fehlt/Datum ungueltig/
     Betrag weicht ab/Jahr weicht ab/... -- siehe gStillModus in Modul1.bas).
     Name wird rot hervorgehoben UND rechts ein rotes Warnsymbol statt des
     Dokument-Symbols gezeigt (die beiden schliessen sich gegenseitig aus:
     entweder es gibt schon ein PDF zum Ansehen, oder der Fall braucht noch
     eine manuelle Korrektur -- nie beides). Korrektur wie gewohnt per
     Antippen der Zeile -> "Rechnung korrigieren" am PC. */
  .fall-zeile.unvollstaendig .name{color:var(--fehler);}
  .badge-unvollstaendig{display:inline-block; font-size:26px; line-height:1;
    color:var(--fehler); vertical-align:middle;}

  .position-zeile{display:flex; align-items:flex-start; gap:10px; padding:6px 0; border-bottom:1px solid var(--rand);}
  .position-zeile input{width:20px; height:20px; margin-top:1px; flex-shrink:0;}
  .position-zeile .haupt{flex:1; font-size:13.5px; line-height:1.25;}
  .position-zeile .ziffer{font-weight:600; color:var(--text-schwach); font-size:12px;}
  .position-zeile .betrag{font-weight:600; min-width:60px; text-align:right; font-size:14px;}
  /* Kompakter als vorher (18px/4px), damit die komplette Positionsliste
     eher auf einen Bildschirm passt -- v.a. bei mehreren Zwischenüberschriften
     summierte sich der alte Abstand deutlich auf. */
  .positionen-gruppe-titel{font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--text-schwach); margin:10px 0 2px;}
  .positionen-gruppe-titel:first-child{margin-top:0;}
  .auto-hinweis{font-weight:400; text-transform:none; letter-spacing:0; font-style:italic;}
  /* Automatik-Kategorien (Zeitzuschlag/Wegegeld/Reise) sind nicht manuell
     anwählbar -- optisch klar als gesperrt/ausgegraut erkennbar, analog zu
     einer durch Ausschluss gesperrten Position. */
  .position-zeile.auto-gesperrt{opacity:.55;}
  .position-zeile input:disabled{cursor:default;}
  .summenzeile{display:flex; justify-content:space-between; font-size:17px; font-weight:700; padding:10px 0; border-top:2px solid var(--rand); margin-top:6px;}

  .diag-chip{
    display:flex; align-items:flex-start; gap:8px; background:var(--grau-feld); border-radius:8px;
    padding:8px 10px; margin-bottom:8px;
  }
  .diag-chip .chip-text{flex:1; font-size:13.5px; line-height:1.35;}
  .diag-chip label{display:flex; align-items:center; gap:3px; font-size:12px; color:var(--text-schwach); white-space:nowrap;}
  .diag-chip input[type=checkbox]{width:16px; height:16px;}
  .diag-chip .chip-del{
    background:none; border:none; color:var(--fehler); font-size:16px; font-weight:700; cursor:pointer; padding:0 2px;
  }
</style>
</head>
<body>

<header>
  <button class="zurueck" id="btnZurueck" style="visibility:hidden">&#8592;</button>
  <h1 id="titel">Rechnungserfassung</h1>
  <div style="display:flex; align-items:center;">
    <button class="zahnrad" id="btnDunkelToggle" title="Dunkelmodus umschalten">&#9728;</button>
    <button class="zahnrad" id="btnEinstellungen">&#9881;</button>
  </div>
</header>

<main id="app"></main>
<div id="appToast" class="app-toast"></div>

<script>
/* ==========================================================
   Speicher / Grunddaten
   ========================================================== */
const LS = {
  get(k, fallback){ try{ const v = localStorage.getItem(k); return v===null? fallback : JSON.parse(v);}catch(e){return fallback;} },
  // KORREKTUR: Fehler beim Schreiben wurden bisher stumm verschluckt. Ist der
  // Speicher des Browsers voll (u.a. durch die bis zu 20 Sync-Backups, die
  // jeweils ALLE Faelle enthalten), ging eine neue/geaenderte Rechnung ohne
  // jeden Hinweis verloren. Jetzt: zuerst die aeltesten Backups opfern und
  // erneut versuchen; klappt es trotzdem nicht, deutlicher Hinweis.
  set(k, v){
    let text;
    try{ text = JSON.stringify(v); }catch(e){ return false; }
    for(let versuch=0; versuch<25; versuch++){
      try{ localStorage.setItem(k, text); return true; }
      catch(e){
        if(k === 'sync_backups') return false; // Backups sind verzichtbar
        let b = [];
        try{ b = JSON.parse(localStorage.getItem('sync_backups') || '[]'); }catch(_){ b = []; }
        if(!Array.isArray(b) || !b.length) break;
        b.pop(); // aeltestes Backup entfernen
        try{
          if(b.length) localStorage.setItem('sync_backups', JSON.stringify(b));
          else localStorage.removeItem('sync_backups');
        }catch(_){ try{ localStorage.removeItem('sync_backups'); }catch(__){} }
      }
    }
    if(String(k).indexOf('faelle_') === 0 || String(k).indexOf('katalog') >= 0){
      try{ alert('Achtung: Der Speicher dieser App ist voll -- die letzte \u00c4nderung konnte NICHT gespeichert werden.\n\nBitte jetzt synchronisieren bzw. exportieren und erledigte F\u00e4lle l\u00f6schen.'); }catch(_){}
    }
    return false;
  }
};
function ladeFaelle(art){ return LS.get('faelle_'+art, []); }
function speichereFaelle(art, arr){ if(typeof faelleMetaNachfuehren === 'function') faelleMetaNachfuehren(art, ladeFaelle(art), arr); LS.set('faelle_'+art, arr); synchronisiereAlle(); }

// Startbestückung des Bestatter-Katalogs (Stand PC-Liste). Wird nur EINMAL
// beim allerersten Aufruf eingespielt (Flag 'bestatter_katalog_seed_v1'),
// damit spätere Löschungen/Änderungen durch den Nutzer nicht immer wieder
// überschrieben werden.
const BESTATTER_STANDARD = [
  ["Berdon","Kaiserstraße 55","76437 Rastatt"],
  ["Bestattungshaus Im Ried","Oberdorfstraße 23","77974 Meißenheim"],
  ["Braunagel","Konrad-Adenauer-Straße 3A","76571 Gaggenau"],
  ["Ettenheim (Pflegeheim)","Münstertalstraße 19","77955 Ettenheim"],
  ["Finger Blank","Bierkellerstraße 6","77694 Kehl"],
  ["Geiger","Moltkestr. 27","77654 Offenburg"],
  ["Hassmann","Wörthstraße 15","77839 Lichtenau"],
  ["Heck","Hauptstraße 5","76571 Gaggenau"],
  ["Heidenreich","Weingartenstraße 74","77654 Offenburg"],
  ["Hüter","Kirschbaumallee 5","76448 Durmersheim"],
  ["Kiechle","Spießgasse 1","77694 Kehl"],
  ["Kiechle","Ebertplatz 19","77654 Offenburg"],
