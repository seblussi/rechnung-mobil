  const ruecksprungZiel = betaMaskeHerkunft==='gesamt' ? ()=> ansichtRechnungenGesamt() : (korrekturIdx!==undefined ? ansichtKorrigieren : ansichtStart);
  setzeTitel(art==='ls' ? 'Leichenschau' : 'Privatrechnung', zurueckAusMaske);
  let werte = {};
  let positionenAuswahl = null;
  // Wie am PC (gManuellModus): '' = automatisch (50-km-Regel entscheidet
  // Wegegeld vs. Reiseentschädigung), 'REISE' = Nutzer hat bewusst eine
  // Fahrstrecke-Kachel als Reiseentschädigung gewählt, 'LUFTLINIE' = Nutzer
  // hat bewusst die Luftlinie-Kachel gewählt (überspringt die 50-km-Regel).
  // Wird bei jeder automatischen Neuberechnung (kmAutomatikAusloesen) wieder
  // auf '' zurückgesetzt, genau wie am PC (KmBerechnen setzt gManuellModus
  // ebenfalls vor jeder Neuberechnung zurück).
  let manuellerModus = '';
  // Analog zu PC gKmGetippt: unterscheidet echtes Eintippen ins km-Feld
  // (löst beim Verlassen des Feldes die 25/50-km-Interpretation aus) von
  // einem programmatischen Setzen des Werts (Routenberechnung, Alternativ-
  // routen-Kachel, Fallwiederherstellung) -- Letzteres feuert kein 'input'.
  let kmManuellGetippt = false;
  let kmVorFokus = '';
  if(vorbelegt){
    werte = {...vorbelegt.werte};
    positionenAuswahl = vorbelegt.positionen || null;
  } else if(korrekturIdx!==undefined){
    const gespeichert = ladeFaelle(art)[korrekturIdx];
    werte = {...gespeichert.werte};
    positionenAuswahl = gespeichert.positionen ? betaSetMitDetails(gespeichert.positionen, gespeichert.positionsDetails, !!(gespeichert.hochgeladen || gespeichert.ausUebersicht || gespeichert.bezug)) : null;
  } else if(maskenEntwuerfe[art]){
    // Neu begonnene Rechnung: vorhandenen, noch nicht gespeicherten Entwurf
    // (siehe maskenEntwuerfe oben) wiederherstellen statt erneut die
    // Standard-Vorbelegung (heutiges Datum etc.) zu setzen -- genau das
    // ermoeglicht das gewuenschte Hin- und Herwechseln ohne Datenverlust.
    werte = {...maskenEntwuerfe[art].werte};
    positionenAuswahl = maskenEntwuerfe[art].positionen ? betaSetMitDetails(maskenEntwuerfe[art].positionen, maskenEntwuerfe[art].positionen.details, maskenEntwuerfe[art].positionen.legacy) : null;
  } else {
    // Vorbelegung wie am PC (RechnungsdatumVorbelegen: Rechnungsdatum =
    // naechster Werktag nach dem Datum der Todesbescheinigung/des
    // Hausbesuchs, das seinerseits mit dem heutigen Datum vorbelegt ist;
    // UserForm_Initialize: Sterbedatum bei LS ebenfalls mit heute vorbelegt).
    const heute = heuteAlsText();
    werte = {txtDatum: naechsterWerktagText(heute), txtDatumExcel: heute};
    if(art==='ls') werte.txtSterbedatum = heute;
  }
  // Mehrfach-Diagnosen (nur PT) -- analog zu gDiagnosen am PC: je Eintrag
  // {text:"Beschreibung [Code]", flags:"" / "G" / "V" / "GV"}.
  let diagnosen = Array.isArray(werte.diagnosen) ? werte.diagnosen.map(d=>({...d})) : [];

  const ctx = {
    setValue(name, val){ const el=document.getElementById(name); if(el) el.value = val; },
    getValue(name){ const el=document.getElementById(name); return el? el.value : ''; },
    hinweis(text){ alertBanner(text); },
    async adresseVerlassen(){ await plzOrtPruefen('txtPAdresse1','txtPAdresse2'); await kmAutomatikAusloesen(); },
    allePruefungenAusfuehren(){ alleChecksAusfuehren(); }
  };

  function feldHtml(labelText, name, opts={}){
    const val = werte[name] || '';
    const grauKlasse = opts.grau ? 'grau' : '';
    return `<div class="feld">
      <label for="${name}">${labelText}</label>
      <input type="text" id="${name}" class="${grauKlasse}" value="${val.replace(/"/g,'&quot;')}" placeholder="${opts.platzhalter||''}">
      <div class="warnhinweis" id="${name}_warn"></div>
    </div>`;
  }

  let html = `<div class="maske ${art}">`;
  // Jeder Abschnitt wird in eine eigene "Karte" (.abschnitt) gepackt, damit
  // die Bereiche der Maske optisch klar voneinander getrennt sind, statt
  // nur durch eine kleine Textzeile.
  const abschnitt = (titel, inhalt) => `<div class="abschnitt"><div class="trennlinie">${titel}</div>${inhalt}</div>`;

  if(art==='ls'){
    html += abschnitt('Todesfeststellung',
      feldHtml('Datum Todesbescheinigung', 'txtDatumExcel', {typ:'datum'}) +
      feldHtml('Zeitpunkt Leichenschau (HH:MM)', 'txtZeitLS'));
  } else {
    html += abschnitt('Hausbesuch',
      feldHtml('Datum Hausbesuch', 'txtDatumExcel', {typ:'datum'}) +
      feldHtml('Uhrzeit Hausbesuch (HH:MM)', 'txtZeitLS'));
  }

  html += abschnitt('Rechnungsstellung',
    feldHtml('Rechnungsdatum (Versanddatum)', 'txtDatum') +
    `<div class="feld"><label>Rechnungsbetrag (&euro;)</label>
      <input type="text" id="txtBetrag" class="grau" value="${werte.txtBetrag||''}" readonly></div>`);

  // Abweichender Sterbeort (nur LS): wie am PC standardmäßig eingeklappt,
  // aber automatisch aufgeklappt, wenn schon Werte dafür gespeichert sind
  // (z.B. beim erneuten Öffnen eines korrigierten Falls).
  const sterbeAbwOffen = art==='ls' && !!((werte.txtSterbeAdr1||'').trim() || (werte.txtSterbeAdr2||'').trim());

  html += abschnitt('Patient',
    `<button class="btn-primaer blass" id="btnZwischenablage">Aus Zwischenablage einlesen</button>` +
    `<div class="warnhinweis" id="zwischenablageHinweis"></div>` +
    feldHtml('Nachname, Vorname', 'txtName') +
    feldHtml(art==='ls' ? 'Straße + Hausnummer (Sterbeort)' : 'Straße + Hausnummer', 'txtPAdresse1') +
    (art==='ls' ? `
      <div class="feld-zeile-mit-btn">
        <div class="feld">
          <label for="txtPAdresse2">PLZ + Stadt (Sterbeort)</label>
          <input type="text" id="txtPAdresse2" value="${(werte.txtPAdresse2||'').replace(/"/g,'&quot;')}">
        </div>
        <button type="button" class="btn-inline-blass" id="btnSterbeAbw">
          <span id="btnSterbeAbwText">${sterbeAbwOffen ? 'Sterbeort abw. ✕' : 'Sterbeort abw.?'}</span>
        </button>
      </div>
      <div class="warnhinweis" id="txtPAdresse2_warn"></div>
      <div id="sterbeAbwFelder" class="${sterbeAbwOffen ? '' : 'versteckt'}">
        ${feldHtml('Straße + Hausnummer (Sterbeort, abw.)', 'txtSterbeAdr1')}
        ${feldHtml('PLZ + Stadt (Sterbeort, abw.)', 'txtSterbeAdr2')}
      </div>` : feldHtml('PLZ + Stadt', 'txtPAdresse2')) +
    feldHtml('Geburtsdatum (TT.MM.JJJJ)', 'txtGeda'));

  if(art==='ls'){
    html += abschnitt('Sterbedaten',
      feldHtml('Sterbedatum (TT.MM.JJJJ)', 'txtSterbedatum') +
      feldHtml('Sterbezeitpunkt (HH:MM)', 'txtTodeszeit'));
  } else {
    html += abschnitt('Diagnose (ICD-Suche)',
      `<div id="diagChips"></div>` +
      `<div class="feld" style="position:relative;">
        <label for="txtDiag">Diagnose suchen</label>
        <input type="text" id="txtDiag" autocomplete="off" placeholder="ab 2 Zeichen tippen...">
        <div class="autocomplete-liste" id="diagVorschlaege"></div>
      </div>`);
  }

  html += abschnitt('Routenberechnung',
    `<div class="feld"><label id="txtKm_label" for="txtKm">Strecke (Hin- und Rückfahrt)</label>
      <input type="text" id="txtKm" value="${(werte.txtKm||'')}" placeholder="wird automatisch berechnet">
      <input type="hidden" id="txtKmFahrstrecke" value="${(werte.txtKmFahrstrecke||werte.txtKm||'')}">
      <input type="hidden" id="txtKmLuftlinie" value="${(werte.txtKmLuftlinie||'')}">
      <div class="streckeninfo" id="streckeninfo"></div>
      <div class="warnhinweis" id="txtKm_warn"></div>
      <div class="route-btn-reihe">
        <button type="button" id="btnAlternativrouten">Alternativrouten</button>
        <button type="button" id="btnGoogleMapsRoute">Google Maps Route</button>
      </div>
      <div class="routenoptionen" id="routenoptionen"></div>
    </div>`);

  if(art==='ls'){
    html += abschnitt('Bestattungsunternehmen',
      `<div class="feld" style="position:relative;">
        <label for="txtBName">Name</label>
        <input type="text" id="txtBName" value="${(werte.txtBName||'').replace(/"/g,'&quot;')}" autocomplete="off">
        <div class="autocomplete-liste" id="bestatterVorschlaege"></div>
        <div class="warnhinweis" id="txtBName_warn"></div>
      </div>
      <div class="route-btn-reihe">
        <button type="button" id="btnBestatterMaps">Google Maps öffnen</button>
        <button type="button" id="btnBestatterAdresseEinlesen">Adresse einlesen</button>
      </div>
      <div class="warnhinweis" id="bestatterAdresseHinweis"></div>` +
      feldHtml('Straße + Hausnummer', 'txtAdresse1') +
      feldHtml('PLZ + Stadt', 'txtAdresse2'));
  }

  html += abschnitt('Rechnungspositionen',
    `<button class="btn-primaer blass" id="btnPunkte">Rechnungspositionen auswählen
      <span class="unter" id="punkteStatus">${positionenAuswahl? positionenAuswahl.size+' Position(en) ausgewählt' : 'noch nicht geprüft'}</span></button>`);

  html += `<div id="allgemeinerHinweis"></div>`;
  html += `<button class="btn-primaer" id="btnSpeichern">Speichern</button>`;
  html += `</div>`;

  app.innerHTML = html;

  const feldIds = art==='ls'
    ? ['txtDatumExcel','txtZeitLS','txtDatum','txtName','txtPAdresse1','txtPAdresse2','txtSterbeAdr1','txtSterbeAdr2','txtGeda','txtSterbedatum','txtTodeszeit','txtKm','txtKmFahrstrecke','txtKmLuftlinie','txtBName','txtAdresse1','txtAdresse2']
    : ['txtDatumExcel','txtZeitLS','txtDatum','txtName','txtPAdresse1','txtPAdresse2','txtGeda','txtKm','txtKmFahrstrecke','txtKmLuftlinie'];

  // Pflichtfelder je Maskentyp (siehe btnSpeichern.onclick unten) -- ALLE
  // Felder, die tatsächlich ausgefüllt werden sollen, nicht nur die
  // ursprünglichen 3 (Name/Adresse/Datum). Grund: es konnte z.B. eine PT
  // ohne Uhrzeit Hausbesuch und ohne Geburtsdatum gespeichert werden, was
  // nicht passieren darf. txtKmLuftlinie bleibt bewusst außen vor (verstecktes
  // Begleitfeld zu txtKm, wird zusammen mit diesem automatisch gesetzt,
  // kann nicht separat rot umrandet werden). "Abweichender Sterbeort"
  // (txtSterbeAdr1/2, nur bei Bedarf aufgeklappt) und die Bestatter-Adresse
  // bleiben ebenfalls bewusst NICHT hart Pflicht -- das entspricht der
  // PC-Logik (bestatterKomplettLeer darf bewusst leer bleiben, siehe
  // pruefeBestatterLeer).
  const pflichtfelderKonfig = art==='ls'
    ? [
        {id:'txtDatumExcel', label:'Datum Todesbescheinigung'},
        {id:'txtZeitLS', label:'Zeitpunkt Leichenschau'},
        {id:'txtDatum', label:'Rechnungsdatum'},
        {id:'txtName', label:'Name'},
        {id:'txtPAdresse1', label:'Straße + Hausnummer (Sterbeort)'},
        {id:'txtPAdresse2', label:'PLZ + Stadt (Sterbeort)'},
        {id:'txtGeda', label:'Geburtsdatum'},
        {id:'txtSterbedatum', label:'Sterbedatum'},
        {id:'txtTodeszeit', label:'Sterbezeitpunkt'},
        {id:'txtKm', label:'Strecke (Hin- und Rückfahrt)'}
      ]
    : [
        {id:'txtDatumExcel', label:'Datum Hausbesuch'},
        {id:'txtZeitLS', label:'Uhrzeit Hausbesuch'},
        {id:'txtDatum', label:'Rechnungsdatum'},
        {id:'txtName', label:'Name'},
        {id:'txtPAdresse1', label:'Straße + Hausnummer'},
        {id:'txtPAdresse2', label:'PLZ + Stadt'},
        {id:'txtGeda', label:'Geburtsdatum'},
        {id:'txtKm', label:'Strecke (Hin- und Rückfahrt)'}
      ];

  // Rote "Pflichtfeld fehlt"-Umrandung (siehe btnSpeichern.onclick unten)
  // wieder entfernen, sobald der Nutzer anfängt, das Feld auszufüllen --
  // ohne erneuten Speichern-Klick abwarten zu müssen.
  pflichtfelderKonfig.forEach(({id})=>{
    const el = document.getElementById(id);
    if(el) el.addEventListener('input', ()=>{ if(el.value.trim()) el.classList.remove('pflichtfeld-fehlt'); });
  });
  if(art==='pt'){
    const diagEl0 = document.getElementById('txtDiag');
    if(diagEl0) diagEl0.addEventListener('input', ()=> diagEl0.classList.remove('pflichtfeld-fehlt'));
  }

  // Schnappschuss der Feldwerte GENAU SO, wie die Maske gerade aufgebaut
  // wurde (frisch angelegt mit den Vorbelegungen, oder aus einer Korrektur
  // geladen) -- Grundlage fuer die "noch nicht gespeichert"-Warnung beim
  // Zurückgehen (Pfeil oder Handy-Zurück-Taste), siehe zurueckAusMaske().
  const anfangsWerteJSON = JSON.stringify(werteEinsammeln());
  // BETA: unfertige neue Rechnung laufend sichern, PLZ-Vorschlaege
  betaMaskeErweitern(art, korrekturIdx, vorbelegt, ()=>({ werte: werteEinsammeln(), positionen: positionenAuswahl }), ()=> hatUngespeicherteAenderungen());
  function hatUngespeicherteAenderungen(){
    return JSON.stringify(werteEinsammeln()) !== anfangsWerteJSON;
  }
  // Wie vom Nutzer gewünscht: die Handy-"Zurück"-Taste soll sich genauso
  // verhalten wie der Zurück-Pfeil oben -- nicht die App schließen. Wurden
  // seit dem Öffnen der Maske Werte geändert, ohne dass gespeichert wurde,
  // wird das vor dem Verlassen zur Startseite als Hinweis (mit Wahlmöglich-
  // keit) angezeigt statt die Eingaben stillschweigend zu verwerfen.
  function zurueckAusMaske(){
    // Neu begonnene (noch nicht gespeicherte) Rechnung: aktuellen Stand als
    // Entwurf sichern, BEVOR tatsaechlich navigiert wird -- damit ein Hin-
    // und Herwechseln zur Startseite/den Einstellungen die Eingaben nicht
    // mehr loescht (siehe maskenEntwuerfe oben). Nur relevant, wenn es
    // ueberhaupt etwas zu sichern gibt oder bereits ein Entwurf aktiv war --
    // sonst wuerde sich sonst hier unnoetig ein "leerer" Entwurf mit dem
    // eingefrorenen Default-Datum von heute festsetzen.
    if(korrekturIdx===undefined){
      // BETA: unfertige Rechnung bleibt dauerhaft gesichert (Rechnungsverwaltung, ganz oben)
      if(betaEntwurfSichernAktuell && betaEntwurfSichernAktuell())
        appToastAnzeigen('Als unfertig gesichert – Rechnungsverwaltung, ganz oben.', 2600);
      ruecksprungZiel();
      return;
    }
    if(hatUngespeicherteAenderungen()){
      const hinweisZusatz = korrekturIdx===undefined
        ? 'Die Eingaben bleiben zwischengespeichert, bis die App neu gestartet wird -- beim nächsten Öffnen sind sie wieder da.'
        : 'Beim Zurückgehen gehen die Änderungen verloren.';
      alertBanner(`Diese Rechnung wurde noch nicht gespeichert. ${hinweisZusatz}
        <div class="aktionen">
          <button data-akt="speichern">Jetzt speichern</button>
          <button data-akt="verwerfen">Ohne Speichern zurück</button>
        </div>`);
      const warnEl = document.getElementById('allgemeinerHinweis');
      warnEl.querySelector('[data-akt="speichern"]').onclick = ()=> document.getElementById('btnSpeichern').click();
      warnEl.querySelector('[data-akt="verwerfen"]').onclick = ()=>{ warnEl.innerHTML=''; ruecksprungZiel(); };
      return;
    }
    ruecksprungZiel();
  }

  // Straße-Feld-Verhalten (str->straße + Großschreibung) VOR der
  // Geocoding-Auslösung registrieren, damit die Routen-/PLZ-Suche bereits
  // den korrigierten Straßennamen verwendet.
  document.getElementById('txtPAdresse1').addEventListener('blur', ()=> strasseFeldBlur('txtPAdresse1'));
  if(art==='ls') document.getElementById('txtAdresse1').addEventListener('blur', ()=> strasseFeldBlur('txtAdresse1'));

  // Großschreib-/Straßen-Automatik zusätzlich schon WÄHREND des Tippens
  // (nicht erst beim Verlassen des Feldes) -- 1:1 wie am PC (IstGrossSchreibFeld/
  // IstStrassenFeld): Name + alle Adressfelder bekommen die Großschreibung,
  // die reinen Straßenzeilen zusätzlich die "str"->"straße"-Ausschreibung.
  feldLiveGrossschreibungAnhaengen('txtName', false);
  feldLiveGrossschreibungAnhaengen('txtPAdresse1', true);
  feldLiveGrossschreibungAnhaengen('txtPAdresse2', false);
  if(art==='ls'){
    feldLiveGrossschreibungAnhaengen('txtSterbeAdr1', true);
    feldLiveGrossschreibungAnhaengen('txtSterbeAdr2', false);
    feldLiveGrossschreibungAnhaengen('txtBName', false);
    feldLiveGrossschreibungAnhaengen('txtAdresse1', true);
    feldLiveGrossschreibungAnhaengen('txtAdresse2', false);
  }

  ['txtPAdresse1','txtPAdresse2'].forEach(id=>{
    const el = document.getElementById(id); if(el) el.addEventListener('blur', ()=> kmAutomatikAusloesen());
  });
  // PLZ/Ort-Erkennung wie am PC: beim Verlassen des kombinierten
  // "PLZ + Ort"-Feldes ergänzen/prüfen.
  document.getElementById('txtPAdresse2').addEventListener('blur', ()=> plzOrtPruefen('txtPAdresse1','txtPAdresse2'));

  // Abweichender Sterbeort (nur LS): Auf-/Zuklappen-Button plus dieselbe
  // Straße-/PLZ-Ort-Behandlung wie bei den übrigen Adressfeldern. Ist dieser
  // Block ausgefüllt, gilt ER (nicht die Patientenadresse) als Sterbeort für
  // die Routenberechnung -- wie am PC (AktiverAdressBlock).
  if(art==='ls'){
    const btnSterbeAbw = document.getElementById('btnSterbeAbw');
    const sterbeAbwFelder = document.getElementById('sterbeAbwFelder');
    const sterbeAbwText = document.getElementById('btnSterbeAbwText');
    btnSterbeAbw.onclick = ()=>{
      const offen = !sterbeAbwFelder.classList.contains('versteckt');
      if(offen){
        sterbeAbwFelder.classList.add('versteckt');
        sterbeAbwText.textContent = 'Sterbeort abw.?';
      } else {
        sterbeAbwFelder.classList.remove('versteckt');
        sterbeAbwText.textContent = 'Sterbeort abw. ✕';
        document.getElementById('txtSterbeAdr1').focus();
      }
      kmAutomatikAusloesen();
    };
    document.getElementById('txtSterbeAdr1').addEventListener('blur', ()=> strasseFeldBlur('txtSterbeAdr1'));
    ['txtSterbeAdr1','txtSterbeAdr2'].forEach(id=>{
      document.getElementById(id).addEventListener('blur', ()=> kmAutomatikAusloesen());
    });
    document.getElementById('txtSterbeAdr2').addEventListener('blur', ()=> plzOrtPruefen('txtSterbeAdr1','txtSterbeAdr2'));
  }
  document.getElementById('txtDatumExcel').addEventListener('blur', ()=>{ datumFeldBlur('txtDatumExcel'); automatikVorschauAktualisieren(); });
  document.getElementById('txtDatum').addEventListener('blur', ()=> datumFeldBlur('txtDatum'));
  // KORREKTUR: dieses Feld ist im DOM das letzte VOR einem schreibgeschuetzten
  // (readonly) Betrag-Feld -- das Handy erkennt readonly-Felder nicht als
  // "naechstes Feld" und zeigt deshalb von sich aus "Öffnen"/"Los" statt
  // "Weiter" auf der Bildschirmtastatur. "enterkeyhint" erzwingt hier
  // ausdruecklich "Weiter" (Beschriftung), der Enter-Handler uebernimmt
  // zusaetzlich die eigentliche Sprungfunktion (springt zum naechsten
  // ECHTEN Eingabefeld -- Name des Patienten -- statt ins readonly-Feld).
  document.getElementById('txtDatum').setAttribute('enterkeyhint', 'next');
  document.getElementById('txtDatum').addEventListener('keydown', (ev)=>{
    if(ev.key==='Enter'){ ev.preventDefault(); document.getElementById('txtName')?.focus(); }
  });
  // Geburtsdatum hatte bisher KEINEN Blur-Handler -- die Kurzeingabe-
  // Ergänzung/Normalisierung (z.B. "1.1.99" -> "01.01.1999") lief hier also
  // nie, im Unterschied zu allen anderen Datumsfeldern. Bewusst weiterhin
  // OHNE die Jahres-Plausibilitätsprüfung (pruefeJahrFeld) -- die gilt am
  // PC (JahrDialog: "If istGeda Then ... Exit Function") ausdrücklich NICHT
  // fürs Geburtsdatum, da es naturgemäß weit vom aktuellen Jahr abweicht.
  document.getElementById('txtGeda').addEventListener('blur', ()=> datumFeldBlur('txtGeda'));
  // txtZeitLS existiert in BEIDEN Masken (LS: "Zeitpunkt Leichenschau",
  // PT: "Uhrzeit Hausbesuch") -- Format-Pruefung gilt daher fuer beide.
  document.getElementById('txtZeitLS').addEventListener('blur', ()=>{ zeitFeldBlur('txtZeitLS'); automatikVorschauAktualisieren(); });
  // km-Feld: exakt wie am PC (Txt_Change setzt dort NUR gKmGetippt=True,
  // die eigentliche Neuinterpretation + Live-Neuberechnung der Positionen
  // passiert erst beim Verlassen des Feldes ueber KmFeldManuellUebernehmen/
  // AutoAktualisierenLive -- siehe FeldFokus/AktualisiereAktivNachTab).
  // "Eingetippt" wird über das 'input'-Ereignis erkannt, das bei einem
  // programmatischen .value-Setzen (Routenberechnung, Alternativrouten-
  // Kachel) nicht feuert -- so wird ein bereits korrekt gesetzter Wert beim
  // Verlassen des Feldes nicht nochmal (falsch) neu interpretiert.
  (function(){
    const kmEl = document.getElementById('txtKm');
    kmEl.addEventListener('focus', ()=>{ kmVorFokus = kmEl.value; });
    kmEl.addEventListener('input', ()=>{ kmManuellGetippt = true; });
    kmEl.addEventListener('blur', ()=> kmFeldManuellUebernehmen());
  })();
  // Beim (Wieder-)Aufbau der Maske (frischer Fall, Korrektur, Rücksprung von
  // den Rechnungspositionen) sofort Beschriftung + Anzeigewert des km-Felds
  // aus den geladenen/übernommenen versteckten Werten ableiten.
  streckenAnzeigeAktualisieren();

  if(art==='pt'){
    function diagnosenRendern(){
      const el = document.getElementById('diagChips');
      // Sobald mindestens eine Diagnose gewählt ist, gilt das Pflichtfeld
      // als erfüllt -- rote Umrandung (siehe btnSpeichern.onclick) direkt
      // wieder entfernen, ohne erneuten Speichern-Klick abwarten zu müssen.
      const diagFeld = document.getElementById('txtDiag');
      if(diagnosen.length && diagFeld) diagFeld.classList.remove('pflichtfeld-fehlt');
      if(!diagnosen.length){ el.innerHTML=''; return; }
      el.innerHTML = diagnosen.map((d,i)=>`
        <div class="diag-chip" data-idx="${i}">
          <label><input type="checkbox" class="chipG" data-idx="${i}" ${d.flags.indexOf('G')>=0?'checked':''}> G</label>
          <label><input type="checkbox" class="chipV" data-idx="${i}" ${d.flags.indexOf('V')>=0?'checked':''}> V</label>
          <div class="chip-text">${d.text}</div>
          <button type="button" class="chip-del" data-idx="${i}">&#10005;</button>
        </div>`).join('');
      el.querySelectorAll('.chipG').forEach(cb=> cb.onchange = ()=>{
        const i=+cb.dataset.idx; let f=diagnosen[i].flags;
        f = cb.checked ? (f.indexOf('G')>=0?f:f+'G') : f.replace('G','');
        diagnosen[i].flags = f;
      });
      el.querySelectorAll('.chipV').forEach(cb=> cb.onchange = ()=>{
        const i=+cb.dataset.idx; let f=diagnosen[i].flags;
        f = cb.checked ? (f.indexOf('V')>=0?f:f+'V') : f.replace('V','');
        diagnosen[i].flags = f;
      });
      el.querySelectorAll('.chip-del').forEach(btn=> btn.onclick = ()=>{
        diagnosen.splice(+btn.dataset.idx,1);
        diagnosenRendern();
      });
    }
    diagnosenRendern();

    const diagEl = document.getElementById('txtDiag');
    const diagListe = document.getElementById('diagVorschlaege');
    // BETA: beim Tippen Suchfeld nach oben schieben, damit die Trefferliste
    // nicht unter der Tastatur verschwindet
    const diagNachOben = ()=>{
      document.body.classList.add('diag-tippen');
      setTimeout(()=>{
        if(document.activeElement !== diagEl) return;
        const y = diagEl.getBoundingClientRect().top + window.scrollY - 84;
        window.scrollTo({ top: Math.max(0, y), behavior: 'smooth' });
      }, 280);
    };
    diagEl.addEventListener('focus', diagNachOben);
    diagEl.addEventListener('blur', ()=> setTimeout(()=>{ if(document.activeElement !== diagEl) document.body.classList.remove('diag-tippen'); }, 400));
    if(window.visualViewport) window.visualViewport.addEventListener('resize', ()=>{ if(document.activeElement === diagEl) diagNachOben(); });
    // Freie Diagnosen: nicht jede Diagnose steht im ICD-Katalog (bzw. ist
    // dort noch nicht erfasst) -- deshalb wird zusätzlich zu den
    // Katalog-Treffern immer eine "als Freitext übernehmen"-Option
    // angeboten, sobald mind. 2 Zeichen eingetippt sind und der Text nicht
    // schon exakt einem Treffer entspricht. Enter (Bildschirmtastatur
    // "Weiter"/"Fertig") übernimmt den eingetippten Text ebenfalls direkt.
    function diagnoseUebernehmen(txt){
      txt = (txt||'').trim();
      if(!txt) return;
      if(!diagnosen.some(dd=>dd.text.toLowerCase()===txt.toLowerCase())){
        diagnosen.push({text:txt, flags:''});
        diagnosenRendern();

      diagEl.value=''; diagListe.classList.remove('aktiv'); diagListe.innerHTML='';

      if(q.length>=2 && !treffer.some(t=>t.toLowerCase()===q.toLowerCase())){
        html += `<div class="diag-freitext" data-txt="${q.replace(/"/g,'&quot;')}">&#10133; "${q}" als Freitext übernehmen</div>`;

      diagListe.innerHTML = html;

      diagListe.querySelectorAll('div').forEach(d=>{
        d.onclick = ()=> diagnoseUebernehmen(d.dataset.txt);

      if(ev.key!=='Enter') return;
      ev.preventDefault();
