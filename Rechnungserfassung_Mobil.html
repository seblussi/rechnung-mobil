<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rechnungserfassung</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#2b3a55">
<!-- Sagt Chrome/Android, dass die Seite Hell-/Dunkelmodus selbst
     handhabt -- verhindert, dass Android Chromes "Force Dark"-Heuristik
     einzelne (v.a. transparent/blass gestylte) Elemente eigenmaechtig
     umfaerbt und dadurch z.B. Buttontext unsichtbar macht. -->
<meta name="color-scheme" content="light dark">
<script src="icd_katalog.js"></script>
<style>
  :root{
    --bg:#f4f6f9;
    --karte:#ffffff;
    --text:#1a1a1a;
    --text-schwach:#666;
    --rand:#dcdfe3;
    --titelfarbe:#2b3a55;
    --ls-farbe:#1f5f9e;
    --pt-farbe:#1f8a4c;
    --warnung-bg:#fff4e5;
    --warnung-rand:#e8a33d;
    --warnung-text:#7a4a00;
    --fehler:#b3261e;
    --grau-feld:#eceef0;
  }
  body.dunkel{
    --bg:#1b2028;
    --karte:#242b36;
    --text:#dde2e8;
    --text-schwach:#9aa4ad;
    --rand:#333b42;
    --titelfarbe:#dde2e8;
    --warnung-bg:#3a2c10;
    --warnung-rand:#c78a2e;
    --warnung-text:#f0c98a;
    --fehler:#ff6b60;
    --grau-feld:#2a3138;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:"Segoe UI",-apple-system,Roboto,Arial,sans-serif;
    background:var(--bg); color:var(--text); padding-bottom:40px;
  }
  header{
    background:var(--titelfarbe); color:#fff; padding:14px 16px;
    display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; z-index:10;
  }
  header h1{font-size:17px; margin:0; font-weight:600;}
  header .zurueck, header .zahnrad{
    background:none; border:none; color:#fff; font-size:22px; cursor:pointer; padding:4px 8px;
  }
  main{padding:14px 14px 60px;}

  .kachelreihe{display:flex; flex-direction:column; align-items:center; gap:18px; margin:10px 0 20px;}
  .karte{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    width:min(78vw, 290px); height:min(62vw, 230px);
    border:none; border-radius:16px; color:#fff; font-family:inherit;
    font-size:24px; font-weight:bold; cursor:pointer; box-shadow:0 5px 12px rgba(0,0,0,.18);
  }
  .karte:active{filter:brightness(1.08);}
  .karte.ls{background:var(--ls-farbe);}
  .karte.pt{background:var(--pt-farbe);}
  .karte .icon{font-size:52px; display:block; margin-bottom:14px;}
  .karte .unter{font-size:12.5px; font-weight:400; opacity:.9; margin-top:4px;}

  .btn-sekundaer{
    display:block; width:100%; background:var(--karte); border:1px solid var(--rand);
    color:var(--text); border-radius:10px; padding:14px; font-size:15px; margin-bottom:10px; cursor:pointer;
  }
  .btn-sekundaer .unter{display:block; font-size:12px; color:var(--text-schwach); margin-top:2px; font-weight:400;}
  .btn-export{border-color:#e8a33d; color:#7a4a00; background:#fff4e5;}
  body.dunkel .btn-export{background:#3a2c10; color:#f0c98a; border-color:#c78a2e;}

  /* Jeder Formularabschnitt bekommt eine eigene "Karte" mit Rand und
     Hintergrund -- deutlich klarere optische Trennung als vorher nur mit
     einer kleinen Textzeile. */
  .abschnitt{
    background:var(--karte); border:1px solid var(--rand); border-radius:12px;
    padding:14px 14px 4px; margin-bottom:16px; box-shadow:0 1px 3px rgba(0,0,0,.05);
  }
  .abschnitt .feld:last-child{margin-bottom:4px;}
  .trennlinie{
    font-size:12.5px; font-weight:700; color:#fff; margin:-14px -14px 14px;
    text-transform:uppercase; letter-spacing:.04em; background:var(--titelfarbe);
    padding:9px 14px; border-radius:11px 11px 0 0;
  }
  .maske.pt .abschnitt .trennlinie{background:var(--pt-farbe);}
  .maske.ls .abschnitt .trennlinie{background:var(--ls-farbe);}
  .feld{margin-bottom:12px;}
  .feld label{display:block; font-size:12.5px; color:var(--text-schwach); margin-bottom:3px;}
  .feld input, .feld select, .feld textarea{
    width:100%; padding:10px 11px; border:1px solid var(--rand); border-radius:8px;
    font-size:15px; background:var(--karte); color:var(--text);
  }
  .feld input.grau{background:var(--grau-feld);}
  .feld input:focus, .feld select:focus{outline:2px solid var(--ls-farbe); outline-offset:0;}
  .warnhinweis{
    background:var(--warnung-bg); border:1px solid var(--warnung-rand); color:var(--warnung-text);
    border-radius:8px; padding:9px 11px; font-size:13px; margin-top:6px; display:none;
  }
  .warnhinweis.aktiv{display:block;}
  .warnhinweis .aktionen{margin-top:8px; display:flex; gap:8px;}
  .warnhinweis button{
    border:1px solid var(--warnung-rand); background:transparent; color:var(--warnung-text);
    border-radius:6px; padding:6px 10px; font-size:12.5px; cursor:pointer;
  }
  .autocomplete-liste{
    border:1px solid var(--rand); border-top:none; border-radius:0 0 8px 8px; background:var(--karte);
    max-height:160px; overflow-y:auto; display:none; margin-top:-12px; margin-bottom:12px;
  }
  .autocomplete-liste.aktiv{display:block;}
  .autocomplete-liste div{padding:9px 11px; font-size:14px; border-bottom:1px solid var(--rand); cursor:pointer;}
  .autocomplete-liste div:last-child{border-bottom:none;}
  .btn-primaer{
    background:var(--ls-farbe); color:#fff; border:none; border-radius:10px; padding:14px;
    font-size:15px; font-weight:600; width:100%; margin-top:6px; cursor:pointer;
  }
  /* Bewusst UNDURCHSICHTIGER Hintergrund (statt transparent): ein
     transparenter Hintergrund liess Android-Chrome (Force-Dark-Heuristik)
     gelegentlich auch die Textfarbe umfaerben, wodurch der Button auf
     manchen Geraeten wie unbeschriftet wirkte. */
  .btn-primaer.blass{background:var(--karte); color:var(--ls-farbe); font-weight:600; border:2px solid var(--ls-farbe);}
  .maske.pt .btn-primaer{background:var(--pt-farbe);}
  /* WICHTIG: ".maske.pt .btn-primaer" (3 Klassen-Selektoren) ist
     spezifischer als ".btn-primaer.blass" (2 Klassen-Selektoren) und hätte
     sonst dessen Hintergrundfarbe überschrieben -- das war der tatsächliche
     Grund für den "Aus Zwischenablage"-Button ohne sichtbare Beschriftung
     in der Privatrechnung-Maske: grüne Schrift auf grünem statt weißem
     Hintergrund. Hintergrund hier deshalb explizit erneut setzen. */
  .maske.pt .btn-primaer.blass{background:var(--karte); color:var(--pt-farbe); border-color:var(--pt-farbe);}
  .streckeninfo{font-size:12.5px; color:var(--text-schwach); margin-top:4px; min-height:16px;}
  .fall-zeile{
    background:var(--karte); border:1px solid var(--rand); border-radius:10px; padding:12px 14px;
    margin-bottom:8px; cursor:pointer;
  }
  .fall-zeile .name{font-weight:600;}
  .fall-zeile .info{font-size:12.5px; color:var(--text-schwach); margin-top:2px;}
  .einstellung-zeile{
    display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--rand); cursor:pointer;
  }
  .einstellung-zeile input{width:20px; height:20px; flex-shrink:0;}
  .einstellung-zeile .txt{font-size:14.5px;}
  .einstellung-zeile .txt .hinweis{display:block; font-size:12px; color:var(--text-schwach);}
  .leer-hinweis{text-align:center; color:var(--text-schwach); font-size:14px; padding:30px 10px;}
  .badge-neu{background:var(--titelfarbe); color:#fff; font-size:11px; padding:2px 6px; border-radius:4px; margin-left:6px;}

  .position-zeile{display:flex; align-items:flex-start; gap:10px; padding:10px 0; border-bottom:1px solid var(--rand);}
  .position-zeile input{width:20px; height:20px; margin-top:2px; flex-shrink:0;}
  .position-zeile .haupt{flex:1; font-size:14px;}
  .position-zeile .ziffer{font-weight:600; color:var(--text-schwach); font-size:12px;}
  .position-zeile .betrag{font-weight:600; min-width:60px; text-align:right; font-size:14px;}
  .positionen-gruppe-titel{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--text-schwach); margin:18px 0 4px;}
  .summenzeile{display:flex; justify-content:space-between; font-size:17px; font-weight:700; padding:16px 0; border-top:2px solid var(--rand); margin-top:8px;}

  .diag-chip{
    display:flex; align-items:flex-start; gap:8px; background:var(--grau-feld); border-radius:8px;
    padding:8px 10px; margin-bottom:8px;
  }
  .diag-chip .chip-text{flex:1; font-size:13.5px; line-height:1.35;}
  .diag-chip label{display:flex; align-items:center; gap:3px; font-size:12px; color:var(--text-schwach); white-space:nowrap;}
  .diag-chip input[type=checkbox]{width:16px; height:16px;}
  .diag-chip .chip-del{
    background:none; border:none; color:var(--fehler); font-size:16px; font-weight:700; cursor:pointer; padding:0 2px;
  }
</style>
</head>
<body>

<header>
  <button class="zurueck" id="btnZurueck" style="visibility:hidden">&#8592;</button>
  <h1 id="titel">Rechnungserfassung</h1>
  <button class="zahnrad" id="btnEinstellungen">&#9881;</button>
</header>

<main id="app"></main>

<script>
/* ==========================================================
   Speicher / Grunddaten
   ========================================================== */
const LS = {
  get(k, fallback){ try{ const v = localStorage.getItem(k); return v===null? fallback : JSON.parse(v);}catch(e){return fallback;} },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
function ladeFaelle(art){ return LS.get('faelle_'+art, []); }
function speichereFaelle(art, arr){ LS.set('faelle_'+art, arr); }

// Startbestückung des Bestatter-Katalogs (Stand PC-Liste). Wird nur EINMAL
// beim allerersten Aufruf eingespielt (Flag 'bestatter_katalog_seed_v1'),
// damit spätere Löschungen/Änderungen durch den Nutzer nicht immer wieder
// überschrieben werden.
const BESTATTER_STANDARD = [
  ["Berdon","Kaiserstraße 55","76437 Rastatt"],
  ["Bestattungshaus Im Ried","Oberdorfstraße 23","77974 Meißenheim"],
  ["Braunagel","Konrad-Adenauer-Straße 3A","76571 Gaggenau"],
  ["Ettenheim (Pflegeheim)","Münstertalstraße 19","77955 Ettenheim"],
  ["Finger Blank","Bierkellerstraße 6","77694 Kehl"],
  ["Geiger","Moltkestr. 27","77654 Offenburg"],
  ["Hassmann","Wörthstraße 15","77839 Lichtenau"],
  ["Heck","Hauptstraße 5","76571 Gaggenau"],
  ["Heidenreich","Weingartenstraße 74","77654 Offenburg"],
  ["Hüter","Kirschbaumallee 5","76448 Durmersheim"],
  ["Kiechle","Spießgasse 1","77694 Kehl"],
  ["Kiechle","Ebertplatz 19","77654 Offenburg"],
  ["Köppel","Franz-Philipp-Straße 5","76437 Rastatt"],
  ["Laug","Hinter den Gärten 12","77656 Offenburg"],
  ["Link","Fischerstraße 36","77977 Rust"],
  ["Mechler","Hauptstraße 78","77815 Bühl"],
  ["Merkle","Leutkirchstraße 30","77723 Gengenbach"],
  ["Messner","Strickerweg 1a","77716 Haslach"],
  ["Rainer Weber","Dekan-Höfler-Straße 1","76532 Baden-Baden"],
  ["Rudi Klumpp","Wilhelmstraße 59","76461 Muggensturm"],
  ["Schmider","Gummenstraße 28","77756 Hausach"],
  ["Schwenk","Gerberstrasse 3-4 Martinstraße 4","77855 Achern"]
];
function ladeKatalog(){
  if(!LS.get('bestatter_katalog_seed_v1', false)){
    const bestehend = LS.get('bestatter_katalog', []);
    const seed = BESTATTER_STANDARD.map(z => ({name:z[0], adr1:z[1], adr2:z[2], herkunft:'pc', zeitstempel:new Date().toISOString()}));
    // vorhandene (z.B. schon vom Handy angelegte) Einträge behalten, Duplikate meiden
    seed.forEach(s=>{
      const gibtEs = bestehend.some(b=>b.name.trim().toLowerCase()===s.name.trim().toLowerCase()
                                     && (b.adr1||'').trim().toLowerCase()===s.adr1.trim().toLowerCase());
      if(!gibtEs) bestehend.push(s);
    });
    LS.set('bestatter_katalog', bestehend);
    LS.set('bestatter_katalog_seed_v1', true);
  }
  return LS.get('bestatter_katalog', []);
}
function speichereKatalog(k){ LS.set('bestatter_katalog', k); }
function ladeEinstellungen(){
  return LS.get('einstellungen', {dunkel:false, praxisadresse:'Im Drachenacker 25, 77656 Offenburg', reiseBasisLuftlinie:false});
}
function speichereEinstellungen(e){ LS.set('einstellungen', e); }
function autoSyncVerfuegbar(){ return false; } // OneDrive-Auto-Sync noch nicht angebunden

function bestatterEintragen(name, adr1, adr2){
  if(!name || !name.trim()) return;
  const k = ladeKatalog();
  const existiert = k.some(b => b.name.trim().toLowerCase()===name.trim().toLowerCase()
                              && (b.adr1||'').trim().toLowerCase()===(adr1||'').trim().toLowerCase()
                              && (b.adr2||'').trim().toLowerCase()===(adr2||'').trim().toLowerCase());
  if(existiert) return;
  k.push({name:name.trim(), adr1:(adr1||'').trim(), adr2:(adr2||'').trim(), herkunft:'handy', zeitstempel:new Date().toISOString()});
  speichereKatalog(k);
}

/* ==========================================================
   Datum / Zeit Hilfsfunktionen
   ========================================================== */
function normalisiereDatum(eingabe){
  if(!eingabe) return '';
  let e = eingabe.trim().replace(/\//g,'.').replace(/-/g,'.').replace(/,/g,'.');
  const teile = e.split('.');
  if(teile.length !== 3) return '';
  let tag=parseInt(teile[0],10), monat=parseInt(teile[1],10), jahrStr=teile[2].trim();
  if(jahrStr.length!==2 && jahrStr.length!==4) return '';
  let jahr=parseInt(jahrStr,10);
  if(jahrStr.length===2) jahr = 1900+jahr;
  if(isNaN(tag)||isNaN(monat)||isNaN(jahr)) return '';
  if(monat<1||monat>12||tag<1||tag>31||jahr<1900) return '';
  const d = new Date(jahr, monat-1, tag);
  if(d.getFullYear()!==jahr || d.getMonth()!==monat-1 || d.getDate()!==tag) return '';
  return String(tag).padStart(2,'0')+'.'+String(monat).padStart(2,'0')+'.'+jahr;
}
function alsDatum(normDatum){ const t=normDatum.split('.'); return new Date(+t[2], +t[1]-1, +t[0]); }
function normalisiereZeit(eingabe){
  if(!eingabe) return '';
  let w = eingabe.trim().replace(/Uhr/gi,'').trim();
  if(w.indexOf(':')===-1) return '';
  const teile = w.split(':');
  if(teile.length!==2) return '';
  let h=parseInt(teile[0],10), m=parseInt(teile[1],10);
  if(isNaN(h)||isNaN(m)||h<0||h>23||m<0||m>59) return '';
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}
function zeitInMinuten(hhmm){
  if(!hhmm) return -1;
  const t=hhmm.split(':'); if(t.length!==2) return -1;
  return (+t[0])*60+(+t[1]);
}
function heuteAlsText(){
  const d=new Date();
  return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear();
}
function istWochenende(normDatum){
  if(!normDatum) return false;
  const d = alsDatum(normDatum);
  return d.getDay()===0 || d.getDay()===6;
}

/* ==========================================================
   Zwischenablage-Import
   ========================================================== */
const STERBEZEIT_SCHLUESSELWOERTER = [
  "tod festgestellt","todeszeit","todeszeitpunkt","tod eingetreten","sterbezeit",
  "exitus letalis","exitus","ist verstorben","verstorben","todesfeststellung",
  "für tot erklärt","fuer tot erklaert","klinisch tot","reanimation ohne erfolg",
  "erfolglose reanimation","reanimation eingestellt","reanimationsmaßnahmen eingestellt",
  "reanimationsmassnahmen eingestellt","reanimationsmaßnahmen abgebrochen","reanimationsmaßnahmen beendet",
  "reanimation beendet","cpr erfolglos","cpr eingestellt","kein reanimationsversuch",
  "nicht reanimationspflichtig","keine reanimation","sichere todeszeichen","totenflecke",
  "livores","totenstarre","rigor mortis","leblos aufgefunden"
];
function sterbezeitAusFreitextErmitteln(volltext){
  if(!volltext) return {zeit:'', quelle:''};
  const textLower = volltext.toLowerCase();
  const zeitMuster = /(\d{1,2})[:.](\d{2})\s*uhr/i;
  for(const kw of STERBEZEIT_SCHLUESSELWOERTER){
    let pos = textLower.indexOf(kw);
    if(pos===-1) continue;
    const von = Math.max(0, pos-40);
    const bis = Math.min(volltext.length, pos+kw.length+40);
    const fenster = volltext.substring(von, bis);
    const treffer = fenster.match(zeitMuster);
    if(treffer){ return {zeit:treffer[1].padStart(2,'0')+':'+treffer[2], quelle:'Schlüsselwort "'+kw+'"'}; }
  }
  const fallback = volltext.match(/leblos aufgefunden um\s*(\d{1,2})[:.](\d{2})\s*uhr/i);
  if(fallback) return {zeit:fallback[1].padStart(2,'0')+':'+fallback[2], quelle:'"leblos aufgefunden um..."'};
  return {zeit:'', quelle:''};
}
function feldAusNachrichtLesen(zeilen, praefix){
  for(const z of zeilen){
    const t = z.trim();
    if(t.toLowerCase().startsWith(praefix.toLowerCase())) return t.substring(praefix.length).trim();
  }
  return '';
}
function grossKleinNormalisieren(s){
  if(!s) return '';
  // Grossschreibung nach jedem Leerzeichen UND nach jedem Bindestrich
  // (z.B. "Baden-baden" -> "Baden-Baden", "Müller-schmidt" -> "Müller-Schmidt"),
  // damit zusammengesetzte Orts-/Namensteile korrekt behandelt werden.
  const grossNachTrenner = (wort) => wort.split('-').map(teil =>
    teil.length ? teil[0].toUpperCase()+teil.substring(1).toLowerCase() : teil
  ).join('-');
  return s.split(' ').map(w => grossNachTrenner(w)).join(' ');
}
async function ausZwischenablageEinlesen(art, ctx){
  let text = '';
  try{ text = await navigator.clipboard.readText(); }
  catch(e){ ctx.hinweis('Zwischenablage konnte nicht gelesen werden. Bitte Berechtigung erteilen oder Text manuell einfügen.'); return; }
  if(!text || !text.trim()){ ctx.hinweis('Die Zwischenablage ist leer.'); return; }

  const zeilen = text.split(/\r?\n/);
  const patient = feldAusNachrichtLesen(zeilen, 'Patient:');
  const geb = feldAusNachrichtLesen(zeilen, 'Geb:');
  const ort = feldAusNachrichtLesen(zeilen, 'Ort:');
  const strasse = feldAusNachrichtLesen(zeilen, 'Strasse:') || feldAusNachrichtLesen(zeilen, 'Straße:');

  if(patient) ctx.setValue('txtName', grossKleinNormalisieren(patient));
  if(geb) ctx.setValue('txtGeda', geb);
  if(strasse) ctx.setValue('txtPAdresse1', grossKleinNormalisieren(strasse));
  if(ort) ctx.setValue('txtPAdresse2', grossKleinNormalisieren(ort));

  if(art==='ls'){
    const erg = sterbezeitAusFreitextErmitteln(text);
    if(erg.zeit){
      ctx.setValue('txtTodeszeit', erg.zeit);
      ctx.hinweis('Sterbezeitpunkt '+erg.zeit+' automatisch erkannt (Quelle: '+erg.quelle+'). Bitte prüfen.');
    } else {
      ctx.hinweis('Kein Sterbezeitpunkt im Text erkannt -- bitte manuell eintragen.');
    }
  }
  // Wichtig: nach dem Einlesen läuft die VOLLSTÄNDIGE Plausibilitätsprüfung,
  // nicht nur die feldweise -- Werte wurden ja programmatisch gesetzt und
  // haben daher kein einzelnes "Feld verlassen"-Ereignis ausgelöst.
  ctx.allePruefungenAusfuehren();
  if(strasse && ort) ctx.adresseVerlassen();
}

/* ==========================================================
   km / Route-Automation
   ========================================================== */
async function geocode(adresse){
  const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(adresse);
  const res = await fetch(url, {headers:{'Accept':'application/json'}});
  const data = await res.json();
  if(!data || !data.length) return null;
  return {lat:parseFloat(data[0].lat), lon:parseFloat(data[0].lon)};
}
// PLZ/Ort-Erkennung analog zur PC-Funktion PlzErgaenzen() in
// PT_UserFormRechnung.frm: extrahiert eine 5-stellige PLZ aus einem Text,
// ermittelt fehlenden Ort zu einer PLZ bzw. fehlende PLZ zu einem Ort per
// Geocoding, und prüft bei vorhandenen beiden Werten per Kreuzvalidierung,
// ob PLZ und Ort tatsächlich zusammenpassen.
function plzAusText(text){
  const m = (text||'').match(/\b(\d{5})\b/);
  return m ? m[1] : '';
}
async function ortErmitteln(plz){
  try{
    const url = 'https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=1&country=Germany&postalcode='+encodeURIComponent(plz);
    const res = await fetch(url, {headers:{'Accept':'application/json'}});
    const data = await res.json();
    if(!data || !data.length) return '';
    const a = data[0].address || {};
    return a.city || a.town || a.village || a.municipality || a.city_district || '';
  }catch(e){ return ''; }
}
async function plzErmitteln(adresse){
  try{
    const url = 'https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=1&q='+encodeURIComponent(adresse);
    const res = await fetch(url, {headers:{'Accept':'application/json'}});
    const data = await res.json();
    if(!data || !data.length) return '';
    const a = data[0].address || {};
    return a.postcode || '';
  }catch(e){ return ''; }
}
async function routeKm(start, ziel){
  const url = `https://router.project-osrm.org/route/v1/driving/${start.lon},${start.lat};${ziel.lon},${ziel.lat}?overview=false`;
  const res = await fetch(url);
  const data = await res.json();
  if(!data.routes || !data.routes.length) return null;
  return data.routes[0].distance/1000;
}
// Luftlinie (Haversine) -- EINFACHE Strecke, bewusst nicht verdoppelt
// (analog zur PC-Logik: kmFahrstrecke wird fuer Hin+Rueck verdoppelt,
// kmLuftlinieEinfach bleibt die reine Einfachstrecke).
function kmLuftlinieEinfach(a, b){
  const R=6371;
  const dLat=(b.lat-a.lat)*Math.PI/180, dLon=(b.lon-a.lon)*Math.PI/180;
  const x = Math.sin(dLat/2)**2 + Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
}
// Entscheidet Reiseentschaedigung vs. Wegegeld -- analog SollReiseGelten()
// am PC: Standard = Fahrstrecke (Hin+Rueck) > 50 km; Einstellung
// "Reiseentschaedigung nach Luftlinie priorisieren" schaltet stattdessen
// auf Luftlinie (Einfachstrecke) > 25 km um.
function sollReiseGelten(kmFahrstreckeGesamt, kmLuftlinie){
  const e = ladeEinstellungen();
  if(e.reiseBasisLuftlinie) return kmLuftlinie > 25;
  return kmFahrstreckeGesamt > 50;
}

/* Ermittelt die automatisch vorzuschlagenden Positionen (Grundleistung +
   Zeit-Zuschlag + Reiseentschädigung ODER passendes Wegegeld -- nie beides,
   siehe sollReiseGelten) -- der Rest bleibt manuelle Auswahl, genau wie am
   PC ("Rechnungspositionen prüfen"). */
function automatischeAuswahl(katalog, datum, zeit, kmFahrstreckeGesamt, kmLuftlinie){
  const ausgewaehlt = new Set();
  (katalog.grundleistung||[]).forEach(p=>{ if(p.standard) ausgewaehlt.add(p.ziffer); });

  const normZeit = normalisiereZeit(zeit);
  const wochenende = istWochenende(datum);
  if(normZeit){
    const min = zeitInMinuten(normZeit);
    if(wochenende) ausgewaehlt.add('H');
    else if(min>=20*60 && min<22*60) ausgewaehlt.add('F');
    else if(min>=6*60 && min<8*60) ausgewaehlt.add('F');
    else if(min>=22*60 || min<6*60) ausgewaehlt.add('G');
  }

  const fahrVal = parseFloat((kmFahrstreckeGesamt||'').toString().replace(',','.'));
  const luftVal = parseFloat((kmLuftlinie||'').toString().replace(',','.'));
  if(!isNaN(fahrVal) && fahrVal>0){
    if(sollReiseGelten(fahrVal, isNaN(luftVal)?0:luftVal)){
      ausgewaehlt.add('REISE');
    } else {
      const nacht = normZeit ? (zeitInMinuten(normZeit)>=20*60 || zeitInMinuten(normZeit)<6*60) : false;
      const tabelle = nacht ? WEGEGELD_NACHT : WEGEGELD_TAG;
      const bandBasis = isNaN(luftVal) ? fahrVal : luftVal;
      const bucket = tabelle.find(w => bandBasis <= w.bisKm) || tabelle[tabelle.length-1];
      ausgewaehlt.add(bucket.ziffer);
    }
  }
  return ausgewaehlt;
}

/* ==========================================================
   ICD-10-GM Diagnose-Suche (repliziert die PC-Logik aus PT_UserFormRechnung:
   Suche ab 2 Zeichen, Treffer ueberall im Eintrag "Beschreibung [Code]",
   sortiert nach Fundposition, dann alphabetisch, max. 200 Treffer)
   ========================================================== */
function icdEintragBauen(code, txt){
  if(txt && code) return txt+' ['+code+']';
  return txt || code || '';
}
function icdSuchen(suchtext){
  const katalog = (typeof ICD_KATALOG!=='undefined') ? ICD_KATALOG : [];
  const such = (suchtext||'').trim();
  if(such.length<2 || !katalog.length) return [];
  const suchLower = such.toLowerCase();
  const treffer = [];
  for(let i=0;i<katalog.length;i++){
    const eintrag = icdEintragBauen(katalog[i][0], katalog[i][1]);
    const pos = eintrag.toLowerCase().indexOf(suchLower);
    if(pos>=0) treffer.push({eintrag, pos});
  }
  treffer.sort((a,b)=> a.pos-b.pos || a.eintrag.localeCompare(b.eintrag,'de'));
  return treffer.slice(0,200).map(t=>t.eintrag);
}

function allePositionenFlach(katalog){
  return [
    ...(katalog.grundleistung||[]),
    ...ZUSCHLAEGE_ZEIT,
    ...WEGEGELD_TAG, ...WEGEGELD_NACHT,
    {ziffer:'REISE', bez:REISEENTSCHAEDIGUNG.bez, betrag:REISEENTSCHAEDIGUNG.betrag}
  ];
}

  html += abschnitt('Routenberechnung',
    `<div class="feld"><label>Strecke (Hin- und Rückfahrt)</label>
      <input type="text" id="txtKm" value="${(werte.txtKm||'')}" placeholder="wird automatisch berechnet">
      <input type="hidden" id="txtKmLuftlinie" value="${(werte.txtKmLuftlinie||'')}">
      <div class="streckeninfo" id="streckeninfo"></div></div>`);

  if(art==='ls'){
    html += abschnitt('Bestattungsunternehmen',
      `<div class="feld" style="position:relative;">
        <label for="txtBName">Name</label>
        <input type="text" id="txtBName" value="${(werte.txtBName||'').replace(/"/g,'&quot;')}" autocomplete="off">
        <div class="autocomplete-liste" id="bestatterVorschlaege"></div>
        <div class="warnhinweis" id="txtBName_warn"></div>
      </div>` +
      feldHtml('Straße + Hausnummer', 'txtAdresse1') +
      feldHtml('PLZ + Stadt', 'txtAdresse2'));
  }

  html += abschnitt('Rechnungspositionen',
    `<button class="btn-sekundaer" id="btnPunkte">Rechnungspositionen auswählen
      <span class="unter" id="punkteStatus">${positionenAuswahl? positionenAuswahl.size+' Position(en) ausgewählt' : 'noch nicht geprüft'}</span></button>`);

  html += `<div id="allgemeinerHinweis"></div>`;
  html += `<button class="btn-primaer" id="btnSpeichern">Speichern</button>`;
  html += `</div>`;

  app.innerHTML = html;

  const feldIds = art==='ls'
    ? ['txtDatumExcel','txtZeitLS','txtDatum','txtName','txtPAdresse1','txtPAdresse2','txtGeda','txtSterbedatum','txtTodeszeit','txtKm','txtKmLuftlinie','txtBName','txtAdresse1','txtAdresse2']
    : ['txtDatumExcel','txtZeitLS','txtDatum','txtName','txtPAdresse1','txtPAdresse2','txtGeda','txtKm','txtKmLuftlinie'];

  ['txtPAdresse1','txtPAdresse2'].forEach(id=>{
    const el = document.getElementById(id); if(el) el.addEventListener('blur', ()=> kmAutomatikAusloesen());
  });
  // PLZ/Ort-Erkennung wie am PC: beim Verlassen des kombinierten
  // "PLZ + Ort"-Feldes ergänzen/prüfen.
  document.getElementById('txtPAdresse2').addEventListener('blur', ()=> plzOrtPruefen('txtPAdresse1','txtPAdresse2'));
  document.getElementById('txtDatumExcel').addEventListener('blur', alleChecksAusfuehren);
  document.getElementById('txtDatum').addEventListener('blur', alleChecksAusfuehren);
  // txtZeitLS existiert in BEIDEN Masken (LS: "Zeitpunkt Leichenschau",
  // PT: "Uhrzeit Hausbesuch") -- Format-Pruefung gilt daher fuer beide.
  document.getElementById('txtZeitLS').addEventListener('blur', alleChecksAusfuehren);
  if(art==='ls'){
    document.getElementById('txtSterbedatum').addEventListener('blur', alleChecksAusfuehren);
    document.getElementById('txtTodeszeit').addEventListener('blur', alleChecksAusfuehren);
    document.getElementById('txtAdresse1').addEventListener('blur', ()=> kmAutomatikAusloesen());
    document.getElementById('txtAdresse2').addEventListener('blur', ()=> kmAutomatikAusloesen());
    document.getElementById('txtAdresse2').addEventListener('blur', ()=> plzOrtPruefen('txtAdresse1','txtAdresse2'));
  }

  document.getElementById('btnZwischenablage').onclick = ()=>ausZwischenablageEinlesen(art, ctx);

  if(art==='ls'){
    const bnameEl = document.getElementById('txtBName');
    bnameEl.addEventListener('input', ()=>{
      const q = bnameEl.value.trim().toLowerCase();
      const liste = document.getElementById('bestatterVorschlaege');
      if(!q){ liste.classList.remove('aktiv'); liste.innerHTML=''; return; }
      const treffer = ladeKatalog().filter(b=>b.name.toLowerCase().startsWith(q)).slice(0,6);
      if(!treffer.length){ liste.classList.remove('aktiv'); liste.innerHTML=''; return; }
      liste.innerHTML = treffer.map(b=>`<div data-name="${b.name}" data-a1="${b.adr1}" data-a2="${b.adr2}">${b.name}<br><small style="color:var(--text-schwach)">${b.adr1}, ${b.adr2}</small></div>`).join('');
      liste.classList.add('aktiv');
      liste.querySelectorAll('div').forEach(d=>{
        d.onclick = ()=>{
          bnameEl.value = d.dataset.name;
          document.getElementById('txtAdresse1').value = d.dataset.a1;
          document.getElementById('txtAdresse2').value = d.dataset.a2;
          liste.classList.remove('aktiv'); liste.innerHTML='';
          kmAutomatikAusloesen();
        };
      });
    });
  }

  if(art==='pt'){
    function diagnosenRendern(){
      const el = document.getElementById('diagChips');
      if(!diagnosen.length){ el.innerHTML=''; return; }
      el.innerHTML = diagnosen.map((d,i)=>`
        <div class="diag-chip" data-idx="${i}">
          <label><input type="checkbox" class="chipG" data-idx="${i}" ${d.flags.indexOf('G')>=0?'checked':''}> G</label>
          <label><input type="checkbox" class="chipV" data-idx="${i}" ${d.flags.indexOf('V')>=0?'checked':''}> V</label>
          <div class="chip-text">${d.text}</div>
          <button type="button" class="chip-del" data-idx="${i}">&#10005;</button>
        </div>`).join('');
      el.querySelectorAll('.chipG').forEach(cb=> cb.onchange = ()=>{
        const i=+cb.dataset.idx; let f=diagnosen[i].flags;
        f = cb.checked ? (f.indexOf('G')>=0?f:f+'G') : f.replace('G','');
        diagnosen[i].flags = f;
      });
      el.querySelectorAll('.chipV').forEach(cb=> cb.onchange = ()=>{
        const i=+cb.dataset.idx; let f=diagnosen[i].flags;
        f = cb.checked ? (f.indexOf('V')>=0?f:f+'V') : f.replace('V','');
        diagnosen[i].flags = f;
      });
      el.querySelectorAll('.chip-del').forEach(btn=> btn.onclick = ()=>{
        diagnosen.splice(+btn.dataset.idx,1);
        diagnosenRendern();
      });
    }
    diagnosenRendern();

    const diagEl = document.getElementById('txtDiag');
    const diagListe = document.getElementById('diagVorschlaege');
    diagEl.addEventListener('input', ()=>{
      const treffer = icdSuchen(diagEl.value);
      if(!treffer.length){ diagListe.classList.remove('aktiv'); diagListe.innerHTML=''; return; }
      diagListe.innerHTML = treffer.map(t=>`<div data-txt="${t.replace(/"/g,'&quot;')}">${t}</div>`).join('');
      diagListe.classList.add('aktiv');
      diagListe.querySelectorAll('div').forEach(d=>{
        d.onclick = ()=>{
          const txt = d.dataset.txt;
          if(!diagnosen.some(dd=>dd.text.toLowerCase()===txt.toLowerCase())){
            diagnosen.push({text:txt, flags:''});
            diagnosenRendern();
          }
          diagEl.value=''; diagListe.classList.remove('aktiv'); diagListe.innerHTML='';
        };
      });
    });
  }

  async function kmAutomatikAusloesen(){
    const e = ladeEinstellungen();
    const info = document.getElementById('streckeninfo');
    if(!e.praxisadresse){ info.textContent = 'Keine Praxisadresse hinterlegt (Zahnrad -> Einstellungen).'; return; }
    let zielAdresse = '';
    if(art==='ls'){
      const bstr = document.getElementById('txtAdresse1').value.trim();
      const bort = document.getElementById('txtAdresse2').value.trim();
      zielAdresse = bstr ? (bstr+', '+bort) : (document.getElementById('txtPAdresse1').value.trim()+', '+document.getElementById('txtPAdresse2').value.trim());
    } else {
      zielAdresse = document.getElementById('txtPAdresse1').value.trim()+', '+document.getElementById('txtPAdresse2').value.trim();
    }
    if(!zielAdresse.trim() || zielAdresse.trim()===',') return;
    info.textContent = 'Route wird berechnet …';
    try{
      const start = await geocode(e.praxisadresse);
      if(!start){ info.textContent = 'Praxisadresse nicht auffindbar -- bitte in den Einstellungen prüfen.'; return; }
      const ziel = await geocode(zielAdresse);
      if(!ziel){ info.textContent = 'Zieladresse nicht gefunden.'; return; }
      const einweg = await routeKm(start, ziel);
      if(einweg===null){ info.textContent = 'Route nicht berechenbar.'; return; }
      // Wie am PC: Fahrstrecke wird als Hin- und Rückfahrt gerechnet,
      // Luftlinie bleibt die reine Einfachstrecke (Grundlage für die
      // Wegegeld-Bänder und ggf. für die Reise-Entscheidung).
      const kmFahrstreckeGesamt = einweg * 2;
      const kmLuft = kmLuftlinieEinfach(start, ziel);
      document.getElementById('txtKm').value = kmFahrstreckeGesamt.toFixed(1);
      document.getElementById('txtKmLuftlinie').value = kmLuft.toFixed(1);
      const reise = sollReiseGelten(kmFahrstreckeGesamt, kmLuft);
      info.textContent = 'Route: '+kmFahrstreckeGesamt.toFixed(1)+' km Hin+Rück, '+kmLuft.toFixed(1)+' km Luftlinie'
        + (reise ? ' -- Reiseentschädigung greift' : ' -- Wegegeld greift');
    }catch(e){
      info.textContent = 'Keine Internetverbindung -- km bitte manuell eintragen.';
    }
  }

  function feldWarnung(id, html){
    const warnEl = document.getElementById(id+'_warn');
    if(!warnEl) return;
    if(!html){ warnEl.classList.remove('aktiv'); warnEl.innerHTML=''; return; }
    warnEl.classList.add('aktiv'); warnEl.innerHTML = html;
  }

  // PLZ/Ort-Erkennung wie am PC (PlzErgaenzen): wird beim Verlassen eines
  // kombinierten "PLZ + Ort"-Feldes ausgelöst. MsgBox-Dialoge der PC-Version
  // werden hier durch die inline warnhinweis-Anzeige ersetzt (keine
  // nativen Popups, wie an anderer Stelle bereits festgelegt).
  async function plzOrtPruefen(strasseId, plzOrtId){
    const feld = document.getElementById(plzOrtId);
    const strasseFeld = document.getElementById(strasseId);
    if(!feld || !strasseFeld) return;
    const eingabe = feld.value.trim();
    if(!eingabe) { feldWarnung(plzOrtId, ''); return; }
    const strasse = strasseFeld.value.trim();
    const eingegebenePlz = plzAusText(eingabe);

    if(!eingegebenePlz){
      // Keine PLZ im Text -> per Geocoding aus Straße + Ort ermitteln
      if(!strasse) return; // ohne Straße kann keine sinnvolle Suche erfolgen
      feldWarnung(plzOrtId, 'PLZ wird ermittelt …');
      const adrFuerPlz = strasse+', '+eingabe;
      const ermitteltePlz = await plzErmitteln(adrFuerPlz);
      if(feld.value.trim() !== eingabe) return; // Nutzer hat inzwischen weitergetippt
      if(ermitteltePlz){
        feld.value = ermitteltePlz+' '+eingabe;
        feldWarnung(plzOrtId, '');
        kmAutomatikAusloesen();
      } else {
        feldWarnung(plzOrtId, `Der Ort "${eingabe}" konnte nicht gefunden werden. Bitte PLZ und Ort manuell eintragen.`);
      }
      return;
    }

    const ort = eingabe.replace(eingegebenePlz, '').trim();
    if(!ort){
      // PLZ da, Ort fehlt -> Ort zur PLZ nachschlagen
      feldWarnung(plzOrtId, 'Ort wird ermittelt …');
      const ermittelterOrt = await ortErmitteln(eingegebenePlz);
      if(feld.value.trim() !== eingabe) return;
      if(ermittelterOrt){
        feld.value = eingegebenePlz+' '+ermittelterOrt;
        feldWarnung(plzOrtId, '');
        kmAutomatikAusloesen();
      } else {
        feldWarnung(plzOrtId, `Zur PLZ "${eingegebenePlz}" konnte kein Ort gefunden werden. Bitte manuell ergänzen.`);
      }
      return;
    }

    // Beide da -> Kreuzvalidierung anhand der Straße
    if(!strasse){ feldWarnung(plzOrtId, ''); return; }
    feldWarnung(plzOrtId, 'Adresse wird geprüft …');
    const adrVoll = strasse+', '+eingabe;
    const plzLautKarte = await plzErmitteln(adrVoll);
    if(feld.value.trim() !== eingabe) return;
    if(!plzLautKarte){
      feldWarnung(plzOrtId, `Die Adresse "${adrVoll}" konnte laut Kartendienst nicht gefunden werden. Bitte prüfen.`);
      return;
    }
    if(plzLautKarte !== eingegebenePlz){
      feldWarnung(plzOrtId, `Achtung: Die eingegebene PLZ (${eingegebenePlz}) passt möglicherweise nicht zur Adresse. Laut Kartendienst gehört zu "${strasse}" eher PLZ ${plzLautKarte}.
        <div class="aktionen">
          <button data-akt="korrigieren">Auf ${plzLautKarte} korrigieren</button>
          <button data-akt="behalten">So belassen</button>
        </div>`);
      const warnEl = document.getElementById(plzOrtId+'_warn');
      warnEl.querySelector('[data-akt="korrigieren"]').onclick = ()=>{
        feld.value = plzLautKarte+' '+ort;
        feldWarnung(plzOrtId, '');
        kmAutomatikAusloesen();
      };
      warnEl.querySelector('[data-akt="behalten"]').onclick = ()=> feldWarnung(plzOrtId, '');
      return;
    }
    feldWarnung(plzOrtId, '');
  }

  function pruefeJahrFeld(id, bezeichnung){
    const input = document.getElementById(id); if(!input) return;
    const norm = normalisiereDatum(input.value);
    if(!norm){ feldWarnung(id, ''); return; }
    const jahr = +norm.split('.')[2];
    const aktJahr = new Date().getFullYear();
    if(jahr===aktJahr){ feldWarnung(id, ''); return; }
    feldWarnung(id, `${bezeichnung}: Jahr ${jahr} weicht vom aktuellen Jahr (${aktJahr}) ab.
      <div class="aktionen">
        <button data-akt="korrigieren">Auf ${aktJahr} korrigieren</button>
        <button data-akt="behalten">So belassen</button>
      </div>`);
    const warnEl = document.getElementById(id+'_warn');
    warnEl.querySelector('[data-akt="korrigieren"]').onclick = ()=>{
      input.value = norm.split('.').slice(0,2).join('.')+'.'+aktJahr;
      feldWarnung(id, '');
    };
    warnEl.querySelector('[data-akt="behalten"]').onclick = ()=> feldWarnung(id, '');
  }

  // Prueft, ob ein Uhrzeitfeld ueberhaupt ein gueltiges HH:MM-Format hat
  // (z.B. "55:12h" oder "1h" wurden bisher kommentarlos akzeptiert, weil
  // normalisiereZeit() zwar korrekt "" zurueckgab, aber nie eine sichtbare
  // Warnung ausgeloest wurde). Gibt true zurueck, wenn das Feld leer ODER
  // gueltig ist -- false bei einem erkennbar falschen, nicht-leeren Wert.
  function pruefeZeitFeld(id, bezeichnung){
    const input = document.getElementById(id); if(!input) return true;
    const roh = input.value.trim();
    if(!roh){ feldWarnung(id, ''); return true; }
    if(!normalisiereZeit(roh)){
      feldWarnung(id, `${bezeichnung}: "${roh}" ist kein gültiges Uhrzeitformat. Bitte als HH:MM eintragen (z.B. 14:30).`);
      return false;
    }
    feldWarnung(id, '');
    return true;
  }

  function pruefeZeitenLS(){
    if(art!=='ls') return;
    // txtZeitLS wird bereits separat ueber pruefeZeitFeld() geprüft (s.u.
    // in alleChecksAusfuehren) -- hier nur noch dessen Gueltigkeit abfragen.
    const zLSRoh = document.getElementById('txtZeitLS').value.trim();
    const zLS = zLSRoh ? normalisiereZeit(zLSRoh) : '';
    const inputTod = document.getElementById('txtTodeszeit');
    const rohTod = inputTod.value.trim();
    if(!rohTod){ feldWarnung('txtTodeszeit', ''); return; }
    const zSterbe = normalisiereZeit(rohTod);
    if(!zSterbe){
      // Format-Fehler hat Vorrang vor der Reihenfolge-Pruefung.
      feldWarnung('txtTodeszeit', `Sterbezeitpunkt: "${rohTod}" ist kein gültiges Uhrzeitformat. Bitte als HH:MM eintragen (z.B. 03:15).`);
      return;
    }
    if(!zLS){ feldWarnung('txtTodeszeit', ''); return; }
    if(zeitInMinuten(zLS) >= zeitInMinuten(zSterbe)){ feldWarnung('txtTodeszeit', ''); return; }
    feldWarnung('txtTodeszeit', `Leichenschau (${zLS}) liegt vor dem Sterbezeitpunkt (${zSterbe}) -- eventuell vertauscht.
      <div class="aktionen">
        <button data-akt="tauschen">Uhrzeiten tauschen</button>
        <button data-akt="behalten">So belassen</button>
      </div>`);
    const warnEl = document.getElementById('txtTodeszeit_warn');
    warnEl.querySelector('[data-akt="tauschen"]').onclick = ()=>{
      document.getElementById('txtTodeszeit').value = zLS;
      document.getElementById('txtZeitLS').value = zSterbe;
      feldWarnung('txtTodeszeit', '');
    };
    warnEl.querySelector('[data-akt="behalten"]').onclick = ()=> feldWarnung('txtTodeszeit', '');
  }

  function pruefeSterbedatum(){
    if(art!=='ls') return;
    const dSterbe = normalisiereDatum(document.getElementById('txtSterbedatum').value);
    const dLS = normalisiereDatum(document.getElementById('txtDatumExcel').value);
    if(!dSterbe || !dLS){ feldWarnung('txtSterbedatum', ''); return; }
    if(alsDatum(dSterbe) <= alsDatum(dLS)){ feldWarnung('txtSterbedatum', ''); return; }
    feldWarnung('txtSterbedatum', `Sterbedatum (${dSterbe}) liegt nach dem Datum der Todesbescheinigung (${dLS}). Bitte prüfen.`);
  }

  function pruefeBestatterLeer(){
    if(art!=='ls') return;
    const name = document.getElementById('txtBName').value.trim();
    if(name){ feldWarnung('txtBName', ''); return; }
    feldWarnung('txtBName', `Kein Bestattungsunternehmen angegeben -- die Rechnung wird an die Patientenadresse adressiert.`);
  }

  function alleChecksAusfuehren(){
    pruefeJahrFeld('txtDatumExcel', art==='ls' ? 'Datum Todesbescheinigung' : 'Datum Hausbesuch');
    pruefeJahrFeld('txtDatum', 'Rechnungsdatum');
    pruefeZeitFeld('txtZeitLS', art==='ls' ? 'Zeitpunkt Leichenschau' : 'Uhrzeit Hausbesuch');
    if(art==='ls'){
      pruefeJahrFeld('txtSterbedatum', 'Sterbedatum');
      pruefeZeitenLS();
      pruefeSterbedatum();
      pruefeBestatterLeer();
    }
  }
  // Beim Öffnen einmal ausführen -- deckt auch die Werte ab, die beim Laden
  // einer Korrektur bereits vorbefüllt sind.
  alleChecksAusfuehren();

  function alertBanner(text){
    const zielEl = document.getElementById('allgemeinerHinweis');
    zielEl.innerHTML = `<div class="warnhinweis aktiv">${text}</div>`;
    // Der Hinweis sitzt weit unten in der Maske (unterhalb der Rechnungs-
    // positionen) -- ohne aktives Hinscrollen sieht man z.B. eine
    // Zwischenablage-Fehlermeldung leicht gar nicht, wenn man gerade oben
    // auf den Button geklickt hat.
    zielEl.scrollIntoView({behavior:'smooth', block:'center'});
  }

  document.getElementById('btnPunkte').onclick = ()=>{
    const datum = document.getElementById('txtDatumExcel').value;
    const zeit = document.getElementById('txtZeitLS').value;
    const kmFahrstrecke = document.getElementById('txtKm').value;
    const kmLuftlinie = document.getElementById('txtKmLuftlinie').value;
    const basis = positionenAuswahl || automatischeAuswahl(art==='ls'?POSITIONEN_LS:POSITIONEN_PT, datum, zeit, kmFahrstrecke, kmLuftlinie);
    // Schnappschuss der Maskenwerte JETZT nehmen (Maske ist noch im DOM),
    // damit ein Zahnrad-Klick auf der Rechnungspositionen-Unteransicht
    // korrekt hierher zurückfindet, statt aus dem falschen DOM zu lesen.
    const snapVorPositionen = werteEinsammeln();
    vorbereiteRuecksprung = ()=>{
      ruecksprungAusEinstellungen = ()=>ansichtMaske(art, korrekturIdx, {werte: snapVorPositionen, positionen: positionenAuswahl});
    };
    ansichtPositionen(art, basis, null, (gewaehlt, summe)=>{
      // WICHTIG: an dieser Stelle zeigt der Bildschirm noch die Rechnungs-
      // positionen-Ansicht, nicht die Maske -- "punkteStatus"/"txtBetrag"
      // existieren im DOM also (noch) gar nicht. Statt sie (fälschlich)
      // direkt zu beschreiben, bauen wir die Maske mit den VORHER
      // gesicherten Werten plus dem neuen Betrag/der neuen Auswahl frisch
      // auf -- das hat vorher zu einem stillen Fehler geführt, der einen
      // auf der Positionen-Seite "gefangen" hat.
      positionenAuswahl = gewaehlt;
      const neueWerte = {...snapVorPositionen, txtBetrag: summe.toFixed(2).replace('.',',')};
      ansichtMaske(art, korrekturIdx, {werte: neueWerte, positionen: positionenAuswahl});
    });
  };

  function werteEinsammeln(){
    const w = {};
    feldIds.forEach(n=>{ const el=document.getElementById(n); if(el) w[n]=el.value.trim(); });
    const betragEl = document.getElementById('txtBetrag');
    w.txtBetrag = betragEl ? betragEl.value.trim() : (werte.txtBetrag||'');
    if(art==='pt') w.diagnosen = diagnosen.map(d=>({...d}));
    return w;
  }

  document.getElementById('btnSpeichern').onclick = ()=>{
    alleChecksAusfuehren();
    const offeneWarnung = app.querySelector('.warnhinweis.aktiv');
    if(offeneWarnung){
      offeneWarnung.scrollIntoView({behavior:'smooth', block:'center'});
      alertBanner('Bitte zuerst die markierten Hinweise oben prüfen (korrigieren oder bewusst so belassen).');
      return;
    }
    const w = werteEinsammeln();
    if(!w.txtName || !w.txtPAdresse1 || !w.txtDatumExcel){
      alertBanner('Bitte mindestens Name, Adresse und Datum ausfüllen.');
      return;
    }
    if(art==='ls' && w.txtBName){
      bestatterEintragen(w.txtBName, w.txtAdresse1, w.txtAdresse2);
    }
    const faelle = ladeFaelle(art);
    const eintrag = {
      werte:w,
      positionen: positionenAuswahl ? Array.from(positionenAuswahl) : [],
      zeitstempel: korrekturIdx!==undefined ? faelle[korrekturIdx].zeitstempel : new Date().toISOString()
    };
    if(korrekturIdx!==undefined) faelle[korrekturIdx]=eintrag; else faelle.push(eintrag);
    speichereFaelle(art, faelle);
    alertBanner('Gespeichert. Wird beim nächsten Sync automatisch an den PC übertragen.');
    setTimeout(ansichtStart, 900);
  };
}

/* ==========================================================
   Start
   ========================================================== */
themaAnwenden();
ansichtStart();

if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
