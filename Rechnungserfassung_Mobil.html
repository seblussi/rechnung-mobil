// =====================================================================
// BETA: Faktoren, Begruendungen und GOÄ-Katalog
// =====================================================================
// - Faktor je Position bearbeitbar (im erlaubten Gebuehrenrahmen der GOÄ).
//   Betrag = Punktzahl x Punktwert (5,82873 Cent) x Faktor, auf Cent
//   gerundet (§ 5 Abs. 1 GOÄ). Beim Standardfaktor bleibt es beim Betrag aus
//   der Excel-Vorlage.
// - Ueber dem Schwellenwert (2,3 / 1,8 / 1,15) ist eine Begruendung Pflicht
//   (§ 12 Abs. 3 GOÄ). Vorgeschlagen wird die zuletzt fuer diese Position
//   verwendete (geraeteuebergreifend in OneDrive), sonst die aus der Vorlage.
//   Leere Begruendung = keine Zeile "Begründung:" in der Rechnung.
// - Je Fall: positionsDetails = {faktoren:{ZIFFER:Zahl}, begruendungen:{ZIFFER:Text},
//   anzahl:{ZIFFER:n} (nur n >= 2), abgewaehlt:[ZIFFER] (automatische
//   Positionen, die wegen eines GOÄ-Ausschlusses bewusst abgewaehlt wurden)}

const GOAE_PW = (typeof GOAE_PUNKTWERT !== 'undefined') ? GOAE_PUNKTWERT : 0.0582873;
// Rahmen: Schwellenwert, Hoechstsatz, Schnellwahl
const GOAE_RAHMEN = {
  n: { schwelle: 2.3,  max: 3.5, stufen: [1, 2.3, 3.5] },
  t: { schwelle: 1.8,  max: 2.5, stufen: [1, 1.8, 2.5] },
  l: { schwelle: 1.15, max: 1.3, stufen: [1, 1.15, 1.3] },
  f: { schwelle: 1,    max: 1,   stufen: [1] }
};
// Falls der Katalog (goae_katalog.js) nicht geladen werden konnte: die in der
// Vorlage verwendeten Ziffern
const GOAE_NOTFALL = { '1':[80,'n'], '4':[220,'n'], '5':[80,'n'], '7':[160,'n'], '34':[300,'n'], '50':[320,'n'],
  '56':[180,'t'], '60':[120,'n'], '252':[40,'n'], '271':[120,'n'], '602':[152,'t'], '650':[152,'t'], '849':[230,'n'],
  '100':[1896,'f'], '101':[2844,'f'], '102':[474,'f'], 'E':[160,'f'], 'F':[260,'f'], 'G':[450,'f'], 'H':[340,'f'] };

function goaeNorm(z){ return String(z == null ? '' : z).trim().toUpperCase().replace(/\s+/g, ''); }
function goaeIndex(){
  if(!goaeIndex.m){
    const m = new Map();
    if(typeof GOAE_KATALOG !== 'undefined') GOAE_KATALOG.forEach(e=> m.set(goaeNorm(e[0]), e));
    goaeIndex.m = m;
  }
  return goaeIndex.m;
}
function goaeVerfuegbar(){ return typeof GOAE_KATALOG !== 'undefined' && GOAE_KATALOG.length > 0; }
// -> {nr, punkte, text, typ} oder null
function goaeEintrag(z){
  const k = goaeNorm(z); if(!k) return null;
  const e = goaeIndex().get(k);
  if(e) return { nr: e[0], punkte: e[1], text: e[2], typ: e[3] };
  const n = GOAE_NOTFALL[k];
  return n ? { nr: k, punkte: n[0], text: '', typ: n[1] } : null;
}
function goaeSuchen(text, max){
  const s = String(text || '').trim().toLowerCase();
  if(!s || !goaeVerfuegbar()) return [];
  const nur = goaeNorm(s);
  const treffer = [];
  for(const e of GOAE_KATALOG){
    const nr = String(e[0]).toLowerCase();
    let rang = -1;
    if(nr === s || goaeNorm(nr) === nur) rang = 0;
    else if(nr.indexOf(s) === 0) rang = 1;
    else if(s.length >= 3){ const p = e[2].toLowerCase().indexOf(s); if(p >= 0) rang = 2 + Math.min(p, 200) / 1000; }
    if(rang >= 0) treffer.push({ e, rang });
  }
  treffer.sort((a, b)=> a.rang - b.rang || String(a.e[0]).length - String(b.e[0]).length || String(a.e[0]).localeCompare(String(b.e[0]), 'de', { numeric: true }));
  return treffer.slice(0, max || 40).map(t=> ({ nr: t.e[0], punkte: t.e[1], text: t.e[2], typ: t.e[3] }));
}
function betaRund2(v){ return Math.round((Number(v) + (v >= 0 ? 1e-9 : -1e-9)) * 100) / 100; }
function betaFaktorText(f){ return String(Math.round(Number(f) * 100) / 100).replace('.', ','); }
function betaFaktorLesen(t){ const n = Number(String(t == null ? '' : t).trim().replace(',', '.')); return isNaN(n) ? NaN : Math.round(n * 100) / 100; }
function betaEuro(v){ return (Math.round(Number(v) * 100) / 100).toFixed(2).replace('.', ',') + ' €'; }

// ---------- Eigenschaften einer Position ----------
// p: Eintrag wie in den Rechnungspositionen ({ziffer, bez, betrag, faktor,
// eigene?, anzeigeZiffer?, punkte?})
function betaPosSchluessel(p){ return goaeNorm(p.ziffer); }
function betaPosNr(p){ return p.eigene ? goaeNorm(p.anzeigeZiffer) : goaeNorm(p.ziffer); }
function betaPosStandardFaktor(p){ const f = betaFaktorLesen(p.faktor); return isNaN(f) || f <= 0 ? 1 : f; }
function betaPosRahmen(p){
  const nr = betaPosNr(p);
  if(!p.eigene && (/^W[TN]\d/.test(nr) || nr === 'REISE' || nr === '')) return null;
  const e = goaeEintrag(nr);
  if(e) return { typ: e.typ, ...GOAE_RAHMEN[e.typ] };
  if(p.eigene) return String(p.faktor == null ? '' : p.faktor).trim() ? { typ: 'n', ...GOAE_RAHMEN.n } : null;
  return { typ: 'n', ...GOAE_RAHMEN.n };
}
function betaPosFaktorEditierbar(p){ const r = betaPosRahmen(p); return !!r && r.typ !== 'f'; }
function betaPosPunkte(p){
  if(p.eigene && Number(p.punkte) > 0) return Number(p.punkte);
  const e = goaeEintrag(betaPosNr(p));
  return e && e.punkte ? e.punkte : null;
}
// Einfachsatz (unrund) -- aus der Punktzahl, sonst aus Betrag/Faktor
function betaPosEinfachsatz(p){
  const pk = betaPosPunkte(p);
  if(pk) return pk * GOAE_PW;
  return Number(p.betrag) / betaPosStandardFaktor(p);
}
function betaPosBetrag(p, faktor){
  const f = betaFaktorLesen(faktor);
  if(isNaN(f) || Math.abs(f - betaPosStandardFaktor(p)) < 1e-9) return Number(p.betrag);
  const pk = betaPosPunkte(p);
  if(pk) return betaRund2(pk * GOAE_PW * f);
  return betaRund2(Number(p.betrag) / betaPosStandardFaktor(p) * f);
}

// ---------- Anzahl (mehrfach erbrachte Leistung) ----------
// Eine Leistung darf mehrfach berechnet werden, wenn sie mehrfach erbracht
// wurde (z.B. zwei Injektionen) -- bei Zeitleistungen steht es in der
// Leistungslegende ("je angefangene halbe Stunde", z.B. 56). Besuche,
// Leichenschau und Visiten gibt es je Inanspruchnahme nur einmal, Zuschlaege
// und Wegegeld ohnehin nur einmal.
const GOAE_NUR_EINMAL = /^(4[5-9]|5[0-5]|10[0-7]|435)$/;
// Anmerkung vor Nr. 270 ff.: 270, 273-281, 283, 286, 287 je Behandlungstag
// nur einmal; 271/272 je Gefaesszugang einmal, hoechstens zweimal
const GOAE_TAG_MAX = { '270':1, '273':1, '274':1, '275':1, '276':1, '277':1, '278':1, '279':1, '280':1, '281':1, '283':1, '286':1, '287':1, '271':2, '272':2 };
function betaPosAnzahlRegel(p){
  if(!p || !betaPosFaktorEditierbar(p)) return null;
  const nr = betaPosNr(p);
  if(!nr || GOAE_NUR_EINMAL.test(nr) || GOAE_TAG_MAX[nr] === 1) return null;
  const e = goaeEintrag(nr);
  const m = e && /je (angefangene|weitere|vollendete)[^,;]*$/i.exec(String(e.text || '').trim());
  return { je: m ? m[0] : '', max: GOAE_TAG_MAX[nr] || 99,
           hinweis: GOAE_TAG_MAX[nr] ? 'Laut GOÄ je Gefäßzugang einmal, höchstens ' + GOAE_TAG_MAX[nr] + '-mal je Behandlungstag (gesonderte Punktionen verschiedener Gefäße).' : '' };
}
function betaAnzahlVon(details, k){
  const n = details && details.anzahl ? Math.floor(Number(details.anzahl[k])) : 1;
  return n >= 2 ? Math.min(n, 99) : 1;
}

// ---------- Begruendung immer Pflicht (unabhaengig vom Faktor) ----------
// 56 (Verweilen, je angefangene halbe Stunde): Uhrzeit "von bis" muss in
// der Rechnung stehen; die Anzahl ergibt sich daraus.
const GOAE_BEGR_IMMER = { '56': 'zeit' };
function betaBegrImmer(p){ return !!(p && GOAE_BEGR_IMMER[betaPosNr(p)]); }
// Allg. Bestimmung 3 zu Abschnitt B: 1, 3, 5, 6, 7, 8 mehrmals an demselben
// Tag nur wenn geboten, mit Uhrzeit; bei 3 generell zu begruenden
const GOAE_MEHRFACH_TAG = ['1', '3', '5', '6', '7', '8'];
// Warum ist die Begruendung Pflicht? '' = nicht Pflicht
//  zeit (56), faktor (ueber Schwellenwert), mehrfach (Anzahl > 1 bei 1/3/5-8),
//  fall (laut Uebersicht im Behandlungsfall schon berechnet, z.B. Nr. 3)
function betaBegrPflicht(p, faktor, anzahl, det){
  if(!p) return '';
  const r = betaPosRahmen(p); if(!r) return '';
  if(betaBegrImmer(p)) return 'zeit';
  if(Number(faktor) > r.schwelle + 1e-9) return 'faktor';
  if(Number(anzahl) > 1 && GOAE_MEHRFACH_TAG.includes(betaPosNr(p))) return 'mehrfach';
  if(det && det.pflichtGrund && det.pflichtGrund[betaPosSchluessel(p)]) return 'fall';
  return '';
}
function betaBegrPflichtText(grund, p, det){
  if(grund === 'mehrfach') return 'Pflicht bei mehrfacher Berechnung am selben Tag – bitte mit Uhrzeiten, z. B. „erneute Beratung um 23:40 wegen …“';
  if(grund === 'fall') return 'Pflicht: ' + ((det && det.pflichtGrund && det.pflichtGrund[betaPosSchluessel(p)]) || 'mehrfache Berechnung im Behandlungsfall');
  return '';
}
function betaZeitAusBegr(t){
  const m = /(\d{1,2})[:.](\d{2})\s*(?:Uhr)?\s*(?:bis|-|–)\s*(\d{1,2})[:.](\d{2})/i.exec(String(t || ''));
  return m ? { von: zz2(+m[1]) + ':' + m[2], bis: zz2(+m[3]) + ':' + m[4] } : null;
}
function betaZeitMinuten(von, bis){
  const a = /^(\d{1,2}):(\d{2})$/.exec(von || ''), b = /^(\d{1,2}):(\d{2})$/.exec(bis || '');
  if(!a || !b) return NaN;
  let d = (+b[1] * 60 + +b[2]) - (+a[1] * 60 + +a[2]);
  if(d <= 0) d += 24 * 60;
  return d;
}
// unter 30 Minuten nicht berechnungsfaehig, ab 30 Minuten 1x, ab 60 Minuten 2x usw.
function betaAnzahl56(min){ return isNaN(min) ? NaN : Math.floor(min / 30); }
// Beginn des Verweilens = Uhrzeit des Besuchs (aus der Maske)
function betaBesuchUhrzeit(){
  const t = String((window.betaPosKontext || {}).zeit || '').trim();
  return /^\d{1,2}:\d{2}$/.test(t) ? zz2(+t.split(':')[0]) + ':' + t.split(':')[1] : '';
}
// ---------- Ziffer 7: Organsystem (wie am PC) ----------
const GOAE_VARIANTEN = { '7': ['Brustorganen', 'Bauchorganen', 'Stütz- und Bewegungsorganen', 'Hautorgan'] };
function betaVarianten(p){ return (p && !p.eigene && GOAE_VARIANTEN[betaPosNr(p)]) || null; }
function betaVarianteErsetzen(text, liste, neu){
  let t = String(text || '');
  for(const v of liste){ if(t.indexOf(v) >= 0) return t.replace(v, neu); }
  return t;
}
function betaBezMitVariante(p, det){
  const liste = betaVarianten(p);
  const v = liste && det && det.varianten ? det.varianten[betaPosSchluessel(p)] : '';
  return v ? betaVarianteErsetzen(p.bez, liste, v) : p.bez;
}

// ---------- Begruendungs-Vorlagen (zuletzt verwendet) ----------
// Liegen zusaetzlich in eigene_positionen.json (Feld "begruendungen"),
// Schluessel "art:ZIFFER" -> {text, am}
function betaBegrVorlagen(){ return betaEigeneDatenVoll().begruendungen || {}; }
function betaBegrVorlage(art, schl){ const v = betaBegrVorlagen()[art + ':' + goaeNorm(schl)]; return v ? v : null; }
// Gemerkt wird der zuletzt verwendete Text; wurde die Begruendung zuletzt
// bewusst leer gelassen, steht zusaetzlich "leer" (der Text bleibt als
// Vorschlag erhalten, z.B. wenn der Faktor spaeter wieder hoch geht).
function betaBegrVorlagenSpeichern(art, map){
  const jetzt = new Date().toISOString();
  const aend = {};
  Object.keys(map).forEach(k=>{
    const alt = betaBegrVorlage(art, k);
    const t = String(map[k] || '').trim();
    const neu = t ? { text: t, leer: false } : { text: (alt && alt.text) || '', leer: true };
    if(!alt || alt.text !== neu.text || !!alt.leer !== neu.leer) aend[art + ':' + goaeNorm(k)] = { ...neu, am: jetzt };
  });
  if(!Object.keys(aend).length) return;
  const anwenden = d=>{ d.begruendungen = { ...(d.begruendungen || {}), ...aend }; };
  const d = betaEigeneDatenVoll(); anwenden(d); LS.set(EIGENE_POS_CACHE, d);
  if(msGraphStatus === 'angemeldet') betaEigeneAbgleichen(anwenden).catch(()=>{});
}
// Standard-Begruendung einer Position: zuletzt verwendet > Vorlage > leer
// (legacy = bereits gestellte Rechnung ohne gespeicherte Details: dort gilt
// die Begruendung, die auch in der Rechnung steht -- die aus der Vorlage)
function betaPosStandardBegruendung(art, p, legacy){
  if(legacy) return String(p.begruendung || '');
  // 56: Uhrzeit gehoert zu genau diesem Fall -- nie aus einem frueheren uebernehmen
  if(betaBegrImmer(p)) return '';
  const v = betaBegrVorlage(art, betaPosSchluessel(p));
  if(v){
    // Pflicht schon beim Standardfaktor -> immer den letzten Text vorschlagen
    const r = betaPosRahmen(p);
    const pflicht = r && betaPosStandardFaktor(p) > r.schwelle + 1e-9;
    return (v.leer && !pflicht) ? '' : (v.text || String(p.begruendung || ''));
  }
  return String(p.begruendung || '');
}

// ---------- Details eines Falls ----------
function betaSetMitDetails(arr, details, legacy){
  const s = new Set(arr || []);
  if(details) s.details = JSON.parse(JSON.stringify(details));
  else if(legacy) s.legacy = true;
  return s;
}
function betaKatalogFlach(art){ return allePositionenFlach(art === 'ls' ? POSITIONEN_LS : POSITIONEN_PT); }
// Vollstaendige Details fuer die ausgewaehlten Positionen (Standardwerte
// ergaenzt). Positionen ohne bearbeitbaren Faktor bekommen keinen Eintrag.
function betaDetailsVervollstaendigen(art, auswahl, details, alle, legacy){
  alle = alle || betaKatalogFlach(art);
  const d = { faktoren: {}, begruendungen: {}, anzahl: {}, abgewaehlt: [], behalten: [] };
  const alt = details || {};
  const liste = auswahl ? Array.from(auswahl) : [];
  liste.forEach(z=>{
    const p = alle.find(x=> goaeNorm(x.ziffer) === goaeNorm(z));
    if(!p || !betaPosFaktorEditierbar(p)) return;
    const k = betaPosSchluessel(p);

    });

    if(zeitModus) zeitAktual();

    if(akt !== 'ja'){ betaOverlay.schliessen(); return null; }

    if(zeitModus && isNaN(betaZeitMinuten(w.von, w.bis))) fehler = 'Bitte das Ende des Verweilens eintragen – die Uhrzeit muss in der Rechnung stehen.';
    else if(zeitModus && betaZeitMinuten(w.von, w.bis) > 600) fehler = 'Mehr als 10 Stunden Verweilen? Bitte die Endzeit prüfen.';

    else if(isNaN(n)) fehler = 'Bitte eine Anzahl zwischen 1 und ' + maxN + ' eintragen.';
    else if(isNaN(f) || f < 1) fehler = 'Bitte einen Faktor wählen.';
    else if(f > r.max + 1e-9) fehler = 'Höchstens ' + betaFaktorText(r.max) + ' – darüber nur mit schriftlicher Honorarvereinbarung (§ 2 GOÄ).';

    else if(!w.beg && opt.pflichtGrund) fehler = 'Begründung ist Pflicht: ' + opt.pflichtGrund + '.';
    else {

      if(!zeitModus && w.beg) betaBegrKatalogAendern(art, [{ schl, text: w.beg }]);
      return { faktor: f, begruendung: w.beg, anzahl: n, variante: varListe ? w.variante : undefined };
    }
  }
}

// ---------- GOÄ-Ausschluesse ("neben ... nicht berechnungsfähig") ----------
function goaeAusschluesse(nr){
  const k = goaeNorm(nr);
  if(typeof GOAE_AUSSCHLUESSE === 'undefined' || !k) return [];
  return GOAE_AUSSCHLUESSE[k] || [];
}
// Positionen aus "andere", die neben p laut GOÄ nicht berechnet werden duerfen
// Zusaetzlich aus dem Text der GOÄ, ohne Ziffer: neben 52 ist Wegegeld
// (und damit auch die Reiseentschaedigung) nicht berechnungsfaehig
const GOAE_OHNE_WEGEGELD = ['52'];
// Anmerkung zu Nr. 3: "nur berechnungsfähig als einzige Leistung oder im
// Zusammenhang mit einer Untersuchung nach den Nummern 5, 6, 7, 8, 800 oder
// 801" (Zuschlaege A-D bleiben erlaubt, sie haben keine Nummer)
const GOAE_NR3_NEBEN = ['5', '6', '7', '8', '800', '801'];
const nr3Konflikt = (a, b)=> a === '3' && /^\d+$/.test(b) && b !== '3' && !GOAE_NR3_NEBEN.includes(b);
const istWegegeld = (nr)=> /^(W[TN]\d+|REISE)$/.test(nr);
function betaGoaeKonflikte(p, andere){
  const nr = betaPosNr(p);
  if(!nr) return [];
  const aus = goaeAusschluesse(nr);
  return andere.filter(q=>{
    if(q === p || q.ziffer === p.ziffer) return false;
    const qn = betaPosNr(q);
    if((GOAE_OHNE_WEGEGELD.includes(nr) && istWegegeld(qn)) || (GOAE_OHNE_WEGEGELD.includes(qn) && istWegegeld(nr))) return true;
    if(nr3Konflikt(nr, qn) || nr3Konflikt(qn, nr)) return true;
    return aus.includes(qn) || goaeAusschluesse(qn).includes(nr);
  });
}
// Automatik (Uhrzeit/Datum/km geaendert) will eine Position neu setzen, die
// laut GOÄ neben einer gewaehlten nicht berechnungsfaehig ist -> nicht setzen
// und als "abgewaehlt" vermerken. Ausnahme: der Ausschluss wurde bewusst mit
// "Beide behalten" bestaetigt (details.behalten).
function betaAutoGoaeSperre(art, z, auswahl){
  const alle = betaKatalogFlach(art);
  const p = alle.find(x=> goaeNorm(x.ziffer) === goaeNorm(z));
  if(!p) return false;
  const andere = Array.from(auswahl).map(y=> alle.find(x=> goaeNorm(x.ziffer) === goaeNorm(y))).filter(Boolean);
  const k = betaGoaeKonflikte(p, andere);
  if(!k.length) return false;
  const beh = ((auswahl.details || {}).behalten || []).map(goaeNorm);
  if(beh.includes(goaeNorm(z)) || k.every(q=> beh.includes(goaeNorm(q.ziffer)))) return false;
  const d = auswahl.details;
  if(d){ d.abgewaehlt = d.abgewaehlt || []; if(!d.abgewaehlt.includes(goaeNorm(z))) d.abgewaehlt.push(goaeNorm(z)); }
  return true;
}
function betaPosAnzeigeNr(p){ return p.anzeigeZiffer !== undefined ? (p.anzeigeZiffer || '(ohne Ziffer)') : p.ziffer; }

// ---------- Ansicht "Rechnungspositionen" ----------

  const katalog = art==='ls' ? POSITIONEN_LS : POSITIONEN_PT;

  const reiseBez = reise.kmGerundet>0
    ? `${REISEENTSCHAEDIGUNG.bez} (${reise.basis.toFixed(2).replace('.',',')} &euro;) + Wegstrecke ${reise.kmGerundet} km &times; 0,26 &euro;/km (${reise.kmZeile.toFixed(2).replace('.',',')} &euro;)`

  const AUTO_SCHL = (z)=> betaIstZuschlagsSchluessel(z) || /^W[TN]\d/.test(z) || z === 'REISE';

  const geordnet0 = betaGruppenOrdnen(art, grundStd, betaEigene(art).map(betaEigenePositionAlsAuswahl));

  const start56 = betaBesuchUhrzeit();

    const [sh, sm] = start56.split(':').map(Number), e = (sh * 60 + sm + dauer) % 1440;

  });
  // automatische Position bewusst abgewaehlt (GOÄ-Ausschluss) -> bleibt aus

  const profile = betaProfile(art), profilId = betaProfilAktivId(art);

      const akt = await betaOverlay.ergebnis('Ziffer ' + betaPosAnzeigeNr(p) + ' schon gewählt',
        htmlEsc('Ziffer ' + betaPosAnzeigeNr(p) + ' ist bereits gewählt.') + '<br><br><span class="beta-erg-klein">' +
        (regel ? htmlEsc('Wurde die Leistung mehrfach erbracht' + (regel.je ? ' (' + regel.je + ')' : '') + ', die Anzahl erhöhen – sie steht dann entsprechend oft in der Rechnung.')
               : htmlEsc('Diese Leistung ist je Inanspruchnahme nur einmal berechnungsfähig.')) + '</span>', knoepfe);
      betaOverlay.schliessen();
      if(akt === 'nein'){ cb.checked = false; return; }
      if(akt === 'anzahl'){ cb.checked = false; det.anzahl[betaPosSchluessel(q)] = anzahlVon(q) + 1; return; }
    }
    const k = betaGoaeKonflikte(p, gewaehltePositionen());
    if(!k.length) return;
    const automatisch = k.filter(q=>{ const c = boxVon(q); return c && c.disabled; });
    const liste = k.map(betaPosAnzeigeNr).join(', ');
    const knoepfe = [{ label: 'Abbrechen', akt: 'nein' }, { label: 'Beide behalten', akt: 'beide' },
                     { label: liste + ' abwählen', akt: 'tauschen', primaer: true }];
    const akt = await betaOverlay.ergebnis('Ausschluss laut GOÄ',
      htmlEsc('Ziffer ' + betaPosAnzeigeNr(p) + ' ist laut GOÄ neben ' + liste + ' nicht berechnungsfähig.') +
      (automatisch.length ? '<br><br><span class="beta-erg-klein">' + htmlEsc(automatisch.map(betaPosAnzeigeNr).join(', ') +
        (automatisch.length === 1 ? ' ist' : ' sind') + ' automatisch gesetzt. Beim Abwählen ' + (automatisch.length === 1 ? 'bleibt sie' : 'bleiben sie') +
        ' für diese Rechnung draußen (auch wenn sich Uhrzeit oder km ändern) und ' + (automatisch.length === 1 ? 'lässt' : 'lassen') + ' sich hier wieder anhaken.') + '</span>' : ''), knoepfe);
    betaOverlay.schliessen();
    if(akt === 'nein') cb.checked = false;
    else if(akt === 'beide') [p, ...k].forEach(q=>{ const z = goaeNorm(q.ziffer); if(!det.behalten.includes(z)) det.behalten.push(z); });
    else if(akt === 'tauschen'){
      k.forEach(q=>{ const c = boxVon(q); if(c) c.checked = false; });
      automatisch.forEach(q=>{ const z = goaeNorm(q.ziffer); if(!det.abgewaehlt.includes(z)) det.abgewaehlt.push(z); });
      if(automatisch.length) return 'neu';
    }
  }
  function positionAktualisieren(){ ausschluesseAktualisieren(); zusatzZeichnen(); konflikteZeichnen(); summeBerechnen(); }
  const gewaehltJetzt = ()=>{
    const set = new Set(Array.from(app.querySelectorAll('.position-zeile input:checked')).map(cb=> cb.dataset.ziffer));
    set.details = det; return set;
  };
  const neuZeichnen = (set)=>{ const y = window.scrollY; ansichtPositionen(art, set || gewaehltJetzt(), betragSchaetzung, weiter, kmFahrstreckeGesamt); window.scrollTo(0, y); };
  // Nach Aenderung der gewaehlten Leistungen: Zeitzuschlaege (A-D/E-H) und
  // Wegegeld neu bestimmen -- wie die Automatik in der Maske
  const automatikNachziehen = ()=>{
    const kx = window.betaPosKontext;
    const jetzt = gewaehltJetzt();
    const manuell = new Set(Array.from(jetzt).filter(z=> !AUTO_SCHL(z)));
    let auto;
    if(kx){
      const roh = automatischeAuswahlRoh(katalog, kx.datum, kx.zeit, kx.kmFahrstrecke, kx.kmLuftlinie, kx.modus);
      auto = Array.from(betaAutoAnpassen(art, roh, manuell)).filter(z=> AUTO_SCHL(z) && !det.abgewaehlt.includes(goaeNorm(z)));
    } else {
      // ohne Maskenwerte: vorhandene Automatik in die passende Familie umsetzen
      auto = Array.from(betaAutoAnpassen(art, new Set(Array.from(jetzt).filter(z=> AUTO_SCHL(z) && z !== 'EIGZA').map(z=> ({EIGZB:'F', EIGZC:'G', EIGZD:'H'})[z] || z)), manuell)).filter(AUTO_SCHL);
    }
    const neu = new Set([...manuell, ...auto]); neu.details = det;
    const gleich = neu.size === jetzt.size && [...neu].every(z=> jetzt.has(z));
    if(!gleich || betaZuschlagFamilie(art, manuell) !== familie || betaBesuchDabei(art, manuell) !== besuch){ neuZeichnen(neu); return true; }
    return false;
  };
  app.querySelectorAll('.profil-chip').forEach(b=> b.onclick = ()=>{
    const p = betaProfile(art).find(x=> x.id === b.dataset.profil); if(!p) return;
    betaProfilWaehlen(art, p.id);
    det.abgewaehlt = []; det.behalten = [];
    betaProfilDetailsAnwenden(art, det, p, true);
    const neu = new Set(p.vorauswahl); neu.details = det;
    ansichtPositionen(art, neu, betragSchaetzung, weiter, kmFahrstreckeGesamt);
    automatikNachziehen();
  });
  betaPosZiehen(app, (gr)=>{
    betaAnordnungSpeichern(art, { grund: gr.grund || [], eigene: gr.eigene || [] });
    neuZeichnen();
  });
  app.querySelectorAll('.position-zeile input').forEach(cb=> cb.addEventListener('change', async ()=>{
    const zeile = cb.closest('.position-zeile');
    // bewusst abgewaehlte Automatik-Position wieder angehakt -> wieder automatisch
    if(cb.checked && zeile && zeile.dataset.autoAus === '1'){
      const z = goaeNorm(cb.dataset.ziffer);
      det.abgewaehlt = det.abgewaehlt.filter(x=> x !== z);
      await konfliktPruefen(cb);
      if(!cb.checked && !det.abgewaehlt.includes(z)) det.abgewaehlt.push(z);
      neuZeichnen(); return;
    }
    if(cb.checked && await konfliktPruefen(cb) === 'neu'){ neuZeichnen(); return; }
    if(cb.dataset.auto !== '1' && automatikNachziehen()) return;
    positionAktualisieren();
    // 56 angehakt: gleich nach dem Ende des Verweilens fragen
    const p56 = cb.checked && posVon(cb.dataset.ziffer);
    if(p56 && betaBegrImmer(p56) && !String(begrVon(p56) || '').trim()){
      const el = cb.closest('.position-zeile').querySelector('.pos-zusatz');
      if(el) el.click();
    }
  }));
  positionAktualisieren();
  betaEigenePositionenVerdrahten(art, (neuId, entferntId)=>{
    const set = gewaehltJetzt();
    if(neuId){ set.add(neuId); set.pruefen = neuId; }
    if(entferntId) set.delete(entferntId);
    ansichtPositionen(art, set, betragSchaetzung, weiter, kmFahrstreckeGesamt);
  });
  // neu angelegte eigene Position ist gleich angehakt -> Ausschluesse pruefen
  if(ausgewaehlteZiffern && ausgewaehlteZiffern.pruefen){
    const cb = app.querySelector('.position-zeile input[data-ziffer="' + CSS.escape(ausgewaehlteZiffern.pruefen) + '"]');
    if(cb && cb.checked) setTimeout(async ()=>{ if(await konfliktPruefen(cb) === 'neu') neuZeichnen(); else positionAktualisieren(); }, 0);
  }

  document.getElementById('btnPositionenFertig').onclick = async ()=>{
    const gewaehlt = gewaehltJetzt();
    const voll = betaDetailsVervollstaendigen(art, gewaehlt, det, alle, legacy);
    const fehlt = betaBegruendungFehlt(art, gewaehlt, voll, alle);
    if(fehlt.length){
      app.querySelectorAll('.beg-text.fehlt').forEach(el=> el.closest('.position-zeile').scrollIntoView({behavior:'smooth', block:'center'}));
      await betaOverlay.meldung('Bitte noch eine Begründung eintragen für: ' + betaFehltText(fehlt) + '.\n\nPflicht über dem Schwellenwert (§ 12 Abs. 3 GOÄ) und laut GOÄ bei mehrfacher Berechnung (1, 3, 5–8 mehrmals am selben Tag).', 'Begründung fehlt');
      return;
    }
    // zuletzt verwendete Begruendungen als Vorlage merken (nur wo sie gedruckt werden)
    const vorl = {};
    Object.keys(voll.begruendungen).forEach(k=>{
      const p = alle.find(x=> betaPosSchluessel(x) === k), r = p && betaPosRahmen(p);
      if(r && voll.faktoren[k] > r.schwelle + 1e-9 && String(voll.begruendungen[k] || '').trim()) vorl[k] = voll.begruendungen[k];
    });
    betaBegrVorlagenSpeichern(art, vorl);
    // ... und im Katalog frueherer Begruendungen sammeln (bei 56 ohne die Uhrzeit)
    const kat = [];
    Object.keys(voll.begruendungen).forEach(k=>{
      const p = alle.find(x=> betaPosSchluessel(x) === k), r = p && betaPosRahmen(p);
      if(!r || !(voll.faktoren[k] > r.schwelle + 1e-9 || betaBegrImmer(p))) return;
      let t = String(voll.begruendungen[k] || '').trim();
      if(betaBegrImmer(p)) return; // 56: nur Uhrzeit
      if(t) kat.push({ schl: k, text: t });
    });
    betaBegrKatalogAendern(art, kat);
    gewaehlt.details = voll;
    let summe=0;
    Array.from(gewaehlt).forEach(z=>{ const p = posVon(z); if(p) summe += betragVon(p); });
    weiter(gewaehlt, Math.round(summe * 100) / 100);
  };
}

// =====================================================================
// Rechnungspositionen: eingebaute Zusatzpositionen, Profile mit
// Vorauswahl, Anordnung (Ziehen), Zuschlagsfamilien, eigene Faktoren,
// Katalog frueherer Begruendungen
// =====================================================================
// Alles, was geraeteuebergreifend gleich sein soll, liegt zusaetzlich in
// eigene_positionen.json (Felder profile, anordnung, faktoren, begrKatalog).

// ---------- Eingebaute Zusatzpositionen ----------
// Stehen nicht in der Excel-Vorlage. Sie werden wie eigene Positionen
// behandelt (Kennung EIG...), damit Word-Erzeugung und PC sie genauso
// einfuegen wie von Hand angelegte. Betrag = Punkte x Punktwert x Faktor.
const GOAE_FEST = {
  pt: [
    { id:'EIGP3',  ziffer:'3', bez:'Eingehende, das gewöhnliche Maß übersteigende Beratung (mind. 10 Minuten)', gruppe:'grund' },
    { id:'EIGZA', ziffer:'A', bez:'Zuschlag für außerhalb der Sprechstunde erbrachte Leistungen', gruppe:'zuschlag', familie:'AD' },
    { id:'EIGZB', ziffer:'B', bez:'Zuschlag für zwischen 20 und 22 Uhr oder 6 und 8 Uhr außerhalb der Sprechstunde erbrachte Leistungen', gruppe:'zuschlag', familie:'AD' },
    { id:'EIGZC', ziffer:'C', bez:'Zuschlag für zwischen 22 und 6 Uhr erbrachte Leistungen', gruppe:'zuschlag', familie:'AD' },
    { id:'EIGZD', ziffer:'D', bez:'Zuschlag für an Samstagen, Sonn- oder Feiertagen erbrachte Leistungen', gruppe:'zuschlag', familie:'AD' },
    { id:'EIGZE', ziffer:'E', bez:'Zuschlag für dringend angeforderte und unverzüglich erfolgte Ausführung', gruppe:'zuschlag', familie:'EH', manuell:true }
  ],
  ls: [
    { id:'EIGL100', ziffer:'100', bez:'Untersuchung eines Toten und Ausstellung einer vorläufigen Todesbescheinigung (vorläufige Leichenschau)', gruppe:'grund' },
  ]
};
// automatisch gesetzte Zuschlaege der Familie A-D (entsprechen F/G/H)
const ZUSCHLAG_AD = { F:'EIGZB', G:'EIGZC', H:'EIGZD' };
function betaFestPositionen(art){
  return (GOAE_FEST[art] || []).map(f=>{
    const e = goaeEintrag(f.ziffer) || { punkte: 0, typ: 'f' };
    const faktor = e.typ === 'n' ? 2.3 : e.typ === 't' ? 1.8 : e.typ === 'l' ? 1.15 : 1;
    return { id: f.id, ziffer: f.ziffer, faktor: String(faktor).replace('.', ','), bez: f.bez, punkte: e.punkte || null,
             betrag: betaRund2((e.punkte || 0) * GOAE_PW * faktor), fest: true, gruppe: f.gruppe, familie: f.familie || null, manuell: !!f.manuell,
             angelegt: '', geaendert: '' };
  });
}
function betaFestPos(art, id){ return betaFestPositionen(art).find(p=> p.id === id) || null; }

// ---------- Zuschlagsfamilie ----------
// GOÄ: Zuschlaege A-D (und K1) gehoeren zu Beratungen/Untersuchungen nach
// 1, 3, 4, 5, 6, 7, 8; E-H (J, K2) zu den Besuchen 45-62 und zur
// Leichenschau 100/101. Neben E-J duerfen A-D nicht berechnet werden --
// sobald ein Besuch dabei ist, gelten also E-H.
function betaNrVonSchluessel(art, z){
  const k = String(z || '');
  if(/^EIG/i.test(k)){
    const p = betaEigeneAlle(art).find(x=> x.id === k);
    return p ? goaeNorm(p.ziffer) : '';
  }
  return goaeNorm(k);
}
function betaIstZuschlagsSchluessel(z){ return ['F','G','H','EIGZA','EIGZB','EIGZC','EIGZD'].includes(String(z)); }
function betaZuschlagFamilie(art, auswahl){
  const nrs = Array.from(auswahl || []).filter(z=> !betaIstZuschlagsSchluessel(z)).map(z=> betaNrVonSchluessel(art, z));
  const zahl = (n)=> /^\d+$/.test(n) ? Number(n) : NaN;
  if(nrs.some(n=> (zahl(n) >= 45 && zahl(n) <= 62) || n === '100' || n === '101')) return 'EH';
  if(nrs.some(n=> ['1','3','4','5','6','7','8'].includes(n))) return 'AD';
  return null;
}
// Wegegeld/Reiseentschaedigung nur bei einem Besuch bzw. einer Leichenschau
function betaBesuchDabei(art, auswahl){
  return Array.from(auswahl || []).some(z=> ['48','50','51','55','100','101'].includes(betaNrVonSchluessel(art, z)));
}
// roh: Ergebnis der Automatik (F/G/H, Wegegeld, ...); basis: die gewaehlten
// Positionen, nach denen sich die Familie richtet
function betaAutoAnpassen(art, roh, basis){
  const fam = betaZuschlagFamilie(art, basis);
  const besuch = betaBesuchDabei(art, basis);
  const out = new Set();
  // A (ausserhalb der Sprechstunde) nur, wenn B, C und D nicht zutreffen --
  // im Bereitschaftsdienst also werktags tagsueber
  const zeitZuschlag = Array.from(roh || []).some(z=> ['F','G','H'].includes(z));
  if(fam === 'AD' && art === 'pt' && !zeitZuschlag) out.add('EIGZA');
  Array.from(roh || []).forEach(z=>{
    if(['F','G','H'].includes(z)){
      if(fam === 'EH') out.add(z);
      else if(fam === 'AD' && art === 'pt') out.add(ZUSCHLAG_AD[z]);
      return;
    }
    if(/^W[TN]\d/.test(z) || z === 'REISE'){ if(besuch) out.add(z); return; }
    out.add(z);
  });
  return out;
}

// ---------- Profile (Vorauswahl) ----------
const PROFILE_STANDARD = {
  pt: [ { id:'fahrdienst', name:'Fahrdienst', vorauswahl:['50'] },
        { id:'sitzdienst', name:'Sitzdienst', vorauswahl:['1','5'] },
        { id:'telefon',    name:'Telefonische Beratung', vorauswahl:['1'] } ],
  ls: [ { id:'leichenschau', name:'Leichenschau', vorauswahl:['101','102'] } ]
};
function betaProfileDaten(){ const d = LS.get(EIGENE_POS_CACHE, null) || {}; return d.profile || {}; }
function betaProfile(art){
  const eigene = (betaProfileDaten()[art] || []);
  const m = new Map();
  PROFILE_STANDARD[art].forEach(p=> m.set(p.id, { ...p, standard: true }));
  eigene.forEach(p=>{ if(p && p.id) m.set(p.id, { ...(m.get(p.id) || {}), ...p }); });
  return [...m.values()].filter(p=> !p.geloescht);
}
function betaProfilAktivId(art){
  const e = ladeEinstellungen();
  const id = (e.profilAktiv || {})[art];
  const liste = betaProfile(art);
  return liste.some(p=> p.id === id) ? id : (liste[0] ? liste[0].id : null);
}
function betaProfilAktiv(art){ const id = betaProfilAktivId(art); return betaProfile(art).find(p=> p.id === id) || null; }
function betaProfilWaehlen(art, id){ const e = ladeEinstellungen(); e.profilAktiv = { ...(e.profilAktiv || {}), [art]: id }; speichereEinstellungen(e); }
function betaProfilVorauswahl(art){
  const p = betaProfilAktiv(art);
  const gibt = new Set(betaKatalogFlach(art).map(x=> x.ziffer));
  return (p ? p.vorauswahl : []).filter(z=> gibt.has(z));
}
async function betaProfilSpeichern(art, profil){
  const jetzt = new Date().toISOString();
  const anwenden = d=>{
    d.profile = d.profile || {};
    const liste = (d.profile[art] || []).filter(x=> x.id !== profil.id);
    liste.push({ ...profil, geaendert: jetzt });
    d.profile[art] = liste;
  };
  // erst lokal (sofort sichtbar), dann im Hintergrund mit OneDrive abgleichen
  const d = betaEigeneDatenVoll(); anwenden(d); LS.set(EIGENE_POS_CACHE, d);
  if(typeof msGraphStatus !== 'undefined' && msGraphStatus === 'angemeldet') betaEigeneAbgleichen(anwenden).catch(()=>{});
}

// ---------- Anordnung (lang druecken + ziehen) ----------
// {pt: {grund:[...], eigene:[...], am}, ls: {...}} -- nur die Reihenfolge
// und Gruppe der waehlbaren Positionen; Zuschlaege/Wegegeld bleiben fest.
// Jedes Profil kann seine eigene Reihenfolge haben; sonst gilt die allgemeine.
function betaAnordnung(art){
  const pr = typeof betaProfilAktiv === 'function' ? betaProfilAktiv(art) : null;
  if(pr && pr.anordnung) return pr.anordnung;
  const d = LS.get(EIGENE_POS_CACHE, null) || {}; return (d.anordnung || {})[art] || null;
}
async function betaAnordnungSpeichern(art, gruppen){
  const neu = { ...gruppen, am: new Date().toISOString() };
  // Ziehen in den Rechnungspositionen gilt fuer das aktive Profil
  const pr = typeof betaProfilAktiv === 'function' ? betaProfilAktiv(art) : null;
  if(pr){ const { standard, ...rest } = pr; await betaProfilSpeichern(art, { ...rest, anordnung: neu }); return; }
  const anwenden = d=>{ d.anordnung = { ...(d.anordnung || {}), [art]: neu }; };
  const lokal = betaEigeneDatenVoll(); anwenden(lokal); LS.set(EIGENE_POS_CACHE, lokal);
  if(msGraphStatus === 'angemeldet') betaEigeneAbgleichen(anwenden).catch(()=>{});
}
// Verteilt die Positionen auf "grund" und "eigene" -- in der gemerkten
// Reihenfolge; Neues landet am Ende seiner ueblichen Gruppe.
function betaGruppenOrdnen(art, grundStandard, eigeneStandard, layVorgabe){
  const alle = new Map([...grundStandard, ...eigeneStandard].map(p=> [p.ziffer, p]));
  const lay = layVorgabe !== undefined ? layVorgabe : betaAnordnung(art);
  const out = { grund: [], eigene: [] };
  const genutzt = new Set();
  if(lay){
    ['grund', 'eigene'].forEach(g=> (lay[g] || []).forEach(k=>{ if(alle.has(k) && !genutzt.has(k)){ out[g].push(alle.get(k)); genutzt.add(k); } }));
  }
  grundStandard.forEach(p=>{ if(!genutzt.has(p.ziffer)){ out.grund.push(p); genutzt.add(p.ziffer); } });
  eigeneStandard.forEach(p=>{ if(!genutzt.has(p.ziffer)){ out.eigene.push(p); genutzt.add(p.ziffer); } });
  return out;
}
// Lang druecken -> Zeile anheben und an eine andere Stelle oder in die
// andere Gruppe ziehen. Finger (Touch) und Maus.
function betaPosZiehen(wurzel, beimAblegen, scroller){
  const items = ()=> Array.from(wurzel.querySelectorAll('.pos-item[data-drag]'));
  let aktiv = null;
  const beginnen = (item, x, y)=>{
    const r = item.getBoundingClientRect();
    const geist = item.cloneNode(true);
    geist.classList.add('pos-geist');
    geist.style.width = r.width + 'px'; geist.style.left = r.left + 'px'; geist.style.top = r.top + 'px';
    document.body.appendChild(geist);
    const platz = document.createElement('div');
    platz.className = 'pos-platz'; platz.style.height = r.height + 'px';
    item.parentNode.insertBefore(platz, item);
    item.classList.add('pos-gezogen');
    aktiv = { item, geist, platz, dy: y - r.top, x0: x };
    document.body.classList.add('pos-zieht');
    try{ navigator.vibrate && navigator.vibrate(15); }catch(_){}
  };
  const bewegen = (y)=>{
    if(!aktiv) return;
    aktiv.geist.style.top = (y - aktiv.dy) + 'px';
    // Ziel: vor der ersten Zeile, deren Mitte unter dem Finger liegt
    const kandidaten = items().filter(i=> i !== aktiv.item);
    let vor = null;
    for(const i of kandidaten){ const r = i.getBoundingClientRect(); if(y < r.top + r.height / 2){ vor = i; break; } }
    const gruppen = Array.from(wurzel.querySelectorAll('.pos-gruppe[data-gruppe]'));
    let gruppe = null;
    for(const g of gruppen){ const r = g.getBoundingClientRect(); if(y >= r.top - 20 && y <= r.bottom + 20) gruppe = g; }
    if(vor && (!gruppe || vor.closest('.pos-gruppe') === gruppe)) vor.parentNode.insertBefore(aktiv.platz, vor);
    else if(gruppe){
      const ende = gruppe.querySelector(':scope > .pos-gruppe-ende');
      gruppe.insertBefore(aktiv.platz, ende);
    }
    // am Rand mitscrollen
    if(scroller){
      const r = scroller.getBoundingClientRect();
      if(y < r.top + 40) scroller.scrollTop -= 10; else if(y > r.bottom - 40) scroller.scrollTop += 10;
    } else {
      const h = window.innerHeight;
      if(y < 80) window.scrollBy(0, -12); else if(y > h - 140) window.scrollBy(0, 12);
    }
  };
  const ablegen = ()=>{
    if(!aktiv) return;
    const { item, geist, platz } = aktiv;
    platz.parentNode.insertBefore(item, platz);
    platz.remove(); geist.remove();
    item.classList.remove('pos-gezogen');
    document.body.classList.remove('pos-zieht');
    item.__klickSperre = Date.now();
    aktiv = null;
    const gruppen = {};
    wurzel.querySelectorAll('.pos-gruppe[data-gruppe]').forEach(g=>{
      gruppen[g.dataset.gruppe] = Array.from(g.querySelectorAll(':scope > .pos-item[data-drag]')).map(i=> i.dataset.key);
    });
    beimAblegen(gruppen, item.dataset.key);
  };
  items().forEach(item=>{
    let timer = null, start = null;
    const abbrechen = ()=>{ clearTimeout(timer); timer = null; start = null; };
    item.addEventListener('touchstart', ev=>{
      if(ev.touches.length !== 1) return;
      const t = ev.touches[0]; start = { x: t.clientX, y: t.clientY };
      timer = setTimeout(()=>{ timer = null; if(start) beginnen(item, start.x, start.y); }, 450);
    }, { passive: true });
    item.addEventListener('touchmove', ev=>{
      const t = ev.touches[0];
      if(aktiv && aktiv.item === item){ if(ev.cancelable) ev.preventDefault(); bewegen(t.clientY); return; }
      if(start && (Math.abs(t.clientX - start.x) > 8 || Math.abs(t.clientY - start.y) > 8)) abbrechen();
    }, { passive: false });
    item.addEventListener('touchend', ev=>{ abbrechen(); if(aktiv && aktiv.item === item){ if(ev.cancelable) ev.preventDefault(); ablegen(); } });
    item.addEventListener('touchcancel', ()=>{ abbrechen(); if(aktiv && aktiv.item === item) ablegen(); });
    item.addEventListener('mousedown', ev=>{
      if(ev.button !== 0) return;
      start = { x: ev.clientX, y: ev.clientY };
      timer = setTimeout(()=>{ timer = null; if(start) beginnen(item, start.x, start.y); }, 450);
      const weg = (e2)=>{ if(aktiv && aktiv.item === item) bewegen(e2.clientY); else if(start && (Math.abs(e2.clientX - start.x) > 8 || Math.abs(e2.clientY - start.y) > 8)) abbrechen(); };
      const hoch = ()=>{ document.removeEventListener('mousemove', weg); document.removeEventListener('mouseup', hoch); abbrechen(); if(aktiv && aktiv.item === item) ablegen(); };
      document.addEventListener('mousemove', weg); document.addEventListener('mouseup', hoch);
    });
    item.addEventListener('contextmenu', ev=> ev.preventDefault());
    // Antippen direkt nach dem Ablegen nicht als Haken werten
    item.addEventListener('click', ev=>{ if(item.__klickSperre && Date.now() - item.__klickSperre < 500){ ev.preventDefault(); ev.stopPropagation(); } }, true);
  });
}

// Liste in eigene_positionen.json: [{wert, am, geloescht?}]
function betaEigeneFaktoren(){
  const d = LS.get(EIGENE_POS_CACHE, null) || {};
  return (d.faktoren || []).filter(f=> f && !f.geloescht && Number(f.wert) >= 1).map(f=> Math.round(Number(f.wert) * 100) / 100).sort((a, b)=> a - b);
}
async function betaEigenerFaktorAendern(wert, weg){
  const w = Math.round(Number(wert) * 100) / 100;
  const anwenden = d=>{ d.faktoren = [...(d.faktoren || []).filter(f=> Math.round(Number(f.wert) * 100) / 100 !== w), { wert: w, am: new Date().toISOString(), geloescht: !!weg }]; };
  const lokal = betaEigeneDatenVoll(); anwenden(lokal); LS.set(EIGENE_POS_CACHE, lokal);
  if(msGraphStatus === 'angemeldet') betaEigeneAbgleichen(anwenden).catch(()=>{});
}

// ---------- Katalog frueherer Begruendungen ----------
// "art:ZIFFER" -> [{text, am, geloescht?}] (neueste zuerst)
function betaBegrKatalog(art, schl){
  const d = LS.get(EIGENE_POS_CACHE, null) || {};
  const k = art + ':' + goaeNorm(schl);
  const liste = ((d.begrKatalog || {})[k] || []).slice();
  // bisherige "zuletzt verwendet"-Vorlage mit aufnehmen
  const v = (d.begruendungen || {})[k];
  if(v && v.text && !liste.some(x=> x.text === v.text)) liste.push({ text: v.text, am: v.am || '' });
  return liste.filter(x=> x && x.text && !x.geloescht).sort((a, b)=> String(b.am || '').localeCompare(String(a.am || '')));
}
function betaBegrKatalogAendern(art, eintraege){
  // eintraege: [{schl, text, weg?}]
  if(!eintraege.length) return;
  const jetzt = new Date().toISOString();
  const anwenden = d=>{
    d.begrKatalog = d.begrKatalog || {};
    eintraege.forEach(({ schl, text, weg })=>{
      const t = String(text || '').trim(); if(!t) return;
      const k = art + ':' + goaeNorm(schl);
      const liste = (d.begrKatalog[k] || []).filter(x=> x.text !== t);
      liste.push({ text: t, am: jetzt, geloescht: !!weg });
      d.begrKatalog[k] = liste.sort((a, b)=> String(b.am).localeCompare(String(a.am))).slice(0, 40);
    });
  };
  const lokal = betaEigeneDatenVoll(); anwenden(lokal); LS.set(EIGENE_POS_CACHE, lokal);
  if(msGraphStatus === 'angemeldet') betaEigeneAbgleichen(anwenden).catch(()=>{});
}

// ---------- Zusammenfuehren mit OneDrive (fuer betaEigeneAbgleichen) ----------
function betaListeNachSchluessel(a, b, schl, zeit){
  const m = new Map();
  [...(a || []), ...(b || [])].forEach(x=>{
    if(!x) return; const k = schl(x); const alt = m.get(k);
    if(!alt || String(zeit(x) || '') > String(zeit(alt) || '')) m.set(k, x);
  });
  return [...m.values()];
}
function betaZusatzZusammenfuehren(a, b){
  a = a || {}; b = b || {};
  const out = {};
  // Profile je Art (nach id, neueste Aenderung gewinnt)
  out.profile = {};
  ['pt', 'ls', 'gkv'].forEach(art=>{
    const l = betaListeNachSchluessel((a.profile || {})[art], (b.profile || {})[art], x=> x.id, x=> x.geaendert);
    if(l.length) out.profile[art] = l;
  });
  // Anordnung je Art (neueste gewinnt)
  out.anordnung = {};
  ['pt', 'ls', 'gkv'].forEach(art=>{
    const x = (a.anordnung || {})[art], y = (b.anordnung || {})[art];
    const w = !x ? y : !y ? x : (String(y.am || '') > String(x.am || '') ? y : x);
    if(w) out.anordnung[art] = w;
  });
  out.ebmWerte = betaListeNachSchluessel(a.ebmWerte, b.ebmWerte, x=> x.ab, x=> x.am);
  out.aerzteAdressen = betaListeNachSchluessel(a.aerzteAdressen, b.aerzteAdressen, x=> String(x.arzt || '').trim().toLowerCase(), x=> x.am);
  out.aerzteRechnungen = betaListeNachSchluessel(a.aerzteRechnungen, b.aerzteRechnungen, x=> x.renu, x=> x.am);
  out.faktoren = betaListeNachSchluessel(a.faktoren, b.faktoren, x=> String(Math.round(Number(x.wert) * 100)), x=> x.am);
  out.begrKatalog = {};
  new Set([...Object.keys(a.begrKatalog || {}), ...Object.keys(b.begrKatalog || {})]).forEach(k=>{
    out.begrKatalog[k] = betaListeNachSchluessel((a.begrKatalog || {})[k], (b.begrKatalog || {})[k], x=> x.text, x=> x.am)
      .sort((p, q)=> String(q.am).localeCompare(String(p.am))).slice(0, 40);
  });
  return out;
}

function betaProfilDetailsAnwenden(art, det, profil, neu){

    det[f] = det[f] || {};
    Object.keys(q).forEach(k=>{ if(neu || det[f][k] === undefined) det[f][k] = q[k]; });

  if(neu) det.anzahl = {};
}

function betaProfilKurz(art, p){
  const t = [];
  t.push(p.vorauswahl.length ? 'vorausgewählt: ' + p.vorauswahl.map(z=> betaNrVonSchluessel(art, z) || z).join(', ') : 'nichts vorausgewählt');

  if(nf) t.push(nf + (nf === 1 ? ' eigener Faktor' : ' eigene Faktoren'));

  if(na) t.push(na + ' ausgeblendet');
  return t.join(' · ');
}

async function betaProfilBearbeiten(art, id){
  const vorhanden = betaProfile(art).find(p=> p.id === id);
  const profil = vorhanden ? JSON.parse(JSON.stringify(vorhanden)) : { id: 'P' + Date.now().toString(36), name: '', vorauswahl: [] };
  profil.ausgeblendet = profil.ausgeblendet || [];
  profil.details = profil.details || {};
  ['faktoren', 'begruendungen', 'varianten'].forEach(f=> profil.details[f] = profil.details[f] || {});
  const katalog = art === 'ls' ? POSITIONEN_LS : POSITIONEN_PT;
  const grundStd = ()=> [
    ...(katalog.grundleistung || []).filter(p=> p.ziffer !== 'E'),
    ...betaFestPositionen(art).filter(p=> p.gruppe === 'grund' || p.manuell).map(betaEigenePositionAlsAuswahl)
  ];
  const eigeneStd = ()=> betaEigene(art).map(betaEigenePositionAlsAuswahl);
  const alleWaehlbar = ()=> [...grundStd(), ...eigeneStd()];
  // Reihenfolge dieses Profils (sonst die allgemeine)
  if(!profil.anordnung){
    const d = LS.get(EIGENE_POS_CACHE, null) || {};
    const allg = (d.anordnung || {})[art];
    if(allg) profil.anordnung = JSON.parse(JSON.stringify(allg));
  }
  const nrText = (p)=> p.anzeigeZiffer !== undefined ? (p.anzeigeZiffer || '–') : p.ziffer;
  const bezText = (p)=> String(p.eigeneBez || p.bez).replace(/<[^>]+>/g, '');
  let fehler = '', ausOffen = false;
  for(;;){
    const alle = alleWaehlbar();
    const geordnet = betaGruppenOrdnen(art, grundStd(), eigeneStd(), profil.anordnung || null);
    const drinG = geordnet.grund.filter(p=> !profil.ausgeblendet.includes(p.ziffer));
    const drinE = art === 'ls' ? [] : geordnet.eigene.filter(p=> !profil.ausgeblendet.includes(p.ziffer));
    if(art === 'ls') drinG.push(...geordnet.eigene.filter(p=> !profil.ausgeblendet.includes(p.ziffer)));
    const drin = [...drinG, ...drinE];
    const weg = alle.filter(p=> profil.ausgeblendet.includes(p.ziffer));
    const zeile = (p)=>{
      const k = betaPosSchluessel(p);
      const mitFaktor = betaPosFaktorEditierbar(p);
      const f = profil.details.faktoren[k] !== undefined ? betaFaktorLesen(profil.details.faktoren[k]) : (mitFaktor ? betaPosStandardFaktor(p) : NaN);
      const b = String(profil.details.begruendungen[k] || '').trim();
      return '<div class="pos-item profil-pos" data-key="' + htmlEsc(p.ziffer) + '" data-drag="1">' +
        '<label class="profil-pos-haken"><input type="checkbox" data-z="' + htmlEsc(p.ziffer) + '"' + (profil.vorauswahl.includes(p.ziffer) ? ' checked' : '') + '>' +
        '<span><b>' + htmlEsc(nrText(p)) + '</b> ' + htmlEsc(bezText(p)) + '</span></label>' +
        '<div class="profil-pos-knoepfe">' +
          (mitFaktor ? '<button type="button" class="profil-faktor' + (profil.details.faktoren[k] !== undefined ? ' eigen' : '') + '" data-akt="faktor:' + htmlEsc(p.ziffer) + '">Faktor ' + betaFaktorText(f) + ' &#9998;</button>' : '') +
          '<button type="button" class="profil-weg" data-akt="weg:' + htmlEsc(p.ziffer) + '" title="aus diesem Profil entfernen">&times;</button>' +
        '</div>' +
        (b ? '<div class="profil-pos-beg">Begründung: ' + htmlEsc(b) + '</div>' : '') + '</div>';
    };
    const html = (fehler ? '<div class="beta-form-fehler">' + htmlEsc(fehler) + '</div>' : '') +
      '<div class="beta-form"><label>Name<input id="prName" value="' + htmlEsc(profil.name) + '" autocomplete="off"></label></div>' +
      '<div class="beta-erg-klein" style="margin:10px 0 4px;">Haken = bei einer neuen Rechnung schon angehakt · Faktor antippen = Faktor und Begründung für dieses Profil vorgeben · &times; = in diesem Profil nicht anzeigen · lang drücken und ziehen = Reihenfolge</div>' +
      '<div class="profil-auswahl">' +
        (art === 'pt' ? '<div class="profil-gruppe-titel">Grundpauschalen</div>' : '') +
        '<div class="pos-gruppe" data-gruppe="grund">' + drinG.map(zeile).join('') + '<div class="pos-gruppe-ende"></div></div>' +
        (art === 'pt' ? '<div class="profil-gruppe-titel">Eigene Positionen</div><div class="pos-gruppe" data-gruppe="eigene">' + drinE.map(zeile).join('') +
          (drinE.length ? '' : '<div class="beta-erg-klein profil-leer">hierher ziehen oder unten anlegen</div>') + '<div class="pos-gruppe-ende"></div></div>' : '') +
      '</div>' +
      (art === 'pt' ? '<button type="button" class="btn-sekundaer profil-eigene" data-akt="eigene" style="margin-top:8px;">+ Eigene Position anlegen</button>' : '') +
      (weg.length ? '<button type="button" class="profil-aus-titel" data-akt="ausklappen">' + (ausOffen ? '&#9662;' : '&#9656;') + ' Entfernt (' + weg.length + ') – antippen zum Zurückholen</button>' +
        (ausOffen ? '<div class="profil-ausgeblendet">' + weg.map(p=> '<button type="button" class="profil-zurueck" data-akt="zurueck:' + htmlEsc(p.ziffer) + '"><b>' + htmlEsc(nrText(p)) + '</b> ' + htmlEsc(bezText(p)) + ' <span>＋</span></button>').join('') + '</div>' : '') : '');
    const knoepfe = [{ label:'Abbrechen', akt:'nein' }];
    if(vorhanden && betaProfile(art).length > 1) knoepfe.push({ label:'Löschen', akt:'loeschen' });
    knoepfe.push({ label:'Speichern', akt:'ja', primaer:true });
    const warte = betaOverlay.ergebnis(vorhanden ? 'Profil bearbeiten' : 'Neues Profil', html, knoepfe);
    document.querySelectorAll('.beta-overlay [data-akt]').forEach(b=>{
      if(b.closest('.beta-overlay-knoepfe')) return;
      b.onclick = (ev)=>{ ev.preventDefault(); betaOverlay.loesen && betaOverlay.loesen(b.dataset.akt); };
    });
    // Reihenfolge per langem Druecken + Ziehen (wie in den Rechnungspositionen)
    const auswahlEl = document.querySelector('.beta-overlay .profil-auswahl');
    if(auswahlEl) betaPosZiehen(auswahlEl, (gr)=>{
      profil.anordnung = { grund: gr.grund || [], eigene: gr.eigene || [], am: new Date().toISOString() };
    }, auswahlEl);
    const akt = await warte;
    // Stand des Formulars uebernehmen (auch bei Zwischenschritten)
    const nameEl = document.getElementById('prName');
    if(nameEl) profil.name = nameEl.value;
    const sichtbarZ = new Set(drin.map(p=> p.ziffer));
    profil.vorauswahl = [
      ...profil.vorauswahl.filter(z=> !sichtbarZ.has(z) && !profil.ausgeblendet.includes(z)),
      ...Array.from(document.querySelectorAll('.profil-auswahl input:checked')).map(c=> c.dataset.z)
    ];
    fehler = '';
    if(akt === 'nein'){ betaOverlay.schliessen(); return false; }
    if(akt === 'loeschen'){
      betaOverlay.schliessen();
      if(!await betaFrage('Profil „' + profil.name + '“ löschen?', 'Löschen', 'Abbrechen')) return false;
      await betaProfilSpeichern(art, { ...profil, geloescht: true });
      if(betaProfilAktivId(art) === profil.id) betaProfilWaehlen(art, betaProfile(art)[0].id);
      return true;
    }
    if(akt === 'ausklappen'){ ausOffen = !ausOffen; continue; }
    if(akt === 'eigene'){
      const neu = await betaEigenePositionDialog(art);
      if(neu){
        // in diesem Profil gleich anhaken, in den anderen Profilen nicht anzeigen
        const id_ = neu.id;
        if(!profil.vorauswahl.includes(id_)) profil.vorauswahl.push(id_);
        for(const q of betaProfile(art)){
          if(q.id === profil.id) continue;
          const aus = q.ausgeblendet || [];
          if(!aus.includes(id_)) await betaProfilSpeichern(art, { ...q, ausgeblendet: [...aus, id_] });
        }
      }
      continue;
    }
    if(/^weg:/.test(akt)){
      const z = akt.slice(4);
      if(!profil.ausgeblendet.includes(z)) profil.ausgeblendet.push(z);
      profil.vorauswahl = profil.vorauswahl.filter(x=> x !== z);
      continue;
    }
    if(/^zurueck:/.test(akt)){ const z = akt.slice(8); profil.ausgeblendet = profil.ausgeblendet.filter(x=> x !== z); continue; }
    if(/^faktor:/.test(akt)){
      const z = akt.slice(7);
      const p = alle.find(x=> x.ziffer === z);
      if(p){
        const k = betaPosSchluessel(p);
        const f0 = profil.details.faktoren[k] !== undefined ? betaFaktorLesen(profil.details.faktoren[k]) : betaPosStandardFaktor(p);
        const b0 = profil.details.begruendungen[k] !== undefined ? profil.details.begruendungen[k] : betaPosStandardBegruendung(art, p, false);
        const erg = await betaFaktorDialog(art, p, f0, b0, 1, profil.details.varianten[k] || '', { profil: true });
        if(erg){
          profil.details.faktoren[k] = erg.faktor;
          if(erg.begruendung) profil.details.begruendungen[k] = erg.begruendung; else delete profil.details.begruendungen[k];
          if(erg.variante) profil.details.varianten[k] = erg.variante; else delete profil.details.varianten[k];
          // Standardfaktor ohne Begruendung = keine Vorgabe
          if(Math.abs(erg.faktor - betaPosStandardFaktor(p)) < 1e-9 && !erg.begruendung && !erg.variante) delete profil.details.faktoren[k];
        }
      }
      continue;
    }
    // Speichern
    profil.name = profil.name.trim();
    if(!profil.name){ fehler = 'Bitte einen Namen eintragen.'; continue; }
    betaOverlay.schliessen();
    await betaProfilSpeichern(art, { id: profil.id, name: profil.name, vorauswahl: profil.vorauswahl, ausgeblendet: profil.ausgeblendet, details: profil.details,
                                     ...(profil.anordnung ? { anordnung: profil.anordnung } : {}) });
    return true;
  }
}

function betaProfileWiring(neuZeichnen){
  document.querySelectorAll('.profil-zeile').forEach(b=> b.onclick = async ()=>{ if(await betaProfilBearbeiten(b.dataset.art, b.dataset.id)) neuZeichnen(); });
  document.querySelectorAll('.profil-neu').forEach(b=> b.onclick = async ()=>{ if(await betaProfilBearbeiten(b.dataset.art, null)) neuZeichnen(); });
  document.querySelectorAll('[data-gkvprofil]').forEach(b=> b.onclick = async ()=>{ if(await gkvProfilBearbeiten(b.dataset.gkvprofil)) neuZeichnen(); });
  document.querySelectorAll('.gkv-profil-neu').forEach(b=> b.onclick = async ()=>{ if(await gkvProfilBearbeiten(null)) neuZeichnen(); });
}

        empfohlen (z. B. Datenschutzbeauftragter, Landesärztekammer).</p>
      </div>
    </div>`;
}

// =====================================================================
// Fahrtenbuch: Statistik rechts in die Excel-Datei schreiben (wie die HTA
// am PC beim "Fahrtenbuch öffnen") + Grundpauschale im Bereitschaftsdienst
// =====================================================================
// Je Diensttag (letzte Zeile des Blocks):
//   AH = Gesamt (GKV inkl. Grundpauschale + LS + PT)
//   AI = Stundenlohn (AH / Dienststunden)
//   AJ = GKV-Anteil – mindestens Förderung der KVBW (Statut NFD-O zu § 10):
//        Fahrdienst Mo–Fr 300 € je 14-h-Dienst = 21,43 €/h (stundengenau),
//        Sa/So/Feiertag/24.12./31.12. 50 €/h; am 24.12./31.12. zusätzlich
//        500 € je 24 h (anteilig)
//   AK = LS + PT, AL = LS, AM = PT
// Je Quartal (letzter Diensttag): AN = Summe GKV, AO = abzgl. Gebühr,
//   AQ = Abweichung zur manuell eingetragenen Auszahlung in AP.
// Alles als Excel-Formeln (wie in der HTA), geschrieben wird nur, was sich
// geändert hat.
// Euro-Zeile 3 des Fahrtenbuchs, wie sie bis Oktober 2026 von Hand gepflegt war
// (fuer das Festschreiben alter Betraege, siehe fahrdienstStatistikSchreiben)
const FAHRDIENST_EURO_ZEILE_ALT = { '01212': 24.16, '01216': 17.35, '01218': 21.06, '01418': 96.42, '01224': 24.16, '01226': 11.15,
  '01440': 43.62, '40190': 14.71, '40224': 12.01, '40222': 8.41, '40220': 4.2, '40192': 20.21, '40230': 18.02, '40228': 13.21,
  '40226': 8.41, '01413': 13.14, '01210': 14.87, '01214': 6.19, '01223': 15.86, '01220': 127.26, '02100': 8.30, '02300': 8.43,
  '02301': 16.48, '02302': 28.50, '02323': 8.43, '32025': 1.6, '32033': 0.5 };
// Mindesthonorar (Foerderung) je Stunde: Fahrdienst Mo-Fr 300 EUR je 14-h-
// Dienst (18-8 Uhr), Sa/So/Feiertage/24.12./31.12. 50 EUR/h
const FAHRDIENST_PAUSCHALE_WERKTAG = 300 / 14;
const FAHRDIENST_PAUSCHALE_WERKTAG_FORMEL = '300/14';
const FAHRDIENST_PAUSCHALE_WOCHENENDE = 50;
const FAHRDIENST_ZUSATZ_2412_3112 = 500 / 24;   // zusaetzlich, unabhaengig vom Honorar

function fahrdienstDatumAusWert(wert){
  const n = Number(wert);
  if(isFinite(n) && n > 0){
    const d = new Date(Math.round((n - 25569) * 86400000));
    return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
  }
  const m = /^(\d{1,2})\.(\d{1,2})\.(\d{2,4})/.exec(String(wert || '').trim());
  if(m){ const j = +m[3] < 100 ? 2000 + +m[3] : +m[3]; return new Date(j, +m[2] - 1, +m[1]); }
  return null;
}
// Stundensatz der Grundpauschale nach dem Tag des Dienstbeginns
function fahrdienstSilvesterHeiligabend(d){ return !!d && d.getMonth() === 11 && (d.getDate() === 24 || d.getDate() === 31); }
function fahrdienstWochenendSatz(d){ return !!d && (d.getDay() === 0 || d.getDay() === 6 || !!istFeiertagBW(d) || fahrdienstSilvesterHeiligabend(d)); }
// Sitzdienst und telemedizinischer Dienst: an allen Tagen 50 EUR/h
function fahrdienstIstSitz(art){ return /sitz|tele/i.test(String(art || '')); }
function fahrdienstPauschaleSatz(datumWert, art){
  if(fahrdienstIstSitz(art)) return FAHRDIENST_PAUSCHALE_WOCHENENDE;
  const d = fahrdienstDatumAusWert(datumWert);
  return fahrdienstWochenendSatz(d) ? FAHRDIENST_PAUSCHALE_WOCHENENDE : FAHRDIENST_PAUSCHALE_WERKTAG;
}
// dieselbe Zahl als Excel-Ausdruck (300/14 exakt statt gerundet)
function fahrdienstSatzFormel(datumWert, art){
  if(fahrdienstIstSitz(art)) return String(FAHRDIENST_PAUSCHALE_WOCHENENDE);
  return fahrdienstWochenendSatz(fahrdienstDatumAusWert(datumWert)) ? String(FAHRDIENST_PAUSCHALE_WOCHENENDE) : FAHRDIENST_PAUSCHALE_WERKTAG_FORMEL;
}
// Zusatzfoerderung 24.12./31.12. je Stunde (sonst 0)
function fahrdienstZusatzSatz(datumWert){ return fahrdienstSilvesterHeiligabend(fahrdienstDatumAusWert(datumWert)) ? FAHRDIENST_ZUSATZ_2412_3112 : 0; }
function fahrdienstSatzText(satz){ return String(Math.round(satz * 100) / 100).replace('.', ','); }
function fahrdienstSatzGrund(datumWert, art){
  const d = fahrdienstDatumAusWert(datumWert);
  if(!d) return '';
  if(fahrdienstIstSitz(art)) return String(art).trim();
  if(fahrdienstSilvesterHeiligabend(d)) return d.getDate() === 24 ? 'Heiligabend' : 'Silvester';
  const f = istFeiertagBW(d);
  return f ? f : d.getDay() === 0 ? 'Sonntag' : d.getDay() === 6 ? 'Samstag' : 'Fahrdienst Mo–Fr';
}

// Excel-Ausdruck fuer die Dienststunden aus Spalte C der Blockstart-Zeile
// ("18-23" als Text; ueber Mitternacht, z.B. "18-8", werden 24 h addiert)
function fahrdienstStundenFormel(zeitWert, zeile){
  const c = 'C' + zeile;
  if(typeof zeitWert === 'number') return c;
  if(/^\s*\d{1,2}(?:[.,]\d+)?\s*-\s*\d{1,2}(?:[.,]\d+)?\s*$/.test(String(zeitWert || ''))){
    const s = 'VALUE(TRIM(LEFT(' + c + ',FIND("-",' + c + ')-1)))';
    const e = 'VALUE(TRIM(MID(' + c + ',FIND("-",' + c + ')+1,10)))';
    return '(' + e + '-' + s + '+IF(' + e + '<=' + s + ',24,0))';
  }
  return '0';
}
function fahrdienstGebuehrText(){ return String(FAHRDIENST_GEBUEHR_SATZ).replace(',', '.'); }

// Erwartete Formeln je Diensttag-Block (Excel-Zeilen 1-basiert)
function fahrdienstBlockFormeln(b){
  const R = b.zeileEnde, a = b.zeileStart;
  const AG = 'AG' + a + ':AG' + R, D = 'D' + a + ':D' + R, E = 'E' + a + ':E' + R;
  const std = fahrdienstStundenFormel(b.zeitRoh, a);
  return [
    '=AJ' + R + '+AL' + R + '+AM' + R,                                                     // AH
    '=IFERROR(AH' + R + '/' + std + ',0)',                                                 // AI
    '=MAX(SUMIFS(' + AG + ',' + D + ',"<>")-AL' + R + '-AM' + R + ',IFERROR(' + std + ',0)*' + (b.satzFormel || b.satz) + ')' +
      (b.zusatz ? '+IFERROR(' + std + ',0)*500/24' : ''), // AJ
    '=AL' + R + '+AM' + R,                                                                 // AK
    '=SUMIFS(' + AG + ',' + D + ',"<>",' + E + ',"L")+SUMIFS(' + AG + ',' + D + ',"<>",' + E + ',"LS")', // AL
    '=SUMIFS(' + AG + ',' + D + ',"<>",' + E + ',"P")+SUMIFS(' + AG + ',' + D + ',"<>",' + E + ',"PT")'  // AM
  ];
}
const fahrdienstFormelNorm = (f)=> String(f == null ? '' : f).replace(/\s+/g, '').replace(/\$/g, '').toUpperCase();

// Tabellenblaetter: ein Blatt je Jahr ("2025", "2026", ...). Solange die
// Datei noch nicht nach Jahren aufgeteilt ist (macht die HTA am PC), gilt
// wie bisher nur das erste Blatt.
const fahrdienstIstJahresblatt = (n)=> /^\d{4}$/.test(String(n == null ? '' : n).trim());
async function fahrdienstBlaetter(token, basis){
  const ws = await gx(token, 'GET', basis + '/workbook/worksheets?$select=name,position');
  const alle = ((ws && ws.value) || []).slice().sort((x, y)=> (x.position || 0) - (y.position || 0));
  const jahre = alle.map(w=> String(w.name).trim()).filter(fahrdienstIstJahresblatt).sort();
  if(jahre.length) return { jahresModus: true, blaetter: jahre };
  if(!alle.length) throw new Error('Das Fahrtenbuch enthält kein Tabellenblatt.');
  return { jahresModus: false, blaetter: [String(alle[0].name)] };
}
function fahrdienstBlattUrl(basis, blatt){ return basis + "/workbook/worksheets('" + encodeURIComponent(blatt) + "')"; }

// Liest die Datei, schreibt geaenderte Formeln, liefert die Auswertung
// (wie fahrdienstZeilenAuswerten, ueber alle Jahresblaetter) oder wirft
// einen Fehler. opt.blatt: nur dieses Blatt bearbeiten.
async function fahrdienstStatistikSchreiben(meldung, opt){
  opt = opt || {};
  const token = await msGraphTokenHolen();
  if(!token) throw new Error('Keine Microsoft-Anmeldung aktiv.');
  const basis = msGraphPfadUrl(MSGRAPH_PFAD_FAHRTENBUCH);
  meldung && meldung('Fahrtenbuch wird gelesen …');
  const info = await fahrdienstBlaetter(token, basis);
  const gesamt = { bloecke: [], quartale: [], geschrieben: 0, jahresModus: info.jahresModus };
  for(const blatt of info.blaetter){
    if(opt.blatt && blatt !== opt.blatt) continue;
    if(info.blaetter.length > 1) meldung && meldung('Fahrtenbuch ' + blatt + ' wird gelesen …');
    const d = await fahrdienstBlattStatistik(token, basis, blatt, info, meldung);
    d.bloecke.forEach(b=> b.blatt = blatt);
    gesamt.bloecke.push(...d.bloecke); gesamt.quartale.push(...d.quartale); gesamt.geschrieben += d.geschrieben;
  }
  // Neu berechnen lassen: steht die Datei auf "manuelle Berechnung", zeigen
  // frisch geschriebene Formeln sonst 0 (z.B. AH, das vor AJ berechnet wurde)
  try{ await gx(token, 'POST', basis + '/workbook/application/calculate', { calculationType: 'Full' }); }catch(e){}
  return gesamt;
}
async function fahrdienstBlattStatistik(token, basis, blatt, info, meldung){
  const blattUrl = fahrdienstBlattUrl(basis, blatt);
  // Euro-Zeile 3 pflegt die App nur im Blatt des laufenden Jahres (bzw. im
  // einzigen Blatt, solange nicht nach Jahren aufgeteilt)
  const z3Aktiv = !info.jahresModus || blatt === String(new Date().getFullYear());
  const ur = await gx(token, 'GET', blattUrl + '/usedRange?$select=address,values,formulas');
  const st = xlAdresseStart(ur && ur.address);
  // auf Zeile 1 / Spalte A ausrichten (die Auswertung erwartet A1 als Ursprung)
  const ausrichten = (m)=> {
    const leerZeile = ()=> [];
    const out = [];
    for(let i = 1; i < st.zeile; i++) out.push(leerZeile());
    (m || []).forEach(r=> out.push(new Array(st.spalte).fill('').concat(r)));
    return out;
  };
  const werte = ausrichten(ur.values), formeln = ausrichten(ur.formulas);
  const daten = fahrdienstZeilenAuswerten(werte);
  const COL = (b)=> { let n = 0; for(const ch of b) n = n * 26 + ch.charCodeAt(0) - 64; return n - 1; };
  const zelle = (z, b)=> ((formeln[z - 1] || [])[COL(b)]);
  const schreiben = [];
  daten.bloecke.forEach(b=>{
    const soll = fahrdienstBlockFormeln(b);
    const ist = ['AH', 'AI', 'AJ', 'AK', 'AL', 'AM'].map(sp=> zelle(b.zeileEnde, sp));
    if(soll.some((f, i)=> fahrdienstFormelNorm(f) !== fahrdienstFormelNorm(ist[i])))
      schreiben.push({ adresse: 'AH' + b.zeileEnde + ':AM' + b.zeileEnde, formeln: [soll] });
  });
  // Quartale: AN/AO/AQ auf dem letzten Diensttag
  const quartale = new Map();
  daten.bloecke.forEach(b=>{ const q = quartale.get(b.quartalKey) || []; q.push(b.zeileEnde); quartale.set(b.quartalKey, q); });
  quartale.forEach(zeilen=>{
    const R = zeilen[zeilen.length - 1];
    const soll = ['=' + zeilen.map(z=> 'AJ' + z).join('+'), '=AN' + R + '*(1-' + fahrdienstGebuehrText() + ')'];
    if(soll.some((f, i)=> fahrdienstFormelNorm(f) !== fahrdienstFormelNorm(zelle(R, i ? 'AO' : 'AN'))))
      schreiben.push({ adresse: 'AN' + R + ':AO' + R, formeln: [soll] });
    const aq = '=IF(AP' + R + '="","",IFERROR(AP' + R + '/AN' + R + '-1,""))';
    if(fahrdienstFormelNorm(aq) !== fahrdienstFormelNorm(zelle(R, 'AQ'))) schreiben.push({ adresse: 'AQ' + R, formeln: [[aq]] });
  });
  // Betraege frueherer Zeitraeume festschreiben: Rechnet AG per Formel mit
  // der Euro-Zeile 3, wuerde deren Aktualisierung (neuer Orientierungswert,
  // neue Wegepauschalen) alle alten Dienste mit den neuen Werten
  // nachrechnen. Deshalb werden die AG-Formeln aller Dienste VOR Beginn der
  // aktuell gueltigen Werte in feste Zahlen umgewandelt -- mit dem Betrag,
  // den sie bisher hatten. Dienste im laufenden Zeitraum rechnen weiter mit
  // Zeile 3.
  if(z3Aktiv && typeof ebmWerteFuer === 'function'){
    const ab = ebmWerteFuer(new Date()).ab;
    const kopf2 = werte[1] || [];
    const gopVon = (c)=> (String(kopf2[c] == null ? '' : kopf2[c]).match(/\d{3,5}/) || [''])[0].padStart(5, '0');
    // Stand der Euro-Zeile vor der ersten Aktualisierung durch die App
    const ALT = FAHRDIENST_EURO_ZEILE_ALT;
    const z3 = formeln[2] || [];
    const z3SchonNeu = !info.jahresModus && [...Array(27).keys()].map(i=> i + 5).every(c=>{
      const g = gopVon(c); if(g === '00000' || !ebmEintrag(g)) return true;
      return Math.abs((Number(String(z3[c]).replace(',', '.')) || 0) - ebmEuro(g, new Date())) <= 0.004;
    });
    const bezugZ3 = /(^|[^A-Z0-9$])\$?[A-Z]{1,3}\$?3(?![0-9])/;
    daten.bloecke.forEach(b=>{
      const m = /^(\d{2})\.(\d{2})\.(\d{4})$/.exec(b.datumText || ''); if(!m) return;
      if(m[3] + '-' + m[2] + '-' + m[1] >= ab) return;
      const spalte = []; let anders = false;
      for(let r = b.zeileStart; r <= b.zeileEnde; r++){
        const f = zelle(r, 'AG');
        if(typeof f === 'string' && f.charAt(0) === '=' && bezugZ3.test(f)){
          let v = Number(((werte[r - 1] || [])[32])) || 0;
          if(z3SchonNeu){
            // Zeile 3 wurde schon umgestellt (und neu berechnet): Betrag mit
            // der bisherigen Euro-Zeile wiederherstellen
            v = 0;
            for(let c = 5; c <= 31; c++){ const n = Number(((werte[r - 1] || [])[c])) || 0; if(n) v += n * (ALT[gopVon(c)] || 0); }
            v = Math.round(v * 100) / 100;
          }
          spalte.push([v]); anders = true;
        } else spalte.push([f == null ? '' : f]);
      }
      if(anders) schreiben.push({ adresse: 'AG' + b.zeileStart + ':AG' + b.zeileEnde, formeln: spalte });
    });
  }
  // Euro-Zeile 3 (F..AF) auf die aktuell gueltigen Betraege setzen -- Ziffer
  // aus Zeile 2; Spalten ohne bekannte EBM-Ziffer bleiben, wie sie sind.
  if(z3Aktiv && typeof ebmEintrag === 'function'){
    const kopf2 = werte[1] || [], z3 = formeln[2] || [];
    const neu = []; let anders = false;
    for(let c = 5; c <= 31; c++){
      const alt = z3[c] == null ? '' : z3[c];
      const g = (String(kopf2[c] == null ? '' : kopf2[c]).match(/\d{3,5}/) || [''])[0].padStart(5, '0');
      if(g !== '00000' && ebmEintrag(g)){
        const v = ebmEuro(g, new Date());
        neu.push(v);
        if(Math.abs((Number(String(alt).replace(',', '.')) || 0) - v) > 0.004) anders = true;
      } else neu.push(alt);
    }
    if(anders) schreiben.push({ adresse: 'F3:AF3', formeln: [neu] });
  }
  // Veraltete Statistik (Blockende/Quartalsende hat sich durch neue Zeilen
  // verschoben): alte Formeln leeren, manuell eingetragene Auszahlung (AP)
  // wandert mit ans neue Quartalsende.
  const enden = new Set(daten.bloecke.map(b=> b.zeileEnde));
  const qEnde = new Map(); quartale.forEach((zeilen, k)=> qEnde.set(k, zeilen[zeilen.length - 1]));
  const qEnden = new Set(qEnde.values());
  const txt = (r, b)=> String(zelle(r, b) == null ? '' : zelle(r, b)).trim();
  const istF = (r, b)=> txt(r, b).charAt(0) === '=';
  // nur innerhalb der Dienstbloecke -- darunter stehen Gesamtauswertung und
  // Erinnerungstext, die bleiben unberuehrt
  const inBlock = (r)=> daten.bloecke.some(b=> b.zeileStart <= r && r <= b.zeileEnde);
  for(let r = 5; r <= formeln.length; r++){
    if(!inBlock(r)) continue;
    if(!enden.has(r) && ['AH', 'AI', 'AJ', 'AK', 'AL', 'AM'].some(b=> istF(r, b)))
      schreiben.push({ adresse: 'AH' + r + ':AM' + r, werte: [['', '', '', '', '', '']] });
    if(!qEnden.has(r) && (istF(r, 'AN') || istF(r, 'AO') || istF(r, 'AQ'))){
      schreiben.push({ adresse: 'AN' + r + ':AO' + r, werte: [['', '']] }, { adresse: 'AQ' + r, werte: [['']] });
      const ap = zelle(r, 'AP');
      const blk = daten.bloecke.find(b=> b.zeileStart <= r && r <= b.zeileEnde) || daten.bloecke.filter(b=> b.zeileEnde < r).pop();
      const neu = blk && qEnde.get(blk.quartalKey);
      if(ap !== '' && ap != null && neu && neu !== r && txt(neu, 'AP') === '')
        schreiben.push({ adresse: 'AP' + neu, werte: [[ap]] }, { adresse: 'AP' + r, werte: [['']] });
    }
  }
  if(schreiben.length){
    if(String(zelle(3, 'AL') || '') !== 'LS (intern, Cache)' || String(zelle(3, 'AM') || '') !== 'PT (intern, Cache)')
      schreiben.push({ adresse: 'AL3:AM3', werte: [['LS (intern, Cache)', 'PT (intern, Cache)']] });
    for(let i = 0; i < schreiben.length; i++){
      meldung && meldung('Statistik wird eingetragen … ' + (i + 1) + '/' + schreiben.length);
      const w = schreiben[i];
      await gx(token, 'PATCH', blattUrl + "/range(address='" + w.adresse + "')", w.werte ? { values: w.werte } : { formulas: w.formeln });
    }
  }
  daten.geschrieben = schreiben.length;
  return daten;
}

function ebmNorm(z){ return String(z == null ? '' : z).trim().toUpperCase().replace(/\s+/g, ''); }
function ebmEintrag(gop){
  if(!ebmEintrag.m){ ebmEintrag.m = new Map(); EBM_KATALOG.forEach(e=> ebmEintrag.m.set(e[0], e)); }
  const e = ebmEintrag.m.get(ebmNorm(gop));
  return e ? { gop: e[0], punkte: e[1], text: e[2], euroFest: e[3], hinweis: e[4] } : null;
}
function ebmEuro(gop, datum){
  const e = ebmEintrag(gop);
  if(!e) return 0;

  return Number(e.euroFest) || 0;
}

// ---------- Neue Werte online pruefen (Azure-Weiterleitung /ebm/werte) ----------
// Die Weiterleitung liest die aktuelle EBM-Uebersicht (Orientierungswert) und
// die neueste Liste "Regionale GOP" der KVBW (Wegepauschalen). Uebernommen wird
// nur nach Rueckfrage und nur, was alle Plausibilitaetspruefungen besteht.
const EBM_PRUEF_ABSTAND_TAGE = 7;
function ebmQuartalsbeginn(d){ d = d || new Date(); return new Date(d.getFullYear(), Math.floor(d.getMonth() / 3) * 3, 1); }
function ebmVorschlagBilden(j){
  const akt = ebmWerteFuer(new Date());
  const v = { ow: null, wege: null, hinweise: [] };
  const ow = Number(j && j.ow);
  if(ow > 0.08 && ow < 0.25 && Math.abs(ow / akt.ow - 1) <= 0.15){
    const k = Number(j.kontrolle01418);
    if(k > 0 && Math.abs(778 * ow - k) > 0.02) v.hinweise.push('Orientierungswert unstimmig (Kontrolle mit 01418) – nicht übernommen.');
    else v.ow = Math.round(ow * 1e6) / 1e6;
  } else if(j && j.ow != null) v.hinweise.push('Orientierungswert ' + j.ow + ' unplausibel – nicht übernommen.');
  const w = (j && j.wege) || {};
  const n = (g)=> Number(w[g]);
  const alleDa = EBM_WEGE_GOPS.every(g=> n(g) >= 1 && n(g) <= 80 && Math.abs(n(g) / (akt.wege[g] || n(g)) - 1) <= 0.3);
  const stimmig = alleDa && n('40220') < n('40222') && n('40222') < n('40224') && n('40224') < n('40190') &&
    n('40226') < n('40228') && n('40228') < n('40230') && n('40230') < n('40192') &&
    n('40226') > n('40220') && n('40228') > n('40222') && n('40230') > n('40224') && n('40192') > n('40190');
  if(stimmig){ v.wege = {}; EBM_WEGE_GOPS.forEach(g=> v.wege[g] = Math.round(n(g) * 100) / 100); }
  else if(Object.keys(w).length) v.hinweise.push('Wegepauschalen nicht vollständig/stimmig gelesen – nicht übernommen.');
  v.owNeu = v.ow != null && Math.abs(v.ow - akt.ow) > 5e-7;
  v.wegeNeu = !!v.wege && EBM_WEGE_GOPS.some(g=> Math.abs(v.wege[g] - (akt.wege[g] || 0)) > 0.004);
  v.neu = v.owNeu || v.wegeNeu;
  // gueltig ab: Datum aus der Quelle, sonst Beginn des laufenden Quartals
  const daten = [v.owNeu && j.owAb, v.wegeNeu && j.wegeAb].filter(x=> /^\d{4}-\d{2}-\d{2}$/.test(x || '')).sort();
  v.ab = daten.length ? daten[daten.length - 1] : ebmIso(ebmQuartalsbeginn());
  v.quelle = [v.owNeu ? (j.owQuelle || 'EBM-Übersicht') : '', v.wegeNeu ? (j.wegeQuelle || 'KVBW Regionale GOP') : ''].filter(Boolean).join(', ');
  return v;
}

async function ebmWertePruefen(manuell){
  const vorher = LS.get('ebm_pruefung', {}) || {};

    return 'aktuell';
  }catch(e){
    LS.set('ebm_pruefung', { am: vorher.am || null, versuch: new Date().toISOString(), ok: false, fehler: e.message || String(e) });
    if(manuell) await betaOverlay.meldung(e.message || String(e), 'EBM-Werte');

  }
}

async function ebmWerteAutomatisch(){
  try{

function ebmSuchen(text, max){
  const s = String(text || '').trim().toLowerCase();
  if(!s) return [];
  const treffer = [];
  EBM_KATALOG.forEach(e=>{
    let rang = -1;
    if(e[0] === s) rang = 0;
    else if(e[0].indexOf(s) === 0 || e[0].replace(/^0+/, '').indexOf(s.replace(/^0+/, '')) === 0) rang = 1;
    else if(s.length >= 3){ const p = e[2].toLowerCase().indexOf(s); if(p >= 0) rang = 2 + p / 1000; }
    if(rang >= 0) treffer.push({ e, rang });
  });
  treffer.sort((a, b)=> a.rang - b.rang || a.e[0].localeCompare(b.e[0]));
  return treffer.slice(0, max || 30).map(t=> ebmEintrag(t.e[0]));
}

}

// Suche in der Region zuerst (Ortenau und Umgebung), damit auch ein reiner
// Ortsteil ohne Strasse/PLZ ("Riedle", "Ulm", "Bühl") den richtigen Ort trifft;
// erst wenn dort nichts gefunden wird, deutschlandweit.
const GKV_REGION_VIEWBOX = '7.55,48.80,8.55,48.15';
async function gkvOrtSuchen(q){
  q = String(q || '').trim(); if(!q) return null;
  const basis = 'https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=1&countrycodes=de&q=' + encodeURIComponent(q);
  for(const zusatz of ['&viewbox=' + GKV_REGION_VIEWBOX + '&bounded=1', '']){
    const r = await fetch(basis + zusatz, { headers: { 'Accept': 'application/json' } });
    const d = await r.json();
    if(d && d.length){
      const a = d[0].address || {};
      const ort = a.village || a.town || a.city || a.hamlet || a.suburb || a.municipality || '';
      const teil = (a.suburb || a.hamlet || a.village) && (a.town || a.city) && (a.suburb || a.hamlet || a.village) !== (a.town || a.city) ? (a.suburb || a.hamlet || a.village) + ', ' + (a.town || a.city) : ort;
      return { lat: parseFloat(d[0].lat), lon: parseFloat(d[0].lon), plz: a.postcode || '', ort, gefunden: [a.road ? a.road + (a.house_number ? ' ' + a.house_number : '') : '', [a.postcode, teil].filter(Boolean).join(' ')].filter(Boolean).join(', ') };
    }
  }
  return null;
}
// Adresse als "Strasse, PLZ Ort" <-> zwei Felder
function gkvAdrTeile(a){
  a = String(a || '').trim(); const i = a.lastIndexOf(',');
  if(i < 0) return /\b\d{5}\b/.test(a) ? { strasse: '', plzOrt: a } : { strasse: a, plzOrt: '' };
  return { strasse: a.slice(0, i).trim(), plzOrt: a.slice(i + 1).trim() };
}
function gkvAdrZusammen(s, p){ s = String(s || '').trim(); p = String(p || '').trim(); return s && p ? s + ', ' + p : (s || p); }
// Wie in der Rechnungsmaske: nur PLZ -> Ort ergaenzen, nur Ort -> PLZ ergaenzen
async function gkvPlzOrtErgaenzen(strFeld, feld, infoEl){
  const setzeInfo = (t)=>{ if(infoEl) infoEl.textContent = t || ''; };
  const eingabe = String(feld.value || '').trim(); if(!eingabe){ setzeInfo(''); return; }
  const plz = plzAusText(eingabe), ort = plz ? eingabe.replace(plz, '').trim() : eingabe;
  if(plz && ort){ setzeInfo(''); return; }
  if(plz){
    setzeInfo('Ort wird gesucht …');
    const o = await ortErmitteln(plz);
    if(String(feld.value).trim() !== eingabe) return;
    if(o){ feld.value = plz + ' ' + o; setzeInfo(''); feld.dispatchEvent(new Event('input')); }
    else setzeInfo(o === null ? 'Keine Verbindung – Ort bitte selbst ergänzen.' : 'Zur PLZ ' + plz + ' wurde kein Ort gefunden.');
    return;
  }
  setzeInfo('PLZ wird gesucht …');
  const s = String((strFeld && strFeld.value) || '').trim();
  let p = null;
  try{ const g = await gkvOrtSuchen((s ? s + ', ' : '') + ort); p = g ? g.plz : ''; }catch(_){ p = null; }
  if(String(feld.value).trim() !== eingabe) return;
  if(p){ feld.value = p + ' ' + ort; setzeInfo(''); feld.dispatchEvent(new Event('input')); }
  else setzeInfo(p === null ? 'Keine Verbindung – PLZ bitte selbst ergänzen.' : '');   // reiner Ort ohne eindeutige PLZ: Suche klappt trotzdem
}
function gkvStufeFuerKm(km){ return km <= 2 ? '2' : km <= 5 ? '5' : km <= 10 ? '10' : km <= 20 ? '10+' : km <= 30 ? '20+' : km <= 50 ? '30+' : '50+'; }
async function gkvLuftlinie(adresse){
  const startAdr = gkvStartAdresse();
  try{
    const z = await gkvOrtSuchen(adresse);
    if(!z) return { fehler: 'Adresse nicht gefunden – bitte prüfen oder die Stufe der Wegepauschale unten von Hand wählen.' };
    if(!startAdr) return { km: null, ziel: z, start: '' };
    let s = LS.get('gkv_start_geo', null);
    if(!s || s.adr !== startAdr){
      const g = await geocode(startAdr);
      if(!g) return { km: null, ziel: z, start: '' };
      s = { adr: startAdr, lat: g.lat, lon: g.lon }; LS.set('gkv_start_geo', s);
    }
    const km = kmLuftlinieEinfach(s, z);
    return { km, stufe: gkvStufeFuerKm(km), start: startAdr, ziel: z };
  }catch(e){
    return { fehler: 'Keine Verbindung zum Kartendienst – bitte die Stufe der Wegepauschale unten von Hand wählen.' };
  }
}
