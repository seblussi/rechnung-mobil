  betaEntwurfVerdrahten(art, korrekturIdx, vorbelegt, holen, geaendert);
}


// =====================================================================
// BETA: Faktoren, Begruendungen und GOÄ-Katalog
// =====================================================================
// - Faktor je Position bearbeitbar (im erlaubten Gebuehrenrahmen der GOÄ).
//   Betrag = Punktzahl x Punktwert (5,82873 Cent) x Faktor, auf Cent
//   gerundet (§ 5 Abs. 1 GOÄ). Beim Standardfaktor bleibt es beim Betrag aus
//   der Excel-Vorlage.
// - Ueber dem Schwellenwert (2,3 / 1,8 / 1,15) ist eine Begruendung Pflicht
//   (§ 12 Abs. 3 GOÄ). Vorgeschlagen wird die zuletzt fuer diese Position
//   verwendete (geraeteuebergreifend in OneDrive), sonst die aus der Vorlage.
//   Leere Begruendung = keine Zeile "Begründung:" in der Rechnung.
// - Je Fall: positionsDetails = {faktoren:{ZIFFER:Zahl}, begruendungen:{ZIFFER:Text},
//   anzahl:{ZIFFER:n} (nur n >= 2), abgewaehlt:[ZIFFER] (automatische
//   Positionen, die wegen eines GOÄ-Ausschlusses bewusst abgewaehlt wurden)}

const GOAE_PW = (typeof GOAE_PUNKTWERT !== 'undefined') ? GOAE_PUNKTWERT : 0.0582873;
// Rahmen: Schwellenwert, Hoechstsatz, Schnellwahl
const GOAE_RAHMEN = {
  n: { schwelle: 2.3,  max: 3.5, stufen: [1, 1.8, 2.3, 2.5, 3, 3.5] },
  t: { schwelle: 1.8,  max: 2.5, stufen: [1, 1.3, 1.8, 2, 2.5] },
  l: { schwelle: 1.15, max: 1.3, stufen: [1, 1.15, 1.3] },
  f: { schwelle: 1,    max: 1,   stufen: [1] }
};
// Falls der Katalog (goae_katalog.js) nicht geladen werden konnte: die in der
// Vorlage verwendeten Ziffern
const GOAE_NOTFALL = { '1':[80,'n'], '4':[220,'n'], '5':[80,'n'], '7':[160,'n'], '34':[300,'n'], '50':[320,'n'],
  '56':[180,'t'], '60':[120,'n'], '252':[40,'n'], '271':[120,'n'], '602':[152,'t'], '650':[152,'t'], '849':[230,'n'],
  '100':[1896,'f'], '101':[2844,'f'], '102':[474,'f'], 'E':[160,'f'], 'F':[260,'f'], 'G':[450,'f'], 'H':[340,'f'] };

function goaeNorm(z){ return String(z == null ? '' : z).trim().toUpperCase().replace(/\s+/g, ''); }
function goaeIndex(){
  if(!goaeIndex.m){
    const m = new Map();
    if(typeof GOAE_KATALOG !== 'undefined') GOAE_KATALOG.forEach(e=> m.set(goaeNorm(e[0]), e));
    goaeIndex.m = m;
  }
  return goaeIndex.m;
}
function goaeVerfuegbar(){ return typeof GOAE_KATALOG !== 'undefined' && GOAE_KATALOG.length > 0; }
// -> {nr, punkte, text, typ} oder null
function goaeEintrag(z){
  const k = goaeNorm(z); if(!k) return null;
  const e = goaeIndex().get(k);
  if(e) return { nr: e[0], punkte: e[1], text: e[2], typ: e[3] };
  const n = GOAE_NOTFALL[k];
  return n ? { nr: k, punkte: n[0], text: '', typ: n[1] } : null;
}
function goaeSuchen(text, max){
  const s = String(text || '').trim().toLowerCase();
  if(!s || !goaeVerfuegbar()) return [];
  const nur = goaeNorm(s);
  const treffer = [];
  for(const e of GOAE_KATALOG){
    const nr = String(e[0]).toLowerCase();
    let rang = -1;
    if(nr === s || goaeNorm(nr) === nur) rang = 0;
    else if(nr.indexOf(s) === 0) rang = 1;
    else if(s.length >= 3){ const p = e[2].toLowerCase().indexOf(s); if(p >= 0) rang = 2 + Math.min(p, 200) / 1000; }
    if(rang >= 0) treffer.push({ e, rang });
  }
  treffer.sort((a, b)=> a.rang - b.rang || String(a.e[0]).length - String(b.e[0]).length || String(a.e[0]).localeCompare(String(b.e[0]), 'de', { numeric: true }));
  return treffer.slice(0, max || 40).map(t=> ({ nr: t.e[0], punkte: t.e[1], text: t.e[2], typ: t.e[3] }));
}
function betaRund2(v){ return Math.round((Number(v) + (v >= 0 ? 1e-9 : -1e-9)) * 100) / 100; }
function betaFaktorText(f){ return String(Math.round(Number(f) * 100) / 100).replace('.', ','); }
function betaFaktorLesen(t){ const n = Number(String(t == null ? '' : t).trim().replace(',', '.')); return isNaN(n) ? NaN : Math.round(n * 100) / 100; }
function betaEuro(v){ return (Math.round(Number(v) * 100) / 100).toFixed(2).replace('.', ',') + ' €'; }

// ---------- Eigenschaften einer Position ----------
// p: Eintrag wie in den Rechnungspositionen ({ziffer, bez, betrag, faktor,
// eigene?, anzeigeZiffer?, punkte?})
function betaPosSchluessel(p){ return goaeNorm(p.ziffer); }
function betaPosNr(p){ return p.eigene ? goaeNorm(p.anzeigeZiffer) : goaeNorm(p.ziffer); }
function betaPosStandardFaktor(p){ const f = betaFaktorLesen(p.faktor); return isNaN(f) || f <= 0 ? 1 : f; }
function betaPosRahmen(p){
  const nr = betaPosNr(p);
  if(!p.eigene && (/^W[TN]\d/.test(nr) || nr === 'REISE' || nr === '')) return null;
  const e = goaeEintrag(nr);
  if(e) return { typ: e.typ, ...GOAE_RAHMEN[e.typ] };
  if(p.eigene) return String(p.faktor == null ? '' : p.faktor).trim() ? { typ: 'n', ...GOAE_RAHMEN.n } : null;
  return { typ: 'n', ...GOAE_RAHMEN.n };
}
function betaPosFaktorEditierbar(p){ const r = betaPosRahmen(p); return !!r && r.typ !== 'f'; }
function betaPosPunkte(p){
  if(p.eigene && Number(p.punkte) > 0) return Number(p.punkte);
  const e = goaeEintrag(betaPosNr(p));
  return e && e.punkte ? e.punkte : null;
}
// Einfachsatz (unrund) -- aus der Punktzahl, sonst aus Betrag/Faktor
function betaPosEinfachsatz(p){
  const pk = betaPosPunkte(p);
  if(pk) return pk * GOAE_PW;
  return Number(p.betrag) / betaPosStandardFaktor(p);
}
function betaPosBetrag(p, faktor){
  const f = betaFaktorLesen(faktor);
  if(isNaN(f) || Math.abs(f - betaPosStandardFaktor(p)) < 1e-9) return Number(p.betrag);
  const pk = betaPosPunkte(p);
  if(pk) return betaRund2(pk * GOAE_PW * f);
  return betaRund2(Number(p.betrag) / betaPosStandardFaktor(p) * f);
}

// ---------- Anzahl (mehrfach erbrachte Leistung) ----------
// Eine Leistung darf mehrfach berechnet werden, wenn sie mehrfach erbracht
// wurde (z.B. zwei Injektionen) -- bei Zeitleistungen steht es in der
// Leistungslegende ("je angefangene halbe Stunde", z.B. 56). Besuche,
// Leichenschau und Visiten gibt es je Inanspruchnahme nur einmal, Zuschlaege
// und Wegegeld ohnehin nur einmal.
const GOAE_NUR_EINMAL = /^(4[5-9]|5[0-5]|10[0-7]|435)$/;
function betaPosAnzahlRegel(p){
  if(!p || !betaPosFaktorEditierbar(p)) return null;
  const nr = betaPosNr(p);
  if(!nr || GOAE_NUR_EINMAL.test(nr)) return null;
  const e = goaeEintrag(nr);
  const m = e && /je (angefangene|weitere|vollendete)[^,;]*$/i.exec(String(e.text || '').trim());
  return { je: m ? m[0] : '' };
}
function betaAnzahlVon(details, k){
  const n = details && details.anzahl ? Math.floor(Number(details.anzahl[k])) : 1;
  return n >= 2 ? Math.min(n, 99) : 1;
}

// ---------- Begruendungs-Vorlagen (zuletzt verwendet) ----------
// Liegen zusaetzlich in eigene_positionen.json (Feld "begruendungen"),
// Schluessel "art:ZIFFER" -> {text, am}
function betaBegrVorlagen(){ return betaEigeneDatenVoll().begruendungen || {}; }
function betaBegrVorlage(art, schl){ const v = betaBegrVorlagen()[art + ':' + goaeNorm(schl)]; return v ? v : null; }
// Gemerkt wird der zuletzt verwendete Text; wurde die Begruendung zuletzt
// bewusst leer gelassen, steht zusaetzlich "leer" (der Text bleibt als
// Vorschlag erhalten, z.B. wenn der Faktor spaeter wieder hoch geht).
function betaBegrVorlagenSpeichern(art, map){
  const jetzt = new Date().toISOString();
  const aend = {};
  Object.keys(map).forEach(k=>{
    const alt = betaBegrVorlage(art, k);
    const t = String(map[k] || '').trim();
    const neu = t ? { text: t, leer: false } : { text: (alt && alt.text) || '', leer: true };
    if(!alt || alt.text !== neu.text || !!alt.leer !== neu.leer) aend[art + ':' + goaeNorm(k)] = { ...neu, am: jetzt };
  });
  if(!Object.keys(aend).length) return;
  const anwenden = d=>{ d.begruendungen = { ...(d.begruendungen || {}), ...aend }; };
  const d = betaEigeneDatenVoll(); anwenden(d); LS.set(EIGENE_POS_CACHE, d);
  if(msGraphStatus === 'angemeldet') betaEigeneAbgleichen(anwenden).catch(()=>{});
}
// Standard-Begruendung einer Position: zuletzt verwendet > Vorlage > leer
// (legacy = bereits gestellte Rechnung ohne gespeicherte Details: dort gilt
// die Begruendung, die auch in der Rechnung steht -- die aus der Vorlage)
function betaPosStandardBegruendung(art, p, legacy){
  if(legacy) return String(p.begruendung || '');
  const v = betaBegrVorlage(art, betaPosSchluessel(p));
  if(v){
    // Pflicht schon beim Standardfaktor -> immer den letzten Text vorschlagen
    const r = betaPosRahmen(p);
    const pflicht = r && betaPosStandardFaktor(p) > r.schwelle + 1e-9;
    return (v.leer && !pflicht) ? '' : (v.text || String(p.begruendung || ''));
  }
  return String(p.begruendung || '');
}

// ---------- Details eines Falls ----------
function betaSetMitDetails(arr, details, legacy){
  const s = new Set(arr || []);
  if(details) s.details = JSON.parse(JSON.stringify(details));
  else if(legacy) s.legacy = true;
  return s;
}
function betaKatalogFlach(art){ return allePositionenFlach(art === 'ls' ? POSITIONEN_LS : POSITIONEN_PT); }
// Vollstaendige Details fuer die ausgewaehlten Positionen (Standardwerte
// ergaenzt). Positionen ohne bearbeitbaren Faktor bekommen keinen Eintrag.
function betaDetailsVervollstaendigen(art, auswahl, details, alle, legacy){
  alle = alle || betaKatalogFlach(art);
  const d = { faktoren: {}, begruendungen: {}, anzahl: {}, abgewaehlt: [], behalten: [] };
  const alt = details || {};
  const liste = auswahl ? Array.from(auswahl) : [];
  liste.forEach(z=>{
    const p = alle.find(x=> goaeNorm(x.ziffer) === goaeNorm(z));
    if(!p || !betaPosFaktorEditierbar(p)) return;
    const k = betaPosSchluessel(p);
    const f = alt.faktoren && alt.faktoren[k] !== undefined ? betaFaktorLesen(alt.faktoren[k]) : betaPosStandardFaktor(p);
    d.faktoren[k] = isNaN(f) ? betaPosStandardFaktor(p) : f;
    d.begruendungen[k] = alt.begruendungen && alt.begruendungen[k] !== undefined ? String(alt.begruendungen[k]) : betaPosStandardBegruendung(art, p, legacy);
    const n = betaAnzahlVon(alt, k);
    if(n > 1 && betaPosAnzahlRegel(p)) d.anzahl[k] = n;
  });
  const gewaehlt = new Set(liste.map(goaeNorm));
  d.abgewaehlt = (alt.abgewaehlt || []).map(goaeNorm).filter(z=> z && !gewaehlt.has(z));
  d.behalten = (alt.behalten || []).map(goaeNorm).filter(z=> z && gewaehlt.has(z));
  return d;
}
function betaEffektivBetrag(art, p, details){
  if(!p) return 0;
  if(p.ziffer === 'REISE') return Number(p.betrag);
  const k = betaPosSchluessel(p);
  const einzeln = (details && details.faktoren && details.faktoren[k] !== undefined && betaPosFaktorEditierbar(p)) ? betaPosBetrag(p, details.faktoren[k]) : Number(p.betrag);
  return betaRund2(einzeln * betaAnzahlVon(details, k));
}
// Positionen ueber dem Schwellenwert ohne Begruendung -> [{p, faktor}]
function betaBegruendungFehlt(art, auswahl, details, alle){
  alle = alle || betaKatalogFlach(art);
  const d = betaDetailsVervollstaendigen(art, auswahl, details, alle);
  const fehlt = [];
  Object.keys(d.faktoren).forEach(k=>{
    const p = alle.find(x=> betaPosSchluessel(x) === k);
    const r = p && betaPosRahmen(p);
    if(r && d.faktoren[k] > r.schwelle + 1e-9 && !String(d.begruendungen[k] || '').trim()) fehlt.push({ p, faktor: d.faktoren[k] });
  });
  return fehlt;
}
function betaFehltText(fehlt){
  return fehlt.map(x=> (x.p.anzeigeZiffer !== undefined ? x.p.anzeigeZiffer : x.p.ziffer) + ' (Faktor ' + betaFaktorText(x.faktor) + ')').join(', ');
}
// Beim Speichern des Falls (Maske)
function betaDetailsFuerSpeichern(art, auswahl){
  if(!auswahl) return null;
  // bereits gestellte Rechnung, Positionen nicht angefasst -> unveraendert lassen
  if(!auswahl.details && auswahl.legacy) return null;
  return betaDetailsVervollstaendigen(art, auswahl, auswahl.details);
}

// ---------- Fuer Word-Erzeugung und Spalte U ----------
// Liefert {posDetails, begruendungen} (Schluessel in Grossbuchstaben) bzw.
// leere Objekte fuer aeltere Faelle ohne Details.
function betaDetailsFuerGenerator(f){
  const det = f.positionsDetails;
  if(!det) return { posDetails: {}, begruendungen: undefined, anzahl: {} };
  const alle = betaKatalogFlach(f.art);
  const posDetails = {}, begruendungen = {}, anzahl = {};
  Object.keys(det.anzahl || {}).forEach(k=>{ const n = betaAnzahlVon(det, k); if(n > 1) anzahl[goaeNorm(k)] = n; });
  Object.keys(det.faktoren || {}).forEach(k=>{
    if(/^EIG/i.test(k)) return;
    const p = alle.find(x=> betaPosSchluessel(x) === k);
    if(!p) return;
    const fak = betaFaktorLesen(det.faktoren[k]);
    if(!isNaN(fak) && Math.abs(fak - betaPosStandardFaktor(p)) > 1e-9) posDetails[k] = { faktor: fak, betrag: betaPosBetrag(p, fak) };
  });
  // Begruendung nur, wenn der Faktor ueber dem Schwellenwert liegt (sonst
  // bleibt der Text nur als Vorlage gespeichert und wird nicht gedruckt)
  Object.keys(det.begruendungen || {}).forEach(k=>{
    let p = alle.find(x=> betaPosSchluessel(x) === k);
    if(!p && /^EIG/i.test(k) && f.eigenePositionen && f.eigenePositionen[k]) p = betaEigenePositionAlsAuswahl({ id: k, ...f.eigenePositionen[k] });
    const r = p && betaPosRahmen(p);
    const fak = det.faktoren && det.faktoren[k] !== undefined ? betaFaktorLesen(det.faktoren[k]) : (p ? betaPosStandardFaktor(p) : NaN);
    const t = String(det.begruendungen[k] || '').trim();
    begruendungen[k] = (r && !isNaN(fak) && fak > r.schwelle + 1e-9) ? t : '';
  });
  return { posDetails, begruendungen, anzahl };
}
// eigene Positionen des Falls mit dem Faktor aus den Details
function betaEigeneMitDetails(f, eigene){
  const det = f.positionsDetails;
  return (eigene || []).map(p=>{
    const k = goaeNorm(p.schluessel);
    if(!det || !det.faktoren || det.faktoren[k] === undefined) return p;
    const auswahl = { ...betaEigenePositionAlsAuswahl({ id: p.schluessel, ziffer: p.ziffer, faktor: p.faktor, bez: p.bez, betrag: p.betrag, punkte: p.punkte }) };
    if(!betaPosFaktorEditierbar(auswahl)) return p;
    const fak = betaFaktorLesen(det.faktoren[k]);
    return { ...p, faktor: fak, betrag: betaPosBetrag(auswahl, fak) };
  });
}
function betaUKodieren(t){ return encodeURIComponent(String(t == null ? '' : t)); }
function betaUDekodieren(t){ try{ return decodeURIComponent(String(t || '')); }catch(e){ return String(t || ''); } }
// Zusaetzliche Abschnitte fuer Spalte U (FAK, BEG, EIG), damit der PC
// Faktor, Begruendung und eigene Positionen genauso wiederherstellen kann:
//   FAK:50=2.3/42.90;7=2.3/21.45      (Faktor/Betrag, nur wenn abweichend)
//   BEG:50=<Zeile1%0AZeile2>;271=      (fehlende Ziffer = keine Begruendung)
//   EIG:EIGxyz=<Ziffer>/<Faktor>/<Betrag>/<Zeile1%0AZeile2>
//   ANZ:56=2;EIGxyz=3                  (Anzahl, nur wenn > 1; Betrag oben je Einzelleistung)
//   ABW:H,50                           (automatische Positionen bewusst abgewaehlt)
// Texte sind URL-kodiert (UTF-8), Zeilen so umbrochen wie in der Rechnung.
function betaUSegmente(f){
  const teile = [];
  const gen = betaDetailsFuerGenerator(f);
  const fak = Object.keys(gen.posDetails).map(k=> betaUKodieren(k) + '=' + gen.posDetails[k].faktor + '/' + gen.posDetails[k].betrag.toFixed(2));
  if(fak.length) teile.push('FAK:' + fak.join(';'));
  if(gen.begruendungen){
    const beg = Object.keys(gen.begruendungen).filter(k=> gen.begruendungen[k])
      .map(k=> betaUKodieren(k) + '=' + betaUKodieren(rdBegruendungZeilen(gen.begruendungen[k], f.art).join('\n')));
    teile.push('BEG:' + beg.join(';'));
  }
  const anz = Object.keys(gen.anzahl || {}).map(k=> betaUKodieren(k) + '=' + gen.anzahl[k]);
  if(anz.length) teile.push('ANZ:' + anz.join(';'));
  const abw = ((f.positionsDetails || {}).abgewaehlt || []).map(goaeNorm).filter(Boolean);
  if(abw.length) teile.push('ABW:' + abw.map(betaUKodieren).join(','));
  let eigene = [];
  try{ eigene = betaEigeneMitDetails(f, betaEigeneFuerFall(f)); }catch(e){ eigene = []; }
  if(eigene.length){
    teile.push('EIG:' + eigene.map(p=> betaUKodieren(p.schluessel) + '=' + betaUKodieren(p.ziffer || '') + '/' +
      (String(p.faktor == null ? '' : p.faktor).trim() === '' ? '' : String(p.faktor).replace(',', '.')) + '/' +
      (Math.round(Number(p.betrag) * 100) / 100).toFixed(2) + '/' + betaUKodieren(rdBezUmbrechen(p.bez, rdBezBreite(f.art)).join('\n'))).join(';'));
  }
  return teile.length ? ' | ' + teile.join(' | ') : '';
}
// Gegenstueck beim Einlesen einer Uebersichtszeile
function betaUSegmenteLesen(u){
  const teil = (key)=>{ const m = new RegExp('(?:^|\\|)\\s*' + key + ':([^|]*)', 'i').exec(u); return m ? m[1].trim() : null; };
  const eintraege = (s)=> (s || '').split(';').map(x=> x.trim()).filter(Boolean).map(x=>{ const i = x.indexOf('='); return i < 0 ? [x, ''] : [x.slice(0, i), x.slice(i + 1)]; });
  const fak = teil('FAK'), beg = teil('BEG'), eig = teil('EIG'), anz = teil('ANZ'), abw = teil('ABW');
  const out = { details: null, eigene: {} };
  if(fak !== null || beg !== null || anz !== null || abw !== null){
    out.details = { faktoren: {}, begruendungen: beg !== null ? {} : undefined };
    eintraege(anz).forEach(([k, v])=>{ const n = Math.floor(Number(v)); if(n > 1) (out.details.anzahl = out.details.anzahl || {})[goaeNorm(betaUDekodieren(k))] = n; });
    if(abw) out.details.abgewaehlt = abw.split(',').map(x=> goaeNorm(betaUDekodieren(x))).filter(Boolean);
    eintraege(fak).forEach(([k, v])=>{ const f = betaFaktorLesen(v.split('/')[0]); if(!isNaN(f)) out.details.faktoren[goaeNorm(betaUDekodieren(k))] = f; });
    if(beg !== null) eintraege(beg).forEach(([k, v])=>{ out.details.begruendungen[goaeNorm(betaUDekodieren(k))] = betaUDekodieren(v).split('\n').join(' ').trim(); });
  }
  eintraege(eig).forEach(([k, v])=>{
    const s = v.split('/');
    out.eigene[betaUDekodieren(k)] = { ziffer: betaUDekodieren(s[0]), faktor: (s[1] || '').replace('.', ','), betrag: Number(s[2]) || 0,
                                        bez: betaUDekodieren(s.slice(3).join('/')).split('\n').join(' ').trim() };
    // Faktor der eigenen Position gilt fuer diese Rechnung (auch wenn die
    // Position auf diesem Geraet mit anderem Standardfaktor angelegt ist)
    const f = betaFaktorLesen(s[1]);
    if(!isNaN(f) && s[1]){
      if(!out.details) out.details = { faktoren: {}, begruendungen: undefined };
      out.details.faktoren[goaeNorm(betaUDekodieren(k))] = f;
    }
  });
  return out;
}

// ---------- Dialog: Faktor und Begruendung ----------
async function betaFaktorDialog(art, p, faktor, begruendung, anzahl){
  const r = betaPosRahmen(p);
  const regel = betaPosAnzahlRegel(p);
  const einfach = betaPosEinfachsatz(p);
  const pk = betaPosPunkte(p);
  const nr = p.anzeigeZiffer !== undefined ? p.anzeigeZiffer : p.ziffer;
  const vorlage = betaBegrVorlage(art, betaPosSchluessel(p));
  let w = { faktor: betaFaktorText(faktor), beg: begruendung || '', anzahl: String(anzahl > 1 ? anzahl : 1) }, fehler = '';
  for(;;){
    const html = (fehler ? '<div class="beta-form-fehler">' + htmlEsc(fehler) + '</div>' : '') +
      '<div class="beta-erg-klein">' + htmlEsc(p.eigene ? p.bez : String(p.bez).replace(/<[^>]+>/g, '')) + '</div>' +
      '<div class="beta-erg-klein" style="margin-top:4px;">Einfachsatz ' + betaEuro(einfach) + (pk ? ' (' + pk + ' Punkte)' : '') +
      ' · Schwellenwert ' + betaFaktorText(r.schwelle) + ' · Höchstsatz ' + betaFaktorText(r.max) + '</div>' +
      '<div class="beta-form">' +
      (regel ? '<label>Anzahl<span class="anzahl-reihe"><button type="button" data-d="-1">&minus;</button><input id="fdAnzahl" value="' + htmlEsc(w.anzahl) + '" inputmode="numeric" autocomplete="off"><button type="button" data-d="1">+</button></span></label>' +
        '<div class="beta-erg-klein">' + (regel.je ? 'Laut GOÄ „' + htmlEsc(regel.je) + '“ – mehrfach berechnungsfähig.' : 'Nur wenn die Leistung tatsächlich mehrfach erbracht wurde (z.B. zwei Injektionen).') + ' Steht dann entsprechend oft in der Rechnung.</div>' : '') +
      '<label>Faktor<input id="fdFaktor" value="' + htmlEsc(w.faktor) + '" inputmode="decimal" autocomplete="off"></label>' +
      '<div class="faktor-stufen">' + r.stufen.map(s=> '<button type="button" data-f="' + s + '">' + betaFaktorText(s) + '</button>').join('') + '</div>' +
      '<div class="faktor-betrag" id="fdBetrag"></div>' +
      '<label id="fdBegLabel">Begründung<textarea id="fdBeg" rows="3">' + htmlEsc(w.beg) + '</textarea></label>' +
      (vorlage && vorlage.text && vorlage.text !== w.beg ? '<button type="button" class="faktor-vorlage" id="fdVorlage">Zuletzt verwendet einsetzen: „' + htmlEsc(vorlage.text.length > 60 ? vorlage.text.slice(0, 60) + '…' : vorlage.text) + '“</button>' : '') +
      '</div><div class="beta-erg-klein" id="fdHinweis"></div>';
    const warte = betaOverlay.ergebnis('Ziffer ' + nr, html, [{ label:'Abbrechen', akt:'nein' }, { label:'Übernehmen', akt:'ja', primaer:true }]);
    const fEl = document.getElementById('fdFaktor'), bEl = document.getElementById('fdBeg'), aEl = document.getElementById('fdAnzahl');
    let warPflicht = null;
    const anzahlJetzt = ()=>{ const n = aEl ? Math.floor(Number(aEl.value)) : 1; return n >= 1 && n <= 99 ? n : NaN; };
    const aktual = ()=>{
      const f = betaFaktorLesen(fEl.value);
      const ok = !isNaN(f) && f >= 1 && f <= r.max + 1e-9;
      const n = anzahlJetzt();
      document.getElementById('fdBetrag').textContent = !ok ? 'Faktor zwischen 1 und ' + betaFaktorText(r.max)
        : isNaN(n) ? 'Anzahl zwischen 1 und 99'
        : n > 1 ? 'Betrag: ' + n + ' × ' + betaEuro(betaPosBetrag(p, f)) + ' = ' + betaEuro(betaRund2(betaPosBetrag(p, f) * n)) : 'Betrag: ' + betaEuro(betaPosBetrag(p, f));
      const pflicht = ok && f > r.schwelle + 1e-9;
      // ueber den Schwellenwert gegangen und noch leer -> Vorschlag einsetzen
      const vorschlag = (vorlage && vorlage.text) || String(p.begruendung || '');
      if(pflicht && warPflicht === false && !bEl.value.trim() && vorschlag){ bEl.value = vorschlag; if(vEl) vEl.remove(); }
      warPflicht = pflicht;
      document.getElementById('fdBegLabel').firstChild.textContent = pflicht ? 'Begründung (Pflicht über ' + betaFaktorText(r.schwelle) + ')' : 'Begründung (wird erst über ' + betaFaktorText(r.schwelle) + ' gedruckt – bleibt als Vorlage gespeichert)';
      bEl.classList.toggle('pflichtfeld-fehlt', pflicht && !bEl.value.trim());
      document.querySelectorAll('.faktor-stufen button').forEach(b=> b.classList.toggle('aktiv', ok && Math.abs(Number(b.dataset.f) - f) < 1e-9));
    };
    const vEl = document.getElementById('fdVorlage');
    fEl.addEventListener('input', aktual); bEl.addEventListener('input', aktual);
    if(aEl){
      aEl.addEventListener('input', aktual);
      document.querySelectorAll('.anzahl-reihe button').forEach(b=> b.onclick = ()=>{ const n = anzahlJetzt(); aEl.value = String(Math.max(1, Math.min(99, (isNaN(n) ? 1 : n) + Number(b.dataset.d)))); aktual(); });
    }
    document.querySelectorAll('.faktor-stufen button').forEach(b=> b.onclick = ()=>{ fEl.value = betaFaktorText(b.dataset.f); aktual(); });
    if(vEl) vEl.onclick = ()=>{ bEl.value = vorlage.text; vEl.remove(); aktual(); };
    aktual();
    const akt = await warte;
    w = { faktor: fEl.value.trim(), beg: bEl.value.replace(/\s+/g, ' ').trim(), anzahl: aEl ? aEl.value.trim() : '1' };
    if(akt !== 'ja'){ betaOverlay.schliessen(); return null; }
    const f = betaFaktorLesen(w.faktor);
    const n = anzahlJetzt();
    if(isNaN(n)) fehler = 'Bitte eine Anzahl zwischen 1 und 99 eintragen.';
    else if(isNaN(f) || f < 1) fehler = 'Bitte einen gültigen Faktor eintragen (z.B. 2,3).';
    else if(f > r.max + 1e-9) fehler = 'Höchstens ' + betaFaktorText(r.max) + ' – darüber nur mit schriftlicher Honorarvereinbarung (§ 2 GOÄ).';
    else if(f > r.schwelle + 1e-9 && !w.beg) fehler = 'Über dem ' + betaFaktorText(r.schwelle) + '-fachen ist eine Begründung Pflicht (§ 12 Abs. 3 GOÄ).';
    else { betaOverlay.schliessen(); return { faktor: f, begruendung: w.beg, anzahl: n }; }
  }
}

// ---------- GOÄ-Ausschluesse ("neben ... nicht berechnungsfähig") ----------
function goaeAusschluesse(nr){
  const k = goaeNorm(nr);
  if(typeof GOAE_AUSSCHLUESSE === 'undefined' || !k) return [];
  return GOAE_AUSSCHLUESSE[k] || [];
}
// Positionen aus "andere", die neben p laut GOÄ nicht berechnet werden duerfen
// Zusaetzlich aus dem Text der GOÄ, ohne Ziffer: neben 52 ist Wegegeld
// (und damit auch die Reiseentschaedigung) nicht berechnungsfaehig
const GOAE_OHNE_WEGEGELD = ['52'];
const istWegegeld = (nr)=> /^(W[TN]\d+|REISE)$/.test(nr);
function betaGoaeKonflikte(p, andere){
  const nr = betaPosNr(p);
  if(!nr) return [];
  const aus = goaeAusschluesse(nr);
  return andere.filter(q=>{
    if(q === p || q.ziffer === p.ziffer) return false;
    const qn = betaPosNr(q);
    if((GOAE_OHNE_WEGEGELD.includes(nr) && istWegegeld(qn)) || (GOAE_OHNE_WEGEGELD.includes(qn) && istWegegeld(nr))) return true;
    return aus.includes(qn) || goaeAusschluesse(qn).includes(nr);
  });
}
// Automatik (Uhrzeit/Datum/km geaendert) will eine Position neu setzen, die
// laut GOÄ neben einer gewaehlten nicht berechnungsfaehig ist -> nicht setzen
// und als "abgewaehlt" vermerken. Ausnahme: der Ausschluss wurde bewusst mit
// "Beide behalten" bestaetigt (details.behalten).
function betaAutoGoaeSperre(art, z, auswahl){
  const alle = betaKatalogFlach(art);
  const p = alle.find(x=> goaeNorm(x.ziffer) === goaeNorm(z));
  if(!p) return false;
  const andere = Array.from(auswahl).map(y=> alle.find(x=> goaeNorm(x.ziffer) === goaeNorm(y))).filter(Boolean);
  const k = betaGoaeKonflikte(p, andere);
  if(!k.length) return false;
  const beh = ((auswahl.details || {}).behalten || []).map(goaeNorm);
  if(beh.includes(goaeNorm(z)) || k.every(q=> beh.includes(goaeNorm(q.ziffer)))) return false;
  const d = auswahl.details;
  if(d){ d.abgewaehlt = d.abgewaehlt || []; if(!d.abgewaehlt.includes(goaeNorm(z))) d.abgewaehlt.push(goaeNorm(z)); }
  return true;
}
function betaPosAnzeigeNr(p){ return p.anzeigeZiffer !== undefined ? (p.anzeigeZiffer || '(ohne Ziffer)') : p.ziffer; }

// ---------- Ansicht "Rechnungspositionen" ----------
// Ersetzt die bisherige Ansicht (gleiche Gruppen, Ausschluesse und
// Automatik), zusaetzlich: Faktor je Position, Begruendung, Summe unten fest.
// Die gewaehlte Ziffernmenge traegt die Details als Eigenschaft ".details".
function ansichtPositionen(art, ausgewaehlteZiffern, betragSchaetzung, weiter, kmFahrstreckeGesamt){
  setzeTitel('Rechnungspositionen', ()=>ruecksprungAusEinstellungen());
  aktuellerZurueckHandler = ()=>{ vorbereiteRuecksprung(); ruecksprungAusEinstellungen(); };
  const katalog = art==='ls' ? POSITIONEN_LS : POSITIONEN_PT;
  const reise = reiseGesamtBetrag(kmFahrstreckeGesamt);
  const reiseBez = reise.kmGerundet>0
    ? `${REISEENTSCHAEDIGUNG.bez} (${reise.basis.toFixed(2).replace('.',',')} &euro;) + Wegstrecke ${reise.kmGerundet} km &times; 0,26 &euro;/km (${reise.kmZeile.toFixed(2).replace('.',',')} &euro;)`
    : `${REISEENTSCHAEDIGUNG.bez} (zzgl. 0,26 &euro;/km Wegstrecke, sobald km bekannt)`;
  const eEintrag = (katalog.grundleistung||[]).find(p=>p.ziffer==='E');
  const grundOhneE = (katalog.grundleistung||[]).filter(p=>p.ziffer!=='E')
    .map(p=> p.standard ? {...p, automatisch:true} : p);
  const gruppen = [
    {titel:'Grundpauschalen', liste: grundOhneE, automatisch:false},
    {titel:'Eigene Positionen', liste: betaEigene(art).map(betaEigenePositionAlsAuswahl), automatisch:false, eigene:true},
    {titel:'Zeitzuschläge', liste: eEintrag ? [{...eEintrag, automatisch:false}, ...ZUSCHLAEGE_ZEIT] : ZUSCHLAEGE_ZEIT, automatisch:true},
    {titel:'Wegegeld', liste: [...WEGEGELD_TAG, ...WEGEGELD_NACHT, {ziffer:'REISE', bez:reiseBez, betrag:reise.gesamt}], automatisch:true}
  ];
  const alle = [].concat(...gruppen.map(g=> g.liste));
  const posVon = (z)=> alle.find(p=> p.ziffer === z);
  // Details (Faktor/Begruendung) -- auch fuer gerade nicht gewaehlte
  // Positionen merken, damit ein Ab- und wieder Anhaken nichts verliert
  const det = { faktoren: {}, begruendungen: {}, ...JSON.parse(JSON.stringify((ausgewaehlteZiffern && ausgewaehlteZiffern.details) || {})) };
  det.faktoren = det.faktoren || {}; det.begruendungen = det.begruendungen || {};
  det.anzahl = det.anzahl || {}; det.abgewaehlt = (det.abgewaehlt || []).map(goaeNorm); det.behalten = (det.behalten || []).map(goaeNorm);
  // automatische Position bewusst abgewaehlt (GOÄ-Ausschluss) -> bleibt aus
  const abgewaehlt = (p)=> det.abgewaehlt.includes(goaeNorm(p.ziffer));
  const faktorVon = (p)=>{ const k = betaPosSchluessel(p); return det.faktoren[k] !== undefined ? betaFaktorLesen(det.faktoren[k]) : betaPosStandardFaktor(p); };
  const legacy = !!(ausgewaehlteZiffern && ausgewaehlteZiffern.legacy && !ausgewaehlteZiffern.details);
  const begrVon = (p)=>{ const k = betaPosSchluessel(p); return det.begruendungen[k] !== undefined ? det.begruendungen[k] : betaPosStandardBegruendung(art, p, legacy); };
  const anzahlVon = (p)=> betaPosAnzahlRegel(p) ? betaAnzahlVon(det, betaPosSchluessel(p)) : 1;
  const betragVon = (p)=> betaPosFaktorEditierbar(p) ? betaRund2(betaPosBetrag(p, faktorVon(p)) * anzahlVon(p)) : Number(p.betrag);

  let html = `<div class="maske ${art}">`;
  gruppen.forEach(g=>{
    const gemischt = g.liste.some(p => typeof p.automatisch==='boolean' && p.automatisch!==g.automatisch);
    html += `<div class="positionen-gruppe-titel">${g.titel}${(g.automatisch && !gemischt)?' <span class="auto-hinweis">automatisch</span>':''}</div>`;
    g.liste.forEach(p=>{
      const istAuto = (typeof p.automatisch==='boolean') ? p.automatisch : g.automatisch;
      const aus = istAuto && abgewaehlt(p);
      const checked = ausgewaehlteZiffern.has(p.ziffer) && !aus ? 'checked' : '';
      const gesperrt = istAuto && !aus ? 'disabled' : '';
      const mitFaktor = betaPosFaktorEditierbar(p);
      html += `${p.eigene ? `<div class="wisch-huelle" data-eigene="${p.ziffer}"><div class="wisch-hinter">&#128465; Löschen</div>` : ''}<label class="position-zeile${istAuto && !aus?' auto-gesperrt':''}${aus?' auto-aus':''}${mitFaktor?' mit-faktor':''}" data-auto-aus="${aus?'1':'0'}">
        <input type="checkbox" data-ziffer="${htmlEsc(p.ziffer)}" data-betrag="${betragVon(p)}" data-auto="${istAuto?'1':'0'}" ${checked} ${gesperrt}>
        <div class="haupt"><span class="haupt-text"><span class="ziffer">${p.anzeigeZiffer!==undefined ? htmlEsc(p.anzeigeZiffer) : (p.ziffer||'')}</span> ${p.eigene ? htmlEsc(mitFaktor ? (p.eigeneBez || p.bez) : p.bez) : p.bez}${gemischt&&istAuto?' <span class="auto-hinweis">automatisch</span>':''}</span><span class="pos-konflikt" data-z="${htmlEsc(p.ziffer)}"></span>${aus ? '<span class="pos-abgewaehlt">automatisch – wegen GOÄ-Ausschluss abgewählt (antippen = wieder rein)</span>' : ''}${mitFaktor ? `<div class="pos-zusatz" data-z="${htmlEsc(p.ziffer)}"></div>` : ''}</div>
        <div class="betrag">${betragVon(p).toFixed(2).replace('.',',')} &euro;</div>
      </label>${p.eigene ? '</div>' : ''}`;
    });
    if(g.eigene) html += `<button type="button" class="btn-sekundaer" id="btnEigenePosNeu" style="margin:8px 0 4px;">+ Eigene Position hinzufügen</button>${g.liste.length ? '<div class="eigene-hinweis">Zum Löschen nach links wischen.</div>' : ''}`;
  });
  html += `<div class="pos-fuss-platz"></div></div>`;
  html += `<div class="pos-fuss"><div class="summenzeile"><span>Gesamt</span><span id="posSumme">0,00 &euro;</span></div>
    <button class="btn-primaer" id="btnPositionenFertig">Übernehmen</button></div>`;
  app.innerHTML = html;

  function zusatzZeichnen(){
    app.querySelectorAll('.pos-zusatz').forEach(el=>{
      const p = posVon(el.dataset.z); if(!p) return;
      const cb = el.closest('.position-zeile').querySelector('input');
      if(!cb.checked){ el.innerHTML = ''; return; }
      const r = betaPosRahmen(p), f = faktorVon(p), b = String(begrVon(p) || '').trim(), n = anzahlVon(p);
      const pflicht = f > r.schwelle + 1e-9;
      el.innerHTML = `<button type="button" class="faktor-chip${pflicht ? ' hoch' : ''}">${n > 1 ? n + ' &times; &middot; ' : ''}Faktor ${betaFaktorText(f)} &#9998;</button>` +
        (pflicht ? (b ? `<span class="beg-text">Begründung: ${htmlEsc(b)}</span>` : `<span class="beg-text fehlt">Begründung fehlt – antippen</span>`) : '');
      const zeile = el.closest('.position-zeile');
      zeile.querySelector('.betrag').innerHTML = betragVon(p).toFixed(2).replace('.',',') + ' &euro;';
      cb.dataset.betrag = betragVon(p);
      el.onclick = async (ev)=>{
        ev.preventDefault(); ev.stopPropagation();
        const erg = await betaFaktorDialog(art, p, faktorVon(p), begrVon(p), anzahlVon(p));
        if(!erg) return;
        const k = betaPosSchluessel(p);
        det.faktoren[k] = erg.faktor; det.begruendungen[k] = erg.begruendung;
        if(erg.anzahl > 1) det.anzahl[k] = erg.anzahl; else delete det.anzahl[k];
        zusatzZeichnen(); summeBerechnen();
      };
    });
  }
  function summeBerechnen(){
    let summe=0;
    app.querySelectorAll('.position-zeile input:checked').forEach(cb=> summe += parseFloat(cb.dataset.betrag));
    document.getElementById('posSumme').textContent = summe.toFixed(2).replace('.',',')+' €';
    return summe;
  }
  function ausschluesseAktualisieren(){
    if(art!=='pt') return;
    const boxen = Array.from(app.querySelectorAll('.position-zeile input'));
    const aktive = new Set(boxen.filter(cb=>cb.checked).map(cb=>cb.dataset.ziffer));
    boxen.forEach(cb=>{
      if(cb.dataset.auto==='1') return;
      const ausschluesse = ZIFFER_AUSSCHLUESSE[cb.dataset.ziffer];
      const zeile = cb.closest('.position-zeile');
      if(!ausschluesse){ cb.disabled=false; if(zeile) zeile.style.opacity=''; return; }
      const gesperrt = ausschluesse.some(z=> aktive.has(z));
      if(gesperrt && cb.checked) cb.checked = false;
      cb.disabled = gesperrt;
      if(zeile) zeile.style.opacity = gesperrt ? '0.45' : '';
    });
  }
  const gewaehltePositionen = ()=> Array.from(app.querySelectorAll('.position-zeile input:checked')).map(cb=> posVon(cb.dataset.ziffer)).filter(Boolean);
  const boxVon = (q)=> app.querySelector('.position-zeile input[data-ziffer="' + CSS.escape(q.ziffer) + '"]');
  function konflikteZeichnen(){
    const aktiv = gewaehltePositionen();
    app.querySelectorAll('.pos-konflikt').forEach(el=>{
      const p = posVon(el.dataset.z);
      const zeile = el.closest('.position-zeile');
      const gewaehlt = p && aktiv.includes(p);
      const k = p ? betaGoaeKonflikte(p, aktiv) : [];
      // nicht gewaehlte, die neben einer gewaehlten ausgeschlossen sind:
      // ausgegraut, bleiben aber anhakbar (dann kommt die Rueckfrage)
      const grau = !!p && !gewaehlt && k.length > 0;
      if(zeile) zeile.classList.toggle('goae-aus', grau);
      el.classList.toggle('still', grau);
      el.textContent = !k.length ? '' : gewaehlt ? '⚠ laut GOÄ nicht neben ' + k.map(betaPosAnzeigeNr).join(', ') + ' berechnungsfähig'
                                                 : 'laut GOÄ nicht neben ' + k.map(betaPosAnzeigeNr).join(', ');
    });
  }
  // Neu angehakte Position schliesst eine bereits gewaehlte aus -> nachfragen
  // -> 'neu' wenn die Ansicht neu aufgebaut werden muss (Automatik abgewaehlt)
  async function konfliktPruefen(cb){
    const p = posVon(cb.dataset.ziffer); if(!p) return;
    // gleiche Ziffer schon gewaehlt (z.B. als eigene Position doppelt angelegt)?
    const nr = betaPosNr(p);
    const doppelt = nr ? gewaehltePositionen().filter(q=> q !== p && betaPosNr(q) === nr) : [];
    if(doppelt.length){
      const q = doppelt[0], regel = betaPosAnzahlRegel(q);
      const knoepfe = [{ label: 'Abbrechen', akt: 'nein' }, { label: 'Beide behalten', akt: 'beide' }];
      if(regel) knoepfe.push({ label: 'Anzahl auf ' + (anzahlVon(q) + 1) + ' erhöhen', akt: 'anzahl', primaer: true });
      const akt = await betaOverlay.ergebnis('Ziffer ' + betaPosAnzeigeNr(p) + ' schon gewählt',
        htmlEsc('Ziffer ' + betaPosAnzeigeNr(p) + ' ist bereits gewählt.') + '<br><br><span class="beta-erg-klein">' +
        (regel ? htmlEsc('Wurde die Leistung mehrfach erbracht' + (regel.je ? ' (' + regel.je + ')' : '') + ', die Anzahl erhöhen – sie steht dann entsprechend oft in der Rechnung.')
               : htmlEsc('Diese Leistung ist je Inanspruchnahme nur einmal berechnungsfähig.')) + '</span>', knoepfe);
      betaOverlay.schliessen();
      if(akt === 'nein'){ cb.checked = false; return; }
      if(akt === 'anzahl'){ cb.checked = false; det.anzahl[betaPosSchluessel(q)] = anzahlVon(q) + 1; return; }
    }
    const k = betaGoaeKonflikte(p, gewaehltePositionen());
    if(!k.length) return;
    const automatisch = k.filter(q=>{ const c = boxVon(q); return c && c.disabled; });
    const liste = k.map(betaPosAnzeigeNr).join(', ');
    const knoepfe = [{ label: 'Abbrechen', akt: 'nein' }, { label: 'Beide behalten', akt: 'beide' },
                     { label: liste + ' abwählen', akt: 'tauschen', primaer: true }];
    const akt = await betaOverlay.ergebnis('Ausschluss laut GOÄ',
      htmlEsc('Ziffer ' + betaPosAnzeigeNr(p) + ' ist laut GOÄ neben ' + liste + ' nicht berechnungsfähig.') +
      (automatisch.length ? '<br><br><span class="beta-erg-klein">' + htmlEsc(automatisch.map(betaPosAnzeigeNr).join(', ') +
        (automatisch.length === 1 ? ' ist' : ' sind') + ' automatisch gesetzt. Beim Abwählen ' + (automatisch.length === 1 ? 'bleibt sie' : 'bleiben sie') +
        ' für diese Rechnung draußen (auch wenn sich Uhrzeit oder km ändern) und ' + (automatisch.length === 1 ? 'lässt' : 'lassen') + ' sich hier wieder anhaken.') + '</span>' : ''), knoepfe);
    betaOverlay.schliessen();
    if(akt === 'nein') cb.checked = false;
    else if(akt === 'beide') [p, ...k].forEach(q=>{ const z = goaeNorm(q.ziffer); if(!det.behalten.includes(z)) det.behalten.push(z); });
    else if(akt === 'tauschen'){
      k.forEach(q=>{ const c = boxVon(q); if(c) c.checked = false; });
      automatisch.forEach(q=>{ const z = goaeNorm(q.ziffer); if(!det.abgewaehlt.includes(z)) det.abgewaehlt.push(z); });
      if(automatisch.length) return 'neu';
    }
  }
  function positionAktualisieren(){ ausschluesseAktualisieren(); zusatzZeichnen(); konflikteZeichnen(); summeBerechnen(); }
  const gewaehltJetzt = ()=>{
    const set = new Set(Array.from(app.querySelectorAll('.position-zeile input:checked')).map(cb=> cb.dataset.ziffer));
    set.details = det; return set;
  };
  const neuZeichnen = ()=>{ const y = window.scrollY; ansichtPositionen(art, gewaehltJetzt(), betragSchaetzung, weiter, kmFahrstreckeGesamt); window.scrollTo(0, y); };
  app.querySelectorAll('.position-zeile input').forEach(cb=> cb.addEventListener('change', async ()=>{
    const zeile = cb.closest('.position-zeile');
    // bewusst abgewaehlte Automatik-Position wieder angehakt -> wieder automatisch
    if(cb.checked && zeile && zeile.dataset.autoAus === '1'){
      const z = goaeNorm(cb.dataset.ziffer);
      det.abgewaehlt = det.abgewaehlt.filter(x=> x !== z);
      await konfliktPruefen(cb);
      if(!cb.checked && !det.abgewaehlt.includes(z)) det.abgewaehlt.push(z);
      neuZeichnen(); return;
    }
    if(cb.checked && await konfliktPruefen(cb) === 'neu'){ neuZeichnen(); return; }
    positionAktualisieren();
  }));
  positionAktualisieren();
  betaEigenePositionenVerdrahten(art, (neuId, entferntId)=>{
    const set = gewaehltJetzt();
    if(neuId){ set.add(neuId); set.pruefen = neuId; }
    if(entferntId) set.delete(entferntId);
    ansichtPositionen(art, set, betragSchaetzung, weiter, kmFahrstreckeGesamt);
  });
  // neu angelegte eigene Position ist gleich angehakt -> Ausschluesse pruefen
  if(ausgewaehlteZiffern && ausgewaehlteZiffern.pruefen){
    const cb = app.querySelector('.position-zeile input[data-ziffer="' + CSS.escape(ausgewaehlteZiffern.pruefen) + '"]');
    if(cb && cb.checked) setTimeout(async ()=>{ if(await konfliktPruefen(cb) === 'neu') neuZeichnen(); else positionAktualisieren(); }, 0);
  }

  document.getElementById('btnPositionenFertig').onclick = async ()=>{
    const gewaehlt = gewaehltJetzt();
    const voll = betaDetailsVervollstaendigen(art, gewaehlt, det, alle, legacy);
    const fehlt = betaBegruendungFehlt(art, gewaehlt, voll, alle);
    if(fehlt.length){
      app.querySelectorAll('.beg-text.fehlt').forEach(el=> el.closest('.position-zeile').scrollIntoView({behavior:'smooth', block:'center'}));
      await betaOverlay.meldung('Bitte noch eine Begründung eintragen für: ' + betaFehltText(fehlt) + '.\n\nÜber dem Schwellenwert ist sie Pflicht (§ 12 Abs. 3 GOÄ).', 'Begründung fehlt');
      return;
    }
    // zuletzt verwendete Begruendungen als Vorlage merken (nur wo sie gedruckt werden)
    const vorl = {};
    Object.keys(voll.begruendungen).forEach(k=>{
      const p = alle.find(x=> betaPosSchluessel(x) === k), r = p && betaPosRahmen(p);
      if(r && voll.faktoren[k] > r.schwelle + 1e-9 && String(voll.begruendungen[k] || '').trim()) vorl[k] = voll.begruendungen[k];
    });
    betaBegrVorlagenSpeichern(art, vorl);
    gewaehlt.details = voll;
    let summe=0;
    Array.from(gewaehlt).forEach(z=>{ const p = posVon(z); if(p) summe += betragVon(p); });
    weiter(gewaehlt, Math.round(summe * 100) / 100);
  };
}

      </div>
      <div class="hinweis" id="rnZaehlerStand" style="font-size:13px; color:var(--text-schwach); margin-top:4px;">${rnZaehlerStandText(e)}</div>

        Damit "In Zwischenablage kopieren" die Rechnungsnummer (Spalte Q) gleich mit ausfüllen kann, hier einmalig die
        laufende Nummer (die letzten 3 Ziffern) der zuletzt in der Übersicht vergebenen Rechnungsnummer eintragen --
        Initialen und Datum ermittelt die App für jeden Fall selbst. Danach zählt das Handy bei jedem neuen, kopierten
        Fall selbstständig weiter. Falls zwischendurch auch direkt am PC eine Rechnung angelegt wurde (ohne über das
        Handy zu laufen), bitte die aktuell letzte laufende Nummer aus der Übersicht hier erneut eintragen, um den
        Zähler abzugleichen.
      </div>`}
    </div>
  `;
  // Alle Einstellungen wirken sofort, wie am PC -- kein separater
  // "Speichern"-Schritt.
  const anwenden = ()=>{
    if(document.getElementById('chkDunkel')) e.dunkel = document.getElementById('chkDunkel').checked;
    // Sobald der Dunkelmodus hier ODER ueber den Sonne/Mond-Kurzschalter
    // manuell gesetzt wurde, folgt die App nicht mehr automatisch dem
    // System-/Browser-Farbschema (siehe dunkelModusAutoSyncEinrichten) --
    // sonst wuerde ein spaeterer OS-Wechsel die bewusste Wahl ueberschreiben.
    if(document.getElementById('chkDunkel')) e.dunkelManuell = true;
    // Checkbox-Beschriftung/-Haken wie am PC ("Im Grenzbereich
    // Reiseentschaedigung priorisieren", angehakt = Standard) -- invertiert
    // zum intern gespeicherten Flag reiseBasisLuftlinie (True = Luftlinie
    // priorisiert, wie EinstellungSchreiben("REISE_BASIS_LUFTLINIE", Not
    // chkReiseBasisLuftlinie.checked) am PC).
    e.reiseBasisLuftlinie = !document.getElementById('chkReiseBasisLuftlinie').checked;
    e.praxisadresse = document.getElementById('txtPraxisadresse').value.trim();
    speichereEinstellungen(e); themaAnwenden();
  };
  if(document.getElementById('chkDunkel')) document.getElementById('chkDunkel').onchange = anwenden;
  document.getElementById('chkReiseBasisLuftlinie').onchange = anwenden;
  document.getElementById('txtPraxisadresse').addEventListener('blur', anwenden);

  document.getElementById('zReise').onclick = (ev)=>{ if(ev.target.tagName!=='INPUT'){ document.getElementById('chkReiseBasisLuftlinie').click(); } };
  // Ausgelagert (siehe rnLetzteFeldEinrichten oben) -- dieselbe Logik wird
  // jetzt auch fuer das gleichnamige Feld auf der Rechnungsuebersicht
  // benutzt, damit beide Stellen garantiert gleich funktionieren.
  rnLetzteFeldEinrichten(document.getElementById('txtRnLetzte'), {
    warnEl: document.getElementById('txtRnLetzte_warn'),
    standEl: document.getElementById('rnZaehlerStand')
  });
  document.getElementById('btnJsonExport').onclick = jsonExport;
  document.getElementById('btnSync').onclick = syncInfo.aktion;
  const einstellungenSyncHinweis = (txt)=>{
    const el = document.getElementById('einstellungenSyncHinweis');
    if(!el) return;
    if(!txt){ el.classList.remove('aktiv'); el.innerHTML=''; return; }
    el.innerHTML = txt; el.classList.add('aktiv');
  };
  document.getElementById('btnJsonImport').onclick = ()=>{
    einstellungenSyncHinweis('');
    document.getElementById('jsonImportInput').click();
  };
  document.getElementById('jsonImportInput').onchange = async (ev)=>{
    const datei = ev.target.files && ev.target.files[0];
    ev.target.value = ''; // erlaubt erneutes Auswaehlen derselben Datei
    if(!datei) return;
    try{
      const text = await datei.text();
      const ergebnis = jsonImportVerarbeiten(text);
      einstellungenSyncHinweis(ergebnis.html);
      // Nach erfolgreichem Import zurueck zur Startseite, damit die dort
      // angezeigte Anzahl "noch nicht am PC uebernommen" sofort den neuen
      // Stand zeigt (Import wirkt sich nur dort sichtbar aus).
      if(ergebnis.geaendert){ setTimeout(schliesseEinstellungen, 1600); }

      einstellungenSyncHinweis('Die Datei "'+datei.name+'" konnte nicht gelesen werden. Bitte die zuvor exportierte JSON-Datei unverändert auswählen.');
    }
  };
  autoSyncAbschnittWiring();
  msGraphAbschnittWiring();
  betaEinstellungenWiring();
  betaEinstellungenEinklappen();
}

// KORREKTUR (Rueckmeldung: ueber OneDrive/Ordner synchronisierte Faelle
// bekamen NIE automatisch eine Rechnungsnummer -- die automatische Vergabe
// (rechnungsnummernVergeben, siehe oben) war ausschliesslich an den Button
// "In Zwischenablage kopieren" angehaengt, dem inzwischen unzuverlaessigsten
// und kaum noch genutzten Weg. Der eigentliche Hauptweg (Graph-/Ordner-Sync,
// exportDatenBauen) rief sie nie auf -- jeder so synchronisierte Fall blieb
// deshalb ausnahmslos ohne Rechnungsnummer und damit ohne automatische
// Rechnungserstellung an der HTA, unabhaengig vom "Rechnungsnummern-Zaehler"
// in den Einstellungen). Jetzt wird derselbe Zaehler-basierte Mechanismus
// VOR jedem Export angewendet, damit auch synchronisierte Faelle automatisch
// eine Nummer bekommen, sofern der Zaehler einmalig hinterlegt wurde -- exakt
// wie beim Copy-Paste-Weg, nur zusaetzlich auch hier.
async function rechnungsnummernVorSyncVergeben(){
  // BETA: Nummern vergibt erst das Hochladen (aus der Rechnungsuebersicht)
  return;
  let zaehler = await naechsterRenuZaehlerErmitteln();
  if(!zaehler) return; // weder live noch manuell ein Zaehler-Stand verfuegbar -- wie bisher ohne Nummer belassen
  const geaendert = {ls:false, pt:false};
  ['ls','pt'].forEach(art=>{
    const faelle = ladeFaelle(art);
    faelle.forEach(f=>{
      if(f.rechnungsnummer) return; // bereits vergeben, nicht erneut vergeben
      const {nachname, vorname} = nameAufteilen(f.werte.txtName);
      const datumNorm = normalisiereDatum(f.werte.txtDatumExcel);
      const nummer = rechnungsnummerBerechnen(nachname, vorname, datumNorm, zaehler);
      if(!nummer) return;
      f.rechnungsnummer = nummer;
      geaendert[art] = true;
      zaehler++;
    });
    if(geaendert[art]) speichereFaelle(art, faelle);
  });
  const eNeu = ladeEinstellungen();
  if(zaehler !== eNeu.rnNaechsterZaehler){
    eNeu.rnNaechsterZaehler = zaehler;
    speichereEinstellungen(eNeu);
  }
}

// Baut die Export-Daten (Fälle + vom Handy neu angelegte Bestatter) --
// gemeinsame Grundlage sowohl für den manuellen Export-Button als auch für
// den automatischen Ordner-/OneDrive-Sync unten. Vergibt vorher automatisch
// Rechnungsnummern an noch nummerlose Fälle (siehe
// rechnungsnummernVorSyncVergeben oben; ermittelt den Zaehler dafuer nach
// Moeglichkeit LIVE aus der echten Rechnungsuebersicht).
async function exportDatenBauen(){
  await rechnungsnummernVorSyncVergeben();
  return {faelle: [...ladeFaelle('ls').map(f=>({...f,art:'ls'})), ...ladeFaelle('pt').map(f=>({...f,art:'pt'}))],
          bestatterAenderungen: ladeKatalog().filter(b=>b.herkunft==='handy')};
}
// KORREKTUR (mehrfach durchprobiert, auf Nutzerwunsch zurückgebaut):
// Sowohl das "Speichern unter"-Fenster bei JEDEM Export (showSaveFilePicker)
// als auch ein einmalig gewählter, dauerhaft gespeicherter Export-Ordner
// (showDirectoryPicker + getFileHandle(...,{create:true}) + createWritable())
// wurden ausprobiert, um das "immer neue Datei mit fortlaufender Zahl statt
// Überschreiben"-Problem zu lösen -- auf dem tatsächlich genutzten Gerät
// überschreibt aber KEINE der beiden Varianten zuverlässig (vermutlich eine
// Android/Storage-Access-Framework-Eigenheit). Beide brachten also nur einen
// zusätzlichen Dialog ohne echten Nutzen. Der manuelle Export ist deshalb
// wieder auf die einfache, direkte Rückfallebene zurückgebaut:
//  1) Ist der Auto-Sync-Ordner bereits verbunden (Weg A, siehe unten -- DER
//     funktioniert zuverlässig, weil er nicht bei jedem Export neu
//     nachfragt), wird die Export-Datei einfach zusätzlich dort abgelegt.
//  2) Sonst: natives Teilen-Menü, sonst klassischer Download -- dort kann
//     das Duplikat-Verhalten (fortlaufende Zahl) je nach Gerät weiterhin
//     auftreten, mangels besserer, tatsächlich funktionierender Alternative.
//     Der zuverlässige Weg dagegen bleibt der Auto-Sync.
const EXPORT_DATEINAME = 'rechnungserfassung_export.json';
async function jsonExport(){
  const daten = await exportDatenBauen();
  const inhalt = JSON.stringify(daten,null,2);

  if(autoSyncStatus==='verbunden' && autoSyncOrdnerHandle){
    try{
      const dateiHandle = await autoSyncOrdnerHandle.getFileHandle(EXPORT_DATEINAME, {create:true});
      const schreibbar = await dateiHandle.createWritable();
      await schreibbar.write(inhalt);
      await schreibbar.close();
      appToastAnzeigen('Export im Sync-Ordner gespeichert ("'+EXPORT_DATEINAME+'").', 2500);
      return;
    }catch(e){
      // Berechtigung zwischenzeitlich entzogen o.ä. -- normal weiter unten
      // versuchen (eigener Export-Ordner bzw. Rückfallebene).
    }
  }

  // KORREKTUR (auf Nutzerwunsch zurückgebaut): der Ordner-Auswahl-Dialog
  // (showDirectoryPicker) sollte das seit Anfang an bekannte
  // "immer neue Datei mit fortlaufender Zahl statt Überschreiben"-Problem
  // lösen -- tut es auf dem tatsächlich genutzten Gerät aber nachweislich
  // NICHT (vermutlich eine Android/Storage-Access-Framework-Eigenheit, die
  // auch einen "echten" Ordner-Handle beim Schreiben wie einen Download
  // behandelt). Der zusätzliche Dialog brachte also nur eine weitere
  // Bestätigung ohne jeden Nutzen -- daher wieder die einfache, direkte
  // Rückfallebene ohne Ordnerauswahl: natives Teilen-Menü, sonst klassischer
  // Download. Das bereits bekannte Duplikat-Verhalten (fortlaufende Zahl)
  // kann dabei mangels besserer, tatsächlich funktionierender Alternative
  // auf diesem Gerät weiterhin auftreten -- der zuverlässige Weg dagegen
  // bleibt der oben bereits vorhandene Auto-Sync ("Weg A").
  const blob = new Blob([inhalt], {type:'application/json'});
  const datei = new File([blob], EXPORT_DATEINAME, {type:'application/json'});
  if(navigator.canShare && navigator.canShare({files:[datei]})){
    try{
      await navigator.share({files:[datei], title:'Rechnungserfassung Export'});
      return;
    }catch(e){
      // Abgebrochen oder fehlgeschlagen -- auf normalen Download zurückfallen.
    }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = EXPORT_DATEINAME;
  a.click();
}

// Gegenstück zu exportDatenBauen()/jsonExport(): liest eine zuvor mit
// "Fälle für den PC exportieren" (oder dem Auto-Sync) erzeugte JSON-Datei
// wieder ein -- z.B. wenn nach dem Löschen des Browser-/App-Caches die
// lokal gespeicherten, noch nicht am PC übernommenen Fälle verloren gingen.
// Bewusst als MERGE statt Überschreiben umgesetzt: bereits lokal
// vorhandene Fälle (gleicher Inhalt UND gleicher Zeitstempel) werden nicht
// doppelt angelegt, damit ein erneutes/versehentliches Einlesen derselben
// Datei nichts kaputt macht. Vom Handy neu angelegte Bestatter werden über
// die bereits vorhandene Dubletten-Prüfung (bestatterEintragen) ergänzt.
// Gibt {geaendert, html} zurück -- html ist der inline anzuzeigende
// Hinweistext (KEIN natives alert/confirm, wie an anderer Stelle bereits
// festgelegt).
function jsonImportVerarbeiten(text){
  let daten;
  try{ daten = JSON.parse(text); }
  catch(e){ return {geaendert:false, html:'Die Datei enthält kein gültiges JSON und konnte nicht eingelesen werden.'}; }

  if(!daten || !Array.isArray(daten.faelle)){
    return {geaendert:false, html:'Die Datei enthält keine erkennbaren Fälle (erwartetes Format: Export aus "Fälle für den PC exportieren").'};
  }

  const bestand = {ls: ladeFaelle('ls'), pt: ladeFaelle('pt')};
  const schluesselVorhanden = {
    ls: new Set(bestand.ls.map(f=> JSON.stringify([f.werte, f.zeitstempel]))),
    pt: new Set(bestand.pt.map(f=> JSON.stringify([f.werte, f.zeitstempel])))
  };

  let importiert = {ls:0, pt:0}, uebersprungen = 0, ungueltig = 0;
  daten.faelle.forEach(eintrag=>{
    const art = eintrag && (eintrag.art==='ls' || eintrag.art==='pt') ? eintrag.art : null;
    if(!art || !eintrag.werte){ ungueltig++; return; }
    const schluessel = JSON.stringify([eintrag.werte, eintrag.zeitstempel]);
    if(schluesselVorhanden[art].has(schluessel)){ uebersprungen++; return; }
    const neu = {
      werte: eintrag.werte,
      positionen: Array.isArray(eintrag.positionen) ? eintrag.positionen : [],
      zeitstempel: eintrag.zeitstempel || new Date().toISOString()
    };
    if(eintrag.rechnungsnummer) neu.rechnungsnummer = eintrag.rechnungsnummer;
    bestand[art].push(neu);
    schluesselVorhanden[art].add(schluessel);
    importiert[art]++;
  });

  let bestatterNeu = 0;
  if(Array.isArray(daten.bestatterAenderungen)){
    const vorherAnzahl = ladeKatalog().length;
    daten.bestatterAenderungen.forEach(b=>{
      if(b && b.name) bestatterEintragen(b.name, b.adr1, b.adr2);
    });
    bestatterNeu = ladeKatalog().length - vorherAnzahl;
  }

  const gesamtImportiert = importiert.ls + importiert.pt;
  if(gesamtImportiert>0){
    speichereFaelle('ls', bestand.ls);
    speichereFaelle('pt', bestand.pt);
  }

  if(gesamtImportiert===0 && bestatterNeu===0){
    return {geaendert:false, html: uebersprungen>0
      ? `Alle ${uebersprungen} Fälle aus der Datei sind bereits lokal vorhanden -- nichts zu importieren.`
      : (ungueltig>0 ? `Die Datei enthält ${ungueltig} nicht erkennbare Einträge und keine gültigen Fälle.` : 'Die Datei enthält keine Fälle.')};
  }

  let html = `${gesamtImportiert} Fall/Fälle importiert (LS: ${importiert.ls}, PT: ${importiert.pt})`;
  if(uebersprungen>0) html += `, ${uebersprungen} bereits vorhanden (übersprungen)`;
  if(bestatterNeu>0) html += `, ${bestatterNeu} Bestatter aus der Datei übernommen`;
  if(ungueltig>0) html += `, ${ungueltig} Einträge ungültig/übersprungen`;
  html += '.';
  return {geaendert:true, html};
}

/* ==========================================================
   Automatischer Ordner-Sync ("Weg A", siehe Besprechung) -- File System
   Access API: einmalig den OneDrive-Sync-Ordner auswählen, danach wird bei
   JEDER Änderung (jedes Speichern eines Falls, jeder neue Bestatter)
   automatisch dieselbe Datei "rechnungserfassung_sync.json" überschrieben.
   Dadurch: kein manueller Klick mehr nötig, keine mehrfachen Export-
   Dateien/Duplikate, und selbst bei leerem Akku geht höchstens der letzte,
   noch nicht geschriebene Vorgang verloren (nicht der ganze Tag).
   Nicht auf jedem Gerät/Browser unterstützt (v.a. auf manchen Android-
   Chrome-Versionen) -- dann bleibt der manuelle Export-Button die
   Rückfallebene (siehe autoSyncVerfuegbar()).
   ========================================================== */
let autoSyncOrdnerHandle = null;
// 'unbekannt' (direkt nach Laden, bevor autoSyncInitialisieren fertig ist),
// 'nicht_unterstuetzt', 'nicht_verbunden', 'verbunden', 'berechtigung_fehlt'
let autoSyncStatus = 'unbekannt';
let autoSyncSchreibtGerade = false;
let autoSyncErneutNoetig = false;

function fileSystemAccessVerfuegbar(){
  return typeof window.showDirectoryPicker === 'function';
}

/* ==========================================================
   OneDrive-Anmeldung (Microsoft/MSAL) -- perspektivisch als robusterer
   Ersatz/Ergaenzung zu den fest hinterlegten Freigabelinks in
   excelDateiOeffnen(): mit einem gueltigen Zugriffstoken kann die App
   ueber die Microsoft-Graph-API die AKTUELL im jeweiligen OneDrive-Pfad
   liegende Datei auflösen, statt sich auf einen an eine feste Datei-ID
   gebundenen Freigabelink zu verlassen (siehe die Besprechung zum
   "falscher/veralteter Freigabelink"-Problem). Diese erste Ausbaustufe
   kuemmert sich nur um die Anmeldung selbst (Login/Logout, Status-
   Anzeige in den Einstellungen) -- die eigentliche Datei-Aufloesung ueber
   Graph folgt als naechster Schritt, sobald die Anmeldung bestaetigt
   nachweisbar funktioniert.
   ========================================================== */
// Nur PERSOENLICHE Microsoft-Konten (siehe Kontotyp-Auswahl bei der
// Azure-App-Registrierung) -- deshalb "consumers" statt "common"/"organizations".
const MSGRAPH_CLIENT_ID = '579a39e0-b7fd-4c46-8684-af22e1bc45a2';
const MSGRAPH_AUTHORITY = 'https://login.microsoftonline.com/consumers';
// Muss ZEICHENGENAU mit dem in Azure (Authentifizierung -> SPA-Plattform)
// hinterlegten Redirect-URI uebereinstimmen.
const MSGRAPH_REDIRECT_URI = 'https://seblussi.github.io/rechnung-mobil/Rechnungserfassung_Mobil.html';
const MSGRAPH_SCOPES = ['Files.ReadWrite', 'offline_access', 'User.Read'];

let msGraphMsal = null;
// 'unbekannt' (direkt nach Laden, bevor msGraphInitialisieren fertig ist),
// 'nicht_verfuegbar' (MSAL-Bibliothek konnte nicht geladen werden, z.B.
// kein Netz), 'abgemeldet', 'angemeldet'
let msGraphStatus = 'unbekannt';
let msGraphKonto = null; // {name, username} des angemeldeten Kontos

function msGraphVerfuegbar(){
  return typeof msal !== 'undefined';
}

// Legt (einmalig) die MSAL-Instanz an. Getrennt von msGraphInitialisieren,
// damit sowohl der normale Start als auch die Rueckkehr vom Microsoft-
// Login-Redirect dieselbe, garantiert bereits initialisierte Instanz nutzen.
async function msGraphInstanzSicherstellen(){
  if(msGraphMsal) return msGraphMsal;
  if(!msGraphVerfuegbar()) return null;
  msGraphMsal = new msal.PublicClientApplication({
    auth: {
      clientId: MSGRAPH_CLIENT_ID,
      authority: MSGRAPH_AUTHORITY,
      redirectUri: MSGRAPH_REDIRECT_URI
    },
    cache: { cacheLocation: 'localStorage' }
  });
  await msGraphMsal.initialize();
  return msGraphMsal;
}

// Beim Start (bzw. direkt nach Rueckkehr vom Microsoft-Login) pruefen, ob
// bereits ein Konto im lokalen Cache steht (bzw. der Redirect gerade ein
// neues eingetragen hat) -- KEIN automatischer Login-Versuch ohne
// Nutzer-Geste, das entspricht dem Auto-Sync-Verhalten (autoSyncInitialisieren).
async function msGraphInitialisieren(){
  if(!msGraphVerfuegbar()){ msGraphStatus = 'nicht_verfuegbar'; return; }
  try{
    const inst = await msGraphInstanzSicherstellen();
    if(!inst){ msGraphStatus = 'nicht_verfuegbar'; return; }
    // Verarbeitet ggf. die Rueckkehr von loginRedirect() -- MUSS bei jedem
    // Seitenaufruf aufgerufen werden, auch wenn gerade kein Redirect im
    // Gange ist (liefert dann einfach null zurueck).
    const ergebnis = await inst.handleRedirectPromise();
    const geradeFrischAngemeldet = !!(ergebnis && ergebnis.account);
    if(geradeFrischAngemeldet){
      inst.setActiveAccount(ergebnis.account);
    }
    const konten = inst.getAllAccounts();
    if(konten.length > 0){
      inst.setActiveAccount(konten[0]);
      msGraphKonto = { name: konten[0].name || '', username: konten[0].username || '' };
      msGraphStatus = 'angemeldet';
      // Nur direkt nach einem FRISCHEN Login (Rueckkehr vom Redirect) sofort
      // hochladen, statt bei jedem normalen App-Start (dort wuerde sonst bei
      // jedem Oeffnen unnoetig ein Upload ausgeloest, obwohl sich meist
      // nichts geaendert hat -- die naechste echte Aenderung stoesst
      // synchronisiereAlle() ohnehin von selbst an).
      if(geradeFrischAngemeldet){ msGraphSyncSchreiben(); }
    } else {
      msGraphKonto = null;
      msGraphStatus = 'abgemeldet';
    }
  }catch(e){
    msGraphStatus = 'abgemeldet';
  }
}

const AUTOSYNC_DB_NAME = 'rechnungserfassung_sync_db';
const AUTOSYNC_STORE = 'handles';
function autoSyncDbOeffnen(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(AUTOSYNC_DB_NAME, 1);
    req.onupgradeneeded = ()=> req.result.createObjectStore(AUTOSYNC_STORE);
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function autoSyncHandleSpeichern(handle){
  const db = await autoSyncDbOeffnen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(AUTOSYNC_STORE, 'readwrite');
    tx.objectStore(AUTOSYNC_STORE).put(handle, 'ordner');
    tx.oncomplete = ()=> resolve();
    tx.onerror = ()=> reject(tx.error);
  });
}
async function autoSyncHandleLaden(){
  try{
    const db = await autoSyncDbOeffnen();
    return await new Promise((resolve, reject)=>{
      const tx = db.transaction(AUTOSYNC_STORE, 'readonly');
      const req = tx.objectStore(AUTOSYNC_STORE).get('ordner');
      req.onsuccess = ()=> resolve(req.result || null);
      req.onerror = ()=> reject(req.error);
    });
  }catch(e){ return null; }
}
async function autoSyncHandleLoeschen(){
  try{
    const db = await autoSyncDbOeffnen();
    const tx = db.transaction(AUTOSYNC_STORE, 'readwrite');
    tx.objectStore(AUTOSYNC_STORE).delete('ordner');
  }catch(e){}
}

// Schreibt die IMMER GLEICHE Datei mit dem aktuellen Gesamtstand -- läuft
// eine Schreibaktion noch, wird die naechste nur vorgemerkt (statt parallel
// zu schreiben) und läuft danach automatisch noch einmal, damit der
// allerletzte Stand nie verloren geht.
async function autoSyncSchreiben(){
  if(autoSyncStatus!=='verbunden' || !autoSyncOrdnerHandle) return;
  if(autoSyncSchreibtGerade){ autoSyncErneutNoetig = true; return; }
  autoSyncSchreibtGerade = true;
  try{
    const daten = await exportDatenBauen();
    const istLeer = daten.faelle.length===0 && (!daten.bestatterAenderungen || daten.bestatterAenderungen.length===0);
    // SCHUTZ VOR DATENVERLUST: steht hier aktuell NICHTS Lokales an (z.B.
    // weil der lokale Speicher unerwartet leer ist -- etwa nach Cache-
    // Löschung oder einem App-/Browser-Wechsel), aber die Sync-Datei enthält
    // noch Fälle, NICHT einfach leer drüberschreiben. Sonst geht beim
    // naechsten "stillen" Aufruf (z.B. direkt beim App-Start ueber
    // autoSyncInitialisieren) der komplette bisherige Stand verloren.
    if(istLeer && await autoSyncDateiHatBereitsDaten()){
      autoSyncStatus = 'verbunden';
      appToastAnzeigen('WARNUNG: Lokal sind aktuell keine Fälle gespeichert, die Sync-Datei enthält aber noch welche -- zum Schutz vor Datenverlust wurde NICHT überschrieben. Falls die lokalen Daten unerwartet verschwunden sind, bitte zuerst über "Fälle importieren" die Sync-Datei wiederherstellen.', 7000);
      return;
    }
    const dateiHandle = await autoSyncOrdnerHandle.getFileHandle('rechnungserfassung_sync.json', {create:true});
    const schreibbar = await dateiHandle.createWritable();
    await schreibbar.write(JSON.stringify(daten, null, 2));
    await schreibbar.close();
  }catch(e){
    // z.B. Berechtigung zwischenzeitlich entzogen -- der Status zeigt das
    // beim naechsten Aufruf der Einstellungen an, der manuelle Export-Button
    // erscheint automatisch wieder (siehe autoSyncVerfuegbar()).
    autoSyncStatus = 'berechtigung_fehlt';
  } finally {
    autoSyncSchreibtGerade = false;
    if(autoSyncErneutNoetig){ autoSyncErneutNoetig = false; autoSyncSchreiben(); }
  }
}

// Prüft (lesend, ohne etwas zu verändern), ob die Sync-Datei im gewählten
// Ordner aktuell noch mindestens einen Fall enthält -- Grundlage für den
// Datenverlust-Schutz oben.
async function autoSyncDateiHatBereitsDaten(){
  try{
    const dateiHandle = await autoSyncOrdnerHandle.getFileHandle('rechnungserfassung_sync.json', {create:false});
    const datei = await dateiHandle.getFile();
    const inhalt = await datei.text();
    const vorhandeneDaten = JSON.parse(inhalt);
    return !!(vorhandeneDaten && Array.isArray(vorhandeneDaten.faelle) && vorhandeneDaten.faelle.length>0);
  }catch(e){
    return false; // z.B. Datei existiert noch gar nicht -- dann gibt es nichts zu schuetzen
  }
}

// Nutzer wählt (per Tap in den Einstellungen, also mit Nutzer-Geste -- nur
// dann erlauben Browser den Berechtigungsdialog) einmalig den Sync-Ordner.
async function autoSyncOrdnerWaehlen(){
  if(!fileSystemAccessVerfuegbar()) return false;
  try{
    const handle = await window.showDirectoryPicker({id:'rechnungserfassung-sync', mode:'readwrite'});
    const berechtigt = await handle.requestPermission({mode:'readwrite'});
    if(berechtigt!=='granted') return false;
    await autoSyncHandleSpeichern(handle);
    autoSyncOrdnerHandle = handle;
    autoSyncStatus = 'verbunden';
    await autoSyncSchreiben();
    return true;
  }catch(e){ return false; } // z.B. Nutzer hat den Auswahldialog abgebrochen
}

async function autoSyncOrdnerTrennen(){
  await autoSyncHandleLoeschen();
  autoSyncOrdnerHandle = null;
  autoSyncStatus = 'nicht_verbunden';
}

// Nach erneutem Öffnen der App die zuvor gewählte Ordner-Berechtigung ohne
// weiteren Dialog PRÜFEN (requestPermission bräuchte eine Nutzer-Geste,
// queryPermission nicht). Ist sie noch gültig, sofort den aktuellen Stand
// schreiben, damit ein evtl. seit dem letzten Mal geänderter Stand (z.B.
// falls ein Schreibvorgang durch geschlossene App/leeren Akku nicht mehr
// zum Zug kam) nachgeholt wird.
async function autoSyncInitialisieren(){
  if(!fileSystemAccessVerfuegbar()){ autoSyncStatus = 'nicht_unterstuetzt'; return; }
  const handle = await autoSyncHandleLaden();
  if(!handle){ autoSyncStatus = 'nicht_verbunden'; return; }
  autoSyncOrdnerHandle = handle;
  try{
    const berechtigung = await handle.queryPermission({mode:'readwrite'});
    if(berechtigung==='granted'){
      autoSyncStatus = 'verbunden';
      await autoSyncSchreiben();
    } else {
      autoSyncStatus = 'berechtigung_fehlt';
    }
  }catch(e){ autoSyncStatus = 'nicht_verbunden'; }
}

// Erneutes Bestätigen (Nutzer-Geste vorhanden -- z.B. Tap auf "Erneut
// verbinden" in den Einstellungen), falls die Berechtigung abgelaufen ist.
async function autoSyncBerechtigungErneuern(){
  if(!autoSyncOrdnerHandle) return false;
  try{
    const berechtigt = await autoSyncOrdnerHandle.requestPermission({mode:'readwrite'});
    if(berechtigt==='granted'){
      autoSyncStatus = 'verbunden';
      await autoSyncSchreiben();
      return true;
    }
  }catch(e){}
  return false;
}

function themaAnwenden(){
  const e = ladeEinstellungen();
  document.body.classList.toggle('dunkel', !!e.dunkel);
  // Sonne/Mond-Symbol neben dem Zahnrad zeigt IMMER das gerade aktive
  // Design (Sonne = hell, Mond = dunkel) -- unabhaengig davon, ob man die
  // Checkbox in den Einstellungen oder diesen Kurzschalter benutzt hat,
  // damit beide Wege garantiert im selben Zustand landen.
  const btnDunkelToggle = document.getElementById('btnDunkelToggle');
  if(btnDunkelToggle) btnDunkelToggle.innerHTML = e.dunkel ? '&#127769;' : '&#9728;';
}
document.getElementById('btnEinstellungen').onclick = ()=>{
  if(einstellungenOffen) schliesseEinstellungen();
  else { vorbereiteRuecksprung(); ansichtEinstellungen(); }
};
// Kurzschalter neben dem Zahnrad: Dunkelmodus direkt umschalten, ohne extra
// den Weg über die Einstellungen zu nehmen -- schreibt in dieselbe
// Einstellung (e.dunkel) wie die Checkbox dort, damit beide immer synchron
// bleiben. Steht die Einstellungen-Seite gerade offen, wird sie neu
// aufgebaut, damit die dortige Checkbox den neuen Stand sofort zeigt.
document.getElementById('btnDunkelToggle').onclick = ()=>{
  const e = ladeEinstellungen();
  e.dunkel = !e.dunkel;
  e.dunkelManuell = true; // siehe dunkelModusAutoSyncEinrichten
  speichereEinstellungen(e);
  themaAnwenden();
  if(einstellungenOffen) ansichtEinstellungen();
};

// NUTZERWUNSCH: "Der [vom Handy-Browser] erzwungene Nachtmodus soll so
// aussehen wie der App interne Dunkelmodus" -- manche mobilen Browser (u.a.
// Opera Mobile) haben einen eigenen "Nachtmodus", der Seiten OHNE eigenes
// Dunkeldesign nachtraeglich (und oft nur unvollstaendig/seltsam) einfaerbt.
// Die App hat zwar bereits ein eigenes, vollstaendiges Dunkeldesign (siehe
// color-scheme-Meta/CSS oben), aber offenbar reicht das bei manchen Browsern
// nicht aus, um deren automatische Nachfaerbung zu unterdruecken. Deshalb
// zusaetzlich: folgt die App dem System-/Browser-Farbschema automatisch
// (matchMedia "prefers-color-scheme: dark"), SOLANGE der Dunkelmodus noch
// nie manuell (Checkbox oder Sonne/Mond-Kurzschalter) umgeschaltet wurde --
// dadurch bekommt man in einem Browser-Nachtmodus (der ueblicherweise auch
// dieses Media-Feature setzt) von Anfang an das echte, fertig gestaltete
// Dunkeldesign der App zu sehen, statt der ggf. fehlerhaften Nachfaerbung
// des Browsers. Sobald einmal manuell umgeschaltet wurde, hat diese Wahl
// Vorrang und wird nicht mehr automatisch ueberschrieben.
function dunkelModusAutoSyncEinrichten(){
  try{
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const abgleichen = ()=>{
      const e = ladeEinstellungen();
      if(e.dunkelManuell) return; // bewusste Nutzerwahl hat Vorrang
      if(!!e.dunkel === mq.matches) return; // schon passend, nichts zu tun
      e.dunkel = mq.matches;
      speichereEinstellungen(e);
      themaAnwenden();
      if(einstellungenOffen) ansichtEinstellungen();
    };
    abgleichen();
    // addEventListener ist der moderne Weg; addListener als Fallback fuer
    // aeltere WebView-/Browser-Engines, die "change" auf MediaQueryList noch
    // nicht per addEventListener unterstuetzen.
    if(mq.addEventListener) mq.addEventListener('change', abgleichen);
    else if(mq.addListener) mq.addListener(abgleichen);
  }catch(e){}
}

/* ==========================================================
   Rechnungspositionen-Auswahl (gemeinsame Ansicht für LS/PT)
   ========================================================== */
function ansichtPositionenAlt(art, ausgewaehlteZiffern, betragSchaetzung, weiter, kmFahrstreckeGesamt){
  // FIX: vorher wurde hier "null" als zurueckZiel übergeben -- dadurch war
  // weder der Pfeil oben sichtbar, noch sprang die Handy-"Zurück"-Taste
  // sinnvoll zur Maske zurück; stattdessen griff die allgemeine "nicht auf
  // dem Hauptbildschirm"-Absicherung und sprang OHNE Rückfrage direkt zum
  // Startbildschirm (Gefahr von Datenverlust). ruecksprungAusEinstellungen
  // wurde vom Aufrufer (btnPunkte.onclick) bereits passend auf die Maske
  // (mit Schnappschuss der Maskenwerte) gesetzt, bevor diese Ansicht
  // aufgebaut wurde -- genau diese Funktion jetzt tatsächlich als
  // zurueckZiel verwenden (als Closure, damit ein späteres Neusetzen von
  // ruecksprungAusEinstellungen -- z.B. über das Zahnrad -- respektiert wird).
  setzeTitel('Rechnungspositionen', ()=>ruecksprungAusEinstellungen());
  aktuellerZurueckHandler = ()=>{ vorbereiteRuecksprung(); ruecksprungAusEinstellungen(); };
  const katalog = art==='ls' ? POSITIONEN_LS : POSITIONEN_PT;
  // Zeitzuschläge (F/G/H) und Wegegeld/Reiseentschädigung sind wie am PC
  // rein automatisch bestimmte Kategorien ("ZuschlagAuto"/"WegegeldAuto") --
  // sie werden von automatischeAuswahl() anhand Datum/Uhrzeit/km bestimmt
  // und sind bewusst NICHT manuell anwählbar (ausgegraut/gesperrt), damit
  // hier nichts abweichend vom errechneten Ergebnis angehakt werden kann.
  // Reiseentschädigung wie am PC (AutoZeileEinfuegen "##KM##"): Beschriftung
  // und Betrag zeigen zusätzlich die km-abhängige 26-ct-Zeile mit an.
  const reise = reiseGesamtBetrag(kmFahrstreckeGesamt);
  const reiseBez = reise.kmGerundet>0
    ? `${REISEENTSCHAEDIGUNG.bez} (${reise.basis.toFixed(2).replace('.',',')} &euro;) + Wegstrecke ${reise.kmGerundet} km &times; 0,26 &euro;/km (${reise.kmZeile.toFixed(2).replace('.',',')} &euro;)`
    : `${REISEENTSCHAEDIGUNG.bez} (zzgl. 0,26 &euro;/km Wegstrecke, sobald km bekannt)`;
  // Gruppierung/Beschriftung wie am PC (SektionVonPunkt): "Grundpauschalen"
  // statt "Grundleistung"; "E" ist inhaltlich kein Zeitzuschlag, wird aber
  // zusammen mit F/G/H unter "Zeitzuschläge" geführt (bleibt aber -- anders
  // als F/G/H -- manuell anhakbar); Wegegeld-Staffeln (Tag/Nacht) UND
  // Reiseentschädigung fallen am PC unter EINE gemeinsame Überschrift
  // "Wegegeld" statt mehrerer separater Abschnitte.
  const eEintrag = (katalog.grundleistung||[]).find(p=>p.ziffer==='E');
  // KORREKTUR: die eigentliche Grundpauschale (101 bei LS, 50 bei PT --
  // erkennbar an "standard:true", automatischeAuswahl() haengt sie ja auch
  // immer von selbst an) ist genau wie am PC KEINE manuell abwaehlbare
  // Position, sondern zwingend fester Bestandteil jeder Rechnung -- muss
  // also genau wie Zeitzuschlaege/Wegegeld ausgegraut und angehakt bleiben.
  // Nur die weiteren Grundpauschalen-Positionen (z.B. 102, Zuschlag bei
  // unbekannter Identitaet) bleiben bewusst manuell an-/abwaehlbar.
  const grundOhneE = (katalog.grundleistung||[]).filter(p=>p.ziffer!=='E')
    .map(p=> p.standard ? {...p, automatisch:true} : p);
  const gruppen = [
    {titel:'Grundpauschalen', liste: grundOhneE, automatisch:false},
    {titel:'Eigene Positionen', liste: betaEigene(art).map(betaEigenePositionAlsAuswahl), automatisch:false, eigene:true},
    {titel:'Zeitzuschläge', liste: eEintrag ? [{...eEintrag, automatisch:false}, ...ZUSCHLAEGE_ZEIT] : ZUSCHLAEGE_ZEIT, automatisch:true},
    {titel:'Wegegeld', liste: [...WEGEGELD_TAG, ...WEGEGELD_NACHT, {ziffer:'REISE', bez:reiseBez, betrag:reise.gesamt}], automatisch:true}
  ];
  let html = `<div class="maske ${art}">`;
  gruppen.forEach(g=>{
    // Enthaelt eine Gruppe manuell UND automatisch bestimmte Positionen
    // (z.B. "E" innerhalb "Zeitzuschläge"), wird "automatisch" nicht mehr
    // pauschal in der Zwischenüberschrift, sondern je Position angezeigt.
    const gemischt = g.liste.some(p => typeof p.automatisch==='boolean' && p.automatisch!==g.automatisch);
    html += `<div class="positionen-gruppe-titel">${g.titel}${(g.automatisch && !gemischt)?' <span class="auto-hinweis">automatisch</span>':''}</div>`;
    g.liste.forEach(p=>{
      const istAuto = (typeof p.automatisch==='boolean') ? p.automatisch : g.automatisch;
      const checked = ausgewaehlteZiffern.has(p.ziffer) ? 'checked' : '';
      const gesperrt = istAuto ? 'disabled' : '';
      html += `${p.eigene ? `<div class="wisch-huelle" data-eigene="${p.ziffer}"><div class="wisch-hinter">&#128465; Löschen</div>` : ''}<label class="position-zeile${istAuto?' auto-gesperrt':''}">
        <input type="checkbox" data-ziffer="${p.ziffer}" data-betrag="${p.betrag}" data-auto="${istAuto?'1':'0'}" ${checked} ${gesperrt}>
        <div class="haupt"><span class="ziffer">${p.anzeigeZiffer!==undefined ? htmlEsc(p.anzeigeZiffer) : (p.ziffer||'')}</span> ${p.eigene ? htmlEsc(p.bez) : p.bez}${gemischt&&istAuto?' <span class="auto-hinweis">automatisch</span>':''}</div>
        <div class="betrag">${p.betrag.toFixed(2).replace('.',',')} &euro;</div>
      </label>${p.eigene ? '</div>' : ''}`;
    });
    if(g.eigene) html += `<button type="button" class="btn-sekundaer" id="btnEigenePosNeu" style="margin:8px 0 4px;">+ Eigene Position hinzufügen</button>${g.liste.length ? '<div class="eigene-hinweis">Zum Löschen nach links wischen.</div>' : ''}`;
  });
  html += `<div class="summenzeile"><span>Gesamt</span><span id="posSumme">0,00 &euro;</span></div>`;
  html += `<button class="btn-primaer" id="btnPositionenFertig">Übernehmen</button>`;
  html += `</div>`;
  app.innerHTML = html;

  function summeBerechnen(){
    let summe=0;
    app.querySelectorAll('.position-zeile input:checked').forEach(cb=> summe += parseFloat(cb.dataset.betrag));
    document.getElementById('posSumme').textContent = summe.toFixed(2).replace('.',',')+' €';
    return summe;
  }

  // Gegenseitige Ausschlüsse (nur PT, 1:1 wie am PC/AusschluesseAktualisieren):
  // ist eine Ziffer aktiv -- egal ob manuell angehakt oder als Grundleistung
  // fest -- werden alle mit ihr unvereinbaren Positionen gesperrt und
  // automatisch abgehakt.
  function ausschluesseAktualisieren(){
    if(art!=='pt') return;
    const boxen = Array.from(app.querySelectorAll('.position-zeile input'));
    const aktive = new Set(boxen.filter(cb=>cb.checked).map(cb=>cb.dataset.ziffer));
    boxen.forEach(cb=>{
      // Automatik-Kategorien (Zeitzuschlag/Wegegeld/Reise) bleiben immer
      // gesperrt -- die Ausschluss-Logik betrifft nur die manuell wählbaren
      // Grundleistungs-Positionen.
      if(cb.dataset.auto==='1') return;
      const ausschluesse = ZIFFER_AUSSCHLUESSE[cb.dataset.ziffer];
      const zeile = cb.closest('.position-zeile');
      if(!ausschluesse){ cb.disabled=false; if(zeile) zeile.style.opacity=''; return; }
      const gesperrt = ausschluesse.some(z=> aktive.has(z));
      if(gesperrt && cb.checked) cb.checked = false;
      cb.disabled = gesperrt;
      if(zeile) zeile.style.opacity = gesperrt ? '0.45' : '';
    });
  }

  function positionAktualisieren(){ ausschluesseAktualisieren(); summeBerechnen(); }
  app.querySelectorAll('.position-zeile input').forEach(cb=> cb.addEventListener('change', positionAktualisieren));
  positionAktualisieren();
  // BETA: eigene Positionen (anlegen, per Wischen loeschen)
  betaEigenePositionenVerdrahten(art, (neuId, entferntId)=>{
    const set = new Set(Array.from(app.querySelectorAll('.position-zeile input:checked')).map(cb=> cb.dataset.ziffer));
    if(neuId) set.add(neuId);
    if(entferntId) set.delete(entferntId);
    ansichtPositionen(art, set, betragSchaetzung, weiter, kmFahrstreckeGesamt);
  });

  document.getElementById('btnPositionenFertig').onclick = ()=>{
    const gewaehlt = new Set();
    let summe=0;
    app.querySelectorAll('.position-zeile input:checked').forEach(cb=>{ gewaehlt.add(cb.dataset.ziffer); summe += parseFloat(cb.dataset.betrag); });
    weiter(gewaehlt, summe);
  };
}

/* ==========================================================
   LS- / PT-Maske
   ========================================================== */
function ansichtMaske(art, korrekturIdx, vorbelegt){
  einstellungenOffen = false;
  // WICHTIG: vorbereiteRuecksprung() wird vom Zahnrad-Klick-Handler
  // aufgerufen, SOLANGE diese Maske noch angezeigt wird (also bevor auf
  // Einstellungen umgeschaltet wird) -- werteEinsammeln() liest dann noch
  // aus den echten, vorhandenen Maskenfeldern. Ein "fauler" Aufruf erst
  // beim Zurückspringen aus den Einstellungen würde stattdessen aus dem
  // (falschen) Einstellungen-DOM lesen und dort hängen bleiben.
  vorbereiteRuecksprung = ()=>{
    const snap = werteEinsammeln();

  // Wurde die Maske aus der Rechnungsübersicht heraus geöffnet (Klick auf

  // Rechnung (kein korrekturIdx, ueber die Kacheln Leichenschau/Privat-
