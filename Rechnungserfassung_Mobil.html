// ---------- Ordnerinhalt (welche PDFs gibt es?) ----------
async function ordnerDateien(token, pfad){
  const map = new Map();
  let url = msGraphPfadUrl(pfad) + '/children?$select=id,name,webUrl,lastModifiedDateTime&$top=200';
  for(let seite = 0; url && seite < 30; seite++){
    let d;
    try{ d = await gx(token, 'GET', url); }
    catch(e){ if(e.status === 404) return map; throw e; }
    ((d && d.value) || []).forEach(it=> map.set(String(it.name).toLowerCase(), it));
    url = d && d['@odata.nextLink'];
  }
  return map;
}

// Lokale Faelle aufraeumen: nur zum Bearbeiten angelegte, unveraendert bzw.
// erfolgreich hochgeladene Kopien und laenger als 60 Tage hochgeladene Faelle
function betaLokaleAufraeumen(){
  const grenze = Date.now() - 60 * 86400000;
  ['ls', 'pt'].forEach(art=>{
    const arr = ladeFaelle(art);
    const rest = arr.filter(f=>{
      if(!f || !f.hochgeladen || f.uploadFehler) return true;
      if(f.ausUebersicht) return false;
      const am = Date.parse(f.hochgeladen.am || '');
      return !(am && am < grenze);
    });
    if(rest.length !== arr.length) speichereFaelle(art, rest);
  });
}

// ---------- Hochladen (ein oder mehrere Faelle) mit Ladeanimation ----------
// faelle: [{...fall, art, idx}] -> Ergebnisliste
async function betaFaelleHochladen(faelle, titel){
  const ziel = betaZiel();
  const zk = betaZielKey(ziel);
  const ergebnisse = [];
  betaOverlay.zeigen(titel || (faelle.length > 1 ? faelle.length + ' Rechnungen werden hochgeladen' : 'Rechnung wird hochgeladen'));
  let kontext = null;
  try{
    betaOverlay.schritt('Anmeldung und Arztdaten …');
    const token = await msGraphTokenHolen();
    if(!token) throw new Error('Keine Microsoft-Anmeldung aktiv (Einstellungen > Microsoft/OneDrive).');
    if(typeof JSZip === 'undefined') throw new Error('Die Word-Bibliothek konnte nicht geladen werden (Internet?).');
    const { arzt } = await schritt('Arztdaten (einstellungen.ini)', ()=> arztdatenLaden());
    if(!ziel.echt) await schritt('Test-Übersicht anlegen', ()=> testUebersichtSicherstellen(token, false, t=> betaOverlay.schritt(t)));
    kontext = { token, arzt, ziel, vorlagen: {} };
  }catch(err){
    const text = err.message || String(err);
    faelle.forEach(f=> betaFallAendern(f.art, f.zeitstempel, x=>{ x.uploadFehler = text; }));
    await betaOverlay.ergebnis('Hochladen nicht möglich', '✗ ' + htmlEsc(text) + '<br><br><span style="font-size:13px;">Die Fälle sind gespeichert und als „nicht hochgeladen“ markiert.</span>');
    betaOverlay.schliessen();
    return ergebnisse;
  }
  for(let i = 0; i < faelle.length; i++){
    const f = faelle[i];
    const name = (f.werte && f.werte.txtName) || '(ohne Namen)';
    let schritte = 0;
    const meldung = (t)=>{ schritte++; betaOverlay.fortschritt((i + Math.min(0.95, schritte / 9)) / faelle.length); betaOverlay.schritt((faelle.length > 1 ? (i + 1) + '/' + faelle.length + ' · ' : '') + name + '\n' + t); };
    meldung('wird vorbereitet …');
    // aktuellen Index frisch ermitteln (Liste kann sich inzwischen verschoben haben)
    const idx = betaFallIndex(f.art, f.zeitstempel);
    if(idx < 0){ ergebnisse.push({ fehler: 'Fall nicht mehr vorhanden', name }); continue; }
    const fall = { ...ladeFaelle(f.art)[idx], art: f.art, idx };
    try{
      const e = await betaRechnungErstellen(fall, meldung, betaFrage, kontext);
      e.anzeige = name;
      ergebnisse.push(e);
      // Fall auch ins Fahrtenbuch (Block des Diensts; ohne Dienst wird nachgefragt)
      if(!e.uebersprungen && ziel.echt && typeof fahrtenbuchAusRechnung === 'function'){
        try{ const t = await fahrtenbuchAusRechnung(fall, e, meldung); if(t) (e.hinweise = e.hinweise || []).push(t); }
        catch(err){ (e.hinweise = e.hinweise || []).push('⚠ Fahrtenbuch: ' + (err.message || String(err))); }
      }
      if(!e.uebersprungen){
        betaFallAendern(f.art, f.zeitstempel, x=>{
          x.hochgeladen = { renu: e.renu, ziel: zk, am: new Date().toISOString() };
          x.bezug = { renu: e.renu };
          x.rechnungsnummer = e.renu;
          delete x.uploadFehler;
        });
      }
    }catch(err){
      const text = err.message || String(err);
      ergebnisse.push({ fehler: text, name });
      betaFallAendern(f.art, f.zeitstempel, x=>{ x.uploadFehler = text; });
    }
  }
  betaOverlay.fortschritt(1);
  await betaErgebnisseZeigen(ergebnisse, ziel);
  betaOverlay.schliessen();
  return ergebnisse;
}

      [...(e.hinweise || []), ...(e.warnungen || [])].map(t=> '<br><span class="beta-erg-klein">' + (/^[✓⚠]/.test(t) ? '' : '⚠ ') + htmlEsc(t) + '</span>').join('') +
      '<div class="aktionen"><button type="button" data-erg="pdf" data-i="' + i + '">PDF ansehen</button>' +
      '<button type="button" data-erg="lxp" data-i="' + i + '">Brief senden' + (testmodus ? ' (Testmodus)' : ' (LIVE)') + '</button></div></div>';
  }).join('');
  const ok = ergebnisse.filter(e=> !e.fehler && !e.uebersprungen).length;
  const titel = ok === ergebnisse.length ? (ok === 1 ? 'Rechnung erstellt' : ok + ' Rechnungen erstellt')
              : (ok ? ok + ' von ' + ergebnisse.length + ' erstellt' : 'Nicht hochgeladen');
  const fertig = betaOverlay.ergebnis(titel, zeilenHtml + '<div class="beta-erg-klein" style="margin-top:8px;">' +
    (ziel.echt ? 'Abgelegt in „fertige Rechnungen“ und in der Rechnungsübersicht eingetragen.' : 'Testablage: „Beta-Test“ – die echte Übersicht bleibt unverändert.') + '</div>',
    [{ label:'Fertig', akt:'fertig', primaer:true }]);
  const karte = document.querySelector('.beta-overlay-text');
  karte.querySelectorAll('[data-erg="pdf"]').forEach(b=>{
    b.onclick = ()=>{ const e = ergebnisse[+b.dataset.i]; betaPdfAnzeigen({ titel: e.name, blob: e.pdfBlob, webUrl: e.pdfUrl }); };
  });
  karte.querySelectorAll('[data-erg="lxp"]').forEach(b=>{
    b.onclick = async ()=>{
      const e = ergebnisse[+b.dataset.i];
      b.disabled = true; const alt = b.textContent; b.textContent = 'sende …';
      try{
        const r = await betaBriefVersenden(e, (t)=> betaInlineFrage(b.closest('.beta-erg'), t));
        if(r.abgebrochen){ b.textContent = alt; b.disabled = false; return; }
        b.textContent = r.test ? '✓ Testbrief angenommen, vermerkt' : '✓ Brief verschickt, vermerkt';
      }catch(err){
        b.textContent = alt; b.disabled = false;

      }
    };
  });

}
// Rueckfrage/Hinweis direkt unter einem Ergebnis (das Fenster bleibt offen)
function betaInlineFrage(container, text){
  return new Promise(res=>{
    const box = document.createElement('div');
    box.className = 'beta-inline';
    box.innerHTML = '<div style="white-space:pre-line;">' + htmlEsc(text) + '</div><div class="aktionen"><button type="button" data-a="nein">Abbrechen</button><button type="button" data-a="ja" class="betont">Ja, senden</button></div>';
    container.appendChild(box);
    box.querySelector('[data-a="nein"]').onclick = ()=>{ box.remove(); res(false); };
    box.querySelector('[data-a="ja"]').onclick = ()=>{ box.remove(); res(true); };

    const lauf = ++betaGesamtLauf;   // nur der zuletzt gestartete Ladevorgang zaehlt

      ]);

      // zum Anzeigen/Erkennen wird dort zusaetzlich nachgesehen (nur lesend).
      let ueFertig = false, ordFertig = false;
      const offen = ()=> schritt(!ueFertig && !ordFertig ? 'Übersicht und Ordner werden gelesen …'
                                : !ueFertig ? 'Excel-Übersicht wird gelesen (Microsoft braucht beim ersten Mal manchmal etwas) …'
                                : 'Ordner „fertige Rechnungen“ wird gelesen …');
      const [ue, dateien, echteDateien] = await Promise.all([
        uebersichtLadenRepariert(token, ziel, betaFrage).then(x=>{ ueFertig = true; offen(); return x; }),
        ordnerDateien(token, ziel.ordner).then(x=>{ ordFertig = true; offen(); return x; }),
        ziel.echt ? Promise.resolve(null) : ordnerDateien(token, MSGRAPH_PFAD_ZIEL_ORDNER).catch(()=> null)
      ]);
      if(echteDateien) echteDateien.forEach((v, k)=>{ if(!dateien.has(k)) dateien.set(k, v); });
      neu = { zielKey: zk, ue, ana: uebersichtAuswerten(ue), dateien, geladenAm: Date.now() };

function betaEigeneDatenVoll(){ const d = LS.get(EIGENE_POS_CACHE, null) || {}; return { ...d, ls: d.ls || [], pt: d.pt || [], begruendungen: d.begruendungen || {} }; }

// Liest den Stand aus OneDrive, fuehrt ihn mit dem lokalen zusammen, wendet
// optional eine Aenderung an und schreibt zurueck.
async function betaEigeneAbgleichen(aenderung){
  const token = await msGraphTokenHolen();
  let fern = null;
  if(token){
    try{
      const r = await fetch(msGraphPfadUrl(EIGENE_POS_PFAD) + '/content', { headers:{ Authorization:'Bearer ' + token }, cache:'no-store' });
      if(r.ok) fern = await r.json();
    }catch(_){}
  }
  const lokal = betaEigeneDatenVoll();
  const neu = { ls: betaEigeneZusammenfuehren(lokal.ls, fern && fern.ls), pt: betaEigeneZusammenfuehren(lokal.pt, fern && fern.pt),
                begruendungen: betaBegrZusammenfuehren(lokal.begruendungen, fern && fern.begruendungen),
                ...betaZusatzZusammenfuehren(lokal, fern) };
  if(aenderung) aenderung(neu);
  LS.set(EIGENE_POS_CACHE, neu);
  const inhalt = (d)=> JSON.stringify({ version: 1, ls: d.ls || [], pt: d.pt || [], begruendungen: d.begruendungen || {},
    profile: d.profile || {}, anordnung: d.anordnung || {}, faktoren: d.faktoren || [], begrKatalog: d.begrKatalog || {}, ebmWerte: d.ebmWerte || [],
    aerzteAdressen: d.aerzteAdressen || [], aerzteRechnungen: d.aerzteRechnungen || [] });
  const text = inhalt(neu);
  if(token && (aenderung || !fern || inhalt(fern) !== text)){
    try{ await msGraphDateiHochladen(token, EIGENE_POS_PFAD, new Blob([text], { type:'application/json' }), 'application/json'); }
    catch(e){ if(aenderung) throw e; }
  }
  return neu;
}

// el liegt in einer .wisch-huelle (roter Hintergrund mit Papierkorb).
// beimLoeschen() -> Promise<boolean> (true = geloescht, sonst zurueckschnappen)
function betaWischen(el, beimLoeschen){
  if(!el || el.__wischen) return;
  el.__wischen = true;
  let x0 = null, y0 = 0, dx = 0, aktiv = false, zuletzt = 0;
  const zurueck = ()=>{ el.style.transition = 'transform .2s ease'; el.style.transform = ''; el.parentElement && el.parentElement.classList.remove('wisch-bereit'); };
  el.addEventListener('touchstart', ev=>{
    if(ev.touches.length !== 1) return;
    x0 = ev.touches[0].clientX; y0 = ev.touches[0].clientY; dx = 0; aktiv = false;
    el.style.transition = 'none';
  }, { passive: true });
  el.addEventListener('touchmove', ev=>{
    if(x0 === null) return;
    const t = ev.touches[0], ddx = t.clientX - x0, ddy = t.clientY - y0;
    if(!aktiv){
      if(Math.abs(ddx) > 14 && Math.abs(ddx) > Math.abs(ddy) * 1.6 && ddx < 0) aktiv = true;
      else if(Math.abs(ddy) > 12 || ddx > 14){ x0 = null; return; }
    }
    if(aktiv){
      dx = Math.min(0, ddx);
      el.style.transform = 'translateX(' + dx + 'px)';
      el.parentElement.classList.toggle('wisch-bereit', dx < -90);
      if(ev.cancelable) ev.preventDefault();
    }
  }, { passive: false });
  el.addEventListener('touchend', async ()=>{
    if(x0 === null){ return; }
    x0 = null;
    if(!aktiv) return;
    zuletzt = Date.now();
    if(dx < -90){
      el.style.transition = 'transform .18s ease';
      el.style.transform = 'translateX(-100%)';
      let ok = false;
      try{ ok = await beimLoeschen(); }catch(e){ ok = false; }
      if(!ok) zurueck();
    } else zurueck();
    aktiv = false;
  });
  // Am PC (Maus): nach links ziehen wie beim Wischen, lange gedrueckt halten
  // oder Rechtsklick -- jeweils mit derselben Rueckfrage zum Loeschen
  const loeschenAusloesen = async ()=>{
    zuletzt = Date.now();
    el.style.transition = 'transform .18s ease'; el.style.transform = 'translateX(-100%)';
    el.parentElement && el.parentElement.classList.add('wisch-bereit');
    let ok = false;
    try{ ok = await beimLoeschen(); }catch(e){ ok = false; }
    if(!ok) zurueck();
  };
  if(!el.title) el.title = 'Löschen: nach links ziehen, lange gedrückt halten oder Rechtsklick';
  el.addEventListener('mousedown', ev=>{
    if(ev.button !== 0 || ev.target.closest('input, textarea, select')) return;
    let mx0 = ev.clientX, my0 = ev.clientY, mdx = 0, maktiv = false;
    el.style.transition = 'none';
    let halte = setTimeout(()=>{ halte = null; if(!maktiv && mx0 !== null){ mx0 = null; loeschenAusloesen(); } }, 700);
    const mm = (e)=>{
      if(mx0 === null) return;
      const ddx = e.clientX - mx0, ddy = e.clientY - my0;
      if(halte && (Math.abs(ddx) > 5 || Math.abs(ddy) > 5)){ clearTimeout(halte); halte = null; }
      if(!maktiv){
        if(ddx < -14 && Math.abs(ddx) > Math.abs(ddy) * 1.6) maktiv = true;
        else if(Math.abs(ddy) > 12 || ddx > 14){ mx0 = null; return; }
      }
      if(maktiv){
        mdx = Math.min(0, ddx);
        el.style.transform = 'translateX(' + mdx + 'px)';
        el.parentElement.classList.toggle('wisch-bereit', mdx < -90);
        e.preventDefault();
      }
    };
    const mu = ()=>{
      document.removeEventListener('mousemove', mm); document.removeEventListener('mouseup', mu);
      if(halte){ clearTimeout(halte); halte = null; }
      if(!maktiv){ mx0 = null; return; }
      maktiv = false; mx0 = null; zuletzt = Date.now();
      if(mdx < -90) loeschenAusloesen(); else zurueck();
    };
    document.addEventListener('mousemove', mm); document.addEventListener('mouseup', mu);
  });
  el.addEventListener('contextmenu', ev=>{ if(ev.target.closest('input, textarea, select')) return; ev.preventDefault(); loeschenAusloesen(); });
  // Klick direkt nach einer Wischbewegung nicht als Antippen werten
  el.addEventListener('click', ev=>{ if(Date.now() - zuletzt < 450){ ev.stopPropagation(); ev.preventDefault(); } }, true);
}

// ---------- PDF direkt in der App anzeigen ----------
// Statt OneDrive im Browser (dort klappte es beim allerersten Oeffnen oft
// nicht, weil die Microsoft-Anmeldung im Browser erst aufgebaut wird) laedt
// die App die PDF selbst und zeigt sie mit pdf.js an.
const PDFJS_VERSION = '4.10.38';
const PDFJS_URL = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@' + PDFJS_VERSION + '/legacy/build/pdf.min.mjs';
const PDFJS_WORKER = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@' + PDFJS_VERSION + '/legacy/build/pdf.worker.min.mjs';
let pdfjsPromise = null;
function pdfjsLaden(){
  if(!pdfjsPromise){
    pdfjsPromise = import(PDFJS_URL).then(m=>{ m.GlobalWorkerOptions.workerSrc = PDFJS_WORKER; return m; })
      .catch(e=>{ pdfjsPromise = null; throw new Error('PDF-Anzeige konnte nicht geladen werden (Internet?).'); });
  }
  return pdfjsPromise;
}
async function betaPdfAnzeigen(opt){
  // opt: {titel, blob?, itemId?, webUrl?}
  let el = document.getElementById('betaPdfAnsicht');
  if(!el){
    el = document.createElement('div');
    el.id = 'betaPdfAnsicht';
    el.className = 'beta-pdf';
    el.innerHTML = '<div class="beta-pdf-kopf"><button type="button" data-a="zu" title="Schließen">✕</button><div class="beta-pdf-titel"></div>' +
      '<button type="button" data-a="klein" title="Verkleinern">−</button><button type="button" data-a="gross" title="Vergrößern">+</button>' +
      '<button type="button" data-a="teilen" title="Teilen / Speichern">⇪</button></div><div class="beta-pdf-seiten"></div>';
    document.body.appendChild(el);
  }
  const seitenEl = el.querySelector('.beta-pdf-seiten');
  el.querySelector('.beta-pdf-titel').textContent = opt.titel || 'PDF';
  seitenEl.innerHTML = '<div class="leer-hinweis"><span class="beta-spinner klein"></span>PDF wird geladen …</div>';
  el.classList.add('aktiv');
  document.body.classList.add('beta-pdf-offen');
  let zoom = 1, blob = opt.blob || null;
  const vorherZurueck = aktuellerZurueckHandler;
  const schliessen = ()=>{ el.classList.remove('aktiv'); document.body.classList.remove('beta-pdf-offen'); seitenEl.innerHTML = ''; aktuellerZurueckHandler = vorherZurueck; };
  aktuellerZurueckHandler = schliessen; // Handy-Zurueck schliesst die Anzeige
  el.querySelector('[data-a="zu"]').onclick = schliessen;
  const zoomSetzen = (z)=>{ zoom = Math.max(1, Math.min(3, z)); seitenEl.querySelectorAll('canvas').forEach(c=> c.style.width = (zoom * 100) + '%'); };
  el.querySelector('[data-a="klein"]').onclick = ()=> zoomSetzen(zoom - 0.5);
  el.querySelector('[data-a="gross"]').onclick = ()=> zoomSetzen(zoom + 0.5);
  el.querySelector('[data-a="teilen"]').onclick = async ()=>{
    if(!blob) return;
    const datei = new File([blob], (opt.titel || 'Rechnung') + '.pdf', { type:'application/pdf' });
    try{
      if(navigator.canShare && navigator.canShare({ files:[datei] })){ await navigator.share({ files:[datei], title: opt.titel || 'Rechnung' }); return; }
    }catch(e){ if(e && e.name === 'AbortError') return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = datei.name; document.body.appendChild(a); a.click(); a.remove();
  };
  try{
    if(!blob){
      const token = await msGraphTokenHolen();
      if(!token) throw new Error('Keine Microsoft-Anmeldung aktiv.');
      blob = new Blob([await graphItemLaden(token, opt.itemId)], { type:'application/pdf' });
    }
    const pdfjs = await pdfjsLaden();
    const doc = await pdfjs.getDocument({ data: new Uint8Array(await blob.arrayBuffer()) }).promise;
    if(!el.classList.contains('aktiv')) return;
    seitenEl.innerHTML = '';
    const breite = Math.max(320, seitenEl.clientWidth - 16);
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    for(let i = 1; i <= doc.numPages; i++){
      const seite = await doc.getPage(i);
      const v1 = seite.getViewport({ scale: 1 });
      const vp = seite.getViewport({ scale: (breite * dpr * 2) / v1.width }); // doppelt aufloesen fuer Zoom
      const c = document.createElement('canvas');
      c.width = Math.round(vp.width); c.height = Math.round(vp.height);
      c.style.width = (zoom * 100) + '%';
      seitenEl.appendChild(c);
      await seite.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
      if(!el.classList.contains('aktiv')) return;
    }
  }catch(e){
    seitenEl.innerHTML = '<div class="leer-hinweis">PDF konnte nicht angezeigt werden: ' + htmlEsc(e.message || String(e)) + '</div>' +
      (opt.webUrl ? '<div style="text-align:center;"><button type="button" class="btn-sekundaer" id="btnPdfOneDrive" style="width:auto; padding:10px 16px;">In OneDrive öffnen</button></div>' : '');
    const b = document.getElementById('btnPdfOneDrive'); if(b) b.onclick = ()=> window.open(opt.webUrl, '_blank');
  }
}

// ---------- Word-Dokumente fuer Mahnung / 2. Adresse ----------
function betaMorgenText(){ const d = new Date(); d.setDate(d.getDate() + 1); return zz2(d.getDate()) + '.' + zz2(d.getMonth() + 1) + '.' + d.getFullYear(); }
async function docxDokumentXml(buf){
  const zip = await JSZip.loadAsync(buf);
  const f = zip.file('word/document.xml');
  if(!f) throw new Error('Die Word-Datei ist beschädigt.');
  return { zip, xml: await f.async('string') };
}
function docxDatumFinden(xml){
  let datum = '';
  xml.replace(RD_ABSATZ_RE, p=>{ if(!datum){ const m = /Datum:\s*(\d{1,2}\.\d{1,2}\.\d{4})/.exec(rdAbsatzText(p)); if(m) datum = m[1]; } return p; });
  return datum;
}
// Absatz mit neuem Text (Format des ersten Textstuecks behalten)
function docxAbsatzMitText(p, text){
  const alt = rdAbsatzText(p);
  if(alt) return rdPlatzhalterInXml(p, [[alt, text]]);
  const lauf = '<w:r><w:t xml:space="preserve">' + rdXml(text) + '</w:t></w:r>';
  if(!/<\/w:p>$/.test(p)) return p.replace(/\/>$/, '>' + lauf + '</w:p>');
  return p.replace(/<\/w:p>$/, lauf + '</w:p>');
}
// Wie MahnungZahlungstext am PC
function betaMahnungZahlungstext(nr, origDatum, vorige){
  let satz;
  const liste = (vorige || []).filter(Boolean).map(d=> 'der Erinnerung vom ' + d).join(' und ');
  if(nr <= 1 || !origDatum || !liste) satz = 'Sie sind der Zahlungsaufforderung vom ' + origDatum + ' nicht nachgekommen.';
  else satz = 'Sie sind der Zahlungsaufforderung vom ' + origDatum + ' sowie ' + liste + ' nicht nachgekommen.';
  return satz + ' Ich bitte Sie den Betrag unter Angabe der Rechnungsnummer innerhalb von 14 Tagen auf mein Konto zu überweisen. Bei Nichtzahlung geraten Sie automatisch in Verzug.';
}
const ZAHLUNGSTEXT_PT = 'Ich bitte Sie den Betrag unter Angabe der Rechnungsnummer innerhalb von 30 Tagen auf mein Konto zu überweisen. Bei Nichtzahlung geraten Sie 30 Tage nach Erhalt dieser Rechnung automatisch in Verzug.';
const ZAHLUNGSTEXT_LS = 'Ich bitte Sie den Betrag unter Angabe der Rechnungsnummer auf mein Konto zu überweisen.';

// Datum in eine Spalte der Uebersicht (V = 1. Mahnung/2. Adresse, X = 2. Mahnung)
async function betaUebersichtDatumSetzen(token, ziel, renu, spalte, datumText, frage){
  const ue = await uebersichtLadenRepariert(token, ziel, frage);
  const z = uebersichtAuswerten(ue).nachRenu.get(renu);
  if(!z) throw new Error('Die Rechnung ' + renu + ' steht nicht in der Übersicht.');
  const idx = spaltenBuchstabeZuNr(spalte) - 1;
  const alt = xlDatumText(z.v[idx]);
  if(alt && alt !== datumText && !await frage('In Spalte ' + spalte + ' steht für diese Rechnung bereits „' + alt + '“.\n\nMit ' + datumText + ' überschreiben?', 'Überschreiben', 'Behalten')) return false;
  const sid = await xlSitzung(token, ue.basis);
  try{
    const schutz = await blattSchutzAufheben(token, ue, sid);
    try{ await gx(token, 'PATCH', zelle(ue, spalte + z.nr), { values: [[xlDatumSerial(datumText)]], numberFormat: [[XL_FORMAT_DATUM]] }, sid); }
    finally{ await blattSchutzWiederherstellen(token, ue, schutz, sid); }
  } finally { await xlSitzungEnde(token, ue.basis, sid); }
  return true;
}
// Dateien im Zielordner -- in der Testablage zusaetzlich (nur lesend) die echten
async function betaDateienAlle(token, ziel){
  const d = await ordnerDateien(token, ziel.ordner);
  if(!ziel.echt){
    try{ (await ordnerDateien(token, MSGRAPH_PFAD_ZIEL_ORDNER)).forEach((v, k)=>{ if(!d.has(k)) d.set(k, v); }); }catch(_){}

// Erinnerungen (frueher "Mahnung"): neue Dateien heissen "..._Erinnerung n",
// aeltere "..._Mahnung n" werden weiter erkannt und mitgezaehlt.
function betaErinnerungDatei(dateien, basis, n, endung){
  return dateien.get((basis + '_erinnerung ' + n + endung).toLowerCase()) || dateien.get((basis + '_mahnung ' + n + endung).toLowerCase()) || null;
}
async function betaMahnungErstellen(e){
  const ziel = betaZiel();
  betaOverlay.zeigen('Erinnerung wird erstellt'); betaOverlay.fortschritt(0.05);
  try{
    const token = await msGraphTokenHolen();
    if(!token) throw new Error('Keine Microsoft-Anmeldung aktiv.');
    betaOverlay.schritt('Rechnung wird geladen …');
    const basis = renuDateiname(e.renu);
    const dateien = await betaDateienAlle(token, ziel);
    const orig = dateien.get((basis + '.docx').toLowerCase());
    if(!orig) throw new Error('Die Word-Datei der Rechnung (' + basis + '.docx) wurde nicht gefunden.');
    let nr = 1; while(betaErinnerungDatei(dateien, basis, nr, '.docx')) nr++;
    const { zip, xml } = await docxDokumentXml(await graphItemLaden(token, orig.id));
    const origDatum = docxDatumFinden(xml);
    const vorige = [];
    for(let k = 1; k < nr; k++){
      const it = betaErinnerungDatei(dateien, basis, k, '.docx');
      try{ vorige.push(it ? docxDatumFinden((await docxDokumentXml(await graphItemLaden(token, it.id))).xml) : ''); }catch(_){ vorige.push(''); }
    }
    betaOverlay.fortschritt(0.35); betaOverlay.schritt(nr + '. Erinnerung wird geschrieben …');
    const morgen = betaMorgenText();
    const text = betaMahnungZahlungstext(nr, origDatum, vorige);
    const warnungen = [];
    let neu = rdPlatzhalterInXml(xml, [['Privatrechnung', nr + '. Erinnerung']]);
    if(neu === xml) warnungen.push('Die Überschrift „Privatrechnung“ wurde nicht gefunden.');
    const vorZahlung = neu;
    neu = rdPlatzhalterInXml(neu, [[ZAHLUNGSTEXT_PT, text], [ZAHLUNGSTEXT_LS, text]]);
    if(neu === vorZahlung) warnungen.push('Der Zahlungstext wurde nicht im erwarteten Wortlaut gefunden – bitte in der Erinnerung prüfen.');
    if(origDatum) neu = rdPlatzhalterInXml(neu, [['Datum: ' + origDatum, 'Datum: ' + morgen]]);
    else warnungen.push('Das Rechnungsdatum („Datum:“) wurde nicht gefunden.');
    zip.file('word/document.xml', neu);
    const blob = await zip.generateAsync({ type:'blob', compression:'DEFLATE', mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
    const name = basis + '_Erinnerung ' + nr;
    if(!ziel.echt){ await msGraphOrdnerSicherstellen(token, 'KVBW Onedrive/Beta-Test'); await msGraphOrdnerSicherstellen(token, BETA_ZIEL_ORDNER); }
    betaOverlay.fortschritt(0.55); betaOverlay.schritt('Word-Datei wird hochgeladen …');
    const { pdfBlob, pdfItem } = await docxHochladenMitPdf(token, ziel.ordner, name, blob, t=>{ betaOverlay.fortschritt(0.7); betaOverlay.schritt(t); });
    betaOverlay.fortschritt(0.9); betaOverlay.schritt('Datum wird in die Übersicht eingetragen …');
    const spalte = nr === 1 ? 'V' : (nr === 2 ? 'X' : '');
    if(spalte) await betaUebersichtDatumSetzen(token, ziel, e.renu, spalte, morgen, betaFrage);
    else warnungen.push('Für die ' + nr + '. Erinnerung gibt es keine Spalte in der Übersicht – Datum bitte von Hand eintragen.');
    return await betaDokumentFertig(nr + '. Erinnerung erstellt', { renu: e.renu, name, ziel, typ: 'M' + nr, pdfBlob, pdfItemId: pdfItem && pdfItem.id }, warnungen);
  }catch(err){
    await betaOverlay.ergebnis('Erinnerung nicht erstellt', '✗ ' + htmlEsc(err.message || String(err)));
    betaOverlay.schliessen();
    return false;
  }
}

async function betaZweiteAdresseErstellen(e){
  const ziel = betaZiel();
  betaOverlay.zeigen('Rechnung an 2. Adresse'); betaOverlay.fortschritt(0.05);
  try{
    const token = await msGraphTokenHolen();
    if(!token) throw new Error('Keine Microsoft-Anmeldung aktiv.');
    const v = e.z.v, t = x=> String(x == null ? '' : x).trim();
    const melde = [t(v[8]), t(v[9])], sterbe = [t(v[10]), t(v[11])];
    let adr = melde;
    const abweichend = (sterbe[0] || sterbe[1]) && (sterbe[0] !== melde[0] || sterbe[1] !== melde[1]) && sterbe[0].toLowerCase() !== 'idem';
    if(abweichend){
      const wahl = await betaOverlay.ergebnis('Welche Adresse?', 'Für diese Rechnung gibt es zwei Adressen:',
        [{ label:'Melde: ' + melde.join(', '), akt:'melde', primaer:true }, { label:'Sterbeort: ' + sterbe.join(', '), akt:'sterbe' }, { label:'Abbrechen', akt:'nein' }]);
      if(wahl === 'nein'){ betaOverlay.schliessen(); return false; }
      if(wahl === 'sterbe') adr = sterbe;
      betaOverlay.zeigen('Rechnung an 2. Adresse');
    }
    if(!adr[0] && !adr[1]) throw new Error('In der Übersicht steht keine Patientenadresse.');
    betaOverlay.schritt('Rechnung wird geladen …');
    const basis = renuDateiname(e.renu);
    const dateien = await betaDateienAlle(token, ziel);
    const orig = dateien.get((basis + '.docx').toLowerCase());
    if(!orig) throw new Error('Die Word-Datei der Rechnung (' + basis + '.docx) wurde nicht gefunden.');
    const { zip, xml } = await docxDokumentXml(await graphItemLaden(token, orig.id));
    // Absaetze einsammeln, "c/o Bestattungsinstitut"-Zeile entfernen, die
    // beiden folgenden Zeilen (Bestatter-Adresse) durch die Adresse ersetzen
    const absaetze = [];
    xml.replace(RD_ABSATZ_RE, (p, pos)=>{ absaetze.push({ p, pos }); return p; });
    const i = absaetze.findIndex(a=> rdAbsatzText(a.p).indexOf('c/o Bestattungsinstitut') >= 0);
    if(i < 0 || !absaetze[i + 2]) throw new Error('Diese Rechnung ging nicht an einen Bestatter („c/o Bestattungsinstitut“ fehlt) – sie ist schon an die Patientenadresse adressiert.');
    const ersatz = new Map([[i, ''], [i + 1, docxAbsatzMitText(absaetze[i + 1].p, adr[0])], [i + 2, docxAbsatzMitText(absaetze[i + 2].p, adr[1])]]);
    let neu = '', ende = 0;
    absaetze.forEach((a, k)=>{ neu += xml.slice(ende, a.pos) + (ersatz.has(k) ? ersatz.get(k) : a.p); ende = a.pos + a.p.length; });
    neu += xml.slice(ende);
    const warnungen = [];
    const morgen = betaMorgenText();
    const origDatum = docxDatumFinden(neu);
    if(origDatum) neu = rdPlatzhalterInXml(neu, [['Datum: ' + origDatum, 'Datum: ' + morgen]]);
    else warnungen.push('Das Rechnungsdatum („Datum:“) wurde nicht gefunden.');
    zip.file('word/document.xml', neu);
    const blob = await zip.generateAsync({ type:'blob', compression:'DEFLATE', mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
    const name = basis + '_2. Adresse';
    if(!ziel.echt){ await msGraphOrdnerSicherstellen(token, 'KVBW Onedrive/Beta-Test'); await msGraphOrdnerSicherstellen(token, BETA_ZIEL_ORDNER); }
    betaOverlay.fortschritt(0.5); betaOverlay.schritt('Word-Datei wird hochgeladen …');
    const { pdfBlob, pdfItem } = await docxHochladenMitPdf(token, ziel.ordner, name, blob, t2=>{ betaOverlay.fortschritt(0.7); betaOverlay.schritt(t2); });
    betaOverlay.fortschritt(0.9); betaOverlay.schritt('Datum wird in die Übersicht eingetragen …');
    await betaUebersichtDatumSetzen(token, ziel, e.renu, 'V', morgen, betaFrage);
    return await betaDokumentFertig('Rechnung an 2. Adresse erstellt', { renu: e.renu, name, ziel, typ: '2A', pdfBlob, pdfItemId: pdfItem && pdfItem.id },
      ['Adresse: ' + adr.filter(Boolean).join(', '), ...warnungen]);
  }catch(err){
    await betaOverlay.ergebnis('Nicht erstellt', '✗ ' + htmlEsc(err.message || String(err)));
    betaOverlay.schliessen();
    return false;
  }
}

// Abschluss fuer Mahnung/2. Adresse: ansehen oder gleich verschicken
async function betaDokumentFertig(titel, e, hinweise){
  const testmodus = briefTestmodus((iniCacheLaden() || { werte:{} }).werte || {}, e.ziel);
  for(;;){
    const akt = await betaOverlay.ergebnis(titel, '<div class="beta-erg">✓ <b>' + htmlEsc(e.name) + '</b>' +
      (hinweise || []).map(t=> '<br><span class="beta-erg-klein">' + htmlEsc(t) + '</span>').join('') + '</div>',
      [{ label:'PDF ansehen', akt:'pdf' }, { label:'Brief senden' + (testmodus ? ' (Test)' : ' (LIVE)'), akt:'lxp' }, { label:'Fertig', akt:'ok', primaer:true }]);
    if(akt === 'pdf'){ betaOverlay.schliessen(); await betaPdfAnzeigen({ titel: e.name, blob: e.pdfBlob }); return true; }
    if(akt === 'lxp'){
      betaOverlay.zeigen('Brief'); betaOverlay.fortschritt(null);
      try{
        const r = await betaBriefeVersenden([e], betaFrage);
        if(!r.abgebrochen){
          await betaOverlay.ergebnis('Brief', r.fehler.length ? '✗ ' + htmlEsc(r.fehler.join('\n')) : (r.test ? '✓ Testbrief angenommen und vermerkt.' : '✓ Brief verschickt und vermerkt.'));
          break;
        }
      }catch(err){ await betaOverlay.ergebnis('Brief', '✗ ' + htmlEsc(err.message || String(err))); }
      continue;
    }
    break;
  }
  betaOverlay.schliessen();
  return true;
}

// ---------- Zahlung: bezahlt am / offen seit (Spalte S "Zahlung erhalten") ----------
// Verzug beginnt (§ 286 Abs. 3 BGB) 30 Tage nach Zugang der Rechnung; gezaehlt
// wird ab dem Datum in Spalte R (Brief abgeschickt bzw. Rechnungsdatum).
function betaTageSeit(datumText){
  const s = xlDatumSerial(datumText); if(!s) return NaN;
  const h = xlDatumSerial(heuteText());
  return h - s;
}
function betaZahlungInfo(e){
  if(e.bezahlt) return '<div class="info zahlung bezahlt">&#10003; bezahlt am ' + htmlEsc(e.bezahlt) + '</div>';
  const t = betaTageSeit(e.abgeschickt);
  if(isNaN(t) || t < 0 || e.geplant) return '';
  if(t > 30) return '<div class="info zahlung verzug">offen seit ' + t + ' Tagen · im Verzug seit ' + (t - 30) + (t - 30 === 1 ? ' Tag' : ' Tagen') + '</div>';
  return '<div class="info zahlung offen">offen seit ' + t + (t === 1 ? ' Tag' : ' Tagen') + '</div>';
}
async function betaAktionBezahlt(eintraege){
  const ziel = betaZiel();
  const orig = eintraege.filter(e=> e.typ === 'ORIG');
  if(!orig.length){ await betaOverlay.meldung('Bitte die Rechnung selbst auswählen (nicht Erinnerung oder 2. Adresse).'); return false; }
  const alleBezahlt = orig.every(e=> e.bezahlt);
  const heute = heuteIso();
  const akt = await betaOverlay.ergebnis(alleBezahlt ? 'Zahlung' : 'Als bezahlt markieren',
    (orig.length === 1 ? htmlEsc(orig[0].name) + ' · Nr. ' + htmlEsc(orig[0].renu) : orig.length + ' Rechnungen') +
    '<div class="beta-form"><label>Zahlung erhalten am<input type="date" id="betaBezahltAm" max="' + heute + '" value="' + heute + '"></label></div>' +
    '<div class="beta-erg-klein" style="margin-top:6px;">Wird in der Übersicht in Spalte S („Zahlung erhalten“) eingetragen.</div>',
    [{ label:'Abbrechen', akt:'nein' }, ...(orig.some(e=> e.bezahlt) ? [{ label:'Zahlung entfernen', akt:'weg' }] : []), { label:'Speichern', akt:'ja', primaer:true }]);
  const am = (document.getElementById('betaBezahltAm') || {}).value || '';
  if(akt === 'nein'){ betaOverlay.schliessen(); return false; }
  if(akt === 'ja' && (!am || am > heute)){ await betaOverlay.meldung('Bitte ein Datum bis heute wählen.'); return false; }
  betaOverlay.zeigen(akt === 'weg' ? 'Zahlung wird entfernt' : 'Zahlung wird eingetragen'); betaOverlay.fortschritt(null);
  try{
    const token = await msGraphTokenHolen();
    if(!token) throw new Error('Keine Microsoft-Anmeldung aktiv.');
    const ue = await uebersichtLadenRepariert(token, ziel, betaFrage);
    const ana = uebersichtAuswerten(ue);
    const sid = await xlSitzung(token, ue.basis);
    try{
      const schutz = await blattSchutzAufheben(token, ue, sid);
      try{
        for(const e of orig){
          const z = ana.nachRenu.get(e.renu); if(!z) continue;
          if(akt === 'weg') await gx(token, 'PATCH', zelle(ue, 'S' + z.nr), { values: [['']] }, sid);
          else await gx(token, 'PATCH', zelle(ue, 'S' + z.nr), { values: [[xlDatumSerial(isoDe(am))]], numberFormat: [[XL_FORMAT_DATUM]] }, sid);
        }
      } finally { await blattSchutzWiederherstellen(token, ue, schutz, sid); }

  }catch(err){ await betaOverlay.ergebnis('Nicht eingetragen', '✗ ' + htmlEsc(err.message || String(err))); betaOverlay.schliessen(); return false; }

const BRIEF_SYMBOL = '<span class="badge-brief" title="per Brief verschickt">&#128232;</span>';

// ---------- Geplanten Versand aendern / stornieren (Sanduhr) ----------
// Aendert den vorhandenen Auftrag bei LetterXpress (PUT) bzw. loescht ihn --
// es wird NIE ein zweiter Auftrag angelegt. Lehnt LetterXpress ab (laut
// Beschreibung nur in den ersten 15 Minuten moeglich), bleibt alles wie es ist.
async function betaTerminBearbeiten(e, ziel){
  const plan = e.geplant;
  if(!plan) return false;
  const min = morgenIso();
  const akt = await betaOverlay.ergebnis('Geplanter Versand',
    htmlEsc(e.datei) + '<br>liegt bei LetterXpress und geht am <b>' + htmlEsc(isoDe(plan.datum)) + '</b> raus' + (plan.modus === 'test' ? ' (Testmodus)' : '') + '.' +
    (plan.id ? '<div class="beta-form"><label>Neues Versanddatum<input type="date" id="betaTerminNeu" min="' + min + '" value="' + htmlEsc(plan.datum) + '"></label></div>' +
      '<div class="beta-erg-klein" style="margin-top:8px;">LetterXpress lässt das Datum nicht ändern. „Datum ändern“ storniert deshalb den Auftrag und übergibt denselben Brief mit dem neuen Datum neu. Neu übergeben wird nur, wenn das Stornieren geklappt hat – es geht also nie zweimal ein Brief raus.</div>'
             : '<div class="beta-erg-klein" style="margin-top:8px;">Für diesen Brief ist keine LetterXpress-Auftragsnummer gespeichert (vor diesem Update geplant). Ändern geht nur im LetterXpress-Kundenkonto.</div>'),
    plan.id ? [{ label:'Schließen', akt:'nein' }, { label:'Stornieren', akt:'storno' }, { label:'Datum ändern', akt:'aendern', primaer:true }]
            : [{ label:'OK', akt:'nein', primaer:true }]);
  const neu = (document.getElementById('betaTerminNeu') || {}).value || '';
  if(akt === 'nein'){ betaOverlay.schliessen(); return false; }
  if(akt === 'aendern'){
    if(!neu || neu < min){ await betaOverlay.meldung('Bitte ein Datum ab morgen wählen.'); return false; }
    if(neu === plan.datum){ betaOverlay.schliessen(); return false; }
  }
  if(akt === 'storno' && !await betaFrage('Brief „' + e.datei + '“ bei LetterXpress stornieren?\n\nEr wird dann nicht verschickt. In der Übersicht wird der Versandvermerk entfernt.', 'Stornieren', 'Abbrechen')) return false;
  betaOverlay.zeigen(akt === 'storno' ? 'Versand wird storniert' : 'Versanddatum wird geändert'); betaOverlay.fortschritt(null);
  try{
    const token = await msGraphTokenHolen();
    if(!token) throw new Error('Keine Microsoft-Anmeldung aktiv.');
    betaOverlay.schritt('Rechnungsübersicht prüfen …');
    const ue = await uebersichtLadenRepariert(token, ziel, betaFrage);
    const ana = uebersichtAuswerten(ue);
    const z = ana.nachRenu.get(e.renu);
    if(!z) throw new Error('Die Rechnung steht nicht mehr in der Übersicht.');
    const u = String(z.v[20] == null ? '' : z.v[20]);
    const schl = versandSchluessel(e.typ), plaene = versandPlaene(u), aktuell = plaene[schl];
    if(!aktuell || aktuell.id !== plan.id || aktuell.datum !== plan.datum) throw new Error('Der Versand wurde inzwischen an anderer Stelle geändert – bitte „Neu laden“.');
    if(akt === 'aendern'){
      betaOverlay.schritt('Alter Auftrag wird storniert und mit dem ' + isoDe(neu) + ' neu übergeben …');
      await versandGeplantErsetzen(token, ziel, e.renu, e.typ, e.datei, plan, neu, null, e.pdf && e.pdf.id);
      betaOverlay.schliessen();
      appToastAnzeigen('Versand verschoben auf ' + isoDe(neu) + '.', 2600);
      return true;
    }
    betaOverlay.schritt('LetterXpress …');
    await lxpAuftrag('DELETE', plan.id, plan.modus);
    betaOverlay.schritt('Übersicht wird aktualisiert …');
    const sid = await xlSitzung(token, ue.basis);
    try{
      const schutz = await blattSchutzAufheben(token, ue, sid);
      try{
        let neuU;
        if(akt === 'aendern'){ plaene[schl] = { ...aktuell, datum: neu }; neuU = versandPlaeneSetzen(u, plaene); }
        else { delete plaene[schl]; neuU = versandPlaeneSetzen(lxpFlagEntfernenText(u, lxpFlagFuerTyp(e.typ)), plaene); }
        await gx(token, 'PATCH', zelle(ue, 'U' + z.nr), { values: [[neuU]] }, sid);
        if(schl === '1'){
          if(akt === 'aendern') await gx(token, 'PATCH', zelle(ue, 'R' + z.nr), { values: [[xlDatumSerial(isoDe(neu))]], numberFormat: [[XL_FORMAT_DATUM]] }, sid);
          else await gx(token, 'PATCH', zelle(ue, 'R' + z.nr) + '/format/font', { bold: false }, sid);
        }
      } finally { await blattSchutzWiederherstellen(token, ue, schutz, sid); }
    } finally { await xlSitzungEnde(token, ue.basis, sid); }
    betaOverlay.schliessen();
    appToastAnzeigen(akt === 'aendern' ? 'Versand verschoben auf ' + isoDe(neu) + '.' : 'Versand storniert.', 2600);
    return true;
  }catch(err){
    await betaOverlay.ergebnis('Nicht geändert', '✗ ' + htmlEsc(err.message || String(err)) +
      (err.abgelehnt && !err.storniert ? '<br><br>Der Brief geht wie geplant am ' + htmlEsc(isoDe(plan.datum)) + ' raus – es wurde nichts doppelt verschickt. Ändern geht jetzt nur noch im LetterXpress-Kundenkonto bzw. über den LetterXpress-Support.' : ''));
    betaOverlay.schliessen();
    return false;
  }
}

      [{ label:'Abbrechen', akt:'nein' }, { label:'Weiter', akt:'ja', primaer:true }]);

    if(akt !== 'ja'){ betaOverlay.schliessen(); return false; }
    if(!versandDatumIso || versandDatumIso < min){ await betaOverlay.meldung('Bitte ein Datum ab morgen wählen.'); return false; }
  }
  betaOverlay.zeigen(mitTermin ? 'Versand wird geplant' : 'Briefe werden verschickt'); betaOverlay.fortschritt(null); betaOverlay.schritt('Versandstatus wird geprüft …');
  try{
    const r = await betaBriefeVersenden(offen.map(e=> ({ renu: e.renu, name: e.datei, ziel, typ: e.typ, pdfItemId: e.pdf.id })), betaFrage, { versandDatumIso });
    if(r.abgebrochen){ betaOverlay.schliessen(); return false; }
    const ok = r.gesendet.length;
    await betaOverlay.ergebnis(ok ? (ok === 1 ? 'Brief übergeben' : ok + ' Briefe übergeben') : 'Nicht verschickt',
      (ok ? '✓ ' + ok + ' an LetterXpress übergeben' + (r.test ? ' (Testmodus – nichts verschickt)' : '') + (versandDatumIso ? ', Versand am ' + versandDatumIso.split('-').reverse().join('.') : '') + ' und in der Übersicht vermerkt.' : '') +
      (r.uebersprungen ? '<br>' + r.uebersprungen + ' bereits verschickte übersprungen.' : '') +

async function betaAktionFreigeben(eintraege){
  const ziel = betaZiel();
  const geplant = eintraege.filter(e=> e.versendet && e.geplant);
  if(geplant.length){
    await betaOverlay.meldung((geplant.length === 1 ? geplant[0].datei + ' liegt' : geplant.length + ' Briefe liegen') + ' noch geplant bei LetterXpress (' +
      geplant.map(e=> isoDe(e.geplant.datum)).join(', ') + ').\n\nFreigeben würde einen zweiten Brief ermöglichen. Zum Ändern oder Stornieren bitte auf die Sanduhr tippen.', 'Noch nicht verschickt');
    return false;
  }
  const versendet = eintraege.filter(e=> e.versendet);
  if(!versendet.length){ await betaOverlay.meldung('Keine der ausgewählten ist als verschickt markiert.'); return false; }
  if(!await betaFrage('Versand-Sperre für ' + (versendet.length === 1 ? 'diese Position' : 'diese ' + versendet.length + ' Positionen') + ' aufheben?\n\n' +
    versendet.map(e=> '• ' + e.datei).join('\n') + '\n\nDanach lassen sie sich erneut per LetterXpress verschicken (z.B. wenn der Brief nicht angekommen ist). Das Datum in der Übersicht bleibt stehen, ist aber nicht mehr fett. Die Rechnungsnummer bleibt fest.', 'Freigeben', 'Abbrechen')) return false;
  betaOverlay.zeigen('Versand-Sperre wird aufgehoben'); betaOverlay.fortschritt(null);
  try{
    const token = await msGraphTokenHolen();
    if(!token) throw new Error('Keine Microsoft-Anmeldung aktiv.');
    const ue = await uebersichtLadenRepariert(token, ziel, betaFrage);
    const ana = uebersichtAuswerten(ue);
    const proZeile = new Map();
    versendet.forEach(e=>{ const z = ana.nachRenu.get(e.renu); if(z){ const l = proZeile.get(z.nr) || { z, flags: [] }; l.flags.push(lxpFlagFuerTyp(e.typ)); proZeile.set(z.nr, l); } });
    const sid = await xlSitzung(token, ue.basis);
    try{
      const schutz = await blattSchutzAufheben(token, ue, sid);
      try{
        for(const { z, flags } of proZeile.values()){
          let u = String(z.v[20] == null ? '' : z.v[20]);
          flags.forEach(f=>{ u = lxpFlagEntfernenText(u, f); });
          // Nummer bleibt fest (der Patient kennt sie schon), auch ohne Versandkennzeichen
          if(!/(^|\|)\s*NRFEST/i.test(u)) u = u.trim() ? u + ' | NRFEST' : 'NRFEST';
          await gx(token, 'PATCH', zelle(ue, 'U' + z.nr), { values: [[u]] }, sid);
          // Original wieder freigegeben -> Datum in R nicht mehr fett
          if(flags.includes('LXP:1')) await gx(token, 'PATCH', zelle(ue, 'R' + z.nr) + '/format/font', { bold: false }, sid);
        }
      } finally { await blattSchutzWiederherstellen(token, ue, schutz, sid); }
    } finally { await xlSitzungEnde(token, ue.basis, sid); }
    betaOverlay.schliessen();
    appToastAnzeigen(versendet.length === 1 ? 'Wieder zum Versand freigegeben.' : versendet.length + ' wieder zum Versand freigegeben.', 2500);
  }catch(err){ await betaOverlay.ergebnis('Nicht freigegeben', '✗ ' + htmlEsc(err.message || String(err))); betaOverlay.schliessen(); }
  return true;
}

// Wie am PC: Dateien loeschen, bei Original-Rechnungen auf Wunsch auch die
// Zeile der Uebersicht. In der Testablage werden nie echte Dateien geloescht.
async function betaAktionLoeschen(eintraege){
  const ziel = betaZiel();
  const orig = eintraege.filter(e=> e.typ === 'ORIG');
  const liste = eintraege.map(e=> '• ' + e.datei).join('\n');
  let mitZeile = false;
  if(orig.length){
    const akt = await betaOverlay.ergebnis('Endgültig löschen?', htmlEsc('Die erzeugten Dokumente (Word + PDF) wirklich löschen?\n\n' + liste).replace(/\n/g, '<br>') +
      (orig.length < eintraege.length ? '<br><br><span class="beta-erg-klein">Für Erinnerungen/2. Adresse gibt es keine eigene Zeile – dort werden nur die Dateien gelöscht.</span>' : ''),
      [{ label:'Abbrechen', akt:'nein' }, { label:'Nur Dateien', akt:'dateien' }, { label:'Dateien + Zeile', akt:'zeile', primaer:true }]);
    if(akt === 'nein'){ betaOverlay.schliessen(); return false; }
    mitZeile = akt === 'zeile';
  } else {
    if(!await betaFrage('Die erzeugten Dokumente (Word + PDF) wirklich löschen?\n\n' + liste, 'Löschen', 'Abbrechen')) return false;
  }
  betaOverlay.zeigen('Wird gelöscht'); betaOverlay.fortschritt(null);
  const fehler = [];
  try{
    const token = await msGraphTokenHolen();
    if(!token) throw new Error('Keine Microsoft-Anmeldung aktiv.');
    for(const e of eintraege){
      for(const endung of ['.docx', '.pdf']){
        try{ await gx(token, 'DELETE', msGraphPfadUrl(ziel.ordner + '/' + e.datei + endung)); }
        catch(err){ if(err.status !== 404) fehler.push(e.datei + endung + ': ' + err.message); }
      }
    }
    if(mitZeile && orig.length){
      betaOverlay.schritt('Zeilen werden aus der Übersicht gelöscht …');
      const ue = await uebersichtLadenRepariert(token, ziel, betaFrage);
      const ana = uebersichtAuswerten(ue);
      const nrn = [...new Set(orig.map(e=> (ana.nachRenu.get(e.renu) || {}).nr).filter(Boolean))].sort((a, b)=> b - a);
      const sid = await xlSitzung(token, ue.basis);
      try{
        const schutz = await blattSchutzAufheben(token, ue, sid);
        try{ for(const nr of nrn) await gx(token, 'POST', zelle(ue, nr + ':' + nr) + '/delete', { shift: 'Up' }, sid); }
        finally{ await blattSchutzWiederherstellen(token, ue, schutz, sid); }
      } finally { await xlSitzungEnde(token, ue.basis, sid); }
      // zugehoerige lokale Faelle (hochgeladen/bearbeitet) mitnehmen
      const renus = new Set(orig.map(e=> e.renu));
      ['ls', 'pt'].forEach(art=>{
        const arr = ladeFaelle(art);
        const rest = arr.filter(f=> !(f && ((f.bezug && renus.has(f.bezug.renu)) || (f.hochgeladen && renus.has(f.hochgeladen.renu)))));
        if(rest.length !== arr.length) speichereFaelle(art, rest);
      });
    }
  }catch(err){ fehler.push(err.message || String(err)); }
  if(fehler.length) await betaOverlay.ergebnis('Löschen', '✗ ' + fehler.map(htmlEsc).join('<br>✗ '));
  betaOverlay.schliessen();
  if(!fehler.length) appToastAnzeigen('Gelöscht.', 2000);
  // Luecke in der fortlaufenden Nummer? Nicht verschickte Rechnungen aufruecken lassen
  if(!fehler.length && mitZeile && orig.length){
    try{ await betaAufruecken(ziel); }
    catch(err){ await betaOverlay.ergebnis('Aufrücken', '✗ ' + htmlEsc(err.message || String(err))); betaOverlay.schliessen(); }
  }
  return !fehler.length;
}

// Nach dem Loeschen: nicht verschickte Rechnungen hinter der hoechsten
// verschickten schliessen die Luecken (neue Nummer, Word + PDF neu).
// Verschickte Rechnungen und solche mit Mahnung/2. Adresse behalten ihre Nummer.
function renuMitNummer(renu, n){ return String(renu).replace(/-(\d{3})$/, '-' + String(n).padStart(3, '0')); }
async function betaAufruecken(ziel){
  const token = await msGraphTokenHolen();
  if(!token) return;
  betaOverlay.zeigen('Rechnungsnummern prüfen'); betaOverlay.fortschritt(null);
  const ue = await uebersichtLadenRepariert(token, ziel, betaFrage);
  const ana = uebersichtAuswerten(ue);
  const fest = await hoechsteFesteNr(token, ue, ana);
  const dateien = await ordnerDateien(token, ziel.ordner);
  const reserviert = reservierteNummernNormaleApp(ana);
  const kandidaten = [...ana.nachNr.entries()].filter(([n])=> n > fest).sort((a, b)=> a[0] - b[0]);
  const plan = [];
  let naechste = fest + 1;
  for(const [n, z] of kandidaten){
    while(reserviert.has(naechste) && naechste < n) naechste++;
    const renu = String(z.v[16] == null ? '' : z.v[16]).trim();
    const basis = renuDateiname(renu).toLowerCase();
    const abgeleitet = [...dateien.keys()].some(k=> k.indexOf(basis + '_') === 0);
    if(abgeleitet || n < naechste){ naechste = Math.max(naechste, n + 1); continue; }
    if(n !== naechste) plan.push({ z, alt: renu, neu: renuMitNummer(renu, naechste), name: String(z.v[5] || '') + ', ' + String(z.v[6] || '') });
    naechste++;
  }
  betaOverlay.schliessen();
  if(!plan.length) return;
  const text = 'Durch das Löschen ist eine Lücke in den Rechnungsnummern entstanden. Diese noch nicht verschickten Rechnungen können aufrücken:\n\n' +
    plan.map(p=> '• ' + p.name + ': ' + p.alt + ' → ' + p.neu).join('\n') + '\n\nWord und PDF werden dabei mit der neuen Nummer neu erstellt.';
  if(!await betaFrage(text, 'Aufrücken', 'Nummern behalten')) return;
  betaOverlay.zeigen('Rechnungen rücken auf');
  const { arzt } = await arztdatenLaden();
  const kontext = { token, arzt, ziel, vorlagen: {} };
  const fehler = [];
  for(let i = 0; i < plan.length; i++){
    const p = plan[i];
    betaOverlay.fortschritt(i / plan.length);
    betaOverlay.schritt(p.name + ': ' + p.alt + ' → ' + p.neu);
    try{
      const f = { ...uebersichtZeileAlsFall(p.z, ziel), rechnungsnummer: p.neu, umnummern: true, bezug: { renu: p.alt }, idx: -1 };
      const erg = await betaRechnungErstellen(f, t=> betaOverlay.schritt(p.name + ': ' + t), async ()=> true, kontext);
      if(erg && erg.renu === p.neu){
        for(const endung of ['.docx', '.pdf']){
          try{ await gx(token, 'DELETE', msGraphPfadUrl(ziel.ordner + '/' + renuDateiname(p.alt) + endung)); }catch(_){}
        }
        // lokale Faelle auf die neue Nummer umstellen
        ['ls', 'pt'].forEach(art=>{
          const arr = ladeFaelle(art); let geaendert = false;
          arr.forEach(x=>{
            if(!x) return;
            if(x.bezug && x.bezug.renu === p.alt){ x.bezug.renu = p.neu; geaendert = true; }
            if(x.hochgeladen && x.hochgeladen.renu === p.alt){ x.hochgeladen.renu = p.neu; geaendert = true; }
            if(x.rechnungsnummer === p.alt){ x.rechnungsnummer = p.neu; geaendert = true; }
          });
          if(geaendert) speichereFaelle(art, arr);
        });
      } else fehler.push(p.name + ': nicht umnummeriert');
    }catch(err){ fehler.push(p.name + ': ' + (err.message || String(err))); }
  }
  betaOverlay.fortschritt(1);
  if(fehler.length) await betaOverlay.ergebnis('Aufrücken', '✗ ' + fehler.map(htmlEsc).join('<br>✗ '));
  betaOverlay.schliessen();
  if(!fehler.length) appToastAnzeigen(plan.length === 1 ? 'Rechnung ist aufgerückt.' : plan.length + ' Rechnungen sind aufgerückt.', 2500);
}

// ---------- Liste zeichnen (ersetzt die einfache Variante) ----------
function betaEintraegeBauen(c){
  const eintraege = [];
  if(!c || !c.ana) return eintraege;
  const dateien = c.dateien || new Map();
  const t = x=> String(x == null ? '' : x).trim();
  for(const z of c.ue.zeilen){
    if(z.nr < 2) continue;
    const v = z.v;
    if(!t(v[0]) && !t(v[5]) && !t(v[6])) continue;
    const renu = t(v[16]);
    const art = t(v[0]).toUpperCase() === 'L' ? 'ls' : 'pt';
    const name = t(v[5]) + ', ' + t(v[6]);
    const datum = xlDatumText(v[1]);
    const sort = xlDatumSerial(fpDatum(datum)) || 0;
    const u = t(v[20]);
    const basis = renu ? renuDateiname(renu) : '';
    const betrag = typeof v[15] === 'number' ? v[15].toFixed(2).replace('.', ',') : t(v[15]);
    const datei = (n)=> ({ pdf: dateien.get((n + '.pdf').toLowerCase()) || null, docx: dateien.get((n + '.docx').toLowerCase()) || null });
    eintraege.push({ key: z.nr + '|ORIG', typ: 'ORIG', z, renu, art, name, datum, sort, betrag, datei: basis || ('Zeile ' + z.nr), ...(basis ? datei(basis) : { pdf:null, docx:null }),
                     versendet: lxpFlagVorhanden(u, 'LXP:1'), geplant: lxpFlagVorhanden(u, 'LXP:1') ? versandGeplant(u, 'ORIG') : null,
                     bezahlt: xlDatumText(v[18]), abgeschickt: xlDatumText(v[17]) });
    if(!basis) continue;
    // fruehere verschickte Fassungen (beim Aendern einer verschickten Rechnung gesichert)
    [...dateien.entries()].filter(([k])=> k.startsWith((basis + '_verschickte Fassung ').toLowerCase()) && k.endsWith('.pdf'))
      .map(([, it])=> it).sort((a, b)=> String(a.name).localeCompare(String(b.name), 'de', { numeric: true }))
      .forEach((it, i)=>{
        const nm = String(it.name).replace(/\.pdf$/i, '');
        const m = /_verschickte Fassung (\d+)(?: \(([^)]*)\))?$/i.exec(nm);
        const n = m ? m[1] : String(i + 1);
        eintraege.push({ key: z.nr + '|FS' + n, typ: 'FS' + n, z, renu, art, name: name + ' (verschickte Fassung ' + n + (m && m[2] ? ' vom ' + m[2] : '') + ')',
                         datum, sort, betrag:'', datei: nm, pdf: it, docx: null, versendet: false, geplant: null, unter: true, fassung: true });
      });
    if(art === 'ls'){
      const d2 = datei(basis + '_2. Adresse');
      if(d2.pdf || d2.docx) eintraege.push({ key: z.nr + '|2A', typ: '2A', z, renu, art, name: name + ' (2. Adresse)', datum, sort, betrag:'', datei: basis + '_2. Adresse', ...d2, versendet: lxpFlagVorhanden(u, 'LXP:2A'), geplant: lxpFlagVorhanden(u, 'LXP:2A') ? versandGeplant(u, '2A') : null, unter: true });
    }
    for(let n = 1; n < 20; n++){
      let mname = basis + '_Erinnerung ' + n, dm = datei(mname);
      if(!dm.pdf && !dm.docx){ mname = basis + '_Mahnung ' + n; dm = datei(mname); }
      if(!dm.pdf && !dm.docx) break;
      eintraege.push({ key: z.nr + '|M' + n, typ: 'M' + n, z, renu, art, name: name + ' (' + n + '. Erinnerung)', datum, sort, betrag:'', datei: mname, ...dm, versendet: lxpFlagVorhanden(u, 'LXP:M' + n), geplant: lxpFlagVorhanden(u, 'LXP:M' + n) ? versandGeplant(u, 'M' + n) : null, unter: true });
    }
  }
  // neueste zuerst (Datum, dann Zeile), Unterpositionen bleiben unter ihrer Rechnung
  eintraege.sort((a, b)=> (b.sort - a.sort) || (b.z.nr - a.z.nr) || (a.unter ? 1 : 0) - (b.unter ? 1 : 0) || a.typ.localeCompare(b.typ));
  return eintraege;
}

function betaGesamtZeichnen(suchtext, ziel){
  const listeEl = document.getElementById('gesamtListe');
  if(!listeEl) return;
  const zk = betaZielKey(ziel);
  const c = betaGesamtCache || {};
  const ana = c.ana || null;
  const dateien = c.dateien || new Map();
  const such = String(suchtext || '').trim().toLowerCase();
  const passt = (name, renu)=> !such || String(name || '').toLowerCase().includes(such) || String(renu || '').toLowerCase().includes(such);

  // lokale Faelle: noch nicht hochgeladen? (wie bisher)
  const lokale = [];
  ['ls', 'pt'].forEach(art=> ladeFaelle(art).forEach((f, idx)=> f && lokale.push({ ...f, art, idx })));
  const zuZeile = new Map();
  const offen = [];
  const andereAblage = [];
  const nachtragen = [];
  lokale.forEach(f=>{
    // in der jeweils anderen Ablage (Testablage/Echtbetrieb) entstanden?
    const ablage = betaFallAblage(f);
    if(ablage && ablage !== zk){ if(!(f.hochgeladen && f.hochgeladen.ziel === zk)) { andereAblage.push(f); return; } }
    let zeile = null;
    if(ana){
      const r = (f.bezug && f.bezug.renu) || (f.hochgeladen && f.hochgeladen.renu) || f.rechnungsnummer || '';
      if(r) zeile = ana.nachRenu.get(r) || null;
      if(!zeile){
        const { nachname, vorname } = nameAufteilen((f.werte || {}).txtName);
        zeile = ana.nachFp.get(fpSchluessel(f.art === 'ls' ? 'L' : 'P', (f.werte || {}).txtDatumExcel, nachname, vorname, (f.werte || {}).txtGeda)) || null;
      }
    }
    const hochgeladenHier = f.hochgeladen && f.hochgeladen.ziel === zk && !f.uploadFehler;
    const q = zeile ? String(zeile.v[16] == null ? '' : zeile.v[16]).trim() : '';
    const zeileMitPdf = zeile && q && dateien.has(renuDateiname(q).toLowerCase() + '.pdf');
    if(zeile && (hochgeladenHier || zeileMitPdf)){
      if(!zuZeile.has(zeile.nr)) zuZeile.set(zeile.nr, f);
      // In der Uebersicht samt PDF gefunden, aber lokal nicht als hochgeladen
      // vermerkt: nachtragen, damit der Fall beim naechsten Laden nicht
      // wieder kurz unter "Noch nicht hochgeladen" erscheint
      if(!hochgeladenHier && zeileMitPdf) nachtragen.push({ art: f.art, zs: f.zeitstempel, renu: q });
    }
    else if(!ana && hochgeladenHier) { /* hochgeladen -- erscheint, sobald die Uebersicht geladen ist */ }
    else offen.push(f);
  });
  if(ana) betaLetzteOffenAnzahl = { zielKey: zk, n: offen.length };
  nachtragen.forEach(n=> betaFallAendern(n.art, n.zs, x=>{
    x.hochgeladen = { renu: n.renu, ziel: zk, am: new Date().toISOString() };
    if(!x.bezug) x.bezug = { renu: n.renu };
    if(!x.rechnungsnummer) x.rechnungsnummer = n.renu;
    delete x.uploadFehler;
  }));

  const knopf = document.getElementById('btnGesamtHochladen');
  if(knopf){
    knopf.style.display = offen.length && ana ? '' : 'none';
    knopf.textContent = '⬆ Alle hochladen (' + offen.length + ')';
    knopf.onclick = async ()=>{ await betaFaelleHochladen(offen); ansichtRechnungenGesamt(true); };
  }

  const eintraege = betaEintraegeBauen(c);
  const nachKey = new Map(eintraege.map(e=> [e.key, e]));
  // Auswahl bereinigen (nach Neuladen evtl. nicht mehr vorhanden)
  [...betaAuswahl].forEach(k=>{ if(!nachKey.has(k)) betaAuswahl.delete(k); });

  let html = '';
  // unfertige (noch nie gespeicherte) Rechnungen ganz oben
  const entwuerfe = betaEntwuerfe().filter(e=> passt((e.werte || {}).txtName, ''));
  if(entwuerfe.length){
    html += '<div class="gesamt-abschnitt">Unfertig</div>' + entwuerfe.map(e=>`
      <div class="wisch-huelle" data-entwurf="${htmlEsc(e.id)}"><div class="wisch-hinter">&#128465; Löschen</div>
      <div class="fall-zeile ${e.art} offen unfertig">
        <div class="inhalt">
          <div class="name"><span class="badge-neu ${e.art}">${e.art === 'ls' ? 'L' : 'P'}</span>${htmlEsc((e.werte || {}).txtName || '(noch ohne Namen)')}</div>
          <div class="info">${htmlEsc((e.werte || {}).txtDatumExcel || '')}${(e.werte || {}).txtBetrag ? ' &middot; ' + htmlEsc(e.werte.txtBetrag) + ' &euro;' : ''}</div>
          <div class="info offen-text">unfertig – antippen zum Weitermachen</div>
        </div>
      </div></div>`).join('');
  }
  const offenSichtbar = offen.filter(f=> passt((f.werte || {}).txtName, f.rechnungsnummer));
  if(offenSichtbar.length){
    html += '<div class="gesamt-abschnitt">Noch nicht hochgeladen</div>' + offenSichtbar.map(f=>`
      <div class="wisch-huelle" data-lokal="${f.art}:${htmlEsc(f.zeitstempel)}"><div class="wisch-hinter">&#128465; Löschen</div>
      <div class="fall-zeile ${f.art} offen">
        <div class="inhalt">
          <div class="name"><span class="badge-neu ${f.art}">${f.art === 'ls' ? 'L' : 'P'}</span>${htmlEsc((f.werte || {}).txtName || '(ohne Namen)')}</div>
          <div class="info">${htmlEsc((f.werte || {}).txtDatumExcel || '')}${f.rechnungsnummer ? ' &middot; Nr. ' + htmlEsc(f.rechnungsnummer) : ''}</div>
          <div class="info offen-text">${f.uploadFehler ? '⚠ ' + htmlEsc(f.uploadFehler) : (ana ? 'noch nicht hochgeladen' : (c.laedt ? 'Abgleich läuft …' : 'noch nicht hochgeladen'))}</div>
        </div>
        <div class="fall-icons"><span class="badge-hochladen" data-akt="hoch" title="Jetzt hochladen">&#11014;</span></div>
      </div></div>`).join('');
  }
  const andereSichtbar = andereAblage.filter(f=> passt((f.werte || {}).txtName, f.rechnungsnummer));
  if(andereSichtbar.length){
    html += '<div class="gesamt-abschnitt">' + (zk === 'echt' ? 'Alte Testfälle (frühere Testablage)' : 'Aus dem Echtbetrieb') + '</div>' + andereSichtbar.map(f=>`
      <div class="wisch-huelle" data-testfall="${f.art}:${htmlEsc(f.zeitstempel)}"><div class="wisch-hinter">&#128465; Löschen</div>
      <div class="fall-zeile ${f.art} andere-ablage">
        <div class="inhalt">
          <div class="name"><span class="badge-neu ${f.art}">${f.art === 'ls' ? 'L' : 'P'}</span>${htmlEsc((f.werte || {}).txtName || '(ohne Namen)')}</div>
          <div class="info">${htmlEsc((f.werte || {}).txtDatumExcel || '')}${f.rechnungsnummer ? ' &middot; Nr. ' + htmlEsc(f.rechnungsnummer) : ''}</div>
          <div class="info">${zk === 'echt' ? (f.ausUebersicht ? 'Bearbeitung aus der Test-Übersicht – nur löschen' : 'antippen: in die echte Übersicht übernehmen · wischen: löschen') : 'gehört zum Echtbetrieb'}</div>
        </div>
      </div></div>`).join('');
  }
  if(c.laedt){
    html += '<div class="leer-hinweis"><span class="beta-spinner klein"></span>Rechnungsübersicht wird geladen …' +
      '<div style="font-size:12px;opacity:.75;margin-top:4px;">' + htmlEsc(c.schritt || '') + ' <span id="gesamtLadeSek">' +
      (c.seit ? Math.round((Date.now() - c.seit) / 1000) + ' s' : '') + '</span></div></div>';
  } else if(c.fehler){
    html += '<div class="leer-hinweis">Rechnungsübersicht konnte nicht geladen werden: ' + htmlEsc(c.fehler) + '<br>„Neu laden“ versuchen.</div>';
  } else if(ana){
    // Treffer der Suche: Rechnung samt Unterpositionen
    const sichtbarZeilen = new Set(eintraege.filter(e=> e.typ === 'ORIG' && passt(e.name, e.renu)).map(e=> e.z.nr));
    const sichtbar = eintraege.filter(e=> sichtbarZeilen.has(e.z.nr));
    const MAX = 200;
    html += '<div class="gesamt-abschnitt">Rechnungsübersicht (' + eintraege.filter(e=> e.typ === 'ORIG').length + ')</div>';
    if(!sichtbar.length) html += '<div class="leer-hinweis">Keine Treffer.</div>';
    let letzteGruppe = null;
    sichtbar.slice(0, MAX).forEach(e=>{
      if(e.datum !== letzteGruppe){ letzteGruppe = e.datum; html += '<div class="gesamt-gruppe" data-gruppe="' + htmlEsc(e.datum) + '">' + htmlEsc(e.datum || 'ohne Datum') + '</div>'; }
      const symbol = e.pdf ? '<span class="badge-pdf" data-akt="pdf" title="PDF ansehen">&#128196;</span>'
                           : '<span class="badge-unvollstaendig" title="Keine PDF im Ordner">&#9888;</span>';
      html += `
      <div class="wisch-huelle${e.unter ? ' unter' : ''}" data-key="${htmlEsc(e.key)}"><div class="wisch-hinter">&#128465; Löschen</div>
      <div class="fall-zeile ${e.art}${e.pdf ? '' : ' unvollstaendig'}${e.unter ? ' unter' : ''}${betaAuswahl.has(e.key) ? ' gewaehlt' : ''}">
        <input type="checkbox" class="chk" ${betaAuswahl.has(e.key) ? 'checked' : ''}>
        <div class="inhalt">
          <div class="name">${e.unter ? '' : '<span class="badge-neu ' + e.art + '">' + (e.art === 'ls' ? 'L' : 'P') + '</span>'}${htmlEsc(e.name)}</div>
          <div class="info">${e.unter ? htmlEsc(e.datei) : (htmlEsc(e.datum) + (e.betrag ? ' &middot; ' + htmlEsc(e.betrag) + ' €' : '') + (e.renu ? ' &middot; Nr. ' + htmlEsc(e.renu) : ' &middot; ohne Rechnungsnummer'))}</div>
          ${e.geplant ? '<div class="info termin-text">Versand geplant am ' + htmlEsc(isoDe(e.geplant.datum)) + (e.geplant.modus === 'test' ? ' (Testmodus)' : '') + '</div>' : ''}
          ${!e.unter ? betaZahlungInfo(e) : ''}
        </div>
        <div class="fall-icons">${e.geplant ? '<span class="badge-termin" data-akt="termin" title="Versand geplant – antippen zum Ändern">&#9203;</span>' : (e.versendet ? BRIEF_SYMBOL : '')}${symbol}</div>
      </div></div>`;
    });
    if(sichtbar.length > MAX) html += '<div class="leer-hinweis">' + (sichtbar.length - MAX) + ' weitere – bitte Suche eingrenzen.</div>';
  }
  listeEl.innerHTML = html + '<div class="gesamt-platzhalter"></div>';

  // --- unfertige Rechnungen ---
  listeEl.querySelectorAll('.wisch-huelle[data-entwurf]').forEach(h=>{
    const id = h.dataset.entwurf;
    const zeileEl = h.querySelector('.fall-zeile');
    zeileEl.querySelector('.inhalt').onclick = ()=>{ const e = betaEntwuerfe().find(x=> x.id === id); if(e) betaEntwurfOeffnen(e, 'gesamt'); };
    betaWischen(zeileEl, async ()=>{
      const e = betaEntwuerfe().find(x=> x.id === id); if(!e) return false;
      if(!await betaFrage('Unfertige Rechnung „' + ((e.werte || {}).txtName || 'ohne Namen') + '“ verwerfen?', 'Verwerfen', 'Abbrechen')) return false;
      betaEntwurfEntfernen(id);
      appToastAnzeigen('Verworfen.', 1800);
      betaGesamtZeichnen(document.getElementById('txtGesamtSuche').value, ziel);
      return true;
    });
  });

  // --- alte Testfaelle (fruehere Testablage der Beta) ---
  listeEl.querySelectorAll('.wisch-huelle[data-testfall]').forEach(h=>{
    const art = h.dataset.testfall.split(':')[0], zs = h.dataset.testfall.slice(3);
    const zeileEl = h.querySelector('.fall-zeile');
    zeileEl.querySelector('.inhalt').onclick = async ()=>{
      const i = betaFallIndex(art, zs); if(i < 0) return;
      const f = ladeFaelle(art)[i];
      const name = (f.werte || {}).txtName || 'ohne Namen';
      if(f.ausUebersicht){ await betaOverlay.meldung('„' + name + '“ ist eine Bearbeitung aus der früheren Test-Übersicht und kann nur gelöscht werden (nach links wischen).', 'Alter Testfall'); return; }
      if(!await betaFrage('„' + name + '“ wurde in der früheren Testablage angelegt.\n\nIn die echte Rechnungsübersicht übernehmen? Er steht dann unter „Noch nicht hochgeladen“ und bekommt beim Hochladen eine echte Rechnungsnummer.', 'Übernehmen', 'Abbrechen')) return;
      betaFallAendern(art, zs, x=>{ x.ablage = 'echt'; delete x.hochgeladen; delete x.bezug; delete x.uploadFehler; delete x.rechnungsnummer; });
      appToastAnzeigen('Übernommen – jetzt unter „Noch nicht hochgeladen“.', 2600);
      betaGesamtZeichnen(document.getElementById('txtGesamtSuche').value, ziel);
    };
    betaWischen(zeileEl, async ()=>{
      const i = betaFallIndex(art, zs); if(i < 0) return false;
      const f = ladeFaelle(art)[i];
      if(!await betaFrage('Alten Testfall „' + ((f.werte || {}).txtName || 'ohne Namen') + '“ auf dem Handy löschen?', 'Löschen', 'Abbrechen')) return false;
      const arr = ladeFaelle(art); arr.splice(i, 1); speichereFaelle(art, arr);
      appToastAnzeigen('Gelöscht.', 1800);
      betaGesamtZeichnen(document.getElementById('txtGesamtSuche').value, ziel);
      return true;
    });
  });

  // --- lokale Faelle ---
  listeEl.querySelectorAll('.wisch-huelle[data-lokal]').forEach(h=>{
    const art = h.dataset.lokal.split(':')[0], zs = h.dataset.lokal.slice(3);
    const zeileEl = h.querySelector('.fall-zeile');
    zeileEl.querySelector('.inhalt').onclick = ()=>{ const i = betaFallIndex(art, zs); if(i >= 0){ betaMaskeHerkunft = 'gesamt'; ansichtMaske(art, i); } };
    const hochEl = zeileEl.querySelector('[data-akt="hoch"]');
    if(hochEl) hochEl.onclick = async (ev)=>{
      ev.stopPropagation();
      const i = betaFallIndex(art, zs); if(i < 0) return;
      await betaFaelleHochladen([{ ...ladeFaelle(art)[i], art, idx: i }]);
      ansichtRechnungenGesamt(true);
    };
    betaWischen(zeileEl, async ()=>{
      const i = betaFallIndex(art, zs); if(i < 0) return false;
      const f = ladeFaelle(art)[i];
      if(!await betaFrage('„' + ((f.werte || {}).txtName || 'ohne Namen') + '“ auf dem Handy löschen?\n\nBetrifft nur den noch nicht hochgeladenen Fall.', 'Löschen', 'Abbrechen')) return false;
      const arr = ladeFaelle(art); arr.splice(i, 1); speichereFaelle(art, arr);
      appToastAnzeigen('Gelöscht.', 1800);
      betaGesamtZeichnen(document.getElementById('txtGesamtSuche').value, ziel);
      return true;
    });
  });

  // --- Eintraege der Uebersicht ---
  const auswahlGeaendert = ()=>{ betaAktionsleisteAktualisieren(nachKey, ziel); };
  listeEl.querySelectorAll('.wisch-huelle[data-key]').forEach(h=>{
    const e = nachKey.get(h.dataset.key);
    const zeileEl = h.querySelector('.fall-zeile');
    const chk = zeileEl.querySelector('.chk');
    chk.onclick = (ev)=>{ ev.stopPropagation(); if(chk.checked) betaAuswahl.add(e.key); else betaAuswahl.delete(e.key); zeileEl.classList.toggle('gewaehlt', chk.checked); auswahlGeaendert(); };
    const pdfEl = zeileEl.querySelector('[data-akt="pdf"]');
    if(pdfEl) pdfEl.onclick = (ev)=>{ ev.stopPropagation(); betaPdfAnzeigen({ titel: e.datei, itemId: e.pdf.id, webUrl: e.pdf.webUrl }); };
    const terminEl = zeileEl.querySelector('[data-akt="termin"]');
    if(terminEl) terminEl.onclick = async (ev)=>{ ev.stopPropagation(); if(await betaTerminBearbeiten(e, ziel)) ansichtRechnungenGesamt(true); };
    zeileEl.querySelector('.inhalt').onclick = ()=>{
      if(e.typ === 'ORIG') betaZeileBearbeiten(e.z, zuZeile.get(e.z.nr), ziel);
      else if(e.pdf) betaPdfAnzeigen({ titel: e.datei, itemId: e.pdf.id, webUrl: e.pdf.webUrl });
    };
    betaWischen(zeileEl, async ()=>{
      const ok = await betaAktionLoeschen([e]);
      if(ok){ betaAuswahl.delete(e.key); ansichtRechnungenGesamt(true); }
      return ok;
    });
  });
  // Tages-Ueberschrift antippen: alle dieses Tages an-/abwaehlen (wie am PC)
  listeEl.querySelectorAll('.gesamt-gruppe').forEach(g=>{
    g.onclick = ()=>{
      const tag = eintraege.filter(e=> e.datum === g.dataset.gruppe && listeEl.querySelector('.wisch-huelle[data-key="' + CSS.escape(e.key) + '"]'));
      const alle = tag.every(e=> betaAuswahl.has(e.key));
      tag.forEach(e=>{ if(alle) betaAuswahl.delete(e.key); else betaAuswahl.add(e.key); });
      betaGesamtZeichnen(document.getElementById('txtGesamtSuche').value, ziel);
    };
  });
  auswahlGeaendert();
}

function betaAktionsleisteAktualisieren(nachKey, ziel){
  let leiste = document.getElementById('gesamtAktionen');
  const gewaehlt = [...betaAuswahl].map(k=> nachKey.get(k)).filter(Boolean);
  if(!document.getElementById('gesamtListe')){ if(leiste) leiste.remove(); return; }
  if(!leiste){
    leiste = document.createElement('div');
    leiste.id = 'gesamtAktionen';
    leiste.className = 'gesamt-aktionen';
    app.appendChild(leiste);
  }
  if(!gewaehlt.length){ leiste.classList.remove('aktiv'); return; }
  const orig = gewaehlt.filter(e=> e.typ === 'ORIG');
  const einOrig = gewaehlt.length === 1 && orig.length === 1;
  const kann = {
    senden: gewaehlt.some(e=> !e.versendet && !e.fassung),
    termin: gewaehlt.some(e=> !e.versendet && !e.fassung),
    adresse: einOrig && orig[0].art === 'ls' && !!orig[0].docx,
    mahnung: einOrig && !!orig[0].docx,
    bezahlt: orig.length > 0,
    frei: gewaehlt.some(e=> e.versendet && !e.fassung),
    weg: true
  };
  const k = (id, sym, label)=> `<button type="button" data-a="${id}" ${kann[id] ? '' : 'disabled'}><span class="sym">${sym}</span><span>${label}</span></button>`;
  leiste.innerHTML = `<div class="gesamt-aktionen-kopf"><span>${gewaehlt.length} ausgewählt</span><button type="button" data-a="leer">Auswahl aufheben</button></div>
    <div class="gesamt-aktionen-knoepfe">${k('senden', '&#9993;', 'Senden')}${k('termin', '&#8987;', 'Termin')}${k('adresse', '&#128205;', '2. Adresse')}${k('mahnung', '&#128231;', 'Erinnerung')}${k('bezahlt', '&#128182;', 'Bezahlt')}${k('frei', '&#128275;', 'Freigeben')}${k('weg', '&#128465;', 'Löschen')}</div>`;
  leiste.classList.add('aktiv');
  const fertig = async (veraendert)=>{ if(veraendert){ betaAuswahl.clear(); await ansichtRechnungenGesamt(true); } };
  leiste.querySelector('[data-a="leer"]').onclick = ()=>{ betaAuswahl.clear(); betaGesamtZeichnen(document.getElementById('txtGesamtSuche').value, ziel); };
  leiste.querySelector('[data-a="senden"]').onclick = async ()=> fertig(await betaAktionSenden(gewaehlt, false));
  leiste.querySelector('[data-a="termin"]').onclick = async ()=> fertig(await betaAktionSenden(gewaehlt, true));

const ENTWURF_SCHLUESSEL = 'entwuerfe';
let betaAktuellerEntwurf = null; // {art, id} der gerade offenen neuen Rechnung
function betaEntwuerfe(){ const a = LS.get(ENTWURF_SCHLUESSEL, []); return Array.isArray(a) ? a : []; }
function betaEntwurfSpeichern(e){ const a = betaEntwuerfe().filter(x=> x.id !== e.id); a.unshift(e); LS.set(ENTWURF_SCHLUESSEL, a); }

}
function betaEntwurfOeffnen(e, herkunft){

// Kachel "Leichenschau"/"Privatrechnung": unfertige fortsetzen oder neu?
async function betaNeueRechnung(art){

    betaOverlay.schliessen();
    if(akt === 'weiter'){ betaEntwurfOeffnen(e, null); return; }

// Aus ansichtMaske (neue Rechnung): laufend sichern
let betaEntwurfSichernAktuell = null;
function betaEntwurfVerdrahten(art, korrekturIdx, vorbelegt, holen, geaendert){
  betaEntwurfSichernAktuell = null;
  if(korrekturIdx !== undefined) return;
  let id = (vorbelegt && vorbelegt.entwurfId) || (betaAktuellerEntwurf && betaAktuellerEntwurf.art === art ? betaAktuellerEntwurf.id : null);
  if(!id) id = 'E' + Date.now().toString(36) + Math.floor(Math.random() * 1296).toString(36);
  betaAktuellerEntwurf = { art, id };
  const root = app.querySelector('.maske');
  if(!root) return;
  const sichern = ()=>{
    if(!root.isConnected || !betaAktuellerEntwurf || betaAktuellerEntwurf.id !== id) return false;
    const vorhanden = betaEntwuerfe().some(x=> x.id === id);
    const d = holen();
    if(!vorhanden && !geaendert() && !(d.positionen && d.positionen.size)) return false;
    betaEntwurfSpeichern({ id, art, werte: d.werte, positionen: d.positionen ? Array.from(d.positionen) : null,
      details: (d.positionen && d.positionen.details) || null, geaendert: new Date().toISOString() });
    return true;
  };
  let timer = null;
  const spaeter = ()=>{ clearTimeout(timer); timer = setTimeout(sichern, 400); };
  root.addEventListener('input', spaeter);
  root.addEventListener('change', spaeter);
  root.addEventListener('click', spaeter);
  betaEntwurfSichernAktuell = sichern;
  sichern();
}

(function(){
  const jetzt = ()=>{ try{ if(betaEntwurfSichernAktuell) betaEntwurfSichernAktuell(); }catch(_){} };
