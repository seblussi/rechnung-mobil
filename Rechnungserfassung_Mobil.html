    };
  }
  // 'nicht_verbunden' oder 'unbekannt' (siehe autoSyncInitialisieren) --
  // noch gar kein Sync eingerichtet: als Standard-Weg direkt den robusteren
  // OneDrive-Sync (Microsoft-Anmeldung) anstossen, statt zuerst den
  // Ordner-Auto-Sync anzubieten. Nur wenn OneDrive-Anmeldung technisch gar
  // nicht verfuegbar ist (z.B. MSAL konnte nicht laden), auf den
  // Ordner-Auto-Sync zurueckfallen.
  if(msGraphVerfuegbar()){
    return {
      klasse:'sync-rot', text:'Sync einrichten',
      unter:'Mit OneDrive anmelden',
      aktion: async ()=>{ await msGraphAnmelden(); } // Redirect -- Seite laedt danach neu
    };
  }
  return {
    klasse:'sync-rot', text:'Sync einrichten',
    unter:'Ordner auswählen',
    aktion: async ()=>{
      const ok = await autoSyncOrdnerWaehlen();
      appToastAnzeigen(ok ? 'Sync-Ordner verbunden -- Auto-Sync läuft.' : 'Kein Ordner ausgewählt.', 2200);
      ansichtStart();
    }
  };
}

function bestatterEintragen(name, adr1, adr2){
  if(!name || !name.trim()) return;
  const k = ladeKatalog();
  const existiert = k.some(b => b.name.trim().toLowerCase()===name.trim().toLowerCase()
                              && (b.adr1||'').trim().toLowerCase()===(adr1||'').trim().toLowerCase()
                              && (b.adr2||'').trim().toLowerCase()===(adr2||'').trim().toLowerCase());
  if(existiert) return;
  k.push({name:name.trim(), adr1:(adr1||'').trim(), adr2:(adr2||'').trim(), herkunft:'handy', zeitstempel:new Date().toISOString()});
  speichereKatalog(k);
}

/* ==========================================================
   Datum / Zeit Hilfsfunktionen
   ========================================================== */
function normalisiereDatum(eingabe){
  if(!eingabe) return '';
  let e = eingabe.trim().replace(/\//g,'.').replace(/-/g,'.').replace(/,/g,'.');
  // "12.12" o.ä. (nur Tag.Monat, kein Jahr angegeben) -> aktuelles Jahr
  // annehmen, statt die Eingabe komplett abzulehnen.
  if(/^\d{1,2}\.\d{1,2}\.?$/.test(e)){
    e = e.replace(/\.$/,'') + '.' + new Date().getFullYear();
  }
  const teile = e.split('.');
  if(teile.length !== 3) return '';
  let tag=parseInt(teile[0],10), monat=parseInt(teile[1],10), jahrStr=teile[2].trim();
  if(jahrStr.length!==2 && jahrStr.length!==4) return '';
  let jahr=parseInt(jahrStr,10);
  if(jahrStr.length===2) jahr = 1900+jahr;
  if(isNaN(tag)||isNaN(monat)||isNaN(jahr)) return '';
  if(monat<1||monat>12||tag<1||tag>31||jahr<1900) return '';
  const d = new Date(jahr, monat-1, tag);
  if(d.getFullYear()!==jahr || d.getMonth()!==monat-1 || d.getDate()!==tag) return '';
  return String(tag).padStart(2,'0')+'.'+String(monat).padStart(2,'0')+'.'+jahr;
}
function alsDatum(normDatum){ const t=normDatum.split('.'); return new Date(+t[2], +t[1]-1, +t[0]); }
function normalisiereZeit(eingabe){
  if(!eingabe) return '';
  let w = eingabe.trim().replace(/Uhr/gi,'').trim();
  if(w.indexOf(':')===-1) return '';
  const teile = w.split(':');
  if(teile.length!==2) return '';
  let h=parseInt(teile[0],10), m=parseInt(teile[1],10);
  if(isNaN(h)||isNaN(m)||h<0||h>23||m<0||m>59) return '';
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}
// Uhrzeit-Kurzeingabe ohne Doppelpunkt: "830" -> "8:30", "1430" -> "14:30",
// "8" -> "8:00". Wird beim Verlassen eines Uhrzeitfeldes VOR der
// Formatprüfung angewendet, damit normalisiereZeit() danach ganz normal
// greifen kann. Eingaben mit Doppelpunkt oder die keine reine Zahl sind
// bleiben unverändert (Prüfung/Fehlermeldung übernimmt normalisiereZeit()).
function zeitDoppelpunktErgaenzen(eingabe){
  if(!eingabe) return eingabe;
  const w = eingabe.trim();
  if(w.indexOf(':')!==-1) return w;
  const ohneUhr = w.replace(/Uhr/gi,'').trim();
  if(!/^\d+$/.test(ohneUhr)) return w;
  if(ohneUhr.length<=2) return ohneUhr+':00';
  if(ohneUhr.length===3) return ohneUhr.slice(0,1)+':'+ohneUhr.slice(1);
  if(ohneUhr.length===4) return ohneUhr.slice(0,2)+':'+ohneUhr.slice(2);
  return w;
}
function zeitInMinuten(hhmm){
  if(!hhmm) return -1;
  const t=hhmm.split(':'); if(t.length!==2) return -1;
  return (+t[0])*60+(+t[1]);
}
function heuteAlsText(){
  const d=new Date();
  return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear();
}
function istWochenende(normDatum){
  if(!normDatum) return false;
  const d = alsDatum(normDatum);
  return d.getDay()===0 || d.getDay()===6;
}
// Wie am PC (NaechsterWerktag): liefert den naechsten Werktag NACH dem
// uebergebenen (normalisierten) Datum als Text -- Werktag = Montag bis
// Freitag, Feiertage bewusst NICHT beruecksichtigt (haengen vom Bundesland
// ab, ggf. manuell im Feld korrigieren). Ohne Basisdatum wird von heute aus
// gerechnet.
function naechsterWerktagText(basisNormDatum){
  const d = basisNormDatum ? alsDatum(basisNormDatum) : new Date();
  d.setDate(d.getDate()+1);
  while(d.getDay()===0 || d.getDay()===6){ d.setDate(d.getDate()+1); }
  return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear();
}

// Datums-Kurzeingabe wie am PC gewünscht: eine reine Zahlenfolge ohne
// Punkte wird automatisch zu einem vollen Datum ergänzt.
// - 1-2 Ziffern ("26")      -> nur das Jahr wird gesetzt (2000+n, da eine
//   Kurzeingabe i.d.R. eine aktuelle Korrektur ist, z.B. am Rechnungs-
//   /Todesbescheinigungsdatum) -- Tag/Monat bleiben vom bisherigen Feldwert
//   bzw. von heute übernommen.
// - 4 Ziffern ("1212")      -> zuerst als TTMM (Tag+Monat, OHNE Jahr) mit
//   dem AKTUELLEN Jahr versucht ("1212" -> 12.12.<aktuelles Jahr>); ergibt
//   das kein gültiges Datum (z.B. "2026": Monat 26 wäre ungültig), wird wie
//   bisher nur das Jahr gesetzt (Tag/Monat vom bisherigen Feldwert/von
//   heute) -- so bleibt "2026" weiterhin eine reine Jahres-Korrektur.
// - 6 Ziffern ("010111")    -> TTMMJJ, wie eine normale Kurzeingabe mit
//   2-stelligem Jahr (1900+n, siehe normalisiereDatum -- typisch für
//   Geburtsdaten: "1.1.11" -> 01.01.1911).
// - 8 Ziffern ("01011911" bzw. "12122026") -> TTMMJJJJ.
// Eingaben MIT Punkten, aber ohne Jahr ("12.12"), bekommen ebenfalls das
// aktuelle Jahr (siehe normalisiereDatum). Eingaben MIT vollständigem Jahr
// laufen unverändert durch die normale normalisiereDatum()-Logik.
function datumKurzeingabeErgaenzen(eingabe, bisherigerWert){
  const roh = (eingabe||'').trim();
  if(!roh) return '';
  if(/^\d+$/.test(roh)) return ziffernfolgeAlsDatum(roh, bisherigerWert);
  // Erst ganz normal versuchen (z.B. "12.12", "1.1.2026" -- bereits
  // vollstaendig/korrekt mit Punkten eingegeben).
  const direkt = normalisiereDatum(roh);
  if(direkt) return direkt;
  // KORREKTUR: ein versehentlich VERGESSENER Punkt beim schnellen Tippen
  // (z.B. "0101.26" statt "01.01.26", oder "01.0126" statt "01.01.26")
  // fuehrte bisher zu einer Fehlermeldung, obwohl die Absicht eindeutig
  // war. Alle Punkte/Trennzeichen werden dafuer entfernt und die
  // verbleibende reine Ziffernfolge genau wie eine ganz ohne Punkte
  // eingegebene Kurzeingabe interpretiert (siehe ziffernfolgeAlsDatum).
  const nurZiffern = roh.replace(/[.\-\/\s]/g, '');
  if(/^\d+$/.test(nurZiffern) && nurZiffern.length>0) return ziffernfolgeAlsDatum(nurZiffern, bisherigerWert);
  return '';
}
// Reine Ziffernfolge (ohne jedes Trennzeichen) je nach Laenge als Datum
// interpretieren -- Kernlogik von datumKurzeingabeErgaenzen(), ausgelagert,
// damit sie auch beim nachtraeglichen Entfernen eines nur TEILWEISE
// vergessenen Punktes (s.o.) wiederverwendet werden kann.
function ziffernfolgeAlsDatum(roh, bisherigerWert){
  if(roh.length===1 || roh.length===2){
    const jahr = 2000+parseInt(roh,10);
    const basisNorm = normalisiereDatum(bisherigerWert) || heuteAlsText();
    const teile = basisNorm.split('.');
    return normalisiereDatum(teile[0]+'.'+teile[1]+'.'+jahr);
  }
  if(roh.length===4){
    const alsTagMonat = normalisiereDatum(roh.slice(0,2)+'.'+roh.slice(2,4));
    if(alsTagMonat) return alsTagMonat;
    const jahr = parseInt(roh,10);
    const basisNorm = normalisiereDatum(bisherigerWert) || heuteAlsText();
    const teile = basisNorm.split('.');
    return normalisiereDatum(teile[0]+'.'+teile[1]+'.'+jahr);
  }
  if(roh.length===6){
    return normalisiereDatum(roh.slice(0,2)+'.'+roh.slice(2,4)+'.'+roh.slice(4,6));
  }
  if(roh.length===8){
    return normalisiereDatum(roh.slice(0,2)+'.'+roh.slice(2,4)+'.'+roh.slice(4,8));
  }
  return '';
}

/* ==========================================================
   Feiertage Baden-Württemberg (für Zuschlag H, wie am PC:
   IstZuschlagstag = Wochenende ODER gesetzlicher Feiertag)
   ========================================================== */
function ostersonntag(jahr){
  // Gauss'sche Osterformel
  const a=jahr%19, b=Math.floor(jahr/100), c=jahr%100, d=Math.floor(b/4), e=b%4,
        f=Math.floor((b+8)/25), g=Math.floor((b-f+1)/3),
        h=(19*a+b-d-g+15)%30, i=Math.floor(c/4), k=c%4,
        l=(32+2*e+2*i-h-k)%7, m=Math.floor((a+11*h+22*l)/451),
        monat=Math.floor((h+l-7*m+114)/31), tag=((h+l-7*m+114)%31)+1;
  return new Date(jahr, monat-1, tag);
}
function tagePlus(d, n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function selberTag(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function istFeiertagBW(d){
  const jahr = d.getFullYear();
  const o = ostersonntag(jahr);
  const feste = [
    {d:new Date(jahr,0,1), n:'Neujahr'},
    {d:new Date(jahr,0,6), n:'Heilige Drei Könige'},

  ];
  const treffer = feste.find(f=>selberTag(f.d, d));
  return treffer ? treffer.n : '';
}
// Wie PC IstZuschlagstag(): Wochenende ODER Feiertag löst den H-Zuschlag
// aus. Gibt den Grund ("Samstag"/"Sonntag"/Feiertagsname) zurück, oder ''
// wenn kein Zuschlagstag.
function zuschlagstagGrund(normDatum){
  if(!normDatum) return '';
  const d = alsDatum(normDatum);
  const feiertag = istFeiertagBW(d);
  if(feiertag) return feiertag;
  const tag = d.getDay();
  if(tag===6) return 'Samstag';
  if(tag===0) return 'Sonntag';
  return '';
}

const STERBEZEIT_SCHLUESSELWOERTER = [
  "tod festgestellt","todeszeit","todeszeitpunkt","tod eingetreten","sterbezeit",
  "exitus letalis","exitus","ist verstorben","verstorben","todesfeststellung",
  "für tot erklärt","fuer tot erklaert","klinisch tot","reanimation ohne erfolg",
  "erfolglose reanimation","reanimation eingestellt","reanimationsmaßnahmen eingestellt",
  "reanimationsmassnahmen eingestellt","reanimationsmaßnahmen abgebrochen","reanimationsmaßnahmen beendet",
  "reanimation beendet","cpr erfolglos","cpr eingestellt","kein reanimationsversuch",
  "nicht reanimationspflichtig","keine reanimation","sichere todeszeichen","totenflecke",
  "livores","totenstarre","rigor mortis","leblos aufgefunden"
];
function sterbezeitAusFreitextErmitteln(volltext){
  if(!volltext) return {zeit:'', quelle:''};
  const textLower = volltext.toLowerCase();
  const zeitMuster = /(\d{1,2})[:.](\d{2})\s*uhr/i;
  for(const kw of STERBEZEIT_SCHLUESSELWOERTER){
    let pos = textLower.indexOf(kw);
    if(pos===-1) continue;
    const von = Math.max(0, pos-40);
    const bis = Math.min(volltext.length, pos+kw.length+40);
    const fenster = volltext.substring(von, bis);
    const treffer = fenster.match(zeitMuster);
    if(treffer){ return {zeit:treffer[1].padStart(2,'0')+':'+treffer[2], quelle:'Schlüsselwort "'+kw+'"'}; }
  }
  const fallback = volltext.match(/leblos aufgefunden um\s*(\d{1,2})[:.](\d{2})\s*uhr/i);
  if(fallback) return {zeit:fallback[1].padStart(2,'0')+':'+fallback[2], quelle:'"leblos aufgefunden um..."'};
  return {zeit:'', quelle:''};
}
function feldAusNachrichtLesen(zeilen, praefix){
  for(const z of zeilen){
    const t = z.trim();
    if(t.toLowerCase().startsWith(praefix.toLowerCase())) return t.substring(praefix.length).trim();
  }
  return '';
}
function grossKleinNormalisieren(s){
  if(!s) return '';
  // Grossschreibung nach jedem Leerzeichen UND nach jedem Bindestrich
  // (z.B. "Baden-baden" -> "Baden-Baden", "Müller-schmidt" -> "Müller-Schmidt"),
  // damit zusammengesetzte Orts-/Namensteile korrekt behandelt werden.
  const grossNachTrenner = (wort) => wort.split('-').map(teil =>
    teil.length ? teil[0].toUpperCase()+teil.substring(1).toLowerCase() : teil
  ).join('-');
  return s.split(' ').map(w => grossNachTrenner(w)).join(' ');
}
// Zerlegt eine als EINE Zeile kopierte Adresse (z.B. aus Google Maps: "Musterstraße 12, 77656 Offenburg"
// oder mit angehängtem Land "Musterstraße 12, 77656 Offenburg, Deutschland") in Straße+Hausnummer und
// PLZ+Ort -- fürs direkte Einlesen ins Bestatter-Adressfeldpaar, ohne die Zeile von Hand aufzutrennen.
function adressZeileTrennen(text){
  if(!text) return null;
  const teile = text.trim().replace(/\n/g,', ').split(',').map(s=>s.trim()).filter(Boolean);
  if(teile.length<2) return null;
  // Ein evtl. angehängtes Land (kein Bestandteil, der Ziffern enthält -- eine
  // PLZ hat immer Ziffern) am Ende verwerfen.
  if(teile.length>=3 && !/\d/.test(teile[teile.length-1])) teile.pop();
  if(teile.length<2) return null;
  return {strasse: teile[0], plzOrt: teile.slice(1).join(', ')};
}
// Eigener Hinweis-Platz direkt unter dem "Aus Zwischenablage einlesen"-Button
// statt des allgemeinen Hinweisbanners ganz unten in der Maske -- eine
// Meldung wie "Zwischenablage ist leer" bezieht sich ja unmittelbar auf den
// gerade angeklickten Button und soll auch genau dort sichtbar sein, ohne
// dass die Maske dafuer nach unten scrollt.
function zwischenablageHinweisAnzeigen(text){
  const el = document.getElementById('zwischenablageHinweis');
  if(!el) return;
  if(!text){ el.classList.remove('aktiv'); el.innerHTML=''; return; }
  el.innerHTML = text;
  el.classList.add('aktiv');
}
async function ausZwischenablageEinlesen(art, ctx){
  zwischenablageHinweisAnzeigen('');
  let text = '';
  try{ text = await navigator.clipboard.readText(); }
  catch(e){ zwischenablageHinweisAnzeigen('Zwischenablage konnte nicht gelesen werden. Bitte Berechtigung erteilen oder Text manuell einfügen.'); return; }
  if(!text || !text.trim()){ zwischenablageHinweisAnzeigen('Die Zwischenablage ist leer.'); return; }

  const zeilen = text.split(/\r?\n/);
  const patient = feldAusNachrichtLesen(zeilen, 'Patient:');
  const geb = feldAusNachrichtLesen(zeilen, 'Geb:');
  const ort = feldAusNachrichtLesen(zeilen, 'Ort:');
  const strasse = feldAusNachrichtLesen(zeilen, 'Strasse:') || feldAusNachrichtLesen(zeilen, 'Straße:');

  if(patient) ctx.setValue('txtName', grossKleinNormalisieren(patient));
  if(geb) ctx.setValue('txtGeda', geb);
  if(strasse) ctx.setValue('txtPAdresse1', grossKleinNormalisieren(strasse));
  if(ort) ctx.setValue('txtPAdresse2', grossKleinNormalisieren(ort));

  if(art==='ls'){
    const erg = sterbezeitAusFreitextErmitteln(text);
    if(erg.zeit){
      ctx.setValue('txtTodeszeit', erg.zeit);
      zwischenablageHinweisAnzeigen('Sterbezeitpunkt '+erg.zeit+' automatisch erkannt (Quelle: '+erg.quelle+'). Bitte prüfen.');
    } else {
      zwischenablageHinweisAnzeigen('Kein Sterbezeitpunkt im Text erkannt -- bitte manuell eintragen.');
    }
  }
  // Wichtig: nach dem Einlesen läuft die VOLLSTÄNDIGE Plausibilitätsprüfung,
  // nicht nur die feldweise -- Werte wurden ja programmatisch gesetzt und
  // haben daher kein einzelnes "Feld verlassen"-Ereignis ausgelöst.
  ctx.allePruefungenAusfuehren();
  if(strasse && ort) ctx.adresseVerlassen();
}

async function geocode(adresse){
  const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(adresse);
  const res = await fetch(url, {headers:{'Accept':'application/json'}});
  const data = await res.json();
  if(!data || !data.length) return null;
  return {lat:parseFloat(data[0].lat), lon:parseFloat(data[0].lon)};
}
// PLZ/Ort-Erkennung analog zur PC-Funktion PlzErgaenzen() in
// PT_UserFormRechnung.frm: extrahiert eine 5-stellige PLZ aus einem Text,
// ermittelt fehlenden Ort zu einer PLZ bzw. fehlende PLZ zu einem Ort per
// Geocoding, und prüft bei vorhandenen beiden Werten per Kreuzvalidierung,
// ob PLZ und Ort tatsächlich zusammenpassen.
function plzAusText(text){
  const m = (text||'').match(/\b(\d{5})\b/);
  return m ? m[1] : '';
}
// Rueckgabe bewusst dreiwertig: ein gefundener String, '' bei einer
// erfolgreichen Anfrage OHNE Treffer (Adresse/Ort existiert laut
// Kartendienst schlicht nicht), oder null, wenn die Anfrage selbst
// fehlgeschlagen ist (Netzwerkfehler -- meist fehlendes Internet, z.B.
// beim Hausbesuch ohne Empfang). plzOrtPruefen() unterscheidet danach im
// Hinweistext zwischen "nicht gefunden" und "vermutlich kein Internet".
async function ortErmitteln(plz){
  try{
    const url = 'https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=1&country=Germany&postalcode='+encodeURIComponent(plz);
    const res = await fetch(url, {headers:{'Accept':'application/json'}});
    const data = await res.json();
    if(!data || !data.length) return '';
    const a = data[0].address || {};
    return a.city || a.town || a.village || a.municipality || a.city_district || '';
  }catch(e){ return null; }
}
async function plzErmitteln(adresse){

// Kurzer, gut lesbarer Zusatzsatz für die Hinweistexte unten -- kombiniert
// den eigentlichen Fehlschlag (Netzwerkanfrage fehlgeschlagen) mit dem
// zusätzlichen Signal von navigator.onLine, damit die Vermutung "kein
// Internet" nicht bei jedem einzelnen fehlgeschlagenen Request pauschal
// behauptet wird, sondern nur wenn beides dafür spricht bzw. der Browser
// selbst meldet, offline zu sein.
function keinInternetHinweisText(){
  return (typeof navigator!=='undefined' && navigator.onLine===false)
    ? ' Es scheint aktuell keine Internetverbindung zu bestehen.'
    : ' Vermutlich ist gerade keine Internetverbindung vorhanden (oder der Kartendienst ist nicht erreichbar).';
}
async function routeKm(start, ziel){
  const url = `https://router.project-osrm.org/route/v1/driving/${start.lon},${start.lat};${ziel.lon},${ziel.lat}?overview=false`;
  const res = await fetch(url);
  const data = await res.json();
  if(!data.routes || !data.routes.length) return null;
  return data.routes[0].distance/1000;
}
// Analog zur PC-Funktion RoutenErmitteln: liefert mehrere Routenalternativen
// (falls der Routendienst welche findet) statt nur der einen besten Route,
// jeweils als Einfachstrecke in km + Fahrzeit in Minuten.
async function routeAlternativen(start, ziel){
  const url = `https://router.project-osrm.org/route/v1/driving/${start.lon},${start.lat};${ziel.lon},${ziel.lat}?overview=false&alternatives=true`;
  const res = await fetch(url);
  const data = await res.json();
  if(!data.routes || !data.routes.length) return [];
  return data.routes.map(r=>({km:r.distance/1000, minuten:r.duration/60}));
}
// Luftlinie (Haversine) -- EINFACHE Strecke, bewusst nicht verdoppelt
// (analog zur PC-Logik: kmFahrstrecke wird fuer Hin+Rueck verdoppelt,
// kmLuftlinieEinfach bleibt die reine Einfachstrecke).
function kmLuftlinieEinfach(a, b){
  const R=6371;
  const dLat=(b.lat-a.lat)*Math.PI/180, dLon=(b.lon-a.lon)*Math.PI/180;
  const x = Math.sin(dLat/2)**2 + Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
}
// Entscheidet Reiseentschaedigung vs. Wegegeld -- analog SollReiseGelten()
// am PC: Standard = Fahrstrecke (Hin+Rueck) > 50 km; Einstellung
// "Reiseentschaedigung nach Luftlinie priorisieren" schaltet stattdessen
// auf Luftlinie (Einfachstrecke) > 25 km um.
function sollReiseGelten(kmFahrstreckeGesamt, kmLuftlinie){
  const e = ladeEinstellungen();
  if(e.reiseBasisLuftlinie) return kmLuftlinie > 25;
  return kmFahrstreckeGesamt > 50;
}

/* Ermittelt die automatisch vorzuschlagenden Positionen (Grundleistung +
   Zeit-Zuschlag + Reiseentschädigung ODER passendes Wegegeld -- nie beides,
   siehe sollReiseGelten) -- der Rest bleibt manuelle Auswahl, genau wie am
   PC ("Rechnungspositionen prüfen"). */
// modus (optional, 1:1 wie am PC WegegeldZifferBestimmen):
//   ''           -- automatisch, die 50-km-Regel (sollReiseGelten) entscheidet
//   'REISE'      -- Nutzer hat bewusst eine Fahrstrecke-Kachel als
//                    Reiseentschädigung gewählt (Alternativrouten) -- gilt
//                    IMMER als Reiseentschädigung, unabhängig von den km
//   'LUFTLINIE'  -- Nutzer hat bewusst die Luftlinie-Kachel gewählt -- die
//                    50-km-Automatik wird dabei bewusst ÜBERSPRUNGEN, auch
//                    bei einer Luftlinie >25 km greift dann NICHT automatisch
//                    die Reiseentschädigung, sondern weiterhin die oberste
//                    Wegegeld-Staffel (WT25/WN25) -- exakt wie am PC.
function automatischeAuswahl(katalog, datum, zeit, kmFahrstreckeGesamt, kmLuftlinie, modus){
  const ausgewaehlt = new Set();
  (katalog.grundleistung||[]).forEach(p=>{ if(p.standard) ausgewaehlt.add(p.ziffer); });

  const normDatum = normalisiereDatum(datum);
  const normZeit = normalisiereZeit(zeit);
  // Wie am PC (ZeitZuschlagBestimmen + IstZuschlagstag): F/G aus der Uhrzeit
  // UND H aus Wochenende/Feiertag koennen GLEICHZEITIG gelten -- H schliesst
  // F/G also NICHT aus (anders als zuvor in dieser Datei).
  if(normZeit){
    const min = zeitInMinuten(normZeit);
    if((min>=20*60 && min<22*60) || (min>=6*60 && min<8*60)) ausgewaehlt.add('F');
    else if(min>=22*60 || min<6*60) ausgewaehlt.add('G');
  }
  if(zuschlagstagGrund(normDatum)) ausgewaehlt.add('H');

  const fahrVal = parseFloat((kmFahrstreckeGesamt||'').toString().replace(',','.'));
  const luftVal = parseFloat((kmLuftlinie||'').toString().replace(',','.'));

  if(modus==='REISE'){
    // Wie am PC: bewusst erzwungen, unabhängig von den km (solange > 0).
    if(!isNaN(fahrVal) && fahrVal>0) ausgewaehlt.add('REISE');
    return ausgewaehlt;
  }

  // BUGFIX (exakt wie am PC, WegegeldZifferBestimmen): im Luftlinie-Modus
  // entscheidet AUSSCHLIESSLICH die Luftlinie (einfache Strecke) -- eine
  // (noch) unbekannte Fahrstrecke wird dafuer nicht gebraucht. Vorher hing
  // die GESAMTE Wegegeld-Ermittlung an "if(fahrVal>0)", wodurch eine manuell
  // eingetippte ODER per Alternativrouten gewaehlte Luftlinie ganz ohne
  // WT/WN blieb, sobald txtKmFahrstrecke (noch) leer war (z.B. bei manueller
  // Eingabe ohne vorherige automatische Routenberechnung).
  if(modus==='LUFTLINIE'){
    if(isNaN(luftVal) || luftVal<=0 || !normZeit) return ausgewaehlt;
    const min = zeitInMinuten(normZeit);
    const nacht = !(min>=7*60 && min<19*60);
    const tabelle = nacht ? WEGEGELD_NACHT : WEGEGELD_TAG;
    const bucket = tabelle.find(w => luftVal <= w.bisKm) || tabelle[tabelle.length-1];
    ausgewaehlt.add(bucket.ziffer);
    return ausgewaehlt;
  }

  if(!isNaN(fahrVal) && fahrVal>0){
    // Luftlinie (Einfachstrecke) fehlt evtl., wenn km manuell eingetragen
    // wurden statt per Routenberechnung -- als Schaetzung dann die HALBE
    // Fahrstrecke (Hin+Rück) verwenden, NICHT die volle. Das war zuvor der
    // Bug, der dazu führte, dass praktisch immer WT25/WN25 (letzte Staffel)
    // gewählt wurde, da die volle (verdoppelte) Strecke fast immer über der
    // 25-km-Einfachstrecken-Schwelle lag.
    const luftEinfach = isNaN(luftVal) ? fahrVal/2 : luftVal;
    if(sollReiseGelten(fahrVal, luftEinfach)){
      ausgewaehlt.add('REISE');
    } else if(normZeit){
      // Tag/Nacht-Staffel wie am PC (WegegeldZifferBestimmen): Tag =
      // 07:00-18:59, Nacht = 19:00-06:59 -- eigenstaendige Grenze, NICHT
      // identisch mit der F/G-Zeitzuschlag-Grenze (20/6 Uhr).
      const min = zeitInMinuten(normZeit);
      const nacht = !(min>=7*60 && min<19*60);
      const tabelle = nacht ? WEGEGELD_NACHT : WEGEGELD_TAG;
      const bucket = tabelle.find(w => luftEinfach <= w.bisKm) || tabelle[tabelle.length-1];
      ausgewaehlt.add(bucket.ziffer);
    }
  }
  return ausgewaehlt;
}

/* ==========================================================
   ICD-10-GM Diagnose-Suche (repliziert die PC-Logik aus PT_UserFormRechnung:
   Suche ab 2 Zeichen, Treffer ueberall im Eintrag "Beschreibung [Code]",
   sortiert nach Fundposition, dann alphabetisch, max. 200 Treffer)
   ========================================================== */
function icdEintragBauen(code, txt){
  if(txt && code) return txt+' ['+code+']';
  return txt || code || '';
}
function icdSuchen(suchtext){
  const katalog = (typeof ICD_KATALOG!=='undefined') ? ICD_KATALOG : [];
  const such = (suchtext||'').trim();
  if(such.length<2 || !katalog.length) return [];
  const suchLower = such.toLowerCase();
  const treffer = [];
  for(let i=0;i<katalog.length;i++){
    const eintrag = icdEintragBauen(katalog[i][0], katalog[i][1]);
    const pos = eintrag.toLowerCase().indexOf(suchLower);
    if(pos>=0) treffer.push({eintrag, pos});
  }
  treffer.sort((a,b)=> a.pos-b.pos || a.eintrag.localeCompare(b.eintrag,'de'));
  return treffer.slice(0,200).map(t=>t.eintrag);
}

function allePositionenFlach(katalog){
  return [
    ...(katalog.grundleistung||[]),
    ...ZUSCHLAEGE_ZEIT,
    ...WEGEGELD_TAG, ...WEGEGELD_NACHT,
    {ziffer:'REISE', bez:REISEENTSCHAEDIGUNG.bez, betrag:REISEENTSCHAEDIGUNG.betrag}
  ];
}

// Werkzeug (Start -> "Apotheken-Notdienst"): ermittelt den aktuellen
// GPS-Standort, wandelt ihn per Nominatim-Reverse-Geocoding in PLZ+Ort um
// und oeffnet damit DIREKT die Ergebnisseite der aponet.de-Umkreissuche
// (URL-Muster "https://www.aponet.de/notdienstsuche/<PLZ>-<Ort>", von
// aponet.de selbst so verlinkt -- zeigt sofort die Notdienst-Apotheken im
// Umkreis, kein manuelles Eintippen von PLZ/Ort mehr noetig). Schlaegt die
// Standort- oder Adressermittlung fehl (kein GPS, Berechtigung verweigert,
// kein Internet), wird ersatzweise die normale aponet.de-Notdienstsuche
// geoeffnet, in der PLZ/Ort dann wie gewohnt manuell eingegeben werden
// koennen -- das Werkzeug bleibt so in jedem Fall nutzbar. ALLE Hinweise
// dazu laufen ueber den bestehenden Toast (appToastAnzeigen), NIE ueber ein
// natives confirm()/alert() (siehe Vorgabe: keine nativen Popups in der
// Handy-App).
async function notapothekenSucheOeffnen(){
  const APONET_SUCHE = 'https://www.aponet.de/apotheke/notdienstsuche';
  const btn = document.getElementById('btnNotapotheke');
  const btnTextOriginal = btn ? btn.innerHTML : '';
  const zuruecksetzen = ()=>{ if(btn){ btn.disabled = false; btn.innerHTML = btnTextOriginal; } };

  if(!('geolocation' in navigator)){
    appToastAnzeigen('Standortermittlung wird von diesem Gerät/Browser nicht unterstützt -- aponet.de wird zum manuellen Suchen geöffnet.', 3200);
    window.open(APONET_SUCHE, '_blank');
    return;
  }

  if(btn){
    btn.disabled = true;
    btn.innerHTML = 'Standort wird ermittelt…<span class="unter">Bitte kurz warten</span>';
  }

  navigator.geolocation.getCurrentPosition(async (pos)=>{
    try{
      const {latitude, longitude} = pos.coords;
      const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}&zoom=18&addressdetails=1`;
      const res = await fetch(url, {headers:{'Accept':'application/json'}});
      const data = await res.json();
      const a = (data && data.address) || {};
      const plz = a.postcode;
      // Nominatim liefert bei manchen Orten den amtlichen Doppelnamen mit
      // Schraegstrich (z.B. "Lahr/Schwarzwald") -- fuer die aponet.de-URL
      // wird bewusst nur der eigentliche Ortsname VOR dem "/" verwendet
      // (bestaetigt funktionierendes URL-Muster, z.B. ".../77933-Lahr" statt
      // eines fehlerhaften verschachtelten Pfads ".../77933-Lahr/Schwarzwald").
      // Verbleibende Leerzeichen (mehrteilige Ortsnamen) werden zu Bindestrich.
      const ortRoh = a.city || a.town || a.village || a.municipality || a.city_district || '';
      const ort = ortRoh.split('/')[0].trim().replace(/\s+/g,'-');
      // Strasse+Hausnummer: aponet.de bietet dafuer zwar ein Verfeinerungs-
      // Feld ("Straße und Hausnummer") auf der Ergebnisseite, aber KEIN
      // bestaetigtes, zuverlaessiges URL-Parameter dafuer -- ein geratener
      // Parameter koennte die Suche unbemerkt verfaelschen statt sie zu
      // praezisieren. Stattdessen wird die Adresse in die Zwischenablage
      // kopiert, damit sie auf der geoeffneten Seite bei Bedarf direkt in
      // genau dieses Feld eingefuegt werden kann.
      const strasse = [a.road, a.house_number].filter(Boolean).join(' ');
      if(plz && ort){
        window.open(`https://www.aponet.de/notdienstsuche/${encodeURIComponent(plz)}-${encodeURIComponent(ort)}`, '_blank');
        if(strasse){
          try{
            await navigator.clipboard.writeText(strasse);
            appToastAnzeigen(`"${strasse}" wurde in die Zwischenablage kopiert -- für eine genauere Umkreissuche auf aponet.de bei "Straße und Hausnummer" einfügen.`, 4200);
          }catch(e){ /* Zwischenablage optional -- PLZ/Ort-Suche ist bereits geoeffnet */ }
        }
      } else {
        appToastAnzeigen('Standort konnte keiner eindeutigen PLZ/Ort zugeordnet werden -- aponet.de wird zum manuellen Suchen geöffnet.', 3200);
        window.open(APONET_SUCHE, '_blank');
      }
    }catch(e){
      appToastAnzeigen('PLZ/Ort zum Standort konnte nicht ermittelt werden (vermutlich kein Internet) -- aponet.de wird zum manuellen Suchen geöffnet.', 3200);
      window.open(APONET_SUCHE, '_blank');
    }finally{
      zuruecksetzen();
    }
  }, (err)=>{
    const verweigert = err && err.code === err.PERMISSION_DENIED;
    appToastAnzeigen(verweigert
      ? 'Standortzugriff wurde verweigert -- aponet.de wird zum manuellen Suchen geöffnet.'
      : 'Standort konnte nicht ermittelt werden -- aponet.de wird zum manuellen Suchen geöffnet.', 3200);
    window.open(APONET_SUCHE, '_blank');
    zuruecksetzen();

  document.getElementById('btnLuftZwischenablage').onclick = async ()=>{

      let zeile2;
      // Wie bei "Alternativrouten"/der automatischen km-Berechnung: die

      // grobe Schaetzung) ueber denselben Routendienst (OSRM) ermitteln --

      // wird (routeAlternativen liefert die Einfachstrecke je Route).
      try{
        const routen = await routeAlternativen(start, ziel);

        <div class="luft-ergebnis-zeile">${zeile2}</div>`, false);
    }catch(err){
      zeigeErgebnis('Berechnung fehlgeschlagen.'+keinInternetHinweisText(), true);
    }
  };
}

// Teilt "txtName" in Nachname/Vorname auf -- 1:1 wie am PC
// (RechnungErstellen_Click): ENTHÄLT der Name ein Komma, gilt das Format
// "Nachname, Vorname" (Teil vor dem Komma = Nachname). Ohne Komma gilt am
// PC stattdessen "Vorname Nachname" (natürliche Reihenfolge!) -- erstes
// leerzeichengetrenntes Wort = Vorname, LETZTES Wort = Nachname (ein
// mehrteiliger Nachname ohne Komma wie "Otto von Bismarck" würde am PC
// genauso nur "Otto" als Vorname und "Bismarck" als Nachname erkennen).
function nameAufteilen(cName){
  const name = (cName||'').trim();
  if(!name) return {nachname:'', vorname:''};
  if(name.indexOf(',')>=0){
    const teile = name.split(',');
    return {nachname:(teile[0]||'').trim(), vorname:(teile[1]||'').trim()};
  }
  const teile = name.split(' ').filter(Boolean);
  if(teile.length<2) return {nachname:'', vorname:''};
  return {vorname:teile[0], nachname:teile[teile.length-1]};
}

// Liefert die Diagnosen einer Privatrechnung als ICD-Kuerzel mit G/V-
// Kennzeichnung, EXAKT wie DiagnosenKuerzel() in PT_UserFormRechnung.frm am
// PC, z.B. "[I50.9;G], [J44.9;V]" -- der volle Diagnosetext steht nur im
// Word-Dokument, hier zaehlt nur das ICD-Kuerzel. Ein Diagnosetext aus dem
// ICD-Katalog endet immer auf " [CODE]" (siehe icdEintragBauen) -- genau wie
// am PC wird bei Freitext ohne eckige Klammern der gesamte Text als "Code"
// uebernommen (dieselbe bewusste Rueckfalllogik wie in DiagnosenKuerzel).
function diagnosenKuerzel(diagnosen){
  return (diagnosen||[]).map(d=>{
    const t = d.text||'';
    const p2 = t.lastIndexOf(']');
    const p1 = t.lastIndexOf('[');
    let code = (p1>=0 && p2>p1) ? t.slice(p1+1, p2) : t;
    const fl = d.flags||'';
    if(fl.indexOf('G')>=0) code += ';G';
    if(fl.indexOf('V')>=0) code += ';V';
    return '['+code+']';
  }).join(', ');
}

// Baut aus einem Fall EINE tab-getrennte Zeile im Format der Excel-
// Rechnungsübersicht (vom Nutzer bestätigte Spaltenreihenfolge A..Y),
// damit sie sich direkt in Excel einfügen laesst (Excel/Sheets trennen
// beim Einfuegen automatisch an Tabs in eigene Zellen).
// Spalte Q (Rechnungsnummer) wird -- sofern in den Einstellungen ein
// Zaehler-Abgleich hinterlegt ist -- bereits hier exakt nach PC-Schema
// vergeben (siehe rechnungsnummerBerechnen). Spalte U (Rechnungspositionen +
// km, siehe unten) wird ebenfalls schon hier befuellt. Die uebrigen Spalten
// R,S,T,V..Y (Brief/Zahlung/Mahnwesen) werden am PC beim eigentlichen
// Rechnungserstellen/-versenden gepflegt und bleiben daher bewusst leer --
// ebenso alle Sterbeort-/Bestatter-Spalten bei einer Privatrechnung (PT), da
// es dort begrifflich keinen Sterbeort/Bestatter gibt.
function faelleAlsUebersichtsZeilen(faelle){
  return faelle.map(f=>{
    const w = f.werte;
    const spalten = new Array(25).fill(''); // A..Y
    const {nachname, vorname} = nameAufteilen(w.txtName);
    spalten[0] = f.art==='ls' ? 'L' : 'P';                          // A: L/P
    spalten[1] = w.txtDatumExcel || '';                              // B: Datum LS/HB
    spalten[2] = w.txtZeitLS || '';                                  // C: Uhrzeit LS/HB
    spalten[5] = nachname;                                           // F: Name
    spalten[6] = vorname;                                            // G: Vorname
    spalten[7] = w.txtGeda || '';                                    // H: Geburtsdatum
    spalten[8] = w.txtPAdresse1 || '';                                // I: Adresse1 Patient
    spalten[9] = w.txtPAdresse2 || '';                                // J: Adresse2 Patient
    if(f.art==='ls'){
      spalten[3] = w.txtSterbedatum || '';                           // D: Datum Tod
      spalten[4] = w.txtTodeszeit || '';                             // E: Uhrzeit Tod
      // Sterbeort: wie am PC (AktiverAdressBlock) gilt bei ausgefuelltem
      // "Sterbeort abweichend"-Block DIESER als Sterbeort. Ist der Block
      // NICHT ausgefuellt, ist der Sterbeort per Definition derselbe wie
      // die Patientenadresse -- genau wie am PC steht dafuer aber NICHT
      // die Adresse nochmal ausgeschrieben in der Spalte, sondern wörtlich
      // "idem" (Adresse1 UND Adresse2), unabhängig davon, ob die
      // Patientenadresse selbst ausgefuellt ist.
      spalten[10] = w.txtSterbeAdr1 || 'idem';                        // K: Adresse1 Sterbeort
      spalten[11] = w.txtSterbeAdr2 || 'idem';                        // L: Adresse2 Sterbeort
      spalten[12] = w.txtBName || '';                                 // M: Bestatter
      spalten[13] = w.txtAdresse1 || '';                              // N: Adresse1 Bestatter
      spalten[14] = w.txtAdresse2 || '';                              // O: Adresse2 Bestatter
    }
    // KORREKTUR: Spalte M bleibt bei einer Privatrechnung LEER -- das echte
    // PC-seitige Zurueckschreiben in die Uebersicht (SchreibeInUebersicht in
    // Modul1, beim Absenden-Klick) schreibt dort NICHTS hinein, das ICD-
    // Kuerzel steht bereits vollstaendig in Spalte U (siehe spalten[20]
    // unten). Vorher stand hier zusaetzlich/faelschlich das ICD-Kuerzel,
    // das von der echten Rechnungserstellung nie ueberschrieben wurde und
    // so als falscher Eintrag in der Uebersicht stehen blieb.
    const diagKuerzel = f.art==='pt' ? diagnosenKuerzel(w.diagnosen) : '';
    spalten[15] = w.txtBetrag || '';                                  // P: Betrag
    spalten[16] = f.rechnungsnummer || '';                            // Q: Rechnungsnummer
    // Spalte U: Rechnungspositionen + km, EXAKT im Format von SpalteUBauen()
    // am PC ("POS:<Ziffer1,Ziffer2,...> | KM:<kmWert>" [+ " | ICD:<Kuerzel>"
    // bei PT], Modul1 LS/PT) -- wird dort normalerweise erst beim
    // tatsaechlichen Rechnungserstellen aus dem Blattzustand gebaut, hier
    // stattdessen direkt aus den am Handy gewaehlten Positionen
    // (f.positionen), dem km-Feld und (bei PT) den Diagnosen. Dadurch kann
    // die Excel-Rechnungserstellung (UserFormRechnung) beim Öffnen
    // automatisch "Rechnungspositionen aus Spalte U wiederherstellen" (siehe
    // dortiger Kommentar) -- am PC muss nichts davon nochmal manuell
    // eingetragen werden. SpalteUZerlegen() sucht nur "POS:"/"KM:"/"ICD:"
    // jeweils bis zum naechsten "|" -- ein spaeter von der HTA angehaengtes
    // "| LXP:..."-Flag (LxpFlagSetzen, ebenfalls Spalte U) stoert das nicht.
    spalten[20] = 'POS:'+(f.positionen||[]).join(',')+' | KM:'+(w.txtKm||'0')
      + (diagKuerzel ? ' | ICD:'+diagKuerzel : '');                   // U: Rechnungspositionen + km (+ ICD bei PT)
    // R,S,T,V..Y: bewusst leer, siehe Kommentar oben.
    return spalten.join('\t');
  }).join('\n');
}

// Vergibt für alle übergebenen Fälle, die noch keine Rechnungsnummer
// besitzen, eine neue -- exakt nach PC-Schema und mit lokal fortgeführtem
// Zaehler (siehe rechnungsnummerBerechnen/rnZaehlerAusRenu). Bereits
// vergebene Nummern (z.B. bei erneutem Kopieren desselben Falls) werden
// nie überschrieben, damit keine Dopplungen/Lücken in der Übersicht
// entstehen. Persistiert die vergebenen Nummern zurück in den jeweiligen
// Fall (ls/pt) sowie den erhöhten Zaehler in den Einstellungen.
// Gibt zurück, wie viele Fälle KEINE Nummer erhalten konnten (weil noch
// kein Zaehler-Abgleich in den Einstellungen hinterlegt ist).
function rechnungsnummernVergeben(faelleAusw){
  const e = ladeEinstellungen();
  let zaehler = e.rnNaechsterZaehler;
  let ohneNummer = 0;
  const faelleNachArt = {ls: ladeFaelle('ls'), pt: ladeFaelle('pt')};
  let geaendert = {ls:false, pt:false};
  faelleAusw.forEach(f=>{
    if(f.rechnungsnummer){ return; } // bereits vergeben, nicht erneut vergeben
    if(!zaehler){ ohneNummer++; return; }
    const {nachname, vorname} = nameAufteilen(f.werte.txtName);
    const datumNorm = normalisiereDatum(f.werte.txtDatumExcel);
    const nummer = rechnungsnummerBerechnen(nachname, vorname, datumNorm, zaehler);
    if(!nummer){ ohneNummer++; return; }
    f.rechnungsnummer = nummer;
    faelleNachArt[f.art][f.idx].rechnungsnummer = nummer;
    geaendert[f.art] = true;
    zaehler++;
  });
  if(geaendert.ls) speichereFaelle('ls', faelleNachArt.ls);
  if(geaendert.pt) speichereFaelle('pt', faelleNachArt.pt);
  if(zaehler !== e.rnNaechsterZaehler){
    e.rnNaechsterZaehler = zaehler;
    speichereEinstellungen(e);
  }
  return ohneNummer;
}

    const faelleAusw = alle.filter(f=> ausgewaehlt.has(schluessel(f)));
    if(!faelleAusw.length) return;
    zeigeHinweis(`${faelleAusw.length} Rechnung(en) wirklich unwiderruflich löschen? Dies betrifft nur die lokal auf dem Handy gespeicherten Daten, nicht bereits am PC übernommene Rechnungen.
      <div class="aktionen">
        <button data-akt="loeschenJa">Ja, löschen</button>
        <button data-akt="loeschenNein">Abbrechen</button>
      </div>`);
    const el = document.getElementById('korrigierenHinweis');
    el.querySelector('[data-akt="loeschenNein"]').onclick = ()=> zeigeHinweis('');
    el.querySelector('[data-akt="loeschenJa"]').onclick = ()=>{
      // Je Art absteigend nach idx loeschen, damit sich beim Loeschen
      // mehrerer Eintraege einer Art die Indizes der noch zu loeschenden
      // nicht verschieben (analog BriefeZeilenLoeschen am PC).
      ['ls','pt'].forEach(art=>{
        const idxListe = faelleAusw.filter(f=>f.art===art).map(f=>f.idx).sort((a,b)=>b-a);
        if(!idxListe.length) return;
        const arr = ladeFaelle(art);
        idxListe.forEach(i=> arr.splice(i,1));
        speichereFaelle(art, arr);
      });
      appToastAnzeigen(`${faelleAusw.length} Rechnung(en) gelöscht.`, 2000);
      ansichtKorrigieren();
    };
  };

  auswahlAktualisieren();

  // Automatischer Abgleich: Faelle, die per PC-Sync (One-Click-Import,
  // Fingerabdruck-Abgleich) laengst in die Rechnungsuebersicht uebernommen
  // wurden, haben hier lokal nichts mehr verloren -- sie "rutschen" in die
  // Rechnungsverwaltung und werden aus "Lokale Rechnungen" automatisch
  // entfernt. Bewusst NICHT blockierend vor dem ersten Rendern (Liste ist
  // sofort da); der Abgleich laeuft im Hintergrund nach und rendert bei
  // Treffern neu. Nur wenn Microsoft/OneDrive-Sync aktiv ist -- ohne
  // Anmeldung gibt es keine Datenquelle dafuer.
  if(msGraphStatus==='angemeldet') lokaleFaelleBereitsUebernommenEntfernen(alle);
}

// Prueft fuer alle uebergebenen (lokalen) Faelle per Graph-API/Fingerabdruck,
// ob sie bereits in der Rechnungsuebersicht stehen (exakt dieselbe Logik wie
// beim Einlesen "Aus Handy einlesen" am PC) -- und entfernt Treffer aus dem
// lokalen Speicher: sobald ein Fall am PC uebernommen wurde, gehoert er in
// die Rechnungsverwaltung (dort ist er per Definition schon vorhanden;
// Vollstaendigkeit/rote Markierung wird dort, nicht hier, angezeigt), nicht
// mehr in "Lokale Rechnungen". Analog zum Loeschen ueber "Ausgewaehlte
// loeschen": je Art absteigend nach idx loeschen, damit sich Indizes der
// noch zu loeschenden Eintraege nicht verschieben.
async function lokaleFaelleBereitsUebernommenEntfernen(alle){
  const map = await msGraphUebersichtFingerprintsLaden();
  if(!map) return; // kein Login/kein Netz/Fehler -- lokale Liste bleibt unveraendert

  const uebernommen = alle.filter(f=> map.has(fallFingerprintBauen(f)));
  if(!uebernommen.length) return;

  ['ls','pt'].forEach(art=>{
    const idxListe = uebernommen.filter(f=>f.art===art).map(f=>f.idx).sort((a,b)=>b-a);
    if(!idxListe.length) return;
    const arr = ladeFaelle(art);
    idxListe.forEach(i=> arr.splice(i,1));
    speichereFaelle(art, arr);
  });

  appToastAnzeigen(`${uebernommen.length} Rechnung(en) wurden bereits am PC übernommen und sind jetzt in der Rechnungsverwaltung zu finden.`, 3000);
  // Nur neu rendern, wenn diese Ansicht (inzwischen) noch aktiv ist -- ein
  // schneller Wegklick waehrend die Graph-Antwort noch unterwegs war soll
  // nicht versehentlich eine andere, laengst geoeffnete Ansicht ueberschreiben.
  if(document.getElementById('korrigierenListe')) ansichtKorrigieren();
}

// Eigenstaendige Ansicht (Start -> "Rechnungsverwaltung"): zeigt WIRKLICH
// jede Zeile der Excel-Rechnungsuebersicht per Graph-API, unabhaengig davon,
// ob der Fall lokal auf dem Handy gespeichert ist -- im Unterschied zur
// "Lokale Rechnungen"-Liste (ansichtKorrigieren), die nur lokal gespeicherte,
// noch nicht am PC uebernommene Faelle zeigt (und deren Eintraege nach
// erfolgtem PC-Sync automatisch von dort verschwinden). Bewusst rein lesend
// (kein Bearbeiten): nur Suchen/Filtern und PDFs oeffnen -- siehe
// Begruendung im Kommentar bei msGraphAlleZeilenLaden weiter oben. PDF-
// Links werden erst beim Antippen einer Zeile nachgeladen, nicht vorab
// fuer die ganze (potenziell lange) Liste -- Ausnahme: fuer ein begrenztes
// Fenster der zuletzt hinzugekommenen Zeilen wird die PDF-Pruefung eager
// vorgezogen, um unvollstaendige (von der stillen Erzeugung am PC
// uebersprungene) Faelle zeitnah rot zu markieren, ohne bei einer langen
// Liste auf einen Schlag hunderte Graph-Anfragen abzufeuern.
let alleRechnungenCache = null; // pro App-Sitzung gecacht, "Neu laden" erzwingt Refresh
async function ansichtAlleRechnungen(){
  vorbereiteRuecksprung = ()=>{ ruecksprungAusEinstellungen = ()=>ansichtAlleRechnungen(); };
  setzeTitel('Rechnungsverwaltung', ansichtStart);
  app.innerHTML = `
    <div class="feld" style="margin-bottom:6px;">
      <input type="text" id="txtAlleSuche" autocomplete="off" placeholder="Suche: Name oder Rechnungsnummer">
    </div>
    <button class="btn-sekundaer" id="btnAlleNeuLaden" style="margin-bottom:12px;">Neu laden</button>
    <div id="alleRechnungenListe"><div class="leer-hinweis">Lade Rechnungsübersicht...</div></div>`;

  const suchfeld = document.getElementById('txtAlleSuche');
  suchfeld.oninput = ()=> alleRechnungenListeRendern(alleRechnungenCache, suchfeld.value);
  document.getElementById('btnAlleNeuLaden').onclick = async ()=>{
    document.getElementById('alleRechnungenListe').innerHTML = '<div class="leer-hinweis">Lade Rechnungsübersicht...</div>';
    alleRechnungenCache = await msGraphAlleZeilenLaden();
    alleRechnungenListeRendern(alleRechnungenCache, suchfeld.value);
  };

  if(!alleRechnungenCache) alleRechnungenCache = await msGraphAlleZeilenLaden();
  alleRechnungenListeRendern(alleRechnungenCache, suchfeld.value);
}

function alleRechnungenListeRendern(liste, suchtext){
  const zielEl = document.getElementById('alleRechnungenListe');
  if(!zielEl) return;
  if(liste === null){
    zielEl.innerHTML = '<div class="leer-hinweis">Rechnungsübersicht konnte nicht geladen werden (kein Netz oder nicht angemeldet). Bitte "Neu laden" versuchen.</div>';
    return;
  }
  const suche = (suchtext||'').trim().toLowerCase();
  const gefiltert = suche ? liste.filter(f=>
    (f.nachname+' '+f.vorname).toLowerCase().includes(suche) || f.renu.toLowerCase().includes(suche)
  ) : liste;

  if(!gefiltert.length){
    zielEl.innerHTML = '<div class="leer-hinweis">Keine Treffer.</div>';
    return;
  }
  // Lange Listen nicht komplett auf einmal rendern -- erste 150 Treffer,
  // Rest durch Eingrenzen der Suche statt endlosem Scrollen erreichbar.
  const MAX_ANZEIGE = 150;
  const anzuzeigen = gefiltert.slice(0, MAX_ANZEIGE);

  zielEl.innerHTML = anzuzeigen.map((f,i)=>`
    <div class="fall-zeile ${f.art==='L'?'ls':'pt'}" data-i="${i}">
      <div class="inhalt">
        <div class="name"><span class="badge-neu ${f.art==='L'?'ls':'pt'}">${f.art==='L'?'L':'P'}</span>${f.nachname}, ${f.vorname}</div>
        <div class="info">${f.datum || ''}${f.betrag ? ' &middot; ' + f.betrag + ' €' : ''}${f.renu ? ' &middot; Nr. ' + f.renu : ' &middot; ohne Rechnungsnummer'}</div>
      </div>
      <div class="fall-icons">${f.versandt ? '<span class="badge-brief" title="Rechnung wurde bereits versendet">&#9993;</span>' : ''}<span class="pdf-platz"></span></div>
    </div>`).join('') +
    (gefiltert.length > MAX_ANZEIGE ? `<div class="leer-hinweis">${gefiltert.length - MAX_ANZEIGE} weitere Treffer -- bitte Suche eingrenzen.</div>` : '');

  // "unvollstaendig" markieren (roter Name + rotes Warnsymbol rechts): der
  // Fall wurde von der stillen Erzeugung am PC (gStillModus, Modul1.bas)
  // noch NICHT zu einer fertigen Rechnung gemacht -- entweder weil noch
  // keine Rechnungsnummer gezogen wurde (Spalte Q leer, ohne Renu ist keine
  // Erzeugung moeglich), oder weil trotz Renu noch kein passendes PDF im
  // Zielordner liegt (uebersprungener Fall: Pflichtfeld/Datum/Betrag/Jahr
  // etc. -- siehe StillFallUebersprungen). Korrektur wie gewohnt manuell
  // ueber "Rechnung korrigieren" am PC. Bewusst nur ein Icon statt Text --
  // passend zu den anderen, groesseren Symbolen rechts in der Zeile.
  const alsUnvollstaendigMarkieren = (el)=>{
    el.classList.add('unvollstaendig');
    const platz = el.querySelector('.pdf-platz');
    platz.innerHTML = '<span class="badge-unvollstaendig" title="Noch nicht als Rechnung erzeugt -- bitte am PC über &quot;Rechnung korrigieren&quot; prüfen und ergänzen.">&#9888;</span>';
  };

  // Eager-Fenster: fuer die ersten paar sichtbaren Zeilen wird der PDF-Status
  // sofort mitgeladen (statt erst beim Antippen), damit unvollstaendige
  // Faelle zeitnah rot auffallen -- ohne bei einer langen Liste auf einen
  // Schlag hunderte Graph-Anfragen abzufeuern. Darueber hinaus bleibt es
  // beim bewaehrten lazy Laden per Antippen.
  const EAGER_FENSTER = 40;

  zielEl.querySelectorAll('.fall-zeile').forEach(el=>{
    const i = parseInt(el.dataset.i,10);
    const f = anzuzeigen[i];
    if(!f.renu){
      // Ohne Rechnungsnummer sicher noch kein PDF vorhanden -- sofort rot.
      alsUnvollstaendigMarkieren(el);
      return;
    }
    el.style.cursor = 'pointer';
    el.onclick = async ()=>{
      const platz = el.querySelector('.pdf-platz');
      if(el.dataset.geladen === '1'){
        if(el.dataset.url) window.open(el.dataset.url, '_blank');
        return;
      }
      platz.innerHTML = ' <span style="font-size:12px; color:var(--text-schwach);">lädt…</span>';
      const url = await msGraphPdfWebUrlLaden(f.renu);
      el.dataset.geladen = '1';
      if(url){
        el.dataset.url = url;
        platz.innerHTML = '<span class="badge-pdf" title="Rechnung als PDF ansehen">&#128196;</span>';
        window.open(url, '_blank');
      } else {
        el.classList.remove('unvollstaendig');
        alsUnvollstaendigMarkieren(el);
      }
    };

    if(i < EAGER_FENSTER){
      msGraphPdfWebUrlLaden(f.renu).then(url=>{
        el.dataset.geladen = '1';
        if(url){
          el.dataset.url = url;
          const pdfBadge = document.createElement('span');
          pdfBadge.className = 'badge-pdf';
          pdfBadge.title = 'Rechnung als PDF ansehen';
          pdfBadge.innerHTML = '&#128196;';
          el.querySelector('.pdf-platz').appendChild(pdfBadge);
        } else {
          alsUnvollstaendigMarkieren(el);
        }
      });
    }
  });
}

// Baut die Export-Daten (Fälle + vom Handy neu angelegte Bestatter) --
// gemeinsame Grundlage sowohl für den manuellen Export-Button als auch für
// den automatischen Ordner-Sync unten.
function exportDatenBauen(){
  return {faelle: [...ladeFaelle('ls').map(f=>({...f,art:'ls'})), ...ladeFaelle('pt').map(f=>({...f,art:'pt'}))],
          bestatterAenderungen: ladeKatalog().filter(b=>b.herkunft==='handy')};
}
// KORREKTUR (mehrfach durchprobiert, auf Nutzerwunsch zurückgebaut):
// Sowohl das "Speichern unter"-Fenster bei JEDEM Export (showSaveFilePicker)
// als auch ein einmalig gewählter, dauerhaft gespeicherter Export-Ordner
// (showDirectoryPicker + getFileHandle(...,{create:true}) + createWritable())
// wurden ausprobiert, um das "immer neue Datei mit fortlaufender Zahl statt
// Überschreiben"-Problem zu lösen -- auf dem tatsächlich genutzten Gerät
// überschreibt aber KEINE der beiden Varianten zuverlässig (vermutlich eine
// Android/Storage-Access-Framework-Eigenheit). Beide brachten also nur einen
// zusätzlichen Dialog ohne echten Nutzen. Der manuelle Export ist deshalb
// wieder auf die einfache, direkte Rückfallebene zurückgebaut:
//  1) Ist der Auto-Sync-Ordner bereits verbunden (Weg A, siehe unten -- DER
//     funktioniert zuverlässig, weil er nicht bei jedem Export neu
//     nachfragt), wird die Export-Datei einfach zusätzlich dort abgelegt.
//  2) Sonst: natives Teilen-Menü, sonst klassischer Download -- dort kann
//     das Duplikat-Verhalten (fortlaufende Zahl) je nach Gerät weiterhin
//     auftreten, mangels besserer, tatsächlich funktionierender Alternative.
//     Der zuverlässige Weg dagegen bleibt der Auto-Sync.
const EXPORT_DATEINAME = 'rechnungserfassung_export.json';
async function jsonExport(){
  const daten = exportDatenBauen();
  const inhalt = JSON.stringify(daten,null,2);

  if(autoSyncStatus==='verbunden' && autoSyncOrdnerHandle){
    try{
      const dateiHandle = await autoSyncOrdnerHandle.getFileHandle(EXPORT_DATEINAME, {create:true});
      const schreibbar = await dateiHandle.createWritable();
      await schreibbar.write(inhalt);
      await schreibbar.close();
      appToastAnzeigen('Export im Sync-Ordner gespeichert ("'+EXPORT_DATEINAME+'").', 2500);
      return;
    }catch(e){
      // Berechtigung zwischenzeitlich entzogen o.ä. -- normal weiter unten
      // versuchen (eigener Export-Ordner bzw. Rückfallebene).
    }
  }

  // KORREKTUR (auf Nutzerwunsch zurückgebaut): der Ordner-Auswahl-Dialog
  // (showDirectoryPicker) sollte das seit Anfang an bekannte
  // "immer neue Datei mit fortlaufender Zahl statt Überschreiben"-Problem
  // lösen -- tut es auf dem tatsächlich genutzten Gerät aber nachweislich
  // NICHT (vermutlich eine Android/Storage-Access-Framework-Eigenheit, die
  // auch einen "echten" Ordner-Handle beim Schreiben wie einen Download
  // behandelt). Der zusätzliche Dialog brachte also nur eine weitere
  // Bestätigung ohne jeden Nutzen -- daher wieder die einfache, direkte
  // Rückfallebene ohne Ordnerauswahl: natives Teilen-Menü, sonst klassischer
  // Download. Das bereits bekannte Duplikat-Verhalten (fortlaufende Zahl)
  // kann dabei mangels besserer, tatsächlich funktionierender Alternative
  // auf diesem Gerät weiterhin auftreten -- der zuverlässige Weg dagegen
  // bleibt der oben bereits vorhandene Auto-Sync ("Weg A").
  const blob = new Blob([inhalt], {type:'application/json'});
  const datei = new File([blob], EXPORT_DATEINAME, {type:'application/json'});
  if(navigator.canShare && navigator.canShare({files:[datei]})){
    try{
      await navigator.share({files:[datei], title:'Rechnungserfassung Export'});
      return;
    }catch(e){
      // Abgebrochen oder fehlgeschlagen -- auf normalen Download zurückfallen.
    }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = EXPORT_DATEINAME;
  a.click();
}

// Gegenstück zu exportDatenBauen()/jsonExport(): liest eine zuvor mit
// "Fälle für den PC exportieren" (oder dem Auto-Sync) erzeugte JSON-Datei
// wieder ein -- z.B. wenn nach dem Löschen des Browser-/App-Caches die
// lokal gespeicherten, noch nicht am PC übernommenen Fälle verloren gingen.
// Bewusst als MERGE statt Überschreiben umgesetzt: bereits lokal
// vorhandene Fälle (gleicher Inhalt UND gleicher Zeitstempel) werden nicht
// doppelt angelegt, damit ein erneutes/versehentliches Einlesen derselben
// Datei nichts kaputt macht. Vom Handy neu angelegte Bestatter werden über
// die bereits vorhandene Dubletten-Prüfung (bestatterEintragen) ergänzt.
// Gibt {geaendert, html} zurück -- html ist der inline anzuzeigende
// Hinweistext (KEIN natives alert/confirm, wie an anderer Stelle bereits
// festgelegt).
function jsonImportVerarbeiten(text){
  let daten;
  try{ daten = JSON.parse(text); }
  catch(e){ return {geaendert:false, html:'Die Datei enthält kein gültiges JSON und konnte nicht eingelesen werden.'}; }

  if(!daten || !Array.isArray(daten.faelle)){
    return {geaendert:false, html:'Die Datei enthält keine erkennbaren Fälle (erwartetes Format: Export aus "Fälle für den PC exportieren").'};
  }

  const bestand = {ls: ladeFaelle('ls'), pt: ladeFaelle('pt')};
  const schluesselVorhanden = {
    ls: new Set(bestand.ls.map(f=> JSON.stringify([f.werte, f.zeitstempel]))),
    pt: new Set(bestand.pt.map(f=> JSON.stringify([f.werte, f.zeitstempel])))
  };

  let importiert = {ls:0, pt:0}, uebersprungen = 0, ungueltig = 0;
  daten.faelle.forEach(eintrag=>{
    const art = eintrag && (eintrag.art==='ls' || eintrag.art==='pt') ? eintrag.art : null;
    if(!art || !eintrag.werte){ ungueltig++; return; }
    const schluessel = JSON.stringify([eintrag.werte, eintrag.zeitstempel]);
    if(schluesselVorhanden[art].has(schluessel)){ uebersprungen++; return; }
    const neu = {
      werte: eintrag.werte,
      positionen: Array.isArray(eintrag.positionen) ? eintrag.positionen : [],
      zeitstempel: eintrag.zeitstempel || new Date().toISOString()
    };
    if(eintrag.rechnungsnummer) neu.rechnungsnummer = eintrag.rechnungsnummer;
    bestand[art].push(neu);
    schluesselVorhanden[art].add(schluessel);
    importiert[art]++;
  });

  let bestatterNeu = 0;
  if(Array.isArray(daten.bestatterAenderungen)){
    const vorherAnzahl = ladeKatalog().length;
    daten.bestatterAenderungen.forEach(b=>{
      if(b && b.name) bestatterEintragen(b.name, b.adr1, b.adr2);
    });
    bestatterNeu = ladeKatalog().length - vorherAnzahl;
  }

  const gesamtImportiert = importiert.ls + importiert.pt;
  if(gesamtImportiert>0){
    speichereFaelle('ls', bestand.ls);
    speichereFaelle('pt', bestand.pt);
  }

  if(gesamtImportiert===0 && bestatterNeu===0){
    return {geaendert:false, html: uebersprungen>0
      ? `Alle ${uebersprungen} Fälle aus der Datei sind bereits lokal vorhanden -- nichts zu importieren.`
      : (ungueltig>0 ? `Die Datei enthält ${ungueltig} nicht erkennbare Einträge und keine gültigen Fälle.` : 'Die Datei enthält keine Fälle.')};
  }

  let html = `${gesamtImportiert} Fall/Fälle importiert (LS: ${importiert.ls}, PT: ${importiert.pt})`;
  if(uebersprungen>0) html += `, ${uebersprungen} bereits vorhanden (übersprungen)`;
  if(bestatterNeu>0) html += `, ${bestatterNeu} Bestatter aus der Datei übernommen`;
  if(ungueltig>0) html += `, ${ungueltig} Einträge ungültig/übersprungen`;
  html += '.';
  return {geaendert:true, html};
}

/* ==========================================================
   Automatischer Ordner-Sync ("Weg A", siehe Besprechung) -- File System
   Access API: einmalig den OneDrive-Sync-Ordner auswählen, danach wird bei
   JEDER Änderung (jedes Speichern eines Falls, jeder neue Bestatter)
   automatisch dieselbe Datei "rechnungserfassung_sync.json" überschrieben.
   Dadurch: kein manueller Klick mehr nötig, keine mehrfachen Export-
   Dateien/Duplikate, und selbst bei leerem Akku geht höchstens der letzte,
   noch nicht geschriebene Vorgang verloren (nicht der ganze Tag).
   Nicht auf jedem Gerät/Browser unterstützt (v.a. auf manchen Android-
   Chrome-Versionen) -- dann bleibt der manuelle Export-Button die
   Rückfallebene (siehe autoSyncVerfuegbar()).
   ========================================================== */
let autoSyncOrdnerHandle = null;
// 'unbekannt' (direkt nach Laden, bevor autoSyncInitialisieren fertig ist),
// 'nicht_unterstuetzt', 'nicht_verbunden', 'verbunden', 'berechtigung_fehlt'
let autoSyncStatus = 'unbekannt';
let autoSyncSchreibtGerade = false;
let autoSyncErneutNoetig = false;

function fileSystemAccessVerfuegbar(){
  return typeof window.showDirectoryPicker === 'function';
}

/* ==========================================================
   OneDrive-Anmeldung (Microsoft/MSAL) -- perspektivisch als robusterer
   Ersatz/Ergaenzung zu den fest hinterlegten Freigabelinks in
   excelDateiOeffnen(): mit einem gueltigen Zugriffstoken kann die App
   ueber die Microsoft-Graph-API die AKTUELL im jeweiligen OneDrive-Pfad
   liegende Datei auflösen, statt sich auf einen an eine feste Datei-ID
   gebundenen Freigabelink zu verlassen (siehe die Besprechung zum
   "falscher/veralteter Freigabelink"-Problem). Diese erste Ausbaustufe
   kuemmert sich nur um die Anmeldung selbst (Login/Logout, Status-
   Anzeige in den Einstellungen) -- die eigentliche Datei-Aufloesung ueber
   Graph folgt als naechster Schritt, sobald die Anmeldung bestaetigt
   nachweisbar funktioniert.
   ========================================================== */
// Nur PERSOENLICHE Microsoft-Konten (siehe Kontotyp-Auswahl bei der
// Azure-App-Registrierung) -- deshalb "consumers" statt "common"/"organizations".
const MSGRAPH_CLIENT_ID = '579a39e0-b7fd-4c46-8684-af22e1bc45a2';
const MSGRAPH_AUTHORITY = 'https://login.microsoftonline.com/consumers';
// Muss ZEICHENGENAU mit dem in Azure (Authentifizierung -> SPA-Plattform)
// hinterlegten Redirect-URI uebereinstimmen.
const MSGRAPH_REDIRECT_URI = 'https://seblussi.github.io/rechnung-mobil/Rechnungserfassung_Mobil.html';
const MSGRAPH_SCOPES = ['Files.ReadWrite', 'offline_access', 'User.Read'];

let msGraphMsal = null;
// 'unbekannt' (direkt nach Laden, bevor msGraphInitialisieren fertig ist),
// 'nicht_verfuegbar' (MSAL-Bibliothek konnte nicht geladen werden, z.B.
// kein Netz), 'abgemeldet', 'angemeldet'
let msGraphStatus = 'unbekannt';
let msGraphKonto = null; // {name, username} des angemeldeten Kontos

function msGraphVerfuegbar(){
  return typeof msal !== 'undefined';
}

// Legt (einmalig) die MSAL-Instanz an. Getrennt von msGraphInitialisieren,
// damit sowohl der normale Start als auch die Rueckkehr vom Microsoft-
// Login-Redirect dieselbe, garantiert bereits initialisierte Instanz nutzen.
async function msGraphInstanzSicherstellen(){
  if(msGraphMsal) return msGraphMsal;
  if(!msGraphVerfuegbar()) return null;
  msGraphMsal = new msal.PublicClientApplication({
    auth: {
      clientId: MSGRAPH_CLIENT_ID,
      authority: MSGRAPH_AUTHORITY,
      redirectUri: MSGRAPH_REDIRECT_URI
    },
    cache: { cacheLocation: 'localStorage' }
  });
  await msGraphMsal.initialize();
  return msGraphMsal;
}

// Beim Start (bzw. direkt nach Rueckkehr vom Microsoft-Login) pruefen, ob
// bereits ein Konto im lokalen Cache steht (bzw. der Redirect gerade ein
// neues eingetragen hat) -- KEIN automatischer Login-Versuch ohne
// Nutzer-Geste, das entspricht dem Auto-Sync-Verhalten (autoSyncInitialisieren).
async function msGraphInitialisieren(){
  if(!msGraphVerfuegbar()){ msGraphStatus = 'nicht_verfuegbar'; return; }
  try{
    const inst = await msGraphInstanzSicherstellen();
    if(!inst){ msGraphStatus = 'nicht_verfuegbar'; return; }
    // Verarbeitet ggf. die Rueckkehr von loginRedirect() -- MUSS bei jedem
    // Seitenaufruf aufgerufen werden, auch wenn gerade kein Redirect im
    // Gange ist (liefert dann einfach null zurueck).
    const ergebnis = await inst.handleRedirectPromise();
    const geradeFrischAngemeldet = !!(ergebnis && ergebnis.account);
    if(geradeFrischAngemeldet){
      inst.setActiveAccount(ergebnis.account);
    }
    const konten = inst.getAllAccounts();
    if(konten.length > 0){
      inst.setActiveAccount(konten[0]);
      msGraphKonto = { name: konten[0].name || '', username: konten[0].username || '' };
      msGraphStatus = 'angemeldet';
      // Nur direkt nach einem FRISCHEN Login (Rueckkehr vom Redirect) sofort
      // hochladen, statt bei jedem normalen App-Start (dort wuerde sonst bei
      // jedem Oeffnen unnoetig ein Upload ausgeloest, obwohl sich meist
      // nichts geaendert hat -- die naechste echte Aenderung stoesst
      // synchronisiereAlle() ohnehin von selbst an).
      if(geradeFrischAngemeldet){ msGraphSyncSchreiben(); }
    } else {
      msGraphKonto = null;
      msGraphStatus = 'abgemeldet';
    }
  }catch(e){
    msGraphStatus = 'abgemeldet';
  }
}

// Nutzer-Geste vorhanden (Klick auf "Mit Microsoft anmelden") -- Redirect-
// Flow statt Popup, weil Popups in einer als App installierten PWA auf dem
// Handy unzuverlaessig funktionieren. Die Seite laedt danach ueber den
// Redirect-URI neu; msGraphInitialisieren() (siehe Start unten im Skript)
// verarbeitet die Rueckkehr automatisch.
async function msGraphAnmelden(){
  const inst = await msGraphInstanzSicherstellen();
  if(!inst) return;
  await inst.loginRedirect({ scopes: MSGRAPH_SCOPES });
}

function msGraphAbmelden(){
  if(!msGraphMsal) return;
  const konto = msGraphMsal.getActiveAccount();
  msGraphMsal.logoutRedirect({ account: konto, postLogoutRedirectUri: MSGRAPH_REDIRECT_URI });
}

// Baut den Inhalt des "OneDrive-Anmeldung"-Abschnitts passend zum
// aktuellen msGraphStatus -- analog autoSyncAbschnittHtml().

  if(msGraphStatus==='nicht_verfuegbar'){

      Neue/geänderte Fälle werden bei jeder Änderung automatisch direkt in dein OneDrive hochgeladen -- kein
      manuelles Verschieben/Kopieren der Sync-Datei mehr nötig. Dieser Weg hat Vorrang vor dem Ordner-Sync unten

    Fälle auf den PC zu übertragen.
  </div>
  <button type="button" id="btnMsGraphAnmelden" class="btn-sekundaer">Mit Microsoft anmelden</button>`;
}

  const btnAn = document.getElementById('btnMsGraphAnmelden');

const AUTOSYNC_DB_NAME = 'rechnungserfassung_sync_db';
const AUTOSYNC_STORE = 'handles';
function autoSyncDbOeffnen(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(AUTOSYNC_DB_NAME, 1);
    req.onupgradeneeded = ()=> req.result.createObjectStore(AUTOSYNC_STORE);
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function autoSyncHandleSpeichern(handle){
  const db = await autoSyncDbOeffnen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(AUTOSYNC_STORE, 'readwrite');
    tx.objectStore(AUTOSYNC_STORE).put(handle, 'ordner');
    tx.oncomplete = ()=> resolve();
    tx.onerror = ()=> reject(tx.error);
  });
}
async function autoSyncHandleLaden(){
  try{
    const db = await autoSyncDbOeffnen();
    return await new Promise((resolve, reject)=>{
      const tx = db.transaction(AUTOSYNC_STORE, 'readonly');
      const req = tx.objectStore(AUTOSYNC_STORE).get('ordner');
      req.onsuccess = ()=> resolve(req.result || null);
      req.onerror = ()=> reject(req.error);
    });
  }catch(e){ return null; }
}
async function autoSyncHandleLoeschen(){
  try{
    const db = await autoSyncDbOeffnen();
    const tx = db.transaction(AUTOSYNC_STORE, 'readwrite');
    tx.objectStore(AUTOSYNC_STORE).delete('ordner');
  }catch(e){}
}

// Schreibt die IMMER GLEICHE Datei mit dem aktuellen Gesamtstand -- läuft
// eine Schreibaktion noch, wird die naechste nur vorgemerkt (statt parallel
// zu schreiben) und läuft danach automatisch noch einmal, damit der
// allerletzte Stand nie verloren geht.
async function autoSyncSchreiben(){
  if(autoSyncStatus!=='verbunden' || !autoSyncOrdnerHandle) return;
  if(autoSyncSchreibtGerade){ autoSyncErneutNoetig = true; return; }
  autoSyncSchreibtGerade = true;
  try{
    const daten = exportDatenBauen();
    const istLeer = daten.faelle.length===0 && (!daten.bestatterAenderungen || daten.bestatterAenderungen.length===0);
    // SCHUTZ VOR DATENVERLUST: steht hier aktuell NICHTS Lokales an (z.B.
    // weil der lokale Speicher unerwartet leer ist -- etwa nach Cache-
    // Löschung oder einem App-/Browser-Wechsel), aber die Sync-Datei enthält
    // noch Fälle, NICHT einfach leer drüberschreiben. Sonst geht beim
    // naechsten "stillen" Aufruf (z.B. direkt beim App-Start ueber
    // autoSyncInitialisieren) der komplette bisherige Stand verloren.
    if(istLeer && await autoSyncDateiHatBereitsDaten()){
      autoSyncStatus = 'verbunden';
      appToastAnzeigen('WARNUNG: Lokal sind aktuell keine Fälle gespeichert, die Sync-Datei enthält aber noch welche -- zum Schutz vor Datenverlust wurde NICHT überschrieben. Falls die lokalen Daten unerwartet verschwunden sind, bitte zuerst über "Fälle importieren" die Sync-Datei wiederherstellen.', 7000);
      return;
    }
    const dateiHandle = await autoSyncOrdnerHandle.getFileHandle('rechnungserfassung_sync.json', {create:true});
    const schreibbar = await dateiHandle.createWritable();
    await schreibbar.write(JSON.stringify(daten, null, 2));
    await schreibbar.close();
  }catch(e){
    // z.B. Berechtigung zwischenzeitlich entzogen -- der Status zeigt das
    // beim naechsten Aufruf der Einstellungen an, der manuelle Export-Button
    // erscheint automatisch wieder (siehe autoSyncVerfuegbar()).
    autoSyncStatus = 'berechtigung_fehlt';
  } finally {
    autoSyncSchreibtGerade = false;
    if(autoSyncErneutNoetig){ autoSyncErneutNoetig = false; autoSyncSchreiben(); }
  }
}

// Prüft (lesend, ohne etwas zu verändern), ob die Sync-Datei im gewählten
// Ordner aktuell noch mindestens einen Fall enthält -- Grundlage für den
// Datenverlust-Schutz oben.
async function autoSyncDateiHatBereitsDaten(){
  try{
    const dateiHandle = await autoSyncOrdnerHandle.getFileHandle('rechnungserfassung_sync.json', {create:false});
    const datei = await dateiHandle.getFile();
    const inhalt = await datei.text();
    const vorhandeneDaten = JSON.parse(inhalt);
    return !!(vorhandeneDaten && Array.isArray(vorhandeneDaten.faelle) && vorhandeneDaten.faelle.length>0);
  }catch(e){
    return false; // z.B. Datei existiert noch gar nicht -- dann gibt es nichts zu schuetzen
  }
}

// Nutzer wählt (per Tap in den Einstellungen, also mit Nutzer-Geste -- nur
// dann erlauben Browser den Berechtigungsdialog) einmalig den Sync-Ordner.
async function autoSyncOrdnerWaehlen(){
  if(!fileSystemAccessVerfuegbar()) return false;
  try{
    const handle = await window.showDirectoryPicker({id:'rechnungserfassung-sync', mode:'readwrite'});
    const berechtigt = await handle.requestPermission({mode:'readwrite'});
    if(berechtigt!=='granted') return false;
    await autoSyncHandleSpeichern(handle);
    autoSyncOrdnerHandle = handle;
    autoSyncStatus = 'verbunden';
    await autoSyncSchreiben();
    return true;
  }catch(e){ return false; } // z.B. Nutzer hat den Auswahldialog abgebrochen
}

async function autoSyncOrdnerTrennen(){
  await autoSyncHandleLoeschen();
  autoSyncOrdnerHandle = null;
  autoSyncStatus = 'nicht_verbunden';
}

// Nach erneutem Öffnen der App die zuvor gewählte Ordner-Berechtigung ohne
// weiteren Dialog PRÜFEN (requestPermission bräuchte eine Nutzer-Geste,
// queryPermission nicht). Ist sie noch gültig, sofort den aktuellen Stand
// schreiben, damit ein evtl. seit dem letzten Mal geänderter Stand (z.B.
// falls ein Schreibvorgang durch geschlossene App/leeren Akku nicht mehr
// zum Zug kam) nachgeholt wird.
async function autoSyncInitialisieren(){
  if(!fileSystemAccessVerfuegbar()){ autoSyncStatus = 'nicht_unterstuetzt'; return; }
  const handle = await autoSyncHandleLaden();
  if(!handle){ autoSyncStatus = 'nicht_verbunden'; return; }
  autoSyncOrdnerHandle = handle;
  try{
    const berechtigung = await handle.queryPermission({mode:'readwrite'});
    if(berechtigung==='granted'){
      autoSyncStatus = 'verbunden';
      await autoSyncSchreiben();
    } else {
      autoSyncStatus = 'berechtigung_fehlt';
    }
  }catch(e){ autoSyncStatus = 'nicht_verbunden'; }
}

// Erneutes Bestätigen (Nutzer-Geste vorhanden -- z.B. Tap auf "Erneut
// verbinden" in den Einstellungen), falls die Berechtigung abgelaufen ist.
async function autoSyncBerechtigungErneuern(){
  if(!autoSyncOrdnerHandle) return false;
  try{
    const berechtigt = await autoSyncOrdnerHandle.requestPermission({mode:'readwrite'});
    if(berechtigt==='granted'){
      autoSyncStatus = 'verbunden';
      await autoSyncSchreiben();
      return true;
    }
  }catch(e){}
  return false;
}
