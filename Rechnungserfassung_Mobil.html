          bestatterAenderungen: ladeKatalog().filter(b=>b.herkunft==='handy')};
}
// KORREKTUR (mehrfach durchprobiert, auf Nutzerwunsch zurückgebaut):
// Sowohl das "Speichern unter"-Fenster bei JEDEM Export (showSaveFilePicker)
// als auch ein einmalig gewählter, dauerhaft gespeicherter Export-Ordner
// (showDirectoryPicker + getFileHandle(...,{create:true}) + createWritable())
// wurden ausprobiert, um das "immer neue Datei mit fortlaufender Zahl statt
// Überschreiben"-Problem zu lösen -- auf dem tatsächlich genutzten Gerät
// überschreibt aber KEINE der beiden Varianten zuverlässig (vermutlich eine
// Android/Storage-Access-Framework-Eigenheit). Beide brachten also nur einen
// zusätzlichen Dialog ohne echten Nutzen. Der manuelle Export ist deshalb
// wieder auf die einfache, direkte Rückfallebene zurückgebaut:
//  1) Ist der Auto-Sync-Ordner bereits verbunden (Weg A, siehe unten -- DER
//     funktioniert zuverlässig, weil er nicht bei jedem Export neu
//     nachfragt), wird die Export-Datei einfach zusätzlich dort abgelegt.
//  2) Sonst: natives Teilen-Menü, sonst klassischer Download -- dort kann
//     das Duplikat-Verhalten (fortlaufende Zahl) je nach Gerät weiterhin
//     auftreten, mangels besserer, tatsächlich funktionierender Alternative.
//     Der zuverlässige Weg dagegen bleibt der Auto-Sync.
const EXPORT_DATEINAME = 'rechnungserfassung_export.json';

// Gegenstück zu exportDatenBauen()/jsonExport(): liest eine zuvor mit
// "Fälle für den PC exportieren" (oder dem Auto-Sync) erzeugte JSON-Datei
// wieder ein -- z.B. wenn nach dem Löschen des Browser-/App-Caches die
// lokal gespeicherten, noch nicht am PC übernommenen Fälle verloren gingen.
// Bewusst als MERGE statt Überschreiben umgesetzt: bereits lokal
// vorhandene Fälle (gleicher Inhalt UND gleicher Zeitstempel) werden nicht
// doppelt angelegt, damit ein erneutes/versehentliches Einlesen derselben
// Datei nichts kaputt macht. Vom Handy neu angelegte Bestatter werden über
// die bereits vorhandene Dubletten-Prüfung (bestatterEintragen) ergänzt.
// Gibt {geaendert, html} zurück -- html ist der inline anzuzeigende
// Hinweistext (KEIN natives alert/confirm, wie an anderer Stelle bereits
// festgelegt).
function jsonImportVerarbeiten(text){
  let daten;
  try{ daten = JSON.parse(text); }
  catch(e){ return {geaendert:false, html:'Die Datei enthält kein gültiges JSON und konnte nicht eingelesen werden.'}; }

  if(!daten || !Array.isArray(daten.faelle)){
    return {geaendert:false, html:'Die Datei enthält keine erkennbaren Fälle (erwartetes Format: Export aus "Fälle für den PC exportieren").'};
  }

  const bestand = {ls: ladeFaelle('ls'), pt: ladeFaelle('pt')};
  const schluesselVorhanden = {
    ls: new Set(bestand.ls.map(f=> JSON.stringify([f.werte, f.zeitstempel]))),
    pt: new Set(bestand.pt.map(f=> JSON.stringify([f.werte, f.zeitstempel])))
  };

  let importiert = {ls:0, pt:0}, uebersprungen = 0, ungueltig = 0;
  daten.faelle.forEach(eintrag=>{
    const art = eintrag && (eintrag.art==='ls' || eintrag.art==='pt') ? eintrag.art : null;
    if(!art || !eintrag.werte){ ungueltig++; return; }
    const schluessel = JSON.stringify([eintrag.werte, eintrag.zeitstempel]);
    if(schluesselVorhanden[art].has(schluessel)){ uebersprungen++; return; }
    const neu = {
      werte: eintrag.werte,
      positionen: Array.isArray(eintrag.positionen) ? eintrag.positionen : [],
      zeitstempel: eintrag.zeitstempel || new Date().toISOString()
    };
    if(eintrag.rechnungsnummer) neu.rechnungsnummer = eintrag.rechnungsnummer;
    bestand[art].push(neu);
    schluesselVorhanden[art].add(schluessel);
    importiert[art]++;
  });

  let bestatterNeu = 0;
  if(Array.isArray(daten.bestatterAenderungen)){
    const vorherAnzahl = ladeKatalog().length;
    daten.bestatterAenderungen.forEach(b=>{
      if(b && b.name) bestatterEintragen(b.name, b.adr1, b.adr2);
    });
    bestatterNeu = ladeKatalog().length - vorherAnzahl;
  }

  const gesamtImportiert = importiert.ls + importiert.pt;
  if(gesamtImportiert>0){
    speichereFaelle('ls', bestand.ls);
    speichereFaelle('pt', bestand.pt);
  }

  if(gesamtImportiert===0 && bestatterNeu===0){
    return {geaendert:false, html: uebersprungen>0
      ? `Alle ${uebersprungen} Fälle aus der Datei sind bereits lokal vorhanden -- nichts zu importieren.`
      : (ungueltig>0 ? `Die Datei enthält ${ungueltig} nicht erkennbare Einträge und keine gültigen Fälle.` : 'Die Datei enthält keine Fälle.')};
  }

  let html = `${gesamtImportiert} Fall/Fälle importiert (LS: ${importiert.ls}, PT: ${importiert.pt})`;
  if(uebersprungen>0) html += `, ${uebersprungen} bereits vorhanden (übersprungen)`;
  if(bestatterNeu>0) html += `, ${bestatterNeu} Bestatter aus der Datei übernommen`;
  if(ungueltig>0) html += `, ${ungueltig} Einträge ungültig/übersprungen`;
  html += '.';
  return {geaendert:true, html};
}



/* ==========================================================
   OneDrive-Anmeldung (Microsoft/MSAL) -- perspektivisch als robusterer
   Ersatz/Ergaenzung zu den fest hinterlegten Freigabelinks in
   excelDateiOeffnen(): mit einem gueltigen Zugriffstoken kann die App
   ueber die Microsoft-Graph-API die AKTUELL im jeweiligen OneDrive-Pfad
   liegende Datei auflösen, statt sich auf einen an eine feste Datei-ID
   gebundenen Freigabelink zu verlassen (siehe die Besprechung zum
   "falscher/veralteter Freigabelink"-Problem). Diese erste Ausbaustufe
   kuemmert sich nur um die Anmeldung selbst (Login/Logout, Status-
   Anzeige in den Einstellungen) -- die eigentliche Datei-Aufloesung ueber
   Graph folgt als naechster Schritt, sobald die Anmeldung bestaetigt
   nachweisbar funktioniert.
   ========================================================== */
// Nur PERSOENLICHE Microsoft-Konten (siehe Kontotyp-Auswahl bei der
// Azure-App-Registrierung) -- deshalb "consumers" statt "common"/"organizations".
const MSGRAPH_CLIENT_ID = '579a39e0-b7fd-4c46-8684-af22e1bc45a2';
const MSGRAPH_AUTHORITY = 'https://login.microsoftonline.com/consumers';
// Muss ZEICHENGENAU mit dem in Azure (Authentifizierung -> SPA-Plattform)
// hinterlegten Redirect-URI uebereinstimmen.
const MSGRAPH_REDIRECT_URI = 'https://seblussi.github.io/rechnung-mobil/Rechnungserfassung_Mobil.html';
const MSGRAPH_SCOPES = ['Files.ReadWrite', 'offline_access', 'User.Read'];

let msGraphMsal = null;
// 'unbekannt' (direkt nach Laden, bevor msGraphInitialisieren fertig ist),
// 'nicht_verfuegbar' (MSAL-Bibliothek konnte nicht geladen werden, z.B.
// kein Netz), 'abgemeldet', 'angemeldet'
let msGraphStatus = 'unbekannt';
let msGraphKonto = null; // {name, username} des angemeldeten Kontos

function msGraphVerfuegbar(){
  return typeof msal !== 'undefined';
}

// Legt (einmalig) die MSAL-Instanz an. Getrennt von msGraphInitialisieren,
// damit sowohl der normale Start als auch die Rueckkehr vom Microsoft-
// Login-Redirect dieselbe, garantiert bereits initialisierte Instanz nutzen.
async function msGraphInstanzSicherstellen(){
  if(msGraphMsal) return msGraphMsal;
  if(!msGraphVerfuegbar()) return null;
  msGraphMsal = new msal.PublicClientApplication({
    auth: {
      clientId: MSGRAPH_CLIENT_ID,
      authority: MSGRAPH_AUTHORITY,
      redirectUri: MSGRAPH_REDIRECT_URI
    },
    cache: { cacheLocation: 'localStorage' }
  });
  await msGraphMsal.initialize();
  return msGraphMsal;
}

// Beim Start (bzw. direkt nach Rueckkehr vom Microsoft-Login) pruefen, ob
// bereits ein Konto im lokalen Cache steht (bzw. der Redirect gerade ein
// neues eingetragen hat) -- KEIN automatischer Login-Versuch ohne
// Nutzer-Geste, das entspricht dem Auto-Sync-Verhalten (autoSyncInitialisieren).
async function msGraphInitialisieren(){
  if(!msGraphVerfuegbar()){ msGraphStatus = 'nicht_verfuegbar'; return; }
  try{
    const inst = await msGraphInstanzSicherstellen();
    if(!inst){ msGraphStatus = 'nicht_verfuegbar'; return; }
    // Verarbeitet ggf. die Rueckkehr von loginRedirect() -- MUSS bei jedem
    // Seitenaufruf aufgerufen werden, auch wenn gerade kein Redirect im
    // Gange ist (liefert dann einfach null zurueck).
    const ergebnis = await inst.handleRedirectPromise();
    const geradeFrischAngemeldet = !!(ergebnis && ergebnis.account);
    if(geradeFrischAngemeldet){
      inst.setActiveAccount(ergebnis.account);
    }
    const konten = inst.getAllAccounts();
    if(konten.length > 0){
      inst.setActiveAccount(konten[0]);
      msGraphKonto = { name: konten[0].name || '', username: konten[0].username || '' };
      msGraphStatus = 'angemeldet';
      // Nur direkt nach einem FRISCHEN Login (Rueckkehr vom Redirect) sofort
      // hochladen, statt bei jedem normalen App-Start (dort wuerde sonst bei
      // jedem Oeffnen unnoetig ein Upload ausgeloest, obwohl sich meist
      // nichts geaendert hat -- die naechste echte Aenderung stoesst
      // synchronisiereAlle() ohnehin von selbst an).
      if(geradeFrischAngemeldet){ msGraphSyncSchreiben(); }
    } else {
      msGraphKonto = null;
      msGraphStatus = 'abgemeldet';
    }
  }catch(e){
    msGraphStatus = 'abgemeldet';
  }
}

// Nutzer-Geste vorhanden (Klick auf "Mit Microsoft anmelden") -- Redirect-
// Flow statt Popup, weil Popups in einer als App installierten PWA auf dem
// Handy unzuverlaessig funktionieren. Die Seite laedt danach ueber den
// Redirect-URI neu; msGraphInitialisieren() (siehe Start unten im Skript)
// verarbeitet die Rueckkehr automatisch.
async function msGraphAnmelden(){
  const inst = await msGraphInstanzSicherstellen();
  if(!inst) return;
  await inst.loginRedirect({ scopes: MSGRAPH_SCOPES });
}

function msGraphAbmelden(){
  if(!msGraphMsal) return;
  const konto = msGraphMsal.getActiveAccount();
  msGraphMsal.logoutRedirect({ account: konto, postLogoutRedirectUri: MSGRAPH_REDIRECT_URI });
}

  </div>

const AUTOSYNC_DB_NAME = 'rechnungserfassung_sync_db';
const AUTOSYNC_STORE = 'handles';

// Schreibt die IMMER GLEICHE Datei mit dem aktuellen Gesamtstand -- läuft
// eine Schreibaktion noch, wird die naechste nur vorgemerkt (statt parallel
// zu schreiben) und läuft danach automatisch noch einmal, damit der
// allerletzte Stand nie verloren geht.

// Prüft (lesend, ohne etwas zu verändern), ob die Sync-Datei im gewählten
// Ordner aktuell noch mindestens einen Fall enthält -- Grundlage für den
// Datenverlust-Schutz oben.

// Nutzer wählt (per Tap in den Einstellungen, also mit Nutzer-Geste -- nur
// dann erlauben Browser den Berechtigungsdialog) einmalig den Sync-Ordner.


// Nach erneutem Öffnen der App die zuvor gewählte Ordner-Berechtigung ohne
// weiteren Dialog PRÜFEN (requestPermission bräuchte eine Nutzer-Geste,
// queryPermission nicht). Ist sie noch gültig, sofort den aktuellen Stand
// schreiben, damit ein evtl. seit dem letzten Mal geänderter Stand (z.B.
// falls ein Schreibvorgang durch geschlossene App/leeren Akku nicht mehr
// zum Zug kam) nachgeholt wird.

// Erneutes Bestätigen (Nutzer-Geste vorhanden -- z.B. Tap auf "Erneut
// verbinden" in den Einstellungen), falls die Berechtigung abgelaufen ist.

function themaAnwenden(){
  const e = ladeEinstellungen();
  document.body.classList.toggle('dunkel', !!e.dunkel);
  // Sonne/Mond-Symbol neben dem Zahnrad zeigt IMMER das gerade aktive
  // Design (Sonne = hell, Mond = dunkel) -- unabhaengig davon, ob man die
  // Checkbox in den Einstellungen oder diesen Kurzschalter benutzt hat,
  // damit beide Wege garantiert im selben Zustand landen.
  const btnDunkelToggle = document.getElementById('btnDunkelToggle');
  if(btnDunkelToggle) btnDunkelToggle.innerHTML = e.dunkel ? '&#127769;' : '&#9728;';
}
document.getElementById('btnEinstellungen').onclick = ()=>{
  if(einstellungenOffen) schliesseEinstellungen();
  else { vorbereiteRuecksprung(); ansichtEinstellungen(); }
};
// Kurzschalter neben dem Zahnrad: Dunkelmodus direkt umschalten, ohne extra
// den Weg über die Einstellungen zu nehmen -- schreibt in dieselbe
// Einstellung (e.dunkel) wie die Checkbox dort, damit beide immer synchron
// bleiben. Steht die Einstellungen-Seite gerade offen, wird sie neu
// aufgebaut, damit die dortige Checkbox den neuen Stand sofort zeigt.
document.getElementById('btnDunkelToggle').onclick = ()=>{
  const e = ladeEinstellungen();
  e.dunkel = !e.dunkel;
  e.dunkelManuell = true; // siehe dunkelModusAutoSyncEinrichten
  speichereEinstellungen(e);
  themaAnwenden();
  if(einstellungenOffen) ansichtEinstellungen();
};

// NUTZERWUNSCH: "Der [vom Handy-Browser] erzwungene Nachtmodus soll so
// aussehen wie der App interne Dunkelmodus" -- manche mobilen Browser (u.a.
// Opera Mobile) haben einen eigenen "Nachtmodus", der Seiten OHNE eigenes
// Dunkeldesign nachtraeglich (und oft nur unvollstaendig/seltsam) einfaerbt.
// Die App hat zwar bereits ein eigenes, vollstaendiges Dunkeldesign (siehe
// color-scheme-Meta/CSS oben), aber offenbar reicht das bei manchen Browsern
// nicht aus, um deren automatische Nachfaerbung zu unterdruecken. Deshalb
// zusaetzlich: folgt die App dem System-/Browser-Farbschema automatisch
// (matchMedia "prefers-color-scheme: dark"), SOLANGE der Dunkelmodus noch
// nie manuell (Checkbox oder Sonne/Mond-Kurzschalter) umgeschaltet wurde --
// dadurch bekommt man in einem Browser-Nachtmodus (der ueblicherweise auch
// dieses Media-Feature setzt) von Anfang an das echte, fertig gestaltete
// Dunkeldesign der App zu sehen, statt der ggf. fehlerhaften Nachfaerbung
// des Browsers. Sobald einmal manuell umgeschaltet wurde, hat diese Wahl
// Vorrang und wird nicht mehr automatisch ueberschrieben.
function dunkelModusAutoSyncEinrichten(){
  try{
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const abgleichen = ()=>{
      const e = ladeEinstellungen();
      if(e.dunkelManuell) return; // bewusste Nutzerwahl hat Vorrang
      if(!!e.dunkel === mq.matches) return; // schon passend, nichts zu tun
      e.dunkel = mq.matches;
      speichereEinstellungen(e);
      themaAnwenden();
      if(einstellungenOffen) ansichtEinstellungen();
    };
    abgleichen();
    // addEventListener ist der moderne Weg; addListener als Fallback fuer
    // aeltere WebView-/Browser-Engines, die "change" auf MediaQueryList noch
    // nicht per addEventListener unterstuetzen.
    if(mq.addEventListener) mq.addEventListener('change', abgleichen);
    else if(mq.addListener) mq.addListener(abgleichen);
  }catch(e){}
}

/* ==========================================================
   Rechnungspositionen-Auswahl (gemeinsame Ansicht für LS/PT)
   ========================================================== */
function ansichtPositionenAlt(art, ausgewaehlteZiffern, betragSchaetzung, weiter, kmFahrstreckeGesamt){
  // FIX: vorher wurde hier "null" als zurueckZiel übergeben -- dadurch war
  // weder der Pfeil oben sichtbar, noch sprang die Handy-"Zurück"-Taste
  // sinnvoll zur Maske zurück; stattdessen griff die allgemeine "nicht auf
  // dem Hauptbildschirm"-Absicherung und sprang OHNE Rückfrage direkt zum
  // Startbildschirm (Gefahr von Datenverlust). ruecksprungAusEinstellungen
  // wurde vom Aufrufer (btnPunkte.onclick) bereits passend auf die Maske
  // (mit Schnappschuss der Maskenwerte) gesetzt, bevor diese Ansicht
  // aufgebaut wurde -- genau diese Funktion jetzt tatsächlich als
  // zurueckZiel verwenden (als Closure, damit ein späteres Neusetzen von
  // ruecksprungAusEinstellungen -- z.B. über das Zahnrad -- respektiert wird).
  setzeTitel('Rechnungspositionen', ()=>ruecksprungAusEinstellungen());
  aktuellerZurueckHandler = ()=>{ vorbereiteRuecksprung(); ruecksprungAusEinstellungen(); };
  const katalog = art==='ls' ? POSITIONEN_LS : POSITIONEN_PT;
  // Zeitzuschläge (F/G/H) und Wegegeld/Reiseentschädigung sind wie am PC
  // rein automatisch bestimmte Kategorien ("ZuschlagAuto"/"WegegeldAuto") --
  // sie werden von automatischeAuswahl() anhand Datum/Uhrzeit/km bestimmt
  // und sind bewusst NICHT manuell anwählbar (ausgegraut/gesperrt), damit
  // hier nichts abweichend vom errechneten Ergebnis angehakt werden kann.
  // Reiseentschädigung wie am PC (AutoZeileEinfuegen "##KM##"): Beschriftung
  // und Betrag zeigen zusätzlich die km-abhängige 26-ct-Zeile mit an.
  const reise = reiseGesamtBetrag(kmFahrstreckeGesamt);
  const reiseBez = reise.kmGerundet>0
    ? `${REISEENTSCHAEDIGUNG.bez} (${reise.basis.toFixed(2).replace('.',',')} &euro;) + Wegstrecke ${reise.kmGerundet} km &times; 0,26 &euro;/km (${reise.kmZeile.toFixed(2).replace('.',',')} &euro;)`
    : `${REISEENTSCHAEDIGUNG.bez} (zzgl. 0,26 &euro;/km Wegstrecke, sobald km bekannt)`;
  // Gruppierung/Beschriftung wie am PC (SektionVonPunkt): "Grundpauschalen"
  // statt "Grundleistung"; "E" ist inhaltlich kein Zeitzuschlag, wird aber
  // zusammen mit F/G/H unter "Zeitzuschläge" geführt (bleibt aber -- anders
  // als F/G/H -- manuell anhakbar); Wegegeld-Staffeln (Tag/Nacht) UND
  // Reiseentschädigung fallen am PC unter EINE gemeinsame Überschrift
  // "Wegegeld" statt mehrerer separater Abschnitte.
  const eEintrag = (katalog.grundleistung||[]).find(p=>p.ziffer==='E');
  // KORREKTUR: die eigentliche Grundpauschale (101 bei LS, 50 bei PT --
  // erkennbar an "standard:true", automatischeAuswahl() haengt sie ja auch
  // immer von selbst an) ist genau wie am PC KEINE manuell abwaehlbare
  // Position, sondern zwingend fester Bestandteil jeder Rechnung -- muss
  // also genau wie Zeitzuschlaege/Wegegeld ausgegraut und angehakt bleiben.
  // Nur die weiteren Grundpauschalen-Positionen (z.B. 102, Zuschlag bei
  // unbekannter Identitaet) bleiben bewusst manuell an-/abwaehlbar.
  const grundOhneE = (katalog.grundleistung||[]).filter(p=>p.ziffer!=='E')
    .map(p=> p.standard ? {...p, automatisch:true} : p);
  const gruppen = [
    {titel:'Grundpauschalen', liste: grundOhneE, automatisch:false},
    {titel:'Eigene Positionen', liste: betaEigene(art).map(betaEigenePositionAlsAuswahl), automatisch:false, eigene:true},
    {titel:'Zeitzuschläge', liste: eEintrag ? [{...eEintrag, automatisch:false}, ...ZUSCHLAEGE_ZEIT] : ZUSCHLAEGE_ZEIT, automatisch:true},
    {titel:'Wegegeld', liste: [...WEGEGELD_TAG, ...WEGEGELD_NACHT, {ziffer:'REISE', bez:reiseBez, betrag:reise.gesamt}], automatisch:true}
  ];
  let html = `<div class="maske ${art}">`;
  gruppen.forEach(g=>{
    // Enthaelt eine Gruppe manuell UND automatisch bestimmte Positionen
    // (z.B. "E" innerhalb "Zeitzuschläge"), wird "automatisch" nicht mehr
    // pauschal in der Zwischenüberschrift, sondern je Position angezeigt.
    const gemischt = g.liste.some(p => typeof p.automatisch==='boolean' && p.automatisch!==g.automatisch);
    html += `<div class="positionen-gruppe-titel">${g.titel}${(g.automatisch && !gemischt)?' <span class="auto-hinweis">automatisch</span>':''}</div>`;
    g.liste.forEach(p=>{
      const istAuto = (typeof p.automatisch==='boolean') ? p.automatisch : g.automatisch;
      const checked = ausgewaehlteZiffern.has(p.ziffer) ? 'checked' : '';
      const gesperrt = istAuto ? 'disabled' : '';
      html += `${p.eigene ? `<div class="wisch-huelle" data-eigene="${p.ziffer}"><div class="wisch-hinter">&#128465; Löschen</div>` : ''}<label class="position-zeile${istAuto?' auto-gesperrt':''}">
        <input type="checkbox" data-ziffer="${p.ziffer}" data-betrag="${p.betrag}" data-auto="${istAuto?'1':'0'}" ${checked} ${gesperrt}>
        <div class="haupt"><span class="ziffer">${p.anzeigeZiffer!==undefined ? htmlEsc(p.anzeigeZiffer) : (p.ziffer||'')}</span> ${p.eigene ? htmlEsc(p.bez) : p.bez}${gemischt&&istAuto?' <span class="auto-hinweis">automatisch</span>':''}</div>
        <div class="betrag">${p.betrag.toFixed(2).replace('.',',')} &euro;</div>
      </label>${p.eigene ? '</div>' : ''}`;
    });
    if(g.eigene) html += `<button type="button" class="btn-sekundaer" id="btnEigenePosNeu" style="margin:8px 0 4px;">+ Eigene Position hinzufügen</button>${g.liste.length ? '<div class="eigene-hinweis">Zum Löschen nach links wischen.</div>' : ''}`;
  });
  html += `<div class="summenzeile"><span>Gesamt</span><span id="posSumme">0,00 &euro;</span></div>`;
  html += `<button class="btn-primaer" id="btnPositionenFertig">Übernehmen</button>`;
  html += `</div>`;
  app.innerHTML = html;

  function summeBerechnen(){
    let summe=0;
    app.querySelectorAll('.position-zeile input:checked').forEach(cb=> summe += parseFloat(cb.dataset.betrag));
    document.getElementById('posSumme').textContent = summe.toFixed(2).replace('.',',')+' €';
    return summe;
  }

  // Gegenseitige Ausschlüsse (nur PT, 1:1 wie am PC/AusschluesseAktualisieren):
  // ist eine Ziffer aktiv -- egal ob manuell angehakt oder als Grundleistung
  // fest -- werden alle mit ihr unvereinbaren Positionen gesperrt und
  // automatisch abgehakt.
  function ausschluesseAktualisieren(){
    if(art!=='pt') return;
    const boxen = Array.from(app.querySelectorAll('.position-zeile input'));
    const aktive = new Set(boxen.filter(cb=>cb.checked).map(cb=>cb.dataset.ziffer));
    boxen.forEach(cb=>{
      // Automatik-Kategorien (Zeitzuschlag/Wegegeld/Reise) bleiben immer
      // gesperrt -- die Ausschluss-Logik betrifft nur die manuell wählbaren
      // Grundleistungs-Positionen.
      if(cb.dataset.auto==='1') return;
      const ausschluesse = ZIFFER_AUSSCHLUESSE[cb.dataset.ziffer];
      const zeile = cb.closest('.position-zeile');
      if(!ausschluesse){ cb.disabled=false; if(zeile) zeile.style.opacity=''; return; }
      const gesperrt = ausschluesse.some(z=> aktive.has(z));
      if(gesperrt && cb.checked) cb.checked = false;
      cb.disabled = gesperrt;
      if(zeile) zeile.style.opacity = gesperrt ? '0.45' : '';
    });
  }

  function positionAktualisieren(){ ausschluesseAktualisieren(); summeBerechnen(); }
  app.querySelectorAll('.position-zeile input').forEach(cb=> cb.addEventListener('change', positionAktualisieren));
  positionAktualisieren();
  // BETA: eigene Positionen (anlegen, per Wischen loeschen)
  betaEigenePositionenVerdrahten(art, (neuId, entferntId)=>{
    const set = new Set(Array.from(app.querySelectorAll('.position-zeile input:checked')).map(cb=> cb.dataset.ziffer));
    if(neuId) set.add(neuId);
    if(entferntId) set.delete(entferntId);
    ansichtPositionen(art, set, betragSchaetzung, weiter, kmFahrstreckeGesamt);
  });

  document.getElementById('btnPositionenFertig').onclick = ()=>{
    const gewaehlt = new Set();
    let summe=0;
    app.querySelectorAll('.position-zeile input:checked').forEach(cb=>{ gewaehlt.add(cb.dataset.ziffer); summe += parseFloat(cb.dataset.betrag); });
    weiter(gewaehlt, summe);
  };
}

/* ==========================================================
   LS- / PT-Maske
   ========================================================== */
function ansichtMaske(art, korrekturIdx, vorbelegt){
  einstellungenOffen = false;
  // WICHTIG: vorbereiteRuecksprung() wird vom Zahnrad-Klick-Handler
  // aufgerufen, SOLANGE diese Maske noch angezeigt wird (also bevor auf
  // Einstellungen umgeschaltet wird) -- werteEinsammeln() liest dann noch
  // aus den echten, vorhandenen Maskenfeldern. Ein "fauler" Aufruf erst
  // beim Zurückspringen aus den Einstellungen würde stattdessen aus dem
  // (falschen) Einstellungen-DOM lesen und dort hängen bleiben.
  vorbereiteRuecksprung = ()=>{
    const snap = werteEinsammeln();
    ruecksprungAusEinstellungen = ()=>ansichtMaske(art, korrekturIdx, {werte: snap, positionen: positionenAuswahl});
  };
  // Wurde die Maske aus der Rechnungsübersicht heraus geöffnet (Klick auf
  // eine bestehende Rechnung -- erkennbar an gesetztem korrekturIdx), soll
  // "Zurück" (Pfeil, Handy-Taste ODER nach dem Speichern) auch wieder dahin
  // zurückführen statt immer auf die Startseite. Bei einer neu angelegten
  // Rechnung (kein korrekturIdx, ueber die Kacheln Leichenschau/Privat-
  // rechnung gestartet) bleibt es bei der Startseite.
  const ruecksprungZiel = betaMaskeHerkunft==='gesamt' ? ()=> ansichtRechnungenGesamt() : (korrekturIdx!==undefined ? ansichtKorrigieren : ansichtStart);
  setzeTitel(art==='ls' ? 'Leichenschau' : 'Privatrechnung', zurueckAusMaske);
  let werte = {};
  let positionenAuswahl = null;
  // Wie am PC (gManuellModus): '' = automatisch (50-km-Regel entscheidet
  // Wegegeld vs. Reiseentschädigung), 'REISE' = Nutzer hat bewusst eine
  // Fahrstrecke-Kachel als Reiseentschädigung gewählt, 'LUFTLINIE' = Nutzer
  // hat bewusst die Luftlinie-Kachel gewählt (überspringt die 50-km-Regel).
  // Wird bei jeder automatischen Neuberechnung (kmAutomatikAusloesen) wieder
  // auf '' zurückgesetzt, genau wie am PC (KmBerechnen setzt gManuellModus
  // ebenfalls vor jeder Neuberechnung zurück).
  let manuellerModus = '';
  // Analog zu PC gKmGetippt: unterscheidet echtes Eintippen ins km-Feld
  // (löst beim Verlassen des Feldes die 25/50-km-Interpretation aus) von
  // einem programmatischen Setzen des Werts (Routenberechnung, Alternativ-
  // routen-Kachel, Fallwiederherstellung) -- Letzteres feuert kein 'input'.
  let kmManuellGetippt = false;
  let kmVorFokus = '';
  if(vorbelegt){
    werte = {...vorbelegt.werte};
    positionenAuswahl = vorbelegt.positionen || null;
  } else if(korrekturIdx!==undefined){
    const gespeichert = ladeFaelle(art)[korrekturIdx];
    werte = {...gespeichert.werte};
    positionenAuswahl = gespeichert.positionen ? betaSetMitDetails(gespeichert.positionen, gespeichert.positionsDetails, !!(gespeichert.hochgeladen || gespeichert.ausUebersicht || gespeichert.bezug)) : null;
  } else if(maskenEntwuerfe[art]){
    // Neu begonnene Rechnung: vorhandenen, noch nicht gespeicherten Entwurf
    // (siehe maskenEntwuerfe oben) wiederherstellen statt erneut die
    // Standard-Vorbelegung (heutiges Datum etc.) zu setzen -- genau das
    // ermoeglicht das gewuenschte Hin- und Herwechseln ohne Datenverlust.
    werte = {...maskenEntwuerfe[art].werte};
    positionenAuswahl = maskenEntwuerfe[art].positionen ? betaSetMitDetails(maskenEntwuerfe[art].positionen, maskenEntwuerfe[art].positionen.details, maskenEntwuerfe[art].positionen.legacy) : null;
  } else {
    // Vorbelegung wie am PC (RechnungsdatumVorbelegen: Rechnungsdatum =
    // naechster Werktag nach dem Datum der Todesbescheinigung/des
    // Hausbesuchs, das seinerseits mit dem heutigen Datum vorbelegt ist;
    // UserForm_Initialize: Sterbedatum bei LS ebenfalls mit heute vorbelegt).
    const heute = heuteAlsText();
    werte = {txtDatum: naechsterWerktagText(heute), txtDatumExcel: heute};
    if(art==='ls') werte.txtSterbedatum = heute;
  }
  // Mehrfach-Diagnosen (nur PT) -- analog zu gDiagnosen am PC: je Eintrag
  // {text:"Beschreibung [Code]", flags:"" / "G" / "V" / "GV"}.
  let diagnosen = Array.isArray(werte.diagnosen) ? werte.diagnosen.map(d=>({...d})) : [];

  const ctx = {
    setValue(name, val){ const el=document.getElementById(name); if(el) el.value = val; },
    getValue(name){ const el=document.getElementById(name); return el? el.value : ''; },
    hinweis(text){ alertBanner(text); },
    async adresseVerlassen(){ await plzOrtPruefen('txtPAdresse1','txtPAdresse2'); await kmAutomatikAusloesen(); },
    allePruefungenAusfuehren(){ alleChecksAusfuehren(); }
  };

  function feldHtml(labelText, name, opts={}){
    const val = werte[name] || '';
    const grauKlasse = opts.grau ? 'grau' : '';
    return `<div class="feld">
      <label for="${name}">${labelText}</label>
      <input type="text" id="${name}" class="${grauKlasse}" value="${val.replace(/"/g,'&quot;')}" placeholder="${opts.platzhalter||''}">
      <div class="warnhinweis" id="${name}_warn"></div>
    </div>`;
  }

  let html = `<div class="maske ${art}">`;
  // Jeder Abschnitt wird in eine eigene "Karte" (.abschnitt) gepackt, damit
  // die Bereiche der Maske optisch klar voneinander getrennt sind, statt
  // nur durch eine kleine Textzeile.
  const abschnitt = (titel, inhalt) => `<div class="abschnitt"><div class="trennlinie">${titel}</div>${inhalt}</div>`;

  if(art==='ls'){
    html += abschnitt('Todesfeststellung',
      feldHtml('Datum Todesbescheinigung', 'txtDatumExcel', {typ:'datum'}) +
      feldHtml('Zeitpunkt Leichenschau (HH:MM)', 'txtZeitLS'));
  } else {
    html += abschnitt('Hausbesuch',
      feldHtml('Datum Hausbesuch', 'txtDatumExcel', {typ:'datum'}) +
      feldHtml('Uhrzeit Hausbesuch (HH:MM)', 'txtZeitLS'));
  }

  html += abschnitt('Rechnungsstellung',
    feldHtml('Rechnungsdatum (Versanddatum)', 'txtDatum') +
    `<div class="feld"><label>Rechnungsbetrag (&euro;)</label>
      <input type="text" id="txtBetrag" class="grau" value="${werte.txtBetrag||''}" readonly></div>`);

  // Abweichender Sterbeort (nur LS): wie am PC standardmäßig eingeklappt,
  // aber automatisch aufgeklappt, wenn schon Werte dafür gespeichert sind
  // (z.B. beim erneuten Öffnen eines korrigierten Falls).
  const sterbeAbwOffen = art==='ls' && !!((werte.txtSterbeAdr1||'').trim() || (werte.txtSterbeAdr2||'').trim());

  html += abschnitt('Patient',
    `<button class="btn-primaer blass" id="btnZwischenablage">Aus Zwischenablage einlesen</button>` +
    `<div class="warnhinweis" id="zwischenablageHinweis"></div>` +
    feldHtml('Nachname, Vorname', 'txtName') +
    feldHtml(art==='ls' ? 'Straße + Hausnummer (Sterbeort)' : 'Straße + Hausnummer', 'txtPAdresse1') +
    (art==='ls' ? `
      <div class="feld-zeile-mit-btn">
        <div class="feld">
          <label for="txtPAdresse2">PLZ + Stadt (Sterbeort)</label>
          <input type="text" id="txtPAdresse2" value="${(werte.txtPAdresse2||'').replace(/"/g,'&quot;')}">
        </div>
        <button type="button" class="btn-inline-blass" id="btnSterbeAbw">
          <span id="btnSterbeAbwText">${sterbeAbwOffen ? 'Sterbeort abw. ✕' : 'Sterbeort abw.?'}</span>
        </button>
      </div>
      <div class="warnhinweis" id="txtPAdresse2_warn"></div>
      <div id="sterbeAbwFelder" class="${sterbeAbwOffen ? '' : 'versteckt'}">
        ${feldHtml('Straße + Hausnummer (Sterbeort, abw.)', 'txtSterbeAdr1')}
        ${feldHtml('PLZ + Stadt (Sterbeort, abw.)', 'txtSterbeAdr2')}
      </div>` : feldHtml('PLZ + Stadt', 'txtPAdresse2')) +
    feldHtml('Geburtsdatum (TT.MM.JJJJ)', 'txtGeda'));

  if(art==='ls'){
    html += abschnitt('Sterbedaten',
      feldHtml('Sterbedatum (TT.MM.JJJJ)', 'txtSterbedatum') +
      feldHtml('Sterbezeitpunkt (HH:MM)', 'txtTodeszeit'));
  } else {
    html += abschnitt('Diagnose (ICD-Suche)',
      `<div id="diagChips"></div>` +
      `<div class="feld" style="position:relative;">
        <label for="txtDiag">Diagnose suchen</label>
        <input type="text" id="txtDiag" autocomplete="off" placeholder="ab 2 Zeichen tippen...">
        <div class="autocomplete-liste" id="diagVorschlaege"></div>
      </div>`);
  }

  html += abschnitt('Routenberechnung',
    `<div class="feld"><label id="txtKm_label" for="txtKm">Strecke (Hin- und Rückfahrt)</label>
      <input type="text" id="txtKm" value="${(werte.txtKm||'')}" placeholder="wird automatisch berechnet">
      <input type="hidden" id="txtKmFahrstrecke" value="${(werte.txtKmFahrstrecke||werte.txtKm||'')}">
      <input type="hidden" id="txtKmLuftlinie" value="${(werte.txtKmLuftlinie||'')}">
      <div class="streckeninfo" id="streckeninfo"></div>
      <div class="warnhinweis" id="txtKm_warn"></div>
      <div class="route-btn-reihe">
        <button type="button" id="btnAlternativrouten">Alternativrouten</button>
        <button type="button" id="btnGoogleMapsRoute">Google Maps Route</button>
      </div>
      <div class="routenoptionen" id="routenoptionen"></div>
    </div>`);

  if(art==='ls'){
    html += abschnitt('Bestattungsunternehmen',
      `<div class="feld" style="position:relative;">
        <label for="txtBName">Name</label>
        <input type="text" id="txtBName" value="${(werte.txtBName||'').replace(/"/g,'&quot;')}" autocomplete="off">
        <div class="autocomplete-liste" id="bestatterVorschlaege"></div>
        <div class="warnhinweis" id="txtBName_warn"></div>
      </div>
      <div class="route-btn-reihe">
        <button type="button" id="btnBestatterMaps">Google Maps öffnen</button>
        <button type="button" id="btnBestatterAdresseEinlesen">Adresse einlesen</button>
      </div>
      <div class="warnhinweis" id="bestatterAdresseHinweis"></div>` +
      feldHtml('Straße + Hausnummer', 'txtAdresse1') +
      feldHtml('PLZ + Stadt', 'txtAdresse2'));
  }

  html += abschnitt('Rechnungspositionen',
    `<button class="btn-primaer blass" id="btnPunkte">Rechnungspositionen auswählen
      <span class="unter" id="punkteStatus">${positionenAuswahl? positionenAuswahl.size+' Position(en) ausgewählt' : 'noch nicht geprüft'}</span></button>`);

  html += `<div id="allgemeinerHinweis"></div>`;
  html += `<button class="btn-primaer" id="btnSpeichern">Speichern</button>`;
  html += `</div>`;

  app.innerHTML = html;

  const feldIds = art==='ls'
    ? ['txtDatumExcel','txtZeitLS','txtDatum','txtName','txtPAdresse1','txtPAdresse2','txtSterbeAdr1','txtSterbeAdr2','txtGeda','txtSterbedatum','txtTodeszeit','txtKm','txtKmFahrstrecke','txtKmLuftlinie','txtBName','txtAdresse1','txtAdresse2']
    : ['txtDatumExcel','txtZeitLS','txtDatum','txtName','txtPAdresse1','txtPAdresse2','txtGeda','txtKm','txtKmFahrstrecke','txtKmLuftlinie'];

  // Pflichtfelder je Maskentyp (siehe btnSpeichern.onclick unten) -- ALLE
  // Felder, die tatsächlich ausgefüllt werden sollen, nicht nur die
  // ursprünglichen 3 (Name/Adresse/Datum). Grund: es konnte z.B. eine PT
  // ohne Uhrzeit Hausbesuch und ohne Geburtsdatum gespeichert werden, was
  // nicht passieren darf. txtKmLuftlinie bleibt bewusst außen vor (verstecktes
  // Begleitfeld zu txtKm, wird zusammen mit diesem automatisch gesetzt,
  // kann nicht separat rot umrandet werden). "Abweichender Sterbeort"
  // (txtSterbeAdr1/2, nur bei Bedarf aufgeklappt) und die Bestatter-Adresse
  // bleiben ebenfalls bewusst NICHT hart Pflicht -- das entspricht der
  // PC-Logik (bestatterKomplettLeer darf bewusst leer bleiben, siehe
  // pruefeBestatterLeer).
  const pflichtfelderKonfig = art==='ls'
    ? [
        {id:'txtDatumExcel', label:'Datum Todesbescheinigung'},
        {id:'txtZeitLS', label:'Zeitpunkt Leichenschau'},
        {id:'txtDatum', label:'Rechnungsdatum'},
        {id:'txtName', label:'Name'},
        {id:'txtPAdresse1', label:'Straße + Hausnummer (Sterbeort)'},
        {id:'txtPAdresse2', label:'PLZ + Stadt (Sterbeort)'},
        {id:'txtGeda', label:'Geburtsdatum'},
        {id:'txtSterbedatum', label:'Sterbedatum'},
        {id:'txtTodeszeit', label:'Sterbezeitpunkt'},
        {id:'txtKm', label:'Strecke (Hin- und Rückfahrt)'}
      ]
    : [
        {id:'txtDatumExcel', label:'Datum Hausbesuch'},
        {id:'txtZeitLS', label:'Uhrzeit Hausbesuch'},
        {id:'txtDatum', label:'Rechnungsdatum'},
        {id:'txtName', label:'Name'},
        {id:'txtPAdresse1', label:'Straße + Hausnummer'},
        {id:'txtPAdresse2', label:'PLZ + Stadt'},
        {id:'txtGeda', label:'Geburtsdatum'},
        {id:'txtKm', label:'Strecke (Hin- und Rückfahrt)'}
      ];

  // Rote "Pflichtfeld fehlt"-Umrandung (siehe btnSpeichern.onclick unten)
  // wieder entfernen, sobald der Nutzer anfängt, das Feld auszufüllen --
  // ohne erneuten Speichern-Klick abwarten zu müssen.
  pflichtfelderKonfig.forEach(({id})=>{
    const el = document.getElementById(id);
    if(el) el.addEventListener('input', ()=>{ if(el.value.trim()) el.classList.remove('pflichtfeld-fehlt'); });
  });
  if(art==='pt'){
    const diagEl0 = document.getElementById('txtDiag');
    if(diagEl0) diagEl0.addEventListener('input', ()=> diagEl0.classList.remove('pflichtfeld-fehlt'));
  }

  // Schnappschuss der Feldwerte GENAU SO, wie die Maske gerade aufgebaut
  // wurde (frisch angelegt mit den Vorbelegungen, oder aus einer Korrektur
  // geladen) -- Grundlage fuer die "noch nicht gespeichert"-Warnung beim
  // Zurückgehen (Pfeil oder Handy-Zurück-Taste), siehe zurueckAusMaske().
  const anfangsWerteJSON = JSON.stringify(werteEinsammeln());
  // BETA: unfertige neue Rechnung laufend sichern, PLZ-Vorschlaege
  betaMaskeErweitern(art, korrekturIdx, vorbelegt, ()=>({ werte: werteEinsammeln(), positionen: positionenAuswahl }), ()=> hatUngespeicherteAenderungen());
  function hatUngespeicherteAenderungen(){
    return JSON.stringify(werteEinsammeln()) !== anfangsWerteJSON;
  }
  // Wie vom Nutzer gewünscht: die Handy-"Zurück"-Taste soll sich genauso
  // verhalten wie der Zurück-Pfeil oben -- nicht die App schließen. Wurden
  // seit dem Öffnen der Maske Werte geändert, ohne dass gespeichert wurde,
  // wird das vor dem Verlassen zur Startseite als Hinweis (mit Wahlmöglich-
  // keit) angezeigt statt die Eingaben stillschweigend zu verwerfen.
  function zurueckAusMaske(){
    // Neu begonnene (noch nicht gespeicherte) Rechnung: aktuellen Stand als
    // Entwurf sichern, BEVOR tatsaechlich navigiert wird -- damit ein Hin-
    // und Herwechseln zur Startseite/den Einstellungen die Eingaben nicht
    // mehr loescht (siehe maskenEntwuerfe oben). Nur relevant, wenn es
    // ueberhaupt etwas zu sichern gibt oder bereits ein Entwurf aktiv war --
    // sonst wuerde sich sonst hier unnoetig ein "leerer" Entwurf mit dem
    // eingefrorenen Default-Datum von heute festsetzen.
    if(korrekturIdx===undefined){
      // BETA: unfertige Rechnung bleibt dauerhaft gesichert (Rechnungsverwaltung, ganz oben)
      if(betaEntwurfSichernAktuell && betaEntwurfSichernAktuell())
        appToastAnzeigen('Als unfertig gesichert – Rechnungsverwaltung, ganz oben.', 2600);
      ruecksprungZiel();
      return;
    }
    if(hatUngespeicherteAenderungen()){
      const hinweisZusatz = korrekturIdx===undefined
        ? 'Die Eingaben bleiben zwischengespeichert, bis die App neu gestartet wird -- beim nächsten Öffnen sind sie wieder da.'
        : 'Beim Zurückgehen gehen die Änderungen verloren.';
      alertBanner(`Diese Rechnung wurde noch nicht gespeichert. ${hinweisZusatz}
        <div class="aktionen">
          <button data-akt="speichern">Jetzt speichern</button>
          <button data-akt="verwerfen">Ohne Speichern zurück</button>
        </div>`);
      const warnEl = document.getElementById('allgemeinerHinweis');
      warnEl.querySelector('[data-akt="speichern"]').onclick = ()=> document.getElementById('btnSpeichern').click();
      warnEl.querySelector('[data-akt="verwerfen"]').onclick = ()=>{ warnEl.innerHTML=''; ruecksprungZiel(); };
      return;
    }
    ruecksprungZiel();
  }

  // Straße-Feld-Verhalten (str->straße + Großschreibung) VOR der
  // Geocoding-Auslösung registrieren, damit die Routen-/PLZ-Suche bereits
  // den korrigierten Straßennamen verwendet.
  document.getElementById('txtPAdresse1').addEventListener('blur', ()=> strasseFeldBlur('txtPAdresse1'));
  if(art==='ls') document.getElementById('txtAdresse1').addEventListener('blur', ()=> strasseFeldBlur('txtAdresse1'));

  // Großschreib-/Straßen-Automatik zusätzlich schon WÄHREND des Tippens
  // (nicht erst beim Verlassen des Feldes) -- 1:1 wie am PC (IstGrossSchreibFeld/
  // IstStrassenFeld): Name + alle Adressfelder bekommen die Großschreibung,
  // die reinen Straßenzeilen zusätzlich die "str"->"straße"-Ausschreibung.
  feldLiveGrossschreibungAnhaengen('txtName', false);
  feldLiveGrossschreibungAnhaengen('txtPAdresse1', true);
  feldLiveGrossschreibungAnhaengen('txtPAdresse2', false);
  if(art==='ls'){
    feldLiveGrossschreibungAnhaengen('txtSterbeAdr1', true);
    feldLiveGrossschreibungAnhaengen('txtSterbeAdr2', false);
    feldLiveGrossschreibungAnhaengen('txtBName', false);
    feldLiveGrossschreibungAnhaengen('txtAdresse1', true);
    feldLiveGrossschreibungAnhaengen('txtAdresse2', false);
  }

  ['txtPAdresse1','txtPAdresse2'].forEach(id=>{
    const el = document.getElementById(id); if(el) el.addEventListener('blur', ()=> kmAutomatikAusloesen());
  });
  // PLZ/Ort-Erkennung wie am PC: beim Verlassen des kombinierten
  // "PLZ + Ort"-Feldes ergänzen/prüfen.
  document.getElementById('txtPAdresse2').addEventListener('blur', ()=> plzOrtPruefen('txtPAdresse1','txtPAdresse2'));

  // Abweichender Sterbeort (nur LS): Auf-/Zuklappen-Button plus dieselbe
  // Straße-/PLZ-Ort-Behandlung wie bei den übrigen Adressfeldern. Ist dieser
  // Block ausgefüllt, gilt ER (nicht die Patientenadresse) als Sterbeort für
  // die Routenberechnung -- wie am PC (AktiverAdressBlock).
  if(art==='ls'){
    const btnSterbeAbw = document.getElementById('btnSterbeAbw');
    const sterbeAbwFelder = document.getElementById('sterbeAbwFelder');
    const sterbeAbwText = document.getElementById('btnSterbeAbwText');
    btnSterbeAbw.onclick = ()=>{
      const offen = !sterbeAbwFelder.classList.contains('versteckt');
      if(offen){
        sterbeAbwFelder.classList.add('versteckt');
        sterbeAbwText.textContent = 'Sterbeort abw.?';
      } else {
        sterbeAbwFelder.classList.remove('versteckt');
        sterbeAbwText.textContent = 'Sterbeort abw. ✕';
        document.getElementById('txtSterbeAdr1').focus();
      }
      kmAutomatikAusloesen();
    };
    document.getElementById('txtSterbeAdr1').addEventListener('blur', ()=> strasseFeldBlur('txtSterbeAdr1'));
    ['txtSterbeAdr1','txtSterbeAdr2'].forEach(id=>{
      document.getElementById(id).addEventListener('blur', ()=> kmAutomatikAusloesen());
    });
    document.getElementById('txtSterbeAdr2').addEventListener('blur', ()=> plzOrtPruefen('txtSterbeAdr1','txtSterbeAdr2'));
  }
  document.getElementById('txtDatumExcel').addEventListener('blur', ()=>{ datumFeldBlur('txtDatumExcel'); automatikVorschauAktualisieren(); });
  document.getElementById('txtDatum').addEventListener('blur', ()=> datumFeldBlur('txtDatum'));
  // KORREKTUR: dieses Feld ist im DOM das letzte VOR einem schreibgeschuetzten
  // (readonly) Betrag-Feld -- das Handy erkennt readonly-Felder nicht als
  // "naechstes Feld" und zeigt deshalb von sich aus "Öffnen"/"Los" statt
  // "Weiter" auf der Bildschirmtastatur. "enterkeyhint" erzwingt hier
  // ausdruecklich "Weiter" (Beschriftung), der Enter-Handler uebernimmt
  // zusaetzlich die eigentliche Sprungfunktion (springt zum naechsten
  // ECHTEN Eingabefeld -- Name des Patienten -- statt ins readonly-Feld).
  document.getElementById('txtDatum').setAttribute('enterkeyhint', 'next');
  document.getElementById('txtDatum').addEventListener('keydown', (ev)=>{
    if(ev.key==='Enter'){ ev.preventDefault(); document.getElementById('txtName')?.focus(); }
  });
  // Geburtsdatum hatte bisher KEINEN Blur-Handler -- die Kurzeingabe-
  // Ergänzung/Normalisierung (z.B. "1.1.99" -> "01.01.1999") lief hier also
  // nie, im Unterschied zu allen anderen Datumsfeldern. Bewusst weiterhin
  // OHNE die Jahres-Plausibilitätsprüfung (pruefeJahrFeld) -- die gilt am
  // PC (JahrDialog: "If istGeda Then ... Exit Function") ausdrücklich NICHT
  // fürs Geburtsdatum, da es naturgemäß weit vom aktuellen Jahr abweicht.
  document.getElementById('txtGeda').addEventListener('blur', ()=> datumFeldBlur('txtGeda'));
  // txtZeitLS existiert in BEIDEN Masken (LS: "Zeitpunkt Leichenschau",
  // PT: "Uhrzeit Hausbesuch") -- Format-Pruefung gilt daher fuer beide.
  document.getElementById('txtZeitLS').addEventListener('blur', ()=>{ zeitFeldBlur('txtZeitLS'); automatikVorschauAktualisieren(); });
  // km-Feld: exakt wie am PC (Txt_Change setzt dort NUR gKmGetippt=True,
  // die eigentliche Neuinterpretation + Live-Neuberechnung der Positionen
  // passiert erst beim Verlassen des Feldes ueber KmFeldManuellUebernehmen/
  // AutoAktualisierenLive -- siehe FeldFokus/AktualisiereAktivNachTab).
  // "Eingetippt" wird über das 'input'-Ereignis erkannt, das bei einem
  // programmatischen .value-Setzen (Routenberechnung, Alternativrouten-
  // Kachel) nicht feuert -- so wird ein bereits korrekt gesetzter Wert beim
  // Verlassen des Feldes nicht nochmal (falsch) neu interpretiert.
  (function(){
    const kmEl = document.getElementById('txtKm');
    kmEl.addEventListener('focus', ()=>{ kmVorFokus = kmEl.value; });
    kmEl.addEventListener('input', ()=>{ kmManuellGetippt = true; });

    // "Adresse einlesen": die in Google Maps als EINE Zeile kopierte Adresse
    // direkt (ohne manuelles Aufteilen) in Straße+Hausnummer / PLZ+Stadt
    // übernehmen.
    document.getElementById('btnBestatterAdresseEinlesen').onclick = async ()=>{
      const hinweisEl = document.getElementById('bestatterAdresseHinweis');
      const zeigeHinweis = (txt)=>{ if(!txt){ hinweisEl.classList.remove('aktiv'); hinweisEl.innerHTML=''; return; } hinweisEl.innerHTML = txt; hinweisEl.classList.add('aktiv'); };
      zeigeHinweis('');
      let text = '';
      try{ text = await navigator.clipboard.readText(); }
      catch(e){ zeigeHinweis('Zwischenablage konnte nicht gelesen werden. Bitte Berechtigung erteilen oder Text manuell einfügen.'); return; }
      if(!text || !text.trim()){ zeigeHinweis('Die Zwischenablage ist leer.'); return; }
      // Steht vor der Adresse ein Name (z.B. aus Google Maps kopiert:
      // "Bestattungen Heck\nHauptstr. 5, 76571 Gaggenau"), wird er mit uebernommen.
      // Bereits ausgefuellte Felder werden immer ueberschrieben.
      const teileRoh = text.trim().replace(/\r/g, '').split(/\n|,/).map(x=> x.trim()).filter(Boolean);

    };

    const diagEl = document.getElementById('txtDiag');

    // BETA: beim Tippen Suchfeld nach oben schieben, damit die Trefferliste

    if(window.visualViewport) window.visualViewport.addEventListener('resize', ()=>{ if(document.activeElement === diagEl) diagNachOben(); });
    // Freie Diagnosen: nicht jede Diagnose steht im ICD-Katalog (bzw. ist
    // dort noch nicht erfasst) -- deshalb wird zusätzlich zu den
    // Katalog-Treffern immer eine "als Freitext übernehmen"-Option

    function diagnoseUebernehmen(txt){
      txt = (txt||'').trim();
