/* ==========================================================
   Rechnungspositionen-Auswahl (gemeinsame Ansicht für LS/PT)
   ========================================================== */
function ansichtPositionen(art, ausgewaehlteZiffern, betragSchaetzung, weiter, kmFahrstreckeGesamt){
  // FIX: vorher wurde hier "null" als zurueckZiel übergeben -- dadurch war
  // weder der Pfeil oben sichtbar, noch sprang die Handy-"Zurück"-Taste
  // sinnvoll zur Maske zurück; stattdessen griff die allgemeine "nicht auf
  // dem Hauptbildschirm"-Absicherung und sprang OHNE Rückfrage direkt zum
  // Startbildschirm (Gefahr von Datenverlust). ruecksprungAusEinstellungen
  // wurde vom Aufrufer (btnPunkte.onclick) bereits passend auf die Maske
  // (mit Schnappschuss der Maskenwerte) gesetzt, bevor diese Ansicht
  // aufgebaut wurde -- genau diese Funktion jetzt tatsächlich als
  // zurueckZiel verwenden (als Closure, damit ein späteres Neusetzen von
  // ruecksprungAusEinstellungen -- z.B. über das Zahnrad -- respektiert wird).
  setzeTitel('Rechnungspositionen', ()=>ruecksprungAusEinstellungen());
  aktuellerZurueckHandler = ()=>{ vorbereiteRuecksprung(); ruecksprungAusEinstellungen(); };
  const katalog = art==='ls' ? POSITIONEN_LS : POSITIONEN_PT;
  // Zeitzuschläge (F/G/H) und Wegegeld/Reiseentschädigung sind wie am PC
  // rein automatisch bestimmte Kategorien ("ZuschlagAuto"/"WegegeldAuto") --
  // sie werden von automatischeAuswahl() anhand Datum/Uhrzeit/km bestimmt
  // und sind bewusst NICHT manuell anwählbar (ausgegraut/gesperrt), damit
  // hier nichts abweichend vom errechneten Ergebnis angehakt werden kann.
  // Reiseentschädigung wie am PC (AutoZeileEinfuegen "##KM##"): Beschriftung
  // und Betrag zeigen zusätzlich die km-abhängige 26-ct-Zeile mit an.
  const reise = reiseGesamtBetrag(kmFahrstreckeGesamt);
  const reiseBez = reise.kmGerundet>0
    ? `${REISEENTSCHAEDIGUNG.bez} (${reise.basis.toFixed(2).replace('.',',')} &euro;) + Wegstrecke ${reise.kmGerundet} km &times; 0,26 &euro;/km (${reise.kmZeile.toFixed(2).replace('.',',')} &euro;)`
    : `${REISEENTSCHAEDIGUNG.bez} (zzgl. 0,26 &euro;/km Wegstrecke, sobald km bekannt)`;
  // Gruppierung/Beschriftung wie am PC (SektionVonPunkt): "Grundpauschalen"
  // statt "Grundleistung"; "E" ist inhaltlich kein Zeitzuschlag, wird aber
  // zusammen mit F/G/H unter "Zeitzuschläge" geführt (bleibt aber -- anders
  // als F/G/H -- manuell anhakbar); Wegegeld-Staffeln (Tag/Nacht) UND
  // Reiseentschädigung fallen am PC unter EINE gemeinsame Überschrift
  // "Wegegeld" statt mehrerer separater Abschnitte.
  const eEintrag = (katalog.grundleistung||[]).find(p=>p.ziffer==='E');
  // KORREKTUR: die eigentliche Grundpauschale (101 bei LS, 50 bei PT --
  // erkennbar an "standard:true", automatischeAuswahl() haengt sie ja auch
  // immer von selbst an) ist genau wie am PC KEINE manuell abwaehlbare
  // Position, sondern zwingend fester Bestandteil jeder Rechnung -- muss
  // also genau wie Zeitzuschlaege/Wegegeld ausgegraut und angehakt bleiben.
  // Nur die weiteren Grundpauschalen-Positionen (z.B. 102, Zuschlag bei
  // unbekannter Identitaet) bleiben bewusst manuell an-/abwaehlbar.
  const grundOhneE = (katalog.grundleistung||[]).filter(p=>p.ziffer!=='E')
    .map(p=> p.standard ? {...p, automatisch:true} : p);
  const gruppen = [
    {titel:'Grundpauschalen', liste: grundOhneE, automatisch:false},
    {titel:'Zeitzuschläge', liste: eEintrag ? [{...eEintrag, automatisch:false}, ...ZUSCHLAEGE_ZEIT] : ZUSCHLAEGE_ZEIT, automatisch:true},
    {titel:'Wegegeld', liste: [...WEGEGELD_TAG, ...WEGEGELD_NACHT, {ziffer:'REISE', bez:reiseBez, betrag:reise.gesamt}], automatisch:true}
  ];
  let html = `<div class="maske ${art}">`;
  gruppen.forEach(g=>{
    // Enthaelt eine Gruppe manuell UND automatisch bestimmte Positionen
    // (z.B. "E" innerhalb "Zeitzuschläge"), wird "automatisch" nicht mehr
    // pauschal in der Zwischenüberschrift, sondern je Position angezeigt.
    const gemischt = g.liste.some(p => typeof p.automatisch==='boolean' && p.automatisch!==g.automatisch);
    html += `<div class="positionen-gruppe-titel">${g.titel}${(g.automatisch && !gemischt)?' <span class="auto-hinweis">automatisch</span>':''}</div>`;
    g.liste.forEach(p=>{
      const istAuto = (typeof p.automatisch==='boolean') ? p.automatisch : g.automatisch;
      const checked = ausgewaehlteZiffern.has(p.ziffer) ? 'checked' : '';
      const gesperrt = istAuto ? 'disabled' : '';
      html += `<label class="position-zeile${istAuto?' auto-gesperrt':''}">
        <input type="checkbox" data-ziffer="${p.ziffer}" data-betrag="${p.betrag}" data-auto="${istAuto?'1':'0'}" ${checked} ${gesperrt}>
        <div class="haupt"><span class="ziffer">${p.ziffer||''}</span> ${p.bez}${gemischt&&istAuto?' <span class="auto-hinweis">automatisch</span>':''}</div>
        <div class="betrag">${p.betrag.toFixed(2).replace('.',',')} &euro;</div>
      </label>`;
    });
  });
  html += `<div class="summenzeile"><span>Gesamt</span><span id="posSumme">0,00 &euro;</span></div>`;
  html += `<button class="btn-primaer" id="btnPositionenFertig">Übernehmen</button>`;
  html += `</div>`;
  app.innerHTML = html;

  function summeBerechnen(){
    let summe=0;
    app.querySelectorAll('.position-zeile input:checked').forEach(cb=> summe += parseFloat(cb.dataset.betrag));
    document.getElementById('posSumme').textContent = summe.toFixed(2).replace('.',',')+' €';
    return summe;
  }

  // Gegenseitige Ausschlüsse (nur PT, 1:1 wie am PC/AusschluesseAktualisieren):
  // ist eine Ziffer aktiv -- egal ob manuell angehakt oder als Grundleistung
  // fest -- werden alle mit ihr unvereinbaren Positionen gesperrt und
  // automatisch abgehakt.
  function ausschluesseAktualisieren(){
    if(art!=='pt') return;
    const boxen = Array.from(app.querySelectorAll('.position-zeile input'));
    const aktive = new Set(boxen.filter(cb=>cb.checked).map(cb=>cb.dataset.ziffer));
    boxen.forEach(cb=>{
      // Automatik-Kategorien (Zeitzuschlag/Wegegeld/Reise) bleiben immer
      // gesperrt -- die Ausschluss-Logik betrifft nur die manuell wählbaren
      // Grundleistungs-Positionen.
      if(cb.dataset.auto==='1') return;
      const ausschluesse = ZIFFER_AUSSCHLUESSE[cb.dataset.ziffer];
      const zeile = cb.closest('.position-zeile');
      if(!ausschluesse){ cb.disabled=false; if(zeile) zeile.style.opacity=''; return; }
      const gesperrt = ausschluesse.some(z=> aktive.has(z));
      if(gesperrt && cb.checked) cb.checked = false;
      cb.disabled = gesperrt;
      if(zeile) zeile.style.opacity = gesperrt ? '0.45' : '';
    });
  }

  function positionAktualisieren(){ ausschluesseAktualisieren(); summeBerechnen(); }
  app.querySelectorAll('.position-zeile input').forEach(cb=> cb.addEventListener('change', positionAktualisieren));
  positionAktualisieren();

  document.getElementById('btnPositionenFertig').onclick = ()=>{
    const gewaehlt = new Set();
    let summe=0;
    app.querySelectorAll('.position-zeile input:checked').forEach(cb=>{ gewaehlt.add(cb.dataset.ziffer); summe += parseFloat(cb.dataset.betrag); });
    weiter(gewaehlt, summe);
  };
}

/* ==========================================================
   LS- / PT-Maske
   ========================================================== */
function ansichtMaske(art, korrekturIdx, vorbelegt){
  einstellungenOffen = false;
  // WICHTIG: vorbereiteRuecksprung() wird vom Zahnrad-Klick-Handler
  // aufgerufen, SOLANGE diese Maske noch angezeigt wird (also bevor auf
  // Einstellungen umgeschaltet wird) -- werteEinsammeln() liest dann noch
  // aus den echten, vorhandenen Maskenfeldern. Ein "fauler" Aufruf erst
  // beim Zurückspringen aus den Einstellungen würde stattdessen aus dem
  // (falschen) Einstellungen-DOM lesen und dort hängen bleiben.
  vorbereiteRuecksprung = ()=>{
    const snap = werteEinsammeln();
    ruecksprungAusEinstellungen = ()=>ansichtMaske(art, korrekturIdx, {werte: snap, positionen: positionenAuswahl});
  };
  // Wurde die Maske aus der Rechnungsübersicht heraus geöffnet (Klick auf
  // eine bestehende Rechnung -- erkennbar an gesetztem korrekturIdx), soll
  // "Zurück" (Pfeil, Handy-Taste ODER nach dem Speichern) auch wieder dahin
  // zurückführen statt immer auf die Startseite. Bei einer neu angelegten
  // Rechnung (kein korrekturIdx, ueber die Kacheln Leichenschau/Privat-
  // rechnung gestartet) bleibt es bei der Startseite.
  const ruecksprungZiel = korrekturIdx!==undefined ? ansichtKorrigieren : ansichtStart;
  setzeTitel(art==='ls' ? 'Leichenschau' : 'Privatrechnung', zurueckAusMaske);
  let werte = {};
  let positionenAuswahl = null;
  // Wie am PC (gManuellModus): '' = automatisch (50-km-Regel entscheidet
  // Wegegeld vs. Reiseentschädigung), 'REISE' = Nutzer hat bewusst eine
  // Fahrstrecke-Kachel als Reiseentschädigung gewählt, 'LUFTLINIE' = Nutzer
  // hat bewusst die Luftlinie-Kachel gewählt (überspringt die 50-km-Regel).
  // Wird bei jeder automatischen Neuberechnung (kmAutomatikAusloesen) wieder
  // auf '' zurückgesetzt, genau wie am PC (KmBerechnen setzt gManuellModus
  // ebenfalls vor jeder Neuberechnung zurück).
  let manuellerModus = '';
  // Analog zu PC gKmGetippt: unterscheidet echtes Eintippen ins km-Feld
  // (löst beim Verlassen des Feldes die 25/50-km-Interpretation aus) von
  // einem programmatischen Setzen des Werts (Routenberechnung, Alternativ-
  // routen-Kachel, Fallwiederherstellung) -- Letzteres feuert kein 'input'.
  let kmManuellGetippt = false;
  let kmVorFokus = '';
  if(vorbelegt){
    werte = {...vorbelegt.werte};
    positionenAuswahl = vorbelegt.positionen || null;
  } else if(korrekturIdx!==undefined){
    const gespeichert = ladeFaelle(art)[korrekturIdx];
    werte = {...gespeichert.werte};
    positionenAuswahl = gespeichert.positionen ? new Set(gespeichert.positionen) : null;
  } else if(maskenEntwuerfe[art]){
    // Neu begonnene Rechnung: vorhandenen, noch nicht gespeicherten Entwurf
    // (siehe maskenEntwuerfe oben) wiederherstellen statt erneut die
    // Standard-Vorbelegung (heutiges Datum etc.) zu setzen -- genau das
    // ermoeglicht das gewuenschte Hin- und Herwechseln ohne Datenverlust.
    werte = {...maskenEntwuerfe[art].werte};
    positionenAuswahl = maskenEntwuerfe[art].positionen ? new Set(maskenEntwuerfe[art].positionen) : null;
  } else {
    // Vorbelegung wie am PC (RechnungsdatumVorbelegen: Rechnungsdatum =
    // naechster Werktag nach dem Datum der Todesbescheinigung/des
    // Hausbesuchs, das seinerseits mit dem heutigen Datum vorbelegt ist;
    // UserForm_Initialize: Sterbedatum bei LS ebenfalls mit heute vorbelegt).
    const heute = heuteAlsText();
    werte = {txtDatum: naechsterWerktagText(heute), txtDatumExcel: heute};
    if(art==='ls') werte.txtSterbedatum = heute;
  }
  // Mehrfach-Diagnosen (nur PT) -- analog zu gDiagnosen am PC: je Eintrag
  // {text:"Beschreibung [Code]", flags:"" / "G" / "V" / "GV"}.
  let diagnosen = Array.isArray(werte.diagnosen) ? werte.diagnosen.map(d=>({...d})) : [];

  const ctx = {
    setValue(name, val){ const el=document.getElementById(name); if(el) el.value = val; },
    getValue(name){ const el=document.getElementById(name); return el? el.value : ''; },
    hinweis(text){ alertBanner(text); },
    async adresseVerlassen(){ await plzOrtPruefen('txtPAdresse1','txtPAdresse2'); await kmAutomatikAusloesen(); },
    allePruefungenAusfuehren(){ alleChecksAusfuehren(); }
  };

  function feldHtml(labelText, name, opts={}){
    const val = werte[name] || '';
    const grauKlasse = opts.grau ? 'grau' : '';
    return `<div class="feld">
      <label for="${name}">${labelText}</label>
      <input type="text" id="${name}" class="${grauKlasse}" value="${val.replace(/"/g,'&quot;')}" placeholder="${opts.platzhalter||''}">
      <div class="warnhinweis" id="${name}_warn"></div>
    </div>`;
  }

  let html = `<div class="maske ${art}">`;
  // Jeder Abschnitt wird in eine eigene "Karte" (.abschnitt) gepackt, damit
  // die Bereiche der Maske optisch klar voneinander getrennt sind, statt
  // nur durch eine kleine Textzeile.
  const abschnitt = (titel, inhalt) => `<div class="abschnitt"><div class="trennlinie">${titel}</div>${inhalt}</div>`;

  if(art==='ls'){
    html += abschnitt('Todesfeststellung',
      feldHtml('Datum Todesbescheinigung', 'txtDatumExcel', {typ:'datum'}) +
      feldHtml('Zeitpunkt Leichenschau (HH:MM)', 'txtZeitLS'));
  } else {
    html += abschnitt('Hausbesuch',
      feldHtml('Datum Hausbesuch', 'txtDatumExcel', {typ:'datum'}) +
      feldHtml('Uhrzeit Hausbesuch (HH:MM)', 'txtZeitLS'));
  }

  html += abschnitt('Rechnungsstellung',
    feldHtml('Rechnungsdatum (Versanddatum)', 'txtDatum') +
    `<div class="feld"><label>Rechnungsbetrag (&euro;)</label>
      <input type="text" id="txtBetrag" class="grau" value="${werte.txtBetrag||''}" readonly></div>`);

  // Abweichender Sterbeort (nur LS): wie am PC standardmäßig eingeklappt,
  // aber automatisch aufgeklappt, wenn schon Werte dafür gespeichert sind
  // (z.B. beim erneuten Öffnen eines korrigierten Falls).
  const sterbeAbwOffen = art==='ls' && !!((werte.txtSterbeAdr1||'').trim() || (werte.txtSterbeAdr2||'').trim());

  html += abschnitt('Patient',
    `<button class="btn-primaer blass" id="btnZwischenablage">Aus Zwischenablage einlesen</button>` +
    `<div class="warnhinweis" id="zwischenablageHinweis"></div>` +
    feldHtml('Nachname, Vorname', 'txtName') +
    feldHtml(art==='ls' ? 'Straße + Hausnummer (Sterbeort)' : 'Straße + Hausnummer', 'txtPAdresse1') +
    (art==='ls' ? `
      <div class="feld-zeile-mit-btn">
        <div class="feld">
          <label for="txtPAdresse2">PLZ + Stadt (Sterbeort)</label>
          <input type="text" id="txtPAdresse2" value="${(werte.txtPAdresse2||'').replace(/"/g,'&quot;')}">
        </div>
        <button type="button" class="btn-inline-blass" id="btnSterbeAbw">
          <span id="btnSterbeAbwText">${sterbeAbwOffen ? 'Sterbeort abw. ✕' : 'Sterbeort abw.?'}</span>
        </button>
      </div>
      <div class="warnhinweis" id="txtPAdresse2_warn"></div>
      <div id="sterbeAbwFelder" class="${sterbeAbwOffen ? '' : 'versteckt'}">
        ${feldHtml('Straße + Hausnummer (Sterbeort, abw.)', 'txtSterbeAdr1')}
        ${feldHtml('PLZ + Stadt (Sterbeort, abw.)', 'txtSterbeAdr2')}
      </div>` : feldHtml('PLZ + Stadt', 'txtPAdresse2')) +
    feldHtml('Geburtsdatum (TT.MM.JJJJ)', 'txtGeda'));

  if(art==='ls'){
    html += abschnitt('Sterbedaten',
      feldHtml('Sterbedatum (TT.MM.JJJJ)', 'txtSterbedatum') +
      feldHtml('Sterbezeitpunkt (HH:MM)', 'txtTodeszeit'));
  } else {
    html += abschnitt('Diagnose (ICD-Suche)',
      `<div id="diagChips"></div>` +
      `<div class="feld" style="position:relative;">
        <label for="txtDiag">Diagnose suchen</label>
        <input type="text" id="txtDiag" autocomplete="off" placeholder="ab 2 Zeichen tippen...">
        <div class="autocomplete-liste" id="diagVorschlaege"></div>
      </div>`);
  }

  html += abschnitt('Routenberechnung',
    `<div class="feld"><label id="txtKm_label" for="txtKm">Strecke (Hin- und Rückfahrt)</label>
      <input type="text" id="txtKm" value="${(werte.txtKm||'')}" placeholder="wird automatisch berechnet">
      <input type="hidden" id="txtKmFahrstrecke" value="${(werte.txtKmFahrstrecke||werte.txtKm||'')}">
      <input type="hidden" id="txtKmLuftlinie" value="${(werte.txtKmLuftlinie||'')}">
      <div class="streckeninfo" id="streckeninfo"></div>
      <div class="warnhinweis" id="txtKm_warn"></div>
      <div class="route-btn-reihe">
        <button type="button" id="btnAlternativrouten">Alternativrouten</button>
        <button type="button" id="btnGoogleMapsRoute">Google Maps Route</button>
      </div>
      <div class="routenoptionen" id="routenoptionen"></div>
    </div>`);

  if(art==='ls'){
    html += abschnitt('Bestattungsunternehmen',
      `<div class="feld" style="position:relative;">
        <label for="txtBName">Name</label>
        <input type="text" id="txtBName" value="${(werte.txtBName||'').replace(/"/g,'&quot;')}" autocomplete="off">
        <div class="autocomplete-liste" id="bestatterVorschlaege"></div>
        <div class="warnhinweis" id="txtBName_warn"></div>
      </div>
      <div class="route-btn-reihe">
        <button type="button" id="btnBestatterMaps">Google Maps öffnen</button>
        <button type="button" id="btnBestatterAdresseEinlesen">Adresse einlesen</button>
      </div>
      <div class="warnhinweis" id="bestatterAdresseHinweis"></div>` +
      feldHtml('Straße + Hausnummer', 'txtAdresse1') +
      feldHtml('PLZ + Stadt', 'txtAdresse2'));
  }

  html += abschnitt('Rechnungspositionen',
    `<button class="btn-primaer blass" id="btnPunkte">Rechnungspositionen auswählen
      <span class="unter" id="punkteStatus">${positionenAuswahl? positionenAuswahl.size+' Position(en) ausgewählt' : 'noch nicht geprüft'}</span></button>`);

  html += `<div id="allgemeinerHinweis"></div>`;
  html += `<button class="btn-primaer" id="btnSpeichern">Speichern</button>`;
  html += `</div>`;

  app.innerHTML = html;

  const feldIds = art==='ls'
    ? ['txtDatumExcel','txtZeitLS','txtDatum','txtName','txtPAdresse1','txtPAdresse2','txtSterbeAdr1','txtSterbeAdr2','txtGeda','txtSterbedatum','txtTodeszeit','txtKm','txtKmFahrstrecke','txtKmLuftlinie','txtBName','txtAdresse1','txtAdresse2']
    : ['txtDatumExcel','txtZeitLS','txtDatum','txtName','txtPAdresse1','txtPAdresse2','txtGeda','txtKm','txtKmFahrstrecke','txtKmLuftlinie'];

  // Pflichtfelder je Maskentyp (siehe btnSpeichern.onclick unten) -- ALLE
  // Felder, die tatsächlich ausgefüllt werden sollen, nicht nur die
  // ursprünglichen 3 (Name/Adresse/Datum). Grund: es konnte z.B. eine PT
  // ohne Uhrzeit Hausbesuch und ohne Geburtsdatum gespeichert werden, was
  // nicht passieren darf. txtKmLuftlinie bleibt bewusst außen vor (verstecktes
  // Begleitfeld zu txtKm, wird zusammen mit diesem automatisch gesetzt,
  // kann nicht separat rot umrandet werden). "Abweichender Sterbeort"
  // (txtSterbeAdr1/2, nur bei Bedarf aufgeklappt) und die Bestatter-Adresse
  // bleiben ebenfalls bewusst NICHT hart Pflicht -- das entspricht der
  // PC-Logik (bestatterKomplettLeer darf bewusst leer bleiben, siehe
  // pruefeBestatterLeer).
  const pflichtfelderKonfig = art==='ls'
    ? [
        {id:'txtDatumExcel', label:'Datum Todesbescheinigung'},
        {id:'txtZeitLS', label:'Zeitpunkt Leichenschau'},
        {id:'txtDatum', label:'Rechnungsdatum'},
        {id:'txtName', label:'Name'},
        {id:'txtPAdresse1', label:'Straße + Hausnummer (Sterbeort)'},
        {id:'txtPAdresse2', label:'PLZ + Stadt (Sterbeort)'},
        {id:'txtGeda', label:'Geburtsdatum'},
        {id:'txtSterbedatum', label:'Sterbedatum'},
        {id:'txtTodeszeit', label:'Sterbezeitpunkt'},
        {id:'txtKm', label:'Strecke (Hin- und Rückfahrt)'}
      ]
    : [
        {id:'txtDatumExcel', label:'Datum Hausbesuch'},
        {id:'txtZeitLS', label:'Uhrzeit Hausbesuch'},
        {id:'txtDatum', label:'Rechnungsdatum'},
        {id:'txtName', label:'Name'},
        {id:'txtPAdresse1', label:'Straße + Hausnummer'},
        {id:'txtPAdresse2', label:'PLZ + Stadt'},
        {id:'txtGeda', label:'Geburtsdatum'},
        {id:'txtKm', label:'Strecke (Hin- und Rückfahrt)'}
      ];

  // Rote "Pflichtfeld fehlt"-Umrandung (siehe btnSpeichern.onclick unten)
  // wieder entfernen, sobald der Nutzer anfängt, das Feld auszufüllen --
  // ohne erneuten Speichern-Klick abwarten zu müssen.
  pflichtfelderKonfig.forEach(({id})=>{
    const el = document.getElementById(id);
    if(el) el.addEventListener('input', ()=>{ if(el.value.trim()) el.classList.remove('pflichtfeld-fehlt'); });
  });
  if(art==='pt'){
    const diagEl0 = document.getElementById('txtDiag');
    if(diagEl0) diagEl0.addEventListener('input', ()=> diagEl0.classList.remove('pflichtfeld-fehlt'));
  }

  // Schnappschuss der Feldwerte GENAU SO, wie die Maske gerade aufgebaut
  // wurde (frisch angelegt mit den Vorbelegungen, oder aus einer Korrektur
  // geladen) -- Grundlage fuer die "noch nicht gespeichert"-Warnung beim
  // Zurückgehen (Pfeil oder Handy-Zurück-Taste), siehe zurueckAusMaske().
  const anfangsWerteJSON = JSON.stringify(werteEinsammeln());
  function hatUngespeicherteAenderungen(){
    return JSON.stringify(werteEinsammeln()) !== anfangsWerteJSON;
  }
  // Wie vom Nutzer gewünscht: die Handy-"Zurück"-Taste soll sich genauso
  // verhalten wie der Zurück-Pfeil oben -- nicht die App schließen. Wurden
  // seit dem Öffnen der Maske Werte geändert, ohne dass gespeichert wurde,
  // wird das vor dem Verlassen zur Startseite als Hinweis (mit Wahlmöglich-
  // keit) angezeigt statt die Eingaben stillschweigend zu verwerfen.
  function zurueckAusMaske(){
    // Neu begonnene (noch nicht gespeicherte) Rechnung: aktuellen Stand als
    // Entwurf sichern, BEVOR tatsaechlich navigiert wird -- damit ein Hin-
    // und Herwechseln zur Startseite/den Einstellungen die Eingaben nicht
    // mehr loescht (siehe maskenEntwuerfe oben). Nur relevant, wenn es
    // ueberhaupt etwas zu sichern gibt oder bereits ein Entwurf aktiv war --
    // sonst wuerde sich sonst hier unnoetig ein "leerer" Entwurf mit dem
    // eingefrorenen Default-Datum von heute festsetzen.
    if(korrekturIdx===undefined && (hatUngespeicherteAenderungen() || maskenEntwuerfe[art])){
      maskenEntwuerfe[art] = {werte: werteEinsammeln(), positionen: positionenAuswahl};
    }
    if(hatUngespeicherteAenderungen()){
      const hinweisZusatz = korrekturIdx===undefined
        ? 'Die Eingaben bleiben zwischengespeichert, bis die App neu gestartet wird -- beim nächsten Öffnen sind sie wieder da.'
        : 'Beim Zurückgehen gehen die Änderungen verloren.';
      alertBanner(`Diese Rechnung wurde noch nicht gespeichert. ${hinweisZusatz}
        <div class="aktionen">
          <button data-akt="speichern">Jetzt speichern</button>
          <button data-akt="verwerfen">Ohne Speichern zurück</button>
        </div>`);
      const warnEl = document.getElementById('allgemeinerHinweis');
      warnEl.querySelector('[data-akt="speichern"]').onclick = ()=> document.getElementById('btnSpeichern').click();
      warnEl.querySelector('[data-akt="verwerfen"]').onclick = ()=>{ warnEl.innerHTML=''; ruecksprungZiel(); };
      return;
    }
    ruecksprungZiel();
  }

  // Straße-Feld-Verhalten (str->straße + Großschreibung) VOR der
  // Geocoding-Auslösung registrieren, damit die Routen-/PLZ-Suche bereits
  // den korrigierten Straßennamen verwendet.
  document.getElementById('txtPAdresse1').addEventListener('blur', ()=> strasseFeldBlur('txtPAdresse1'));
  if(art==='ls') document.getElementById('txtAdresse1').addEventListener('blur', ()=> strasseFeldBlur('txtAdresse1'));

  ['txtPAdresse1','txtPAdresse2'].forEach(id=>{
    const el = document.getElementById(id); if(el) el.addEventListener('blur', ()=> kmAutomatikAusloesen());
  });
  // PLZ/Ort-Erkennung wie am PC: beim Verlassen des kombinierten
  // "PLZ + Ort"-Feldes ergänzen/prüfen.
  document.getElementById('txtPAdresse2').addEventListener('blur', ()=> plzOrtPruefen('txtPAdresse1','txtPAdresse2'));

  // Abweichender Sterbeort (nur LS): Auf-/Zuklappen-Button plus dieselbe
  // Straße-/PLZ-Ort-Behandlung wie bei den übrigen Adressfeldern. Ist dieser
  // Block ausgefüllt, gilt ER (nicht die Patientenadresse) als Sterbeort für
  // die Routenberechnung -- wie am PC (AktiverAdressBlock).
  if(art==='ls'){
    const btnSterbeAbw = document.getElementById('btnSterbeAbw');
    const sterbeAbwFelder = document.getElementById('sterbeAbwFelder');
    const sterbeAbwText = document.getElementById('btnSterbeAbwText');
    btnSterbeAbw.onclick = ()=>{
      const offen = !sterbeAbwFelder.classList.contains('versteckt');
      if(offen){
        sterbeAbwFelder.classList.add('versteckt');
        sterbeAbwText.textContent = 'Sterbeort abw.?';
      } else {
        sterbeAbwFelder.classList.remove('versteckt');

  // KORREKTUR: dieses Feld ist im DOM das letzte VOR einem schreibgeschuetzten

    // "Google Maps öffnen": Adresse des Bestatters dort nachschlagen (Suche

  if(art==='pt'){
    function diagnosenRendern(){
      const el = document.getElementById('diagChips');
      // Sobald mindestens eine Diagnose gewählt ist, gilt das Pflichtfeld
      // als erfüllt -- rote Umrandung (siehe btnSpeichern.onclick) direkt

      const diagFeld = document.getElementById('txtDiag');

      el.innerHTML = diagnosen.map((d,i)=>`
        <div class="diag-chip" data-idx="${i}">
          <label><input type="checkbox" class="chipG" data-idx="${i}" ${d.flags.indexOf('G')>=0?'checked':''}> G</label>
          <label><input type="checkbox" class="chipV" data-idx="${i}" ${d.flags.indexOf('V')>=0?'checked':''}> V</label>
          <div class="chip-text">${d.text}</div>
          <button type="button" class="chip-del" data-idx="${i}">&#10005;</button>
        </div>`).join('');
      el.querySelectorAll('.chipG').forEach(cb=> cb.onchange = ()=>{
        const i=+cb.dataset.idx; let f=diagnosen[i].flags;
        f = cb.checked ? (f.indexOf('G')>=0?f:f+'G') : f.replace('G','');
        diagnosen[i].flags = f;
      });
      el.querySelectorAll('.chipV').forEach(cb=> cb.onchange = ()=>{
        const i=+cb.dataset.idx; let f=diagnosen[i].flags;
        f = cb.checked ? (f.indexOf('V')>=0?f:f+'V') : f.replace('V','');
        diagnosen[i].flags = f;
      });
      el.querySelectorAll('.chip-del').forEach(btn=> btn.onclick = ()=>{
        diagnosen.splice(+btn.dataset.idx,1);
        diagnosenRendern();
      });

    diagnosenRendern();

    const diagEl = document.getElementById('txtDiag');
    const diagListe = document.getElementById('diagVorschlaege');
    // Freie Diagnosen: nicht jede Diagnose steht im ICD-Katalog (bzw. ist
    // dort noch nicht erfasst) -- deshalb wird zusätzlich zu den
    // Katalog-Treffern immer eine "als Freitext übernehmen"-Option
    // angeboten, sobald mind. 2 Zeichen eingetippt sind und der Text nicht
    // schon exakt einem Treffer entspricht. Enter (Bildschirmtastatur
    // "Weiter"/"Fertig") übernimmt den eingetippten Text ebenfalls direkt.
    function diagnoseUebernehmen(txt){
      txt = (txt||'').trim();
      if(!txt) return;
      if(!diagnosen.some(dd=>dd.text.toLowerCase()===txt.toLowerCase())){
        diagnosen.push({text:txt, flags:''});
        diagnosenRendern();

      diagEl.value=''; diagListe.classList.remove('aktiv'); diagListe.innerHTML='';
    }

      if(q.length>=2 && !treffer.some(t=>t.toLowerCase()===q.toLowerCase())){
        html += `<div class="diag-freitext" data-txt="${q.replace(/"/g,'&quot;')}">&#10133; "${q}" als Freitext übernehmen</div>`;
      }
      if(!html){ diagListe.classList.remove('aktiv'); diagListe.innerHTML=''; return; }
      diagListe.innerHTML = html;
      diagListe.classList.add('aktiv');
      diagListe.querySelectorAll('div').forEach(d=>{

  // Wie am PC (AktiverAdressBlock): ermittelt die aktuell fuer die Route
  // massgebliche Zieladresse. Bei LS geht ein bereits bekanntes
  // Bestattungsunternehmen vor, danach ein abweichender Sterbeort, sonst die
  // Patientenadresse; bei PT immer die Patientenadresse. Wird sowohl von der
  // automatischen km-Berechnung als auch von den Routen-Buttons genutzt.
  // KORREKTUR: die Bestatter-Adresse (txtAdresse1/2) darf hier -- wie am PC
  // (AktiverAdressBlock in KmBerechnen) -- NIE als Fahrtziel herangezogen
  // werden. Der Arzt fährt zum Sterbeort, nicht zum Bestattungsunternehmen;
  // Letzteres dient ausschließlich der Rechnungskorrespondenz. Am PC ist das
  // Ziel entweder der geöffnete abweichende Sterbeort-Block ("sterbeort")
  // oder sonst immer die Patientenadresse/Sterbeort-Standard ("patient") --
  // eine bereits eingetragene Bestatter-Adresse spielt für die Route/km
  // keinerlei Rolle. Vorher wurde sie hier fälschlich zuerst geprüft, was bei
  // einem weiter entfernten Bestattungsunternehmen zu absurd hohen
  // automatischen km-Werten führte (nur bei LS möglich, da PT keine
  // Bestatter-Adresse kennt).
  function ermittleZielAdresse(){
    if(art==='ls'){
      const sterbeAbwFelder = document.getElementById('sterbeAbwFelder');
      const abwOffen = sterbeAbwFelder && !sterbeAbwFelder.classList.contains('versteckt');
      if(abwOffen){
        const sstr = document.getElementById('txtSterbeAdr1').value.trim();
        const sort = document.getElementById('txtSterbeAdr2').value.trim();
        return sstr+', '+sort;
      }
    }
    return document.getElementById('txtPAdresse1').value.trim()+', '+document.getElementById('txtPAdresse2').value.trim();
  }

  async function kmAutomatikAusloesen(){
    const e = ladeEinstellungen();
    const info = document.getElementById('streckeninfo');
    if(!e.praxisadresse){ info.textContent = 'Keine Praxisadresse hinterlegt (Zahnrad -> Einstellungen).'; return; }
    const zielAdresse = ermittleZielAdresse();
    if(!zielAdresse.trim() || zielAdresse.trim()===',') return;
    // Wie am PC (KmBerechnen): jede automatische Neuberechnung setzt eine
    // zuvor manuell gewählte Reiseentschädigung/Luftlinie wieder zurück --
    // die Automatik entscheidet dann wieder frisch anhand der 50-km-Regel.
    manuellerModus = '';
    info.textContent = 'Route wird berechnet …';
    try{
      const start = await geocode(e.praxisadresse);
      if(!start){ info.textContent = 'Praxisadresse nicht auffindbar -- bitte in den Einstellungen prüfen.'; return; }
      const ziel = await geocode(zielAdresse);
      if(!ziel){ info.textContent = 'Zieladresse nicht gefunden.'; return; }
      const einweg = await routeKm(start, ziel);
      if(einweg===null){ info.textContent = 'Route nicht berechenbar.'; return; }
      // Wie am PC: Fahrstrecke wird als Hin- und Rückfahrt gerechnet,
      // Luftlinie bleibt die reine Einfachstrecke (Grundlage für die
      // Wegegeld-Bänder und ggf. für die Reise-Entscheidung).
      const kmFahrstreckeGesamt = einweg * 2;
      const kmLuft = kmLuftlinieEinfach(start, ziel);
      document.getElementById('txtKmFahrstrecke').value = kmFahrstreckeGesamt.toFixed(1);
      document.getElementById('txtKmLuftlinie').value = kmLuft.toFixed(1);
      feldWarnung('txtKm', '');
      const reise = sollReiseGelten(kmFahrstreckeGesamt, kmLuft);
      streckenAnzeigeAktualisieren();
      info.textContent = 'Route: '+kmFahrstreckeGesamt.toFixed(1)+' km Hin+Rück, '+kmLuft.toFixed(1)+' km Luftlinie'
        + (reise ? ' -- Reiseentschädigung greift' : ' -- Wegegeld greift');
      // Bereits ausgewaehlte Automatik-Positionen (falls Nutzer schon auf der
      // Rechnungspositionen-Seite war) live nachziehen -- wie bei manueller
      // km-Aenderung.
      positionenAutomatikNachziehen(
        document.getElementById('txtDatumExcel').value,
        document.getElementById('txtZeitLS').value,
        kmFahrstreckeGesamt.toFixed(1), kmLuft.toFixed(1)
      );
    }catch(e){
      // Gleiche Unterscheidung wie bei der Adress-/PLZ-Prüfung
      // (keinInternetHinweisText()): hier landet man ausschließlich, wenn
      // die Anfrage selbst fehlgeschlagen ist (Netzwerkfehler) -- ein
      // simples "nicht gefunden" (Praxis-/Zieladresse) wird oben bereits
      // separat und ohne diesen Zusatz gemeldet.
      info.textContent = 'Route konnte nicht berechnet werden.'+keinInternetHinweisText()+' km bitte manuell eintragen.';
    }
  }

  // Analog zur PC-Funktion KmBerechnen/RoutenAnzeigen: zeigt bis zu mehrere
  // Routenalternativen (falls der Routendienst welche liefert) plus die
  // Luftlinie als eigene Kachel an -- Antippen uebernimmt die gewaehlte
  // Strecke in "Strecke (Hin- und Rückfahrt)", genau wie am PC RouteWaehlen()
  // (Luftlinie bleibt Einfachstrecke, echte Routen werden Hin+Rück verdoppelt).
  async function alternativroutenAnzeigen(){
    const e = ladeEinstellungen();
    const box = document.getElementById('routenoptionen');
    if(!e.praxisadresse){ box.innerHTML = '<div class="routenoptionen-hinweis">Keine Praxisadresse hinterlegt (Zahnrad -> Einstellungen).</div>'; box.classList.add('aktiv'); return; }
    const zielAdresse = ermittleZielAdresse();
    if(!zielAdresse.trim() || zielAdresse.trim()===','){ box.innerHTML = '<div class="routenoptionen-hinweis">Bitte zuerst die Zieladresse eintragen.</div>'; box.classList.add('aktiv'); return; }
    box.innerHTML = '<div class="routenoptionen-hinweis">Routenalternativen werden ermittelt …</div>';
    box.classList.add('aktiv');
    try{
      const start = await geocode(e.praxisadresse);
      if(!start){ box.innerHTML = '<div class="routenoptionen-hinweis">Praxisadresse nicht auffindbar -- bitte in den Einstellungen prüfen.</div>'; return; }
      const ziel = await geocode(zielAdresse);
      if(!ziel){ box.innerHTML = '<div class="routenoptionen-hinweis">Zieladresse nicht gefunden.</div>'; return; }
      const kmLuft = kmLuftlinieEinfach(start, ziel);
      let routen = await routeAlternativen(start, ziel);
      if(!routen.length){ box.innerHTML = '<div class="routenoptionen-hinweis">Route konnte nicht berechnet werden -- km bitte manuell eintragen oder über \'Google Maps Route\' prüfen.</div>'; return; }
      // Wie am PC (RoutenErmitteln liefert Luftlinie als ByRef-Parameter,
      // die erste/beste Route wird -- unabhaengig von einer spaeteren
      // manuellen Kachel-Wahl -- bereits jetzt als Rechengrundlage
      // hinterlegt): Fahrstrecke UND Luftlinie werden hier sofort auf die
      // besten automatisch ermittelten Werte gesetzt, damit auch dann eine
      // gueltige Fahrstrecke bekannt ist, wenn spaeter NUR die Luftlinie-
      // Kachel gewaehlt wird (die PC-seitig gFahrstreckeGesamt unangetastet
      // laesst, siehe RouteWaehlen(idx=0)).
      document.getElementById('txtKmFahrstrecke').value = (routen[0].km*2).toFixed(1);
      document.getElementById('txtKmLuftlinie').value = kmLuft.toFixed(1);
      // Wie am PC: doppelte/fast identische Alternativen (gleiche km auf 1
      // Nachkommastelle gerundet) werden nicht mehrfach angezeigt.
      const gesehen = new Set();
      routen = routen.filter(r=>{ const key=(r.km*2).toFixed(1); if(gesehen.has(key)) return false; gesehen.add(key); return true; });
      let html = '';
      routen.forEach((r,i)=>{
        const kmGesamt = r.km*2;
        html += `<button type="button" data-km="${kmGesamt.toFixed(1)}" data-luft="">Fahrstrecke ${i+1}: ${kmGesamt.toFixed(1).replace('.',',')} km hin&amp;zurück (${Math.round(r.minuten)} min)</button>`;
      });
      html += `<button type="button" data-km="" data-luft="${kmLuft.toFixed(1)}">Luftlinie (einfach): ${kmLuft.toFixed(1).replace('.',',')} km</button>`;
      box.innerHTML = html;
      box.querySelectorAll('button').forEach(btn=>{
        btn.onclick = ()=>{
          if(btn.dataset.km){
            // Fahrstrecke-Kachel: wie am PC (RouteWaehlen idx<>0) ist das
            // gleichbedeutend mit "bewusst als Reiseentschädigung wählen" --
            // unter 50 km ist das nicht zulässig (dort: MsgBox-Ablehnung).
            // Ohne native Popups hier stattdessen als kurzer Toast, die
            // Auswahlliste bleibt offen, damit eine andere Kachel gewählt
            // werden kann.
            const kmGesamt = parseFloat(btn.dataset.km.replace(',','.'));
            if(!(kmGesamt>50)){
              appToastAnzeigen('Eine Reiseentschädigung ist erst ab über 50 km (Hin- und Rückfahrt) zulässig -- diese Route hat nur '+btn.dataset.km.replace('.',',')+' km. Bitte eine andere Route oder die Luftlinie wählen.', 3500);
              return;
            }
            // Fahrstrecke-Kachel: wie am PC (RouteWaehlen idx<>0) wird
            // gFahrstreckeGesamt auf GENAU diese gewählte Route gesetzt.
            manuellerModus = 'REISE';
            document.getElementById('txtKmFahrstrecke').value = btn.dataset.km;
          } else {
            // Luftlinie-Kachel: KORREKTUR -- die Wegegeld-Staffel (WT/WN)
            // deckt nur bis 25 km einfach ab; darüber kommt ausschließlich
            // eine Reiseentschädigung infrage. Eine Luftlinie >25 km wird
            // deshalb NICHT mehr übernommen, sondern abgelehnt -- der
            // 25-50-km-Graubereich soll (wie gewünscht) NUR über diesen Weg
            // überhaupt entstehen können, und genau das wird hier verhindert.
            if(kmLuft>25){
              appToastAnzeigen('Luftlinie '+kmLuft.toFixed(1).replace('.',',')+' km liegt über 25 km -- dafür kommt nur eine Reiseentschädigung infrage. Bitte stattdessen eine Fahrstrecke-Kachel über 50 km wählen.', 4000);
              return;
            }
            // Wie am PC (RouteWaehlen idx=0): NUR der Modus wird gesetzt,
            // gFahrstreckeGesamt/txtKmFahrstrecke bleibt unangetastet (wurde
            // oben bereits auf die beste automatisch gefundene Route gesetzt).
            manuellerModus = 'LUFTLINIE';
          }
          box.classList.remove('aktiv'); box.innerHTML='';
          feldWarnung('txtKm', '');
          streckenAnzeigeAktualisieren();
          automatikVorschauAktualisieren();
        };
      });
    }catch(err){
      box.innerHTML = '<div class="routenoptionen-hinweis">Alternativrouten konnten nicht berechnet werden.'+keinInternetHinweisText()+' km bitte manuell eintragen.</div>';
    }
  }

  // Analog zur PC-Funktion KarteOeffnen/RouteImBrowserOeffnen: oeffnet die
  // Strecke Praxis -> Patientenadresse -> zurück zur Praxis direkt in
  // Google Maps (auf dem Handy per Deep-Link in der Google-Maps-App, sonst
  // im Browser) -- wie am PC berechnet wird ja auch Hin- UND Rückfahrt
  // (Rechnungspositionen "Strecke (Hin- und Rückfahrt)"), daher soll die
  // angezeigte Route in Google Maps das Gleiche zeigen statt nur der
  // einfachen Strecke. Umgesetzt als Route mit Start UND Ziel=Praxis und
  // der Patientenadresse als Zwischenstopp (waypoints) -- Google Maps zeigt
  // das als Rundfahrt Praxis -> Patient -> Praxis.
  // WICHTIG: bewusst immer die Patientenadresse (txtPAdresse1/2) als
  // Zwischenstopp, NICHT ermittleZielAdresse() -- diese folgt bei LS der
  // PC-Prioritaet Bestatter > abw. Sterbeort > Patient und bleibt dafuer
  // (km-Berechnung/Wegegeld) unveraendert; die Navigation zum tatsaechlichen
  // Einsatzort soll aber unabhaengig davon immer zum Patienten fuehren.
  function googleMapsRouteOeffnen(){
    const e = ladeEinstellungen();
    if(!e.praxisadresse){ document.getElementById('streckeninfo').textContent = 'Keine Praxisadresse hinterlegt (Zahnrad -> Einstellungen).'; return; }
    const patientAdresse = document.getElementById('txtPAdresse1').value.trim()+', '+document.getElementById('txtPAdresse2').value.trim();
    if(!patientAdresse.trim() || patientAdresse.trim()===','){ document.getElementById('streckeninfo').textContent = 'Bitte zuerst die Patientenadresse eintragen.'; return; }
    const url = 'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(e.praxisadresse)
      +'&destination='+encodeURIComponent(e.praxisadresse)
      +'&waypoints='+encodeURIComponent(patientAdresse)
      +'&travelmode=driving';
    window.open(url, '_blank');
  }

  // Wie am PC (AutoAktualisierenLive/AutoPunkteAktualisieren): sobald km,
  // Uhrzeit oder Datum sich aendern -- auch durch manuelle km-Eingabe ohne
  // Routenberechnung --, werden die automatisch bestimmten Positionen
  // (Zeitzuschlag F/G, Wochenend-/Feiertagszuschlag H, Wegegeld-Staffel
  // bzw. Reiseentschaedigung) SOFORT neu bestimmt, nicht erst beim naechsten
  // Oeffnen der Rechnungspositionen-Seite. Manuell angehakte ("Manuell")
  // Positionen bleiben davon unberuehrt.
  // Falls bereits eine Positionsauswahl besteht (Nutzer war schon auf der
  // Rechnungspositionen-Seite): die automatisch bestimmten Ziffern (Zeit-
  // zuschlag F/G, Wochenend-/Feiertagszuschlag H, Wegegeld-Staffel bzw.
  // Reiseentschaedigung) live nachziehen, Betrag/Status-Anzeige entsprechend
  // aktualisieren. Manuell angehakte ("Manuell") Positionen bleiben davon
  // unberuehrt -- wie am PC (AutoAktualisierenLive/AutoPunkteAktualisieren).
  function positionenAutomatikNachziehen(datum, zeit, kmFahrstrecke, kmLuftlinie){
    if(!positionenAuswahl) return;
    const katalog = art==='ls' ? POSITIONEN_LS : POSITIONEN_PT;
    const AUTO_ZIFFERN = new Set([
      ...ZUSCHLAEGE_ZEIT.map(z=>z.ziffer),
      ...WEGEGELD_TAG.map(z=>z.ziffer), ...WEGEGELD_NACHT.map(z=>z.ziffer),
      'REISE'
    ]);
    const neueAuto = automatischeAuswahl(katalog, datum, zeit, kmFahrstrecke, kmLuftlinie, manuellerModus);
    AUTO_ZIFFERN.forEach(z=> positionenAuswahl.delete(z));
    neueAuto.forEach(z=> { if(AUTO_ZIFFERN.has(z)) positionenAuswahl.add(z); });

    const alle = allePositionenFlach(katalog);
    let summe=0;
    positionenAuswahl.forEach(z=>{
      if(z==='REISE'){ summe += reiseGesamtBetrag(kmFahrstrecke).gesamt; return; }
      const p = alle.find(x=>x.ziffer===z); if(p) summe += p.betrag;
    });
    const betragEl = document.getElementById('txtBetrag');
    if(betragEl) betragEl.value = summe.toFixed(2).replace('.',',');
    const statusEl = document.getElementById('punkteStatus');
    if(statusEl) statusEl.textContent = positionenAuswahl.size+' Position(en) ausgewählt';
  }

  // Exakt wie am PC (StreckenAnzeigeAktualisieren): das SICHTBARE km-Feld
  // zeigt zu jedem Zeitpunkt genau EINEN Wert -- entweder die Luftlinie
  // (einfache Strecke) oder die Fahrstrecke (Hin- und Rückfahrt), je nachdem
  // was gerade "massgeblich" ist. Die beiden tatsächlichen Werte werden
  // DAUERHAFT und unabhängig vom Anzeigezustand in den beiden versteckten
  // Feldern txtKmFahrstrecke/txtKmLuftlinie gehalten (analog PC
  // gFahrstreckeGesamt/gLuftlinieKm) -- nur die Beschriftung und der
  // angezeigte Wert wechseln:
  //   Modus LUFTLINIE (manuell gewählt)  -> "Luftlinie (einfach), manuell gewählt", zeigt Luftlinie
  //   Modus REISE (manuell gewählt)      -> "Fahrstrecke (Hin- und Rückfahrt), manuell gewählt", zeigt Fahrstrecke
  //   automatisch, Reiseentschädigung    -> "Fahrstrecke (Hin- und Rückfahrt)", zeigt Fahrstrecke
  //   automatisch, Wegegeld              -> "Luftlinie (einfach)", zeigt Luftlinie
  //   noch nichts bekannt                -> "Strecke (Hin- und Rückfahrt)", leer
  function streckenAnzeigeAktualisieren(){
    const kmEl = document.getElementById('txtKm');
    const labelEl = document.getElementById('txtKm_label');
    const fahrVal = parseFloat((document.getElementById('txtKmFahrstrecke').value||'').replace(',','.'));
    const luftVal = parseFloat((document.getElementById('txtKmLuftlinie').value||'').replace(',','.'));
    let label, wert, istFahrstrecke = false;
    if(manuellerModus==='LUFTLINIE' && !isNaN(luftVal) && luftVal>0){
      label = 'Luftlinie (einfach), manuell gewählt'; wert = luftVal;
    } else if(manuellerModus==='REISE' && !isNaN(fahrVal) && fahrVal>0){
      label = 'Fahrstrecke (Hin- und Rückfahrt), manuell gewählt'; wert = fahrVal; istFahrstrecke = true;
    } else if(!isNaN(fahrVal) && fahrVal>0 && sollReiseGelten(fahrVal, isNaN(luftVal)?fahrVal/2:luftVal)){
      label = 'Fahrstrecke (Hin- und Rückfahrt)'; wert = fahrVal; istFahrstrecke = true;
    } else if(!isNaN(luftVal) && luftVal>0){
      label = 'Luftlinie (einfach)'; wert = luftVal;
    } else if(!isNaN(fahrVal) && fahrVal>0){
      label = 'Fahrstrecke (Hin- und Rückfahrt)'; wert = fahrVal; istFahrstrecke = true;
    } else {
      label = 'Strecke (Hin- und Rückfahrt)'; wert = null;
    }
    labelEl.textContent = label;
    // Bei der Reiseentschaedigung wird fuer die 0,26-EUR/km-Zeile immer auf
    // den naechsten vollen km aufgerundet (siehe reiseGesamtBetrag, analog
    // PC) -- damit die Anzeige hier nicht von dem tatsaechlich abgerechneten
    // Wert abweicht, wird sie in diesem Fall genauso gerundet dargestellt.
    // Die eigentliche Rechengrundlage (txtKmFahrstrecke, ungerundet) bleibt
    // dabei unveraendert -- es aendert sich nur diese Anzeige. Beim Wegegeld
    // (Luftlinie-Fall) bleibt weiterhin die genaue Kommazahl stehen, da dort
    // keine km-abhaengige EUR-Berechnung erfolgt.
    kmEl.value = (wert===null) ? '' : (istFahrstrecke ? String(Math.ceil(wert)) : wert.toFixed(1));
  }

  // Wie am PC (AutoAktualisierenLive): sobald km, Uhrzeit oder Datum sich
  // aendern -- auch durch manuelle km-Eingabe ohne Routenberechnung --,
  // werden Vorschau-Text und bereits ausgewaehlte Automatik-Positionen
  // SOFORT neu bestimmt, nicht erst beim naechsten Oeffnen der
  // Rechnungspositionen-Seite. Rechengrundlage sind IMMER die beiden
  // versteckten Felder (txtKmFahrstrecke/txtKmLuftlinie), NICHT das
  // sichtbare txtKm, dessen Anzeige je nach Modus wechselt.
  function automatikVorschauAktualisieren(){
    const datum = document.getElementById('txtDatumExcel').value;
    const zeit = document.getElementById('txtZeitLS').value;
    const kmFahrstrecke = document.getElementById('txtKmFahrstrecke').value.trim();
    const kmLuftlinie = document.getElementById('txtKmLuftlinie').value.trim();

    const info = document.getElementById('streckeninfo');
    if(info){
      const fahrVal = parseFloat((kmFahrstrecke||'').replace(',','.'));
      const luftVal = parseFloat((kmLuftlinie||'').replace(',','.'));
      // Wie bei der Ziffernwahl (automatischeAuswahl): im erzwungenen Modus
      // entscheidet NICHT mehr sollReiseGelten, sondern der Modus selbst --
      // sonst widersprach dieser Infotext zuvor der tatsächlich gesetzten
      // Position (z.B. "Reiseentschädigung greift" trotz gewählter Luftlinie).
      if(manuellerModus==='REISE' && !isNaN(fahrVal) && fahrVal>0){
        info.textContent = 'Reiseentschädigung greift';
      } else if(manuellerModus==='LUFTLINIE' && !isNaN(luftVal) && luftVal>0){
        info.textContent = 'Wegegeld greift';
      } else if(!isNaN(fahrVal) && fahrVal>0){
        const reise = sollReiseGelten(fahrVal, isNaN(luftVal)?fahrVal/2:luftVal);
        info.textContent = reise ? 'Reiseentschädigung greift' : 'Wegegeld greift';
      }
    }

    positionenAutomatikNachziehen(datum, zeit, kmFahrstrecke, kmLuftlinie);
  }

  // Analog zur PC-Funktion KmFeldManuellUebernehmen (Feld-Verlassen-Handler
  // des km-Feldes): ein wirklich EINGETIPPTER Wert (kmManuellGetippt, siehe
  // 'input'-Listener oben) wird -- genau wie am PC -- danach unterschieden,
  // ob er als Luftlinie (einfach) oder bereits als Fahrstrecke (Hin- und
  // Rückfahrt gesamt) gemeint ist:
  //   <=25 km  -> Luftlinie (einfach); NUR txtKmLuftlinie wird auf den
  //               eingetippten Wert gesetzt (unverändert, NICHT verdoppelt!)
  //               -- txtKmFahrstrecke bleibt unangetastet, exakt wie am PC
  //               (KmFeldManuellUebernehmen setzt dort ebenfalls nur
  //               gLuftlinieKm, nicht gFahrstreckeGesamt).
  //   >50 km   -> bereits die Fahrstrecke (Hin- und Rückfahrt) selbst; NUR
  //               txtKmFahrstrecke wird gesetzt, txtKmLuftlinie bleibt
  //               unangetastet (ebenfalls PC-analog).
  //   25-50 km -> nicht eindeutig zuordenbar (dieser Graubereich soll wie
  //               gewünscht NUR über die Alternativrouten entstehen können,
  //               wo eine konkrete Fahrstrecke vorliegt) -- wird abgelehnt,
  //               der zuletzt gültige Anzeigewert wird wiederhergestellt,
  //               Hinweis statt nativem Popup.
  // Ein rein programmatisch gesetzter Wert (Routenberechnung, Alternativ-
  // routen-Kachel, Fallwiederherstellung) löst KEIN 'input' aus und wird
  // hier deshalb nicht nochmal (falsch) neu interpretiert.
  function kmFeldManuellUebernehmen(){
    if(!kmManuellGetippt) return;
    kmManuellGetippt = false;
    const kmEl = document.getElementById('txtKm');
    const eingabe = parseFloat(kmEl.value.trim().replace(',', '.'));
    feldWarnung('txtKm', '');
    if(isNaN(eingabe) || eingabe<=0){ streckenAnzeigeAktualisieren(); return; }
    if(eingabe<=25){
      manuellerModus = 'LUFTLINIE';
      document.getElementById('txtKmLuftlinie').value = eingabe.toFixed(1);
    } else if(eingabe>50){
      manuellerModus = 'REISE';
      document.getElementById('txtKmFahrstrecke').value = eingabe.toFixed(1);
    } else {
      kmEl.value = kmVorFokus;
      feldWarnung('txtKm', 'Ein eingetippter Wert zwischen 25 und 50 km ist nicht eindeutig einer Luftlinie oder einer Fahrstrecke zuzuordnen und wurde nicht übernommen.'
        + ' Bitte entweder eine Luftlinie bis 25 km oder eine Fahrstrecke (Hin- und Rückfahrt) über 50 km eintragen, oder über "Alternativrouten" eine konkrete Strecke wählen.');
      return;
    }
    streckenAnzeigeAktualisieren();
    automatikVorschauAktualisieren();
  }

  // Datums-Kurzeingabe (z.B. "26" -> Jahr 2026, "010111" -> 01.01.1911)
  // beim Verlassen eines Datumsfeldes ergänzen, bevor die übliche
  // Plausibilitätsprüfung läuft.
  function datumFeldBlur(id){
    const el = document.getElementById(id);
    if(el){
      const ergaenzt = datumKurzeingabeErgaenzen(el.value, el.value);
      if(ergaenzt) el.value = ergaenzt;
    }
    alleChecksAusfuehren();
  }

  // Uhrzeit ohne Doppelpunkt (z.B. "1430") beim Verlassen des Feldes
  // automatisch mit Doppelpunkt formatieren, bevor die Formatprüfung läuft.
  function zeitFeldBlur(id){
    const el = document.getElementById(id);
    if(el) el.value = zeitDoppelpunktErgaenzen(el.value);
    alleChecksAusfuehren();
  }

  // Straße-Feld-Verhalten wie am PC (StrasseAusschreiben/GrossKleinKorrigieren):
  // "str"/"str." wird zu "straße" ausgeschrieben, und vergessene
  // Großschreibung am Wort-/Bindestrich-Anfang wird ergänzt -- angewendet
  // beim Verlassen des jeweiligen Straßenfeldes.
  function strasseFeldBlur(id){
    const el = document.getElementById(id);
    if(!el) return;
    const roh = el.value;
    if(!roh) return;
    const ausgeschrieben = roh.replace(/str\./gi, 'straße').replace(/str(?=[ 0-9])/gi, 'straße');
    let ergebnis = '', vorherigesTrennz = true;
    for(const c of ausgeschrieben){
      ergebnis += (vorherigesTrennz && c!==' ' && c!=='-') ? c.toUpperCase() : c;
      vorherigesTrennz = (c===' '||c==='-');
    }
    el.value = ergebnis;
  }

  function feldWarnung(id, html){
    const warnEl = document.getElementById(id+'_warn');
    if(!warnEl) return;
    if(!html){ warnEl.classList.remove('aktiv'); warnEl.innerHTML=''; return; }
    warnEl.classList.add('aktiv'); warnEl.innerHTML = html;
  }

  // PLZ/Ort-Erkennung wie am PC (PlzErgaenzen): wird beim Verlassen eines
  // kombinierten "PLZ + Ort"-Feldes ausgelöst. MsgBox-Dialoge der PC-Version
  // werden hier durch die inline warnhinweis-Anzeige ersetzt (keine
  // nativen Popups, wie an anderer Stelle bereits festgelegt).
  async function plzOrtPruefen(strasseId, plzOrtId){
    const feld = document.getElementById(plzOrtId);
    const strasseFeld = document.getElementById(strasseId);
    if(!feld || !strasseFeld) return;
    const eingabe = feld.value.trim();
    if(!eingabe) { feldWarnung(plzOrtId, ''); return; }
    const strasse = strasseFeld.value.trim();
    const eingegebenePlz = plzAusText(eingabe);

    if(!eingegebenePlz){
      // Keine PLZ im Text -> per Geocoding aus Straße + Ort ermitteln
      if(!strasse) return; // ohne Straße kann keine sinnvolle Suche erfolgen
      feldWarnung(plzOrtId, 'PLZ wird ermittelt …');
      const adrFuerPlz = strasse+', '+eingabe;
      const ermitteltePlz = await plzErmitteln(adrFuerPlz);
      if(feld.value.trim() !== eingabe) return; // Nutzer hat inzwischen weitergetippt
      if(ermitteltePlz){
        feld.value = ermitteltePlz+' '+eingabe;
        feldWarnung(plzOrtId, '');
        kmAutomatikAusloesen();
      } else {
        // FIX: ohne "So belassen"-Option blockierte dieser Hinweis das
        // Speichern (siehe offeneWarnung-Prüfung in btnSpeichern.onclick)
        // KOMPLETT und ohne jeden Ausweg, sobald kein Internet verfügbar
        // war oder der Kartendienst die Adresse schlicht nicht kannte --
        // analog zum bereits gelösten "Kein Bestattungsunternehmen"-Fall.
        // Zusatz: plzErmitteln() liefert null (statt '') bei einem
        // Netzwerkfehler -- dann vermutlich fehlendes Internet statt eines
        // echten "Ort existiert nicht"-Falls, das wird jetzt im Text
        // unterschieden.
        const zusatz = ermitteltePlz===null ? keinInternetHinweisText() : '';
        feldWarnung(plzOrtId, `Der Ort "${eingabe}" konnte nicht gefunden werden.${zusatz} Bitte PLZ und Ort manuell eintragen.
          <div class="aktionen"><button data-akt="behalten">So belassen</button></div>`);
        const warnEl = document.getElementById(plzOrtId+'_warn');
        warnEl.querySelector('[data-akt="behalten"]').onclick = ()=> feldWarnung(plzOrtId, '');
      }
      return;
    }

    const ort = eingabe.replace(eingegebenePlz, '').trim();
    if(!ort){
      // PLZ da, Ort fehlt -> Ort zur PLZ nachschlagen
      feldWarnung(plzOrtId, 'Ort wird ermittelt …');
      const ermittelterOrt = await ortErmitteln(eingegebenePlz);
      if(feld.value.trim() !== eingabe) return;
      if(ermittelterOrt){
        feld.value = eingegebenePlz+' '+ermittelterOrt;
        feldWarnung(plzOrtId, '');
        kmAutomatikAusloesen();
      } else {
        // FIX: siehe Begründung beim gleichartigen Fall oben -- "So
        // belassen" ergänzt, damit dieser Hinweis das Speichern nicht mehr
        // ohne jeden Ausweg blockiert; plus Internet-Hinweis bei
        // Netzwerkfehler (ortErmitteln()===null).
        const zusatz = ermittelterOrt===null ? keinInternetHinweisText() : '';
        feldWarnung(plzOrtId, `Zur PLZ "${eingegebenePlz}" konnte kein Ort gefunden werden.${zusatz} Bitte manuell ergänzen.
          <div class="aktionen"><button data-akt="behalten">So belassen</button></div>`);
        const warnEl = document.getElementById(plzOrtId+'_warn');
        warnEl.querySelector('[data-akt="behalten"]').onclick = ()=> feldWarnung(plzOrtId, '');
      }
      return;
    }

    // Beide da -> Kreuzvalidierung anhand der Straße
    if(!strasse){ feldWarnung(plzOrtId, ''); return; }
    feldWarnung(plzOrtId, 'Adresse wird geprüft …');
    const adrVoll = strasse+', '+eingabe;
    const plzLautKarte = await plzErmitteln(adrVoll);
    if(feld.value.trim() !== eingabe) return;
    if(!plzLautKarte){
      // FIX: siehe Begründung oben -- ohne Kartendienst (z.B. kein Internet
      // beim Hausbesuch) blockierte dieser Hinweis das Speichern zuvor
      // vollständig; plus Internet-Hinweis bei Netzwerkfehler
      // (plzErmitteln()===null statt '' bei nur leerem Ergebnis).
      const zusatz = plzLautKarte===null ? keinInternetHinweisText() : '';
      feldWarnung(plzOrtId, `Die Adresse "${adrVoll}" konnte laut Kartendienst nicht gefunden werden.${zusatz} Bitte prüfen.
        <div class="aktionen"><button data-akt="behalten">So belassen</button></div>`);
      const warnEl = document.getElementById(plzOrtId+'_warn');
      warnEl.querySelector('[data-akt="behalten"]').onclick = ()=> feldWarnung(plzOrtId, '');
      return;
    }
    if(plzLautKarte !== eingegebenePlz){
      feldWarnung(plzOrtId, `Achtung: Die eingegebene PLZ (${eingegebenePlz}) passt möglicherweise nicht zur Adresse. Laut Kartendienst gehört zu "${strasse}" eher PLZ ${plzLautKarte}.
        <div class="aktionen">
          <button data-akt="korrigieren">Auf ${plzLautKarte} korrigieren</button>
          <button data-akt="behalten">So belassen</button>
        </div>`);
      const warnEl = document.getElementById(plzOrtId+'_warn');
      warnEl.querySelector('[data-akt="korrigieren"]').onclick = ()=>{
        feld.value = plzLautKarte+' '+ort;
        feldWarnung(plzOrtId, '');
        kmAutomatikAusloesen();
      };
      warnEl.querySelector('[data-akt="behalten"]').onclick = ()=> feldWarnung(plzOrtId, '');
      return;
    }
    feldWarnung(plzOrtId, '');
  }

  function pruefeJahrFeld(id, bezeichnung){
    const input = document.getElementById(id); if(!input) return;
    const norm = normalisiereDatum(input.value);
    if(!norm){ feldWarnung(id, ''); return; }
    const jahr = +norm.split('.')[2];
    const aktJahr = new Date().getFullYear();
    if(jahr===aktJahr){ feldWarnung(id, ''); return; }
    feldWarnung(id, `${bezeichnung}: Jahr ${jahr} weicht vom aktuellen Jahr (${aktJahr}) ab.
      <div class="aktionen">
        <button data-akt="korrigieren">Auf ${aktJahr} korrigieren</button>
        <button data-akt="behalten">So belassen</button>
      </div>`);
    const warnEl = document.getElementById(id+'_warn');
    warnEl.querySelector('[data-akt="korrigieren"]').onclick = ()=>{
      input.value = norm.split('.').slice(0,2).join('.')+'.'+aktJahr;
      feldWarnung(id, '');
    };
    warnEl.querySelector('[data-akt="behalten"]').onclick = ()=> feldWarnung(id, '');
  }

  // Prueft, ob ein Uhrzeitfeld ueberhaupt ein gueltiges HH:MM-Format hat
  // (z.B. "55:12h" oder "1h" wurden bisher kommentarlos akzeptiert, weil
  // normalisiereZeit() zwar korrekt "" zurueckgab, aber nie eine sichtbare
  // Warnung ausgeloest wurde). Gibt true zurueck, wenn das Feld leer ODER
  // gueltig ist -- false bei einem erkennbar falschen, nicht-leeren Wert.
  function pruefeZeitFeld(id, bezeichnung){
    const input = document.getElementById(id); if(!input) return true;
    const roh = input.value.trim();
    if(!roh){ feldWarnung(id, ''); return true; }
    if(!normalisiereZeit(roh)){
      feldWarnung(id, `${bezeichnung}: "${roh}" ist kein gültiges Uhrzeitformat. Bitte als HH:MM eintragen (z.B. 14:30).`);
      return false;
    }
    feldWarnung(id, '');
    return true;
  }

  // 1:1 wie am PC (ZeitenPlausibelKern): Dienstende 08:30 -- eine
  // Leichenschau, deren Uhrzeit noch in dieses Fenster (00:00-08:30) fällt,
  // gehört üblicherweise noch zur vorherigen Nachtschicht/zum Vortag, auch
  // wenn ihre UHRZEIT dadurch rein numerisch vor dem Sterbezeitpunkt liegt
  // -- das ist dann KEIN Vertauscher, sondern ein normaler
  // Mitternachtsübergang.
  const DIENSTENDE_MINUTEN = 8*60+30;

  function pruefeZeitenLS(){
    if(art!=='ls') return;
    // txtZeitLS wird bereits separat ueber pruefeZeitFeld() geprüft (s.u.
    // in alleChecksAusfuehren) -- hier nur noch dessen Gueltigkeit abfragen.
    const zLSRoh = document.getElementById('txtZeitLS').value.trim();
    const zLS = zLSRoh ? normalisiereZeit(zLSRoh) : '';
    const inputTod = document.getElementById('txtTodeszeit');
    const rohTod = inputTod.value.trim();
    if(!rohTod){ feldWarnung('txtTodeszeit', ''); return; }
    const zSterbe = normalisiereZeit(rohTod);
    if(!zSterbe){
      // Format-Fehler hat Vorrang vor der Reihenfolge-Pruefung.
      feldWarnung('txtTodeszeit', `Sterbezeitpunkt: "${rohTod}" ist kein gültiges Uhrzeitformat. Bitte als HH:MM eintragen (z.B. 03:15).`);
      return;
    }
    if(!zLS){ feldWarnung('txtTodeszeit', ''); return; }

    // Zeitpunkt LS liegt (rein von der Uhrzeit her) NACH dem
    // Sterbezeitpunkt -- der Normalfall, keine Warnung.
    if(zeitInMinuten(zLS) > zeitInMinuten(zSterbe)){ feldWarnung('txtTodeszeit', ''); return; }

    // Zeitpunkt LS liegt zeitlich vor/gleich dem Sterbezeitpunkt: entweder
    // ein Mitternachtsübergang (LS noch im Dienstzeitfenster der
    // Nachtschicht) oder tatsächlich vertauscht -- wie am PC zuerst das
    // Dienstzeitfenster prüfen.
    if(zeitInMinuten(zLS) <= DIENSTENDE_MINUTEN){
      const dSterbe = normalisiereDatum(document.getElementById('txtSterbedatum').value);
      const dLS = normalisiereDatum(document.getElementById('txtDatumExcel').value);
      if(dSterbe && dLS){
        if(alsDatum(dSterbe) < alsDatum(dLS)){
          // Sterbedatum liegt vor dem Datum der Todesbescheinigung --
          // klassischer Nachtschicht-Übergang (z.B. Sterbezeitpunkt 23:50
          // am Vortag, Leichenschau 00:20 am Folgetag noch bis Dienstende).
          // Plausibel, keine Warnung.
          feldWarnung('txtTodeszeit', '');
          return;
        }
        if(alsDatum(dSterbe).getTime() === alsDatum(dLS).getTime()){
          // Verdachtsfall wie am PC: Sterbedatum und Datum der
          // Todesbescheinigung sind gleich, obwohl die Leichenschau im
          // Dienstzeitfenster (bis 08:30) stattfand -- deutet auf ein
          // möglicherweise falsches Datum auf dem Leichenschauschein hin.
          // Wird NICHT automatisch korrigiert (das Datum wird vom
          // amtlichen Schein abgeschrieben), nur gezielt gewarnt.
          feldWarnung('txtTodeszeit', `Die Leichenschau fand um ${zLS} statt -- das liegt im Zeitfenster bis Dienstende (08:30) und gehört damit vermutlich noch zum VORHERIGEN Kalendertag. Sterbedatum und Datum der Todesbescheinigung sind aber auf denselben Tag (${dLS}) eingetragen -- möglicherweise wurde auf dem Leichenschauschein ein falsches Datum eingetragen. Bitte mit dem Original abgleichen.`);
          return;
        }
        // dSterbe > dLS: ungültige Kombination, wird bereits separat von
        // pruefeSterbedatum() gemeldet -- hier (wie am PC) ohne Exit
        // weiter zur generischen Vertauscht-Prüfung unten.
      }
    }

    // Ausserhalb des Dienstzeitfensters (oder obige Datumslogik hat nicht
    // gegriffen): naheliegender Verdacht -- die beiden Uhrzeiten wurden
    // schlicht vertauscht eingetragen.
    feldWarnung('txtTodeszeit', `Leichenschau (${zLS}) liegt vor dem Sterbezeitpunkt (${zSterbe}) -- eventuell vertauscht.
      <div class="aktionen">
        <button data-akt="tauschen">Uhrzeiten tauschen</button>
        <button data-akt="behalten">So belassen</button>
      </div>`);
    const warnEl = document.getElementById('txtTodeszeit_warn');
    warnEl.querySelector('[data-akt="tauschen"]').onclick = ()=>{
      document.getElementById('txtTodeszeit').value = zLS;
      document.getElementById('txtZeitLS').value = zSterbe;
      feldWarnung('txtTodeszeit', '');
    };
    warnEl.querySelector('[data-akt="behalten"]').onclick = ()=> feldWarnung('txtTodeszeit', '');
  }

  function pruefeSterbedatum(){
    if(art!=='ls') return;
    const dSterbe = normalisiereDatum(document.getElementById('txtSterbedatum').value);
    const dLS = normalisiereDatum(document.getElementById('txtDatumExcel').value);
    if(!dSterbe || !dLS){ feldWarnung('txtSterbedatum', ''); return; }
    if(alsDatum(dSterbe) <= alsDatum(dLS)){ feldWarnung('txtSterbedatum', ''); return; }
    feldWarnung('txtSterbedatum', `Sterbedatum (${dSterbe}) liegt nach dem Datum der Todesbescheinigung (${dLS}). Bitte prüfen.`);
  }

  function pruefeBestatterLeer(){
    if(art!=='ls') return;
    const name = document.getElementById('txtBName').value.trim();
    if(name){ feldWarnung('txtBName', ''); return; }
    feldWarnung('txtBName', `Kein Bestattungsunternehmen angegeben -- die Rechnung wird an die Patientenadresse adressiert.`);
  }

  // Wie am PC (bestatterKomplettLeer wird dort erst BEIM SPEICHERN
  // abgefragt, nicht laufend) soll der "Kein Bestattungsunternehmen"-
  // Hinweis NIE zwischendurch aufblitzen -- weder beim Öffnen der Maske
  // noch beim Verlassen eines völlig anderen Feldes (Datum, Uhrzeit, ...),
  // sondern ausschließlich beim Klick auf "Speichern". Der Parameter ist
  // daher nicht mehr nötig; pruefeBestatterLeer() wird gezielt nur noch im
  // btnSpeichern-Handler aufgerufen.
  function alleChecksAusfuehren(){
    pruefeJahrFeld('txtDatumExcel', art==='ls' ? 'Datum Todesbescheinigung' : 'Datum Hausbesuch');
    pruefeJahrFeld('txtDatum', 'Rechnungsdatum');
    pruefeZeitFeld('txtZeitLS', art==='ls' ? 'Zeitpunkt Leichenschau' : 'Uhrzeit Hausbesuch');
    if(art==='ls'){
      pruefeJahrFeld('txtSterbedatum', 'Sterbedatum');
      pruefeZeitenLS();
      pruefeSterbedatum();
    }
  }
  // Beim Öffnen einmal ausführen -- deckt auch die Werte ab, die beim Laden
  // einer Korrektur bereits vorbefüllt sind.
  alleChecksAusfuehren();

  function alertBanner(text){
    const zielEl = document.getElementById('allgemeinerHinweis');
    zielEl.innerHTML = `<div class="warnhinweis aktiv">${text}</div>`;
    // Der Hinweis sitzt weit unten in der Maske (unterhalb der Rechnungs-
    // positionen) -- ohne aktives Hinscrollen sieht man z.B. eine
    // Zwischenablage-Fehlermeldung leicht gar nicht, wenn man gerade oben
    // auf den Button geklickt hat.
    zielEl.scrollIntoView({behavior:'smooth', block:'center'});
  }

  document.getElementById('btnPunkte').onclick = ()=>{
    const datum = document.getElementById('txtDatumExcel').value;
    const zeit = document.getElementById('txtZeitLS').value;
    const kmFahrstrecke = document.getElementById('txtKmFahrstrecke').value;
    const kmLuftlinie = document.getElementById('txtKmLuftlinie').value;
    const basis = positionenAuswahl || automatischeAuswahl(art==='ls'?POSITIONEN_LS:POSITIONEN_PT, datum, zeit, kmFahrstrecke, kmLuftlinie, manuellerModus);
    // Schnappschuss der Maskenwerte JETZT nehmen (Maske ist noch im DOM),
    // damit ein Zahnrad-Klick auf der Rechnungspositionen-Unteransicht
    // korrekt hierher zurückfindet, statt aus dem falschen DOM zu lesen.
    const snapVorPositionen = werteEinsammeln();
    vorbereiteRuecksprung = ()=>{
      ruecksprungAusEinstellungen = ()=>ansichtMaske(art, korrekturIdx, {werte: snapVorPositionen, positionen: positionenAuswahl});
    };
    ansichtPositionen(art, basis, null, (gewaehlt, summe)=>{
      // WICHTIG: an dieser Stelle zeigt der Bildschirm noch die Rechnungs-
      // positionen-Ansicht, nicht die Maske -- "punkteStatus"/"txtBetrag"
      // existieren im DOM also (noch) gar nicht. Statt sie (fälschlich)
      // direkt zu beschreiben, bauen wir die Maske mit den VORHER
      // gesicherten Werten plus dem neuen Betrag/der neuen Auswahl frisch
      // auf -- das hat vorher zu einem stillen Fehler geführt, der einen
      // auf der Positionen-Seite "gefangen" hat.
      positionenAuswahl = gewaehlt;
      const neueWerte = {...snapVorPositionen, txtBetrag: summe.toFixed(2).replace('.',',')};
      ansichtMaske(art, korrekturIdx, {werte: neueWerte, positionen: positionenAuswahl});
    }, kmFahrstrecke);
  };

  function werteEinsammeln(){
    const w = {};
    feldIds.forEach(n=>{ const el=document.getElementById(n); if(el) w[n]=el.value.trim(); });
    const betragEl = document.getElementById('txtBetrag');
    w.txtBetrag = betragEl ? betragEl.value.trim() : (werte.txtBetrag||'');
    if(art==='pt') w.diagnosen = diagnosen.map(d=>({...d}));
    return w;
  }

  document.getElementById('btnSpeichern').onclick = ()=>{
    alleChecksAusfuehren();
    if(art==='ls') pruefeBestatterLeer();
    // txtBName_warn bewusst ausgenommen: das ist nur eine Information
    // ("wird an Patientenadresse adressiert"), kein Fehler, der behoben
    // werden muss -- sonst blockiert dieser Hinweis das Speichern komplett,
    // sobald kein Bestatter eingetragen ist (ohne jede Möglichkeit, ihn
    // "bewusst so [zu] belassen", wie es der Hinweistext selbst anbietet).
    const offeneWarnung = app.querySelector('.warnhinweis.aktiv:not(#txtBName_warn)');
    if(offeneWarnung){
      // WICHTIG: alertBanner() scrollt selbst auch (zum Banner unten) --
      // erst NACH alertBanner() zum eigentlichen Hinweis scrollen, sonst
      // gewinnt dessen Scroll und man landet wieder unten am Banner statt
      // beim eigentlich markierten Feld.
      alertBanner('Bitte zuerst die markierten Hinweise oben prüfen (korrigieren oder bewusst so belassen).');
      offeneWarnung.scrollIntoView({behavior:'smooth', block:'center'});
      return;
    }
    const w = werteEinsammeln();
    // Pflichtfelder, die fehlen, zusätzlich zum Hinweistext auch rot
    // umranden -- fällt bei längeren Masken (das fehlende Feld kann weit
    // oben oder unten stehen) deutlich schneller auf als nur der Text im
    // Banner. Wird bei jedem Speichern-Versuch neu berechnet, damit ein
    // inzwischen ausgefülltes Feld die rote Umrandung auch wieder verliert.
    // ALLE Pflichtfelder werden geprüft (nicht nur das erste gefundene) und
    // alle fehlenden Bezeichnungen im Hinweistext genannt -- vorher wurden
    // nur 3 fest verdrahtete Felder geprüft, wodurch z.B. eine PT ohne
    // Uhrzeit Hausbesuch und ohne Geburtsdatum gespeichert werden konnte.
    let ersteFehlendeId = null;
    const fehlendeLabels = [];
    pflichtfelderKonfig.forEach(({id, label})=>{
      const el = document.getElementById(id);
      if(!el) return;
      const fehlt = !el.value.trim();
      el.classList.toggle('pflichtfeld-fehlt', fehlt);
      if(fehlt){
        fehlendeLabels.push(label);
        if(!ersteFehlendeId) ersteFehlendeId = id;
      }
    });
    // Diagnose (nur PT): mindestens eine ausgewählte Diagnose nötig.
    if(art==='pt'){
      const diagFeld = document.getElementById('txtDiag');
      const diagFehlt = !diagnosen.length;
      if(diagFeld) diagFeld.classList.toggle('pflichtfeld-fehlt', diagFehlt);
      if(diagFehlt){
        fehlendeLabels.push('Diagnose (ICD-Suche)');
        if(!ersteFehlendeId) ersteFehlendeId = 'txtDiag';
      }
    }
    // Rechnungspositionen (beide Maskentypen): muss mindestens einmal
    // geprüft/ausgewählt worden sein (auch die reine Automatik-Auswahl
    // zählt -- entscheidend ist, dass btnPunkte tatsächlich einmal
    // durchlaufen wurde, nicht nur die Grundleistung).
    const positionenFehlen = !positionenAuswahl || positionenAuswahl.size===0;
    const btnPunkteEl = document.getElementById('btnPunkte');
    if(btnPunkteEl) btnPunkteEl.classList.toggle('pflichtfeld-fehlt', positionenFehlen);
    if(positionenFehlen){
      fehlendeLabels.push('Rechnungspositionen');
      if(!ersteFehlendeId) ersteFehlendeId = 'btnPunkte';
    }
    if(ersteFehlendeId){
      alertBanner('Bitte noch ausfüllen: '+fehlendeLabels.join(', ')+' (rot umrandet).');
      document.getElementById(ersteFehlendeId).scrollIntoView({behavior:'smooth', block:'center'});
      return;
    }
    // Format-Pruefung wie am PC (RechnungErstellen_Click): mit Komma IMMER
    // "Nachname, Vorname"; ohne Komma "Vorname Nachname" (mind. 2 Wörter).
    if(!nameAufteilen(w.txtName).nachname){
      document.getElementById('txtName').classList.add('pflichtfeld-fehlt');
      alertBanner(`Name "${w.txtName}" nicht erkannt -- bitte im Format "Nachname, Vorname" oder "Vorname Nachname" eingeben.`);
      return;
    }
    if(art==='ls' && w.txtBName){
      bestatterEintragen(w.txtBName, w.txtAdresse1, w.txtAdresse2);
    }
    const faelle = ladeFaelle(art);
    const eintrag = {
      werte:w,
      positionen: positionenAuswahl ? Array.from(positionenAuswahl) : [],
      zeitstempel: korrekturIdx!==undefined ? faelle[korrekturIdx].zeitstempel : new Date().toISOString()
    };
    // Eine bereits vergebene Rechnungsnummer (siehe rechnungsnummernVergeben)
    // darf beim erneuten Speichern/Korrigieren desselben Falls NICHT verloren
    // gehen -- sonst würde ein erneutes Kopieren eine zweite, abweichende
    // Nummer vergeben und den Zaehler unnötig weiterzählen.
    if(korrekturIdx!==undefined && faelle[korrekturIdx].rechnungsnummer){
      eintrag.rechnungsnummer = faelle[korrekturIdx].rechnungsnummer;
    }
    if(korrekturIdx!==undefined) faelle[korrekturIdx]=eintrag; else faelle.push(eintrag);
    speichereFaelle(art, faelle);
    // Erfolgreich gespeichert -- ein evtl. zwischengespeicherter Entwurf
    // (siehe maskenEntwuerfe/zurueckAusMaske) ist jetzt ueberholt (die Werte
    // stecken bereits als echter Fall in der Uebersicht) und wuerde sonst
    // beim naechsten Anlegen einer neuen Rechnung faelschlich wieder
    // auftauchen.
    if(korrekturIdx===undefined) maskenEntwuerfe[art] = null;
    alertBanner('Gespeichert. Wird beim nächsten Sync automatisch an den PC übertragen.');
    setTimeout(ruecksprungZiel, 900);
  };
}

/* ==========================================================
   Handy-"Zurück"-Taste / Zurück-Wischgeste
   ==========================================================
   Ohne Eingriff wuerde die Hardware-/Gesten-"Zurück"-Taste eines Android-
   Handys eine installierte PWA direkt schliessen (es gibt ja keine eigene
   Browser-Adresszeilen-Historie). Stattdessen soll sie sich -- wie
   gewuenscht -- genauso verhalten wie der Zurück-Pfeil oben in der Kopfzeile:
   IMMER erst versuchen, es an aktuellerZurueckHandler() zu delegieren.
   Nur auf der Startseite (aktuellerZurueckHandler ist dort null) bedeutet
   "Zurück" tatsaechlich "App verlassen" -- dafuer erst ein "nochmal drücken"-
   Hinweis (analog dem auf Android ueblichen "Nochmal drücken, um die App zu
   beenden"), damit man nicht aus Versehen rausfliegt.
   Technik: bei jedem Ansichtswechsel bleibt IMMER ein "Wächter"-Eintrag ganz
   oben im Browser-Verlauf (history.pushState) -- das Zurückgehen darüber
   hinaus loest dann popstate aus, statt die Seite/App wirklich zu verlassen.

   WICHTIG (Fix): dieser Block wird jetzt bewusst GANZ ZU BEGINN des
   Skripts eingerichtet -- noch VOR themaAnwenden()/ansichtStart()/
   autoSyncInitialisieren(). Vorher stand er ganz am Ende; wenn dort
   VORHER (in ansichtStart() o.ä.) unbemerkt ein Laufzeitfehler auftrat,
   wurde dieser Block nie mehr erreicht -- die Zurück-Taste hatte dann
   GAR KEINE Absicherung und schloss die App direkt, ohne jeden Hinweis.
   Jetzt ist die Absicherung aktiv, auch wenn spaeterer Code scheitert.

   Zusaetzlicher Fix: beim ERSTEN "Zurück" auf der Startseite wird der
   Wächter bewusst NICHT erneut gesetzt (vorher doch -- dadurch waren
   tatsaechlich 3 Tastendruecke noetig, bis die App wirklich zu war, der
   zweite Tastendruck schien wirkungslos zu sein). Jetzt reicht -- wie
   angekuendigt -- ein zweiter Tastendruck, um die App tatsaechlich zu
   schliessen.
   ========================================================== */
// Kurzer Einblend-Hinweis (siehe #appToast) -- liegt AUSSERHALB von #app,
// wird also von einem Ansichtswechsel nicht mit weggerissen. Allgemein
// nutzbar (Zurück-Taste-Hinweis, Auto-Sync-Rückmeldungen, ...).
let appToastTimer = null;
function appToastAnzeigen(text, dauerMs){
  const toast = document.getElementById('appToast');
  if(!toast) return;
  toast.textContent = text;
  toast.classList.add('aktiv');
  clearTimeout(appToastTimer);
  appToastTimer = setTimeout(()=> toast.classList.remove('aktiv'), dauerMs || 2500);
}

(function hardwareZurueckEinrichten(){
  let appBeendenBestaetigt = false;

  function waechterSetzen(){
    try{ history.pushState({rechnungserfassungWaechter:true}, '', location.href); }catch(e){}
  }
  waechterSetzen();

  window.addEventListener('popstate', ()=>{
    if(aktuellerZurueckHandler){
      // Wie ein Klick auf den Zurück-Pfeil oben -- danach sofort wieder
      // einen Wächter setzen, damit die NÄCHSTE Zurück-Taste erneut hier
      // ankommt, statt die App zu verlassen.
      waechterSetzen();
      aktuellerZurueckHandler();
      return;
    }
    // WICHTIG (Fix): das "2x Zurück beendet die App"-Verhalten darf
    // AUSSCHLIESSLICH auf dem Hauptbildschirm greifen -- geprüft über das
    // explizite aktuelleAnsichtIstHauptbildschirm-Flag, nicht nur implizit
    // darüber, dass aktuellerZurueckHandler zufällig null ist. Ohne diese
    // Absicherung konnte auf manchen Geräten (Android-Zurück-Geste/-Taste
    // feuert dort ggf. anders/schneller als im Test) ein zweiter, sehr
    // schnell aufeinanderfolgender Zurück-Tastendruck aus einer Maske
    // heraus die App direkt UND OHNE jeden Hinweis beenden. Sind wir NICHT
    // auf dem Hauptbildschirm (z.B. weil aktuellerZurueckHandler aus
    // irgendeinem Grund nicht gesetzt war), wird stattdessen IMMER
    // sicherheitshalber zur Startseite gesprungen statt die App zu
    // gefährden.
    if(!aktuelleAnsichtIstHauptbildschirm){
      waechterSetzen();
      appBeendenBestaetigt = false;
      ansichtStart();
      return;
    }
    // Startseite, zweites "Zurück" (innerhalb von 2,5 s nach dem Hinweis):
    // diesmal wirklich NICHTS abfangen/erneut bewachen -- die Taste soll
    // jetzt tatsaechlich wirken und die App verlassen.
    if(appBeendenBestaetigt){
      appBeendenBestaetigt = false;
      return;
    }
    // Startseite, erstes "Zurück": nur Hinweis anzeigen, Wächter bewusst
    // NICHT erneut setzen, damit der naechste Tastendruck direkt wirkt.
    appBeendenBestaetigt = true;
    appToastAnzeigen('Nochmal zurück drücken, um die App zu beenden.', 2500);
    setTimeout(()=>{ appBeendenBestaetigt = false; }, 2500);
  });
})();

/* ==========================================================
   Start
   ========================================================== */
// Jeder Schritt einzeln try/catch-abgesichert: ein Fehler in einem Teil
// (z.B. Auto-Sync-Initialisierung) soll die anderen Teile (allen voran die
// Zurück-Tasten-Absicherung oben, aber auch die eigentliche Bildschirm-
// anzeige) nicht mit lahmlegen.
try{ themaAnwenden(); }catch(e){}
try{ ansichtStart(); }catch(e){}
// Ohne await -- die Startansicht soll nicht auf die (async) Prüfung des
// evtl. schon zuvor gewählten Sync-Ordners warten. Ist der Ordner noch
// gültig verbunden, wird der aktuelle Stand direkt nachgeholt. WICHTIG:
// der Sync-Button auf der Startseite zeigt beim allerersten Rendern noch
// autoSyncStatus 'unbekannt', weil diese Prüfung hier async läuft --
// deshalb hier nach dem Auflösen die Startseite (falls man noch/wieder
// dort ist) einmal neu rendern, damit der Button den echten Status zeigt.
try{
  autoSyncInitialisieren().then(()=>{
    if(aktuelleAnsichtIstHauptbildschirm) ansichtStart();
  }).catch(()=>{});
}catch(e){}

// Analog zu autoSyncInitialisieren oben: ohne await gestartet, damit der
// erste Bildschirmaufbau nicht auf die (async) MSAL-Initialisierung warten
// muss. WICHTIG: verarbeitet u.a. die Rueckkehr vom Microsoft-Login-Redirect
// (handleRedirectPromise) -- deshalb bei JEDEM Seitenaufruf noetig, nicht
// nur wenn man die Einstellungen gerade offen hat. War man vor dem Redirect
// in den Einstellungen (einstellungenOffen), diese danach einmal neu
// aufbauen, damit der aktualisierte Anmeldestatus sichtbar wird.
try{
  msGraphInitialisieren().then(()=>{
    if(einstellungenOffen) ansichtEinstellungen();
    // Auch den Sync-Button auf der Startseite (falls gerade dort) sofort
    // aktualisieren -- direkt nach einem frischen Login landet man dort,
    // und der Button soll sofort "OneDrive" statt des alten Zustands zeigen.
    else if(aktuelleAnsichtIstHauptbildschirm) ansichtStart();

    // Automatischer Download+Merge der OneDrive-Sync-Datei (siehe Kommentar
    // dort) -- laeuft bei jedem Start/Neuladen mit aktiver Anmeldung sowie
    // direkt nach einer frischen Anmeldung (beides landet hier, da
    // msGraphStatus in beiden Faellen 'angemeldet' ist). Ohne await, damit
    // der erste Bildschirmaufbau (siehe oben) nicht darauf warten muss; nur
    // bei tatsaechlich uebernommenen neuen Faellen wird die evtl. gerade
    // sichtbare Ansicht anschliessend einmal neu aufgebaut.
    msGraphSyncAutomatischEinlesen().then((geaendert)=>{
      if(!geaendert) return;
      if(einstellungenOffen) ansichtEinstellungen();
      else if(aktuelleAnsichtIstHauptbildschirm) ansichtStart();
    }).catch(()=>{});
  }).catch(()=>{});
}catch(e){}

if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
</script>
