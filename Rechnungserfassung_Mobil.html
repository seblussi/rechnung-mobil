<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rechnungserfassung</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#2b3a55">
<!-- Sagt Chrome/Android, dass die Seite Hell-/Dunkelmodus selbst
     handhabt -- verhindert, dass Android Chromes "Force Dark"-Heuristik
     einzelne (v.a. transparent/blass gestylte) Elemente eigenmaechtig
     umfaerbt und dadurch z.B. Buttontext unsichtbar macht. -->
<meta name="color-scheme" content="light dark">
<script src="icd_katalog.js"></script>
<style>
  :root{
    --bg:#f4f6f9;
    --karte:#ffffff;
    --text:#1a1a1a;
    --text-schwach:#666;
    --rand:#dcdfe3;
    --titelfarbe:#2b3a55;
    --ls-farbe:#1f5f9e;
    --pt-farbe:#1f8a4c;
    --warnung-bg:#fff4e5;
    --warnung-rand:#e8a33d;
    --warnung-text:#7a4a00;
    --fehler:#b3261e;
    --grau-feld:#eceef0;
  }
  body.dunkel{
    --bg:#1b2028;
    --karte:#242b36;
    --text:#dde2e8;
    --text-schwach:#9aa4ad;
    --rand:#333b42;
    /* --titelfarbe bewusst NICHT umdefiniert -- die Kopfzeile/Abschnitts-
       leisten sollen im Dunkelmodus dieselbe (dunkle) Farbe wie im
       Hellmodus behalten statt auf ein helles Grau umzuschalten, das mit
       weißer Schrift viel zu hell/blass wirkte. */
    --warnung-bg:#3a2c10;
    --warnung-rand:#c78a2e;
    --warnung-text:#f0c98a;
    --fehler:#ff6b60;
    --grau-feld:#2a3138;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:"Segoe UI",-apple-system,Roboto,Arial,sans-serif;
    background:var(--bg); color:var(--text); padding-bottom:40px;
    /* WICHTIG: das <meta name="color-scheme" content="light dark"> im <head>
       erlaubt dem Browser, native Formularelemente (v.a. Checkboxen) nach dem
       OS-Farbschema zu zeichnen -- das kann z.B. bei einem Handy im
       System-Dunkelmodus dazu fuehren, dass Checkboxen dunkel wirken, OBWOHL
       die App selbst gerade im hellen Design steht (App-Dunkelmodus ist ein
       eigener, unabhaengiger Schalter, kein OS-Schalter). "color-scheme" hier
       gezielt je nach App-Zustand setzen, damit native Checkboxen IMMER zum
       tatsaechlich aktiven App-Design passen -- unabhaengig vom OS-Schalter. */
    color-scheme: light;
  }
  body.dunkel{ color-scheme: dark; }
  header{
    background:var(--titelfarbe); color:#fff; padding:14px 16px;
    display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; z-index:10;
  }
  header h1{font-size:17px; margin:0; font-weight:600;}
  header .zurueck, header .zahnrad{
    background:none; border:none; color:#fff; font-size:22px; cursor:pointer; padding:4px 8px;
  }
  main{padding:14px 14px 60px;}

  .kachelreihe{display:flex; flex-direction:column; align-items:center; gap:18px; margin:10px 0 20px;}
  .karte{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    width:min(78vw, 290px); height:min(62vw, 230px);
    border:none; border-radius:16px; color:#fff; font-family:inherit;
    font-size:24px; font-weight:bold; cursor:pointer; box-shadow:0 5px 12px rgba(0,0,0,.18);
  }
  .karte:active{filter:brightness(1.08);}
  .karte.ls{background:var(--ls-farbe);}
  .karte.pt{background:var(--pt-farbe);}
  .karte .icon{font-size:52px; display:block; margin-bottom:14px;}
  .karte .unter{font-size:12.5px; font-weight:400; opacity:.9; margin-top:4px;}

  .btn-sekundaer{
    display:block; width:100%; background:var(--karte); border:1px solid var(--rand);
    color:var(--text); border-radius:10px; padding:14px; font-size:15px; margin-bottom:10px; cursor:pointer;
  }
  .btn-sekundaer .unter{display:block; font-size:12px; color:var(--text-schwach); margin-top:2px; font-weight:400;}
  .btn-export{border-color:#e8a33d; color:#7a4a00; background:#fff4e5;}
  body.dunkel .btn-export{background:#3a2c10; color:#f0c98a; border-color:#c78a2e;}

  /* Jeder Formularabschnitt bekommt eine eigene "Karte" mit Rand und
     Hintergrund -- deutlich klarere optische Trennung als vorher nur mit
     einer kleinen Textzeile. */
  .abschnitt{
    background:var(--karte); border:1px solid var(--rand); border-radius:12px;
    padding:14px 14px 4px; margin-bottom:16px; box-shadow:0 1px 3px rgba(0,0,0,.05);
  }
  .abschnitt .feld:last-child{margin-bottom:4px;}
  .trennlinie{
    font-size:12.5px; font-weight:700; color:#fff; margin:-14px -14px 14px;
    text-transform:uppercase; letter-spacing:.04em; background:var(--titelfarbe);
    padding:9px 14px; border-radius:11px 11px 0 0;
  }
  .maske.pt .abschnitt .trennlinie{background:var(--pt-farbe);}
  .maske.ls .abschnitt .trennlinie{background:var(--ls-farbe);}
  .feld{margin-bottom:12px;}
  .feld label{display:block; font-size:12.5px; color:var(--text-schwach); margin-bottom:3px;}
  .feld input, .feld select, .feld textarea{
    width:100%; padding:10px 11px; border:1px solid var(--rand); border-radius:8px;
    font-size:15px; background:var(--karte); color:var(--text);
  }
  .feld input.grau{background:var(--grau-feld);}
  .feld input:focus, .feld select:focus{outline:2px solid var(--ls-farbe); outline-offset:0;}
  .maske.pt .feld input:focus, .maske.pt .feld select:focus{outline-color:var(--pt-farbe);}
  /* Beim Klick auf "Speichern" fehlende Pflichtfelder rot umranden --
     deutlicher als nur der Text im Hinweisbanner oben, besonders bei
     längeren Masken, wo das fehlende Feld weit unten stehen kann. */
  .feld input.pflichtfeld-fehlt{border:2px solid var(--fehler);}
  /* Gleiche rote Markierung auch für Pflicht-"Felder", die kein <input> in
     einem .feld-Wrapper sind -- z.B. der "Rechnungspositionen auswählen"-
     Button, wenn noch keine Position gewählt wurde. */
  .btn-primaer.pflichtfeld-fehlt{border:2px solid var(--fehler) !important;}
  .warnhinweis{
    background:var(--warnung-bg); border:1px solid var(--warnung-rand); color:var(--warnung-text);
    border-radius:8px; padding:9px 11px; font-size:13px; margin-top:6px; display:none;
  }
  .warnhinweis.aktiv{display:block;}
  .versteckt{display:none;}
  .warnhinweis .aktionen{margin-top:8px; display:flex; gap:8px;}
  .warnhinweis button{
    border:1px solid var(--warnung-rand); background:transparent; color:var(--warnung-text);
    border-radius:6px; padding:6px 10px; font-size:12.5px; cursor:pointer;
  }
  .autocomplete-liste{
    border:1px solid var(--rand); border-top:3px solid var(--ls-farbe); border-radius:8px; background:var(--karte);
    max-height:160px; overflow-y:auto; display:none; margin-top:6px; margin-bottom:12px;
    box-shadow:0 2px 6px rgba(0,0,0,.08);
  }
  /* Die farbige Linie markiert deutlich den oberen Rand des scrollbaren
     Vorschlagsbereichs (statt wie vorher unauffaellig in Randfarbe) --
     Farbe je nach Maske (ls/pt), analog zu den Abschnitts-Trennlinien. */
  .maske.pt .autocomplete-liste{border-top-color:var(--pt-farbe);}
  .autocomplete-liste.aktiv{display:block;}
  .autocomplete-liste div{padding:9px 11px; font-size:14px; border-bottom:1px solid var(--rand); cursor:pointer;}
  .autocomplete-liste div:last-child{border-bottom:none;}
  /* Freitext-Diagnose-Option optisch von den echten Katalog-Treffern
     absetzen (kursiv + Akzentfarbe), damit klar ist, dass das kein
     ICD-Katalogeintrag ist, sondern der frei eingetippte Text. */
  .autocomplete-liste div.diag-freitext{font-style:italic; color:var(--pt-farbe); font-weight:600;}
  .btn-primaer{
    background:var(--ls-farbe); color:#fff; border:none; border-radius:10px; padding:14px;
    font-size:15px; font-weight:600; width:100%; margin-top:6px; cursor:pointer;
  }
  /* Bewusst UNDURCHSICHTIGER Hintergrund (statt transparent): ein
     transparenter Hintergrund liess Android-Chrome (Force-Dark-Heuristik)
     gelegentlich auch die Textfarbe umfaerben, wodurch der Button auf
     manchen Geraeten wie unbeschriftet wirkte. */
  .btn-primaer.blass{background:var(--karte); color:var(--ls-farbe); font-weight:600; border:2px solid var(--ls-farbe);}
  .maske.pt .btn-primaer{background:var(--pt-farbe);}
  /* WICHTIG: ".maske.pt .btn-primaer" (3 Klassen-Selektoren) ist
     spezifischer als ".btn-primaer.blass" (2 Klassen-Selektoren) und hätte
     sonst dessen Hintergrundfarbe überschrieben -- das war der tatsächliche
     Grund für den "Aus Zwischenablage"-Button ohne sichtbare Beschriftung
     in der Privatrechnung-Maske: grüne Schrift auf grünem statt weißem
     Hintergrund. Hintergrund hier deshalb explizit erneut setzen. */
  .maske.pt .btn-primaer.blass{background:var(--karte); color:var(--pt-farbe); border-color:var(--pt-farbe);}
  .btn-primaer.blass .unter{display:block; font-size:12px; margin-top:2px; font-weight:400; opacity:.85;}
  /* "Sterbeort abweichend?" sitzt wie am PC (btnSterbeAbw: gleiche Zeile wie
     "PLZ + Stadt", rechtsbuendig, kompakte Schaltflaeche) rechts NEBEN dem
     PLZ/Ort-Feld statt als eigene volle Zeile darunter. */
  .feld-zeile-mit-btn{display:flex; gap:8px; align-items:flex-end;}
  .feld-zeile-mit-btn .feld{flex:1; margin-bottom:12px;}
  .btn-inline-blass{
    flex:0 0 auto; margin-bottom:12px; padding:10px 12px; font-size:12.5px; font-weight:600;
    border-radius:8px; background:var(--karte); border:1.5px solid var(--ls-farbe); color:var(--ls-farbe);
    cursor:pointer; white-space:nowrap;
  }
  /* "Aus Zwischenablage einlesen" steht direkt unter der Abschnitt-Titelzeile
     (trennlinie) -- deren eigener unterer Rand liefert bereits 14px Abstand
     nach oben; der Button-Standard-Rand (margin-top:6px) addierte sich
     bisher noch obendrauf, waehrend nach unten gar kein Rand gesetzt war --
     dadurch wirkte der Button spuerbar zu tief/asymmetrisch platziert.
     Hier bewusst gleicher Abstand (14px) ober- und unterhalb. */
  .trennlinie + .btn-primaer.blass{margin-top:0; margin-bottom:14px;}
  /* Der Hinweis zum Zwischenablage-Import (erkannter Sterbezeitpunkt etc.)
     folgt direkt auf den Button oben -- dessen eigener unterer Rand (14px)
     reicht als Abstand bereits aus. Der normale warnhinweis-margin-top
     (6px) addierte sich bisher zusaetzlich dazu und wirkte im Vergleich zum
     sonstigen 12px-Rhythmus zwischen den Feldern spuerbar zu groß.
     NACH UNTEN fehlte dagegen JEDER Abstand: anders als ein normaler
     warnhinweis (der innerhalb eines .feld sitzt und dessen 12px
     margin-bottom den Abstand zum naechsten Feld liefert) steht dieser
     Hinweis freistehend direkt vor dem "Nachname, Vorname"-Feld -- ohne
     eigenen unteren Rand stieß die Box direkt an das Feld/Label darunter.
     Jetzt mit demselben 12px-Rhythmus wie zwischen den uebrigen Feldern. */
  #zwischenablageHinweis{margin-top:0; margin-bottom:12px;}
  .streckeninfo{font-size:12.5px; color:var(--text-schwach); margin-top:4px; min-height:16px;}
  /* Solange noch keine Strecke berechnet wurde, ist streckeninfo leer -- die
     feste Mindesthoehe sorgte dann trotzdem fuer einen spuerbar zu grossen
     Abstand zwischen dem km-Feld und dem Alternativrouten-Button darunter.
     Im leeren Zustand daher keinen Platz reservieren. */
  .streckeninfo:empty{margin-top:0; min-height:0;}
  /* Analog zur PC-Maske (KmBerechnen/RoutenAnzeigen: eine "Fahrstrecke i"-
     Schaltflaeche je Routenalternative + separate "Google Maps"-Schaltflaeche
     zum Pruefen/Oeffnen der Route). In der Mobil-Maske dafuer 2 feste
     Buttons statt dynamisch erzeugter PC-Buttons: "Alternativrouten" oeffnet
     eine Auswahlliste (routenoptionen), "Google Maps Route" oeffnet direkt
     die Google-Maps-App/-Webseite mit der Strecke. */
  .route-btn-reihe{display:flex; gap:8px; margin-top:10px; margin-bottom:12px;}
  .route-btn-reihe button{
    flex:1; padding:10px 6px; font-size:12.5px; font-weight:600; border-radius:8px;
    background:var(--karte); cursor:pointer; border:1.5px solid var(--ls-farbe); color:var(--ls-farbe);
  }
  .maske.pt .route-btn-reihe button{border-color:var(--pt-farbe); color:var(--pt-farbe);}
  .routenoptionen{margin-top:8px; display:none;}
  .routenoptionen.aktiv{display:block;}
  .routenoptionen button{
    display:block; width:100%; text-align:left; padding:10px 11px; margin-bottom:6px;
    border:1px solid var(--rand); border-radius:8px; background:var(--grau-feld); color:var(--text);
    font-size:13px; cursor:pointer;
  }
  .routenoptionen .routenoptionen-hinweis{font-size:12.5px; color:var(--text-schwach); padding:2px 2px 6px;}
  /* Kurzer Einblend-Hinweis fuer die Handy-"Zurück"-Taste (z.B. "nochmal
     zurück zum Beenden") -- liegt AUSSERHALB von #app, damit er einen
     Ansichtswechsel (app.innerHTML wird komplett neu geschrieben) übersteht. */
  .app-toast{
    position:fixed; left:16px; right:16px; bottom:18px; z-index:50;
    background:var(--text); color:var(--karte); font-size:13.5px; text-align:center;
    padding:11px 16px; border-radius:10px; box-shadow:0 2px 10px rgba(0,0,0,.25);
    opacity:0; pointer-events:none; transform:translateY(6px);
    transition:opacity .18s, transform .18s;
  }
  .app-toast.aktiv{opacity:.95; transform:translateY(0);}
  .fall-zeile{
    background:var(--karte); border:1px solid var(--rand); border-left:4px solid var(--rand); border-radius:10px; padding:12px 14px;
    margin-bottom:8px; cursor:pointer; display:flex; align-items:flex-start; gap:10px;
  }
  .fall-zeile .chk{width:20px; height:20px; flex-shrink:0; margin-top:2px;}
  .fall-zeile .inhalt{flex:1; min-width:0;}
  /* Auswahlleiste oben in der Rechnungsübersicht: sticky direkt unter der
     Kopfzeile, damit "Löschen"/"Kopieren" auch bei langen Listen immer
     erreichbar sind, ohne erst hochscrollen zu müssen. */
  .auswahlleiste{
    position:sticky; top:0; z-index:5; background:var(--bg); padding:10px 0 12px;
    margin:-14px -14px 14px; padding-left:14px; padding-right:14px;
    border-bottom:1px solid var(--rand);
  }
  .auswahlleiste .zeile1{display:flex; align-items:center; gap:8px; font-size:13.5px; margin-bottom:8px;}
  .auswahlleiste .zeile1 label{display:flex; align-items:center; gap:6px; cursor:pointer;}
  .auswahlleiste .aktionen-reihe{display:flex; gap:8px; flex-wrap:wrap;}
  .auswahlleiste .aktionen-reihe button{
    flex:1; min-width:110px; padding:9px 8px; font-size:12.5px; font-weight:600; border-radius:8px;
    background:var(--karte); cursor:pointer; border:1.5px solid var(--rand); color:var(--text);
  }
  .auswahlleiste .aktionen-reihe button:disabled{opacity:.45; cursor:default;}
  .auswahlleiste .aktionen-reihe button.gefahr{border-color:var(--fehler); color:var(--fehler);}
  .auswahlleiste .aktionen-reihe button.betont{border-color:var(--ls-farbe); color:var(--ls-farbe);}
  /* Farbcode wie in der Maske selbst: LS/PT-Fälle in "Rechnung korrigieren"
     bekommen denselben Rand-/Badge-Farbton wie ihre Bearbeitungsmaske
     (ls-farbe/pt-farbe), statt alle Fälle mit derselben neutralen Farbe
     anzuzeigen -- so ist auf einen Blick erkennbar, um welche Art Rechnung
     es sich handelt, bevor man zum Bearbeiten hineintippt. */
  .fall-zeile.ls{border-left-color:var(--ls-farbe);}
  .fall-zeile.pt{border-left-color:var(--pt-farbe);}
  .fall-zeile .name{font-weight:600;}
  .fall-zeile .info{font-size:12.5px; color:var(--text-schwach); margin-top:2px;}
  .einstellung-zeile{
    display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--rand); cursor:pointer;
  }
  .einstellung-zeile input{width:20px; height:20px; flex-shrink:0;}
  .einstellung-zeile .txt{font-size:14.5px;}
  .einstellung-zeile .txt .hinweis{display:block; font-size:12px; color:var(--text-schwach);}
  .leer-hinweis{text-align:center; color:var(--text-schwach); font-size:14px; padding:30px 10px;}
  .badge-neu{background:var(--titelfarbe); color:#fff; font-size:11px; padding:2px 6px; border-radius:4px; margin-left:6px;}
  .badge-neu.ls{background:var(--ls-farbe);}
  .badge-neu.pt{background:var(--pt-farbe);}

  .position-zeile{display:flex; align-items:flex-start; gap:10px; padding:6px 0; border-bottom:1px solid var(--rand);}
  .position-zeile input{width:20px; height:20px; margin-top:1px; flex-shrink:0;}
  .position-zeile .haupt{flex:1; font-size:13.5px; line-height:1.25;}
  .position-zeile .ziffer{font-weight:600; color:var(--text-schwach); font-size:12px;}
  .position-zeile .betrag{font-weight:600; min-width:60px; text-align:right; font-size:14px;}
  /* Kompakter als vorher (18px/4px), damit die komplette Positionsliste
     eher auf einen Bildschirm passt -- v.a. bei mehreren Zwischenüberschriften
     summierte sich der alte Abstand deutlich auf. */
  .positionen-gruppe-titel{font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--text-schwach); margin:10px 0 2px;}
  .positionen-gruppe-titel:first-child{margin-top:0;}
  .auto-hinweis{font-weight:400; text-transform:none; letter-spacing:0; font-style:italic;}
  /* Automatik-Kategorien (Zeitzuschlag/Wegegeld/Reise) sind nicht manuell
     anwählbar -- optisch klar als gesperrt/ausgegraut erkennbar, analog zu
     einer durch Ausschluss gesperrten Position. */
  .position-zeile.auto-gesperrt{opacity:.55;}
  .position-zeile input:disabled{cursor:default;}
  .summenzeile{display:flex; justify-content:space-between; font-size:17px; font-weight:700; padding:10px 0; border-top:2px solid var(--rand); margin-top:6px;}

  .diag-chip{
    display:flex; align-items:flex-start; gap:8px; background:var(--grau-feld); border-radius:8px;
    padding:8px 10px; margin-bottom:8px;
  }
  .diag-chip .chip-text{flex:1; font-size:13.5px; line-height:1.35;}
  .diag-chip label{display:flex; align-items:center; gap:3px; font-size:12px; color:var(--text-schwach); white-space:nowrap;}
  .diag-chip input[type=checkbox]{width:16px; height:16px;}
  .diag-chip .chip-del{
    background:none; border:none; color:var(--fehler); font-size:16px; font-weight:700; cursor:pointer; padding:0 2px;
  }
</style>
</head>
<body>

<header>
  <button class="zurueck" id="btnZurueck" style="visibility:hidden">&#8592;</button>
  <h1 id="titel">Rechnungserfassung</h1>
  <button class="zahnrad" id="btnEinstellungen">&#9881;</button>
</header>

<main id="app"></main>
<div id="appToast" class="app-toast"></div>

<script>
/* ==========================================================
   Speicher / Grunddaten
   ========================================================== */
const LS = {
  get(k, fallback){ try{ const v = localStorage.getItem(k); return v===null? fallback : JSON.parse(v);}catch(e){return fallback;} },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
function ladeFaelle(art){ return LS.get('faelle_'+art, []); }
function speichereFaelle(art, arr){ LS.set('faelle_'+art, arr); autoSyncSchreiben(); }

// Startbestückung des Bestatter-Katalogs (Stand PC-Liste). Wird nur EINMAL
// beim allerersten Aufruf eingespielt (Flag 'bestatter_katalog_seed_v1'),
// damit spätere Löschungen/Änderungen durch den Nutzer nicht immer wieder
// überschrieben werden.
const BESTATTER_STANDARD = [
  ["Berdon","Kaiserstraße 55","76437 Rastatt"],
  ["Bestattungshaus Im Ried","Oberdorfstraße 23","77974 Meißenheim"],
  ["Braunagel","Konrad-Adenauer-Straße 3A","76571 Gaggenau"],
  ["Ettenheim (Pflegeheim)","Münstertalstraße 19","77955 Ettenheim"],
  ["Finger Blank","Bierkellerstraße 6","77694 Kehl"],
  ["Geiger","Moltkestr. 27","77654 Offenburg"],
  ["Hassmann","Wörthstraße 15","77839 Lichtenau"],
  ["Heck","Hauptstraße 5","76571 Gaggenau"],
  ["Heidenreich","Weingartenstraße 74","77654 Offenburg"],
  ["Hüter","Kirschbaumallee 5","76448 Durmersheim"],
  ["Kiechle","Spießgasse 1","77694 Kehl"],
  ["Kiechle","Ebertplatz 19","77654 Offenburg"],
  ["Köppel","Franz-Philipp-Straße 5","76437 Rastatt"],
  ["Laug","Hinter den Gärten 12","77656 Offenburg"],
  ["Link","Fischerstraße 36","77977 Rust"],
  ["Mechler","Hauptstraße 78","77815 Bühl"],
  ["Merkle","Leutkirchstraße 30","77723 Gengenbach"],
  ["Messner","Strickerweg 1a","77716 Haslach"],
  ["Rainer Weber","Dekan-Höfler-Straße 1","76532 Baden-Baden"],
  ["Rudi Klumpp","Wilhelmstraße 59","76461 Muggensturm"],
  ["Schmider","Gummenstraße 28","77756 Hausach"],
  ["Schwenk","Gerberstrasse 3-4 Martinstraße 4","77855 Achern"]
];
function ladeKatalog(){
  if(!LS.get('bestatter_katalog_seed_v1', false)){
    const bestehend = LS.get('bestatter_katalog', []);

// Format exakt wie am PC (Modul1, RenuBilden/Aehnliches):
//   <Anfangsbuchstabe Nachname><Anfangsbuchstabe Vorname><yymmdd>-<Zaehler:000>
// Der Zaehler selbst kommt am PC aus LeseZaehlerAusUebersicht(): letzte
// Zeile der Spalte Q (Rech.-Nr.) in der Rechnungsübersicht, davon die
// letzten 3 Ziffern +1 -- KEIN Tages- oder Namens-Reset, ein einziger
// fortlaufender Zaehler über die gesamte Übersicht. Das Handy hat keinen
// Lesezugriff auf die (OneDrive-)Excel-Datei, daher wird der Zaehler hier
// lokal fortgeführt: einmalig aus der letzten Rechnungsnummer der
// Übersicht abgeglichen (Einstellungen), danach bei jedem "In
// Zwischenablage kopieren" pro neuem Fall automatisch weitergezählt.
function rnZaehlerAusRenu(renu){
  const r = (renu||'').trim();
  const ziffern = r.slice(-3);
  const z = parseInt(ziffern, 10);
  if(!/^\d{3}$/.test(ziffern) || isNaN(z)) return null;
  return z + 1;
}
function rnYymmdd(datumNorm){
  // datumNorm: normalisiert als "TT.MM.JJJJ" (siehe normalisiereDatum)
  const teile = (datumNorm||'').split('.');
  if(teile.length!==3) return '';
  const [tag, monat, jahr] = teile;
  if(jahr.length!==4) return '';
  return jahr.slice(-2) + monat.padStart(2,'0') + tag.padStart(2,'0');
}
function rechnungsnummerBerechnen(nachname, vorname, datumNorm, zaehler){
  const yymmdd = rnYymmdd(datumNorm);
  const initN = (nachname||'').trim().charAt(0).toUpperCase();
  const initV = (vorname||'').trim().charAt(0).toUpperCase();
  if(!yymmdd || !initN || !initV || !zaehler) return '';
  return initN + initV + yymmdd + '-' + String(zaehler).padStart(3,'0');
}
function rnZaehlerStandText(e){
  if(!e.rnNaechsterZaehler) return 'Noch kein Zähler-Abgleich hinterlegt -- die Rechnungsnummer (Spalte Q) wird beim Kopieren solange freigelassen wie bisher.';
  return `Nächste vergebene laufende Nummer: ${String(e.rnNaechsterZaehler).padStart(3,'0')} (z.B. "...-${String(e.rnNaechsterZaehler).padStart(3,'0')}").`;
}

/* ==========================================================
   Datum / Zeit Hilfsfunktionen
   ========================================================== */
function normalisiereDatum(eingabe){
  if(!eingabe) return '';
  let e = eingabe.trim().replace(/\//g,'.').replace(/-/g,'.').replace(/,/g,'.');
  // "12.12" o.ä. (nur Tag.Monat, kein Jahr angegeben) -> aktuelles Jahr
  // annehmen, statt die Eingabe komplett abzulehnen.
  if(/^\d{1,2}\.\d{1,2}\.?$/.test(e)){
    e = e.replace(/\.$/,'') + '.' + new Date().getFullYear();
  }
  const teile = e.split('.');
  if(teile.length !== 3) return '';
  let tag=parseInt(teile[0],10), monat=parseInt(teile[1],10), jahrStr=teile[2].trim();
  if(jahrStr.length!==2 && jahrStr.length!==4) return '';
  let jahr=parseInt(jahrStr,10);
  if(jahrStr.length===2) jahr = 1900+jahr;
  if(isNaN(tag)||isNaN(monat)||isNaN(jahr)) return '';
  if(monat<1||monat>12||tag<1||tag>31||jahr<1900) return '';
  const d = new Date(jahr, monat-1, tag);
  if(d.getFullYear()!==jahr || d.getMonth()!==monat-1 || d.getDate()!==tag) return '';
  return String(tag).padStart(2,'0')+'.'+String(monat).padStart(2,'0')+'.'+jahr;
}
function alsDatum(normDatum){ const t=normDatum.split('.'); return new Date(+t[2], +t[1]-1, +t[0]); }
function normalisiereZeit(eingabe){
  if(!eingabe) return '';
  let w = eingabe.trim().replace(/Uhr/gi,'').trim();
  if(w.indexOf(':')===-1) return '';
  const teile = w.split(':');
  if(teile.length!==2) return '';
  let h=parseInt(teile[0],10), m=parseInt(teile[1],10);
  if(isNaN(h)||isNaN(m)||h<0||h>23||m<0||m>59) return '';
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}
// Uhrzeit-Kurzeingabe ohne Doppelpunkt: "830" -> "8:30", "1430" -> "14:30",
// "8" -> "8:00". Wird beim Verlassen eines Uhrzeitfeldes VOR der
// Formatprüfung angewendet, damit normalisiereZeit() danach ganz normal
// greifen kann. Eingaben mit Doppelpunkt oder die keine reine Zahl sind
// bleiben unverändert (Prüfung/Fehlermeldung übernimmt normalisiereZeit()).
function zeitDoppelpunktErgaenzen(eingabe){
  if(!eingabe) return eingabe;
  const w = eingabe.trim();
  if(w.indexOf(':')!==-1) return w;
  const ohneUhr = w.replace(/Uhr/gi,'').trim();
  if(!/^\d+$/.test(ohneUhr)) return w;
  if(ohneUhr.length<=2) return ohneUhr+':00';
  if(ohneUhr.length===3) return ohneUhr.slice(0,1)+':'+ohneUhr.slice(1);
  if(ohneUhr.length===4) return ohneUhr.slice(0,2)+':'+ohneUhr.slice(2);
  return w;
}
function zeitInMinuten(hhmm){
  if(!hhmm) return -1;
  const t=hhmm.split(':'); if(t.length!==2) return -1;
  return (+t[0])*60+(+t[1]);
}
function heuteAlsText(){
  const d=new Date();
  return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear();
}
function istWochenende(normDatum){
  if(!normDatum) return false;
  const d = alsDatum(normDatum);
  return d.getDay()===0 || d.getDay()===6;
}
// Wie am PC (NaechsterWerktag): liefert den naechsten Werktag NACH dem
// uebergebenen (normalisierten) Datum als Text -- Werktag = Montag bis
// Freitag, Feiertage bewusst NICHT beruecksichtigt (haengen vom Bundesland
// ab, ggf. manuell im Feld korrigieren). Ohne Basisdatum wird von heute aus
// gerechnet.
function naechsterWerktagText(basisNormDatum){
  const d = basisNormDatum ? alsDatum(basisNormDatum) : new Date();
  d.setDate(d.getDate()+1);
  while(d.getDay()===0 || d.getDay()===6){ d.setDate(d.getDate()+1); }
  return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear();
}

// Datums-Kurzeingabe wie am PC gewünscht: eine reine Zahlenfolge ohne
// Punkte wird automatisch zu einem vollen Datum ergänzt.
// - 1-2 Ziffern ("26")      -> nur das Jahr wird gesetzt (2000+n, da eine
//   Kurzeingabe i.d.R. eine aktuelle Korrektur ist, z.B. am Rechnungs-
//   /Todesbescheinigungsdatum) -- Tag/Monat bleiben vom bisherigen Feldwert
//   bzw. von heute übernommen.
// - 4 Ziffern ("1212")      -> zuerst als TTMM (Tag+Monat, OHNE Jahr) mit
//   dem AKTUELLEN Jahr versucht ("1212" -> 12.12.<aktuelles Jahr>); ergibt
//   das kein gültiges Datum (z.B. "2026": Monat 26 wäre ungültig), wird wie
//   bisher nur das Jahr gesetzt (Tag/Monat vom bisherigen Feldwert/von
//   heute) -- so bleibt "2026" weiterhin eine reine Jahres-Korrektur.
// - 6 Ziffern ("010111")    -> TTMMJJ, wie eine normale Kurzeingabe mit
//   2-stelligem Jahr (1900+n, siehe normalisiereDatum -- typisch für
//   Geburtsdaten: "1.1.11" -> 01.01.1911).
// - 8 Ziffern ("01011911" bzw. "12122026") -> TTMMJJJJ.
// Eingaben MIT Punkten, aber ohne Jahr ("12.12"), bekommen ebenfalls das
// aktuelle Jahr (siehe normalisiereDatum). Eingaben MIT vollständigem Jahr
// laufen unverändert durch die normale normalisiereDatum()-Logik.
function datumKurzeingabeErgaenzen(eingabe, bisherigerWert){
  const roh = (eingabe||'').trim();
  if(!roh) return '';
  if(/^\d+$/.test(roh)){
    if(roh.length===1 || roh.length===2){
      const jahr = 2000+parseInt(roh,10);
      const basisNorm = normalisiereDatum(bisherigerWert) || heuteAlsText();
      const teile = basisNorm.split('.');
      return normalisiereDatum(teile[0]+'.'+teile[1]+'.'+jahr);
    }
    if(roh.length===4){
      const alsTagMonat = normalisiereDatum(roh.slice(0,2)+'.'+roh.slice(2,4));
      if(alsTagMonat) return alsTagMonat;
      const jahr = parseInt(roh,10);
      const basisNorm = normalisiereDatum(bisherigerWert) || heuteAlsText();
      const teile = basisNorm.split('.');
      return normalisiereDatum(teile[0]+'.'+teile[1]+'.'+jahr);
    }
    if(roh.length===6){
      return normalisiereDatum(roh.slice(0,2)+'.'+roh.slice(2,4)+'.'+roh.slice(4,6));
    }
    if(roh.length===8){
      return normalisiereDatum(roh.slice(0,2)+'.'+roh.slice(2,4)+'.'+roh.slice(4,8));
    }
    return '';
  }
  return normalisiereDatum(roh);
}

/* ==========================================================
   Feiertage Baden-Württemberg (für Zuschlag H, wie am PC:
   IstZuschlagstag = Wochenende ODER gesetzlicher Feiertag)
   ========================================================== */
function ostersonntag(jahr){
  // Gauss'sche Osterformel
  const a=jahr%19, b=Math.floor(jahr/100), c=jahr%100, d=Math.floor(b/4), e=b%4,
        f=Math.floor((b+8)/25), g=Math.floor((b-f+1)/3),
        h=(19*a+b-d-g+15)%30, i=Math.floor(c/4), k=c%4,
        l=(32+2*e+2*i-h-k)%7, m=Math.floor((a+11*h+22*l)/451),
        monat=Math.floor((h+l-7*m+114)/31), tag=((h+l-7*m+114)%31)+1;
  return new Date(jahr, monat-1, tag);
}
function tagePlus(d, n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function selberTag(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function istFeiertagBW(d){
  const jahr = d.getFullYear();
  const o = ostersonntag(jahr);
  const feste = [
    {d:new Date(jahr,0,1), n:'Neujahr'},
    {d:new Date(jahr,0,6), n:'Heilige Drei Könige'},
    {d:tagePlus(o,-2), n:'Karfreitag'},
    {d:o, n:'Ostersonntag'},
    {d:tagePlus(o,1), n:'Ostermontag'},
    {d:new Date(jahr,4,1), n:'Tag der Arbeit'},
    {d:tagePlus(o,39), n:'Christi Himmelfahrt'},
    {d:tagePlus(o,49), n:'Pfingstsonntag'},
    {d:tagePlus(o,50), n:'Pfingstmontag'},
    {d:tagePlus(o,60), n:'Fronleichnam'},
    {d:new Date(jahr,9,3), n:'Tag der Deutschen Einheit'},
    {d:new Date(jahr,10,1), n:'Allerheiligen'},
    {d:new Date(jahr,11,25), n:'1. Weihnachtstag'},
    {d:new Date(jahr,11,26), n:'2. Weihnachtstag'}
  ];
  const treffer = feste.find(f=>selberTag(f.d, d));
  return treffer ? treffer.n : '';
}
// Wie PC IstZuschlagstag(): Wochenende ODER Feiertag löst den H-Zuschlag
// aus. Gibt den Grund ("Samstag"/"Sonntag"/Feiertagsname) zurück, oder ''
// wenn kein Zuschlagstag.
function zuschlagstagGrund(normDatum){
  if(!normDatum) return '';
  const d = alsDatum(normDatum);
  const feiertag = istFeiertagBW(d);
  if(feiertag) return feiertag;
  const tag = d.getDay();
  if(tag===6) return 'Samstag';
  if(tag===0) return 'Sonntag';
  return '';
}

   Zwischenablage-Import
   ========================================================== */
const STERBEZEIT_SCHLUESSELWOERTER = [
  "tod festgestellt","todeszeit","todeszeitpunkt","tod eingetreten","sterbezeit",
  "exitus letalis","exitus","ist verstorben","verstorben","todesfeststellung",
  "für tot erklärt","fuer tot erklaert","klinisch tot","reanimation ohne erfolg",
  "erfolglose reanimation","reanimation eingestellt","reanimationsmaßnahmen eingestellt",
  "reanimationsmassnahmen eingestellt","reanimationsmaßnahmen abgebrochen","reanimationsmaßnahmen beendet",
  "reanimation beendet","cpr erfolglos","cpr eingestellt","kein reanimationsversuch",
  "nicht reanimationspflichtig","keine reanimation","sichere todeszeichen","totenflecke",
  "livores","totenstarre","rigor mortis","leblos aufgefunden"
];
function sterbezeitAusFreitextErmitteln(volltext){
  if(!volltext) return {zeit:'', quelle:''};
  const textLower = volltext.toLowerCase();
  const zeitMuster = /(\d{1,2})[:.](\d{2})\s*uhr/i;
  for(const kw of STERBEZEIT_SCHLUESSELWOERTER){
    let pos = textLower.indexOf(kw);
    if(pos===-1) continue;
    const von = Math.max(0, pos-40);
    const bis = Math.min(volltext.length, pos+kw.length+40);
    const fenster = volltext.substring(von, bis);
    const treffer = fenster.match(zeitMuster);
    if(treffer){ return {zeit:treffer[1].padStart(2,'0')+':'+treffer[2], quelle:'Schlüsselwort "'+kw+'"'}; }
  }
  const fallback = volltext.match(/leblos aufgefunden um\s*(\d{1,2})[:.](\d{2})\s*uhr/i);
  if(fallback) return {zeit:fallback[1].padStart(2,'0')+':'+fallback[2], quelle:'"leblos aufgefunden um..."'};
  return {zeit:'', quelle:''};
}
function feldAusNachrichtLesen(zeilen, praefix){
  for(const z of zeilen){
    const t = z.trim();
    if(t.toLowerCase().startsWith(praefix.toLowerCase())) return t.substring(praefix.length).trim();
  }
  return '';
}
function grossKleinNormalisieren(s){
  if(!s) return '';
  // Grossschreibung nach jedem Leerzeichen UND nach jedem Bindestrich
  // (z.B. "Baden-baden" -> "Baden-Baden", "Müller-schmidt" -> "Müller-Schmidt"),
  // damit zusammengesetzte Orts-/Namensteile korrekt behandelt werden.
  const grossNachTrenner = (wort) => wort.split('-').map(teil =>
    teil.length ? teil[0].toUpperCase()+teil.substring(1).toLowerCase() : teil
  ).join('-');
  return s.split(' ').map(w => grossNachTrenner(w)).join(' ');
}
// Zerlegt eine als EINE Zeile kopierte Adresse (z.B. aus Google Maps: "Musterstraße 12, 77656 Offenburg"
// oder mit angehängtem Land "Musterstraße 12, 77656 Offenburg, Deutschland") in Straße+Hausnummer und
// PLZ+Ort -- fürs direkte Einlesen ins Bestatter-Adressfeldpaar, ohne die Zeile von Hand aufzutrennen.
function adressZeileTrennen(text){
  if(!text) return null;
  const teile = text.trim().replace(/\n/g,', ').split(',').map(s=>s.trim()).filter(Boolean);
  if(teile.length<2) return null;
  // Ein evtl. angehängtes Land (kein Bestandteil, der Ziffern enthält -- eine
  // PLZ hat immer Ziffern) am Ende verwerfen.
  if(teile.length>=3 && !/\d/.test(teile[teile.length-1])) teile.pop();
  if(teile.length<2) return null;
  return {strasse: teile[0], plzOrt: teile.slice(1).join(', ')};
}
// Eigener Hinweis-Platz direkt unter dem "Aus Zwischenablage einlesen"-Button
// statt des allgemeinen Hinweisbanners ganz unten in der Maske -- eine
// Meldung wie "Zwischenablage ist leer" bezieht sich ja unmittelbar auf den
// gerade angeklickten Button und soll auch genau dort sichtbar sein, ohne
// dass die Maske dafuer nach unten scrollt.
function zwischenablageHinweisAnzeigen(text){
  const el = document.getElementById('zwischenablageHinweis');
  if(!el) return;
  if(!text){ el.classList.remove('aktiv'); el.innerHTML=''; return; }
  el.innerHTML = text;
  el.classList.add('aktiv');
}
async function ausZwischenablageEinlesen(art, ctx){
  zwischenablageHinweisAnzeigen('');
  let text = '';
  try{ text = await navigator.clipboard.readText(); }
  catch(e){ zwischenablageHinweisAnzeigen('Zwischenablage konnte nicht gelesen werden. Bitte Berechtigung erteilen oder Text manuell einfügen.'); return; }
  if(!text || !text.trim()){ zwischenablageHinweisAnzeigen('Die Zwischenablage ist leer.'); return; }

  const zeilen = text.split(/\r?\n/);
  const patient = feldAusNachrichtLesen(zeilen, 'Patient:');
  const geb = feldAusNachrichtLesen(zeilen, 'Geb:');
  const ort = feldAusNachrichtLesen(zeilen, 'Ort:');
  const strasse = feldAusNachrichtLesen(zeilen, 'Strasse:') || feldAusNachrichtLesen(zeilen, 'Straße:');

  if(patient) ctx.setValue('txtName', grossKleinNormalisieren(patient));
  if(geb) ctx.setValue('txtGeda', geb);
  if(strasse) ctx.setValue('txtPAdresse1', grossKleinNormalisieren(strasse));
  if(ort) ctx.setValue('txtPAdresse2', grossKleinNormalisieren(ort));

  if(art==='ls'){
    const erg = sterbezeitAusFreitextErmitteln(text);
    if(erg.zeit){
      ctx.setValue('txtTodeszeit', erg.zeit);
      zwischenablageHinweisAnzeigen('Sterbezeitpunkt '+erg.zeit+' automatisch erkannt (Quelle: '+erg.quelle+'). Bitte prüfen.');
    } else {
      zwischenablageHinweisAnzeigen('Kein Sterbezeitpunkt im Text erkannt -- bitte manuell eintragen.');
    }
  }
  // Wichtig: nach dem Einlesen läuft die VOLLSTÄNDIGE Plausibilitätsprüfung,
  // nicht nur die feldweise -- Werte wurden ja programmatisch gesetzt und
  // haben daher kein einzelnes "Feld verlassen"-Ereignis ausgelöst.
  ctx.allePruefungenAusfuehren();
  if(strasse && ort) ctx.adresseVerlassen();
}

/* ==========================================================
   km / Route-Automation
   ========================================================== */
async function geocode(adresse){
  const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(adresse);
  const res = await fetch(url, {headers:{'Accept':'application/json'}});
  const data = await res.json();
  if(!data || !data.length) return null;
  return {lat:parseFloat(data[0].lat), lon:parseFloat(data[0].lon)};
}
// PLZ/Ort-Erkennung analog zur PC-Funktion PlzErgaenzen() in
// PT_UserFormRechnung.frm: extrahiert eine 5-stellige PLZ aus einem Text,
// ermittelt fehlenden Ort zu einer PLZ bzw. fehlende PLZ zu einem Ort per
// Geocoding, und prüft bei vorhandenen beiden Werten per Kreuzvalidierung,
// ob PLZ und Ort tatsächlich zusammenpassen.
function plzAusText(text){
  const m = (text||'').match(/\b(\d{5})\b/);
  return m ? m[1] : '';
}
// Rueckgabe bewusst dreiwertig: ein gefundener String, '' bei einer
// erfolgreichen Anfrage OHNE Treffer (Adresse/Ort existiert laut
// Kartendienst schlicht nicht), oder null, wenn die Anfrage selbst
// fehlgeschlagen ist (Netzwerkfehler -- meist fehlendes Internet, z.B.
// beim Hausbesuch ohne Empfang). plzOrtPruefen() unterscheidet danach im
// Hinweistext zwischen "nicht gefunden" und "vermutlich kein Internet".
async function ortErmitteln(plz){
  try{
    const url = 'https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=1&country=Germany&postalcode='+encodeURIComponent(plz);
    const res = await fetch(url, {headers:{'Accept':'application/json'}});
    const data = await res.json();
    if(!data || !data.length) return '';
    const a = data[0].address || {};
    return a.city || a.town || a.village || a.municipality || a.city_district || '';
  }catch(e){ return null; }
}
async function plzErmitteln(adresse){
  try{
    const url = 'https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=1&q='+encodeURIComponent(adresse);
    const res = await fetch(url, {headers:{'Accept':'application/json'}});
    const data = await res.json();
    if(!data || !data.length) return '';
    const a = data[0].address || {};
    return a.postcode || '';
  }catch(e){ return null; }
}
// Kurzer, gut lesbarer Zusatzsatz für die Hinweistexte unten -- kombiniert
// den eigentlichen Fehlschlag (Netzwerkanfrage fehlgeschlagen) mit dem
// zusätzlichen Signal von navigator.onLine, damit die Vermutung "kein
// Internet" nicht bei jedem einzelnen fehlgeschlagenen Request pauschal
// behauptet wird, sondern nur wenn beides dafür spricht bzw. der Browser
// selbst meldet, offline zu sein.
function keinInternetHinweisText(){
  return (typeof navigator!=='undefined' && navigator.onLine===false)
    ? ' Es scheint aktuell keine Internetverbindung zu bestehen.'
    : ' Vermutlich ist gerade keine Internetverbindung vorhanden (oder der Kartendienst ist nicht erreichbar).';
}
async function routeKm(start, ziel){
  const url = `https://router.project-osrm.org/route/v1/driving/${start.lon},${start.lat};${ziel.lon},${ziel.lat}?overview=false`;
  const res = await fetch(url);
  const data = await res.json();
  if(!data.routes || !data.routes.length) return null;
  return data.routes[0].distance/1000;
}
// Analog zur PC-Funktion RoutenErmitteln: liefert mehrere Routenalternativen
// (falls der Routendienst welche findet) statt nur der einen besten Route,
// jeweils als Einfachstrecke in km + Fahrzeit in Minuten.
async function routeAlternativen(start, ziel){
  const url = `https://router.project-osrm.org/route/v1/driving/${start.lon},${start.lat};${ziel.lon},${ziel.lat}?overview=false&alternatives=true`;
  const res = await fetch(url);
  const data = await res.json();
  if(!data.routes || !data.routes.length) return [];
  return data.routes.map(r=>({km:r.distance/1000, minuten:r.duration/60}));
}
// Luftlinie (Haversine) -- EINFACHE Strecke, bewusst nicht verdoppelt
// (analog zur PC-Logik: kmFahrstrecke wird fuer Hin+Rueck verdoppelt,
// kmLuftlinieEinfach bleibt die reine Einfachstrecke).
function kmLuftlinieEinfach(a, b){
  const R=6371;
  const dLat=(b.lat-a.lat)*Math.PI/180, dLon=(b.lon-a.lon)*Math.PI/180;
  const x = Math.sin(dLat/2)**2 + Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
}
// Entscheidet Reiseentschaedigung vs. Wegegeld -- analog SollReiseGelten()
// am PC: Standard = Fahrstrecke (Hin+Rueck) > 50 km; Einstellung
// "Reiseentschaedigung nach Luftlinie priorisieren" schaltet stattdessen
// auf Luftlinie (Einfachstrecke) > 25 km um.
function sollReiseGelten(kmFahrstreckeGesamt, kmLuftlinie){
  const e = ladeEinstellungen();
  if(e.reiseBasisLuftlinie) return kmLuftlinie > 25;
  return kmFahrstreckeGesamt > 50;
}

/* Ermittelt die automatisch vorzuschlagenden Positionen (Grundleistung +
   Zeit-Zuschlag + Reiseentschädigung ODER passendes Wegegeld -- nie beides,
   siehe sollReiseGelten) -- der Rest bleibt manuelle Auswahl, genau wie am
   PC ("Rechnungspositionen prüfen"). */
// modus (optional, 1:1 wie am PC WegegeldZifferBestimmen):
//   ''           -- automatisch, die 50-km-Regel (sollReiseGelten) entscheidet
//   'REISE'      -- Nutzer hat bewusst eine Fahrstrecke-Kachel als
//                    Reiseentschädigung gewählt (Alternativrouten) -- gilt
//                    IMMER als Reiseentschädigung, unabhängig von den km
//   'LUFTLINIE'  -- Nutzer hat bewusst die Luftlinie-Kachel gewählt -- die
//                    50-km-Automatik wird dabei bewusst ÜBERSPRUNGEN, auch
//                    bei einer Luftlinie >25 km greift dann NICHT automatisch
//                    die Reiseentschädigung, sondern weiterhin die oberste
//                    Wegegeld-Staffel (WT25/WN25) -- exakt wie am PC.
function automatischeAuswahl(katalog, datum, zeit, kmFahrstreckeGesamt, kmLuftlinie, modus){
  const ausgewaehlt = new Set();
  (katalog.grundleistung||[]).forEach(p=>{ if(p.standard) ausgewaehlt.add(p.ziffer); });

  const normDatum = normalisiereDatum(datum);
  const normZeit = normalisiereZeit(zeit);
  // Wie am PC (ZeitZuschlagBestimmen + IstZuschlagstag): F/G aus der Uhrzeit
  // UND H aus Wochenende/Feiertag koennen GLEICHZEITIG gelten -- H schliesst
  // F/G also NICHT aus (anders als zuvor in dieser Datei).
  if(normZeit){
    const min = zeitInMinuten(normZeit);
    if((min>=20*60 && min<22*60) || (min>=6*60 && min<8*60)) ausgewaehlt.add('F');
    else if(min>=22*60 || min<6*60) ausgewaehlt.add('G');
  }
  if(zuschlagstagGrund(normDatum)) ausgewaehlt.add('H');

  const fahrVal = parseFloat((kmFahrstreckeGesamt||'').toString().replace(',','.'));
  const luftVal = parseFloat((kmLuftlinie||'').toString().replace(',','.'));

  if(modus==='REISE'){
    // Wie am PC: bewusst erzwungen, unabhängig von den km (solange > 0).
    if(!isNaN(fahrVal) && fahrVal>0) ausgewaehlt.add('REISE');
    return ausgewaehlt;
  }

  if(!isNaN(fahrVal) && fahrVal>0){
    // Luftlinie (Einfachstrecke) fehlt evtl., wenn km manuell eingetragen
    // wurden statt per Routenberechnung -- als Schaetzung dann die HALBE
    // Fahrstrecke (Hin+Rück) verwenden, NICHT die volle. Das war zuvor der
    // Bug, der dazu führte, dass praktisch immer WT25/WN25 (letzte Staffel)
    // gewählt wurde, da die volle (verdoppelte) Strecke fast immer über der
    // 25-km-Einfachstrecken-Schwelle lag.
    const luftEinfach = isNaN(luftVal) ? fahrVal/2 : luftVal;
    if(modus!=='LUFTLINIE' && sollReiseGelten(fahrVal, luftEinfach)){
      ausgewaehlt.add('REISE');
    } else if(normZeit){
      // Tag/Nacht-Staffel wie am PC (WegegeldZifferBestimmen): Tag =
      // 07:00-18:59, Nacht = 19:00-06:59 -- eigenstaendige Grenze, NICHT
      // identisch mit der F/G-Zeitzuschlag-Grenze (20/6 Uhr).
      const min = zeitInMinuten(normZeit);
      const nacht = !(min>=7*60 && min<19*60);
      const tabelle = nacht ? WEGEGELD_NACHT : WEGEGELD_TAG;
      const bucket = tabelle.find(w => luftEinfach <= w.bisKm) || tabelle[tabelle.length-1];
      ausgewaehlt.add(bucket.ziffer);
    }
  }
  return ausgewaehlt;
}

/* ==========================================================
   ICD-10-GM Diagnose-Suche (repliziert die PC-Logik aus PT_UserFormRechnung:
   Suche ab 2 Zeichen, Treffer ueberall im Eintrag "Beschreibung [Code]",
   sortiert nach Fundposition, dann alphabetisch, max. 200 Treffer)
   ========================================================== */
function icdEintragBauen(code, txt){
  if(txt && code) return txt+' ['+code+']';
  return txt || code || '';
}
function icdSuchen(suchtext){
  const katalog = (typeof ICD_KATALOG!=='undefined') ? ICD_KATALOG : [];
  const such = (suchtext||'').trim();
  if(such.length<2 || !katalog.length) return [];
  const suchLower = such.toLowerCase();
  const treffer = [];
  for(let i=0;i<katalog.length;i++){
    const eintrag = icdEintragBauen(katalog[i][0], katalog[i][1]);
    const pos = eintrag.toLowerCase().indexOf(suchLower);
    if(pos>=0) treffer.push({eintrag, pos});
  }
  treffer.sort((a,b)=> a.pos-b.pos || a.eintrag.localeCompare(b.eintrag,'de'));
  return treffer.slice(0,200).map(t=>t.eintrag);
}

function allePositionenFlach(katalog){
  return [
    ...(katalog.grundleistung||[]),
    ...ZUSCHLAEGE_ZEIT,
    ...WEGEGELD_TAG, ...WEGEGELD_NACHT,
    {ziffer:'REISE', bez:REISEENTSCHAEDIGUNG.bez, betrag:REISEENTSCHAEDIGUNG.betrag}
  ];
}

      if(!ziel){ zeigeErgebnis('Die Adresse "'+adresse+'" konnte nicht gefunden werden. Bitte prüfen.', true); return; }
      const luft = kmLuftlinieEinfach(start, ziel);
      zeigeErgebnis(`<strong>Luftlinie (einfach):</strong> ${luft.toFixed(1).replace('.',',')} km<br>
        <strong>Geschätzt Hin- und Rückfahrt:</strong> ${(luft*2).toFixed(1).replace('.',',')} km`, false);
    }catch(err){
      zeigeErgebnis('Berechnung fehlgeschlagen.'+keinInternetHinweisText(), true);
    }
  };
}

// Teilt "txtName" in Nachname/Vorname auf -- 1:1 wie am PC
// (RechnungErstellen_Click): ENTHÄLT der Name ein Komma, gilt das Format
// "Nachname, Vorname" (Teil vor dem Komma = Nachname). Ohne Komma gilt am
// PC stattdessen "Vorname Nachname" (natürliche Reihenfolge!) -- erstes
// leerzeichengetrenntes Wort = Vorname, LETZTES Wort = Nachname (ein
// mehrteiliger Nachname ohne Komma wie "Otto von Bismarck" würde am PC
// genauso nur "Otto" als Vorname und "Bismarck" als Nachname erkennen).
function nameAufteilen(cName){
  const name = (cName||'').trim();
  if(!name) return {nachname:'', vorname:''};
  if(name.indexOf(',')>=0){
    const teile = name.split(',');
    return {nachname:(teile[0]||'').trim(), vorname:(teile[1]||'').trim()};
  }
  const teile = name.split(' ').filter(Boolean);
  if(teile.length<2) return {nachname:'', vorname:''};
  return {vorname:teile[0], nachname:teile[teile.length-1]};
}

// Baut aus einem Fall EINE tab-getrennte Zeile im Format der Excel-
// Rechnungsübersicht (vom Nutzer bestätigte Spaltenreihenfolge A..Y),
// damit sie sich direkt in Excel einfügen laesst (Excel/Sheets trennen
// beim Einfuegen automatisch an Tabs in eigene Zellen).
// Spalte Q (Rechnungsnummer) wird -- sofern in den Einstellungen ein
// Zaehler-Abgleich hinterlegt ist -- bereits hier exakt nach PC-Schema
// vergeben (siehe rechnungsnummerBerechnen). Die Spalten R..Y (Brief/
// Zahlung/Mahnwesen) werden am PC beim eigentlichen Rechnungserstellen
// gepflegt und bleiben daher bewusst leer -- ebenso alle Sterbeort-/
// Bestatter-Spalten bei einer Privatrechnung (PT), da es dort begrifflich
// keinen Sterbeort/Bestatter gibt.
function faelleAlsUebersichtsZeilen(faelle){
  return faelle.map(f=>{
    const w = f.werte;
    const spalten = new Array(25).fill(''); // A..Y
    const {nachname, vorname} = nameAufteilen(w.txtName);
    spalten[0] = f.art==='ls' ? 'L' : 'P';                          // A: L/P
    spalten[1] = w.txtDatumExcel || '';                              // B: Datum LS/HB
    spalten[2] = w.txtZeitLS || '';                                  // C: Uhrzeit LS/HB
    spalten[5] = nachname;                                           // F: Name
    spalten[6] = vorname;                                            // G: Vorname
    spalten[7] = w.txtGeda || '';                                    // H: Geburtsdatum
    spalten[8] = w.txtPAdresse1 || '';                                // I: Adresse1 Patient
    spalten[9] = w.txtPAdresse2 || '';                                // J: Adresse2 Patient
    if(f.art==='ls'){
      spalten[3] = w.txtSterbedatum || '';                           // D: Datum Tod
      spalten[4] = w.txtTodeszeit || '';                             // E: Uhrzeit Tod
      // Sterbeort: wie am PC (AktiverAdressBlock) gilt bei ausgefuelltem
      // "Sterbeort abweichend"-Block DIESER als Sterbeort, sonst die
      // Patientenadresse.
      spalten[10] = w.txtSterbeAdr1 || w.txtPAdresse1 || '';          // K: Adresse1 Sterbeort
      spalten[11] = w.txtSterbeAdr2 || w.txtPAdresse2 || '';          // L: Adresse2 Sterbeort
      spalten[12] = w.txtBName || '';                                 // M: Bestatter
      spalten[13] = w.txtAdresse1 || '';                              // N: Adresse1 Bestatter
      spalten[14] = w.txtAdresse2 || '';                              // O: Adresse2 Bestatter
    }
    spalten[15] = w.txtBetrag || '';                                  // P: Betrag
    spalten[16] = f.rechnungsnummer || '';                            // Q: Rechnungsnummer
    // R..Y: bewusst leer, siehe Kommentar oben.
    return spalten.join('\t');
  }).join('\n');
}

// Vergibt für alle übergebenen Fälle, die noch keine Rechnungsnummer
// besitzen, eine neue -- exakt nach PC-Schema und mit lokal fortgeführtem
// Zaehler (siehe rechnungsnummerBerechnen/rnZaehlerAusRenu). Bereits
// vergebene Nummern (z.B. bei erneutem Kopieren desselben Falls) werden
// nie überschrieben, damit keine Dopplungen/Lücken in der Übersicht
// entstehen. Persistiert die vergebenen Nummern zurück in den jeweiligen
// Fall (ls/pt) sowie den erhöhten Zaehler in den Einstellungen.
// Gibt zurück, wie viele Fälle KEINE Nummer erhalten konnten (weil noch
// kein Zaehler-Abgleich in den Einstellungen hinterlegt ist).
function rechnungsnummernVergeben(faelleAusw){
  const e = ladeEinstellungen();
  let zaehler = e.rnNaechsterZaehler;
  let ohneNummer = 0;
  const faelleNachArt = {ls: ladeFaelle('ls'), pt: ladeFaelle('pt')};
  let geaendert = {ls:false, pt:false};
  faelleAusw.forEach(f=>{
    if(f.rechnungsnummer){ return; } // bereits vergeben, nicht erneut vergeben
    if(!zaehler){ ohneNummer++; return; }
    const {nachname, vorname} = nameAufteilen(f.werte.txtName);
    const datumNorm = normalisiereDatum(f.werte.txtDatumExcel);
    const nummer = rechnungsnummerBerechnen(nachname, vorname, datumNorm, zaehler);
    if(!nummer){ ohneNummer++; return; }
    f.rechnungsnummer = nummer;
    faelleNachArt[f.art][f.idx].rechnungsnummer = nummer;
    geaendert[f.art] = true;
    zaehler++;
  });
  if(geaendert.ls) speichereFaelle('ls', faelleNachArt.ls);
  if(geaendert.pt) speichereFaelle('pt', faelleNachArt.pt);
  if(zaehler !== e.rnNaechsterZaehler){
    e.rnNaechsterZaehler = zaehler;
    speichereEinstellungen(e);
  }
  return ohneNummer;
}

  document.getElementById('chkAlle').onclick = (ev)=>{

    app.querySelectorAll('.fall-zeile .chk').forEach(c=> c.checked = ev.target.checked);
    auswahlAktualisieren();
  };

  document.getElementById('btnAuswUebersichtOeffnen').onclick = ()=>{
    window.open('https://1drv.ms/x/c/ea0a98e4272ed5c1/IQBlNAjRs2lHR7r8Kh_-9DMhAZB7Me6rXGprd8Lu4NthUZg?e=UKgicT', '_blank');

      // mehrerer Eintraege einer Art die Indizes der noch zu loeschenden
      // nicht verschieben (analog BriefeZeilenLoeschen am PC).
      ['ls','pt'].forEach(art=>{
        const idxListe = faelleAusw.filter(f=>f.art===art).map(f=>f.idx).sort((a,b)=>b-a);
        if(!idxListe.length) return;
        const arr = ladeFaelle(art);
        idxListe.forEach(i=> arr.splice(i,1));

      });
      appToastAnzeigen(`${faelleAusw.length} Rechnung(en) gelöscht.`, 2000);
      ansichtKorrigieren();
    };
  };

  auswahlAktualisieren();
}

  if(autoSyncStatus==='berechtigung_fehlt'){

// KORREKTUR (mehrfach durchprobiert, auf Nutzerwunsch zurückgebaut):
// Sowohl das "Speichern unter"-Fenster bei JEDEM Export (showSaveFilePicker)
// als auch ein einmalig gewählter, dauerhaft gespeicherter Export-Ordner
// (showDirectoryPicker + getFileHandle(...,{create:true}) + createWritable())
// wurden ausprobiert, um das "immer neue Datei mit fortlaufender Zahl statt
// Überschreiben"-Problem zu lösen -- auf dem tatsächlich genutzten Gerät
// überschreibt aber KEINE der beiden Varianten zuverlässig (vermutlich eine
// Android/Storage-Access-Framework-Eigenheit). Beide brachten also nur einen
// zusätzlichen Dialog ohne echten Nutzen. Der manuelle Export ist deshalb
// wieder auf die einfache, direkte Rückfallebene zurückgebaut:
//  1) Ist der Auto-Sync-Ordner bereits verbunden (Weg A, siehe unten -- DER
//     funktioniert zuverlässig, weil er nicht bei jedem Export neu
//     nachfragt), wird die Export-Datei einfach zusätzlich dort abgelegt.
//  2) Sonst: natives Teilen-Menü, sonst klassischer Download -- dort kann
//     das Duplikat-Verhalten (fortlaufende Zahl) je nach Gerät weiterhin
//     auftreten, mangels besserer, tatsächlich funktionierender Alternative.
//     Der zuverlässige Weg dagegen bleibt der Auto-Sync.
const EXPORT_DATEINAME = 'rechnungserfassung_export.json';
async function jsonExport(){
  const daten = exportDatenBauen();
  const inhalt = JSON.stringify(daten,null,2);

  if(autoSyncStatus==='verbunden' && autoSyncOrdnerHandle){
    try{
      const dateiHandle = await autoSyncOrdnerHandle.getFileHandle(EXPORT_DATEINAME, {create:true});
      const schreibbar = await dateiHandle.createWritable();
      await schreibbar.write(inhalt);
      await schreibbar.close();
      appToastAnzeigen('Export im Sync-Ordner gespeichert ("'+EXPORT_DATEINAME+'").', 2500);
      return;
    }catch(e){
      // Berechtigung zwischenzeitlich entzogen o.ä. -- normal weiter unten
      // versuchen (eigener Export-Ordner bzw. Rückfallebene).
    }
  }

  // KORREKTUR (auf Nutzerwunsch zurückgebaut): der Ordner-Auswahl-Dialog
  // (showDirectoryPicker) sollte das seit Anfang an bekannte
  // "immer neue Datei mit fortlaufender Zahl statt Überschreiben"-Problem
  // lösen -- tut es auf dem tatsächlich genutzten Gerät aber nachweislich
  // NICHT (vermutlich eine Android/Storage-Access-Framework-Eigenheit, die
  // auch einen "echten" Ordner-Handle beim Schreiben wie einen Download
  // behandelt). Der zusätzliche Dialog brachte also nur eine weitere
  // Bestätigung ohne jeden Nutzen -- daher wieder die einfache, direkte
  // Rückfallebene ohne Ordnerauswahl: natives Teilen-Menü, sonst klassischer
  // Download. Das bereits bekannte Duplikat-Verhalten (fortlaufende Zahl)
  // kann dabei mangels besserer, tatsächlich funktionierender Alternative
  // auf diesem Gerät weiterhin auftreten -- der zuverlässige Weg dagegen
  // bleibt der oben bereits vorhandene Auto-Sync ("Weg A").
  const blob = new Blob([inhalt], {type:'application/json'});
  const datei = new File([blob], EXPORT_DATEINAME, {type:'application/json'});
  if(navigator.canShare && navigator.canShare({files:[datei]})){
    try{
      await navigator.share({files:[datei], title:'Rechnungserfassung Export'});
      return;
    }catch(e){
      // Abgebrochen oder fehlgeschlagen -- auf normalen Download zurückfallen.
    }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = EXPORT_DATEINAME;
  a.click();
}

/* ==========================================================
   Automatischer Ordner-Sync ("Weg A", siehe Besprechung) -- File System
   Access API: einmalig den OneDrive-Sync-Ordner auswählen, danach wird bei
   JEDER Änderung (jedes Speichern eines Falls, jeder neue Bestatter)
   automatisch dieselbe Datei "rechnungserfassung_sync.json" überschrieben.
   Dadurch: kein manueller Klick mehr nötig, keine mehrfachen Export-
   Dateien/Duplikate, und selbst bei leerem Akku geht höchstens der letzte,
   noch nicht geschriebene Vorgang verloren (nicht der ganze Tag).
   Nicht auf jedem Gerät/Browser unterstützt (v.a. auf manchen Android-
   Chrome-Versionen) -- dann bleibt der manuelle Export-Button die
   Rückfallebene (siehe autoSyncVerfuegbar()).
   ========================================================== */
let autoSyncOrdnerHandle = null;
// 'unbekannt' (direkt nach Laden, bevor autoSyncInitialisieren fertig ist),
// 'nicht_unterstuetzt', 'nicht_verbunden', 'verbunden', 'berechtigung_fehlt'
let autoSyncStatus = 'unbekannt';
let autoSyncSchreibtGerade = false;
let autoSyncErneutNoetig = false;

function fileSystemAccessVerfuegbar(){
  return typeof window.showDirectoryPicker === 'function';
}

const AUTOSYNC_DB_NAME = 'rechnungserfassung_sync_db';
const AUTOSYNC_STORE = 'handles';
function autoSyncDbOeffnen(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(AUTOSYNC_DB_NAME, 1);
    req.onupgradeneeded = ()=> req.result.createObjectStore(AUTOSYNC_STORE);
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function autoSyncHandleSpeichern(handle){
  const db = await autoSyncDbOeffnen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(AUTOSYNC_STORE, 'readwrite');
    tx.objectStore(AUTOSYNC_STORE).put(handle, 'ordner');
    tx.oncomplete = ()=> resolve();
    tx.onerror = ()=> reject(tx.error);
  });
}
async function autoSyncHandleLaden(){
  try{
    const db = await autoSyncDbOeffnen();
    return await new Promise((resolve, reject)=>{
      const tx = db.transaction(AUTOSYNC_STORE, 'readonly');
      const req = tx.objectStore(AUTOSYNC_STORE).get('ordner');
      req.onsuccess = ()=> resolve(req.result || null);
      req.onerror = ()=> reject(req.error);
    });
  }catch(e){ return null; }
}
async function autoSyncHandleLoeschen(){
  try{
    const db = await autoSyncDbOeffnen();
    const tx = db.transaction(AUTOSYNC_STORE, 'readwrite');
    tx.objectStore(AUTOSYNC_STORE).delete('ordner');
  }catch(e){}
}

// Schreibt die IMMER GLEICHE Datei mit dem aktuellen Gesamtstand -- läuft
// eine Schreibaktion noch, wird die naechste nur vorgemerkt (statt parallel
// zu schreiben) und läuft danach automatisch noch einmal, damit der
// allerletzte Stand nie verloren geht.
async function autoSyncSchreiben(){
  if(autoSyncStatus!=='verbunden' || !autoSyncOrdnerHandle) return;
  if(autoSyncSchreibtGerade){ autoSyncErneutNoetig = true; return; }
  autoSyncSchreibtGerade = true;
  try{
    const dateiHandle = await autoSyncOrdnerHandle.getFileHandle('rechnungserfassung_sync.json', {create:true});
    const schreibbar = await dateiHandle.createWritable();
    await schreibbar.write(JSON.stringify(exportDatenBauen(), null, 2));
    await schreibbar.close();
  }catch(e){
    // z.B. Berechtigung zwischenzeitlich entzogen -- der Status zeigt das
    // beim naechsten Aufruf der Einstellungen an, der manuelle Export-Button
    // erscheint automatisch wieder (siehe autoSyncVerfuegbar()).
    autoSyncStatus = 'berechtigung_fehlt';
  } finally {
    autoSyncSchreibtGerade = false;
    if(autoSyncErneutNoetig){ autoSyncErneutNoetig = false; autoSyncSchreiben(); }
  }
}

// Nutzer wählt (per Tap in den Einstellungen, also mit Nutzer-Geste -- nur
// dann erlauben Browser den Berechtigungsdialog) einmalig den Sync-Ordner.
async function autoSyncOrdnerWaehlen(){
  if(!fileSystemAccessVerfuegbar()) return false;
  try{
    const handle = await window.showDirectoryPicker({id:'rechnungserfassung-sync', mode:'readwrite'});
    const berechtigt = await handle.requestPermission({mode:'readwrite'});
    if(berechtigt!=='granted') return false;
    await autoSyncHandleSpeichern(handle);
    autoSyncOrdnerHandle = handle;
    autoSyncStatus = 'verbunden';
    await autoSyncSchreiben();
    return true;
  }catch(e){ return false; } // z.B. Nutzer hat den Auswahldialog abgebrochen
}

async function autoSyncOrdnerTrennen(){
  await autoSyncHandleLoeschen();
  autoSyncOrdnerHandle = null;
  autoSyncStatus = 'nicht_verbunden';
}

// Nach erneutem Öffnen der App die zuvor gewählte Ordner-Berechtigung ohne
// weiteren Dialog PRÜFEN (requestPermission bräuchte eine Nutzer-Geste,
// queryPermission nicht). Ist sie noch gültig, sofort den aktuellen Stand
// schreiben, damit ein evtl. seit dem letzten Mal geänderter Stand (z.B.
// falls ein Schreibvorgang durch geschlossene App/leeren Akku nicht mehr
// zum Zug kam) nachgeholt wird.
async function autoSyncInitialisieren(){
  if(!fileSystemAccessVerfuegbar()){ autoSyncStatus = 'nicht_unterstuetzt'; return; }
  const handle = await autoSyncHandleLaden();
  if(!handle){ autoSyncStatus = 'nicht_verbunden'; return; }
  autoSyncOrdnerHandle = handle;
  try{
    const berechtigung = await handle.queryPermission({mode:'readwrite'});
    if(berechtigung==='granted'){
      autoSyncStatus = 'verbunden';
      await autoSyncSchreiben();
    } else {
      autoSyncStatus = 'berechtigung_fehlt';
    }
  }catch(e){ autoSyncStatus = 'nicht_verbunden'; }
}

// Erneutes Bestätigen (Nutzer-Geste vorhanden -- z.B. Tap auf "Erneut
// verbinden" in den Einstellungen), falls die Berechtigung abgelaufen ist.
async function autoSyncBerechtigungErneuern(){
  if(!autoSyncOrdnerHandle) return false;
  try{
    const berechtigt = await autoSyncOrdnerHandle.requestPermission({mode:'readwrite'});
    if(berechtigt==='granted'){
      autoSyncStatus = 'verbunden';
      await autoSyncSchreiben();
      return true;
    }
  }catch(e){}
  return false;
}

/* ==========================================================
   Rechnungspositionen-Auswahl (gemeinsame Ansicht für LS/PT)
   ========================================================== */
function ansichtPositionen(art, ausgewaehlteZiffern, betragSchaetzung, weiter, kmFahrstreckeGesamt){
  // FIX: vorher wurde hier "null" als zurueckZiel übergeben -- dadurch war
  // weder der Pfeil oben sichtbar, noch sprang die Handy-"Zurück"-Taste
  // sinnvoll zur Maske zurück; stattdessen griff die allgemeine "nicht auf
  // dem Hauptbildschirm"-Absicherung und sprang OHNE Rückfrage direkt zum
  // Startbildschirm (Gefahr von Datenverlust). ruecksprungAusEinstellungen
  // wurde vom Aufrufer (btnPunkte.onclick) bereits passend auf die Maske
  // (mit Schnappschuss der Maskenwerte) gesetzt, bevor diese Ansicht
  // aufgebaut wurde -- genau diese Funktion jetzt tatsächlich als
  // zurueckZiel verwenden (als Closure, damit ein späteres Neusetzen von
  // ruecksprungAusEinstellungen -- z.B. über das Zahnrad -- respektiert wird).
  setzeTitel('Rechnungspositionen', ()=>ruecksprungAusEinstellungen());
  aktuellerZurueckHandler = ()=>{ vorbereiteRuecksprung(); ruecksprungAusEinstellungen(); };
  const katalog = art==='ls' ? POSITIONEN_LS : POSITIONEN_PT;
  // Zeitzuschläge (F/G/H) und Wegegeld/Reiseentschädigung sind wie am PC
  // rein automatisch bestimmte Kategorien ("ZuschlagAuto"/"WegegeldAuto") --
  // sie werden von automatischeAuswahl() anhand Datum/Uhrzeit/km bestimmt
  // und sind bewusst NICHT manuell anwählbar (ausgegraut/gesperrt), damit
  // hier nichts abweichend vom errechneten Ergebnis angehakt werden kann.
  // Reiseentschädigung wie am PC (AutoZeileEinfuegen "##KM##"): Beschriftung
  // und Betrag zeigen zusätzlich die km-abhängige 26-ct-Zeile mit an.
  const reise = reiseGesamtBetrag(kmFahrstreckeGesamt);
  const reiseBez = reise.kmGerundet>0
    ? `${REISEENTSCHAEDIGUNG.bez} (${reise.basis.toFixed(2).replace('.',',')} &euro;) + Wegstrecke ${reise.kmGerundet} km &times; 0,26 &euro;/km (${reise.kmZeile.toFixed(2).replace('.',',')} &euro;)`
    : `${REISEENTSCHAEDIGUNG.bez} (zzgl. 0,26 &euro;/km Wegstrecke, sobald km bekannt)`;
  // Gruppierung/Beschriftung wie am PC (SektionVonPunkt): "Grundpauschalen"
  // statt "Grundleistung"; "E" ist inhaltlich kein Zeitzuschlag, wird aber
  // zusammen mit F/G/H unter "Zeitzuschläge" geführt (bleibt aber -- anders
  // als F/G/H -- manuell anhakbar); Wegegeld-Staffeln (Tag/Nacht) UND
  // Reiseentschädigung fallen am PC unter EINE gemeinsame Überschrift
  // "Wegegeld" statt mehrerer separater Abschnitte.
  const eEintrag = (katalog.grundleistung||[]).find(p=>p.ziffer==='E');
  const grundOhneE = (katalog.grundleistung||[]).filter(p=>p.ziffer!=='E');
  const gruppen = [
    {titel:'Grundpauschalen', liste: grundOhneE, automatisch:false},
    {titel:'Zeitzuschläge', liste: eEintrag ? [{...eEintrag, automatisch:false}, ...ZUSCHLAEGE_ZEIT] : ZUSCHLAEGE_ZEIT, automatisch:true},
    {titel:'Wegegeld', liste: [...WEGEGELD_TAG, ...WEGEGELD_NACHT, {ziffer:'REISE', bez:reiseBez, betrag:reise.gesamt}], automatisch:true}
  ];
  let html = `<div class="maske ${art}">`;
  gruppen.forEach(g=>{
    // Enthaelt eine Gruppe manuell UND automatisch bestimmte Positionen
    // (z.B. "E" innerhalb "Zeitzuschläge"), wird "automatisch" nicht mehr
    // pauschal in der Zwischenüberschrift, sondern je Position angezeigt.
    const gemischt = g.liste.some(p => typeof p.automatisch==='boolean' && p.automatisch!==g.automatisch);
    html += `<div class="positionen-gruppe-titel">${g.titel}${(g.automatisch && !gemischt)?' <span class="auto-hinweis">automatisch</span>':''}</div>`;
    g.liste.forEach(p=>{
      const istAuto = (typeof p.automatisch==='boolean') ? p.automatisch : g.automatisch;
      const checked = ausgewaehlteZiffern.has(p.ziffer) ? 'checked' : '';
      const gesperrt = istAuto ? 'disabled' : '';
      html += `<label class="position-zeile${istAuto?' auto-gesperrt':''}">
        <input type="checkbox" data-ziffer="${p.ziffer}" data-betrag="${p.betrag}" data-auto="${istAuto?'1':'0'}" ${checked} ${gesperrt}>
        <div class="haupt"><span class="ziffer">${p.ziffer||''}</span> ${p.bez}${gemischt&&istAuto?' <span class="auto-hinweis">automatisch</span>':''}</div>
        <div class="betrag">${p.betrag.toFixed(2).replace('.',',')} &euro;</div>
      </label>`;
    });
  });
  html += `<div class="summenzeile"><span>Gesamt</span><span id="posSumme">0,00 &euro;</span></div>`;
  html += `<button class="btn-primaer" id="btnPositionenFertig">Übernehmen</button>`;
  html += `</div>`;
  app.innerHTML = html;

  function summeBerechnen(){
    let summe=0;
    app.querySelectorAll('.position-zeile input:checked').forEach(cb=> summe += parseFloat(cb.dataset.betrag));
    document.getElementById('posSumme').textContent = summe.toFixed(2).replace('.',',')+' €';
    return summe;
  }

  // Gegenseitige Ausschlüsse (nur PT, 1:1 wie am PC/AusschluesseAktualisieren):
  // ist eine Ziffer aktiv -- egal ob manuell angehakt oder als Grundleistung
  // fest -- werden alle mit ihr unvereinbaren Positionen gesperrt und
  // automatisch abgehakt.
  function ausschluesseAktualisieren(){
    if(art!=='pt') return;
    const boxen = Array.from(app.querySelectorAll('.position-zeile input'));
    const aktive = new Set(boxen.filter(cb=>cb.checked).map(cb=>cb.dataset.ziffer));
    boxen.forEach(cb=>{
      // Automatik-Kategorien (Zeitzuschlag/Wegegeld/Reise) bleiben immer
      // gesperrt -- die Ausschluss-Logik betrifft nur die manuell wählbaren
      // Grundleistungs-Positionen.
      if(cb.dataset.auto==='1') return;
      const ausschluesse = ZIFFER_AUSSCHLUESSE[cb.dataset.ziffer];
      const zeile = cb.closest('.position-zeile');
      if(!ausschluesse){ cb.disabled=false; if(zeile) zeile.style.opacity=''; return; }
      const gesperrt = ausschluesse.some(z=> aktive.has(z));
      if(gesperrt && cb.checked) cb.checked = false;
      cb.disabled = gesperrt;
      if(zeile) zeile.style.opacity = gesperrt ? '0.45' : '';
    });
  }

  function positionAktualisieren(){ ausschluesseAktualisieren(); summeBerechnen(); }
  app.querySelectorAll('.position-zeile input').forEach(cb=> cb.addEventListener('change', positionAktualisieren));
  positionAktualisieren();

  document.getElementById('btnPositionenFertig').onclick = ()=>{
    const gewaehlt = new Set();
    let summe=0;
    app.querySelectorAll('.position-zeile input:checked').forEach(cb=>{ gewaehlt.add(cb.dataset.ziffer); summe += parseFloat(cb.dataset.betrag); });
    weiter(gewaehlt, summe);
  };
}

/* ==========================================================
   LS- / PT-Maske
   ========================================================== */
function ansichtMaske(art, korrekturIdx, vorbelegt){
  einstellungenOffen = false;
  // WICHTIG: vorbereiteRuecksprung() wird vom Zahnrad-Klick-Handler
  // aufgerufen, SOLANGE diese Maske noch angezeigt wird (also bevor auf
  // Einstellungen umgeschaltet wird) -- werteEinsammeln() liest dann noch
  // aus den echten, vorhandenen Maskenfeldern. Ein "fauler" Aufruf erst
  // beim Zurückspringen aus den Einstellungen würde stattdessen aus dem
  // (falschen) Einstellungen-DOM lesen und dort hängen bleiben.
  vorbereiteRuecksprung = ()=>{
    const snap = werteEinsammeln();
    ruecksprungAusEinstellungen = ()=>ansichtMaske(art, korrekturIdx, {werte: snap, positionen: positionenAuswahl});
  };
  // Wurde die Maske aus der Rechnungsübersicht heraus geöffnet (Klick auf
  // eine bestehende Rechnung -- erkennbar an gesetztem korrekturIdx), soll
  // "Zurück" (Pfeil, Handy-Taste ODER nach dem Speichern) auch wieder dahin
  // zurückführen statt immer auf die Startseite. Bei einer neu angelegten
  // Rechnung (kein korrekturIdx, ueber die Kacheln Leichenschau/Privat-
  // rechnung gestartet) bleibt es bei der Startseite.
  const ruecksprungZiel = korrekturIdx!==undefined ? ansichtKorrigieren : ansichtStart;
  setzeTitel(art==='ls' ? 'Leichenschau' : 'Privatrechnung', zurueckAusMaske);
  let werte = {};
  let positionenAuswahl = null;
  // Wie am PC (gManuellModus): '' = automatisch (50-km-Regel entscheidet
  // Wegegeld vs. Reiseentschädigung), 'REISE' = Nutzer hat bewusst eine
  // Fahrstrecke-Kachel als Reiseentschädigung gewählt, 'LUFTLINIE' = Nutzer
  // hat bewusst die Luftlinie-Kachel gewählt (überspringt die 50-km-Regel).
  // Wird bei jeder automatischen Neuberechnung (kmAutomatikAusloesen) wieder
  // auf '' zurückgesetzt, genau wie am PC (KmBerechnen setzt gManuellModus
  // ebenfalls vor jeder Neuberechnung zurück).
  let manuellerModus = '';
  // Analog zu PC gKmGetippt: unterscheidet echtes Eintippen ins km-Feld
  // (löst beim Verlassen des Feldes die 25/50-km-Interpretation aus) von
  // einem programmatischen Setzen des Werts (Routenberechnung, Alternativ-
  // routen-Kachel, Fallwiederherstellung) -- Letzteres feuert kein 'input'.
  let kmManuellGetippt = false;
  let kmVorFokus = '';
  if(vorbelegt){
    werte = {...vorbelegt.werte};
    positionenAuswahl = vorbelegt.positionen || null;
  } else if(korrekturIdx!==undefined){
    const gespeichert = ladeFaelle(art)[korrekturIdx];
    werte = {...gespeichert.werte};
    positionenAuswahl = gespeichert.positionen ? new Set(gespeichert.positionen) : null;
  } else {
    // Vorbelegung wie am PC (RechnungsdatumVorbelegen: Rechnungsdatum =
    // naechster Werktag nach dem Datum der Todesbescheinigung/des
    // Hausbesuchs, das seinerseits mit dem heutigen Datum vorbelegt ist;
    // UserForm_Initialize: Sterbedatum bei LS ebenfalls mit heute vorbelegt).
    const heute = heuteAlsText();
    werte = {txtDatum: naechsterWerktagText(heute), txtDatumExcel: heute};
    if(art==='ls') werte.txtSterbedatum = heute;
  }
  // Mehrfach-Diagnosen (nur PT) -- analog zu gDiagnosen am PC: je Eintrag
  // {text:"Beschreibung [Code]", flags:"" / "G" / "V" / "GV"}.
  let diagnosen = Array.isArray(werte.diagnosen) ? werte.diagnosen.map(d=>({...d})) : [];

  const ctx = {
    setValue(name, val){ const el=document.getElementById(name); if(el) el.value = val; },
    getValue(name){ const el=document.getElementById(name); return el? el.value : ''; },
    hinweis(text){ alertBanner(text); },
    async adresseVerlassen(){ await plzOrtPruefen('txtPAdresse1','txtPAdresse2'); await kmAutomatikAusloesen(); },
    allePruefungenAusfuehren(){ alleChecksAusfuehren(); }
  };

  function feldHtml(labelText, name, opts={}){
    const val = werte[name] || '';
    const grauKlasse = opts.grau ? 'grau' : '';
    return `<div class="feld">
      <label for="${name}">${labelText}</label>
      <input type="text" id="${name}" class="${grauKlasse}" value="${val.replace(/"/g,'&quot;')}" placeholder="${opts.platzhalter||''}">
      <div class="warnhinweis" id="${name}_warn"></div>
    </div>`;
  }

  let html = `<div class="maske ${art}">`;
  // Jeder Abschnitt wird in eine eigene "Karte" (.abschnitt) gepackt, damit
  // die Bereiche der Maske optisch klar voneinander getrennt sind, statt
  // nur durch eine kleine Textzeile.
  const abschnitt = (titel, inhalt) => `<div class="abschnitt"><div class="trennlinie">${titel}</div>${inhalt}</div>`;

  if(art==='ls'){
    html += abschnitt('Todesfeststellung',
      feldHtml('Datum Todesbescheinigung', 'txtDatumExcel', {typ:'datum'}) +
      feldHtml('Zeitpunkt Leichenschau (HH:MM)', 'txtZeitLS'));
  } else {
    html += abschnitt('Hausbesuch',
      feldHtml('Datum Hausbesuch', 'txtDatumExcel', {typ:'datum'}) +
      feldHtml('Uhrzeit Hausbesuch (HH:MM)', 'txtZeitLS'));
  }

  html += abschnitt('Rechnungsstellung',
    feldHtml('Rechnungsdatum (Versanddatum)', 'txtDatum') +
    `<div class="feld"><label>Rechnungsbetrag (&euro;)</label>
      <input type="text" id="txtBetrag" class="grau" value="${werte.txtBetrag||''}" readonly></div>`);

  // Abweichender Sterbeort (nur LS): wie am PC standardmäßig eingeklappt,
  // aber automatisch aufgeklappt, wenn schon Werte dafür gespeichert sind
  // (z.B. beim erneuten Öffnen eines korrigierten Falls).
  const sterbeAbwOffen = art==='ls' && !!((werte.txtSterbeAdr1||'').trim() || (werte.txtSterbeAdr2||'').trim());

  html += abschnitt('Patient',
    `<button class="btn-primaer blass" id="btnZwischenablage">Aus Zwischenablage einlesen</button>` +
    `<div class="warnhinweis" id="zwischenablageHinweis"></div>` +
    feldHtml('Nachname, Vorname', 'txtName') +
    feldHtml(art==='ls' ? 'Straße + Hausnummer (Sterbeort)' : 'Straße + Hausnummer', 'txtPAdresse1') +
    (art==='ls' ? `
      <div class="feld-zeile-mit-btn">
        <div class="feld">
          <label for="txtPAdresse2">PLZ + Stadt (Sterbeort)</label>
          <input type="text" id="txtPAdresse2" value="${(werte.txtPAdresse2||'').replace(/"/g,'&quot;')}">
        </div>
        <button type="button" class="btn-inline-blass" id="btnSterbeAbw">
          <span id="btnSterbeAbwText">${sterbeAbwOffen ? 'Sterbeort abw. ✕' : 'Sterbeort abw.?'}</span>
        </button>
      </div>
      <div class="warnhinweis" id="txtPAdresse2_warn"></div>
      <div id="sterbeAbwFelder" class="${sterbeAbwOffen ? '' : 'versteckt'}">
        ${feldHtml('Straße + Hausnummer (Sterbeort, abw.)', 'txtSterbeAdr1')}

  // Rote "Pflichtfeld fehlt"-Umrandung (siehe btnSpeichern.onclick unten)

  // Schnappschuss der Feldwerte GENAU SO, wie die Maske gerade aufgebaut

  const anfangsWerteJSON = JSON.stringify(werteEinsammeln());
  function hatUngespeicherteAenderungen(){
    return JSON.stringify(werteEinsammeln()) !== anfangsWerteJSON;
  }
  // Wie vom Nutzer gewünscht: die Handy-"Zurück"-Taste soll sich genauso
  // verhalten wie der Zurück-Pfeil oben -- nicht die App schließen. Wurden

  // wird das vor dem Verlassen zur Startseite als Hinweis (mit Wahlmöglich-
  // keit) angezeigt statt die Eingaben stillschweigend zu verwerfen.
  function zurueckAusMaske(){
    if(hatUngespeicherteAenderungen()){
      alertBanner(`Diese Rechnung wurde noch nicht gespeichert. Beim Zurückgehen gehen die Änderungen verloren.
        <div class="aktionen">

      warnEl.querySelector('[data-akt="verwerfen"]').onclick = ()=>{ warnEl.innerHTML=''; ruecksprungZiel(); };
      return;
    }
    ruecksprungZiel();
  }

  // Straße-Feld-Verhalten (str->straße + Großschreibung) VOR der
  // Geocoding-Auslösung registrieren, damit die Routen-/PLZ-Suche bereits
  // den korrigierten Straßennamen verwendet.
  document.getElementById('txtPAdresse1').addEventListener('blur', ()=> strasseFeldBlur('txtPAdresse1'));
  if(art==='ls') document.getElementById('txtAdresse1').addEventListener('blur', ()=> strasseFeldBlur('txtAdresse1'));

  ['txtPAdresse1','txtPAdresse2'].forEach(id=>{
    const el = document.getElementById(id); if(el) el.addEventListener('blur', ()=> kmAutomatikAusloesen());
  });
  // PLZ/Ort-Erkennung wie am PC: beim Verlassen des kombinierten
  // "PLZ + Ort"-Feldes ergänzen/prüfen.
  document.getElementById('txtPAdresse2').addEventListener('blur', ()=> plzOrtPruefen('txtPAdresse1','txtPAdresse2'));

  // Abweichender Sterbeort (nur LS): Auf-/Zuklappen-Button plus dieselbe
  // Straße-/PLZ-Ort-Behandlung wie bei den übrigen Adressfeldern. Ist dieser
  // Block ausgefüllt, gilt ER (nicht die Patientenadresse) als Sterbeort für
  // die Routenberechnung -- wie am PC (AktiverAdressBlock).
  if(art==='ls'){
    const btnSterbeAbw = document.getElementById('btnSterbeAbw');
    const sterbeAbwFelder = document.getElementById('sterbeAbwFelder');
    const sterbeAbwText = document.getElementById('btnSterbeAbwText');
    btnSterbeAbw.onclick = ()=>{
      const offen = !sterbeAbwFelder.classList.contains('versteckt');
