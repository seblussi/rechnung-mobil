// ---------- Erinnerung: Dienste ohne GKV-Patient und ohne Pseudo-Fall ----------
// Liest beim Start (hoechstens alle 3 h) das aktuelle Jahresblatt und meldet
// beendete Dienste der letzten 60 Tage, in denen weder ein GKV-Patient noch
// eine Pseudo-Zeile steht. "Erledigt" traegt die Pseudo-Zeile nach.
function pseudoPruefungVergessen(){ LS.set('pseudo_pruefung', null); }
async function pseudoOffeneDienste(neu){
  const c = LS.get('pseudo_pruefung', null);
  if(!neu && c && Date.now() - c.am < 3 * 3600000) return c.offen;
  if(typeof msGraphStatus === 'undefined' || msGraphStatus !== 'angemeldet') return c ? c.offen : [];
  try{
    const token = await msGraphTokenHolen(); if(!token) return c ? c.offen : [];
    const basis = msGraphPfadUrl(MSGRAPH_PFAD_FAHRTENBUCH);
    const info = await fahrdienstBlaetter(token, basis);
    const jetzt = new Date(), grenze = Date.now() - 60 * 86400000, y = jetzt.getFullYear();
    const blaetter = info.jahresModus ? info.blaetter.filter(n=> n === String(y) || (n === String(y - 1) && jetzt.getMonth() < 2)) : info.blaetter.slice(0, 1);
    const weg = new Set(LS.get('pseudo_ignoriert', []));
    const offen = [];
    for(const blatt of blaetter){
      const r = await gx(token, 'GET', fahrdienstBlattUrl(basis, blatt) + '/usedRange(valuesOnly=true)?$select=address,values');
      const s = xlAdresseStart(r && r.address), werte = [];
      for(let i = 1; i < s.zeile; i++) werte.push([]);
      ((r && r.values) || []).forEach(z=> werte.push(new Array(s.spalte).fill('').concat(z)));
      fahrdienstZeilenAuswerten(werte).bloecke.forEach(b=>{
        const z = fbBlockZeitraum({ datumText: b.datumText, zeitRoh: b.zeitRoh });
        if(!z || z.bis.getTime() > Date.now() || z.von.getTime() < grenze) return;
        if(b.gkvRoh > 0 || b.pseudo) return;
        const key = b.datumText + ' ' + String(b.zeitRoh || '');
        if(weg.has(key)) return;
        offen.push({ key, datumText: b.datumText, zeit: String(b.zeitRoh || ''), arzt: b.arzt || '', von: z.von.getTime() });
      });
    }
    LS.set('pseudo_pruefung', { am: Date.now(), offen });
    return offen;
  }catch(e){ return c ? c.offen : []; }
}
async function pseudoHinweisZeichnen(el){
  if(!el) return;
  const offen = await pseudoOffeneDienste();
  if(!document.body.contains(el)) return;
  if(!offen.length){ el.innerHTML = ''; return; }
  el.innerHTML = '<div class="pseudo-hinweis"><b>Pseudo-Fall 99999 vergessen?</b> In diesen Diensten steht kein GKV-Patient – ohne Pseudo-Fall in der KV-Abrechnung keine Förderung:' +
    offen.map(o=> '<div class="pseudo-zeile"><span>' + htmlEsc(o.datumText + ' · ' + o.zeit + ' Uhr' + (o.arzt ? ' · ' + o.arzt : '')) + '</span>' +
      '<button type="button" data-pseudo-ok="' + htmlEsc(o.key) + '">In KV angelegt ✓</button><button type="button" class="weg" data-pseudo-weg="' + htmlEsc(o.key) + '" title="kein Dienst / nicht nötig">×</button></div>').join('') + '</div>';
  el.querySelectorAll('[data-pseudo-ok]').forEach(b=> b.onclick = async ()=>{
    const o = offen.find(x=> x.key === b.dataset.pseudoOk); if(!o) return;
    const d = new Date(o.von);
    const r = await gkvPseudoEintragen(new Date(d.getFullYear(), d.getMonth(), d.getDate()), zz2(d.getHours()) + ':' + zz2(d.getMinutes()), { ohneFrage: true });
    if(r && !r.ok){ alertBanner ? alertBanner(r.text) : alert(r.text); }
    pseudoPruefungVergessen(); pseudoHinweisZeichnen(el);
  });
  el.querySelectorAll('[data-pseudo-weg]').forEach(b=> b.onclick = ()=>{
    const l = LS.get('pseudo_ignoriert', []); l.push(b.dataset.pseudoWeg); LS.set('pseudo_ignoriert', l.slice(-200));
    const c = LS.get('pseudo_pruefung', null); if(c){ c.offen = c.offen.filter(x=> x.key !== b.dataset.pseudoWeg); LS.set('pseudo_pruefung', c); }
    pseudoHinweisZeichnen(el);
  });
}

// Auswahl {schluessel: {anz, stufe?}} -> konkrete Positionen [{gop, anz, euro}]
function gkvPositionen(auswahl, dt){
  const out = [];
  Object.keys(auswahl || {}).forEach(k=>{
    const a = auswahl[k]; if(!a) return;
    const g = EBM_GRUPPEN[k];
    const gop = g ? g.waehle(dt, a.stufe) : k;
    const st = k === 'weg' ? EBM_GRUPPEN.weg.stufen.find(x=> x.k === a.stufe) : null;
    const anz = st && st.anz ? st.anz : Math.max(1, Number(a.anz) || 1);
    out.push({ gop, anz, euro: betaRund2(ebmEuro(gop, dt) * anz) });
  });
  return out;
}

  if(hat('01224') && hat('01226')) h.push('01224 und 01226 nicht nebeneinander (Leitfaden KVBW).');
  if((hat('01205') || hat('01207')) && pos.some(p=> /^3[345]\d{3}$/.test(p.gop))) h.push('Abklärungspauschale 01205/01207 nicht neben Leistungen der Kapitel 33, 34, 35.');
  if(pos.some(p=> /^0[34]\d{3}$/.test(p.gop))) h.push('Leistungen aus Kapitel 3 und 4 sind im Ärztlichen Bereitschaftsdienst nicht berechnungsfähig.');
  if(hat('01450') && !hat('88220')) h.push('Videosprechstunde: zusätzlich Kennzeichen 88220 angeben.');
  if(hat('01223') || hat('01224')) h.push('Schweregradzuschlag nur bei gesicherter Diagnose: Fraktur proximal Metacarpus/-tarsus, SHT mit Bewusstlosigkeit < 30 Min., akute TVT, hypertensive Krise, Angina pectoris (nicht I20.9), Pneumonie, akute Divertikulitis – sonst ausführliche schriftliche Begründung.');
  if(hat('01226')) h.push('01226 nur bei: Kind vor dem 3. Geburtstag, erheblichen kognitiven/emotionalen/Verhaltens-Beeinträchtigungen, ab 70 J. mit geriatrischem Bedarf und Frailty oder Demenz (F00–F02), Alzheimer (G30), Parkinson G20.1/G20.2.');
  return h;
}

const FB_COL = { A: 0, B: 1, C: 2, D: 3, E: 4, F: 5, AF: 31, AG: 32 };
function fbSpalte(i){ let s = '', n = i + 1; while(n > 0){ const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = Math.floor((n - 1) / 26); } return s; }
function fbSerial(d){ return Math.round((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(1899, 11, 30)) / 86400000); }
function fbDatumAusText(t){ const m = /^(\d{1,2})\.(\d{1,2})\.(\d{4})$/.exec(String(t || '').trim()); return m ? new Date(+m[3], +m[2] - 1, +m[1]) : null; }
function fbDatumText(d){ return zz2(d.getDate()) + '.' + zz2(d.getMonth() + 1) + '.' + d.getFullYear(); }
function fbZeitParsen(t){
  const m = /^\s*(\d{1,2})(?:[.,:](\d{1,2}))?\s*-\s*(\d{1,2})(?:[.,:](\d{1,2}))?\s*$/.exec(String(t == null ? '' : t));
  if(!m) return null;
  const s = +m[1] + (m[2] ? +m[2] / (m[2].length === 1 ? 10 : 60) : 0);
  const e = +m[3] + (m[4] ? +m[4] / (m[4].length === 1 ? 10 : 60) : 0);
  if(s > 24 || e > 24) return null;
  return { s, e };
}
function fbZeitText(z){ const f = (h)=> Number.isInteger(h) ? String(h) : String(Math.floor(h)) + ':' + zz2(Math.round((h % 1) * 60)); return f(z.s) + '-' + f(z.e); }
// Zeitraum eines Dienstblocks als Date-Paar (Dienst ueber Mitternacht: Ende am Folgetag)
function fbBlockZeitraum(b){
  const d = fbDatumAusText(b.datumText); if(!d) return null;
  const z = fbZeitParsen(b.zeitRoh);
  if(!z) return { von: d, bis: new Date(d.getTime() + 24 * 3600000), nurTag: true };
  const von = new Date(d.getTime() + z.s * 3600000);
  const bis = new Date(d.getTime() + (z.e + (z.e <= z.s ? 24 : 0)) * 3600000);
  return { von, bis };
}
function fbGopNorm(g){ return String(g == null ? '' : g).replace(/^0+/, ''); }

async function fbKontext(meldung){
  const token = await msGraphTokenHolen();
  if(!token) throw new Error('Keine Microsoft-Anmeldung aktiv.');
  const basis = msGraphPfadUrl(MSGRAPH_PFAD_FAHRTENBUCH);
  meldung && meldung('Fahrtenbuch wird gelesen …');
  return { token, basis, info: await fahrdienstBlaetter(token, basis) };
}
async function fbLesen(meldung, kx, blatt){
  kx = kx || await fbKontext(meldung);
  blatt = blatt || kx.info.blaetter[kx.info.blaetter.length - 1];
  const token = kx.token;
  const blattUrl = fahrdienstBlattUrl(kx.basis, blatt);
  const ur = await gx(token, 'GET', blattUrl + '/usedRange?$select=address,values');
  const st = xlAdresseStart(ur && ur.address);
  const werte = [];
  for(let i = 1; i < st.zeile; i++) werte.push([]);
  (ur.values || []).forEach(r=> werte.push(new Array(st.spalte).fill('').concat(r)));
  const daten = fahrdienstZeilenAuswerten(werte);
  // Ziffernspalten aus Zeile 2 (F..AF): "01418", 1418, "40220/40226" ...
  const spalten = new Map();
  const kopf = werte[1] || [];
  for(let c = FB_COL.F; c <= FB_COL.AF; c++){
    (String(kopf[c] == null ? '' : kopf[c]).match(/\d{3,5}/g) || []).forEach(g=>{ if(!spalten.has(fbGopNorm(g))) spalten.set(fbGopNorm(g), c); });
  }
  return { token, blattUrl, blatt, werte, daten, spalten, kx };
}

// Neues Jahresblatt anlegen (am Handy, wenn die HTA es noch nicht vorbereitet
// hat): Kopfzeilen 1-4, Zahlenformate, Spaltenbreiten und die Gesamtauswertung
// samt Erinnerungstext aus dem Vorjahresblatt; Zeile 3 mit den Betraegen des
// neuen Jahres. Zeilen 5-6 bleiben frei fuer den ersten Dienst, die Summen
// der Gesamtauswertung zeigen auf sie. Schrift, Rahmen und Farben ergaenzt
// die HTA beim naechsten Oeffnen am PC (Kennzeichen in AR1).
async function fbJahresblattAnlegen(kx, jahr, meldung){
  const vorlage = kx.info.blaetter.filter(n=> n < jahr).pop() || kx.info.blaetter[kx.info.blaetter.length - 1];
  meldung && meldung('Neues Tabellenblatt ' + jahr + ' wird angelegt …');
  const vUrl = fahrdienstBlattUrl(kx.basis, vorlage);
  const ur = await gx(kx.token, 'GET', vUrl + '/usedRange?$select=address,values,formulas,numberFormat');
  const st = xlAdresseStart(ur && ur.address);
  const ausr = (m)=>{ const o = []; for(let i = 1; i < st.zeile; i++) o.push([]); (m || []).forEach(r=> o.push(new Array(st.spalte).fill('').concat(r))); return o; };
  const W = ausr(ur.values), F = ausr(ur.formulas), N = ausr(ur.numberFormat);
  const d = fahrdienstZeilenAuswerten(W);
  const lastEnd = d.bloecke.length ? d.bloecke[d.bloecke.length - 1].zeileEnde : 4;
  const breite = 43; // A..AQ
  const zeileAus = (m, i, leer)=>{ const r = (m[i] || []).slice(0, breite); while(r.length < breite) r.push(leer); return r.map(v=> v == null ? leer : v); };
  // Bezuege der Gesamtauswertung umsetzen: Datenbereich -> Zeilen 5-6,
  // Zeilen der Gesamtauswertung -> ab Zeile 7, Kopfzeilen bleiben
  const fussStart = lastEnd + 1;
  const zeileNeu = (r, rolle)=> r < 5 ? r : r >= fussStart ? r - fussStart + 7 : (rolle === 'ende' ? 6 : 5);
  const umsetzen = (f)=> typeof f !== 'string' || f.charAt(0) !== '=' ? f :
    f.replace(/(?<![A-Za-z0-9_.!'])(\$?[A-Z]{1,3}\$?)(\d+)(?::(\$?[A-Z]{1,3}\$?)(\d+))?(?![A-Za-z0-9_(])/g, (m, s1, r1, s2, r2)=>
      s2 ? s1 + zeileNeu(+r1, 'start') + ':' + s2 + zeileNeu(+r2, 'ende') : s1 + zeileNeu(+r1, 'einzeln'));
  await gx(kx.token, 'POST', kx.basis + '/workbook/worksheets/add', { name: jahr });
  const nUrl = fahrdienstBlattUrl(kx.basis, jahr);
  // Kopf
  const kopf = [0, 1, 2, 3].map(i=> zeileAus(F, i, ''));
  const kopf2 = W[1] || [];
  const stichtag = new Date(+jahr, 0, 1);
  for(let c = 5; c <= 31; c++){
    const g = (String(kopf2[c] == null ? '' : kopf2[c]).match(/\d{3,5}/) || [''])[0].padStart(5, '0');
    if(g !== '00000' && ebmEintrag(g)) kopf[2][c] = ebmEuro(g, stichtag);
  }
  await gx(kx.token, 'PATCH', nUrl + "/range(address='A1:AQ4')", { formulas: kopf, numberFormat: [0, 1, 2, 3].map(i=> zeileAus(N, i, 'General')) });
  await gx(kx.token, 'PATCH', nUrl + "/range(address='A5:AQ6')", { numberFormat: [zeileAus(N, 4, 'General'), zeileAus(N, 5, 'General')] });
  // Gesamtauswertung + Erinnerungstext
  const fuss = [], fussNf = [];
  for(let i = fussStart - 1; i < F.length; i++){ fuss.push(zeileAus(F, i, '').map(umsetzen)); fussNf.push(zeileAus(N, i, 'General')); }
  if(fuss.length) await gx(kx.token, 'PATCH', nUrl + "/range(address='A7:AQ" + (6 + fuss.length) + "')", { formulas: fuss, numberFormat: fussNf });
  // Spaltenbreiten und Hoehe der Kopfzeilen
  meldung && meldung('Neues Tabellenblatt ' + jahr + ': Spaltenbreiten …');
  for(let c = 0; c < breite; c += 6){
    await Promise.all([...Array(Math.min(6, breite - c)).keys()].map(async k=>{
      const sp = fbSpalte(c + k);
      try{
        const f = await gx(kx.token, 'GET', vUrl + "/range(address='" + sp + ':' + sp + "')/format?$select=columnWidth");
        if(f && f.columnWidth) await gx(kx.token, 'PATCH', nUrl + "/range(address='" + sp + ':' + sp + "')/format", { columnWidth: f.columnWidth });
      }catch(e){}
    }));
  }
  for(let r = 1; r <= 4; r++){
    try{
      const f = await gx(kx.token, 'GET', vUrl + "/range(address='" + r + ':' + r + "')/format?$select=rowHeight,wrapText");
      if(f) await gx(kx.token, 'PATCH', nUrl + "/range(address='" + r + ':' + r + "')/format", { rowHeight: f.rowHeight, wrapText: !!f.wrapText });
    }catch(e){}
  }
  await gx(kx.token, 'PATCH', nUrl + "/range(address='AR1')", { values: [['App-angelegt']] });
}

function fbDienstFinden(fb, dt){
  let best = null, bestAbstand = Infinity;
  fb.daten.bloecke.forEach(b=>{
    const z = fbBlockZeitraum(b); if(!z) return;
    const t = dt.getTime();
    // Toleranz: 1 h vor Beginn, 3 h nach Ende (Nachdokumentation)
    if(t < z.von.getTime() - 3600000 || t > z.bis.getTime() + 3 * 3600000) return;
    const abstand = t < z.von.getTime() ? z.von.getTime() - t : t > z.bis.getTime() ? t - z.bis.getTime() : 0;
    if(abstand < bestAbstand){ best = b; bestAbstand = abstand; }
  });
  return best;
}

// Vorauswahl fuer "von-bis": in der Datei haeufige Zeiten zuerst
function fbZeitVorschlaege(fb, datum){
  const zaehl = new Map(), zaehlTyp = new Map();
  const typ = (d)=> d && ebmWochenendeOderFeiertag(d) ? 'we' : 'wt';
  const zielTyp = typ(datum);
  fb.daten.bloecke.forEach(b=>{
    const z = fbZeitParsen(b.zeitRoh); if(!z) return;
    const t = fbZeitText(z);
    zaehl.set(t, (zaehl.get(t) || 0) + 1);
    if(typ(fbDatumAusText(b.datumText)) === zielTyp) zaehlTyp.set(t, (zaehlTyp.get(t) || 0) + 1);
  });
  const liste = [...zaehl.keys()].sort((a, b)=> (zaehlTyp.get(b) || 0) - (zaehlTyp.get(a) || 0) || zaehl.get(b) - zaehl.get(a));
  (zielTyp === 'we' ? ['8-20', '20-8', '8-8', '8-16', '16-24'] : ['18-23', '19-7', '16-24', '8-16', '18-8'])
    .forEach(t=>{ if(!liste.includes(t)) liste.push(t); });
  return liste.slice(0, 8);
}
// Katalog der Vertretungsaerzte: aus der Datei (zuletzt vertretene zuerst) + lokal ergaenzte
function fbAerzte(fb){
  const e = ladeEinstellungen() || {};
  const aus = new Set((e.fbAerzteAus || []).map(x=> x.toLowerCase()));
  const liste = [];
  const dazu = (n)=>{ n = String(n || '').trim(); if(n && !aus.has(n.toLowerCase()) && !liste.some(x=> x.toLowerCase() === n.toLowerCase())) liste.push(n); };
  (e.fbAerzte || []).slice().reverse().forEach(dazu);
  fb.daten.bloecke.slice().reverse().forEach(b=> dazu(b.arzt));
  return liste;
}
function fbArztMerken(name){
  const e = ladeEinstellungen() || {};
  const n = String(name || '').trim(); if(!n) return;
  e.fbAerzte = (e.fbAerzte || []).filter(x=> x.toLowerCase() !== n.toLowerCase()).concat([n]).slice(-40);
  e.fbAerzteAus = (e.fbAerzteAus || []).filter(x=> x.toLowerCase() !== n.toLowerCase());
  speichereEinstellungen(e);
}
function fbArztAusblenden(name){
  const e = ladeEinstellungen() || {};
  e.fbAerzte = (e.fbAerzte || []).filter(x=> x.toLowerCase() !== String(name).toLowerCase());
  e.fbAerzteAus = (e.fbAerzteAus || []).concat([String(name)]);
  speichereEinstellungen(e);
}

// Dienstart steht in Spalte B unter dem Datum (bisher immer "Fahrdienst");
// sie bestimmt den Foerdersatz (Sitzdienst/Telemedizin immer 50 EUR/h)
const FB_DIENSTARTEN = ['Fahrdienst', 'Sitzdienst', 'Telemedizin'];
// Rueckfrage "Neuer Dienst" -> {datum, zeit:{s,e}, arzt, art} oder null (nicht eintragen)
async function fbDienstAbfragen(fb, dt, fallText){
  let datum = new Date(dt.getFullYear(), dt.getMonth(), dt.getDate());
  if(ebmStunde(dt) < 7) datum = new Date(datum.getTime() - 86400000); // Nacht: Dienst hat am Vortag begonnen
  const vorschlaege = fbZeitVorschlaege(fb, datum);
  let zeit = fbZeitParsen(vorschlaege[0]);
  // Vorauswahl: erster Vorschlag, der die Uhrzeit des Falls enthaelt
  for(const v of vorschlaege){
    const z = fbZeitParsen(v); if(!z) continue;
    const von = datum.getTime() + z.s * 3600000, bis = datum.getTime() + (z.e + (z.e <= z.s ? 24 : 0)) * 3600000;
    if(dt.getTime() >= von && dt.getTime() <= bis){ zeit = z; break; }
  }
  let aerzte = fbAerzte(fb);
  let arzt = aerzte[0] || '';
  let art = LS.get('fb_dienstart', 'Fahrdienst');
  let fehler = '';
  const iso = (d)=> d.getFullYear() + '-' + zz2(d.getMonth() + 1) + '-' + zz2(d.getDate());
  while(true){
    const html =
      '<div class="fb-dialog">' +
      '<div class="fb-fall">' + htmlEsc(fallText) + '</div>' +
      '<div class="fb-info">Für diesen Zeitpunkt steht noch kein Dienst im Fahrtenbuch.</div>' +
      (fehler ? '<div class="fb-fehler">' + htmlEsc(fehler) + '</div>' : '') +
      '<label class="fb-lbl">Dienstbeginn (Tag)<input type="date" id="fbDatum" value="' + iso(datum) + '"></label>' +
      '<div class="fb-lbl">Dienstzeit</div>' +
      '<div class="fb-chips" id="fbZeitChips">' + vorschlaege.map(v=> '<button type="button" class="fb-chip' + (zeit && fbZeitText(zeit) === v ? ' an' : '') + '" data-zeit="' + htmlEsc(v) + '">' + htmlEsc(v) + '</button>').join('') + '</div>' +
      '<div class="fb-zeile"><label>von<input type="text" inputmode="decimal" id="fbVon" value="' + (zeit ? htmlEsc(fbZeitText(zeit).split('-')[0]) : '') + '"></label>' +
      '<label>bis<input type="text" inputmode="decimal" id="fbBis" value="' + (zeit ? htmlEsc(fbZeitText(zeit).split('-')[1]) : '') + '"></label><span class="fb-uhr">Uhr</span></div>' +
      '<div class="fb-lbl">Dienstart</div>' +
      '<div class="fb-chips" id="fbArtChips">' + FB_DIENSTARTEN.map(a=> '<button type="button" class="fb-chip' + (a === art ? ' an' : '') + '" data-art="' + a + '">' + a + '</button>').join('') + '</div>' +
      '<div class="fb-lbl">Vertretener Arzt (Dienstinhaber)</div>' +
      '<div class="fb-chips" id="fbArztChips">' + aerzte.map(a=> '<span class="fb-chip arzt' + (a === arzt ? ' an' : '') + '"><button type="button" class="w" data-arzt="' + htmlEsc(a) + '">' + htmlEsc(a) + '</button><button type="button" class="x" data-weg="' + htmlEsc(a) + '" aria-label="entfernen">×</button></span>').join('') + '</div>' +
      '<input type="text" id="fbArzt" placeholder="Name (neu eintippen oder oben wählen)" value="' + htmlEsc(arzt) + '">' +
      '</div>';
    const p = betaOverlay.ergebnis('Neuer Dienst', html, [
      { label: 'Nicht eintragen', akt: 'nein' }, { label: 'Dienst anlegen', akt: 'ok', primaer: true }]);
    // Bedienung im Fenster
    const wurzel = document.querySelector('.beta-overlay .fb-dialog');
    if(wurzel){
      wurzel.querySelectorAll('[data-zeit]').forEach(b=> b.onclick = ()=>{
        const z = fbZeitParsen(b.dataset.zeit); if(!z) return;
        const [v, bi] = fbZeitText(z).split('-');
        wurzel.querySelector('#fbVon').value = v; wurzel.querySelector('#fbBis').value = bi;
        wurzel.querySelectorAll('[data-zeit]').forEach(x=> x.classList.toggle('an', x === b));
      });
      wurzel.querySelectorAll('[data-art]').forEach(b=> b.onclick = ()=>{
        art = b.dataset.art; wurzel.querySelectorAll('[data-art]').forEach(x=> x.classList.toggle('an', x === b));
      });
      wurzel.querySelectorAll('[data-arzt]').forEach(b=> b.onclick = ()=>{
        wurzel.querySelector('#fbArzt').value = b.dataset.arzt;
        wurzel.querySelectorAll('.fb-chip.arzt').forEach(x=> x.classList.toggle('an', x.contains(b)));
      });
      wurzel.querySelectorAll('[data-weg]').forEach(b=> b.onclick = ()=>{
        fbArztAusblenden(b.dataset.weg);
        const chip = b.closest('.fb-chip'); if(chip) chip.remove();
        if(wurzel.querySelector('#fbArzt').value === b.dataset.weg) wurzel.querySelector('#fbArzt').value = '';
      });
    }
    const akt = await p;
    if(akt !== 'ok') return null;
    const dW = (document.getElementById('fbDatum') || {}).value || '';
    const von = (document.getElementById('fbVon') || {}).value || '', bis = (document.getElementById('fbBis') || {}).value || '';
    arzt = String((document.getElementById('fbArzt') || {}).value || '').trim();
    const dm = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dW);
    if(dm) datum = new Date(+dm[1], +dm[2] - 1, +dm[3]);
    zeit = fbZeitParsen(von.trim() + '-' + bis.trim());
    aerzte = fbAerzte(fb);
    if(!dm){ fehler = 'Bitte das Datum des Dienstbeginns wählen.'; continue; }
    if(!zeit){ fehler = 'Bitte Beginn und Ende als Uhrzeit eintragen (z.B. 18 und 23).'; continue; }
    if(!arzt){ fehler = 'Bitte den vertretenen Arzt eintragen.'; continue; }
    fbArztMerken(arzt);
    LS.set('fb_dienstart', art);
    return { datum, zeit, arzt, art };
  }
}

// Unter den Dienstbloecken stehen Gesamtauswertung und Erinnerungstext. Wird
// direkt nach dem letzten Dienst eingefuegt, wachsen deren Summenbereiche
// (z.B. AH5:AH310) in Excel nicht mit -- deshalb hier nachziehen: Bereiche,
// die genau an der bisher letzten Datenzeile enden, bis zur neuen verlaengern.
async function fbFussAnpassen(fb, alteLetzte, n){
  try{
    const von = alteLetzte + n + 1, bis = alteLetzte + n + 25;
    const r = await gx(fb.token, 'GET', fb.blattUrl + "/range(address='A" + von + ':AQ' + bis + "')?$select=formulas");
    const f = (r && r.formulas) || [];
    for(let i = 0; i < f.length; i++){
      for(let j = 0; j < (f[i] || []).length; j++){
        const alt = f[i][j];
        if(typeof alt !== 'string' || alt.charAt(0) !== '=') continue;
        const neu = alt.replace(/(\$?[A-Z]{1,3}\$?)(\d+):(\$?[A-Z]{1,3}\$?)(\d+)/g, (m, s1, r1, s2, r2)=>
          (+r2 === alteLetzte && +r1 <= alteLetzte) ? s1 + r1 + ':' + s2 + (alteLetzte + n) : m);
        if(neu !== alt) await gx(fb.token, 'PATCH', fb.blattUrl + "/range(address='" + fbSpalte(j) + (von + i) + "')", { formulas: [[neu]] });
      }
    }
  }catch(e){}
}

// Haupteinstieg: Fall ins Fahrtenbuch eintragen.
// fall: {kat:''|'P'|'LS', name, datum: Date, zeit:'HH:MM'|'' , euro, positionen?:[{gop, anz}], namen?: [Varianten zum Wiederfinden]}
// opt.fragen=false -> ohne passenden Dienst nichts anlegen (nur Hinweis)
// -> {zeile, neuerDienst, aktualisiert, ohneSpalte:[], dienst:'14.10.2026 18-23'} oder {uebersprungen:true, grund}
async function fahrtenbuchEintragen(fall, meldung, opt){
  opt = opt || {};
  const kx = await fbKontext(meldung);
  const zm = /^(\d{1,2}):(\d{2})/.exec(String(fall.zeit || ''));
  const dt = new Date(fall.datum.getFullYear(), fall.datum.getMonth(), fall.datum.getDate(), zm ? +zm[1] : 12, zm ? +zm[2] : 0);
  // Jahresblatt des Falls; Anfang Januar auch das Vorjahr (Dienst ueber Silvester)
  let kandidaten = [kx.info.blaetter[0]];
  if(kx.info.jahresModus){
    const y = dt.getFullYear();
    kandidaten = [String(y)].concat(dt.getMonth() === 0 && dt.getDate() <= 2 ? [String(y - 1)] : []).filter(n=> kx.info.blaetter.includes(n));
  }
  let fb = null, block = null;
  for(const n of kandidaten){
    const f = await fbLesen(meldung, kx, n);
    const b = fbDienstFinden(f, dt);
    if(b){ fb = f; block = b; break; }
    if(!fb) fb = f;
  }
  if(!fb) fb = await fbLesen(meldung, kx); // Jahresblatt fehlt noch: Vorschlaege aus dem neuesten Blatt
  let neuerDienst = false;
  if(!block){
    if(opt.fragen === false) return { uebersprungen: true, grund: 'kein Dienst am ' + fbDatumText(fall.datum) + ' im Fahrtenbuch' };
    const d = await fbDienstAbfragen(fb, dt, (fall.kat === 'LS' ? 'Leichenschau' : fall.kat === 'P' ? 'Privatpatient' : 'GKV') + ': ' + fall.name + ' · ' + fbDatumText(fall.datum) + (zm ? ', ' + zm[0] + ' Uhr' : ''));
    if(!d) return { uebersprungen: true, grund: 'nicht eingetragen (kein Dienst gewählt)', abgelehnt: true };
    meldung && meldung('Neuer Dienst wird angelegt …');
    if(kx.info.jahresModus){
      const zielJahr = String(d.datum.getFullYear());
      if(fb.blatt !== zielJahr){
        if(!kx.info.blaetter.includes(zielJahr)){
          await fbJahresblattAnlegen(kx, zielJahr, meldung);
          kx.info.blaetter.push(zielJahr); kx.info.blaetter.sort();
        }
        fb = await fbLesen(meldung, kx, zielJahr);
      }
    }
    // leeres Jahresblatt (Zeilen 5-6 frei): direkt dort, ohne Einfuegen
    const zeileLeer = (i)=> !(fb.werte[i] || []).some(v=> String(v == null ? '' : v).trim() !== '');
    const blattLeer = !fb.daten.bloecke.length && zeileLeer(4) && zeileLeer(5);
    // chronologisch einsortieren
    const neuStart = d.datum.getTime() + d.zeit.s * 3600000;
    const danach = fb.daten.bloecke.find(b=>{ const z = fbBlockZeitraum(b); return z && z.von.getTime() > neuStart; });
    const letzte = fb.daten.bloecke.length ? fb.daten.bloecke[fb.daten.bloecke.length - 1].zeileEnde : 4;
    const z1 = blattLeer ? 5 : danach ? danach.zeileStart : letzte + 1;
    if(!blattLeer){
      await fbZeilenEinfuegen(fb, z1, 2);
      if(!danach) await fbFussAnpassen(fb, letzte, 2);
    }
    await gx(fb.token, 'PATCH', fb.blattUrl + "/range(address='A" + z1 + ':C' + (z1 + 1) + "')", {
      numberFormat: [['0', 'dd.mm.yyyy', '@'], ['General', '@', '@']],
      values: [[Math.floor(d.datum.getMonth() / 3) + 1, fbSerial(d.datum), fbZeitText(d.zeit)], ['', d.art || 'Fahrdienst', d.arzt]]
    });
    block = { zeileStart: z1, zeileEnde: z1 + 1, datumText: fbDatumText(d.datum), zeitRoh: fbZeitText(d.zeit), arzt: d.arzt, frisch: true };
    neuerDienst = true;
  }
  // Zielzeile: derselbe Patient schon im Block? -> aktualisieren; sonst erste Zeile ohne Namen; sonst neue Zeile
  const norm = (t)=> String(t == null ? '' : t).trim().toLowerCase().replace(/\s+/g, ' ');
  const namen = [fall.name].concat(fall.namen || []).map(norm).filter(Boolean);
  let ziel = 0, aktualisiert = false;
  if(!block.frisch){
    for(let r = block.zeileStart; r <= block.zeileEnde; r++){
      const zr = fb.werte[r - 1] || [];
      const kat = String(zr[FB_COL.E] == null ? '' : zr[FB_COL.E]).trim().toUpperCase();
      const katGleich = (fall.kat === 'LS' ? (kat === 'L' || kat === 'LS') : fall.kat === 'P' ? (kat === 'P' || kat === 'PT') : kat === '');
      if(katGleich && namen.includes(norm(zr[FB_COL.D]))){ ziel = r; aktualisiert = true; break; }
    }
    if(!ziel){
      for(let r = block.zeileStart; r <= block.zeileEnde; r++){
        const zr = fb.werte[r - 1] || [];
        if(norm(zr[FB_COL.D]) === '' && norm(zr[FB_COL.E]) === '' && norm(zr[FB_COL.AG]) === ''){ ziel = r; break; }
      }
    }
    if(!ziel){
      ziel = block.zeileEnde + 1;
      meldung && meldung('Zeile wird eingefügt …');
      await fbZeilenEinfuegen(fb, ziel, 1);
      const letzteZeile = fb.daten.bloecke.length ? fb.daten.bloecke[fb.daten.bloecke.length - 1].zeileEnde : 0;
      if(block.zeileEnde === letzteZeile) await fbFussAnpassen(fb, block.zeileEnde, 1);
    }
  } else ziel = block.zeileStart;
  // Zeile D..AG
  const zeile = new Array(FB_COL.AG - FB_COL.D + 1).fill('');
  zeile[0] = fall.name; zeile[1] = fall.kat || '';
  const ohneSpalte = [];
  (fall.positionen || []).forEach(p=>{
    const c = fb.spalten.get(fbGopNorm(p.gop));
    if(c == null){ ohneSpalte.push(p.gop); return; }
    const i = c - FB_COL.D;
    zeile[i] = (Number(zeile[i]) || 0) + (Number(p.anz) || 1);
  });
  zeile[zeile.length - 1] = betaRund2(Number(fall.euro) || 0);
  if(aktualisiert){
    // vorhandene Zaehlungen nur bei GKV ersetzen; bei P/LS stehen dort keine
    const alt = fb.werte[ziel - 1] || [];
    for(let i = 2; i < zeile.length - 1; i++) if(zeile[i] === '' && fall.kat && alt[FB_COL.D + i] != null) zeile[i] = alt[FB_COL.D + i];
  }
  meldung && meldung('Fahrtenbuch: Zeile ' + ziel + ' wird geschrieben …');
  // GKV im Jahresblatt: AG rechnet mit der Euro-Zeile 3 des Blatts (wie die
  // uebrigen Zeilen), wenn jede Ziffer eine eigene Spalte hat
  if(kx.info.jahresModus && !fall.kat && !ohneSpalte.length && (fall.positionen || []).length)
    zeile[zeile.length - 1] = '=SUMPRODUCT($F$3:$AF$3,F' + ziel + ':AF' + ziel + ')';
  await gx(fb.token, 'PATCH', fb.blattUrl + "/range(address='D" + ziel + ':AG' + ziel + "')", { formulas: [zeile] });
  // Statistik rechts nachziehen (verschobene Blockenden, Quartalssummen)
  try{ await fahrdienstStatistikSchreiben(meldung, { blatt: fb.blatt }); }catch(e){}
  return { zeile: ziel, blatt: kx.info.jahresModus ? fb.blatt : '', neuerDienst, aktualisiert, ohneSpalte,
           dienst: block.datumText + ' ' + (fbZeitParsen(block.zeitRoh) ? fbZeitText(fbZeitParsen(block.zeitRoh)) : String(block.zeitRoh || '')) + (block.arzt ? ' · ' + block.arzt : '') };
}
function fahrtenbuchErgebnisText(r){
  if(!r) return '';
  if(r.uebersprungen) return '– Fahrtenbuch: ' + r.grund;
  return '✓ Fahrtenbuch: ' + (r.blatt ? 'Blatt ' + r.blatt + ', ' : '') + (r.aktualisiert ? 'Zeile ' + r.zeile + ' aktualisiert' : 'Zeile ' + r.zeile + ' eingetragen') +
    ' (Dienst ' + r.dienst + (r.neuerDienst ? ', neu angelegt' : '') + ')' +
    (r.ohneSpalte && r.ohneSpalte.length ? ' · ohne eigene Spalte, nur im Betrag: ' + r.ohneSpalte.join(', ') : '');
}

// PT/LS nach dem Erstellen der Rechnung (aus betaFaelleHochladen)
async function fahrtenbuchAusRechnung(fall, erg, meldung){
  if(fall.fahrtenbuch === 'nein') return '';
  const w = fall.werte || {};
  const d = fbDatumAusText(normalisiereDatum(w.txtDatumExcel || '') || '');
  if(!d) return '';
  const { nachname, vorname } = nameAufteilen(w.txtName);
  const alter = (Date.now() - d.getTime()) / 86400000;
  const r = await fahrtenbuchEintragen({
    kat: fall.art === 'ls' ? 'LS' : 'P', name: nachname + ', ' + vorname,
    namen: [vorname + ' ' + nachname, nachname], datum: d, zeit: normalisiereZeit(w.txtZeitLS || '') || String(w.txtZeitLS || ''),
    euro: erg.summe
  }, meldung, { fragen: alter < 14 });
  if(r.abgelehnt && fall.zeitstempel && typeof betaFallAendern === 'function') betaFallAendern(fall.art, fall.zeitstempel, x=>{ x.fahrtenbuch = 'nein'; });
  return fahrtenbuchErgebnisText(r);
}

  const el = (id)=> document.getElementById(id);
  function zeichnen(){

    el('gkvZeitInfo').textContent = 'Ziffern nach Zeitpunkt: ' + nacht;

      const mehr = a && (g ? g.mehrfach : EBM_MEHRFACH.includes(gop));

        (mehr ? '<div class="gkv-anz"><button type="button" data-minus="' + k + '">−</button><b>' + anz + '×</b><button type="button" data-plus="' + k + '">+</button></div>' : '') +

    el('gkvHinweise').innerHTML = gkvHinweise(pos).map(h=> '<div class="gkv-warn">' + htmlEsc(h) + '</div>').join('');
    profileZeichnen();
    el('gkvListe').querySelectorAll('[data-tipp]').forEach(b=> b.onclick = ()=>{

  function profileZeichnen(){

  el('gkvAdresse').oninput = ()=>{ st.adresse = adrLesen(); if(st.kmInfo){ st.kmInfo = ''; st.kmStufe = ''; st.kmGeo = null; el('gkvKmInfo').textContent = 'Adresse geändert – „Luftlinie“ erneut tippen.'; } };
  el('gkvAdresse').onkeydown = (ev)=>{ if(ev.key === 'Enter'){ ev.preventDefault(); el('gkvPlzOrt').focus(); } };
  el('gkvKmBtn').onclick = async ()=>{
    await gkvPlzOrtErgaenzen(el('gkvAdresse'), el('gkvPlzOrt'), el('gkvPlzInfo'));

  const m = nfpPixelZuGeo.inv, w = m[6] * x + m[7] * y + m[8], X = (m[0] * x + m[1] * y + m[2]) / w, Y = (m[3] * x + m[4] * y + m[5]) / w;
  return { lat: g.lat0 + Y / g.ky, lon: g.lon0 + X / g.kx };
}
function nfpKmText(km){ return String(Math.round(km * 10) / 10).replace('.', ','); }
function nfpImBild(p){ return p && p.x >= 0 && p.y >= 0 && p.x < NFP_KARTE.bild[0] && p.y < NFP_KARTE.bild[1]; }
// Zone an einem Kartenpunkt -> Stufe der Wegepauschale
function nfpBewertung(p){
  const z = nfpZoneAnPixel(p.x, p.y), km = Math.hypot(p.x - NFP_KARTE.nfp[0], p.y - NFP_KARTE.nfp[1]) / NFP_KARTE.pxkm;
  const kmT = String(Math.round(km * 10) / 10).replace('.', ',');
  if(z && NFP_ZONEN[z]) return { x: p.x, y: p.y, zone: z, stufe: NFP_ZONEN[z].stufe, text: NFP_ZONEN[z].label, km, quelle: 'karte' };
  if(z === 0) return { x: p.x, y: p.y, zone: 0, stufe: km > 50 ? '50+' : '30+', text: 'außerhalb der 30-km-Zone', km, quelle: 'karte' };
  return { x: p.x, y: p.y, zone: 9, stufe: gkvStufeFuerKm(km), text: 'Zone hier nicht eindeutig – nach Luftlinie', km, quelle: 'entfernung' };
}
function gkvStartGeo(){ const s = LS.get('gkv_start_geo', null); return s && s.adr === gkvStartAdresse() ? s : null; }
async function gkvStartGeoHolen(){
  let s = gkvStartGeo(); if(s) return s;
  const adr = gkvStartAdresse(); if(!adr) return null;
  try{ const g = await geocode(adr); if(!g) return null; s = { adr, lat: g.lat, lon: g.lon }; LS.set('gkv_start_geo', s); return s; }catch(_){ return null; }
}
// "Luftlinie 11,6 km ab Wache" (ab Startadresse, sonst ab NFP)
function nfpLuftlinieText(geo, p){
  const s = gkvStartGeo();
  if(s && geo) return 'Luftlinie ' + nfpKmText(kmLuftlinieEinfach(s, geo)) + ' km ab ' + s.adr;
  if(p) return 'Luftlinie ca. ' + nfpKmText(Math.hypot(p.x - NFP_KARTE.nfp[0], p.y - NFP_KARTE.nfp[1]) / NFP_KARTE.pxkm) + ' km ab NFP';
  return '';
}
function nfpStufeLabel(st){ const s = EBM_GRUPPEN.weg.stufen.find(x=> x.k === st); return s ? s.label + (s.anz ? ' (' + s.anz + '×)' : '') : st; }

// Kartenbild aus OneDrive (einmal geladen, dann im Geraet zwischengespeichert)
async function nfpKarteBildUrl(neu){
  if(nfpKarteBildUrl.url && !neu) return nfpKarteBildUrl.url;
  const SCHL = './__nfp_karte__';
  try{
    const cache = ('caches' in window) ? await caches.open('nfp-karte') : null;
    let res = (cache && !neu) ? await cache.match(SCHL) : null;
    if(!res && typeof msGraphStatus !== 'undefined' && msGraphStatus === 'angemeldet'){
      const token = await msGraphTokenHolen();
      const r = await fetch(msGraphPfadUrl(NFP_KARTE_PFAD) + '/content', { headers: { Authorization: 'Bearer ' + token } });
      if(r.ok){ if(cache) await cache.put(SCHL, r.clone()); res = r; }
    }
    if(res){ nfpKarteBildUrl.url = URL.createObjectURL(await res.blob()); return nfpKarteBildUrl.url; }
  }catch(_){}
  return null;
}
// Ersatz ohne Kartenbild: die ausgelesenen Zonen als Farbflaechen
function nfpZonenBildUrl(){
  if(nfpZonenBildUrl.url) return nfpZonenBildUrl.url;
  const c = document.createElement('canvas'); c.width = NFP_KARTE.w; c.height = NFP_KARTE.h;
  const g = c.getContext('2d'), img = g.createImageData(c.width, c.height), r = nfpRaster();
  const rgb = { 0: [245, 245, 245], 9: [220, 220, 220] };
  Object.keys(NFP_ZONEN).forEach(z=>{ const h = NFP_ZONEN[z].farbe; rgb[z] = [1, 3, 5].map(o=> parseInt(h.substr(o, 2), 16)); });
  for(let i = 0; i < r.length; i++){ const f = rgb[r[i]] || [255, 255, 255]; img.data.set([f[0], f[1], f[2], 255], i * 4); }
  g.putImageData(img, 0, 0);
  return (nfpZonenBildUrl.url = c.toDataURL());
}

// Karte einblenden: Adresse suchen, GPS-Standort oder Tippen = Einsatzstelle.
// Zoom ueber eigene Knoepfe/zwei Finger (die Punkte behalten ihre Groesse).
// -> { stufe, text, kmText, woher, geo, adresseText } | null
async function nfpKarteOeffnen(opt){
  opt = opt || {};
  await gkvStartGeoHolen();
  const bildUrl = await nfpKarteBildUrl();
  const ov = document.createElement('div');
  ov.className = 'nfp-overlay';
  ov.innerHTML =
    '<div class="nfp-kopf"><b>Wegegeld-Karte NFP Offenburg</b><button type="button" class="nfp-zu" aria-label="schließen">×</button></div>' +
    '<div class="nfp-suche"><input type="text" id="nfpStrasse" autocomplete="off" placeholder="Straße Nr." value="' + htmlEsc(gkvAdrTeile(opt.adresseText).strasse) + '">' +
      '<input type="search" id="nfpPlzOrt" enterkeyhint="search" autocomplete="off" placeholder="PLZ Ort" value="' + htmlEsc(gkvAdrTeile(opt.adresseText).plzOrt) + '">' +
      '<button type="button" class="btn-sekundaer nfp-such-knopf">Suchen</button></div>' +
    (bildUrl ? '' : '<div class="nfp-hinweis">Kartenbild nicht gefunden – es werden nur die ausgelesenen Zonen gezeigt. Für die echte Karte die Datei <b>Karte_NFP_Offenburg.jpg</b> in den OneDrive-Ordner <b>KVBW Onedrive/Karten</b> legen.</div>') +
    '<div class="nfp-scroll"><div class="nfp-flaeche"><img alt="Karte" draggable="false">' +
      '<div class="nfp-punkt nfp-adr" hidden></div><div class="nfp-punkt nfp-gps" hidden></div><div class="nfp-punkt nfp-wahl" hidden></div></div></div>' +
    '<div class="nfp-fuss"><div class="nfp-info" id="nfpInfo">Adresse suchen, Standort holen oder auf die Einsatzstelle tippen.</div>' +
      '<div class="nfp-knoepfe"><button type="button" data-zoom="-1">−</button><button type="button" data-zoom="1">+</button>' +
      '<button type="button" class="nfp-gps-knopf">📍 Standort</button><button type="button" class="btn-primaer nfp-ok" disabled>Übernehmen</button></div></div>';
  document.body.appendChild(ov);
  document.body.classList.add('nfp-offen');
  const img = ov.querySelector('img'), fl = ov.querySelector('.nfp-flaeche'), sc = ov.querySelector('.nfp-scroll'), info = ov.querySelector('#nfpInfo');
  img.src = bildUrl || nfpZonenBildUrl();
  let zoom = 1, wahl = null;
  const setzeZoom = (z, mitte)=>{
    const alt = { x: (sc.scrollLeft + sc.clientWidth / 2) / fl.clientWidth, y: (sc.scrollTop + sc.clientHeight / 2) / Math.max(1, fl.clientHeight) };
    zoom = Math.max(1, Math.min(6, z)); fl.style.width = (zoom * 100) + '%';
    const m = mitte || alt;
    sc.scrollLeft = m.x * fl.clientWidth - sc.clientWidth / 2; sc.scrollTop = m.y * fl.clientHeight - sc.clientHeight / 2;
  };
  const punkt = (cls, p)=>{
    const el = ov.querySelector('.' + cls);
    if(!p || !nfpImBild(p)){ el.hidden = true; return; }
    el.hidden = false; el.style.left = (p.x / NFP_KARTE.bild[0] * 100) + '%'; el.style.top = (p.y / NFP_KARTE.bild[1] * 100) + '%';
  };
  const waehlen = (p, woher, geo, adresseText)=>{
    if(!nfpImBild(p)){ info.innerHTML = 'Dieser Ort liegt außerhalb der Karte.'; return; }
    const g = geo || nfpPixelZuGeo(p.x, p.y);
    const b = nfpBewertung(p), s = gkvStartGeo();
    const kmStart = s ? kmLuftlinieEinfach(s, g) : null;
    if(kmStart != null && kmStart > 50) b.stufe = '50+';
    wahl = { ...b, woher, geo: g, adresseText: adresseText || '', kmText: nfpLuftlinieText(g, p) };
    punkt('nfp-wahl', p);
    const z = NFP_ZONEN[wahl.zone];
    info.innerHTML = (woher ? htmlEsc(woher) + ': ' : '') + '<b' + (z ? ' style="color:' + z.farbe + '"' : '') + '>' + htmlEsc(wahl.text) + '</b> → Wegepauschale <b>' +
      htmlEsc(nfpStufeLabel(wahl.stufe)) + '</b><br><small>' + htmlEsc(wahl.kmText) + '</small>';
    ov.querySelector('.nfp-ok').disabled = false;
  };
  const zentrieren = (p, z)=> setzeZoom(Math.max(zoom, z || 2.5), { x: p.x / NFP_KARTE.bild[0], y: p.y / NFP_KARTE.bild[1] });
  let gezogen = false;
  fl.addEventListener('click', (ev)=>{
    if(gezogen){ gezogen = false; return; }
    const r = img.getBoundingClientRect();
    waehlen({ x: (ev.clientX - r.left) / r.width * NFP_KARTE.bild[0], y: (ev.clientY - r.top) / r.height * NFP_KARTE.bild[1] }, 'Gewählt');
  });
  // Zwei-Finger-Zoom selbst umsetzen (statt Browser-Zoom, der auch die Punkte vergroessern wuerde)
  let pinch = null;
  const abst = (t)=> Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  sc.addEventListener('touchstart', (ev)=>{
    if(ev.touches.length === 2){
      const r = fl.getBoundingClientRect(), mx = (ev.touches[0].clientX + ev.touches[1].clientX) / 2, my = (ev.touches[0].clientY + ev.touches[1].clientY) / 2;
      pinch = { d: abst(ev.touches), z: zoom, fx: (mx - r.left) / r.width, fy: (my - r.top) / r.height, sx: mx - sc.getBoundingClientRect().left, sy: my - sc.getBoundingClientRect().top };
      ev.preventDefault();
    }
  }, { passive: false });
  sc.addEventListener('touchmove', (ev)=>{
    if(pinch && ev.touches.length === 2){
      ev.preventDefault(); gezogen = true;
      zoom = Math.max(1, Math.min(6, pinch.z * abst(ev.touches) / pinch.d)); fl.style.width = (zoom * 100) + '%';
      sc.scrollLeft = pinch.fx * fl.clientWidth - pinch.sx; sc.scrollTop = pinch.fy * fl.clientHeight - pinch.sy;
    }
  }, { passive: false });
  sc.addEventListener('touchend', (ev)=>{ if(ev.touches.length < 2) pinch = null; });
  sc.addEventListener('wheel', (ev)=>{ if(ev.ctrlKey){ ev.preventDefault(); setzeZoom(zoom * (ev.deltaY < 0 ? 1.15 : 1 / 1.15)); } }, { passive: false });
  ov.querySelectorAll('[data-zoom]').forEach(b=> b.onclick = ()=> setzeZoom(zoom + Number(b.dataset.zoom)));
  const suchen = async ()=>{
    await gkvPlzOrtErgaenzen(ov.querySelector('#nfpStrasse'), ov.querySelector('#nfpPlzOrt'), info);
    const a = gkvAdrZusammen(ov.querySelector('#nfpStrasse').value, ov.querySelector('#nfpPlzOrt').value);
    if(!a){ info.textContent = 'Bitte eine Adresse eintragen.'; return; }
    info.textContent = 'Adresse wird gesucht …';
    let g = null;
    try{ g = await gkvOrtSuchen(a); }catch(_){ info.textContent = 'Keine Verbindung zum Kartendienst – bitte auf die Einsatzstelle tippen.'; return; }
    if(!g){ info.textContent = 'Adresse nicht gefunden – bitte prüfen oder auf die Einsatzstelle tippen.'; return; }
    const p = nfpGeoZuPixel(g.lat, g.lon); punkt('nfp-adr', p);
    if(!nfpImBild(p)){
      const s = gkvStartGeo(), km = s ? kmLuftlinieEinfach(s, g) : null;
      wahl = km == null ? null : { stufe: gkvStufeFuerKm(km), text: 'außerhalb der Karte', woher: 'Adresse', geo: g, adresseText: a, kmText: 'Luftlinie ' + nfpKmText(km) + ' km ab ' + s.adr };
      info.innerHTML = 'Adresse liegt außerhalb der Karte' + (wahl ? ' → nach Luftlinie (' + htmlEsc(nfpKmText(km)) + ' km): <b>' + htmlEsc(nfpStufeLabel(wahl.stufe)) + '</b>' : '.');
      ov.querySelector('.nfp-ok').disabled = !wahl; return;
    }
    waehlen(p, 'Adresse' + (g.gefunden ? ' (' + g.gefunden + ')' : ''), g, a); zentrieren(p);
  };
  ov.querySelector('.nfp-such-knopf').onclick = suchen;
  ov.querySelector('#nfpPlzOrt').onkeydown = (ev)=>{ if(ev.key === 'Enter'){ ev.preventDefault(); suchen(); } };
  ov.querySelector('#nfpStrasse').onkeydown = (ev)=>{ if(ev.key === 'Enter'){ ev.preventDefault(); ov.querySelector('#nfpPlzOrt').focus(); } };
  ov.querySelector('#nfpPlzOrt').addEventListener('blur', ()=> gkvPlzOrtErgaenzen(ov.querySelector('#nfpStrasse'), ov.querySelector('#nfpPlzOrt'), null));
  const gps = ()=>{
    if(!navigator.geolocation){ info.textContent = 'Standort wird von diesem Gerät nicht unterstützt.'; return; }
    info.textContent = 'Standort wird ermittelt …';
    navigator.geolocation.getCurrentPosition((pos)=>{
      const g = { lat: pos.coords.latitude, lon: pos.coords.longitude }, p = nfpGeoZuPixel(g.lat, g.lon);
      punkt('nfp-gps', p);
      if(!nfpImBild(p)){ info.textContent = 'Der aktuelle Standort liegt außerhalb der Karte.'; return; }
      waehlen(p, 'Standort', g); zentrieren(p);
    }, (e)=>{ info.textContent = e && e.code === 1 ? 'Standort nicht freigegeben – Adresse suchen oder auf die Einsatzstelle tippen.' : 'Standort nicht verfügbar – Adresse suchen oder auf die Einsatzstelle tippen.'; },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
  };
  ov.querySelector('.nfp-gps-knopf').onclick = gps;
  await new Promise(r=> img.complete ? r() : (img.onload = img.onerror = r));
  if(opt.adresse && opt.adresse.lat){
    const p = nfpGeoZuPixel(opt.adresse.lat, opt.adresse.lon); punkt('nfp-adr', p);
    if(nfpImBild(p)){ waehlen(p, 'Adresse', opt.adresse, opt.adresseText || ''); zentrieren(p); }
  } else if(opt.adresseText) suchen();
  else if(opt.gps) gps();
  return await new Promise((fertig)=>{
    const zu = (erg)=>{ ov.remove(); document.body.classList.remove('nfp-offen'); fertig(erg); };
    ov.querySelector('.nfp-zu').onclick = ()=> zu(null);
    ov.querySelector('.nfp-ok').onclick = ()=> zu(wahl);
  });
}

// Rechnungen an die vertretenen Aerzte (je Quartal, aus dem Fahrtenbuch)
// =====================================================================
// Vorlage: "KVBW Onedrive/fertige Rechnungen Vertretungsärzte/Vorlage_Ärzte.docx"
// Platzhalter: VNAME, PADRESSE1/2 (Empfaenger), ATITEL ANAME AFUNKTION
// AADRESSE1/2 AEMAIL (eigene Arztdaten), DATE, RENU, X.QUART, DIENSTDAT
// (Tabellenzeilen der Dienste), GELDSUMME, Fusszeile BANAME/BABIC/BAIBAN/ENAME.
// Rechnungsnummer: Kuerzel des Arztes + fortlaufende Nummer aus dem Ordner
// (z.B. "AH-004"). Word + PDF landen im selben Ordner.
// Adresse/Kuerzel je Arzt und die erstellten Rechnungen (zum spaeteren
// Bearbeiten) liegen in eigene_positionen.json -- die HTA am PC nutzt sie mit.
const AERZTE_ORDNER = 'KVBW Onedrive/fertige Rechnungen Vertretungsärzte';
const AERZTE_VORLAGE = AERZTE_ORDNER + '/Vorlage_Ärzte.docx';

function aerzteDaten(){ return LS.get(EIGENE_POS_CACHE, null) || {}; }
function aerzteAdresse(arzt){
  const k = String(arzt || '').trim().toLowerCase();
  return (aerzteDaten().aerzteAdressen || []).find(x=> String(x.arzt || '').trim().toLowerCase() === k) || null;
}
function aerzteRechnungFinden(arzt, quartal){
  const k = String(arzt || '').trim().toLowerCase();
  return (aerzteDaten().aerzteRechnungen || []).filter(x=> !x.geloescht && String(x.arzt || '').trim().toLowerCase() === k && x.quartal === quartal)
    .sort((a, b)=> String(b.am || '').localeCompare(String(a.am || '')))[0] || null;
}
async function aerzteDatenSichern(anwenden){
  const d = betaEigeneDatenVoll(); anwenden(d); LS.set(EIGENE_POS_CACHE, d);
  if(typeof msGraphStatus !== 'undefined' && msGraphStatus === 'angemeldet') await betaEigeneAbgleichen(anwenden);
}
function aerzteKuerzel(name){
  const w = String(name || '').replace(/\b(Dr|med|Prof|Priv|Doz|dent)\.?/gi, ' ').split(/[\s,]+/).filter(x=> /^[A-Za-zÄÖÜäöüß]/.test(x));
  if(!w.length) return 'XX';
  return ((w[0][0] || '') + (w.length > 1 ? w[w.length - 1][0] : (w[0][1] || ''))).toUpperCase();
}
function aerzteQuartalText(quartalKey){
  const m = /Quartal\s*(\d)\s*\/\s*(\d{4})/.exec(String(quartalKey || ''));
  return m ? m[1] + '. Quartals ' + m[2] : String(quartalKey || '');
}
function aerzteDienstText(b){
  const d = fbDatumAusText(b.datumText);
  const tag = '';
  const z = fbZeitParsen(b.zeitRoh);
  return tag + b.datumText + (z ? ', ' + fbZeitText(z).replace('-', '–') + ' Uhr' : (b.zeitLabel ? ', ' + b.zeitLabel : ''));
}
function aerzteBetragVorschlag(b){ return betaRund2((Number(b.gkv) || 0) * (1 - FAHRDIENST_GEBUEHR_SATZ)); }
function aerzteZahl(t){ const n = Number(String(t == null ? '' : t).trim().replace(/\./g, '').replace(',', '.')); return isFinite(n) ? n : NaN; }
function aerzteZahlText(v){ return (Math.round(Number(v) * 100) / 100).toFixed(2).replace('.', ','); }

// Dateiname = Rechnungsnummer umgedreht ("AH-002" -> "002-AH"), damit der
// Ordner nach Nummer sortiert
function aerzteDateiName(renu){
  const m = /^([A-Za-zÄÖÜäöü]+)-(\d+)$/.exec(String(renu || '').trim());
  return m ? m[2] + '-' + m[1].toUpperCase() : String(renu || '').replace(/[\\/:*?"<>|]+/g, ' ').trim();
}
// naechste freie Nummer zum Kuerzel aus den Dateinamen im Ordner
// (neu "002-AH", bisher "AH-002") und den gespeicherten Rechnungen
async function aerzteNaechsteRenu(token, kuerzel){
  const dateien = await ordnerDateien(token, AERZTE_ORDNER);
  const k = kuerzel.replace(/[^A-Za-zÄÖÜäöü]/g, '');
  const reA = new RegExp('(^|[^A-Za-z])' + k + '-(\\d+)', 'i'), reB = new RegExp('(^|[^0-9])(\\d+)-' + k + '(?![A-Za-z])', 'i');
  let max = 0, breite = 3;
  const pruefen = (name)=>{ [reA, reB].forEach(re=>{ const m = re.exec(name); if(m){ max = Math.max(max, +m[2]); breite = Math.max(breite, m[2].length); } }); };
  dateien.forEach(it=> pruefen(it.name));
  (aerzteDaten().aerzteRechnungen || []).forEach(x=> pruefen(x.renu || ''));
  return kuerzel.toUpperCase() + '-' + String(max + 1).padStart(breite, '0');
}
function aerzteAbweichungText(ist, soll){
  const d = betaRund2(ist - soll);
  if(Math.abs(d) < 0.005) return 'keine Abweichung';
  return 'Abweichung ' + (d > 0 ? '+' : '−') + aerzteZahlText(Math.abs(d)) + ' €' + (soll ? ' (' + (d > 0 ? '+' : '−') + String(Math.round(Math.abs(d / soll) * 1000) / 10).replace('.', ',') + ' %)' : '');
}

// ---------- Word-Datei aus der Vorlage ----------
async function aerzteDocxErzeugen(vorlage, daten){
  const zip = await JSZip.loadAsync(vorlage);
  const a = daten.arzt || {};
  const ph = [['Privatrechnung', 'Rechnung'], ['X.QUART', daten.quartalText], ['VNAME', daten.vname], ['PADRESSE1', daten.adr1 || ''],
    ['PADRESSE2', daten.adr2 || ''], ['DATE', daten.datum], ['RENU', daten.renu], ['GELDSUMME', aerzteZahlText(daten.summe)],
    ['ATITEL', a.titel || ''], ['ANAME', a.name || ''], ['AFUNKTION', a.funktion || ''], ['AADRESSE1', a.adresse1 || ''],
    ['AADRESSE2', a.adresse2 || ''], ['AEMAIL', a.email || '']];
  const fuss = [['BANAME', a.bank || ''], ['BABIC', a.bic || ''], ['BAIBAN', a.iban || ''], ['ENAME', a.kontoinhaber || '']];
  let doc = await zip.file('word/document.xml').async('string');
  // Tabelle der Dienste: Zeile mit DIENSTDAT (+ leere Zeilen bis "SUMME") je Dienst
  const tStart = doc.lastIndexOf('<w:tbl>', doc.indexOf('DIENSTDAT'));
  const tEnde = doc.indexOf('</w:tbl>', doc.indexOf('DIENSTDAT')) + 8;
  if(tStart < 0 || tEnde < 8) throw new Error('In der Vorlage wurde die Zeile „DIENSTDAT“ nicht gefunden.');
  let tab = doc.slice(tStart, tEnde);
  const zeilen = tab.match(/<w:tr[ >][\s\S]*?<\/w:tr>/g) || [];
  const iD = zeilen.findIndex(z=> rdAbsatzText(z).indexOf('DIENSTDAT') >= 0);
  const iS = zeilen.findIndex(z=> /SUMME/.test(rdAbsatzText(z)));
  const muster = zeilen[iD];
  const zelleFuellen = (zeile, text, betrag)=>{
    const zellen = zeile.match(/<w:tc>[\s\S]*?<\/w:tc>/g) || [];
    let z = zeile;
    if(zellen[0]) z = z.replace(zellen[0], zellen[0].replace(/<w:p(?:\s[^>]*?)?>[\s\S]*?<\/w:p>|<w:p(?:\s[^>]*?)?\/>/, (p)=> rdPlatzhalterInXml(p.indexOf('DIENSTDAT') >= 0 ? p : p, [['DIENSTDAT', text]])));
    if(zellen[1] && betrag != null){
      const neuP = (p)=>{
        const kopf = p.match(/^<w:p(?:\s[^>]*?)?>/)[0];
        let pPr = (p.match(/<w:pPr>[\s\S]*?<\/w:pPr>/) || ['<w:pPr></w:pPr>'])[0];
        if(pPr.indexOf('<w:jc ') < 0) pPr = pPr.replace(/<w:rPr>|<\/w:pPr>/, (m)=> '<w:jc w:val="right"/>' + m);
        return kopf + pPr + '<w:r><w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:cs="Arial"/><w:b w:val="0"/></w:rPr><w:t xml:space="preserve">' + rdXml(aerzteZahlText(betrag) + ' €') + '</w:t></w:r></w:p>';
      };
      z = z.replace(zellen[1], zellen[1].replace(/<w:p(?:\s[^>]*?)?\/>|<w:p(?:\s[^>]*?)?>[\s\S]*?<\/w:p>/, (p)=> neuP(p.replace(/\/>$/, '></w:p>'))));
    }
    return z;
  };
  const neueZeilen = daten.dienste.map(d=> zelleFuellen(muster, d.text, null));
  const vorher = zeilen.slice(0, iD), nachher = zeilen.slice(iS);
  const tabKopf = tab.slice(0, tab.indexOf(zeilen[0]));
  const tabFuss = tab.slice(tab.lastIndexOf(zeilen[zeilen.length - 1]) + zeilen[zeilen.length - 1].length);
  tab = tabKopf + vorher.join('') + neueZeilen.join('') + nachher.join('') + tabFuss;
  // Spalte "Dienste" etwas breiter (Datum + Uhrzeit in einer Zeile), Betrag schmaler
  const sp = (tab.match(/<w:gridCol w:w="(\d+)"\/>/g) || []).map(g=> +g.match(/\d+/)[0]);
  if(sp.length === 2 && sp[1] > 1700){
    const plus = Math.min(600, sp[1] - 1500), a = sp[0], b = sp[1];
    tab = tab.split('<w:gridCol w:w="' + a + '"/>').join('<w:gridCol w:w="' + (a + plus) + '"/>').split('<w:gridCol w:w="' + b + '"/>').join('<w:gridCol w:w="' + (b - plus) + '"/>')
             .split('<w:tcW w:w="' + a + '" w:type="dxa"/>').join('<w:tcW w:w="' + (a + plus) + '" w:type="dxa"/>')
             .split('<w:tcW w:w="' + b + '" w:type="dxa"/>').join('<w:tcW w:w="' + (b - plus) + '" w:type="dxa"/>');
  }
  doc = doc.slice(0, tStart) + tab + doc.slice(tEnde);
  doc = rdPlatzhalterInXml(doc, ph);
  zip.file('word/document.xml', doc);
  for(const name of Object.keys(zip.files)){
    if(/^word\/(footer|header)\d+\.xml$/.test(name)){
      const x = await zip.file(name).async('string');
      const y = rdPlatzhalterInXml(x, fuss.concat(ph));
      if(y !== x) zip.file(name, y);
    }
  }
  if(zip.file('docProps/core.xml')){
    let core = await zip.file('docProps/core.xml').async('string');
    ph.forEach(([k, v])=>{ core = core.split(k).join(rdXml(String(v).replace(/[\r\n\u000b]+/g, ' '))); });
    zip.file('docProps/core.xml', core);
  }
  return zip.generateAsync({ type: 'blob', compression: 'DEFLATE', mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
}

  let st = {
    vname: (alt && alt.vname) || adr.vname || arzt, adr1: (alt && alt.adr1) || adr.adr1 || '', adr2: (alt && alt.adr2) || adr.adr2 || '',
    kuerzel: adr.kuerzel || (alt && /^([A-ZÄÖÜ]+)-/.test(alt.renu || '') ? alt.renu.split('-')[0] : aerzteKuerzel(arzt)), renu: (alt && alt.renu) || '',
    datum: (alt && alt.datum) || (zz2(heute.getDate()) + '.' + zz2(heute.getMonth() + 1) + '.' + heute.getFullYear()),
    dienste: bloecke.map(b=> ({ text: aerzteDienstText(b) })),

      (fehler ? '<div class="fb-fehler">' + htmlEsc(fehler) + '</div>' : '') +
      '<label class="fb-lbl">Empfänger (Name)<input type="text" id="arVname" value="' + htmlEsc(st.vname) + '"></label>' +
      '<label class="fb-lbl">Straße<input type="text" id="arAdr1" value="' + htmlEsc(st.adr1) + '"></label>' +
      '<label class="fb-lbl">PLZ Ort<input type="text" id="arAdr2" value="' + htmlEsc(st.adr2) + '"></label>' +
      '<div class="fb-zeile"><label>Kürzel<input type="text" id="arKuerzel" value="' + htmlEsc(st.kuerzel) + '"></label>' +
      '<label>Rechnungsnr.<input type="text" id="arRenu" placeholder="automatisch" value="' + htmlEsc(st.renu) + '"></label>' +
      '<label>Datum<input type="text" id="arDatum" value="' + htmlEsc(st.datum) + '"></label></div>' +
      '<div class="fb-lbl">Dienste</div><ul class="ar-liste">' + st.dienste.map(d=> '<li>' + htmlEsc(d.text) + '</li>').join('') + '</ul>' +
      '<div class="ar-dienst"><span>Auszahlung der KVBW gesamt<small>berechnet ' + aerzteZahlText(st.berechnet) + ' € (GKV inkl. Grundpauschale abzgl. KV-Gebühr)</small></span>' +
        '<input type="text" inputmode="decimal" id="arSummeEin" value="' + aerzteZahlText(st.summe) + '"> €</div>' +
      '<div class="ar-summe"><small id="arAbw">' + htmlEsc(aerzteAbweichungText(st.summe, st.berechnet)) + '</small></div></div>';
    const p = betaOverlay.ergebnis('Rechnung an ' + arzt, html, [{ label: 'Abbrechen', akt: 'nein' }, { label: alt ? 'Neu erstellen' : 'Rechnung erstellen', akt: 'ok', primaer: true }]);
    const ein = document.getElementById('arSummeEin');
    if(ein) ein.oninput = ()=>{ const n = aerzteZahl(ein.value); const a = document.getElementById('arAbw'); if(a) a.textContent = isNaN(n) ? '' : aerzteAbweichungText(n, st.berechnet); };
    const akt = await p;
    const wert = (id)=> String((document.getElementById(id) || {}).value || '').trim();
    st.vname = wert('arVname'); st.adr1 = wert('arAdr1'); st.adr2 = wert('arAdr2');
    st.kuerzel = wert('arKuerzel').toUpperCase(); st.renu = wert('arRenu'); st.datum = wert('arDatum');
    const n = aerzteZahl(wert('arSummeEin'));
    if(akt !== 'ok'){ betaOverlay.schliessen(); return null; }

    if(!/^[A-ZÄÖÜ]{1,4}$/.test(st.kuerzel)){ fehler = 'Kürzel bitte aus 1–4 Buchstaben (z.B. AH).'; continue; }
    if(!/^\d{1,2}\.\d{1,2}\.\d{4}$/.test(st.datum)){ fehler = 'Datum bitte als TT.MM.JJJJ.'; continue; }
    if(isNaN(n)){ fehler = 'Bitte den Gesamtbetrag als Zahl eintragen (z.B. 1.412,50).'; continue; }
    st.summe = betaRund2(n);
    st.alt = alt;
    return st;
  }
}

// ---------- einmalig: bisherige Rechnungen im Ordner uebernehmen ----------

async function aerzteAltUebernehmen(token, aerzteNamen){
  try{ await betaEigeneAbgleichen(); }catch(e){}
  const d0 = aerzteDaten();
  if(d0.aerzteMigration === 'v1') return false;

    if(!m) return;
    const renu = m[1].toUpperCase() + '-' + m[2];
    const g = gruppen.get(renu) || {}; g[m[3].toLowerCase()] = it; gruppen.set(renu, g);
  });
  // auch eigene Rechnungen aus der ersten Fassung ("AH-003 Anette Holm Q3-2026")
  const neueRechnungen = [], neueAdressen = [];

  const vorhanden = new Map((d0.aerzteRechnungen || []).map(x=> [x.renu, x]));
  const arztZu = (kuerzel, vname)=>{

    const nachname = (n)=> String(n).trim().split(/\s+/).pop().toLowerCase();
    const p2 = aerzteNamen.filter(n=> String(vname || '').toLowerCase().indexOf(nachname(n)) >= 0);
    if(p2.length === 1) return p2[0];
    return String(vname || kuerzel).replace(/\b(Dr|med|Prof|Priv|Doz)\.?\s*/gi, '').trim();
  };
  for(const [renu, g] of gruppen){
    const neuBasis = aerzteDateiName(renu);
    let info = {};
    if(g.docx){
      try{
        const r = await fetch('https://graph.microsoft.com/v1.0/me/drive/items/' + g.docx.id + '/content', { headers: { Authorization: 'Bearer ' + token } });
        if(r.ok) info = await aerzteAltLesen(await r.arrayBuffer());
      }catch(e){}
    }
    for(const end of ['docx', 'pdf']){
      const it = g[end]; if(!it) continue;
      const ziel = neuBasis + '.' + end;
      if(dateien.has(ziel.toLowerCase())) continue;
      try{ await gx(token, 'PATCH', 'https://graph.microsoft.com/v1.0/me/drive/items/' + it.id, { name: ziel }); }catch(e){}
    }
    const kuerzel = renu.split('-')[0];
    const arzt = arztZu(kuerzel, info.vname);
    const am = (g.docx || g.pdf).lastModifiedDateTime || new Date().toISOString();
    const alt = vorhanden.get(renu);
    if(alt) neueRechnungen.push(Object.assign({}, alt, { datei: neuBasis, am: new Date().toISOString() }));
    else neueRechnungen.push({ renu, arzt, quartal: info.quartal || '', datum: info.datum || '', vname: info.vname || '', adr1: info.adr1 || '', adr2: info.adr2 || '',
      dienste: [], summe: info.summe != null ? info.summe : null, datei: neuBasis, importiert: true, am });
    if(info.vname) neueAdressen.push({ arzt, vname: info.vname, adr1: info.adr1 || '', adr2: info.adr2 || '', kuerzel, am });
    if(info.bank && (!bankNeu || String(am) > String(bankNeu.am))) bankNeu = Object.assign({ am }, info.bank);
  }
  await aerzteDatenSichern((d)=>{
    const r = (d.aerzteRechnungen || []).filter(x=> !neueRechnungen.some(n=> n.renu === x.renu));
    d.aerzteRechnungen = r.concat(neueRechnungen);
    // Adresse: je Arzt die juengste; vorhandene (in der App gepflegte) haben Vorrang
    const adr = d.aerzteAdressen || [];
    neueAdressen.sort((a, b)=> String(a.am).localeCompare(String(b.am))).forEach(n=>{
      const k = n.arzt.trim().toLowerCase(), i = adr.findIndex(x=> String(x.arzt || '').trim().toLowerCase() === k);
      if(i < 0) adr.push(n); else if(adr[i].importiert && String(n.am) > String(adr[i].am)) adr[i] = Object.assign(n, { importiert: true });
      if(i < 0) adr[adr.length - 1].importiert = true;
    });
    d.aerzteAdressen = adr;
    d.aerzteMigration = 'v1';
  });
  // Konto fuer Arztrechnungen einmalig aus der juengsten bisherigen Rechnung
  // vorbelegen (Einstellungen > Arztinfos), wenn dort noch nichts steht
  if(bankNeu){
    try{
      const ini = await iniHerunterladen(token);
      const w = ini.werte || {};
      if(!['AERZTE_KONTOINHABER', 'AERZTE_BANKNAME', 'AERZTE_IBAN', 'AERZTE_BIC'].some(k=> String(w[k] || '').trim())){
        await iniAenderungenSchreiben({ AERZTE_KONTOINHABER: bankNeu.kontoinhaber || '', AERZTE_BANKNAME: bankNeu.bank || '',
          AERZTE_IBAN: bankNeu.iban || '', AERZTE_BIC: bankNeu.bic || '' }, w);
        try{ iniCacheSpeichern(Object.assign({}, w, { AERZTE_KONTOINHABER: bankNeu.kontoinhaber || '', AERZTE_BANKNAME: bankNeu.bank || '', AERZTE_IBAN: bankNeu.iban || '', AERZTE_BIC: bankNeu.bic || '' })); }catch(e){}
      }
    }catch(e){}
  }
  return true;
}
// Empfaenger, Datum, Quartal und Summe aus einer bisherigen Rechnung
async function aerzteAltLesen(buf){
  const zip = await JSZip.loadAsync(buf);
  const doc = await zip.file('word/document.xml').async('string');
  const ergebnis = {};
  const tab = (doc.match(/<w:tbl>[\s\S]*?<\/w:tbl>/) || [''])[0];
  const zelle = (tab.match(/<w:tc>[\s\S]*?<\/w:tc>/) || [''])[0];
  const zeilen = (zelle.match(RD_ABSATZ_RE) || []).map(p=> rdAbsatzText(p).trim()).filter(Boolean)
    .filter(z=> !/^(privat)?rechnung$/i.test(z));
  if(zeilen.length){ ergebnis.vname = zeilen[0]; ergebnis.adr1 = zeilen[1] || ''; ergebnis.adr2 = zeilen[2] || ''; }
  const text = (doc.match(RD_ABSATZ_RE) || []).map(p=> rdAbsatzText(p)).join('\n');
  const dm = /Datum:\s*(\d{1,2}\.\d{1,2}\.\d{2,4})/.exec(text); if(dm) ergebnis.datum = dm[1];
  const qm = /(\d)\.\s*Quartal\w*\s*(\d{4})/i.exec(text);
  if(qm) ergebnis.quartal = 'Quartal ' + qm[1] + ' / ' + qm[2];
  else { const dd = /(\d{1,2})\.(\d{1,2})\.(\d{4})/.exec(text.slice(text.indexOf('Dienste'))); if(dd) ergebnis.quartal = 'Quartal ' + (Math.floor((+dd[2] - 1) / 3) + 1) + ' / ' + dd[3]; }
  const sm = /SUMME:?\s*\n?\s*([\d.]+,\d{2})/i.exec(text); if(sm) ergebnis.summe = aerzteZahl(sm[1]);
  // Bankverbindung aus der Fusszeile (Bankname/BIC/IBAN/Empfaenger)
  for(const name of Object.keys(zip.files)){
    if(!/^word\/footer\d+\.xml$/.test(name)) continue;
    const absaetze = ((await zip.file(name).async('string')).match(RD_ABSATZ_RE) || []).map(p=> rdAbsatzText(p).trim()).filter(Boolean);
    const alles = absaetze.join('\n');
    const iban = /\b([A-Z]{2}\d{2}(?:\s?[A-Z0-9]{4}){3,7}(?:\s?[A-Z0-9]{1,3})?)\b/.exec(alles);
    if(!iban) continue;
    const bank = { iban: iban[1].replace(/\s+/g, ' ').trim() };
    const bic = absaetze.map(z=> z.replace(/^BIC:\s*/i, '')).find(z=> /^[A-Z]{6}[A-Z0-9]{2}(?:[A-Z0-9]{3})?$/.test(z.replace(/\s/g, '')) && z.indexOf(bank.iban) < 0);
    if(bic) bank.bic = bic.replace(/\s/g, '');
    const em = /Empf(?:ä|ae)nger:\s*(.+)/i.exec(alles); if(em && !/ENAME/.test(em[1])) bank.kontoinhaber = em[1].trim();
    const labels = /^(Bankname|BIC|IBAN|Empf(?:ä|ae)nger):?/i;
    const bn = absaetze.map(z=> z.replace(/^Bankname:\s*/i, '')).find(z=> z && !labels.test(z) && z.indexOf(bank.iban) < 0 && z !== bank.bic && z !== bank.kontoinhaber && !/^[A-Z]{6}[A-Z0-9]{2}/.test(z));
    if(bn) bank.bank = bn;
    ergebnis.bank = bank;
    break;
  }
  return ergebnis;
}

    const bl = bloecke.filter(b=> b.quartalKey === q.quartal && b.arzt === a.arzt);

// =====================================================================
// Geraeteuebergreifender Stand der lokalen Faelle (LS, PT, GKV)
// ---------------------------------------------------------------------
// Bisher: jede Aenderung wurde als Sicherung nach OneDrive geschrieben und
// beim Start nur ADDITIV eingelesen -- Aenderungen an einem Fall kamen auf
// dem anderen Geraet als Doppel an, geloeschte/erledigte Faelle kamen zurueck.
// Jetzt: jeder Fall traegt intern einen Aenderungszeitpunkt, Loeschungen
// werden als "geloescht am" vermerkt. Abgleich in beide Richtungen ueber
// dieselbe Datei (KVBW Onedrive/rechnungserfassung_app_sicherung.json):
// neuester Stand je Fall gewinnt, Loeschungen gelten auch auf dem anderen
// Geraet. Abgleich beim Start, beim Zurueckwechseln in die App/den Tab,
// jede Minute im Vordergrund und nach jeder Aenderung (erst lesen und
// zusammenfuehren, dann schreiben -- mit ETag, damit sich zwei Geraete nicht
// gegenseitig ueberschreiben).
// =====================================================================
const SYNC_META = 'faelle_meta';          // { 'ls|<zeitstempel>': {h, t} }
const SYNC_GELOESCHT = 'faelle_geloescht'; // { 'ls|<zeitstempel>': ms }
const SYNC_ARTEN = ['ls', 'pt', 'gkv'];
function syncListeLaden(art){ return art === 'gkv' ? LS.get('gkv_faelle', []) : LS.get('faelle_' + art, []); }
function syncListeSetzen(art, arr){ if(art === 'gkv') LS.set('gkv_faelle', arr); else LS.set('faelle_' + art, arr); }
function syncId(art, f){ return art + '|' + (art === 'gkv' ? f.id : f.zeitstempel); }
function syncHash(f){
  const s = JSON.stringify(f); let h = 0;
  for(let i = 0; i < s.length; i++){ h = ((h << 5) - h + s.charCodeAt(i)) | 0; }
  return h + ':' + s.length;
}
// Vor jedem lokalen Speichern: geaenderte Faelle bekommen "jetzt", entfernte einen Loeschvermerk
function faelleMetaNachfuehren(art, alt, neu){
  try{
    const meta = LS.get(SYNC_META, {}), weg = LS.get(SYNC_GELOESCHT, {}), jetzt = Date.now();
    const neuIds = new Set();
    (neu || []).forEach(f=>{
      if(!f) return;
      const id = syncId(art, f), h = syncHash(f); neuIds.add(id);
      if(!meta[id] || meta[id].h !== h) meta[id] = { h, t: jetzt };
      if(weg[id]) delete weg[id];
    });
    (alt || []).forEach(f=>{
      if(!f) return;
      const id = syncId(art, f);
      if(!neuIds.has(id)){ weg[id] = jetzt; delete meta[id]; }
    });
    LS.set(SYNC_META, meta); LS.set(SYNC_GELOESCHT, weg);
  }catch(_){}
}
// Faelle ohne Zeitpunkt (Bestand von vor diesem Update) gelten als "alt"
function syncMetaFuer(art, f, meta){
  const id = syncId(art, f), h = syncHash(f);
  if(!meta[id]) meta[id] = { h, t: 1 };
  else if(meta[id].h !== h) meta[id] = { h, t: Date.now() };   // ausserhalb von speichereFaelle geaendert
  return meta[id];
}
// Lokal + entfernt zusammenfuehren -> {geaendert, daten (fuer die Datei)}
function syncZusammenfuehren(entfernt){
  const meta = LS.get(SYNC_META, {}), weg = LS.get(SYNC_GELOESCHT, {});
  const rWeg = (entfernt && entfernt.geloescht) || {};
  Object.keys(rWeg).forEach(id=>{ if(!weg[id] || rWeg[id] > weg[id]) weg[id] = rWeg[id]; });
  const grenze = Date.now() - 120 * 86400000;
  Object.keys(weg).forEach(id=>{ if(weg[id] < grenze) delete weg[id]; });
  let geaendert = false;
  const raus = { version: 2, am: new Date().toISOString(), faelle: [], gkv: [], geloescht: weg };
  SYNC_ARTEN.forEach(art=>{
    const lokal = syncListeLaden(art), m = new Map(); let gA = false;
    lokal.forEach(f=>{ if(f){ const mm = syncMetaFuer(art, f, meta); m.set(syncId(art, f), { f, t: mm.t, lokal: true }); } });
    const rListe = art === 'gkv' ? ((entfernt && entfernt.gkv) || []) : ((entfernt && entfernt.faelle) || []).filter(x=> x && x.art === art);
    rListe.forEach(x=>{
      if(!x) return;
      const { art: _a, _t, ...f } = x;
      if(art !== 'gkv' && !f.werte) return;
      if(art === 'gkv' && !f.id) return;
      const id = syncId(art, f), t = Number(_t) || 0, da = m.get(id);
      if(!da || t > da.t) m.set(id, { f, t, lokal: false, ersetzt: !!da });
    });
    const neu = [];
    m.forEach((e, id)=>{
      if(weg[id] && weg[id] >= e.t){ if(e.lokal || e.ersetzt) gA = true; delete meta[id]; return; }
      if(!e.lokal){ gA = true; meta[id] = { h: syncHash(e.f), t: e.t }; }
      neu.push(e.f);
      if(art === 'gkv') raus.gkv.push({ ...e.f, _t: e.t });
      else raus.faelle.push({ ...e.f, art, _t: e.t });
    });
    // Reihenfolge wie bisher: nach Anlage
    neu.sort((a, b)=> art === 'gkv' ? String(a.id).localeCompare(String(b.id)) : String(a.zeitstempel).localeCompare(String(b.zeitstempel)));
    if(gA){ geaendert = true; syncListeSetzen(art, neu); }
  });
  LS.set(SYNC_META, meta); LS.set(SYNC_GELOESCHT, weg);
  return { geaendert, daten: raus };
}

let syncLaeuft = null, syncNochmal = false, syncTimer = null, syncZuletzt = 0;
async function syncDateiLesen(token){
  const url = msGraphPfadUrl(MSGRAPH_PFAD_SYNC_JSON);
  const m = await fetch(url + '?$select=eTag,size', { headers: { Authorization: 'Bearer ' + token }, cache: 'no-store' });
  if(m.status === 404) return { etag: null, daten: null };
  if(!m.ok) throw new Error('OneDrive ' + m.status);
  const etag = (await m.json()).eTag;
  const c = await fetch(url + '/content', { headers: { Authorization: 'Bearer ' + token }, cache: 'no-store' });
  if(!c.ok) throw new Error('OneDrive ' + c.status);
  let daten = null; try{ daten = JSON.parse(await c.text()); }catch(_){}
  return { etag, daten };
}
// Ein Abgleich: lesen, zusammenfuehren, (nur wenn noetig) schreiben
async function faelleAbgleichen(schreiben){
  if(typeof msGraphStatus === 'undefined' || msGraphStatus !== 'angemeldet') return false;
  if(syncLaeuft){ if(schreiben) syncNochmal = true; return syncLaeuft; }
  syncLaeuft = (async ()=>{
    let geaendertGesamt = false;
    try{
      const token = await msGraphTokenHolen(); if(!token) return false;
      if(schreiben && typeof rechnungsnummernVorSyncVergeben === 'function'){ try{ await rechnungsnummernVorSyncVergeben(); }catch(_){} }
      for(let versuch = 0; versuch < 3; versuch++){
        const { etag, daten } = await syncDateiLesen(token);
        // Bestatter aus der Datei (wie bisher additiv)
        if(daten && Array.isArray(daten.bestatterAenderungen)) daten.bestatterAenderungen.forEach(b=>{ if(b && b.name) try{ bestatterEintragen(b.name, b.adr1, b.adr2); }catch(_){} });
        const { geaendert, daten: raus } = syncZusammenfuehren(daten);
        if(geaendert) geaendertGesamt = true;
        raus.bestatterAenderungen = ladeKatalog().filter(b=> b.herkunft === 'handy');
        const vorher = daten ? JSON.stringify({ f: daten.faelle, g: daten.gkv, w: daten.geloescht }) : '';
        const nachher = JSON.stringify({ f: raus.faelle, g: raus.gkv, w: raus.geloescht });
        if(vorher === nachher && !(schreiben && !daten)) break;   // Datei ist schon aktuell
        const kopf = { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' };
        if(etag) kopf['If-Match'] = etag; else kopf['If-None-Match'] = '*';
        const r = await fetch(msGraphPfadUrl(MSGRAPH_PFAD_SYNC_JSON) + '/content', { method: 'PUT', headers: kopf, body: JSON.stringify(raus, null, 1) });
        if(r.status === 412 || r.status === 409) continue;   // anderes Geraet war schneller -> neu lesen
        break;
      }
      syncZuletzt = Date.now();
    }catch(_){ /* still -- naechster Versuch beim naechsten Anlass */ }
    finally{
      syncLaeuft = null;
      if(syncNochmal){ syncNochmal = false; setTimeout(()=> faelleAbgleichen(true), 50); }
    }
    if(geaendertGesamt) syncAnsichtAuffrischen();
    return geaendertGesamt;
  })();
  return syncLaeuft;
}
function syncAnsichtAuffrischen(){
  try{
    if(typeof appToastAnzeigen === 'function') appToastAnzeigen('Fälle von einem anderen Gerät übernommen.', 2600);
    if(typeof einstellungenOffen !== 'undefined' && einstellungenOffen) return;
    if(typeof aktuelleAnsichtIstHauptbildschirm !== 'undefined' && aktuelleAnsichtIstHauptbildschirm) ansichtStart();
  }catch(_){}
}

// KORREKTUR (Rueckmeldung: ueber OneDrive/Ordner synchronisierte Faelle
// bekamen NIE automatisch eine Rechnungsnummer -- die automatische Vergabe
// (rechnungsnummernVergeben, siehe oben) war ausschliesslich an den Button
// "In Zwischenablage kopieren" angehaengt, dem inzwischen unzuverlaessigsten
// und kaum noch genutzten Weg. Der eigentliche Hauptweg (Graph-/Ordner-Sync,
// exportDatenBauen) rief sie nie auf -- jeder so synchronisierte Fall blieb
// deshalb ausnahmslos ohne Rechnungsnummer und damit ohne automatische
// Rechnungserstellung an der HTA, unabhaengig vom "Rechnungsnummern-Zaehler"
// in den Einstellungen). Jetzt wird derselbe Zaehler-basierte Mechanismus
// VOR jedem Export angewendet, damit auch synchronisierte Faelle automatisch
// eine Nummer bekommen, sofern der Zaehler einmalig hinterlegt wurde -- exakt
// wie beim Copy-Paste-Weg, nur zusaetzlich auch hier.
async function rechnungsnummernVorSyncVergeben(){
  // BETA: Nummern vergibt erst das Hochladen (aus der Rechnungsuebersicht)
  return;
  let zaehler = await naechsterRenuZaehlerErmitteln();
  if(!zaehler) return; // weder live noch manuell ein Zaehler-Stand verfuegbar -- wie bisher ohne Nummer belassen
  const geaendert = {ls:false, pt:false};
  ['ls','pt'].forEach(art=>{
    const faelle = ladeFaelle(art);
    faelle.forEach(f=>{
      if(f.rechnungsnummer) return; // bereits vergeben, nicht erneut vergeben
      const {nachname, vorname} = nameAufteilen(f.werte.txtName);
      const datumNorm = normalisiereDatum(f.werte.txtDatumExcel);
      const nummer = rechnungsnummerBerechnen(nachname, vorname, datumNorm, zaehler);
      if(!nummer) return;
      f.rechnungsnummer = nummer;
      geaendert[art] = true;
      zaehler++;
    });
    if(geaendert[art]) speichereFaelle(art, faelle);
  });
  const eNeu = ladeEinstellungen();
  if(zaehler !== eNeu.rnNaechsterZaehler){
    eNeu.rnNaechsterZaehler = zaehler;
    speichereEinstellungen(eNeu);
  }
}

// rechnungsnummernVorSyncVergeben oben; ermittelt den Zaehler dafuer nach
