// ---------- Graph-Aufruf mit verwertbarer Fehlermeldung ----------
// Zeitlimit je Anfrage: ohne Limit konnte eine haengende Verbindung (Handy
// wechselt Netz, Excel bei Microsoft "wacht auf") die App endlos warten lassen.
const GX_ZEITLIMIT_MS = 45000;
async function gx(token, methode, url, koerper, sid, zeitlimitMs){
  const h = { Authorization:'Bearer ' + token };
  if(koerper !== undefined) h['Content-Type'] = 'application/json';
  if(sid) h['workbook-session-id'] = sid;
  let r;
  const ac = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  const limit = zeitlimitMs || GX_ZEITLIMIT_MS;
  const uhr = ac ? setTimeout(()=> ac.abort(), limit) : null;
  try{
    r = await fetch(url, { method: methode, headers: h, cache:'no-store', signal: ac ? ac.signal : undefined,
                           body: koerper !== undefined ? JSON.stringify(koerper) : undefined });
  }catch(e){
    if(uhr) clearTimeout(uhr);
    const abbruch = e && e.name === 'AbortError';
    const err = new Error(abbruch ? 'Microsoft antwortet nicht (nach ' + Math.round(limit / 1000) + ' s abgebrochen)'
                                  : 'keine Antwort von Microsoft (' + ((e && e.message) || e) + ')');
    err.netz = true; err.zeitlimit = abbruch; throw err;
  }
  if(uhr) clearTimeout(uhr);
  if(!r.ok){
    const err = new Error('HTTP ' + r.status + ' ' + await graphFehlerText(r));
    err.status = r.status; throw err;
  }
  if(r.status === 204) return null;
  const t = await r.text();
  try{ return t ? JSON.parse(t) : null; }catch(_){ return null; }
}

// ---------- Excel-Datum/-Uhrzeit ----------
const XL_EPOCHE = Date.UTC(1899, 11, 30);
function zz2(n){ return String(n).padStart(2, '0'); }
function xlDatumText(v){
  if(typeof v === 'number' && v > 0){
    const d = new Date(XL_EPOCHE + Math.round(v) * 86400000);
    return zz2(d.getUTCDate()) + '.' + zz2(d.getUTCMonth() + 1) + '.' + d.getUTCFullYear();
  }
  return String(v == null ? '' : v).trim();
}
function xlDatumSerial(txt){
  const m = /^(\d{1,2})\.(\d{1,2})\.(\d{4})$/.exec(String(txt || '').trim());
  if(!m) return null;
  const ms = Date.UTC(+m[3], +m[2] - 1, +m[1]);
  const d = new Date(ms);
  if(d.getUTCDate() !== +m[1] || d.getUTCMonth() !== +m[2] - 1) return null;
  return Math.round((ms - XL_EPOCHE) / 86400000);
}
function xlZeitSerial(txt){
  const m = /^(\d{1,2}):(\d{2})$/.exec(String(txt || '').trim());
  if(!m || +m[1] > 23 || +m[2] > 59) return null;
  return (+m[1] * 60 + +m[2]) / 1440;
}
function heuteText(){ const d = new Date(); return zz2(d.getDate()) + '.' + zz2(d.getMonth() + 1) + '.' + d.getFullYear(); }

// Fingerabdruck wie am PC (Spalten A,B,F,G,H, gross geschrieben) -- Datum
// zusaetzlich auf TT.MM.JJJJ gebracht, damit "8.10.2026" und "08.10.2026"
// bzw. eine echte Excel-Datumszahl denselben Schluessel ergeben.
function fpDatum(s){
  const m = /^(\d{1,2})\.(\d{1,2})\.(\d{2,4})$/.exec(String(s || '').trim());
  return m ? zz2(+m[1]) + '.' + zz2(+m[2]) + '.' + m[3] : String(s || '').trim();
}
function fpSchluessel(a, b, f, g, h){
  return [a, fpDatum(b), f, g, fpDatum(h)].map(v=> String(v == null ? '' : v).toUpperCase().trim()).join('|');
}

// ---------- LXP-Kennzeichen in Spalte U (wie LxpFlagVorhanden/-Setzen der HTA) ----------
function lxpFlagVorhanden(u, flag){ return String(u || '').split('|').some(t=> t.trim() === flag); }
function lxpFlagSetzenText(u, flag){
  u = String(u || '');
  if(lxpFlagVorhanden(u, flag)) return u;
  return u.trim() === '' ? flag : u + ' | ' + flag;
}
function lxpFlagsAus(u){ return String(u || '').split('|').map(t=> t.trim()).filter(t=> /^LXP:/i.test(t)); }

// ---------- Uebersicht "einblenden" (Reparatur) ----------
// Microsoft (Excel im Browser, Excel-App, Schnittstelle) oeffnet keine Mappe,
// deren Fenster beim Speichern ausgeblendet war ("cannot open this workbook
// in the browser since it's hidden"). Die HTA blendet die vorgeladene
// Uebersicht aus und hat sie bis zur Korrektur auch so gespeichert. Hier wird
// nur dieser eine Eintrag in xl/workbook.xml entfernt -- alle anderen Teile
// der Datei bleiben unveraendert. Zurueckgeschrieben wird nur, wenn die Datei
// seit dem Laden nicht geaendert wurde (If-Match).
const RE_FENSTER_AUSGEBLENDET = /(<workbookView\b[^>]*?)\s+visibility="(?:hidden|veryHidden)"/g;
async function xlsxAusOneDrive(token, pfad){
  const meta = await gx(token, 'GET', msGraphPfadUrl(pfad) + '?$select=id,eTag');
  let r;
  try{ r = await fetch(msGraphPfadUrl(pfad) + '/content', { headers:{ Authorization:'Bearer ' + token }, cache:'no-store' }); }
  catch(e){ const err = new Error('keine Antwort von Microsoft (' + ((e && e.message) || e) + ')'); err.netz = true; throw err; }
  if(!r.ok) throw new Error('Datei laden: HTTP ' + r.status);
  const zip = await JSZip.loadAsync(await r.arrayBuffer());
  return { meta, zip };
}
async function uebersichtAusgeblendet(token, pfad){
  const { zip } = await xlsxAusOneDrive(token, pfad);
  const f = zip.file('xl/workbook.xml');
  if(!f) return false;
  RE_FENSTER_AUSGEBLENDET.lastIndex = 0;
  return RE_FENSTER_AUSGEBLENDET.test(await f.async('string'));
}
async function uebersichtEinblenden(token, pfad){
  const { meta, zip } = await xlsxAusOneDrive(token, pfad);
  const f = zip.file('xl/workbook.xml');
  if(!f) throw new Error('Das ist keine gültige Excel-Datei.');
  const xml = await f.async('string');
  const neu = xml.replace(RE_FENSTER_AUSGEBLENDET, '$1');
  if(neu === xml) return false; // war gar nicht ausgeblendet
  zip.file('xl/workbook.xml', neu);
  const typ = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  const blob = await zip.generateAsync({ type:'blob', compression:'DEFLATE', mimeType: typ });
  let r;
  try{
    r = await fetch(msGraphPfadUrl(pfad) + '/content', { method:'PUT', body: blob,
      headers:{ Authorization:'Bearer ' + token, 'Content-Type': typ, 'If-Match': meta.eTag } });
  }catch(e){ throw new Error('Reparatur: keine Antwort von Microsoft (' + ((e && e.message) || e) + ')'); }
  if(r.status === 412) throw new Error('Die Übersicht wurde gerade an anderer Stelle geändert – bitte gleich noch einmal versuchen.');
  if(!r.ok) throw new Error('Reparatur: Speichern fehlgeschlagen (HTTP ' + r.status + ')');
  return true;
}
// uebersichtLaden mit automatischer Erkennung des ausgeblendeten Fensters:
// Test-Kopie wird still repariert, die echte Uebersicht nur nach Rueckfrage.
async function uebersichtLadenRepariert(token, ziel, frage, meldung){
  try{ return await uebersichtLaden(token, ziel.uebersicht); }
  catch(e){
    if(e.netz) throw e;
    let ausgeblendet = false;
    try{ ausgeblendet = await uebersichtAusgeblendet(token, ziel.uebersicht); }catch(_){}
    if(!ausgeblendet) throw e;
    if(ziel.echt){
      const ok = await frage('Die Rechnungsübersicht wurde am PC mit ausgeblendetem Fenster gespeichert. So kann Microsoft sie nicht öffnen – deshalb lädt auch die Rechnungsverwaltung nicht.\n\n' +
        'Jetzt reparieren? (Es wird nur „ausgeblendet“ entfernt, sonst nichts geändert. Am besten ist die HTA am PC dabei geschlossen.)');
      if(!ok) throw new Error('Die Übersicht ist am PC ausgeblendet gespeichert (Excel am PC: Ansicht > Einblenden, dann speichern).');
    }
    if(meldung) meldung('Übersicht wird repariert (Fenster einblenden) …');
    await uebersichtEinblenden(token, ziel.uebersicht);
    await new Promise(res=> setTimeout(res, 2000));
    return await uebersichtLaden(token, ziel.uebersicht);
  }
}

// ---------- Test-Uebersicht (Kopie der echten) ----------
async function testUebersichtSicherstellen(token, neuAnlegen, meldung){
  const ziel = msGraphPfadUrl(BETA_TEST_UEBERSICHT);
  if(!neuAnlegen){
    try{ await gx(token, 'GET', ziel + '?$select=id'); return false; }
    catch(e){ if(e.status !== 404) throw e; }
  }
  if(meldung) meldung('Test-Übersicht wird als Kopie der echten Übersicht angelegt …');
  await msGraphOrdnerSicherstellen(token, 'KVBW Onedrive/Beta-Test');
  const quelle = await gx(token, 'GET', msGraphPfadUrl(MSGRAPH_PFAD_UEBERSICHT) + '?$select=id');
  const ordner = await gx(token, 'GET', msGraphPfadUrl('KVBW Onedrive/Beta-Test') + '?$select=id,parentReference');
  if(neuAnlegen){
    try{ await gx(token, 'DELETE', ziel); }catch(e){ if(e.status !== 404) throw e; }
  }
  await gx(token, 'POST', 'https://graph.microsoft.com/v1.0/me/drive/items/' + quelle.id + '/copy',
    { parentReference: { driveId: ordner.parentReference && ordner.parentReference.driveId, id: ordner.id },
      name: BETA_TEST_UEBERSICHT.split('/').pop() });
  // Kopieren laeuft bei Microsoft im Hintergrund -- warten, bis die Datei da ist
  for(let i = 0; i < 40; i++){
    await new Promise(res=> setTimeout(res, 1000));
    let da = false;
    try{ await gx(token, 'GET', ziel + '?$select=id'); da = true; }
    catch(e){ if(e.status !== 404) throw e; }
    if(da){
      // Die Kopie erbt ein evtl. ausgeblendetes Fenster -> gleich reparieren
      // (die Kopie hat niemand offen).
      try{ await uebersichtEinblenden(token, BETA_TEST_UEBERSICHT); }catch(_){}
      return true;
    }
  }
  throw new Error('Die Kopie der Übersicht ist nach 40 Sekunden noch nicht fertig – bitte gleich noch einmal versuchen.');
}

// ---------- Uebersicht lesen ----------
function xlAdresseStart(adresse){
  const m = /!\$?([A-Z]+)\$?(\d+)/.exec(adresse || '');
  return m ? { spalte: spaltenBuchstabeZuNr(m[1]) - 1, zeile: +m[2] } : { spalte: 0, zeile: 1 };
}
async function uebersichtLaden(token, pfad){
  const basis = msGraphPfadUrl(pfad);
  // Excel bei Microsoft braucht beim ersten Zugriff manchmal sehr lange oder
  // antwortet mit 502/503/504 -- dann einmal neu versuchen
  const versuche = async (url)=>{
    try{ return await gx(token, 'GET', url); }
    catch(e){
      if(!(e.zeitlimit || [502, 503, 504].includes(e.status))) throw e;
      await new Promise(res=> setTimeout(res, 1500));
      return await gx(token, 'GET', url);
    }
  };
  const ws = await versuche(basis + '/workbook/worksheets?$select=name,position');
  const blaetter = ((ws && ws.value) || []).slice().sort((a, b)=> (a.position || 0) - (b.position || 0));
  if(!blaetter.length) throw new Error('Die Übersicht enthält kein Tabellenblatt.');
  const blatt = blaetter[0].name; // wie am PC: immer das erste Blatt
  const blattUrl = basis + "/workbook/worksheets('" + encodeURIComponent(blatt) + "')";
  const ur = await versuche(blattUrl + '/usedRange(valuesOnly=true)?$select=address,values');
  const st = xlAdresseStart(ur && ur.address);
  const zeilen = ((ur && ur.values) || []).map((r, i)=> ({ nr: st.zeile + i, v: new Array(st.spalte).fill('').concat(r) }));
  return { pfad, basis, blatt, blattUrl, zeilen };
}

function uebersichtAuswerten(ue){
  const t = v=> String(v == null ? '' : v).trim();
  const erg = { letzteZeile: 1, hoechsteNr: 0, nachFp: new Map(), nachRenu: new Map(), nachNr: new Map(), alsZahl: {} };
  for(const z of ue.zeilen){
    if(z.nr < 2) continue;
    const v = z.v, a = t(v[0]), f = t(v[5]), q = t(v[16]);
    if(a) erg.letzteZeile = Math.max(erg.letzteZeile, z.nr); // wie am PC: letzte Zeile ueber Spalte A
    const n = renuZaehlerAusText(q);
    if(n !== null){
      if(n > erg.hoechsteNr) erg.hoechsteNr = n;
      if(!erg.nachNr.has(n)) erg.nachNr.set(n, z);
    }
    if(q && !erg.nachRenu.has(q)) erg.nachRenu.set(q, z);
    if(a || f){
      const k = fpSchluessel(a, xlDatumText(v[1]), f, t(v[6]), xlDatumText(v[7]));
      if(!erg.nachFp.has(k)) erg.nachFp.set(k, z); // erste Fundstelle gewinnt, wie am PC
      // Stehen Datum/Uhrzeit in den bisherigen Zeilen als echte Excel-Zahl
      // oder als Text? Die App schreibt es genauso (die letzte Zeile zaehlt).
      [1, 2, 3, 4, 7].forEach(c=>{ if(v[c] !== '' && v[c] != null) erg.alsZahl[c] = (typeof v[c] === 'number'); });
    }
  }
  return erg;
}

// Hoechste schon vergebene Nummer in den lokal gespeicherten Faellen -- in der
// Beta UND (anderer Speicherbereich) in der normalen Version, damit keine
// Nummer doppelt vergeben wird, die dort fuer einen noch nicht eingelesenen
// Fall bereits reserviert ist.
function hoechsteLokaleNrBeideVersionen(){
  let max = hoechsteLokalVergebeneRenu();
  try{
    ['ls', 'pt'].forEach(art=>{
      const roh = window.__rohSpeicher && window.__rohSpeicher.get('faelle_' + art);
      if(!roh) return;
      (JSON.parse(roh) || []).forEach(f=>{ const n = renuZaehlerAusText(f && f.rechnungsnummer); if(n !== null && n > max) max = n; });
    });
  }catch(_){}
  return max;
}

// ---------- Rechnungsnummern ----------
// Eine Rechnung gilt als "fest" (Nummer darf sich nicht mehr aendern), sobald
// ein Brief verschickt wurde: Versandkennzeichen in U (LXP:..), Vermerk
// NRFEST (bleibt nach "Freigeben" stehen) oder fettes Datum in R (PC).
function uZeigtFest(u){ return /(^|\|)\s*(LXP:|NRFEST)/i.test(String(u || '')); }
async function hoechsteFesteNr(token, ue, ana){
  const nrn = [...ana.nachNr.keys()].sort((a, b)=> b - a);
  let geprueft = 0;
  for(const n of nrn){
    const z = ana.nachNr.get(n);
    if(uZeigtFest(z.v[20])) return n;
    if(geprueft++ >= 40) return n; // weiter unten gilt alles als fest
    if(await zeileFett(token, ue, z.nr)) return n;
  }
  return 0;
}
// Nummern, die die normale App fuer noch nicht eingelesene Faelle reserviert hat
function reservierteNummernNormaleApp(ana){
  const erg = new Set();
  try{
    ['ls', 'pt'].forEach(art=>{
      const roh = window.__rohSpeicher && window.__rohSpeicher.get('faelle_' + art);
      if(!roh) return;
      (JSON.parse(roh) || []).forEach(f=>{
        const r = f && String(f.rechnungsnummer || '').trim();
        const n = renuZaehlerAusText(r);
        if(r && n !== null && !ana.nachRenu.has(r)) erg.add(n);
      });
    });
  }catch(_){}
  return erg;
}
// Naechste freie Nummer nach der hoechsten festen
async function betaFreieNummer(token, ue, ana){
  const fest = await hoechsteFesteNr(token, ue, ana);
  const belegt = new Set([...ana.nachNr.keys(), ...reservierteNummernNormaleApp(ana)]);
  let n = fest + 1;
  while(belegt.has(n)) n++;
  return n;
}

const XL_FORMAT_DATUM = 'dd\\.mm\\.yyyy';
const XL_FORMAT_ZEIT = 'h:mm';
const XL_FORMAT_EURO = '#,##0.00\\ "€"';

// Werte fuer A..R wie SchreibeInUebersicht am PC (LS bzw. PT)
function fallUebersichtsWerte(f, renu, betrag, rechnungsdatum, alsZahl, aktualisieren){
  const w = f.werte || {};
  const { nachname, vorname } = nameAufteilen(w.txtName);
  const istLs = f.art === 'ls';
  const formate = {};
  const datum = (c, txt)=>{
    if(alsZahl[c] === false) return txt || '';
    const s = xlDatumSerial(normalisiereDatum(txt || '') || txt);
    if(s === null) return txt || '';
    formate[c] = XL_FORMAT_DATUM; return s;
  };
  const zeit = (c, txt)=>{
    if(alsZahl[c] === false) return txt || '';
    const s = xlZeitSerial(normalisiereZeit(txt || '') || txt);
    if(s === null) return txt || '';
    formate[c] = XL_FORMAT_ZEIT; return s;
  };
  const leer = aktualisieren ? null : ''; // null = Zelle unveraendert lassen
  const werte = new Array(18).fill(leer);
  werte[0] = istLs ? 'L' : 'P';
  werte[1] = datum(1, w.txtDatumExcel);
  werte[2] = zeit(2, w.txtZeitLS);
  if(istLs){
    werte[3] = datum(3, w.txtSterbedatum);
    werte[4] = zeit(4, w.txtTodeszeit);
    werte[10] = w.txtSterbeAdr1 || 'idem';
    werte[11] = w.txtSterbeAdr2 || 'idem';
    werte[12] = w.txtBName || '';
    werte[13] = w.txtAdresse1 || '';
    werte[14] = w.txtAdresse2 || '';
  } else {
    werte[13] = ''; werte[14] = ''; // PT: N/O wie am PC leer, D/E/K/L/M unangetastet
  }
  werte[5] = nachname;
  werte[6] = vorname;
  werte[7] = datum(7, w.txtGeda);
  werte[8] = w.txtPAdresse1 || '';
  werte[9] = w.txtPAdresse2 || '';
  werte[15] = Math.round(Number(betrag) * 100) / 100; formate[15] = XL_FORMAT_EURO;
  werte[16] = renu;
  const r = xlDatumSerial(rechnungsdatum);
  werte[17] = r === null ? (rechnungsdatum || '') : r; if(r !== null) formate[17] = XL_FORMAT_DATUM;
  let spalteU = 'POS:' + (f.positionen || []).join(',') + ' | KM:' + (w.txtKm || '0');
  if(!istLs){ const k = diagnosenKuerzel(w.diagnosen); if(k) spalteU += ' | ICD:' + k; }
  // Faktoren, Begruendungen, eigene Positionen (fuer den PC und die App)
  if(typeof betaUSegmente === 'function') spalteU += betaUSegmente(f);
  return { werte, formate, spalteU };
}

async function uebersichtZeileSchreiben(token, ue, sid, nr, zeile){
  const schutz = await blattSchutzAufheben(token, ue, sid);
  try{
    if(zeile.einfuegen) await gx(token, 'POST', zelle(ue, nr + ':' + nr) + '/insert', { shift: 'Down' }, sid);
    await gx(token, 'PATCH', zelle(ue, 'A' + nr + ':R' + nr), { values: [zeile.werte] }, sid);
    for(const c of Object.keys(zeile.formate)){
      await gx(token, 'PATCH', zelle(ue, String.fromCharCode(65 + +c) + nr), { numberFormat: [[zeile.formate[c]]] }, sid);
    }
    await gx(token, 'PATCH', zelle(ue, 'A' + nr + ':Q' + nr) + '/format/font', { name: 'Arial', size: 11 }, sid);
    if(!zeile.rBehalten) await gx(token, 'PATCH', zelle(ue, 'R' + nr) + '/format/font', { name: 'Arial', size: 11 }, sid);
    // R nie fett beim Erstellen -- fett heisst "per Brief verschickt"
    if(!zeile.rBehalten) await gx(token, 'PATCH', zelle(ue, 'R' + nr) + '/format/font', { bold: false }, sid);
    await gx(token, 'PATCH', zelle(ue, 'T' + nr), { formulas: [['=IF(AND(S' + nr + '="",R' + nr + '=""),"",IF(S' + nr + '<>"",S' + nr + '-R' + nr + ',TODAY()-R' + nr + '))']] }, sid);
    await gx(token, 'PATCH', zelle(ue, 'U' + nr), { values: [[zeile.spalteU]] }, sid);
    await gx(token, 'PATCH', zelle(ue, 'U' + nr) + '/format/font', { name: 'Arial', size: 9, color: '#FFFFFF' }, sid);
    await gx(token, 'PATCH', zelle(ue, 'W' + nr), { formulas: [['=IF(V' + nr + '="","",IF(S' + nr + '="",TODAY()-V' + nr + ',V' + nr + '-S' + nr + '))']] }, sid);
  } finally {
    await blattSchutzWiederherstellen(token, ue, schutz, sid);
  }
}

// Wie BriefAlsVersendetMarkieren am PC: R = Versanddatum (fett), U += LXP:1
// plan (optional, zeitversetzter Versand): {datum:'yyyy-mm-dd', id, modus}
// -> R = geplantes Versanddatum, U += VERSAND:..=datum/Auftragsnummer/modus
async function uebersichtVersandVermerken(token, ue, sid, nr, bisherU, flag, original, plan){
  flag = flag || 'LXP:1';
  if(original === undefined) original = (flag === 'LXP:1');
  const schutz = await blattSchutzAufheben(token, ue, sid);
  let neuU = String(bisherU || '');
  try{
    if(original){
      const datum = plan && plan.datum ? plan.datum.split('-').reverse().join('.') : heuteText();
      await gx(token, 'PATCH', zelle(ue, 'R' + nr), { values: [[xlDatumSerial(datum)]], numberFormat: [[XL_FORMAT_DATUM]] }, sid);
      await gx(token, 'PATCH', zelle(ue, 'R' + nr) + '/format/font', { bold: true }, sid);
    }
    neuU = lxpFlagSetzenText(bisherU, flag);
    if(plan && plan.datum){ const pl = versandPlaene(neuU); pl[versandSchluessel(flag)] = plan; neuU = versandPlaeneSetzen(neuU, pl); }
    if(neuU !== String(bisherU || '')) await gx(token, 'PATCH', zelle(ue, 'U' + nr), { values: [[neuU]] }, sid);
  } finally {
    await blattSchutzWiederherstellen(token, ue, schutz, sid);
  }
  return neuU;
}
// Wie LxpFlagEntfernen am PC
function lxpFlagEntfernenText(u, flag){
  return String(u || '').split('|').map(t=> t.trim()).filter(t=> t && t !== flag).join(' | ');
}
function lxpFlagFuerTyp(typ){ return (!typ || typ === 'ORIG') ? 'LXP:1' : 'LXP:' + typ; }

// ---------- Zeitversetzter Versand (Spalte U: "VERSAND:1=2026-10-24/6035143/live;M1=...") ----------
// Merkt je Brief (1 = Rechnung, 2A, M1, ...) das geplante Datum und die
// Auftragsnummer bei LetterXpress -- damit laesst sich der Termin aendern
// oder der Auftrag stornieren, ohne einen zweiten Brief zu erzeugen.
function versandSchluessel(flagOderTyp){ const t = String(flagOderTyp || '').replace(/^LXP:/i, ''); return (!t || t === 'ORIG') ? '1' : t; }
function versandPlaene(u){
  const m = /(?:^|\|)\s*VERSAND:([^|]*)/i.exec(String(u || ''));
  const out = {};
  if(!m) return out;
  m[1].split(';').forEach(e=>{
    const i = e.indexOf('='); if(i < 0) return;
    const [datum, id, modus] = e.slice(i + 1).split('/');
    out[e.slice(0, i).trim()] = { datum: (datum || '').trim(), id: (id || '').trim(), modus: (modus || '').trim() };
  });
  return out;
}
function versandPlaeneSetzen(u, plaene){
  const teile = String(u || '').split('|').map(t=> t.trim()).filter(t=> t && !/^VERSAND:/i.test(t));
  const e = Object.keys(plaene).filter(k=> plaene[k] && plaene[k].datum).map(k=> k + '=' + plaene[k].datum + '/' + (plaene[k].id || '') + '/' + (plaene[k].modus || ''));
  if(e.length) teile.push('VERSAND:' + e.join(';'));
  return teile.join(' | ');
}
function heuteIso(){ const d = new Date(); return d.getFullYear() + '-' + zz2(d.getMonth() + 1) + '-' + zz2(d.getDate()); }
function morgenIso(){ const d = new Date(); d.setDate(d.getDate() + 1); return d.getFullYear() + '-' + zz2(d.getMonth() + 1) + '-' + zz2(d.getDate()); }
function isoDe(iso){ return String(iso || '').split('-').reverse().join('.'); }
// noch nicht verschickt (Versanddatum liegt in der Zukunft)?
function versandGeplant(u, typ){
  const p = versandPlaene(u)[versandSchluessel(typ)];
  return p && p.datum > heuteIso() ? p : null;
}

// Word-Datei hochladen, von Microsoft als PDF umwandeln lassen, PDF daneben ablegen
async function docxHochladenMitPdf(token, ordner, name, docxBlob, meldung){
  const docxItem = await schritt('Word-Datei hochladen', ()=> msGraphDateiHochladen(token, ordner + '/' + name + '.docx', docxBlob,
    'application/vnd.openxmlformats-officedocument.wordprocessingml.document'));
  if(!docxItem || !docxItem.id) throw new Error('Das Word-Dokument wurde nicht korrekt gespeichert.');
  if(meldung) meldung('PDF wird erzeugt …');
  let pdfBlob = null, pdfFehler = '';
  for(let versuch = 1; versuch <= 3 && !pdfBlob; versuch++){
    try{
      const r = await fetch('https://graph.microsoft.com/v1.0/me/drive/items/' + docxItem.id + '/content?format=pdf', { headers:{ Authorization:'Bearer ' + token } });
      if(r.ok){
        const b = await r.blob();
        const kopf = String.fromCharCode(...new Uint8Array(await b.slice(0, 5).arrayBuffer()));
        if(kopf === '%PDF-') pdfBlob = new Blob([b], { type:'application/pdf' });
        else pdfFehler = 'Antwort war keine PDF';
      } else pdfFehler = 'HTTP ' + r.status;
    }catch(e){ pdfFehler = 'keine Antwort (' + ((e && e.message) || e) + ')'; }
    if(!pdfBlob) await new Promise(res=> setTimeout(res, 1500 * versuch));
  }
  if(!pdfBlob) throw new Error('PDF erzeugen: Microsoft konnte aus dem Word-Dokument kein PDF machen (' + pdfFehler + '). Die Word-Datei liegt bereits im Ordner.');
  const pdfItem = await schritt('PDF hochladen', ()=> msGraphDateiHochladen(token, ordner + '/' + name + '.pdf', pdfBlob, 'application/pdf'));
  return { docxItem, pdfItem, pdfBlob };
}
async function graphItemLaden(token, id){
  let r;
  try{ r = await fetch('https://graph.microsoft.com/v1.0/me/drive/items/' + id + '/content', { headers:{ Authorization:'Bearer ' + token }, cache:'no-store' }); }
  catch(e){ throw new Error('keine Antwort von Microsoft (' + ((e && e.message) || e) + ')'); }
  if(!r.ok) throw new Error('Datei konnte nicht geladen werden (HTTP ' + r.status + ').');
  return r.arrayBuffer();
}

// Ein Fall komplett: Nummer, Pruefungen, Word + PDF, Eintrag in der Uebersicht
// =====================================================================
// frage(text) -> Promise<boolean> (OK/Abbrechen). kontext: {token, arzt, ziel, vorlagen}
async function betaRechnungErstellen(f, meldung, frage, kontext){
  const { token, arzt, ziel } = kontext;
  const w = f.werte || {};
  const { nachname, vorname } = nameAufteilen(w.txtName);
  if(!nachname || !vorname) throw new Error('Name bitte als „Nachname, Vorname“ oder „Vorname Nachname“ eintragen.');
  const anzeige = nachname + ', ' + vorname;

  // 1. Uebersicht lesen: steht der Fall schon drin? Welche Nummer?
  meldung('Rechnungsübersicht wird gelesen …');
  const ue = await schritt('Rechnungsübersicht lesen', ()=> uebersichtLadenRepariert(token, ziel, frage, meldung));
  const ana = uebersichtAuswerten(ue);
  // Gehoert der Fall zu einer bestimmten Zeile (bearbeitete Rechnung)? Dann
  // diese Zeile ueber die Rechnungsnummer -- auch wenn Name/Datum geaendert
  // wurden. Sonst wie am PC ueber den Fingerabdruck.
  const bezugRenu = String((f.bezug && f.bezug.renu) || '').trim();
  let treffer = bezugRenu ? (ana.nachRenu.get(bezugRenu) || null) : null;
  if(!treffer) treffer = ana.nachFp.get(fpSchluessel(f.art === 'ls' ? 'L' : 'P', w.txtDatumExcel, nachname, vorname, w.txtGeda)) || null;
  const hinweise = [];
  let renu = '';
  const qTreffer = treffer ? String(treffer.v[16] == null ? '' : treffer.v[16]).trim() : '';
  if(qTreffer && f.umnummern && f.rechnungsnummer){
    // Aufruecken nach dem Loeschen: neue (kleinere) Nummer fuer diese Zeile
    renu = f.rechnungsnummer;
  } else if(qTreffer){
    renu = qTreffer;
  }
  // Neue Rechnung: Nummer immer frisch aus der Uebersicht -- die naechste
  // freie nach der hoechsten schon verschickten (Luecken durch geloeschte,
  // nie verschickte Rechnungen werden so wieder aufgefuellt). Eine vorher
  // auf dem Handy vergebene Nummer zaehlt nicht, solange nichts verschickt ist.
  if(!renu){
    const naechste = await betaFreieNummer(token, ue, ana);
    renu = rechnungsnummerBerechnen(nachname, vorname, normalisiereDatum(w.txtDatumExcel || ''), naechste);
    if(!renu) throw new Error('Rechnungsnummer konnte nicht gebildet werden (Name und Datum prüfen).');
  }
  if(renu !== f.rechnungsnummer){
    const arr = ladeFaelle(f.art);
    if(arr[f.idx]){ arr[f.idx].rechnungsnummer = renu; speichereFaelle(f.art, arr); }
    f.rechnungsnummer = renu;
  }
  const name = renuDateiname(renu);
  // Bewusste Bearbeitung einer vorhandenen Rechnung -> Dateien ohne Rueckfrage ersetzen
  const bearbeitung = !!(bezugRenu && treffer && (renu === bezugRenu || f.umnummern));

  // 2. Schon per Brief verschickt?
  let warVersendet = false, geplantPlan = null;
  if(treffer){
    const u = String(treffer.v[20] == null ? '' : treffer.v[20]);
    warVersendet = lxpFlagVorhanden(u, 'LXP:1'); // wie am PC: nur das Kennzeichen zaehlt (Freigeben entfernt es, R bleibt fett)
    if(warVersendet){
      const am = xlDatumText(treffer.v[17]);
      const geplant = versandGeplant(u, 'ORIG');
      geplantPlan = geplant && geplant.id ? geplant : null;
      if(!await frage('Sind Sie sicher?\n\n' + anzeige + ' (' + renu + ') wurde ' + (geplant ? 'zum Versand am ' + isoDe(geplant.datum) + ' an LetterXpress übergeben' : 'bereits per Brief verschickt' + (am ? ' (' + am + ')' : '')) + '.\n\n' +
        'Es wird eine NEUE Fassung (Word + PDF) unter derselben Rechnungsnummer erstellt. Die bisherige PDF bleibt als „' + name + '_verschickte Fassung …“ im Ordner erhalten, damit nachvollziehbar ist, was verschickt wurde.' +
        (geplantPlan ? '\n\nDer geplante Brief enthält noch die bisherige Fassung: er wird automatisch bei LetterXpress storniert und mit der neuen Fassung zum selben Datum (' + isoDe(geplantPlan.datum) + ') neu übergeben – es geht nur ein Brief raus.'
                     : geplant ? '\n\nAchtung: Für den geplanten Brief ist keine Auftragsnummer gespeichert – bitte im LetterXpress-Kundenkonto stornieren.' : '\n\nVerschickt wird dabei nichts.'),
        'Ja, neue Fassung erstellen', 'Abbrechen'))
        return { uebersprungen: true, grund: 'bereits per Brief verschickt', renu, name };
    }
  }

  // 3. Rechnung schon im Ordner (vom PC oder vom Handy)?
  const [vPdf, vDocx] = await schritt('Ordner prüfen', ()=> Promise.all([
    dateiInfo(token, ziel.ordner + '/' + name + '.pdf'), dateiInfo(token, ziel.ordner + '/' + name + '.docx')]));
  const vorhanden = vPdf || vDocx;
  if(vorhanden && !bearbeitung){
    const wann = new Date(vorhanden.lastModifiedDateTime).toLocaleString('de-DE', { dateStyle: 'short', timeStyle: 'short' });
    if(!await frage('Für ' + anzeige + ' liegt schon eine Rechnung „' + name + '“ im Ordner (Stand ' + wann + ').\n\nOK = neu erstellen und ersetzen\nAbbrechen = vorhandene behalten'))
      return { uebersprungen: true, grund: 'Rechnung ist schon vorhanden', renu, name, url: vPdf && vPdf.webUrl, ziel,
               // vorhandene PDF kann trotzdem per Brief verschickt werden (sofern
               // der Fall in der Uebersicht steht und noch nicht verschickt ist)
               sendbar: !!(vPdf && treffer && !warVersendet) };
  }

  // 3b. Verschickte Fassung sichern, bevor sie ersetzt wird
  if(warVersendet && vPdf && !geplantPlan){
    meldung('Verschickte Fassung wird gesichert …');
    const archiv = await schritt('Verschickte Fassung sichern', async ()=>{
      const am = (xlDatumText(treffer.v[17]) || heuteText()).replace(/[\\/:*?"<>|]/g, '.');
      let pfad = '', n = 1;
      for(; n < 50; n++){
        pfad = ziel.ordner + '/' + name + '_verschickte Fassung ' + n + ' (' + am + ').pdf';
        if(!await dateiInfo(token, pfad)) break;
      }
      const inhalt = await graphDateiLaden(token, ziel.ordner + '/' + name + '.pdf');
      const it = await msGraphDateiHochladen(token, pfad, new Blob([inhalt], { type:'application/pdf' }), 'application/pdf');
      if(!it || !it.id) throw new Error('Die verschickte Fassung konnte nicht gesichert werden – es wurde nichts ersetzt.');
      return pfad.split('/').pop();
    });
    hinweise.push('✓ Verschickte Fassung gesichert als „' + archiv + '“');
  }

  // 4. Word + PDF
  const daten = fallRechnungsdaten(f, arzt);
  if(!kontext.vorlagen[f.art]){
    meldung('Vorlagen werden geladen …');
    const docm = await schritt('Word-Vorlage laden', ()=> graphDateiLaden(token, MSGRAPH_PFAD_WORDVORLAGE[f.art]));
    const excel = await schritt('Excel-Vorlage (Positionen) lesen', ()=> excelVorlageZeilenLaden(token, f.art));
    kontext.vorlagen[f.art] = { docm, excel };
  }
  const { docm, excel } = kontext.vorlagen[f.art];
  meldung('Word-Dokument wird erstellt …');
  const erg = await rechnungDocxErzeugen(docm, excel.zeilen, daten, 'blob');
  meldung('Word-Dokument wird hochgeladen …');
  if(!ziel.echt){
    await msGraphOrdnerSicherstellen(token, 'KVBW Onedrive/Beta-Test');
    await msGraphOrdnerSicherstellen(token, BETA_ZIEL_ORDNER);
  }
  const { docxItem, pdfItem, pdfBlob } = await docxHochladenMitPdf(token, ziel.ordner, name, erg.inhalt, meldung);

  // 5. Eintrag in der Uebersicht (neue Zeile bzw. vorhandene aktualisieren)
  meldung('Wird in die Rechnungsübersicht eingetragen …');
  const aktualisieren = !!treffer;
  const zeile = fallUebersichtsWerte(f, renu, erg.summe, daten.rechnungsdatum, ana.alsZahl, aktualisieren);
  if(warVersendet){
    // Versandvermerk (R = Versanddatum, fett) nicht ueberschreiben
    zeile.werte[17] = null; delete zeile.formate[17]; zeile.rBehalten = true;
  }
  let nr = treffer ? treffer.nr : 0;
  await schritt('In die Übersicht eintragen', async ()=>{
    const sid = await xlSitzung(token, ue.basis);
    try{
      if(!nr){
        // Nummer kleiner als schon vorhandene (aufgefuellte Luecke)? Dann die
        // Zeile vor der ersten mit groesserer Nummer einfuegen -- die
        // Uebersicht bleibt nach Rechnungsnummer sortiert.
        const n = renuZaehlerAusText(renu);
        const danach = ue.zeilen.filter(z=> z.nr >= 2 && (renuZaehlerAusText(String(z.v[16] == null ? '' : z.v[16]).trim()) || 0) > n).sort((a, b)=> a.nr - b.nr)[0];
        if(danach){
          nr = danach.nr;
          zeile.einfuegen = true;
        } else {
          // Kurz vor dem Schreiben nachsehen, ob inzwischen (z.B. am PC) Zeilen dazugekommen sind
          const k = await gx(token, 'GET', zelle(ue, 'A' + (ana.letzteZeile + 1) + ':A' + (ana.letzteZeile + 30)) + '?$select=values', undefined, sid);
          let off = 0;
          while(off < 30 && String(((k && k.values) || [])[off] ? k.values[off][0] : '').trim() !== '') off++;
          nr = ana.letzteZeile + 1 + off;
        }
      } else {
        // Vorhandene LXP-Kennzeichen in U behalten
        const flags = lxpFlagsAus(treffer.v[20]);
        if(flags.length) zeile.spalteU += ' | ' + flags.join(' | ');
        const plaeneAlt = versandPlaene(treffer.v[20]);
        if(Object.keys(plaeneAlt).length) zeile.spalteU = versandPlaeneSetzen(zeile.spalteU, plaeneAlt);
      }
      await uebersichtZeileSchreiben(token, ue, sid, nr, zeile);
    } finally {
      await xlSitzungEnde(token, ue.basis, sid);
    }
  });
  // 6. Geplanten Brief durch die neue Fassung ersetzen (stornieren + neu uebergeben)
  if(geplantPlan){
    if(!pdfBlob) hinweise.push('⚠ Keine PDF – der geplante Brief (' + isoDe(geplantPlan.datum) + ') enthält noch die bisherige Fassung. Bitte über die Sanduhr stornieren und neu senden.');
    else {
      meldung('Geplanter Brief wird durch die neue Fassung ersetzt …');
      try{
        await versandGeplantErsetzen(token, ziel, renu, 'ORIG', name, geplantPlan, geplantPlan.datum, pdfBlob, pdfItem && pdfItem.id);
        hinweise.push('✓ Geplanter Brief (' + isoDe(geplantPlan.datum) + ') durch die neue Fassung ersetzt');
      }catch(err){ hinweise.push('⚠ ' + (err.message || String(err))); }
    }
  }
  return { name, renu, zeile: nr, neu: !aktualisieren, summe: erg.summe, warnungen: erg.warnungen, hinweise,
           pdfBlob, pdfUrl: pdfItem && pdfItem.webUrl, docxUrl: docxItem.webUrl, ziel, ersetzt: !!vorhanden };
}

// ---------- LetterXpress: Hilfsfunktionen ----------
function md5Hex(str){
  // MD5 (RFC 1321) ueber die UTF-8-Bytes des Textes -- wie MD5Hex in der HTA
  const bytes = new TextEncoder().encode(str);
  const n = bytes.length, nBlocks = ((n + 8) >>> 6) + 1, w = new Uint32Array(nBlocks * 16);
  for(let i = 0; i < n; i++) w[i >> 2] |= bytes[i] << ((i % 4) * 8);
  w[n >> 2] |= 0x80 << ((n % 4) * 8);
  w[nBlocks * 16 - 2] = (n * 8) >>> 0;
  w[nBlocks * 16 - 1] = Math.floor(n / 0x20000000);
  const K = new Uint32Array(64), S = [7,12,17,22,7,12,17,22,7,12,17,22,7,12,17,22,5,9,14,20,5,9,14,20,5,9,14,20,5,9,14,20,4,11,16,23,4,11,16,23,4,11,16,23,4,11,16,23,6,10,15,21,6,10,15,21,6,10,15,21,6,10,15,21];
  for(let i = 0; i < 64; i++) K[i] = Math.floor(Math.abs(Math.sin(i + 1)) * 4294967296) >>> 0;
  let a0 = 0x67452301, b0 = 0xefcdab89, c0 = 0x98badcfe, d0 = 0x10325476;
  for(let blk = 0; blk < nBlocks; blk++){
    let A = a0, B = b0, C = c0, D = d0;
    for(let i = 0; i < 64; i++){
      let F, g;
      if(i < 16){ F = (B & C) | (~B & D); g = i; }
      else if(i < 32){ F = (D & B) | (~D & C); g = (5 * i + 1) % 16; }
      else if(i < 48){ F = B ^ C ^ D; g = (3 * i + 5) % 16; }
      else { F = C ^ (B | ~D); g = (7 * i) % 16; }
      F = (F + A + K[i] + w[blk * 16 + g]) >>> 0;
      A = D; D = C; C = B;
      B = (B + ((F << S[i]) | (F >>> (32 - S[i])))) >>> 0;
    }
    a0 = (a0 + A) >>> 0; b0 = (b0 + B) >>> 0; c0 = (c0 + C) >>> 0; d0 = (d0 + D) >>> 0;
  }
  return [a0, b0, c0, d0].map(x=> [0,1,2,3].map(k=> ((x >>> (k * 8)) & 255).toString(16).padStart(2,'0')).join('')).join('');
}
async function blobAlsBase64(blob){
  const b = new Uint8Array(await blob.arrayBuffer());
  let s = '';
  for(let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
  return btoa(s);
}
// ---------- LetterXpress: Brief verschicken ----------
function pdfSeitenZaehlen(bytes){
  // grobe Zaehlung der Seitenobjekte; 0 = unbekannt (z.B. komprimierte Objekte)
  let s = '';
  for(let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  const m = s.match(/\/Type\s*\/Page(?![s\w])/g);
  return m ? m.length : 0;
}
function briefTestmodus(werte, ziel){
  if(!ziel.echt) return true; // Testablage: immer Testmodus
  const v = String(werte.BRIEF_TESTMODUS == null || werte.BRIEF_TESTMODUS === '' ? '1' : werte.BRIEF_TESTMODUS).trim().toLowerCase();
  return !(v === '0' || v === 'false' || v === 'falsch');
}
async function lxpBriefSenden(pdfBlob, dateiname, test, versandDatumIso){
  const ini = iniCacheLaden();
  const w = ini ? ini.werte : {};
  if(!w.BRIEF_BENUTZER || !w.BRIEF_APIKEY) throw new Error('LetterXpress-Zugangsdaten fehlen (Einstellungen > Arztinfos & Briefversand, dann speichern bzw. vom PC laden).');
  const base64 = await blobAlsBase64(pdfBlob);
  const koerper = {
    auth: { username: w.BRIEF_BENUTZER, apikey: w.BRIEF_APIKEY, mode: test ? 'test' : 'live' },
    letter: { base64_file: base64, base64_file_checksum: md5Hex(base64), filename_original: dateiname + '.pdf',
              specification: { color: '1', mode: 'simplex', shipping: 'national' } }
  };
  if(versandDatumIso) koerper.letter.dispatch_date = versandDatumIso; // yyyy-mm-dd, muss in der Zukunft liegen
  // Antwort enthaelt die Auftragsnummer (data.id) -- fuer spaeteres Aendern/Stornieren
  const basis = lxpBasisUrl(w);
  let host = basis; try{ host = new URL(basis).host; }catch(_){}
  let r;
  try{
    r = await fetch(basis + '/v3/printjobs', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(koerper) });
  }catch(e){ throw new Error('Keine Verbindung zur Weiterleitung ' + host + ' (' + ((e && e.message) || e) + ') – es wurde nichts verschickt.'); }
  const txt = await r.text();
  let j = null; try{ j = JSON.parse(txt); }catch(_){}
  if(!r.ok || (j && j.status && +j.status >= 400)){
    const kurz = /<html/i.test(txt) ? txt.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim() : txt;
    throw new Error('Versand abgelehnt (HTTP ' + r.status + ', über ' + host + '): ' + kurz.slice(0, 300) + ' – es wurde nichts verschickt.');
  }
  return j || txt;
}

// ---------- LetterXpress: Auftrag aendern / stornieren ----------
// Der Browser darf LetterXpress nur per POST ueber die Weiterleitung
// erreichen; ab Version 2 reicht sie "_methode" (PUT/DELETE) weiter.
async function lxpWeiterleitungVersion(){
  const ini = iniCacheLaden(); const w = ini ? ini.werte : {};
  try{
    const r = await fetch(lxpBasisUrl(w) + '/v3/_version', { method:'POST', headers:{'Content-Type':'application/json'}, body:'{}' });
    if(!r.ok) return 1;
    const j = await r.json().catch(()=> null);
    return j && Number(j.weiterleitung) || 1;
  }catch(e){ return 0; }
}
async function lxpAuftrag(methode, id, modus, letter){
  const ini = iniCacheLaden(); const w = ini ? ini.werte : {};
  if(!w.BRIEF_BENUTZER || !w.BRIEF_APIKEY) throw new Error('LetterXpress-Zugangsdaten fehlen (Einstellungen > Briefversand).');
  const v = await lxpWeiterleitungVersion();
  if(v === 0) throw new Error('Die Weiterleitung zu LetterXpress ist nicht erreichbar (Internet?). Es wurde nichts geändert.');
  if(v < 2) throw new Error('Die Weiterleitung in Azure ist noch die alte Version und kann Aufträge nicht ändern. Bitte einmal das neue Azure-Skript ausführen (wie bei der Einrichtung). Es wurde nichts geändert.');
  const koerper = { _methode: methode, auth: { username: w.BRIEF_BENUTZER, apikey: w.BRIEF_APIKEY, mode: modus === 'test' ? 'test' : 'live' } };
  if(letter) koerper.letter = letter;
  const r = await fetch(lxpBasisUrl(w) + '/v3/printjobs/' + encodeURIComponent(id), { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(koerper) });
  const txt = await r.text();
  let j = null; try{ j = JSON.parse(txt); }catch(_){}
  if(!r.ok || (j && j.status && +j.status >= 400)){
    const grund = (j && (j.message || j.error || (j.data && j.data.message))) || txt.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 200);
    const e = new Error('LetterXpress hat abgelehnt (HTTP ' + r.status + '): ' + grund);
    e.abgelehnt = true; throw e;
  }
  return j;
}

// Ein Eintrag e: {renu, name (Dateiname ohne .pdf), ziel, typ:'ORIG'|'2A'|'M1'..,
//                pdfBlob? | pdfItemId?}
// Prueft frisch in der Uebersicht, ob schon verschickt wurde (LXP-Kennzeichen
// wie am PC), fragt EINMAL fuer alle, schickt und vermerkt den Versand.
async function betaBriefeVersenden(liste, frage, opts){
  frage = frage || betaFrage; opts = opts || {};
  const token = await msGraphTokenHolen();
  if(!token) throw new Error('Bitte zuerst bei Microsoft/OneDrive anmelden.');
  const ziel = liste[0].ziel;
  const ini = iniCacheLaden() || await iniVonOneDriveLaden().then(()=> iniCacheLaden());
  const werte = (ini && ini.werte) || {};
  const test = typeof opts.testErzwingen === 'boolean' ? opts.testErzwingen : briefTestmodus(werte, ziel);
  const ue = await schritt('Rechnungsübersicht lesen', ()=> uebersichtLadenRepariert(token, ziel, frage));
  const ana = uebersichtAuswerten(ue);
  const offen = [], schon = [], fehlt = [];
  for(const e of liste){
    const z = ana.nachRenu.get(e.renu);
    if(!z){ fehlt.push(e); continue; }
    const u = String(z.v[20] == null ? '' : z.v[20]);
    if(lxpFlagVorhanden(u, lxpFlagFuerTyp(e.typ))) schon.push(e); else offen.push({ e, z });
  }
  if(!offen.length){
    throw new Error(schon.length ? 'Laut Übersicht ist alles Ausgewählte bereits verschickt – es wird kein zweiter Brief verschickt.'
                                 : 'Die Rechnung steht nicht in der Übersicht – es wurde nichts verschickt.');
  }
  // PDFs laden (fuer Seitenzahl und Versand)
  for(const o of offen){
    if(!o.e.pdfBlob){
      const buf = await schritt('PDF laden', ()=> o.e.pdfItemId ? graphItemLaden(token, o.e.pdfItemId) : graphDateiLaden(token, ziel.ordner + '/' + o.e.name + '.pdf'));
      o.e.pdfBlob = new Blob([buf], { type:'application/pdf' });
    }
    o.seiten = pdfSeitenZaehlen(new Uint8Array(await o.e.pdfBlob.arrayBuffer()));
  }
  const modusTxt = test ? 'TESTMODUS – es wird NICHTS wirklich verschickt.' : 'LIVE – die Briefe werden ECHT gedruckt und verschickt und kosten Geld!';
  const terminTxt = opts.versandDatumIso ? '\nVersand geplant zum ' + opts.versandDatumIso.split('-').reverse().join('.') + '.' : '';
  const mehrseitig = offen.some(o=> o.seiten > 1);
  const listeTxt = offen.map(o=> '• ' + o.e.name + (o.seiten ? ' (' + o.seiten + (o.seiten === 1 ? ' Seite)' : ' Seiten)') : '')).join('\n');
  const text = (offen.length === 1 ? 'Diesen Brief' : 'Diese ' + offen.length + ' Briefe') + ' per LetterXpress verschicken?\n\n' + listeTxt + '\n' +
    (schon.length ? '\n' + schon.length + ' bereits verschickte werden übersprungen.' : '') + terminTxt + '\n' + modusTxt +
    (mehrseitig ? '\n\nHinweis: mehrseitig – jede weitere Seite kostet bei LetterXpress etwas extra.' : '');
  if(!await frage(text, offen.length === 1 ? 'Senden' : 'Alle senden', 'Abbrechen')) return { abgebrochen: true, test };
  const ergebnis = { test, gesendet: [], fehler: [], uebersprungen: schon.length };
  const uNeu = new Map(); // Zeile -> aktuelles U (mehrere Kennzeichen in einer Zeile)
  const sid = await xlSitzung(token, ue.basis);
  try{
    for(const o of offen){
      let antwort;
      try{
        antwort = await lxpBriefSenden(o.e.pdfBlob, o.e.name, test, opts.versandDatumIso);
      }catch(err){ ergebnis.fehler.push(o.e.name + ': ' + (err.message || err)); continue; }
      try{
        const bisher = uNeu.has(o.z.nr) ? uNeu.get(o.z.nr) : String(o.z.v[20] == null ? '' : o.z.v[20]);
        const flag = lxpFlagFuerTyp(o.e.typ);
        const id = antwort && antwort.data && antwort.data.id != null ? String(antwort.data.id) : '';
        const plan = opts.versandDatumIso ? { datum: opts.versandDatumIso, id, modus: test ? 'test' : 'live' } : null;
        uNeu.set(o.z.nr, await uebersichtVersandVermerken(token, ue, sid, o.z.nr, bisher, flag, flag === 'LXP:1', plan));
        ergebnis.gesendet.push(o.e);
      }catch(err){ ergebnis.fehler.push(o.e.name + ': verschickt, aber nicht vermerkt (' + (err.message || err) + ')'); }
    }
  } finally { await xlSitzungEnde(token, ue.basis, sid); }
  ergebnis.zeile = offen[0].z.nr; ergebnis.seiten = offen[0].seiten;
  return ergebnis;
}
// Geplanten Brief ersetzen: LetterXpress erlaubt kein Aendern des Datums,
// Stornieren aber jederzeit vor dem Versand. Deshalb: alten Auftrag
// stornieren, Vermerk entfernen, Brief (ggf. neue Fassung) mit dem Datum neu
// uebergeben. Neu uebergeben wird nur, wenn das Stornieren geklappt hat --
// es geht also nie zweimal ein Brief raus.
async function versandGeplantErsetzen(token, ziel, renu, typ, name, plan, neuIso, pdfBlob, pdfItemId){
  await lxpAuftrag('DELETE', plan.id, plan.modus);
  const ue = await uebersichtLadenRepariert(token, ziel, betaFrage);
  const z = uebersichtAuswerten(ue).nachRenu.get(renu);
  if(!z) throw new Error('Der alte Auftrag ist storniert, die Rechnung steht aber nicht mehr in der Übersicht – bitte neu senden.');
  const u = String(z.v[20] == null ? '' : z.v[20]);
  const schl = versandSchluessel(typ), plaene = versandPlaene(u);
  delete plaene[schl];
  const neuU = versandPlaeneSetzen(lxpFlagEntfernenText(u, lxpFlagFuerTyp(typ)), plaene);
  const sid = await xlSitzung(token, ue.basis);
  try{
    const schutz = await blattSchutzAufheben(token, ue, sid);
    try{
      await gx(token, 'PATCH', zelle(ue, 'U' + z.nr), { values: [[neuU]] }, sid);
      if(schl === '1') await gx(token, 'PATCH', zelle(ue, 'R' + z.nr) + '/format/font', { bold: false }, sid);
    } finally { await blattSchutzWiederherstellen(token, ue, schutz, sid); }
  } finally { await xlSitzungEnde(token, ue.basis, sid); }
  let r;
  try{ r = await betaBriefeVersenden([{ renu, name, ziel, typ, pdfBlob: pdfBlob || null, pdfItemId: pdfItemId || null }], async ()=> true, { versandDatumIso: neuIso, testErzwingen: plan.modus === 'test' }); }
  catch(err){ r = { gesendet: [], fehler: [err.message || String(err)] }; }
  if(!r.gesendet.length){
    const e = new Error('Der bisherige Auftrag ist storniert, die neue Übergabe hat aber nicht geklappt (' + (r.fehler || []).join('; ') + '). Bitte den Brief erneut über „Versand planen“ übergeben.');
    e.storniert = true; throw e;
  }
  return r;
}

// ---------- Windows-1252 lesen/schreiben ----------
const CP1252_SONDER = {0x20AC:0x80,0x201A:0x82,0x0192:0x83,0x201E:0x84,0x2026:0x85,0x2020:0x86,0x2021:0x87,
  0x02C6:0x88,0x2030:0x89,0x0160:0x8A,0x2039:0x8B,0x0152:0x8C,0x017D:0x8E,0x2018:0x91,0x2019:0x92,
  0x201C:0x93,0x201D:0x94,0x2022:0x95,0x2013:0x96,0x2014:0x97,0x02DC:0x98,0x2122:0x99,0x0161:0x9A,
  0x203A:0x9B,0x0153:0x9C,0x017E:0x9E,0x0178:0x9F};
function cp1252Kodieren(text){
  const out = new Uint8Array(text.length);
  for(let i=0;i<text.length;i++){
    const c = text.charCodeAt(i);
    if(c < 0x80 || (c >= 0xA0 && c <= 0xFF)) out[i] = c;
    else if(CP1252_SONDER[c] !== undefined) out[i] = CP1252_SONDER[c];
    else out[i] = 0x3F; // '?' -- in ANSI nicht darstellbar
  }
  return out;
}
function iniDekodieren(buffer){
  const b = new Uint8Array(buffer);
  if(b.length >= 3 && b[0]===0xEF && b[1]===0xBB && b[2]===0xBF) return new TextDecoder('utf-8').decode(b.subarray(3));
  if(b.length >= 2 && b[0]===0xFF && b[1]===0xFE) return new TextDecoder('utf-16le').decode(b.subarray(2));
  return new TextDecoder('windows-1252').decode(b);
}
function iniParsen(text){
  const zeilen = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n');
  if(zeilen.length && zeilen[zeilen.length-1]==='') zeilen.pop();
  const werte = {};
  zeilen.forEach(z=>{
    const p = z.indexOf('=');
    if(p > 0){
      const k = z.slice(0,p).trim().toUpperCase();
      if(!(k in werte)) werte[k] = z.slice(p+1); // wie HTA/VBA: erster Treffer zaehlt, Wert ungetrimmt
    }
  });
  return {zeilen, werte};
}

// ---------- OneDrive-Zugriff ----------
async function iniHerunterladen(token){
  const antwort = await fetch(msGraphPfadUrl(MSGRAPH_PFAD_INI) + '/content', { headers:{ Authorization:'Bearer '+token }, cache:'no-store' });
  if(antwort.status === 404) return {vorhanden:false, buffer:null, text:'', ...iniParsen('')};
  if(!antwort.ok) throw new Error('einstellungen.ini konnte nicht gelesen werden (HTTP '+antwort.status+')');
  const buffer = await antwort.arrayBuffer();
  const text = iniDekodieren(buffer);
  return {vorhanden:true, buffer, text, ...iniParsen(text)};
}
async function msGraphOrdnerSicherstellen(token, pfad){
  const teile = pfad.split('/');
  const name = teile.pop();
  const eltern = teile.join('/');
  try{
    await fetch(msGraphPfadUrl(eltern) + '/children', {
      method:'POST',
      headers:{ Authorization:'Bearer '+token, 'Content-Type':'application/json' },
      body: JSON.stringify({ name, folder:{}, '@microsoft.graph.conflictBehavior':'fail' })
    }); // 409 = existiert bereits -- in Ordnung
  }catch(e){ /* naechster Schritt meldet ggf. den eigentlichen Fehler */ }
}
async function msGraphDateiHochladen(token, pfad, inhalt, contentType){
  const antwort = await fetch(msGraphPfadUrl(pfad) + '/content', {
    method:'PUT',
    headers:{ Authorization:'Bearer '+token, 'Content-Type': contentType || 'application/octet-stream' },
    body: inhalt
  });
  if(!antwort.ok) throw new Error('Hochladen fehlgeschlagen: '+pfad+' (HTTP '+antwort.status+')');
  return antwort.json().catch(()=>null);
}

// Schreibt die geaenderten Eintraege (Objekt KEY -> Textwert) in die ini.
// basisWerte = Stand, auf dem die Bearbeitung beruht (fuer Konflikterkennung).
async function iniAenderungenSchreiben(aenderungen, basisWerte){
  const token = await msGraphTokenHolen();
  if(!token) throw new Error('Keine Microsoft-Anmeldung aktiv.');
  const frisch = await iniHerunterladen(token);
  const keys = Object.keys(aenderungen);
  if(!keys.length) return {geschrieben:0};
  // Am PC zwischenzeitlich anders geaendert?
  const konflikte = keys.filter(k=>{
    const vorher = (basisWerte && k in basisWerte) ? basisWerte[k] : undefined;
    const jetzt = frisch.werte[k];
    return vorher !== jetzt && jetzt !== aenderungen[k];
  });
  if(konflikte.length){
    const ok = await betaFrage('Diese Einträge wurden inzwischen am PC geändert:\n\n' + konflikte.join(', ') +
                       '\n\nTrotzdem mit den Werten aus der App überschreiben?', 'Überschreiben', 'Abbrechen');
    if(!ok) return {abgebrochen:true};
  }
  // Sicherung des bisherigen Stands (seit dem automatischen Speichern
  // hoechstens alle 30 Minuten, sonst entstuende je Feld eine Sicherung)
  const letzteSicherung = Number(LS.get('ini_sicherung_am', 0)) || 0;
  if(frisch.vorhanden && frisch.buffer && Date.now() - letzteSicherung > 30 * 60 * 1000){
    LS.set('ini_sicherung_am', Date.now());
    const d = new Date(), p2 = n=>String(n).padStart(2,'0');
    const stempel = d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+'_'+p2(d.getHours())+'-'+p2(d.getMinutes())+'-'+p2(d.getSeconds());
    await msGraphOrdnerSicherstellen(token, MSGRAPH_PFAD_INI_BACKUPS);
    await msGraphDateiHochladen(token, MSGRAPH_PFAD_INI_BACKUPS + '/einstellungen_' + stempel + '_vor_App.ini', frisch.buffer);
  }
  // Zeilen ersetzen bzw. anhaengen -- alle anderen Zeilen bleiben byte-gleich
  const offen = new Set(keys);
  const zeilen = frisch.zeilen.map(z=>{
    const p = z.indexOf('=');
    if(p > 0){
      const k = z.slice(0,p).trim().toUpperCase();
      if(offen.has(k)){ offen.delete(k); return k + '=' + aenderungen[k]; }
    }
    return z;
  });
  offen.forEach(k=> zeilen.push(k + '=' + aenderungen[k]));
  const text = zeilen.join('\r\n') + '\r\n';
  await msGraphDateiHochladen(token, MSGRAPH_PFAD_INI, cp1252Kodieren(text), 'text/plain');
  iniCacheSpeichern(iniParsen(text).werte);
  return {geschrieben: keys.length};
}

// ---------- Verbindungstest (Fehlersuche) ----------
// Fuehrt jeden OneDrive-Zugriff, den App und Beta brauchen, einzeln aus und
// zeigt Statuscode, Microsoft-Fehlertext und Dauer. "keine Antwort" heisst:
// der Browser hat gar keine (lesbare) Antwort bekommen -- Netz weg, Anfrage
// blockiert oder Microsoft hat ohne CORS-Freigabe geantwortet.
async function graphFehlerText(r){
  try{
    const t = await r.text();
    try{
      const j = JSON.parse(t);
      const e = j && j.error;
      if(e){
        let s = (e.code || '') + (e.message ? ': ' + e.message : '');
        if(e.innerError && e.innerError.code && e.innerError.code !== e.code) s += ' [' + e.innerError.code + ']';
        return s;
      }
    }catch(_){}
    return t.slice(0, 200);
  }catch(_){ return ''; }
}

        zeile = '✓ ' + htmlEsc(name) + ' <span style="color:var(--text-schwach);">(' + sek + (info ? ', ' + htmlEsc(String(info)) : '') + ')</span>';
      } else {
        zeile = '✗ <b>' + htmlEsc(name) + '</b>: HTTP ' + r.status + ' <span style="font-size:12px;">' + htmlEsc(await graphFehlerText(r)) + '</span> (' + sek + ')';
      }
    }catch(e){
      const sek = ((performance.now() - t0)/1000).toFixed(1) + ' s';
      zeile = '✗ <b>' + htmlEsc(name) + '</b>: keine Antwort (' + htmlEsc(e.message || String(e)) + ', ' + sek + ')';
    }
    zeilen.push(zeile);
  }
  // Schreibzugriff auf die Excel-Datei: nur eine Sitzung OHNE Speichern oeffnen und schliessen
  zeigen('Übersicht (Excel: Schreibsitzung)');
  {
    const t0 = performance.now();
    try{
      const r = await fetch(uebersicht + '/workbook/createSession', { method:'POST', headers:{Authorization:'Bearer ' + token, 'Content-Type':'application/json'}, body: JSON.stringify({persistChanges:false}) });
      const sek = ((performance.now() - t0)/1000).toFixed(1) + ' s';
      if(r.ok){
        const sid = (await r.json()).id;
        fetch(uebersicht + '/workbook/closeSession', { method:'POST', headers:{Authorization:'Bearer ' + token, 'workbook-session-id': sid} }).catch(()=>{});
        zeilen.push('✓ Übersicht (Excel: Schreibsitzung) <span style="color:var(--text-schwach);">(' + sek + ', nichts geändert)</span>');
      } else zeilen.push('✗ <b>Übersicht (Excel: Schreibsitzung)</b>: HTTP ' + r.status + ' <span style="font-size:12px;">' + htmlEsc(await graphFehlerText(r)) + '</span> (' + sek + ')');
    }catch(e){
      zeilen.push('✗ <b>Übersicht (Excel: Schreibsitzung)</b>: keine Antwort (' + htmlEsc(e.message || String(e)) + ')');
    }
  }
  zeigen('Übersicht: Fenster ausgeblendet?');
  try{
    const ausgeblendet = await uebersichtAusgeblendet(token, MSGRAPH_PFAD_UEBERSICHT);
    zeilen.push(ausgeblendet
      ? '✗ <b>Übersicht ist mit ausgeblendetem Fenster gespeichert</b> – Microsoft kann sie so nicht öffnen. Die Rechnungsverwaltung bietet das Reparieren beim Öffnen an.'
      : '✓ Übersicht nicht ausgeblendet');
  }catch(e){ zeilen.push('✗ <b>Übersicht (Datei prüfen)</b>: ' + htmlEsc(e.message || String(e))); }
  zeilen.push('<span style="font-size:12px;">Bitte davon einen Screenshot schicken.</span>');
  zeigen('');
}

function iniFeldWertFuerAnzeige(f, werte){
  const roh = (werte && f.k in werte) ? werte[f.k] : (f.standard !== undefined ? f.standard : '');
  if(f.typ === 'bool') return String(roh).trim() === '1';
  if(f.typ === 'mehrzeilig') return String(roh).split('~NL~').join('\n');
  return String(roh);
}

// Einstellungen: Abschnitte ein-/ausklappbar (Zustand bleibt gemerkt)
function betaEinstellungenEinklappen(){
  let offen = [];
  try{ offen = JSON.parse(localStorage.getItem('einst_offen') || '[]') || []; }catch(_){ offen = []; }
  document.querySelectorAll('#app .abschnitt').forEach(ab=>{
    const kopf = ab.querySelector(':scope > .trennlinie');
    if(!kopf || ab.classList.contains('einklappbar')) return;
    const titel = kopf.textContent.replace(/BETA/g, '').trim();
    const inhalt = document.createElement('div');
    inhalt.className = 'abschnitt-inhalt';
    while(kopf.nextSibling) inhalt.appendChild(kopf.nextSibling);
    ab.appendChild(inhalt);
    ab.classList.add('einklappbar');
    kopf.setAttribute('role', 'button'); kopf.tabIndex = 0;
    const zu = !offen.includes(titel);
    ab.classList.toggle('zu', zu); kopf.setAttribute('aria-expanded', String(!zu));
    const umschalten = ()=>{
      const jetztZu = !ab.classList.contains('zu');
      ab.classList.toggle('zu', jetztZu); kopf.setAttribute('aria-expanded', String(!jetztZu));
      offen = offen.filter(t=> t !== titel); if(!jetztZu) offen.push(titel);
      try{ localStorage.setItem('einst_offen', JSON.stringify(offen)); }catch(_){}
    };
    kopf.onclick = umschalten;
    kopf.onkeydown = (ev)=>{ if(ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); umschalten(); } };
  });
}

function betaIniWerteAusFormular(){
  const werte = {};
  INI_FELDER.forEach(f=>{
    const el = document.getElementById('ini_' + f.k);
    if(!el) return;
    if(f.typ === 'bool') werte[f.k] = el.checked ? '1' : '0';
    else if(f.typ === 'mehrzeilig') werte[f.k] = el.value.replace(/\r/g,'').split('\n').map(s=>s.trimEnd()).join('~NL~').replace(/(~NL~)+$/,'');
    else werte[f.k] = el.value.replace(/[\r\n]+/g,' ').trim();
  });
  // App-eigene allgemeine Einstellungen, die der PC ebenfalls kennt
  const e = ladeEinstellungen();
  werte.PRAXISADRESSE = (e.praxisadresse || '').trim();
  werte.REISE_BASIS_LUFTLINIE = e.reiseBasisLuftlinie ? '1' : '0';
  return werte;
}

function betaIniFormularFuellen(werte){
  INI_FELDER.forEach(f=>{
    const el = document.getElementById('ini_' + f.k);
    if(!el) return;
    const v = iniFeldWertFuerAnzeige(f, werte);
    if(f.typ === 'bool') el.checked = v; else el.value = v;
  });
}

function betaEinstellungenWiring(){
  const meldung = (txt, gut)=>{
    document.querySelectorAll('.ini-meldung').forEach(el=>{
      if(!txt){ el.classList.remove('aktiv'); el.innerHTML=''; return; }
      el.innerHTML = txt; el.classList.add('aktiv');
      el.style.color = gut ? 'var(--text)' : '';
    });
  };
  const statusText = (t)=> document.querySelectorAll('.ini-status').forEach(el=> el.textContent = t);
  const statusSetzen = ()=>{
    const c = iniCacheLaden();
    if(c) statusText('Stand aus OneDrive: ' + new Date(c.geladenAm).toLocaleString('de-DE'));
  };
  const cache = iniCacheLaden();
  betaIniBasis = cache ? {...cache.werte} : null;
  betaIniBearbeitet = false;
  document.querySelectorAll('[id^="ini_"]').forEach(el=>{
    el.addEventListener('input', ()=>{ betaIniBearbeitet = true; });
    el.addEventListener('change', ()=>{ betaIniBearbeitet = true; });
  });
  document.querySelectorAll('.ini-bool').forEach(z=>{
    if(z.id === 'zeileBetaEchtbetrieb') return; // eigener Schalter, siehe unten
    z.onclick = (ev)=>{ if(ev.target.tagName!=='INPUT'){ const cb=document.getElementById(z.dataset.for); cb.checked=!cb.checked; betaIniBearbeitet=true; } };
  });
  // ---- Ablage: Testablage / Echtbetrieb ----
  const ablageErgebnis = (html)=>{ const el=document.getElementById('ablageErgebnis'); if(el){ el.innerHTML = html; el.style.display = html?'block':'none'; } };
  const echtSetzen = async (an)=>{
    const cb = document.getElementById('chkBetaEchtbetrieb');
    if(an && !await betaFrage('Echtbetrieb einschalten?\n\nDie Beta schreibt dann in die ECHTE Rechnungsübersicht und legt Word + PDF im echten Ordner „fertige Rechnungen“ ab – genau wie der PC. Briefe gehen raus, sobald „Testmodus“ beim Briefversand aus ist.\n\nBitte die HTA am PC vorher schließen.', 'Einschalten', 'Abbrechen')){
      cb.checked = false; return;
    }
    const e = ladeEinstellungen(); e.betaEchtbetrieb = !!an; speichereEinstellungen(e);
    cb.checked = !!an;
    ablageErgebnis(an ? '<b style="color:#c0392b;">Echtbetrieb ist an.</b>' : 'Testablage ist aktiv.');
  };
  if(document.getElementById('chkBetaEchtbetrieb')){
  document.getElementById('chkBetaEchtbetrieb').onchange = (ev)=> echtSetzen(ev.target.checked);
  document.getElementById('zeileBetaEchtbetrieb').onclick = (ev)=>{
    if(ev.target.tagName === 'INPUT') return;
    echtSetzen(!document.getElementById('chkBetaEchtbetrieb').checked);
  };
  }
  if(document.getElementById('btnUebersichtEinblenden')) document.getElementById('btnUebersichtEinblenden').onclick = async ()=>{
    const ablageErgebnis = (html)=>{ const el=document.getElementById('reparaturErgebnis'); if(el){ el.innerHTML = html; el.style.display = html?'block':'none'; } };
    const btn = document.getElementById('btnUebersichtEinblenden');
    const token = await msGraphTokenHolen();
    if(!token){ ablageErgebnis('Bitte zuerst bei Microsoft/OneDrive anmelden (Abschnitt OneDrive).'); return; }
    btn.disabled = true;
    try{
      ablageErgebnis('Prüfe die Übersicht …');
      if(!await uebersichtAusgeblendet(token, MSGRAPH_PFAD_UEBERSICHT)){
        ablageErgebnis('✓ Die Übersicht ist nicht ausgeblendet – nichts zu tun.'); return;
      }
      if(!await betaFrage('Die Rechnungsübersicht ist mit ausgeblendetem Fenster gespeichert – deshalb kann Microsoft sie nicht öffnen.\n\nJetzt reparieren? Es wird nur „ausgeblendet“ entfernt, sonst nichts geändert.\n\nAm besten ist die HTA am PC dabei geschlossen (die alte HTA blendet sie sonst beim nächsten Speichern wieder aus).', 'Reparieren', 'Abbrechen')){
        ablageErgebnis('Nicht repariert.'); return;
      }
      ablageErgebnis('Repariere …');
      await uebersichtEinblenden(token, MSGRAPH_PFAD_UEBERSICHT);
      alleRechnungenCache = null;
      ablageErgebnis('✓ Repariert. Die Rechnungsverwaltung sollte jetzt wieder laden (dort „Neu laden“ tippen).');
    }catch(e){ ablageErgebnis('✗ ' + htmlEsc(e.message || String(e))); }
    finally{ btn.disabled = false; }
  };
  if(document.getElementById('btnTestUebersichtNeu')) document.getElementById('btnTestUebersichtNeu').onclick = async ()=>{
    const btn = document.getElementById('btnTestUebersichtNeu');
    const token = await msGraphTokenHolen();
    if(!token){ ablageErgebnis('Bitte zuerst bei Microsoft/OneDrive anmelden (Abschnitt OneDrive).'); return; }
    if(!await betaFrage('Die Test-Übersicht im Ordner „Beta-Test“ durch eine frische Kopie der echten Übersicht ersetzen?', 'Ersetzen', 'Abbrechen')) return;
    btn.disabled = true;
    try{
      await testUebersichtSicherstellen(token, true, t=> ablageErgebnis(htmlEsc(t)));
      ablageErgebnis('✓ Test-Übersicht neu angelegt („Beta-Test/' + htmlEsc(BETA_TEST_UEBERSICHT.split('/').pop()) + '“).');
    }catch(e){ ablageErgebnis('✗ ' + htmlEsc(e.message || String(e))); }
    finally{ btn.disabled = false; }
  };
  document.querySelectorAll('.ini-zeigen').forEach(b=>{
    b.onclick = ()=>{ const el=document.getElementById(b.dataset.for); const vis = el.type==='password'; el.type = vis?'text':'password'; b.textContent = vis?'verbergen':'zeigen'; };
  });

  const laden = async (stumm)=>{
    try{
      if(!stumm) meldung('Lade einstellungen.ini ...', true);
      const ini = await iniVonOneDriveLaden();
      betaIniBasis = {...ini.werte};
      if(!betaIniBearbeitet || !stumm){ betaIniFormularFuellen(ini.werte); betaIniBearbeitet = false; }
      const pa = document.getElementById('txtPraxisadresse'); if(pa) pa.value = ladeEinstellungen().praxisadresse || '';
      const rb = document.getElementById('chkReiseBasisLuftlinie'); if(rb) rb.checked = !ladeEinstellungen().reiseBasisLuftlinie;
      statusSetzen();
      if(!stumm) meldung(ini.vorhanden ? 'Geladen.' : 'Es gibt noch keine einstellungen.ini in OneDrive -- sie wird beim Speichern angelegt.', true);
    }catch(e){ if(!stumm) meldung(htmlEsc(e.message || String(e))); }
  };
  if(document.getElementById('btnIniLaden')) document.getElementById('btnIniLaden').onclick = async ()=>{
    if(betaIniBearbeitet && !await betaFrage('Ungespeicherte Änderungen hier gehen verloren. Trotzdem neu laden?', 'Neu laden', 'Abbrechen')) return;
    betaIniBearbeitet = false; laden(false);
  };

  // Automatisch speichern: kurz nach jeder Aenderung (Feld verlassen, Haken
  // setzen) werden nur die geaenderten Eintraege in die ini geschrieben.
  let speichertGerade = false, nochmal = false, timer = null, stand = null;
  const speichern = async ()=>{
    if(speichertGerade){ nochmal = true; return; }
    speichertGerade = true;
    try{
      if(msGraphStatus !== 'angemeldet'){ meldung('Nicht bei Microsoft/OneDrive angemeldet – Änderungen werden noch nicht gespeichert.'); return; }
      if(!betaIniBasis){ const ini = await iniVonOneDriveLaden(); betaIniBasis = {...ini.werte}; }
      const neu = stand || betaIniWerteAusFormular();
      const aenderungen = {};
      Object.keys(neu).forEach(k=>{
        const f = INI_FELDER.find(x=>x.k===k);
        const alt = (k in betaIniBasis) ? betaIniBasis[k] : (f && f.standard !== undefined ? f.standard : (k==='REISE_BASIS_LUFTLINIE' ? '0' : ''));
        const altVergleich = (f && f.typ==='bool') || k==='REISE_BASIS_LUFTLINIE' ? (String(alt).trim()==='1'?'1':'0') : alt;
        if(neu[k] !== altVergleich) aenderungen[k] = neu[k];
      });
      if(!Object.keys(aenderungen).length){ betaIniBearbeitet = false; return; }
      statusText('Speichere …');
      const erg = await iniAenderungenSchreiben(aenderungen, betaIniBasis);
      if(erg.abgebrochen){ meldung('Nicht gespeichert (am PC zwischenzeitlich geändert).'); statusSetzen(); return; }
      const c = iniCacheLaden(); betaIniBasis = c ? {...c.werte} : betaIniBasis;
      betaIniBearbeitet = false;
      meldung('');
      statusText('✓ Gespeichert ' + new Date().toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'}));
    }catch(e){
      meldung('Nicht gespeichert: ' + htmlEsc(e.message || String(e)));
      statusSetzen();
    }finally{
      speichertGerade = false;
      if(nochmal){ nochmal = false; speichern(); }
    }
  };
  // Werte gleich beim Aendern festhalten -- falls die Seite verlassen wird,
  // bevor gespeichert ist, sind die Felder sonst schon weg
  const spaeter = (ms)=>{ if(document.getElementById('btnTestLxp')) stand = betaIniWerteAusFormular(); clearTimeout(timer); timer = setTimeout(()=>{ timer = null; speichern(); }, ms); };
  document.querySelectorAll('[id^="ini_"]').forEach(el=>{
    el.addEventListener('change', ()=> spaeter(400));
    if(el.type !== 'checkbox') el.addEventListener('input', ()=> spaeter(2500));
  });
  document.querySelectorAll('.ini-bool').forEach(z=> z.addEventListener('click', ()=> spaeter(400)));
  // Startadresse und Wegegeld-Regel (Abschnitt oben) kennt der PC ebenfalls
  ['chkReiseBasisLuftlinie', 'txtPraxisadresse'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.addEventListener(id === 'txtPraxisadresse' ? 'blur' : 'change', ()=> setTimeout(()=> spaeter(400), 0));
  });
  // beim Verlassen der Seite / App noch schnell sichern
  const sofort = ()=>{ if(timer && document.getElementById('btnTestLxp')){ clearTimeout(timer); timer = null; speichern(); } };
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState === 'hidden') sofort(); });
  window.betaIniSofortSpeichern = sofort;

  // ---- Funktionstests ----
  const ergebnisIn = (id)=> (html)=>{ const el=document.getElementById(id); if(el){ el.innerHTML = html; el.style.display = html?'block':'none'; } };
  document.getElementById('btnTestLxp').onclick = async ()=>{
    const ergebnis = ergebnisIn('testErgebnisLxp');
    const w = betaIniWerteAusFormular();
    if(!w.BRIEF_BENUTZER || !w.BRIEF_APIKEY){ ergebnis('Bitte zuerst LetterXpress-Benutzername und API-Key eintragen (oder vom PC laden).'); return; }
    if(!navigator.onLine){ ergebnis('Keine Internetverbindung.'); return; }
    ergebnis('Teste Verbindung zu LetterXpress ...');
    try{
      // Absichtlich OHNE Brief (nur Anmeldedaten, Testmodus): LetterXpress
      // antwortet mit einer Fehlermeldung, es entsteht kein Auftrag. Wichtig ist
      // nur, OB der Browser die Antwort ueberhaupt lesen darf (CORS).
      const basis = lxpBasisUrl(w);
      const ueberWeiterleitung = true; // direkter Aufruf ist vom Browser aus nicht moeglich (CORS)
      ergebnis('Teste Verbindung zu LetterXpress ' + (ueberWeiterleitung ? 'über die Weiterleitung' : 'direkt') + ' ...');
      const r = await fetch(basis + '/v3/printjobs', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({auth:{username:w.BRIEF_BENUTZER, apikey:w.BRIEF_APIKEY, mode:'test'}})
      });
      const txt = (await r.text()).slice(0, 300);
      const anmeldungFalsch = r.status===401 || /unauthori/i.test(txt);
      if(ueberWeiterleitung && r.status===403 && /Nicht erlaubt/.test(txt)){
        ergebnis('<b>✗ Die Weiterleitung lehnt diese App ab</b> -- in der Azure-Funktion steht vermutlich eine andere erlaubte Adresse (ERLAUBTE_HERKUNFT) bzw. sie fehlt unter CORS.'); return;

// =====================================================================
// BETA: gemeinsame Liste "Rechnungen" + automatisches Hochladen
// =====================================================================
// Bei aktiver Microsoft-Anmeldung ersetzt EINE Liste die bisherigen zwei
// ("Lokale Rechnungen" + "Rechnungsverwaltung"): alle Zeilen der
// Rechnungsuebersicht (der aktiven Ablage: Testablage oder Echtbetrieb) plus
// die lokal gespeicherten Faelle, die noch nicht hochgeladen sind (markiert).
// "Hochladen" heisst: Word + PDF erstellen, in "fertige Rechnungen" ablegen,
// in die Uebersicht eintragen (betaRechnungErstellen). Das passiert
// automatisch nach dem Speichern in der Maske.
//
// Merkmale an einem lokalen Fall (zusaetzlich zu werte/positionen/...):
//   hochgeladen: {renu, ziel:'test'|'echt', am}  -- zuletzt erfolgreich hochgeladen
//   bezug:       {renu}                          -- gehoert zu dieser Uebersichtszeile
//   uploadFehler: Text                           -- letzter Fehlschlag
//   ausUebersicht: true                          -- nur zum Bearbeiten aus einer
//                                                   Uebersichtszeile angelegt

function betaGesamtAktiv(){ return msGraphStatus === 'angemeldet'; }
function betaZielKey(ziel){ return (ziel || betaZiel()).echt ? 'echt' : 'test'; }
function xlZeitText(v){
  if(typeof v === 'number' && v >= 0 && v < 1){
    const min = Math.round(v * 1440);
    return zz2(Math.floor(min / 60) % 24) + ':' + zz2(min % 60);
  }
  return String(v == null ? '' : v).trim();
}
function betaFallIndex(art, zeitstempel){
  return ladeFaelle(art).findIndex(f=> f && String(f.zeitstempel) === String(zeitstempel));
}
function betaFallAendern(art, zeitstempel, aendern){
  const arr = ladeFaelle(art);
  const i = arr.findIndex(f=> f && String(f.zeitstempel) === String(zeitstempel));
  if(i < 0) return;
  aendern(arr[i]);
  speichereFaelle(art, arr);
}

// ---------- Eigenes Fenster statt Browser-Popups (mit Ladeanimation) ----------
const betaOverlay = (()=>{
  let el = null, fort = 0;
  function bauen(){
    if(el) return el;
    el = document.createElement('div');
    el.className = 'beta-overlay';
    el.innerHTML = '<div class="beta-overlay-karte"><div class="beta-overlay-titel"></div>' +
      '<div class="beta-fortschritt"><div></div></div><div class="beta-spinner"></div>' +
      '<div class="beta-overlay-text"></div><div class="beta-overlay-knoepfe"></div></div>';
    document.body.appendChild(el);
    return el;
  }
  const t = (sel)=> bauen().querySelector(sel);
  function spinner(an){ t('.beta-spinner').style.display = an ? 'block' : 'none'; }
  return {
    zeigen(titel){
      bauen().classList.add('aktiv');
      t('.beta-overlay-titel').textContent = titel || '';
      t('.beta-overlay-text').textContent = '';
      t('.beta-overlay-knoepfe').innerHTML = '';
      this.fortschritt(0); spinner(true);
    },
    fortschritt(anteil){
      fort = Math.max(0, Math.min(1, anteil || 0));
      t('.beta-fortschritt').style.display = anteil === null ? 'none' : 'block';
      t('.beta-fortschritt > div').style.width = Math.round(fort * 100) + '%';
    },
    schritt(text){ t('.beta-overlay-text').textContent = text || ''; t('.beta-overlay-knoepfe').innerHTML = ''; spinner(true); },
    // Rueckfrage im eigenen Fenster -> Promise<boolean>
    frage(text, ja, nein){
      const offen = bauen().classList.contains('aktiv');
      if(!offen){ this.zeigen(''); this.fortschritt(null); }
      const vorher = t('.beta-overlay-text').textContent;
      return new Promise(res=>{
        spinner(false);
        t('.beta-overlay-text').textContent = text;
        const k = t('.beta-overlay-knoepfe');
        k.innerHTML = '';
        const b1 = document.createElement('button'); b1.type = 'button'; b1.className = 'btn-sekundaer'; b1.textContent = nein || 'Abbrechen';
        const b2 = document.createElement('button'); b2.type = 'button'; b2.className = 'btn-primaer'; b2.textContent = ja || 'OK';
        const fertig = (wert)=>{ k.innerHTML = ''; if(offen){ t('.beta-overlay-text').textContent = vorher; spinner(true); } else this.schliessen(); res(wert); };
        b1.onclick = ()=> fertig(false); b2.onclick = ()=> fertig(true);
        k.appendChild(b1); k.appendChild(b2);
      });
    },
    // Ergebnis anzeigen (HTML) mit Knoepfen [{label, akt, primaer}] -> Promise<akt>
    ergebnis(titel, html, knoepfe){
      bauen().classList.add('aktiv');
      if(titel !== null) t('.beta-overlay-titel').textContent = titel;
      spinner(false); this.fortschritt(null);
      t('.beta-overlay-text').innerHTML = html;
      const k = t('.beta-overlay-knoepfe');
      k.innerHTML = '';
      return new Promise(res=>{
        // von aussen aufloesbar (z.B. Fenster mit neuem Inhalt neu aufbauen)
        this.loesen = (akt)=>{ this.loesen = null; res(akt); };
        (knoepfe && knoepfe.length ? knoepfe : [{label:'OK', akt:'ok', primaer:true}]).forEach(kn=>{
          const b = document.createElement('button'); b.type = 'button';
          b.className = kn.primaer ? 'btn-primaer' : 'btn-sekundaer';
          b.textContent = kn.label;
          b.onclick = ()=>{ this.loesen = null; res(kn.akt); };
          k.appendChild(b);
        });
      });
    },
    meldung(text, titel){ return this.ergebnis(titel || '', htmlEsc(text).replace(/\n/g, '<br>'), [{label:'OK', akt:'ok', primaer:true}]).then(()=> this.schliessen()); },
    schliessen(){ if(el){ el.classList.remove('aktiv'); t('.beta-overlay-text').innerHTML = ''; t('.beta-overlay-knoepfe').innerHTML = ''; } }
  };
})();
const betaFrage = (text, ja, nein)=> betaOverlay.frage(text, ja, nein);

// ---------- Uebersichtszeile -> bearbeitbarer Fall ----------
// Liest alles, was am PC in der Uebersicht steht, zurueck in die Felder der
// Maske -- Positionen, km und ICD aus Spalte U ("POS:... | KM:... | ICD:...").
function uebersichtZeileAlsFall(z, ziel){
  const v = z.v, t = x=> String(x == null ? '' : x).trim();
  const art = t(v[0]).toUpperCase() === 'L' ? 'ls' : 'pt';
  const u = t(v[20]);
  const teil = (key)=>{ const m = new RegExp('(?:^|\\|)\\s*' + key + ':([^|]*)', 'i').exec(u); return m ? m[1].trim() : ''; };
  const positionen = teil('POS').split(',').map(s=> s.trim()).filter(Boolean)
    .map(p=> /^reise/i.test(p) ? 'REISE' : p);
  const diagnosen = [];
  if(art === 'pt'){
    const re = /\[([^\]]*)\]/g; let m;
    const katalog = (typeof ICD_KATALOG !== 'undefined') ? ICD_KATALOG : [];
    const icd = teil('ICD');
    while((m = re.exec(icd))){
      const stuecke = m[1].split(';');
      const code = stuecke[0].trim();
      const flags = stuecke.slice(1).map(s=> s.trim().toUpperCase()).join('');
      const k = katalog.find(e=> e[0] === code);
      diagnosen.push({ text: k ? icdEintragBauen(k[0], k[1]) : code, flags });
    }
  }
  const betrag = typeof v[15] === 'number' ? v[15].toFixed(2).replace('.', ',') : t(v[15]);
  const renu = t(v[16]);
  const w = {
    txtDatumExcel: xlDatumText(v[1]), txtZeitLS: xlZeitText(v[2]),
    txtName: t(v[5]) + ', ' + t(v[6]), txtGeda: xlDatumText(v[7]),
    txtPAdresse1: t(v[8]), txtPAdresse2: t(v[9]),
    txtKm: teil('KM'), txtKmFahrstrecke: teil('KM').replace(',', '.'), txtBetrag: betrag,
    txtDatum: xlDatumText(v[17]) || heuteText()
  };
  if(art === 'ls'){
    const idem = s=> /^idem$/i.test(s) ? '' : s;
    w.txtSterbedatum = xlDatumText(v[3]); w.txtTodeszeit = xlZeitText(v[4]);
    w.txtSterbeAdr1 = idem(t(v[10])); w.txtSterbeAdr2 = idem(t(v[11]));
    w.txtBName = t(v[12]); w.txtAdresse1 = t(v[13]); w.txtAdresse2 = t(v[14]);
  } else {
    w.diagnosen = diagnosen;
  }
  // Faktoren/Begruendungen/eigene Positionen aus Spalte U (FAK/BEG/EIG)
  const zus = betaUSegmenteLesen(u);
  // BEG ist vollstaendig: fehlt eine Ziffer der Rechnung dort, hatte sie keine Begruendung
  if(zus.details && zus.details.begruendungen) positionen.forEach(z=>{ const k = goaeNorm(z); if(zus.details.begruendungen[k] === undefined) zus.details.begruendungen[k] = ''; });
  const eigenePositionen = { ...betaEigeneSnapshot(art, positionen), ...zus.eigene };
  return { art, werte: w, positionen, rechnungsnummer: renu, eigenePositionen, positionsDetails: zus.details || undefined,
           zeitstempel: new Date().toISOString().replace('Z', '') + Math.floor(Math.random() * 1000) + 'Z',
           bezug: { renu }, ausUebersicht: true,
           hochgeladen: { renu, ziel: betaZielKey(ziel), am: new Date().toISOString() } };
}
