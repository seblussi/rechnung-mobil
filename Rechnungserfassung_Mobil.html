// ==========================================================
// Rechnungsnummern-Zähler ("Option 1 fortführen", siehe Absprache)
// ==========================================================
// Format exakt wie am PC (Modul1, RenuBilden/Aehnliches):
//   <Anfangsbuchstabe Nachname><Anfangsbuchstabe Vorname><yymmdd>-<Zaehler:000>
// Der Zaehler selbst kommt am PC aus LeseZaehlerAusUebersicht(): letzte
// Zeile der Spalte Q (Rech.-Nr.) in der Rechnungsübersicht, davon die
// letzten 3 Ziffern +1 -- KEIN Tages- oder Namens-Reset, ein einziger
// fortlaufender Zaehler über die gesamte Übersicht. Das Handy hat keinen
// Lesezugriff auf die (OneDrive-)Excel-Datei, daher wird der Zaehler hier
// lokal fortgeführt: einmalig aus der letzten Rechnungsnummer der
// Übersicht abgeglichen (Einstellungen), danach bei jedem "In
// Zwischenablage kopieren" pro neuem Fall automatisch weitergezählt.
function rnZaehlerAusEingabe(eingabe){
  // Nur die dreistellige laufende Nummer selbst wird abgefragt (z.B. "003"
  // statt der kompletten Rechnungsnummer "MS260115-003") -- alles andere
  // (Initialen, Datum) kennt/erzeugt die App je Fall ohnehin selbst.
  const bereinigt = (eingabe||'').trim().replace(/\D/g,'');
  if(!bereinigt) return null;
  const z = parseInt(bereinigt, 10);
  if(isNaN(z) || z<0 || z>999) return null;
  return z + 1;
}
function rnYymmdd(datumNorm){
  // datumNorm: normalisiert als "TT.MM.JJJJ" (siehe normalisiereDatum)
  const teile = (datumNorm||'').split('.');
  if(teile.length!==3) return '';
  const [tag, monat, jahr] = teile;
  if(jahr.length!==4) return '';
  return jahr.slice(-2) + monat.padStart(2,'0') + tag.padStart(2,'0');
}
function rechnungsnummerBerechnen(nachname, vorname, datumNorm, zaehler){
  const yymmdd = rnYymmdd(datumNorm);
  const initN = (nachname||'').trim().charAt(0).toUpperCase();
  const initV = (vorname||'').trim().charAt(0).toUpperCase();
  if(!yymmdd || !initN || !initV || !zaehler) return '';
  return initN + initV + yymmdd + '-' + String(zaehler).padStart(3,'0');
}
// Extrahiert die 3-stellige laufende Nummer aus einem Spalte-Q-Wert --
// analog zur gleichnamigen Funktion DreistelligeNummerAusRenu am PC (HTA).
// Normalfall ist "...-NNN" (Bindestrich + 3 Ziffern am Ende), aber es gibt
// einen Sonderfall, in dem in Spalte Q (noch) nur die reine 3-stellige Zahl
// ohne Bindestrich/Buchstaben steht (siehe RenuSpalteQReparierenFallsNoetig
// am PC). Ohne diesen zweiten Fall wuerde eine solche Zeile bei der
// Hoechststand-Ermittlung schlicht ignoriert, ihre Nummer also faelschlich
// als "noch frei" gelten -- und dieselbe Nummer koennte erneut vergeben
// werden (Dopplungsgefahr).
function renuZaehlerAusText(wert){
  const text = String(wert==null?'':wert).trim();
  const treffer = text.match(/-(\d{3})$/);
  if(treffer) return parseInt(treffer[1], 10);
  if(/^\d{3}$/.test(text)) return parseInt(text, 10);
  return null;
}
function rnZaehlerStandText(e){
  if(!e.rnNaechsterZaehler) return 'Noch kein Zähler-Abgleich hinterlegt -- die Rechnungsnummer (Spalte Q) wird beim Kopieren solange freigelassen wie bisher.';
  return `Nächste vergebene laufende Nummer: ${String(e.rnNaechsterZaehler).padStart(3,'0')} (z.B. "...-${String(e.rnNaechsterZaehler).padStart(3,'0')}"). Solange OneDrive-Sync aktiv ist, wird das automatisch live aus der Rechnungsübersicht ermittelt -- diese Angabe ist nur die Rückfallebene für den Ausnahmefall ohne Sync.${rnLiveFehler ? ' Letzter Live-Abgleich fehlgeschlagen: ' + rnLiveFehler + '.' : ''}`;
}

// Ermittelt LIVE per Graph-API die tatsaechlich hoechste in der
// Rechnungsuebersicht (Spalte Q, "...-NNN") bereits vergebene laufende
// Nummer und gibt die naechste freie zurueck. Das ist die eigentliche,
// autoritative Quelle -- der manuell in den Einstellungen gepflegte
// Zaehler (rnNaechsterZaehler) dient nur noch als Rueckfallebene fuer den
// Ausnahmefall, dass gerade kein Sync moeglich ist (z.B. offline). Gibt
// null zurueck, wenn die Liste live nicht lesbar ist (kein Login, kein
// Netz, Datei nicht erreichbar) -- der Aufrufer faellt dann auf den
// lokalen Zaehler zurueck.
let rnLiveFehler = '';        // Grund, falls der Live-Abgleich nicht moeglich war (fuer Anzeige/Diagnose)
let rnLiveFehlerGemeldet = false;
function spaltenBuchstabeZuNr(b){ let n=0; for(const c of b) n = n*26 + (c.charCodeAt(0)-64); return n; }
function xlsxLibLaden(){
  if(window.XLSX) return Promise.resolve();
  return new Promise((ok,fehl)=>{
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    sc.onload = ()=>ok(); sc.onerror = ()=>fehl(new Error('Excel-Leser nicht ladbar'));
    document.head.appendChild(sc);
  });
}
// Liest die Rechnungsuebersicht LIVE als Zeilen-Array (Spalte A = Index 0).
// 1. Weg: Graph-Excel-API; 2. Weg (Rueckfall): Datei per Graph laden und lokal
// mit SheetJS lesen. Bei Misserfolg: null und rnLiveFehler gesetzt.
// Name des ersten Blatts, falls die Excel-Schnittstelle funktioniert hat --
// null, wenn die Datei direkt gelesen werden musste (dann gibt es z.B. keine
// Fett-Abfrage fuer das Brief-Symbol).
let msGraphUebersichtBlatt = null;
async function graphFehlerKurz(res){
  try{
    const j = await res.json();
    return (j && j.error && (j.error.message || j.error.code)) ? ': ' + (j.error.message || j.error.code) : '';
  }catch(e){ return ''; }
}
// Excel speichert Datumsangaben teils als Zahl (Tage seit 30.12.1899) --
// fuer Anzeige und Fingerabdruck als TT.MM.JJJJ.
function uebersichtDatumText(v){
  if(typeof v === 'number' && v >= 1 && v < 2958466){
    const d = new Date(Date.UTC(1899, 11, 30) + Math.round(v) * 86400000);
    return String(d.getUTCDate()).padStart(2,'0') + '.' + String(d.getUTCMonth()+1).padStart(2,'0') + '.' + d.getUTCFullYear();
  }
  return String(v==null ? '' : v).trim();
}
async function msGraphUebersichtZeilenRoh(){
  rnLiveFehler = '';
  msGraphUebersichtBlatt = null;
  if(msGraphStatus!=='angemeldet'){ rnLiveFehler = 'nicht bei Microsoft angemeldet'; return null; }
  let token = null;
  try{ token = await msGraphTokenHolen(); }catch(e){}
  if(!token){ rnLiveFehler = 'Anmelde-Token nicht erneuerbar (in den Einstellungen neu anmelden)'; return null; }
  const basisUrl = msGraphPfadUrl(MSGRAPH_PFAD_UEBERSICHT);
  try{
    const wsRes = await fetch(basisUrl + '/workbook/worksheets?$select=name', { headers: { Authorization: 'Bearer ' + token } });
    if(wsRes.ok){
      const wsDaten = await wsRes.json();
      const blattName = wsDaten.value && wsDaten.value[0] && wsDaten.value[0].name;
      if(blattName){
        const rangeUrl = basisUrl + "/workbook/worksheets('" + encodeURIComponent(blattName) +
          "')/usedRange(valuesOnly=true)?$select=values,address";
        const rangeRes = await fetch(rangeUrl, { headers: { Authorization: 'Bearer ' + token } });
        if(rangeRes.ok){
          const d = await rangeRes.json();
          let zeilen = d.values || [];
          const m = /!\$?([A-Z]+)\$?(\d+)/.exec(d.address || '');
          const versatz = m ? spaltenBuchstabeZuNr(m[1]) - 1 : 0;
          if(versatz > 0) zeilen = zeilen.map(r=>new Array(versatz).fill('').concat(r));
          msGraphUebersichtBlatt = blattName;
          return zeilen;
        }
        rnLiveFehler = 'Excel-Schnittstelle HTTP ' + rangeRes.status + await graphFehlerKurz(rangeRes);
      } else rnLiveFehler = 'Excel-Schnittstelle: kein Blatt';
    } else rnLiveFehler = 'Excel-Schnittstelle HTTP ' + wsRes.status + await graphFehlerKurz(wsRes);
  }catch(e){ rnLiveFehler = 'Excel-Schnittstelle: ' + (e.message||e); }
  try{
    await xlsxLibLaden();
    const res = await fetch(basisUrl + '/content', { headers: { Authorization: 'Bearer ' + token } });
    if(!res.ok){ rnLiveFehler += ' / Datei laden HTTP ' + res.status; return null; }
    const buf = await res.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rg = XLSX.utils.decode_range(ws['!ref'] || 'A1:A1');
    rg.s.r = 0; rg.s.c = 0;
    const zeilen = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '', range: rg });
    rnLiveFehler = '';
    return zeilen;
  }catch(e){ rnLiveFehler += ' / Datei lesen: ' + (e.message||e); return null; }
}
async function msGraphNaechsteRenuLiveErmitteln(){
  const zeilen = await msGraphUebersichtZeilenRoh();
  if(!zeilen) return null;
  let hoechste = 0;
  for(let i=1;i<zeilen.length;i++){
    const n = renuZaehlerAusText(zeilen[i][16]); // Q: Rechnungsnummer
    if(n!==null && n > hoechste) hoechste = n;
  }
  return hoechste + 1;
}

// Zentrale Stelle fuer "welche laufende Nummer wird als naechstes
// vergeben" -- im Normalfall (OneDrive-Sync aktiv) IMMER live aus der
// echten Rechnungsuebersicht (siehe oben), damit der Zaehler nie von Hand
// gepflegt werden muss und nie von der Realitaet abweichen kann. Nur wenn
// das gerade nicht moeglich ist (kein Login, kein Netz), faellt sie auf
// den lokal gespeicherten Zaehler-Stand zurueck. Bei jedem erfolgreichen
// Live-Abgleich wird dieser lokale Rueckfallwert automatisch mit
// aktualisiert ("Zähler-Selbstheilung"), damit er auch im seltenen
// Ausnahmefall (offline) nicht unnoetig veraltet ist.
// Ermittelt die hoechste Nummer, die HIER auf dem Handy bereits an einen
// lokalen Fall vergeben wurde (Spalte Q-Suffix "-NNN" aus f.rechnungsnummer),
// unabhaengig davon, ob dieser Fall schon per "Handy laden" am PC verarbeitet
// und dadurch in die echte Uebersicht eingetragen wurde. Das ist noetig, weil
// die Live-Ermittlung (siehe msGraphNaechsteRenuLiveErmitteln) nur das sieht,
// was TATSAECHLICH schon in der Excel-Datei steht -- ein am Handy bereits
// nummerierter, aber noch nicht am PC eingelesener Fall taucht dort also noch
// NICHT auf und wuerde sonst ein zweites Mal vergeben (siehe Ruecklauf:
// doppelte Nummern bei zwei kurz hintereinander erzeugten Rechnungen).
function hoechsteLokalVergebeneRenu(){
  let hoechste = 0;
  ['ls','pt'].forEach(art=>{
    ladeFaelle(art).forEach(f=>{
      const n = renuZaehlerAusText(f.rechnungsnummer);
      if(n!==null && n > hoechste) hoechste = n;
    });
  });
  return hoechste;
}
async function naechsterRenuZaehlerErmitteln(){
  const e = ladeEinstellungen();
  const live = await msGraphNaechsteRenuLiveErmitteln();
  // Untergrenze: nie eine Nummer erneut vergeben, die hier lokal (z.B. in
  // einem noch nicht per "Handy laden" abgeholten Fall) bereits vergeben ist,
  // selbst wenn die Excel-Datei das noch nicht widerspiegelt.
  const lokaleUntergrenze = hoechsteLokalVergebeneRenu() + 1;
  if(live!==null){
    const naechster = Math.max(live, lokaleUntergrenze);
    if(naechster !== e.rnNaechsterZaehler){
      e.rnNaechsterZaehler = naechster;
      e.rnLetzte = String(naechster-1).padStart(3,'0');
      speichereEinstellungen(e);
    }
    return naechster;
  }
  if(rnLiveFehler && !rnLiveFehlerGemeldet){
    rnLiveFehlerGemeldet = true;
    try{ appToastAnzeigen('Rechnungsnummer: Live-Abgleich mit der Übersicht nicht möglich (' + rnLiveFehler + ') -- lokaler Zähler wird verwendet.', 6000); }catch(_){}
  }
  if(!e.rnNaechsterZaehler) return lokaleUntergrenze>1 ? lokaleUntergrenze : null;
  return Math.max(e.rnNaechsterZaehler, lokaleUntergrenze); // Rueckfall: manuell gepflegter Stand
}
// Wiring fuer das "letzte Rechnungsnummer"-Feld -- auf Nutzerwunsch jetzt an
// ZWEI Stellen vorhanden (Einstellungen UND ganz rechts bei den Buttons auf
// der Rechnungsuebersicht), deshalb hier EINMAL ausgelagert statt an beiden
// Stellen dupliziert (Gefahr, dass sie sonst bei einer spaeteren Aenderung
// auseinanderlaufen). warnEl/standEl sind optional -- auf der
// Rechnungsuebersicht ist aus Platzgruenden kein ausfuehrlicher Hinweistext
// vorgesehen, dort erscheint eine Fehlermeldung stattdessen kurz als Toast.
function rnLetzteFeldEinrichten(inputEl, opts={}){
  if(!inputEl) return;
  const eStart = ladeEinstellungen();
  inputEl.value = eStart.rnLetzte || '';
  const warnen = (html)=>{
    if(!opts.warnEl){ if(html) appToastAnzeigen(html.replace(/<[^>]+>/g,''), 3600); return; }
    if(!html){ opts.warnEl.classList.remove('aktiv'); opts.warnEl.innerHTML=''; return; }
    opts.warnEl.classList.add('aktiv'); opts.warnEl.innerHTML = html;
  };
  const standAktualisieren = (eAktuell)=>{ if(opts.standEl) opts.standEl.textContent = rnZaehlerStandText(eAktuell); };
  inputEl.addEventListener('blur', ()=>{
    const eAktuell = ladeEinstellungen();
    const rohEingabe = inputEl.value.trim();
    if(!rohEingabe){
      inputEl.value = '';
      eAktuell.rnLetzte = ''; eAktuell.rnNaechsterZaehler = null;
      warnen('');
      speichereEinstellungen(eAktuell);
      standAktualisieren(eAktuell);
      return;
    }
    const naechster = rnZaehlerAusEingabe(rohEingabe);
    if(naechster===null){
      warnen('Bitte nur die laufende Nummer der letzten Rechnung eintragen (die letzten 3 Ziffern aus Spalte Q, z.B. "003" bei "MS260115-003") -- keine Buchstaben, keine Datumsangabe.');
      return;
    }
    const eingabe = String(naechster-1).padStart(3,'0');
    inputEl.value = eingabe;
    warnen('');
    eAktuell.rnLetzte = eingabe;
    eAktuell.rnNaechsterZaehler = naechster;
    speichereEinstellungen(eAktuell);
    standAktualisieren(eAktuell);
  });
}
// "Weg A": lokaler Auto-Sync über die File System Access API (Ordner einmal
// auswählen, danach wird bei jeder Änderung automatisch dieselbe Datei
// überschrieben -- keine Duplikate, kein manuelles Exportieren mehr nötig,
// solange das Gerät/der Browser das unterstützt). "Weg B" (direkte
// OneDrive/Azure-Anbindung) folgt separat, sobald die Azure-App-Registrierung
// steht. Der Button "Fälle für den PC exportieren" bleibt als Rückfallebene
// bestehen, solange kein Auto-Sync aktiv verbunden ist.
// Öffnet eine OneDrive-Excel-Datei bevorzugt DIREKT in der Excel-App (per
// Office-URI-Schema "ms-excel:ofe|u|<url>") statt im Browser/der OneDrive-
// App. Grund: ein einfacher window.open() auf einen 1drv.ms-Link wurde vom
// Handy inzwischen offenbar standardmäßig der OneDrive-App statt der
// Excel-App zugeordnet (App-Link-Zuordnung des Betriebssystems geändert) --
// und die OneDrive-App zeigt Excel-Dateien nur lesend an (kein Bearbeiten
// möglich).
//
// Die Fallback-Erkennung ("ist die Excel-App tatsächlich aufgegangen?")
// muss dafür zuverlässig sein: feuert sie fälschlich, obwohl Excel längst
// im Vordergrund ist, öffnet sich ZUSÄTZLICH der Browser-/OneDrive-
// Fallback -- und genau DAS erklärt sowohl "alte Version der Datei" (die
// OneDrive-Web-Vorschau cached serverseitig und zeigt dadurch teils einen
// veralteten Stand, während die Excel-App selbst immer live synct) als
// auch "öffnet in OneDrive statt Excel" (der Fallback-Link wird vom
// Betriebssystem an die installierte OneDrive-App weitergereicht).
// Deshalb hier bewusst robuster: mehrere Signale (visibilitychange, blur,
// pagehide) zählen als "App-Wechsel erkannt", nicht nur eines, und das
// Zeitfenster ist großzügiger bemessen (2000ms statt 1200ms), da ein
// App-Wechsel auf manchen Geräten spürbar länger dauert, bis eines dieser
// Events feuert. Als zusätzliches Sicherheitsnetz wird am Ende des
// Zeitfensters zusätzlich direkt document.hidden/hasFocus() geprüft, falls
// keines der Events ausgelöst wurde, obwohl der Wechsel stattfand.
function excelDateiOeffnen(url){
  let appGeoeffnet = false;
  const alsGeoeffnetMarkieren = ()=>{ appGeoeffnet = true; };
  document.addEventListener('visibilitychange', alsGeoeffnetMarkieren);
  window.addEventListener('blur', alsGeoeffnetMarkieren);
  window.addEventListener('pagehide', alsGeoeffnetMarkieren);
  window.location.href = 'ms-excel:ofe|u|' + url;
  setTimeout(()=>{
    document.removeEventListener('visibilitychange', alsGeoeffnetMarkieren);
    window.removeEventListener('blur', alsGeoeffnetMarkieren);
    window.removeEventListener('pagehide', alsGeoeffnetMarkieren);
    if(!appGeoeffnet && !document.hidden && document.hasFocus()){
      window.open(url, '_blank');
    }
  }, 2000);
}

// Pfade relativ zum OneDrive-Hauptordner (entspricht 1:1 den Pfaden, die
// die HTA am PC benutzt -- UEBERSICHT_PFAD/FAHRDIENST_PFAD dort ohne den
// lokalen "C:\Users\seblu\OneDrive\"-Teil davor).
const MSGRAPH_PFAD_UEBERSICHT = 'KVBW Onedrive/\u00dcbersicht gestellter Rechnungen.xlsx';
const MSGRAPH_PFAD_FAHRTENBUCH = 'KVBW Onedrive/Fahrdienst Dokumentation.xlsx';

// Liefert die Graph-API-URL fuer eine pfadbasierte Adressierung (statt ueber
// eine feste Datei-ID) -- loest also bei JEDEM Aufruf neu auf, was GERADE
// unter diesem Pfad liegt, genau wie am PC ueber den lokalen Dateipfad.
// Segmente werden einzeln kodiert, damit Leerzeichen/Umlaute/Sonderzeichen
// im Dateinamen nicht die URL zerschiessen; der abschliessende ":" gehoert
// zur Graph-Pfadsyntax und bleibt unkodiert.
function msGraphPfadUrl(pfadRelativZuOneDrive){
  const segmente = pfadRelativZuOneDrive.split('/').map(encodeURIComponent).join('/');
  return 'https://graph.microsoft.com/v1.0/me/drive/root:/' + segmente + ':';
}

// Silent-Token-Holen -- OHNE Nutzer-Geste/Redirect. Schlaegt das fehl (z.B.
// Zustimmung abgelaufen/widerrufen, oder man ist erst gar nicht angemeldet),
// liefert die Funktion null; der Aufrufer faellt dann auf den statischen
// Freigabelink zurueck, statt die App mitten in einer Aktion per Redirect
// zur Microsoft-Anmeldung zu unterbrechen.
async function msGraphTokenHolen(){
  if(msGraphStatus !== 'angemeldet' || !msGraphMsal) return null;
  const konto = msGraphMsal.getActiveAccount();
  if(!konto) return null;
  try{
    const ergebnis = await msGraphMsal.acquireTokenSilent({ scopes: MSGRAPH_SCOPES, account: konto });
    return ergebnis.accessToken;
  }catch(e){
    return null;
  }
}

// Ersetzt/ergaenzt excelDateiOeffnen(url) um eine vorgeschaltete, LIVE ueber
// die Microsoft-Graph-API ermittelte Adresse der aktuell unter dem
// angegebenen OneDrive-Pfad liegenden Datei -- robust gegen genau das
// Problem, das die fest hinterlegten Freigabelinks haben (Link zeigt nach
// einem Datei-Ersetzen/Verschieben weiter auf die ALTE Datei-ID).
// KORREKTUR: die erste Umsetzung fragte dafuer "?$select=webUrl" ab -- also
// die DIREKTE Item-Adresse der Datei im eigenen Laufwerk. Genau DAS schlug
// mit aktiver OneDrive-Anmeldung zuverlaessig fehl ("Datei nicht gefunden"),
// obwohl dieselbe Datei ueber den statischen Freigabelink (ein bereits
// bestehender "jeder mit dem Link kann bearbeiten"-Sharing-Link) einwandfrei
// funktioniert. Naheliegendste Erklaerung: eine direkte Item-webUrl ist an
// das genaue, im Graph-Token aktive Konto gebunden, waehrend ein per
// createLink erzeugter Freigabelink (wie beim manuell erstellten,
// funktionierenden statischen Link) bewusst OHNE diese Bindung auskommt.
// Deshalb jetzt nicht mehr "?$select=webUrl", sondern echtes createLink
// (siehe Graph-Doku "Create a sharing link for a DriveItem") -- erzeugt
// serverseitig entweder einen neuen oder liefert einen bereits vorhandenen,
// zum angefragten Typ/Scope passenden Freigabelink zurueck (kein Spam bei
// wiederholten Klicks). Das ist strukturell derselbe Linktyp wie der
// statische Fallback, nur live nach dem aktuellen Pfad aufgeloest.
async function excelDateiUeberGraphOeffnen(pfadRelativZuOneDrive, statischerFallbackLink){
  const token = await msGraphTokenHolen();
  if(!token){ excelDateiOeffnen(statischerFallbackLink); return; }
  try{
    const antwort = await fetch(msGraphPfadUrl(pfadRelativZuOneDrive) + '/createLink', {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ type: 'edit', scope: 'anonymous' })
    });
    if(!antwort.ok) throw new Error('Graph-Antwort ' + antwort.status);
    const daten = await antwort.json();
    const link = daten && daten.link && daten.link.webUrl;
    if(link){
      excelDateiOeffnen(link);
    } else {
      throw new Error('Keine Freigabe-URL in der createLink-Antwort');
    }
  }catch(e){
    excelDateiOeffnen(statischerFallbackLink);
  }
}

// =====================================================================
// Rechnungsverwaltung: Sync-/Versand-/PDF-Status LIVE per Graph-API ermitteln
// (NICHT ueber die lokale Sync-JSON -- die kann veraltet sein) -- exakt
// dieselbe Fingerabdruck-Logik wie am PC beim "Aus Handy einlesen" (siehe
// HandyEinlesenKlick/dictFingerprint in der HTA): Spalten A,B,F,G,H
// (Art|Datum|Nachname|Vorname|Geburtsdatum, gross geschrieben) identifizieren
// denselben Fall eindeutig, unabhaengig von einer evtl. abweichenden lokalen
// Rechnungsnummer. Spalte Q liefert dazu die tatsaechlich vergebene
// Rechnungsnummer, Spalte R (falls gefuellt) das Datum des tatsaechlichen
// Versands (RechnungVersandVermerken traegt es dort fett ein).
// =====================================================================
const MSGRAPH_PFAD_ZIEL_ORDNER = 'KVBW Onedrive/fertige Rechnungen';

// Gegenstueck zu RenuFormatTauschen() in der HTA: vertauscht die beiden
// bindestrichgetrennten Teile einer Rechnungsnummer ("XXjjmmdd-NNN" aus der
// Uebersicht <-> "NNN-XXjjmmdd" als Datei-Basisname in "fertige
// Rechnungen") -- exakt 1:1 dieselbe (reine Vertausch-)Logik wie am PC.
function renuFormatTauschen(wert){
  const teile = String(wert||'').split('-');
  if(teile.length !== 2) return wert;
  return teile[1] + '-' + teile[0];
}

// Baut denselben Fingerabdruck-Schluessel wie faelleAlsUebersichtsZeilen()
// bzw. die HTA ihn aus der Uebersicht bildet (Spalten A,B,F,G,H) -- damit
// laesst sich ein lokal gespeicherter Fall eindeutig einer Zeile in der
// LIVE geladenen Uebersicht zuordnen.
function fallFingerprintBauen(f){
  const w = f.werte;
  const {nachname, vorname} = nameAufteilen(w.txtName);
  const art = f.art==='ls' ? 'L' : 'P';
  return [art, w.txtDatumExcel, nachname, vorname, w.txtGeda]
    .map(v=>String(v||'').toUpperCase().trim()).join('|');
}

// Gegenstueck zu fallFingerprintBauen(), aber fuer eine bereits aus der
// Uebersicht per msGraphAlleZeilenLaden() geladene Zeile (Felder art/datum/
// nachname/vorname/geda statt f.werte.*) -- selbe Spalten (A,B,F,G,H),
// selbes Format, damit beide Seiten denselben Schluessel ergeben.
function zeilenFingerprintBauen(f){
  return [f.art, f.datum, f.nachname, f.vorname, f.geda]
    .map(v=>String(v||'').toUpperCase().trim()).join('|');
}

// Sucht zu einer "unvollstaendigen" Zeile aus der Rechnungsverwaltung
// (msGraphAlleZeilenLaden) den passenden, noch lokal auf dem Handy
// gespeicherten Fall (ladeFaelle) ueber denselben Fingerabdruck wie
// lokaleFaelleBereitsUebernommenEntfernen ihn verwendet. Da ein solcher Fall
// dank des "nicht loeschen bei Sync-Problemen"-Verhaltens (siehe dort) auf
// dem Handy erhalten bleibt, enthaelt er weiterhin alle Original-Angaben
// (Adresse, Diagnosen, Positionen etc.) -- im Gegensatz zur Uebersichtszeile,
// die nur eine schmale Zusammenfassung ist. Gefunden werden kann so direkt
// in ansichtMaske() gesprungen werden, um den Fall zu korrigieren; beim
// naechsten Sync wird automatisch erneut versucht, daraus eine fertige
// Rechnung zu erzeugen. Gibt {art, idx} oder null zurueck.
function lokalenFallFuerZeileFinden(zeile){
  const ziel = zeilenFingerprintBauen(zeile);
  for(const art of ['ls','pt']){
    const arr = ladeFaelle(art);
    for(let idx=0; idx<arr.length; idx++){
      if(fallFingerprintBauen({...arr[idx], art}) === ziel) return {art, idx};
    }
  }
  return null;
}

// Laedt die komplette Uebersicht LIVE per Graph-Excel-API (workbook/
// usedRange) und baut daraus eine Fingerabdruck->{renu,versandt}-Map --
// eine einzige Anfrage fuer die komplette Tabelle statt pro Fall einzeln.
// Liefert null bei jedem Fehler (kein Login, kein Netz, Datei nicht
// erreichbar) -- der Aufrufer zeigt dann einfach keine Status-Badges an,
// statt die Ansicht mit einer Fehlermeldung zu blockieren.
async function msGraphUebersichtFingerprintsLaden(){
  if(msGraphStatus!=='angemeldet') return null;
  // KORREKTUR: frueher NUR ueber die Excel-Schnittstelle -- die streikt z.B.,
  // wenn die Datei am PC mit ausgeblendetem Fenster gespeichert wurde. Jetzt
  // ueber msGraphUebersichtZeilenRoh (bei Bedarf Datei direkt lesen).
  const zeilen = await msGraphUebersichtZeilenRoh();
  if(!zeilen) return null;
  const map = new Map();
  // Zeile 0 = Kopfzeile ueberspringen.
  for(let i=1;i<zeilen.length;i++){
    const r = zeilen[i] || [];
    const key = [r[0], uebersichtDatumText(r[1]), r[5], r[6], uebersichtDatumText(r[7])]
      .map(v=>String(v==null?'':v).toUpperCase().trim()).join('|');
    if(key.replace(/\|/g,'')==='') continue; // komplett leere Zeile
    if(map.has(key)) continue; // erste Fundstelle gewinnt, wie am PC
    map.set(key, {
      renu: String(r[16]==null?'':r[16]).trim()          // Q: Rechnungsnummer
      // Kein "versandt"-Feld: das Signal "versendet" ist die Fett-Formatierung
      // von Spalte R -- siehe msGraphBriefVersendetLaden.
    });
  }
  return map;
}

// Laedt ALLE Zeilen der Rechnungsuebersicht (nicht nur per Fingerabdruck
// deduplizierte Treffer zu lokal gespeicherten Faellen wie oben) -- fuer
// die "Alle Rechnungen"-Ansicht, die unabhaengig von lokal auf dem Handy
// gespeicherten Faellen wirklich JEDE Zeile der Excel zeigt (auch reine
// PC-Faelle). Neueste zuerst (Excel-Zeilenreihenfolge umgedreht). PDF-Links
// werden hier bewusst NICHT vorab pro Zeile geladen (koennte bei einer
// langen Uebersicht sehr viele Graph-Anfragen ausloesen) -- das passiert
// erst bei Bedarf beim Antippen einer Zeile, siehe ansichtAlleRechnungen().
async function msGraphAlleZeilenLaden(){
  if(msGraphStatus!=='angemeldet'){ rnLiveFehler = 'nicht bei Microsoft angemeldet'; return null; }
  // KORREKTUR: ueber msGraphUebersichtZeilenRoh -- faellt die Excel-
  // Schnittstelle aus (z.B. Datei am PC mit ausgeblendetem Fenster
  // gespeichert), wird die Datei direkt gelesen statt gar nichts anzuzeigen.
  const zeilen = await msGraphUebersichtZeilenRoh();
  if(!zeilen) return null;
  const betragText = v=> typeof v === 'number' ? v.toFixed(2).replace('.', ',') : String(v==null?'':v).trim();
  const liste = [];
  for(let i=1;i<zeilen.length;i++){
    const r = zeilen[i] || [];
    const art = String(r[0]==null?'':r[0]).trim();
    const nachname = String(r[5]==null?'':r[5]).trim();
    const vorname = String(r[6]==null?'':r[6]).trim();
    if(art==='' && nachname==='' && vorname==='') continue; // komplett leere Zeile
    liste.push({
      art: art,                                              // A
      datum: uebersichtDatumText(r[1]),                       // B
      nachname: nachname,                                     // F
      vorname: vorname,                                       // G
      geda: uebersichtDatumText(r[7]),                        // H -- nur fuer lokalenFallFuerZeileFinden()
      betrag: betragText(r[15]),                              // P
      renu: String(r[16]==null?'':r[16]).trim(),              // Q
      zeile: i+1                                              // Excel-Zeilennummer (1-basiert, Kopfzeile=1)
      // Spalte R ("Rechnungsdatum") absichtlich NICHT als "versandt"
      // ausgewertet -- das Signal "per LetterXpress versendet" ist die
      // FETT-Formatierung, siehe msGraphBriefVersendetLaden().
    });
  }
  liste.reverse(); // neueste (unterste Excel-Zeile) zuerst
  return {liste, blattName: msGraphUebersichtBlatt};
}

// Prueft per Graph, ob die Rechnungsdatum-Zelle (Spalte R) einer Excel-Zeile
// FETT formatiert ist -- das (und NUR das) ist am PC das Signal "per
// LetterXpress tatsaechlich versendet" (siehe Kommentar in
// SchreibeInUebersicht, Modul1.bas). Die Zelle selbst ist bei JEDER
// Rechnung gefuellt, unabhaengig vom Versand -- ob sie leer ist, sagt also
// nichts aus. Liefert false bei jedem Fehler (dann lieber kein Brief-Symbol
// zeigen als faelschlich eines).
async function msGraphBriefVersendetLaden(blattName, zeile){
  if(!blattName || !zeile) return false;
  const token = await msGraphTokenHolen();
  if(!token) return false;
  try{
    const basisUrl = msGraphPfadUrl(MSGRAPH_PFAD_UEBERSICHT);
    const url = basisUrl + "/workbook/worksheets('" + encodeURIComponent(blattName) +
      "')/range(address='R" + zeile + "')/format/font?$select=bold";
    const antwort = await fetch(url, { headers: { Authorization: 'Bearer ' + token } });
    if(!antwort.ok) return false;
    const daten = await antwort.json();
    return daten.bold === true;
  }catch(e){ return false; }
}

// =====================================================================
// Fahrdienst-Auswertung (Werkzeug "Fahrtenbuch öffnen") -- reine ANZEIGE,
// analog zur gleichnamigen Auswertung in der HTA am PC (siehe dort
// FahrdienstAuswertungDurchfuehren): Diensttage-Übersicht (Gesamt/
// Stundenlohn/gesetzlich/LS+PT/LS/PT) sowie je Quartal eine nach
// vertretenem Arzt gruppierte Dienstliste samt 8,7904%-Gebührenabzug.
// Zurückschreiben in die Excel-Datei (Spalten AH-AM) kann NUR die HTA per
// Excel-Automation -- von hier aus wird nichts in die Datei geschrieben,
// nur live per Microsoft-Graph-Excel-API gelesen und lokal berechnet.
// =====================================================================
const FAHRDIENST_GEBUEHR_SATZ = 0.087904;

// Laedt "Tabellenblatt1" der Fahrdienst-Dokumentation komplett per Graph-
// Excel-API (usedRange, nur Werte -- keine Formeln, siehe fahrdienstZeitLabel
// weiter unten) und wertet sie clientseitig aus. Liefert null bei jedem
// Fehler (kein Login, kein Netz, Datei nicht erreichbar).
async function msGraphFahrdienstAuswertungLadenAlt(){
  if(msGraphStatus!=='angemeldet') return null;
  const token = await msGraphTokenHolen();
  if(!token) return null;
  try{
    const basisUrl = msGraphPfadUrl(MSGRAPH_PFAD_FAHRTENBUCH);
    const wsRes = await fetch(basisUrl + '/workbook/worksheets?$select=name', {
      headers: { Authorization: 'Bearer ' + token }
    });
    if(!wsRes.ok) return null;
    const wsDaten = await wsRes.json();
    const blattName = wsDaten.value && wsDaten.value[0] && wsDaten.value[0].name;
    if(!blattName) return null;
    const rangeUrl = basisUrl + "/workbook/worksheets('" + encodeURIComponent(blattName) +
      "')/usedRange(valuesOnly=true)?$select=values";
    const rangeRes = await fetch(rangeUrl, { headers: { Authorization: 'Bearer ' + token } });
    if(!rangeRes.ok) return null;
    const rangeDaten = await rangeRes.json();
    return fahrdienstZeilenAuswerten(rangeDaten.values || []);
  }catch(e){ return null; }
}

// Reine Rechen-/Gruppierungslogik, 1:1 dieselbe Diensttag-Block-Erkennung
// und Kategorisierung (Spalte E: leer=GKV, L/LS=Leichenschau, P/PT=Privat)
// wie FahrdienstAuswertungDurchfuehren in der HTA -- NUR ohne das
// Zurückschreiben in die Datei, das bleibt der HTA am PC vorbehalten.
// "zeilen" ist das 2D-Array aus usedRange (Zeile 0 = Excel-Zeile 1).
// Wandelt eine Excel-Datumsseriennummer (Tage seit dem 30.12.1899, so wie
// Graph "usedRange(valuesOnly=true)" ein Datum liefert -- als reine Zahl,
// NICHT als formatiertes Datum) in {text:"TT.MM.JJJJ", jahr:JJJJ} um. War der
// Wert schon Text oder leer, wird er unveraendert durchgereicht (jahr: null).
function fahrdienstDatumInfo(wert){
  if(wert===null || wert===undefined || String(wert).trim()==='') return {text:'', jahr:null};
  const n = Number(wert);
  if(isFinite(n) && n > 0){
    const ms = Math.round((n - 25569) * 86400 * 1000);
    const d = new Date(ms);
    if(!isNaN(d.getTime())){
      const tt = String(d.getUTCDate()).padStart(2,'0');
      const mm = String(d.getUTCMonth()+1).padStart(2,'0');
      const jj = d.getUTCFullYear();
      return {text: tt+'.'+mm+'.'+jj, jahr: jj};
    }
  }
  return {text: String(wert).trim(), jahr: null};
}

// Entfernt ein evtl. in der Zelle vorangestelltes Label "Fahrdienst" (samt
// folgendem Leerzeichen/Bindestrich/Doppelpunkt) vom Namen des Dienstinhabers
// -- exakt dieselbe Bereinigung wie in der HTA (FahrdienstArztBereinigen),
// noetig weil manche Zeilen "Fahrdienst <Name>" in einer einzigen Zelle
// stehen haben statt Label und Name getrennt in B/C. Ohne die Bereinigung
// tauchte in der Quartalsuebersicht faelschlich ein eigener "Fahrdienst
// XY"-Eintrag statt des eigentlichen Vertretungsarztes auf.
function fahrdienstArztBereinigen(roh){
  let t = String(roh==null ? '' : roh).trim();
  if(t.slice(0,10).toLowerCase() === 'fahrdienst'){
    t = t.slice(10).replace(/^[\s\-:]+/, '').trim();
  }
  return t;
}

// Liest den Wert der Diensttag-Zeitzelle (Spalte C) aus und liefert daraus
// sowohl die Dienststunden-Zahl (fuer die Verguetungsberechnung) als auch
// den Anzeige-Text. Zwei Formate werden unterstuetzt:
//  - Neues, bevorzugtes Format: reiner Text "18-23" (Start-Ende) -- wird
//    direkt geparst, ergibt Stunden UND Anzeige-Text ("18-23 Uhr") aus EINER
//    einzigen, live gelesenen Quelle -- kein Zwischenspeicher/Cache noetig.
//  - Altes Format (nur noch fuer Zeilen, die die HTA beim naechsten Oeffnen
//    von "Fahrtenbuch auslesen" noch nicht auf Text umgestellt hat): eine
//    reine Zahl, z.B. weil Spalte C dort noch eine Formel (=23-18) war --
//    Graph liefert dafuer nur das Formel-ERGEBNIS (die Zahl), keinen Text,
//    daher faellt die Anzeige in dem Fall auf "X Std." zurueck.
function fahrdienstZeitInfo(wert){
  if(wert===null || wert===undefined || String(wert).trim()===''){ return {stunden:0, label:''}; }
  const text = String(wert).trim();
  const treffer = text.match(/^(\d{1,2}(?:[.,]\d+)?)\s*-\s*(\d{1,2}(?:[.,]\d+)?)$/);
  if(treffer){
    const start = parseFloat(treffer[1].replace(',','.'));
    const ende = parseFloat(treffer[2].replace(',','.'));
    // Dienst ueber Mitternacht (z.B. 18-8): 24 Stunden dazurechnen
    const stunden = (isFinite(start) && isFinite(ende)) ? (ende - start + (ende <= start ? 24 : 0)) : 0;
    return {stunden, label: treffer[1] + '-' + treffer[2] + ' Uhr'};
  }
  const zahl = Number(text.replace(',','.'));
  const stunden = isFinite(zahl) ? zahl : 0;
  return {stunden, label: stunden ? (stunden + ' Std.') : ''};
}

function fahrdienstZeilenAuswerten(zeilen){
  const ERSTE_DATENZEILE = 4; // 0-basiert -- entspricht Excel-Zeile 5
  const COL_A=0, COL_B=1, COL_C=2, COL_D=3, COL_E=4, COL_AG=32;
  const leer = (v)=> v===null || v===undefined || String(v).trim()==='';
  const zeileKomplettLeer = (r)=> !r || (leer(r[COL_A]) && leer(r[COL_B]) && leer(r[COL_C]) && leer(r[COL_D]));

  const bloecke = [];
  let zeile = ERSTE_DATENZEILE;
  while(zeile < zeilen.length && !zeileKomplettLeer(zeilen[zeile])){
    const r = zeilen[zeile];
    if(leer(r[COL_A])){ zeile++; continue; }

    const blockStart = zeile;
    const quartal = r[COL_A];
    const datumInfo = fahrdienstDatumInfo(r[COL_B]);
    const datumText = datumInfo.text;
    // Spalte A enthaelt NUR die Quartalszahl (1-4), ohne Jahr -- ueber
    // mehrere Jahre hinweg wuerden sonst alle "Quartal 1"-Diensttage
    // (2025, 2026, ...) in einen Topf geworfen. Deshalb wird, genau wie in
    // der HTA (FahrdienstAuswertungDurchfuehren), das aus dem Datum
    // abgeleitete Jahr mit der Quartalszahl zu einem eindeutigen Schluessel
    // kombiniert.
    const quartalKey = 'Quartal ' + quartal + ' / ' + (datumInfo.jahr!=null ? datumInfo.jahr : '?');
    const zeitInfo = fahrdienstZeitInfo(r[COL_C]);
    const dienststunden = zeitInfo.stunden;
    const arztZeile = zeilen[zeile+1] || [];
    const arzt = fahrdienstArztBereinigen(arztZeile[COL_C]);

    let blockEnde = zeile;
    let pruef = zeile + 1;
    while(pruef < zeilen.length){
      const pr = zeilen[pruef] || [];
      if(!leer(pr[COL_A])) break;
      if(zeileKomplettLeer(pr)) break;
      blockEnde = pruef;
      pruef++;
    }

    let gesamt=0, gkv=0, ls=0, pt=0, pseudo=false;
    for(let rIdx=blockStart; rIdx<=blockEnde; rIdx++){
      const rr = zeilen[rIdx] || [];
      if(!leer(rr[COL_D])){
        let wert = Number(rr[COL_AG]);
        if(!isFinite(wert)) wert = 0;
        const kategorie = String(rr[COL_E]==null ? '' : rr[COL_E]).trim().toUpperCase();
        gesamt += wert;
        if(kategorie==='L' || kategorie==='LS') ls += wert;
        else if(kategorie==='P' || kategorie==='PT') pt += wert;
        else gkv += wert;
        if(/^pseudo/i.test(String(rr[COL_D]).trim())) pseudo = true;
      }
    }
    // Foerderung (Mindesthonorar): GKV-Anteil mindestens Stunden x 21,43 €
    // (Fahrdienst Mo-Fr, 300 € je 14 h) bzw. x 50 € (Sa, So, Feiertag,
    // 24.12., 31.12.) -- nach dem Tag des Dienstbeginns; am 24.12./31.12.
    // zusaetzlich 500 € je 24 h
    const dienstart = String(arztZeile[COL_B] == null ? '' : arztZeile[COL_B]).trim() || 'Fahrdienst';
    const satz = fahrdienstPauschaleSatz(r[COL_B], dienstart), satzFormel = fahrdienstSatzFormel(r[COL_B], dienstart), zusatz = fahrdienstZusatzSatz(r[COL_B]);
    const gkvRoh = gkv;
    const pauschale = dienststunden > 0 && dienststunden * satz > gkvRoh + 0.005;
    if(pauschale){ gkv = dienststunden * satz; }
    if(zusatz && dienststunden > 0) gkv += dienststunden * zusatz;
    gesamt = gkv + ls + pt;
    const stundenlohn = dienststunden ? gesamt/dienststunden : 0;
    const zeitLabel = zeitInfo.label;

    bloecke.push({
      quartal, quartalKey, datumText, zeitLabel,
      arzt, gesamt, stundenlohn, gkv, ls, pt,
      gkvRoh, pauschale, satz, satzFormel, zusatz, pseudo, dienstart, satzGrund: fahrdienstSatzGrund(r[COL_B], dienstart), dienststunden,
      zeileStart: blockStart + 1, zeileEnde: blockEnde + 1, zeitRoh: r[COL_C]
    });

    zeile = blockEnde + 1;
  }

  const quartaleMap = new Map();
  bloecke.forEach(b=>{
    if(!quartaleMap.has(b.quartalKey)) quartaleMap.set(b.quartalKey, new Map());
    const aerzteMap = quartaleMap.get(b.quartalKey);
    if(!aerzteMap.has(b.arzt)) aerzteMap.set(b.arzt, {summe:0, dienste:[]});
    const eintrag = aerzteMap.get(b.arzt);
    eintrag.summe += b.gkv;
    eintrag.dienste.push(b.datumText + (b.zeitLabel ? ', ' + b.zeitLabel : ''));
  });
  const quartale = [];
  quartaleMap.forEach((aerzteMap, quartalKey)=>{
    const aerzte = [];
    aerzteMap.forEach((eintrag, arzt)=> aerzte.push({arzt, summe: eintrag.summe, dienste: eintrag.dienste}));
    quartale.push({quartal: quartalKey, aerzte});
  });

  return {bloecke, quartale};
}

let fahrdienstJahrWahl = null; // null = aktuelles Jahr (bzw. neuestes vorhandenes), 'alle' = alle Jahre
function fahrdienstJahrVon(b){ const m = /(\d{4})$/.exec(String(b.datumText || '')); return m ? m[1] : '?'; }
function fahrdienstAuswertungRendern(daten){
  const zielEl = document.getElementById('fahrdienstInhalt');
  if(!zielEl || !daten || !daten.bloecke || !daten.bloecke.length) return fahrdienstAuswertungRendernBasis(daten);

  const heute = String(new Date().getFullYear());
  let wahl = fahrdienstJahrWahl;
  if(wahl !== 'alle' && !jahre.includes(wahl)) wahl = jahre.includes(heute) ? heute : jahre[0];
  const bl = wahl === 'alle' ? daten.bloecke : daten.bloecke.filter(b=> fahrdienstJahrVon(b) === wahl);
  const qu = wahl === 'alle' ? daten.quartale : daten.quartale.filter(q=> String(q.quartal).slice(-4) === wahl);
  fahrdienstAuswertungRendernBasis({ bloecke: bl, quartale: qu });
  if(typeof aerzteKnoepfeEinfuegen === 'function' && msGraphStatus === 'angemeldet') aerzteKnoepfeEinfuegen(zielEl, bl, qu);
  const euro = (w)=> (Number(w)||0).toLocaleString('de-DE', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' €';
  const s = bl.reduce((a, b)=>{ a.g += b.gesamt; a.k += b.gkv; a.l += b.ls; a.p += b.pt; a.h += (b.dienststunden || 0); return a; }, {g:0, k:0, l:0, p:0, h:0});
  const kopf = document.createElement('div');
  kopf.innerHTML = '<div class="fd-jahre">' + jahre.map(j=> '<button type="button" class="fb-chip' + (j === wahl ? ' an' : '') + '" data-jahr="' + j + '">' + j + '</button>').join('') +
    '<button type="button" class="fb-chip' + (wahl === 'alle' ? ' an' : '') + '" data-jahr="alle">Alle</button></div>' +
    '<div class="fd-jahr-summe"><b>' + (wahl === 'alle' ? 'Alle Jahre' : wahl) + ':</b> ' + bl.length + (bl.length === 1 ? ' Dienst · ' : ' Dienste · ') + String(Math.round(s.h * 10) / 10).replace('.', ',') + ' Std. · gesamt ' + euro(s.g) +
    (s.h ? ' · ' + euro(s.g / s.h) + '/h' : '') + '<br>GKV ' + euro(s.k) + ' · LS ' + euro(s.l) + ' · PT ' + euro(s.p) + '</div>';
  zielEl.insertBefore(kopf, zielEl.firstChild);
  kopf.querySelectorAll('[data-jahr]').forEach(b=> b.onclick = ()=>{ fahrdienstJahrWahl = b.dataset.jahr; fahrdienstAuswertungRendern(daten); });
}
function fahrdienstAuswertungRendernBasis(daten){

  const gebuehrText = (FAHRDIENST_GEBUEHR_SATZ*100).toLocaleString('de-DE', {maximumFractionDigits:4});

      <td>${euro(b.ls+b.pt)}</td><td>${euro(b.ls)}</td><td>${euro(b.pt)}</td>

// =====================================================================
// Direkter OneDrive-Upload der Sync-Datei ueber Microsoft Graph -- Ersatz/
// Ergaenzung zum bisherigen, ordnerbasierten Auto-Sync (autoSyncSchreiben,
// File System Access API): DER brauchte einen lokal auf dem Handy per
// Ordner-Dialog gewaehlten Ordner, der (meist ueber die OneDrive-App)
// tatsaechlich mit OneDrive verbunden war -- fiel also z.B. aus, sobald die
// OneDrive-App deinstalliert wurde. Der Graph-Upload dagegen schreibt die
// Datei OHNE Umweg ueber einen lokalen Ordner direkt in dein OneDrive,
// braucht dafuer nur die Microsoft-Anmeldung (siehe oben). Beide Wege
// laufen unabhaengig voneinander und ergaenzen sich (siehe
// synchronisiereAlle unten) -- ist einer nicht eingerichtet/gerade gestoert,
// bleibt der andere als Rueckfallebene bestehen.
// =====================================================================
// Sicherung der Faelle auf dem Handy (frische Datei seit der Hauptversion --
// die alte rechnungserfassung_sync.json der frueheren Version wird bewusst
// NICHT mehr eingelesen, sonst kaemen laengst erledigte Faelle zurueck; die
// HTA liest diese Datei nicht)
const MSGRAPH_PFAD_SYNC_JSON = 'KVBW Onedrive/rechnungserfassung_app_sicherung.json';
let msGraphSyncSchreibtGerade = false;
let msGraphSyncErneutNoetig = false;

// Prueft (lesend, ohne etwas zu veraendern), ob die Sync-Datei in OneDrive
// aktuell noch mindestens einen Fall enthaelt -- derselbe Datenverlust-
// Schutz wie bei autoSyncDateiHatBereitsDaten weiter unten, nur eben gegen
// die OneDrive-Datei statt die lokal gewaehlte Ordner-Datei geprueft.
async function msGraphSyncDateiHatBereitsDaten(token){
  try{
    const antwort = await fetch(msGraphPfadUrl(MSGRAPH_PFAD_SYNC_JSON) + '/content', {
      headers: { Authorization: 'Bearer ' + token }
    });
    if(!antwort.ok) return false; // z.B. Datei existiert in OneDrive noch gar nicht
    const daten = JSON.parse(await antwort.text());
    return !!(daten && daten.faelle && daten.faelle.length > 0);
  }catch(e){ return false; }
}

// Schreibt die IMMER GLEICHE Sync-Datei direkt nach OneDrive -- Aufbau/
// Warteschlangen-Logik (schreibtGerade/erneutNoetig) 1:1 uebernommen von
// autoSyncSchreiben, damit sich beide Wege gleich verhalten.
async function msGraphSyncSchreibenAlt(){
  if(msGraphStatus !== 'angemeldet') return;
  if(msGraphSyncSchreibtGerade){ msGraphSyncErneutNoetig = true; return; }
  msGraphSyncSchreibtGerade = true;
  try{
    const token = await msGraphTokenHolen();
    if(!token) return; // z.B. Zustimmung abgelaufen -- naechster Versuch bei der naechsten Aenderung
    const daten = await exportDatenBauen();
    const istLeer = daten.faelle.length===0 && (!daten.bestatterAenderungen || daten.bestatterAenderungen.length===0);
    if(istLeer && await msGraphSyncDateiHatBereitsDaten(token)){
      return; // Schutz vor Datenverlust -- siehe Kommentar in autoSyncSchreiben
    }
    await fetch(msGraphPfadUrl(MSGRAPH_PFAD_SYNC_JSON) + '/content', {
      method: 'PUT',
      headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify(daten, null, 2)
    });
  }catch(e){
    // stiller Fehlschlag (z.B. kein Netz) -- der ordnerbasierte Auto-Sync
    // (falls eingerichtet) bzw. der manuelle Export bleiben als
    // Rueckfallebene bestehen; naechster Versuch bei der naechsten Aenderung.
  } finally {
    msGraphSyncSchreibtGerade = false;
    if(msGraphSyncErneutNoetig){ msGraphSyncErneutNoetig = false; msGraphSyncSchreiben(); }
  }
}

// Gegenstueck zu msGraphSyncSchreiben() (Upload): laedt die Sync-Datei aus
// OneDrive automatisch HERUNTER und spielt sie ein -- Problem vorher: nach
// Loeschen von Browserverlauf/Cache/Cookies waren die lokal gespeicherten,
// noch nicht am PC uebernommenen Faelle weg, und selbst eine erneute
// OneDrive-Anmeldung holte sie nicht zurueck (die App lud die Cloud-Datei nie
// von selbst herunter, nur hoch) -- man musste die Datei von Hand aus
// OneDrive laden und ueber "Importieren" einlesen. Laeuft jetzt automatisch
// bei jedem Start/Neuladen der Seite MIT aktiver OneDrive-Anmeldung sowie
// direkt nach einer frischen Anmeldung (siehe Aufrufstelle ganz unten im
// Skript). Nutzt fuer das eigentliche Einspielen dieselbe, bereits
// vorhandene MERGE-Logik wie der manuelle Import (jsonImportVerarbeiten) --
// rein additiv ueber Wert+Zeitstempel, ueberschreibt/loescht also nie etwas
// lokal Vorhandenes, egal wie oft sie laeuft. Gibt true zurueck, wenn
// dadurch etwas Neues uebernommen wurde (fuer die Aufrufstelle, um bei
// Bedarf die aktuell sichtbare Ansicht neu aufzubauen).
async function msGraphSyncAutomatischEinlesenAlt(){
  if(msGraphStatus !== 'angemeldet') return false;
  try{
    const token = await msGraphTokenHolen();
    if(!token) return false;
    const antwort = await fetch(msGraphPfadUrl(MSGRAPH_PFAD_SYNC_JSON) + '/content', {
      headers: { Authorization: 'Bearer ' + token }
    });
    if(!antwort.ok) return false; // z.B. Datei existiert in OneDrive noch nicht
    const text = await antwort.text();
    const ergebnis = jsonImportVerarbeiten(text);
    if(ergebnis.geaendert){
      appToastAnzeigen('Automatisch aus OneDrive nachgeladen: ' + ergebnis.html, 3800);
      return true;
    }
    return false;
  }catch(e){
    // stiller Fehlschlag (z.B. kein Netz) -- naechster Versuch beim naechsten
    // Start/Neuladen bzw. der naechsten Anmeldung.
    return false;
  }
}

// Legt vor jedem Sync-Versuch eine Momentaufnahme der aktuellen lokalen
// Faelle (LS + PT) an -- als Sicherheitsnetz, falls am PC beim Einlesen
// etwas schiefgeht (Sync-Konflikt, versehentliches Loeschen/Ueberschreiben,
// Renu-Durcheinander) und man auf den Stand VOR diesem Sync zurueckwill.
// Rotierend: die letzten BACKUP_MAX Staende bleiben erhalten, aeltere
// fallen raus. Ein neuer Eintrag wird nur angelegt, wenn sich der Inhalt
// seit dem letzten Backup tatsaechlich geaendert hat (sonst wuerde bei
// mehreren Aenderungen kurz hintereinander -- jede ruft synchronisiereAlle
// auf -- der Speicher schnell mit identischen Stuenden volllaufen).
const BACKUP_MAX = 20;
function backupVorSyncAnlegen(){
  try{
    const stand = { ls: ladeFaelle('ls'), pt: ladeFaelle('pt') };
    const inhalt = JSON.stringify(stand);
    if(inhalt === '{"ls":[],"pt":[]}') return; // nichts da, kein Backup noetig
    const liste = LS.get('sync_backups', []);
    if(liste.length && liste[0].inhalt === inhalt) return; // unveraendert seit letztem Backup
    liste.unshift({ zeitstempel: Date.now(), inhalt: inhalt });
    if(liste.length > BACKUP_MAX) liste.length = BACKUP_MAX;
    LS.set('sync_backups', liste);
  }catch(e){ /* Backup ist ein Sicherheitsnetz, kein Sync-Blocker -- Fehler ignorieren */ }
}

// Zentrale Stelle, die bei JEDER Datenaenderung (siehe speichereFaelle/
// speichereKatalog) GENAU EINEN der beiden automatischen Sync-Wege
// anstoesst -- bewusst NICHT beide gleichzeitig (das waere redundant und
// koennte im Grenzfall, falls der gewaehlte Ordner selbst ein OneDrive-
// Sync-Ordner ist, zu einem Wettlauf zweier Schreibzugriffe auf dieselbe
// Cloud-Datei fuehren). Priorisierung (robustester Weg zuerst):
//   1. Microsoft-Anmeldung/Graph-Upload (kein lokaler Ordner noetig, damit
//      unabhaengig von einer installierten OneDrive-App)
//   2. Ordner-basierter Auto-Sync (File System Access API)
//   3. Weder noch eingerichtet -> bleibt nur der manuelle Export/Copy-Paste
//      (fehleranfälligster Weg, siehe rnLetzte-Zaehler) als Ruckfallebene,
//      hier nichts zu tun.
function synchronisiereAlle(){
  backupVorSyncAnlegen();
  if(msGraphStatus === 'angemeldet'){
    msGraphSyncSchreiben();
  }
}


/* ==========================================================
   Datum / Zeit Hilfsfunktionen
   ========================================================== */
function normalisiereDatum(eingabe){
  if(!eingabe) return '';
  let e = eingabe.trim().replace(/\//g,'.').replace(/-/g,'.').replace(/,/g,'.');
  // "12.12" o.ä. (nur Tag.Monat, kein Jahr angegeben) -> aktuelles Jahr
  // annehmen, statt die Eingabe komplett abzulehnen.
  if(/^\d{1,2}\.\d{1,2}\.?$/.test(e)){
    e = e.replace(/\.$/,'') + '.' + new Date().getFullYear();
  }
  const teile = e.split('.');
  if(teile.length !== 3) return '';
  let tag=parseInt(teile[0],10), monat=parseInt(teile[1],10), jahrStr=teile[2].trim();
  if(jahrStr.length!==2 && jahrStr.length!==4) return '';
  let jahr=parseInt(jahrStr,10);
  if(jahrStr.length===2) jahr = 1900+jahr;
  if(isNaN(tag)||isNaN(monat)||isNaN(jahr)) return '';
  if(monat<1||monat>12||tag<1||tag>31||jahr<1900) return '';
  const d = new Date(jahr, monat-1, tag);
  if(d.getFullYear()!==jahr || d.getMonth()!==monat-1 || d.getDate()!==tag) return '';
  return String(tag).padStart(2,'0')+'.'+String(monat).padStart(2,'0')+'.'+jahr;
}
function alsDatum(normDatum){ const t=normDatum.split('.'); return new Date(+t[2], +t[1]-1, +t[0]); }
function normalisiereZeit(eingabe){
  if(!eingabe) return '';
  let w = eingabe.trim().replace(/Uhr/gi,'').trim();
  if(w.indexOf(':')===-1) return '';
  const teile = w.split(':');
  if(teile.length!==2) return '';
  let h=parseInt(teile[0],10), m=parseInt(teile[1],10);
  if(isNaN(h)||isNaN(m)||h<0||h>23||m<0||m>59) return '';
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}
// Uhrzeit-Kurzeingabe ohne Doppelpunkt: "830" -> "8:30", "1430" -> "14:30",
// "8" -> "8:00". Wird beim Verlassen eines Uhrzeitfeldes VOR der
// Formatprüfung angewendet, damit normalisiereZeit() danach ganz normal
// greifen kann. Eingaben mit Doppelpunkt oder die keine reine Zahl sind
// bleiben unverändert (Prüfung/Fehlermeldung übernimmt normalisiereZeit()).
function zeitDoppelpunktErgaenzen(eingabe){
  if(!eingabe) return eingabe;
  const w = eingabe.trim();
  if(w.indexOf(':')!==-1) return w;
  const ohneUhr = w.replace(/Uhr/gi,'').trim();
  if(!/^\d+$/.test(ohneUhr)) return w;
  if(ohneUhr.length<=2) return ohneUhr+':00';
  if(ohneUhr.length===3) return ohneUhr.slice(0,1)+':'+ohneUhr.slice(1);
  if(ohneUhr.length===4) return ohneUhr.slice(0,2)+':'+ohneUhr.slice(2);
  return w;
}
function zeitInMinuten(hhmm){
  if(!hhmm) return -1;
  const t=hhmm.split(':'); if(t.length!==2) return -1;
  return (+t[0])*60+(+t[1]);
}
function heuteAlsText(){
  const d=new Date();
  return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear();
}
function istWochenende(normDatum){
  if(!normDatum) return false;
  const d = alsDatum(normDatum);
  return d.getDay()===0 || d.getDay()===6;
}
// Wie am PC (NaechsterWerktag): liefert den naechsten Werktag NACH dem
// uebergebenen (normalisierten) Datum als Text -- Werktag = Montag bis
// Freitag, Feiertage bewusst NICHT beruecksichtigt (haengen vom Bundesland
// ab, ggf. manuell im Feld korrigieren). Ohne Basisdatum wird von heute aus
// gerechnet.
function naechsterWerktagText(basisNormDatum){
  const d = basisNormDatum ? alsDatum(basisNormDatum) : new Date();
  d.setDate(d.getDate()+1);
  while(d.getDay()===0 || d.getDay()===6){ d.setDate(d.getDate()+1); }
  return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear();
}

// Datums-Kurzeingabe wie am PC gewünscht: eine reine Zahlenfolge ohne
// Punkte wird automatisch zu einem vollen Datum ergänzt.
// - 1-2 Ziffern ("26")      -> nur das Jahr wird gesetzt (2000+n, da eine
//   Kurzeingabe i.d.R. eine aktuelle Korrektur ist, z.B. am Rechnungs-
//   /Todesbescheinigungsdatum) -- Tag/Monat bleiben vom bisherigen Feldwert
//   bzw. von heute übernommen.
// - 4 Ziffern ("1212")      -> zuerst als TTMM (Tag+Monat, OHNE Jahr) mit
//   dem AKTUELLEN Jahr versucht ("1212" -> 12.12.<aktuelles Jahr>); ergibt
//   das kein gültiges Datum (z.B. "2026": Monat 26 wäre ungültig), wird wie
//   bisher nur das Jahr gesetzt (Tag/Monat vom bisherigen Feldwert/von
//   heute) -- so bleibt "2026" weiterhin eine reine Jahres-Korrektur.
// - 6 Ziffern ("010111")    -> TTMMJJ, wie eine normale Kurzeingabe mit
//   2-stelligem Jahr (1900+n, siehe normalisiereDatum -- typisch für
//   Geburtsdaten: "1.1.11" -> 01.01.1911).
// - 8 Ziffern ("01011911" bzw. "12122026") -> TTMMJJJJ.
// Eingaben MIT Punkten, aber ohne Jahr ("12.12"), bekommen ebenfalls das
// aktuelle Jahr (siehe normalisiereDatum). Eingaben MIT vollständigem Jahr
// laufen unverändert durch die normale normalisiereDatum()-Logik.
function datumKurzeingabeErgaenzen(eingabe, bisherigerWert){
  const roh = (eingabe||'').trim();
  if(!roh) return '';
  if(/^\d+$/.test(roh)) return ziffernfolgeAlsDatum(roh, bisherigerWert);
  // Erst ganz normal versuchen (z.B. "12.12", "1.1.2026" -- bereits
  // vollstaendig/korrekt mit Punkten eingegeben).
  const direkt = normalisiereDatum(roh);
  if(direkt) return direkt;
  // KORREKTUR: ein versehentlich VERGESSENER Punkt beim schnellen Tippen
  // (z.B. "0101.26" statt "01.01.26", oder "01.0126" statt "01.01.26")
  // fuehrte bisher zu einer Fehlermeldung, obwohl die Absicht eindeutig
  // war. Alle Punkte/Trennzeichen werden dafuer entfernt und die
  // verbleibende reine Ziffernfolge genau wie eine ganz ohne Punkte
  // eingegebene Kurzeingabe interpretiert (siehe ziffernfolgeAlsDatum).
  const nurZiffern = roh.replace(/[.\-\/\s]/g, '');
  if(/^\d+$/.test(nurZiffern) && nurZiffern.length>0) return ziffernfolgeAlsDatum(nurZiffern, bisherigerWert);
  return '';
}
// Reine Ziffernfolge (ohne jedes Trennzeichen) je nach Laenge als Datum
// interpretieren -- Kernlogik von datumKurzeingabeErgaenzen(), ausgelagert,
// damit sie auch beim nachtraeglichen Entfernen eines nur TEILWEISE
// vergessenen Punktes (s.o.) wiederverwendet werden kann.
function ziffernfolgeAlsDatum(roh, bisherigerWert){
  if(roh.length===1 || roh.length===2){
    const jahr = 2000+parseInt(roh,10);
    const basisNorm = normalisiereDatum(bisherigerWert) || heuteAlsText();
    const teile = basisNorm.split('.');
    return normalisiereDatum(teile[0]+'.'+teile[1]+'.'+jahr);
  }
  if(roh.length===4){
    const alsTagMonat = normalisiereDatum(roh.slice(0,2)+'.'+roh.slice(2,4));
    if(alsTagMonat) return alsTagMonat;
    const jahr = parseInt(roh,10);
    const basisNorm = normalisiereDatum(bisherigerWert) || heuteAlsText();
    const teile = basisNorm.split('.');
    return normalisiereDatum(teile[0]+'.'+teile[1]+'.'+jahr);
  }
  if(roh.length===6){
    return normalisiereDatum(roh.slice(0,2)+'.'+roh.slice(2,4)+'.'+roh.slice(4,6));
  }
  if(roh.length===8){
    return normalisiereDatum(roh.slice(0,2)+'.'+roh.slice(2,4)+'.'+roh.slice(4,8));
  }
  return '';
}

/* ==========================================================
   Feiertage Baden-Württemberg (für Zuschlag H, wie am PC:
   IstZuschlagstag = Wochenende ODER gesetzlicher Feiertag)
   ========================================================== */
function ostersonntag(jahr){
  // Gauss'sche Osterformel
  const a=jahr%19, b=Math.floor(jahr/100), c=jahr%100, d=Math.floor(b/4), e=b%4,
        f=Math.floor((b+8)/25), g=Math.floor((b-f+1)/3),
        h=(19*a+b-d-g+15)%30, i=Math.floor(c/4), k=c%4,
        l=(32+2*e+2*i-h-k)%7, m=Math.floor((a+11*h+22*l)/451),
        monat=Math.floor((h+l-7*m+114)/31), tag=((h+l-7*m+114)%31)+1;
  return new Date(jahr, monat-1, tag);
}
function tagePlus(d, n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function selberTag(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function istFeiertagBW(d){
  const jahr = d.getFullYear();
  const o = ostersonntag(jahr);
  const feste = [
    {d:new Date(jahr,0,1), n:'Neujahr'},
    {d:new Date(jahr,0,6), n:'Heilige Drei Könige'},
    {d:tagePlus(o,-2), n:'Karfreitag'},
    {d:o, n:'Ostersonntag'},
    {d:tagePlus(o,1), n:'Ostermontag'},
    {d:new Date(jahr,4,1), n:'Tag der Arbeit'},
    {d:tagePlus(o,39), n:'Christi Himmelfahrt'},
    {d:tagePlus(o,49), n:'Pfingstsonntag'},
    {d:tagePlus(o,50), n:'Pfingstmontag'},
    {d:tagePlus(o,60), n:'Fronleichnam'},
    {d:new Date(jahr,9,3), n:'Tag der Deutschen Einheit'},
    {d:new Date(jahr,10,1), n:'Allerheiligen'},
    {d:new Date(jahr,11,25), n:'1. Weihnachtstag'},
    {d:new Date(jahr,11,26), n:'2. Weihnachtstag'}
  ];
  const treffer = feste.find(f=>selberTag(f.d, d));
  return treffer ? treffer.n : '';
}
// Wie PC IstZuschlagstag(): Wochenende ODER Feiertag löst den H-Zuschlag
// aus. Gibt den Grund ("Samstag"/"Sonntag"/Feiertagsname) zurück, oder ''
// wenn kein Zuschlagstag.
function zuschlagstagGrund(normDatum){
  if(!normDatum) return '';
  const d = alsDatum(normDatum);
  const feiertag = istFeiertagBW(d);
  if(feiertag) return feiertag;
  const tag = d.getDay();
  if(tag===6) return 'Samstag';
  if(tag===0) return 'Sonntag';
  return '';
}

const STERBEZEIT_SCHLUESSELWOERTER = [
  "tod festgestellt","todeszeit","todeszeitpunkt","tod eingetreten","sterbezeit",
  "exitus letalis","exitus","ist verstorben","verstorben","todesfeststellung",
  "für tot erklärt","fuer tot erklaert","klinisch tot","reanimation ohne erfolg",
  "erfolglose reanimation","reanimation eingestellt","reanimationsmaßnahmen eingestellt",
  "reanimationsmassnahmen eingestellt","reanimationsmaßnahmen abgebrochen","reanimationsmaßnahmen beendet",
  "reanimation beendet","cpr erfolglos","cpr eingestellt","kein reanimationsversuch",
  "nicht reanimationspflichtig","keine reanimation","sichere todeszeichen","totenflecke",
  "livores","totenstarre","rigor mortis","leblos aufgefunden"
];
function sterbezeitAusFreitextErmitteln(volltext){
  if(!volltext) return {zeit:'', quelle:''};
  const textLower = volltext.toLowerCase();
  const zeitMuster = /(\d{1,2})[:.](\d{2})\s*uhr/i;
  for(const kw of STERBEZEIT_SCHLUESSELWOERTER){
    let pos = textLower.indexOf(kw);
    if(pos===-1) continue;
    const von = Math.max(0, pos-40);
    const bis = Math.min(volltext.length, pos+kw.length+40);
    const fenster = volltext.substring(von, bis);
    const treffer = fenster.match(zeitMuster);
    if(treffer){ return {zeit:treffer[1].padStart(2,'0')+':'+treffer[2], quelle:'Schlüsselwort "'+kw+'"'}; }
  }
  const fallback = volltext.match(/leblos aufgefunden um\s*(\d{1,2})[:.](\d{2})\s*uhr/i);
  if(fallback) return {zeit:fallback[1].padStart(2,'0')+':'+fallback[2], quelle:'"leblos aufgefunden um..."'};
  return {zeit:'', quelle:''};
}
function feldAusNachrichtLesen(zeilen, praefix){
  for(const z of zeilen){
    const t = z.trim();
    if(t.toLowerCase().startsWith(praefix.toLowerCase())) return t.substring(praefix.length).trim();
  }
  return '';
}
function grossKleinNormalisieren(s){
  if(!s) return '';
  // Grossschreibung nach jedem Leerzeichen UND nach jedem Bindestrich
  // (z.B. "Baden-baden" -> "Baden-Baden", "Müller-schmidt" -> "Müller-Schmidt"),
  // damit zusammengesetzte Orts-/Namensteile korrekt behandelt werden.
  const grossNachTrenner = (wort) => wort.split('-').map(teil =>
    teil.length ? teil[0].toUpperCase()+teil.substring(1).toLowerCase() : teil
  ).join('-');
  return s.split(' ').map(w => grossNachTrenner(w)).join(' ');
}
// Schreibt "str"/"str." zu "straße" aus -- 1:1 wie StrasseAusschreiben am PC
// (LS_Modul1.bas/PT_Modul1.bas): sowohl angehängt ("Musterstr") als auch als
// eigenes Wort ("Muster Str."). Löst bewusst NUR aus, wenn direkt danach ein
// Leerzeichen, eine Ziffer oder (bei "str.") der Punkt selbst folgt -- sonst
// würde es mitten in "Strand"/"Stroh" oder bei bereits ausgeschriebenem
// "Straße" fälschlich zuschlagen.
function strasseAusschreiben(text){
  if(!text) return '';
  return text.replace(/str\./gi, 'straße').replace(/str(?=[ 0-9])/gi, 'straße');
}

// =====================================================================
// Live-Korrektur WÄHREND des Tippens (nicht erst beim Verlassen des
// Feldes) -- 1:1 nachgebaut nach dem tatsächlichen PC-Vorbild (Txt_Change
// in der dortigen Klasse fürs generische Textfeld-Handling): bei JEDEM
// Tastenanschlag wird der GESAMTE aktuelle Feldinhalt neu durch
// StrasseAusschreiben (falls Straßenfeld) und danach GrossKleinKorrigieren
// gejagt -- nicht nur, wenn gerade ein Leerzeichen getippt wurde. Beide
// Funktionen sind idempotent (wenden erneut angewandt keine weitere
// Änderung mehr an), daher stört das wiederholte Anwenden bei jedem
// Tastendruck nicht. Der Cursor wird exakt wie am PC nachgeführt:
// SelStart + (neue Länge - alte Länge) -- unabhängig davon, WO im Text
// sich etwas geändert hat.
let gGrossSchreibLaeuft = false;
function grossKleinKorrigieren(text){
  // Entspricht GrossKleinKorrigieren (PC): Leerzeichen UND Bindestrich
  // sind Wortgrenzen, nur der erste Buchstabe je Wort wird grossgeschrieben,
  // der Rest bleibt unangetastet (korrigiert also gezielt vergessene
  // Grossschreibung, ohne z.B. "O'Brien" kaputtzumachen).
  let ergebnis = '', vorherigesTrennz = true;
  for(const c of text){
    ergebnis += (vorherigesTrennz && c!==' ' && c!=='-') ? c.toUpperCase() : c;
    vorherigesTrennz = (c===' '||c==='-');
  }
  return ergebnis;
}
// Hängt die Live-Korrektur (ggf. Straßen-Ausschreibung + Großschreibung)
// an ein Eingabefeld an -- 1:1 wie IstGrossSchreibFeld/IstStrassenFeld am
// PC festlegen, WELCHE Felder das bekommen (siehe Aufrufe in der
// Masken-Initialisierung weiter unten).
function feldLiveGrossschreibungAnhaengen(id, istStrassenfeld){
  const el = document.getElementById(id);
  if(!el) return;
  el.addEventListener('input', ()=>{
    if(gGrossSchreibLaeuft) return; // Wiedereintritt verhindern (das el.value=... unten loest selbst wieder 'input' aus)
    const textVorher = el.value;
    let textNachher = textVorher;
    if(istStrassenfeld) textNachher = strasseAusschreiben(textNachher);
    textNachher = grossKleinKorrigieren(textNachher);
    if(textNachher === textVorher) return;
    let posCursor = el.selectionStart + (textNachher.length - textVorher.length);
    if(posCursor < 0) posCursor = 0;
    gGrossSchreibLaeuft = true;
    el.value = textNachher;
    gGrossSchreibLaeuft = false;
    el.setSelectionRange(posCursor, posCursor);
  });
}
// Zerlegt eine als EINE Zeile kopierte Adresse (z.B. aus Google Maps: "Musterstraße 12, 77656 Offenburg"
// oder mit angehängtem Land "Musterstraße 12, 77656 Offenburg, Deutschland") in Straße+Hausnummer und
// PLZ+Ort -- fürs direkte Einlesen ins Bestatter-Adressfeldpaar, ohne die Zeile von Hand aufzutrennen.
function adressZeileTrennen(text){
  if(!text) return null;
  const teile = text.trim().replace(/\n/g,', ').split(',').map(s=>s.trim()).filter(Boolean);
  if(teile.length<2) return null;
  // Ein evtl. angehängtes Land (kein Bestandteil, der Ziffern enthält -- eine
  // PLZ hat immer Ziffern) am Ende verwerfen.
  if(teile.length>=3 && !/\d/.test(teile[teile.length-1])) teile.pop();
  if(teile.length<2) return null;
  return {strasse: teile[0], plzOrt: teile.slice(1).join(', ')};
}
// Eigener Hinweis-Platz direkt unter dem "Aus Zwischenablage einlesen"-Button
// statt des allgemeinen Hinweisbanners ganz unten in der Maske -- eine
// Meldung wie "Zwischenablage ist leer" bezieht sich ja unmittelbar auf den
// gerade angeklickten Button und soll auch genau dort sichtbar sein, ohne
// dass die Maske dafuer nach unten scrollt.
function zwischenablageHinweisAnzeigen(text){
  const el = document.getElementById('zwischenablageHinweis');
  if(!el) return;
  if(!text){ el.classList.remove('aktiv'); el.innerHTML=''; return; }
  el.innerHTML = text;
  el.classList.add('aktiv');
}
async function ausZwischenablageEinlesen(art, ctx){
  zwischenablageHinweisAnzeigen('');
  let text = '';
  try{ text = await navigator.clipboard.readText(); }
  catch(e){ zwischenablageHinweisAnzeigen('Zwischenablage konnte nicht gelesen werden. Bitte Berechtigung erteilen oder Text manuell einfügen.'); return; }
  if(!text || !text.trim()){ zwischenablageHinweisAnzeigen('Die Zwischenablage ist leer.'); return; }

  const zeilen = text.split(/\r?\n/);
  const patient = feldAusNachrichtLesen(zeilen, 'Patient:');
  const geb = feldAusNachrichtLesen(zeilen, 'Geb:');
  const ort = feldAusNachrichtLesen(zeilen, 'Ort:');
  const strasse = feldAusNachrichtLesen(zeilen, 'Strasse:') || feldAusNachrichtLesen(zeilen, 'Straße:');

  if(patient) ctx.setValue('txtName', grossKleinNormalisieren(patient));
  if(geb) ctx.setValue('txtGeda', geb);
  if(strasse) ctx.setValue('txtPAdresse1', grossKleinNormalisieren(strasseAusschreiben(strasse)));
  if(ort) ctx.setValue('txtPAdresse2', grossKleinNormalisieren(ort));

  if(art==='ls'){
    const erg = sterbezeitAusFreitextErmitteln(text);
    if(erg.zeit){
      ctx.setValue('txtTodeszeit', erg.zeit);
      zwischenablageHinweisAnzeigen('Sterbezeitpunkt '+erg.zeit+' automatisch erkannt (Quelle: '+erg.quelle+'). Bitte prüfen.');
    } else {
      zwischenablageHinweisAnzeigen('Kein Sterbezeitpunkt im Text erkannt -- bitte manuell eintragen.');
    }
  }
  // Wichtig: nach dem Einlesen läuft die VOLLSTÄNDIGE Plausibilitätsprüfung,
  // nicht nur die feldweise -- Werte wurden ja programmatisch gesetzt und
  // haben daher kein einzelnes "Feld verlassen"-Ereignis ausgelöst.
  ctx.allePruefungenAusfuehren();
  if(strasse && ort) ctx.adresseVerlassen();
}

async function geocode(adresse){
  const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(adresse);
  const res = await fetch(url, {headers:{'Accept':'application/json'}});
  const data = await res.json();
  if(!data || !data.length) return null;
  return {lat:parseFloat(data[0].lat), lon:parseFloat(data[0].lon)};
}
// PLZ/Ort-Erkennung analog zur PC-Funktion PlzErgaenzen() in
// PT_UserFormRechnung.frm: extrahiert eine 5-stellige PLZ aus einem Text,
// ermittelt fehlenden Ort zu einer PLZ bzw. fehlende PLZ zu einem Ort per
// Geocoding, und prüft bei vorhandenen beiden Werten per Kreuzvalidierung,
// ob PLZ und Ort tatsächlich zusammenpassen.
function plzAusText(text){
  const m = (text||'').match(/\b(\d{5})\b/);
  return m ? m[1] : '';
}
// Rueckgabe bewusst dreiwertig: ein gefundener String, '' bei einer
// erfolgreichen Anfrage OHNE Treffer (Adresse/Ort existiert laut
// Kartendienst schlicht nicht), oder null, wenn die Anfrage selbst
// fehlgeschlagen ist (Netzwerkfehler -- meist fehlendes Internet, z.B.
// beim Hausbesuch ohne Empfang). plzOrtPruefen() unterscheidet danach im
// Hinweistext zwischen "nicht gefunden" und "vermutlich kein Internet".
async function ortErmitteln(plz){
  try{
    const url = 'https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=1&country=Germany&postalcode='+encodeURIComponent(plz);
    const res = await fetch(url, {headers:{'Accept':'application/json'}});
    const data = await res.json();
    if(!data || !data.length) return '';
    const a = data[0].address || {};
    return a.city || a.town || a.village || a.municipality || a.city_district || '';
  }catch(e){ return null; }
}
async function plzErmitteln(adresse){
  try{
    const url = 'https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=1&q='+encodeURIComponent(adresse);
    const res = await fetch(url, {headers:{'Accept':'application/json'}});
    const data = await res.json();
    if(!data || !data.length) return '';
    const a = data[0].address || {};
    return a.postcode || '';
  }catch(e){ return null; }
}
// Kurzer, gut lesbarer Zusatzsatz für die Hinweistexte unten -- kombiniert
// den eigentlichen Fehlschlag (Netzwerkanfrage fehlgeschlagen) mit dem
// zusätzlichen Signal von navigator.onLine, damit die Vermutung "kein
// Internet" nicht bei jedem einzelnen fehlgeschlagenen Request pauschal
// behauptet wird, sondern nur wenn beides dafür spricht bzw. der Browser
// selbst meldet, offline zu sein.
function keinInternetHinweisText(){
  return (typeof navigator!=='undefined' && navigator.onLine===false)
    ? ' Es scheint aktuell keine Internetverbindung zu bestehen.'
    : ' Vermutlich ist gerade keine Internetverbindung vorhanden (oder der Kartendienst ist nicht erreichbar).';
}
async function routeKm(start, ziel){
  const url = `https://router.project-osrm.org/route/v1/driving/${start.lon},${start.lat};${ziel.lon},${ziel.lat}?overview=false`;
  const res = await fetch(url);
  const data = await res.json();
  if(!data.routes || !data.routes.length) return null;
  return data.routes[0].distance/1000;
}
// Analog zur PC-Funktion RoutenErmitteln: liefert mehrere Routenalternativen
// (falls der Routendienst welche findet) statt nur der einen besten Route,
// jeweils als Einfachstrecke in km + Fahrzeit in Minuten.
async function routeAlternativen(start, ziel){
  const url = `https://router.project-osrm.org/route/v1/driving/${start.lon},${start.lat};${ziel.lon},${ziel.lat}?overview=false&alternatives=true`;
  const res = await fetch(url);
  const data = await res.json();
  if(!data.routes || !data.routes.length) return [];
  return data.routes.map(r=>({km:r.distance/1000, minuten:r.duration/60}));
}
// Luftlinie (Haversine) -- EINFACHE Strecke, bewusst nicht verdoppelt
// (analog zur PC-Logik: kmFahrstrecke wird fuer Hin+Rueck verdoppelt,
// kmLuftlinieEinfach bleibt die reine Einfachstrecke).
function kmLuftlinieEinfach(a, b){
  const R=6371;
  const dLat=(b.lat-a.lat)*Math.PI/180, dLon=(b.lon-a.lon)*Math.PI/180;
  const x = Math.sin(dLat/2)**2 + Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
}
// Entscheidet Reiseentschaedigung vs. Wegegeld -- analog SollReiseGelten()
// am PC: Standard = Fahrstrecke (Hin+Rueck) > 50 km; Einstellung
// "Reiseentschaedigung nach Luftlinie priorisieren" schaltet stattdessen
// auf Luftlinie (Einfachstrecke) > 25 km um.
function sollReiseGelten(kmFahrstreckeGesamt, kmLuftlinie){
  const e = ladeEinstellungen();
  if(e.reiseBasisLuftlinie) return kmLuftlinie > 25;
  return kmFahrstreckeGesamt > 50;
}

// Fahrstrecke (Hin+Rueck). Liefert Basisbetrag, km-Zeile und Gesamtbetrag,
// wird sowohl fuer die Anzeige in den Rechnungspositionen als auch fuer die
// automatische Betragssumme benutzt.
function reiseGesamtBetrag(kmFahrstreckeText){
  const km = parseFloat((kmFahrstreckeText||'').toString().replace(',','.'));

  const kmGerundet = Math.ceil(km);
  const kmZeile = Math.round(kmGerundet*0.26*100)/100;
  return {basis:REISEENTSCHAEDIGUNG.betrag, kmGerundet, kmZeile, gesamt:Math.round((REISEENTSCHAEDIGUNG.betrag+kmZeile)*100)/100};
}

// =====================================================================
// Dynamisches Nachladen des GOÄ-Positionskatalogs aus der Excel-Vorlage
// (Tabelle1, Spalte B/C=Ziffer je nach Art) -- siehe Kommentar bei
// msGraphPositionsKatalogLaden weiter unten fuer den Hintergrund.
// =====================================================================
const MSGRAPH_PFAD_VORLAGE_LS = 'KVBW Onedrive/Vorlage_Abrechnung_Leichenschau_makro.xlsm';
const MSGRAPH_PFAD_VORLAGE_PT = 'KVBW Onedrive/Vorlage_Abrechnung_Privatpatienten_makro.xlsm';
const POSITIONSKATALOG_CACHE_SCHLUESSEL = 'positionsKatalogCache_v2';

// Liest den GOÄ-Positionskatalog LIVE aus der Excel-Arbeitsvorlage (Tabelle1)
// -- genau die Tabelle, die auch die PC-Makromaske per RechnungspunkteEinlesen
// dynamisch ausliest. Damit ist die Excel-Datei die EINE gemeinsame Quelle
// fuer PC und Handy, statt einer separat gepflegten (und potenziell
// abweichenden) Liste in dieser App. Voraussetzung: die beiden Vorlage-
// Dateien liegen im selben OneDrive-Ordner wie die uebrigen synchronisierten
// Dateien (siehe MSGRAPH_PFAD_VORLAGE_LS/_PT oben).
//
// Layout je Art (1:1 wie SPALTE_ZIFFER/SPALTE_BEZEICHNUNG/SPALTE_BETRAG in
// LS_Modul1.bas / PT_Modul1.bas):
//   PT: Ziffer=Spalte B(1), Faktor=Spalte C(2), Bezeichnung=Spalte D(3), Betrag=Spalte E(4)
//   LS: Ziffer=Spalte C(2), kein Faktor,        Bezeichnung=Spalte E(4), Betrag=Spalte F(5)
// (0-basierte Indizes wie im values-Array der Graph-Antwort)
//
// Eine "Position" beginnt bei einer Zeile mit nicht-leerer Ziffer-Zelle;
// Folgezeilen mit leerer Ziffer gehoeren als Bezeichnungs-Fortsetzung zur
// vorherigen Position (genau wie RechnungspunkteEinlesen es in VBA
// handhabt, z.B. bei "H"/Zuschlag Wochenende oder "7"/Untersuchung, die
// sich in der Vorlage ueber 2 Zeilen erstrecken). Das Einlesen endet an der
// Zeile mit "Gesamt" in der Bezeichnung.
async function msGraphPositionsKatalogLaden(art){
  if(msGraphStatus!=='angemeldet') return null;
  const token = await msGraphTokenHolen();
  if(!token) return null;
  const pfad = art==='ls' ? MSGRAPH_PFAD_VORLAGE_LS : MSGRAPH_PFAD_VORLAGE_PT;
  const spZiffer = art==='ls' ? 2 : 1;
  const spBez    = art==='ls' ? 4 : 3;
  const spBetrag = art==='ls' ? 5 : 4;
  const spFaktor = art==='ls' ? null : 2;
  try{
    const basisUrl = msGraphPfadUrl(pfad);
    const rangeUrl = basisUrl + "/workbook/worksheets('Tabelle1')/usedRange(valuesOnly=true)?$select=values";
    const rangeRes = await fetch(rangeUrl, { headers: { Authorization: 'Bearer ' + token } });
    if(!rangeRes.ok) return null;
    const rangeDaten = await rangeRes.json();
    const zeilen = rangeDaten.values || [];
    const positionen = [];
    let aktuelle = null;
    // Zeile 0 = Kopfzeile, ab Zeile 1 die eigentlichen Positionen.
    for(let i=1;i<zeilen.length;i++){
      const r = zeilen[i];
      const ziffer = String(r[spZiffer]==null?'':r[spZiffer]).trim();
      const bezTeil = String(r[spBez]==null?'':r[spBez]).trim();
      if(ziffer!==''){
        // Ende des Katalogs: Zeile mit "Gesamt" (Summenzeile) erreicht.
        if(/gesamt/i.test(bezTeil) || /gesamt/i.test(ziffer)) break;
        // Nur echte GOÄ-Ziffern uebernehmen (Zahl oder "E") -- Zeilen wie
        // "Reiseentschädigung" oder Wegegeld-Ziffern ("0", km-Formel) sind
        // in dieser App bereits fest hinterlegt (REISEENTSCHAEDIGUNG/
        // WEGEGELD_TAG/_NACHT) und sollen hier nicht dubliziert werden.
        // BUGFIX: die Wegegeld/km-Zeile steht in der Vorlage mit Ziffer "0"
        // -- das bestand bisher NUR im Kommentar, der Code liess "0" aber
        // durchrutschen (/^\d+$/ trifft auch auf "0" zu), wodurch die
        // 0,26-EUR/km-Zeile zusaetzlich als eigene Position unter
        // "Grundpauschalen" auftauchte (Duplikat zur fest hinterlegten
        // Reiseentschaedigungs-Zeile unter "Wegegeld"). Ziffer "0" jetzt
        // explizit mit ausschliessen.
        if(ziffer==='0' || (!/^\d+$/.test(ziffer) && ziffer!=='E')){ aktuelle = null; continue; }
        const betragRoh = r[spBetrag];
        const betrag = typeof betragRoh==='number' ? betragRoh : parseFloat(String(betragRoh||'').replace(',','.'));
        if(isNaN(betrag)){ aktuelle = null; continue; }
        aktuelle = {
          ziffer: ziffer,
          faktor: spFaktor!==null ? (parseFloat(String(r[spFaktor]||'').toString().replace(',','.')) || 1) : 1,
          bez: bezTeil,
          betrag: Math.round(betrag*100)/100
        };
        positionen.push(aktuelle);
      } else if(aktuelle && bezTeil!==''){
        // Fortsetzungszeile der Bezeichnung (mehrzeiliger Text in der Vorlage).
        // BETA: ab der Zeile mit "Begründung:" (Faktorspalte) ist es die
        // Begruendung der Position, nicht mehr ihre Bezeichnung.
        if(/^begr/i.test(String(r[art==='ls' ? 3 : 2]==null ? '' : r[art==='ls' ? 3 : 2]).trim())) aktuelle.begruendung = '';
        if(aktuelle.begruendung !== undefined) aktuelle.begruendung = (aktuelle.begruendung + ' ' + bezTeil).trim();
        else aktuelle.bez = (aktuelle.bez + ' ' + bezTeil).trim();
      }
    }
    if(positionen.length===0) return null;
    return positionen;
  }catch(e){ return null; }
}

// Orchestriert das Nachladen fuer beide Arten und ersetzt die Positionen in
// POSITIONEN_LS/POSITIONEN_PT IN-PLACE (bestehende Objektreferenzen bleiben
// gueltig, die 3 Stellen, die grundleistung lesen, sehen die neuen Daten
// automatisch). Die "standard"-Markierung (automatisch vorausgewaehlte
// Grundleistung: 101 bei LS, 50 bei PT) wird dabei erhalten, auch wenn die
// Excel-Vorlage das Flag selbst natuerlich nicht kennt. Ergebnis wird
// zusaetzlich in localStorage gecacht, damit beim naechsten Start (auch
// offline) sofort etwas Sinnvolles da ist, bevor der Live-Abgleich (falls
// online) es ggf. aktualisiert.
async function positionsKatalogAktualisieren(){
  if(msGraphStatus!=='angemeldet') return false;
  const STANDARD_ZIFFER = {ls:'101', pt:'50'};
  let geaendert = false;
  for(const art of ['ls','pt']){
    const neu = await msGraphPositionsKatalogLaden(art);
    if(!neu) continue; // Fehler/nicht erreichbar -- bestehenden Katalog unangetastet lassen
    neu.forEach(p=>{ if(p.ziffer===STANDARD_ZIFFER[art]) p.standard = true; });
    const ziel = art==='ls' ? POSITIONEN_LS : POSITIONEN_PT;
    ziel.grundleistung.length = 0;
    ziel.grundleistung.push(...neu);
    geaendert = true;
  }
  if(geaendert){
    try{
      localStorage.setItem(POSITIONSKATALOG_CACHE_SCHLUESSEL, JSON.stringify({
        ls: POSITIONEN_LS.grundleistung, pt: POSITIONEN_PT.grundleistung
      }));
    }catch(e){}
  }
  return geaendert;
}

// Beim Start (noch bevor ein evtl. Login online abgeschlossen ist): falls
// ein frueherer Live-Abgleich schon einmal etwas gecacht hat, dieses sofort
// uebernehmen -- so steht auch offline / vor dem ersten erfolgreichen
// Graph-Aufruf bereits der zuletzt bekannte (statt der fest einprogrammierte)
// Katalogstand zur Verfuegung.
(function positionsKatalogCacheBeimStartLaden(){
  try{
    const roh = localStorage.getItem(POSITIONSKATALOG_CACHE_SCHLUESSEL);
    if(!roh) return;
    const cache = JSON.parse(roh);
    // BUGFIX-Selbstheilung: ein vor dem 0-Ziffer-Fix (siehe
    // msGraphPositionsKatalogLaden) geschriebener Cache kann noch die
    // faelschlich uebernommene Wegegeld/km-Zeile (Ziffer "0") enthalten --
    // beim Laden vorsorglich herausfiltern, damit sie nicht weiter unter
    // "Grundpauschalen" auftaucht, auch ohne dass online neu geladen wird.
    if(cache && Array.isArray(cache.ls) && cache.ls.length) POSITIONEN_LS.grundleistung = cache.ls.filter(p=>p.ziffer!=='0');
    if(cache && Array.isArray(cache.pt) && cache.pt.length) POSITIONEN_PT.grundleistung = cache.pt.filter(p=>p.ziffer!=='0');
  }catch(e){}
})();

const ZIFFER_AUSSCHLUESSE = {

  '7':   ['5'],
