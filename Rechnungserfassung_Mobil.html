/* Ermittelt die automatisch vorzuschlagenden Positionen (Grundleistung +
   Zeit-Zuschlag + Reiseentschädigung ODER passendes Wegegeld -- nie beides,
   siehe sollReiseGelten) -- der Rest bleibt manuelle Auswahl, genau wie am
   PC ("Rechnungspositionen prüfen"). */
// modus (optional, 1:1 wie am PC WegegeldZifferBestimmen):
//   ''           -- automatisch, die 50-km-Regel (sollReiseGelten) entscheidet
//   'REISE'      -- Nutzer hat bewusst eine Fahrstrecke-Kachel als
//                    Reiseentschädigung gewählt (Alternativrouten) -- gilt
//                    IMMER als Reiseentschädigung, unabhängig von den km
//   'LUFTLINIE'  -- Nutzer hat bewusst die Luftlinie-Kachel gewählt -- die
//                    50-km-Automatik wird dabei bewusst ÜBERSPRUNGEN, auch
//                    bei einer Luftlinie >25 km greift dann NICHT automatisch
//                    die Reiseentschädigung, sondern weiterhin die oberste
//                    Wegegeld-Staffel (WT25/WN25) -- exakt wie am PC.
// Vorauswahl kommt aus dem aktiven Profil (statt fest 50 bzw. 101), die
// Zeitzuschlaege richten sich nach der Leistung (A-D ohne Besuch, sonst E-H),
// Wegegeld nur mit Besuch -- siehe betaAutoAnpassen
function automatischeAuswahl(katalog, datum, zeit, kmFahrstreckeGesamt, kmLuftlinie, modus){
  const art = katalog === POSITIONEN_LS ? 'ls' : 'pt';
  const basis = new Set(betaProfilVorauswahl(art));
  const auto = Array.from(automatischeAuswahlRoh(katalog, datum, zeit, kmFahrstreckeGesamt, kmLuftlinie, modus))
    .filter(z=> ['F','G','H'].includes(z) || /^W[TN]\d/.test(z) || z === 'REISE');
  return betaAutoAnpassen(art, new Set([...basis, ...auto]), basis);
}
function automatischeAuswahlRoh(katalog, datum, zeit, kmFahrstreckeGesamt, kmLuftlinie, modus){
  const ausgewaehlt = new Set();
  (katalog.grundleistung||[]).forEach(p=>{ if(p.standard) ausgewaehlt.add(p.ziffer); });

  const normDatum = normalisiereDatum(datum);
  const normZeit = normalisiereZeit(zeit);
  // Wie am PC (ZeitZuschlagBestimmen + IstZuschlagstag): F/G aus der Uhrzeit
  // UND H aus Wochenende/Feiertag koennen GLEICHZEITIG gelten -- H schliesst
  // F/G also NICHT aus (anders als zuvor in dieser Datei).
  if(normZeit){
    const min = zeitInMinuten(normZeit);
    if((min>=20*60 && min<22*60) || (min>=6*60 && min<8*60)) ausgewaehlt.add('F');
    else if(min>=22*60 || min<6*60) ausgewaehlt.add('G');
  }
  if(zuschlagstagGrund(normDatum)) ausgewaehlt.add('H');

  const fahrVal = parseFloat((kmFahrstreckeGesamt||'').toString().replace(',','.'));
  const luftVal = parseFloat((kmLuftlinie||'').toString().replace(',','.'));

  if(modus==='REISE'){
    // Wie am PC: bewusst erzwungen, unabhängig von den km (solange > 0).
    if(!isNaN(fahrVal) && fahrVal>0) ausgewaehlt.add('REISE');
    return ausgewaehlt;
  }

  // BUGFIX (exakt wie am PC, WegegeldZifferBestimmen): im Luftlinie-Modus
  // entscheidet AUSSCHLIESSLICH die Luftlinie (einfache Strecke) -- eine
  // (noch) unbekannte Fahrstrecke wird dafuer nicht gebraucht. Vorher hing
  // die GESAMTE Wegegeld-Ermittlung an "if(fahrVal>0)", wodurch eine manuell
  // eingetippte ODER per Alternativrouten gewaehlte Luftlinie ganz ohne
  // WT/WN blieb, sobald txtKmFahrstrecke (noch) leer war (z.B. bei manueller
  // Eingabe ohne vorherige automatische Routenberechnung).
  if(modus==='LUFTLINIE'){
    if(isNaN(luftVal) || luftVal<=0 || !normZeit) return ausgewaehlt;
    const min = zeitInMinuten(normZeit);
    const nacht = !(min>=7*60 && min<19*60);
    const tabelle = nacht ? WEGEGELD_NACHT : WEGEGELD_TAG;
    const bucket = tabelle.find(w => luftVal <= w.bisKm) || tabelle[tabelle.length-1];
    ausgewaehlt.add(bucket.ziffer);
    return ausgewaehlt;
  }

  if(!isNaN(fahrVal) && fahrVal>0){
    // Luftlinie (Einfachstrecke) fehlt evtl., wenn km manuell eingetragen
    // wurden statt per Routenberechnung -- als Schaetzung dann die HALBE
    // Fahrstrecke (Hin+Rück) verwenden, NICHT die volle. Das war zuvor der
    // Bug, der dazu führte, dass praktisch immer WT25/WN25 (letzte Staffel)
    // gewählt wurde, da die volle (verdoppelte) Strecke fast immer über der
    // 25-km-Einfachstrecken-Schwelle lag.
    const luftEinfach = isNaN(luftVal) ? fahrVal/2 : luftVal;
    if(sollReiseGelten(fahrVal, luftEinfach)){
      ausgewaehlt.add('REISE');
    } else if(normZeit){
      // Tag/Nacht-Staffel wie am PC (WegegeldZifferBestimmen): Tag =
      // 07:00-18:59, Nacht = 19:00-06:59 -- eigenstaendige Grenze, NICHT
      // identisch mit der F/G-Zeitzuschlag-Grenze (20/6 Uhr).
      const min = zeitInMinuten(normZeit);
      const nacht = !(min>=7*60 && min<19*60);
      const tabelle = nacht ? WEGEGELD_NACHT : WEGEGELD_TAG;
      const bucket = tabelle.find(w => luftEinfach <= w.bisKm) || tabelle[tabelle.length-1];
      ausgewaehlt.add(bucket.ziffer);
    }
  }
  return ausgewaehlt;
}

/* ==========================================================
   ICD-10-GM Diagnose-Suche (repliziert die PC-Logik aus PT_UserFormRechnung:
   Suche ab 2 Zeichen, Treffer ueberall im Eintrag "Beschreibung [Code]",
   sortiert nach Fundposition, dann alphabetisch, max. 200 Treffer)
   ========================================================== */
function icdEintragBauen(code, txt){
  if(txt && code) return txt+' ['+code+']';
  return txt || code || '';
}
function icdSuchen(suchtext){
  const katalog = (typeof ICD_KATALOG!=='undefined') ? ICD_KATALOG : [];
  const such = (suchtext||'').trim();
  if(such.length<2 || !katalog.length) return [];
  const suchLower = such.toLowerCase();
  const treffer = [];
  for(let i=0;i<katalog.length;i++){
    const eintrag = icdEintragBauen(katalog[i][0], katalog[i][1]);
    const pos = eintrag.toLowerCase().indexOf(suchLower);
    if(pos>=0) treffer.push({eintrag, pos});
  }
  treffer.sort((a,b)=> a.pos-b.pos || a.eintrag.localeCompare(b.eintrag,'de'));
  return treffer.slice(0,200).map(t=>t.eintrag);
}

function allePositionenFlach(katalog){
  return [
    ...betaEigeneAlle(katalog===POSITIONEN_LS ? 'ls' : 'pt').map(betaEigenePositionAlsAuswahl),
    ...(katalog.grundleistung||[]),
    ...ZUSCHLAEGE_ZEIT,
    ...WEGEGELD_TAG, ...WEGEGELD_NACHT,
    {ziffer:'REISE', bez:REISEENTSCHAEDIGUNG.bez, betrag:REISEENTSCHAEDIGUNG.betrag}
  ];
}

// Werkzeug (Start -> "Apotheken-Notdienst"): ermittelt den aktuellen
// GPS-Standort, wandelt ihn per Nominatim-Reverse-Geocoding in PLZ+Ort um
// und oeffnet damit DIREKT die Ergebnisseite der aponet.de-Umkreissuche
// (URL-Muster "https://www.aponet.de/notdienstsuche/<PLZ>-<Ort>", von
// aponet.de selbst so verlinkt -- zeigt sofort die Notdienst-Apotheken im
// Umkreis, kein manuelles Eintippen von PLZ/Ort mehr noetig). Schlaegt die
// Standort- oder Adressermittlung fehl (kein GPS, Berechtigung verweigert,
// kein Internet), wird ersatzweise die normale aponet.de-Notdienstsuche
// geoeffnet, in der PLZ/Ort dann wie gewohnt manuell eingegeben werden
// koennen -- das Werkzeug bleibt so in jedem Fall nutzbar. ALLE Hinweise
// dazu laufen ueber den bestehenden Toast (appToastAnzeigen), NIE ueber ein
// natives confirm()/alert() (siehe Vorgabe: keine nativen Popups in der
// Handy-App).
async function notapothekenSucheOeffnen(){
  const APONET_SUCHE = 'https://www.aponet.de/apotheke/notdienstsuche';
  const btn = document.getElementById('btnNotapotheke');
  const btnTextOriginal = btn ? btn.innerHTML : '';
  const zuruecksetzen = ()=>{ if(btn){ btn.disabled = false; btn.innerHTML = btnTextOriginal; } };

  if(!('geolocation' in navigator)){
    appToastAnzeigen('Standortermittlung wird von diesem Gerät/Browser nicht unterstützt -- aponet.de wird zum manuellen Suchen geöffnet.', 3200);
    window.open(APONET_SUCHE, '_blank');
    return;
  }

  if(btn){
    btn.disabled = true;
    btn.innerHTML = 'Standort wird ermittelt…<span class="unter">Bitte kurz warten</span>';
  }

  navigator.geolocation.getCurrentPosition(async (pos)=>{
    try{
      const {latitude, longitude} = pos.coords;
      const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}&zoom=18&addressdetails=1`;
      const res = await fetch(url, {headers:{'Accept':'application/json'}});
      const data = await res.json();
      const a = (data && data.address) || {};
      const plz = a.postcode;
      // Nominatim liefert bei manchen Orten den amtlichen Doppelnamen mit
      // Schraegstrich (z.B. "Lahr/Schwarzwald") -- fuer die aponet.de-URL
      // wird bewusst nur der eigentliche Ortsname VOR dem "/" verwendet
      // (bestaetigt funktionierendes URL-Muster, z.B. ".../77933-Lahr" statt
      // eines fehlerhaften verschachtelten Pfads ".../77933-Lahr/Schwarzwald").
      // Verbleibende Leerzeichen (mehrteilige Ortsnamen) werden zu Bindestrich.
      const ortRoh = a.city || a.town || a.village || a.municipality || a.city_district || '';
      const ort = ortRoh.split('/')[0].trim().replace(/\s+/g,'-');
      // Strasse+Hausnummer: aponet.de bietet dafuer zwar ein Verfeinerungs-
      // Feld ("Straße und Hausnummer") auf der Ergebnisseite, aber KEIN
      // bestaetigtes, zuverlaessiges URL-Parameter dafuer -- ein geratener
      // Parameter koennte die Suche unbemerkt verfaelschen statt sie zu
      // praezisieren. Stattdessen wird die Adresse in die Zwischenablage
      // kopiert, damit sie auf der geoeffneten Seite bei Bedarf direkt in
      // genau dieses Feld eingefuegt werden kann.
      const strasse = [a.road, a.house_number].filter(Boolean).join(' ');
      if(plz && ort){
        window.open(`https://www.aponet.de/notdienstsuche/${encodeURIComponent(plz)}-${encodeURIComponent(ort)}`, '_blank');
        if(strasse){
          try{
            await navigator.clipboard.writeText(strasse);
            appToastAnzeigen(`"${strasse}" wurde in die Zwischenablage kopiert -- für eine genauere Umkreissuche auf aponet.de bei "Straße und Hausnummer" einfügen.`, 4200);
          }catch(e){ /* Zwischenablage optional -- PLZ/Ort-Suche ist bereits geoeffnet */ }
        }
      } else {
        appToastAnzeigen('Standort konnte keiner eindeutigen PLZ/Ort zugeordnet werden -- aponet.de wird zum manuellen Suchen geöffnet.', 3200);
        window.open(APONET_SUCHE, '_blank');
      }
    }catch(e){
      appToastAnzeigen('PLZ/Ort zum Standort konnte nicht ermittelt werden (vermutlich kein Internet) -- aponet.de wird zum manuellen Suchen geöffnet.', 3200);
      window.open(APONET_SUCHE, '_blank');
    }finally{
      zuruecksetzen();
    }
  }, (err)=>{
    const verweigert = err && err.code === err.PERMISSION_DENIED;
    appToastAnzeigen(verweigert
      ? 'Standortzugriff wurde verweigert -- aponet.de wird zum manuellen Suchen geöffnet.'
      : 'Standort konnte nicht ermittelt werden -- aponet.de wird zum manuellen Suchen geöffnet.', 3200);
    window.open(APONET_SUCHE, '_blank');
    zuruecksetzen();
  }, {enableHighAccuracy:true, timeout:10000, maximumAge:300000});
}

          <path d="M24 13c-4.4 0-8 3.4-8 7.8 0 5.8 8 14.2 8 14.2s8-8.4 8-14.2c0-4.4-3.6-7.8-8-7.8z" fill="#e0303f"/>
          <circle cx="24" cy="20.8" r="3" fill="#fff"/>

    </div>`;
  app.innerHTML = html;

  // FIX (Rueckmeldung: Icon-Badge war nicht wirklich quadratisch): CSS

  // laessig -- stattdessen nach dem Rendern die TATSAECHLICHE Hoehe des
  // Buttons daneben messen und Breite/Hoehe des Badges explizit darauf

  requestAnimationFrame(()=>{
    const btnZw = document.getElementById('btnLuftZwischenablage');
    document.querySelectorAll('.luft-zwischenablage-reihe .luft-maps-icon').forEach(iconEl=>{
      if(btnZw && btnZw.offsetHeight){
        iconEl.style.width = btnZw.offsetHeight + 'px';
        iconEl.style.height = btnZw.offsetHeight + 'px';

  const ergebnisEl = document.getElementById('luftErgebnis');
  // Eigene, deutlich groessere/auffaelligere Darstellung fuer das

  const zeigeErgebnis = (html, istFehler)=>{
    if(!html){ ergebnisEl.classList.remove('aktiv'); ergebnisEl.innerHTML=''; return; }
    ergebnisEl.classList.add('aktiv');
    ergebnisEl.classList.toggle('fehler', !!istFehler);

  // KORREKTUR (Rueckmeldung: doch wieder wie urspruenglich -- einfach nur

  document.getElementById('btnLuftMapsOeffnen').onclick = ()=>{

  // Fruehere Startadressen (nur auf diesem Geraet), antippen = uebernehmen, x = loeschen
  const startListeZeichnen = ()=>{
    const el = document.getElementById('luftStartListe'); if(!el) return;

    const liste = (eL.luftStartAdressen || []).filter(a=> a && a !== eL.praxisadresse);
    const vonJetzt = document.getElementById('txtLuftVon').value.trim();
    el.innerHTML = ((eL.praxisadresse && vonJetzt !== eL.praxisadresse) || liste.length ? '<span class="luft-start-titel">Zuletzt genutzt:</span>' : '') + (eL.praxisadresse && vonJetzt !== eL.praxisadresse

    const lat = pos.coords.latitude, lon = pos.coords.longitude;

      const r = await fetch('https://nominatim.openstreetmap.org/reverse?format=json&addressdetails=1&zoom=18&lat=' + lat + '&lon=' + lon, { headers:{ 'Accept':'application/json' } });

      const luft = kmLuftlinieEinfach(start, ziel);
      let zeile2;
      // Wie bei "Alternativrouten"/der automatischen km-Berechnung: die
      // tatsaechliche Fahrstrecke (nicht nur die verdoppelte Luftlinie als
      // grobe Schaetzung) ueber denselben Routendienst (OSRM) ermitteln --
      // derselbe Code, der auch sonst fuer Hin- und Rueckfahrt verwendet
      // wird (routeAlternativen liefert die Einfachstrecke je Route).
      try{
        const routen = await routeAlternativen(start, ziel);
        if(routen && routen.length){
          const kmGesamt = routen[0].km*2;
          zeile2 = `<strong>Fahrstrecke (Hin- und Rückfahrt):</strong> ${kmGesamt.toFixed(1).replace('.',',')} km`;
        } else {
          zeile2 = `<span class="luft-ergebnis-hinweis">Fahrstrecke konnte nicht ermittelt werden -- nur die Luftlinie steht zur Verfügung.</span>`;
        }
      }catch(routenErr){
        zeile2 = `<span class="luft-ergebnis-hinweis">Fahrstrecke konnte nicht berechnet werden.${keinInternetHinweisText()} Nur die Luftlinie steht zur Verfügung.</span>`;
      }
      // Wegegeld-Karte NFP Offenburg (Zone ab NFP, unabhaengig von der Startadresse)
      let kartenZeile = '';
      try{
        const kp = nfpGeoZuPixel(ziel.lat, ziel.lon);
        if(nfpImBild(kp)){ const kb = nfpBewertung(kp); kartenZeile = `<div class="luft-ergebnis-zeile"><strong>Wegegeld-Karte NFP:</strong> ${htmlEsc(kb.text)} → ${htmlEsc(nfpStufeLabel(kb.stufe))}</div>`; }
      }catch(_){}
      zeigeErgebnis(`<div class="luft-ergebnis-zeile luft-von-bis">Von ${htmlEsc(vonAdresse)}<br>bis ${htmlEsc(adresse)}</div>${kartenZeile}
        <div class="luft-ergebnis-zeile"><strong>Luftlinie (einfach):</strong> ${luft.toFixed(1).replace('.',',')} km</div>
        <div class="luft-ergebnis-zeile">${zeile2}</div>`, false);
    }catch(err){
      zeigeErgebnis('Berechnung fehlgeschlagen.'+keinInternetHinweisText(), true);
    }
  };
}

// Teilt "txtName" in Nachname/Vorname auf -- 1:1 wie am PC
// (RechnungErstellen_Click): ENTHÄLT der Name ein Komma, gilt das Format
// "Nachname, Vorname" (Teil vor dem Komma = Nachname). Ohne Komma gilt am
// PC stattdessen "Vorname Nachname" (natürliche Reihenfolge!) -- erstes
// leerzeichengetrenntes Wort = Vorname, LETZTES Wort = Nachname (ein
// mehrteiliger Nachname ohne Komma wie "Otto von Bismarck" würde am PC
// genauso nur "Otto" als Vorname und "Bismarck" als Nachname erkennen).
function nameAufteilen(cName){
  const name = (cName||'').trim();
  if(!name) return {nachname:'', vorname:''};
  if(name.indexOf(',')>=0){
    const teile = name.split(',');
    return {nachname:(teile[0]||'').trim(), vorname:(teile[1]||'').trim()};
  }
  const teile = name.split(' ').filter(Boolean);
  if(teile.length<2) return {nachname:'', vorname:''};
  return {vorname:teile[0], nachname:teile[teile.length-1]};
}

// Liefert die Diagnosen einer Privatrechnung als ICD-Kuerzel mit G/V-
// Kennzeichnung, EXAKT wie DiagnosenKuerzel() in PT_UserFormRechnung.frm am
// PC, z.B. "[I50.9;G], [J44.9;V]" -- der volle Diagnosetext steht nur im
// Word-Dokument, hier zaehlt nur das ICD-Kuerzel. Ein Diagnosetext aus dem
// ICD-Katalog endet immer auf " [CODE]" (siehe icdEintragBauen) -- genau wie
// am PC wird bei Freitext ohne eckige Klammern der gesamte Text als "Code"
// uebernommen (dieselbe bewusste Rueckfalllogik wie in DiagnosenKuerzel).
function diagnosenKuerzel(diagnosen){
  return (diagnosen||[]).map(d=>{
    const t = d.text||'';
    const p2 = t.lastIndexOf(']');
    const p1 = t.lastIndexOf('[');
    let code = (p1>=0 && p2>p1) ? t.slice(p1+1, p2) : t;
    const fl = d.flags||'';
    if(fl.indexOf('G')>=0) code += ';G';
    if(fl.indexOf('V')>=0) code += ';V';
    return '['+code+']';
  }).join(', ');
}

// Baut aus einem Fall EINE tab-getrennte Zeile im Format der Excel-
// Rechnungsübersicht (vom Nutzer bestätigte Spaltenreihenfolge A..Y),
// damit sie sich direkt in Excel einfügen laesst (Excel/Sheets trennen
// beim Einfuegen automatisch an Tabs in eigene Zellen).
// Spalte Q (Rechnungsnummer) wird -- sofern in den Einstellungen ein
// Zaehler-Abgleich hinterlegt ist -- bereits hier exakt nach PC-Schema
// vergeben (siehe rechnungsnummerBerechnen). Spalte U (Rechnungspositionen +
// km, siehe unten) wird ebenfalls schon hier befuellt. Die uebrigen Spalten
// R,S,T,V..Y (Brief/Zahlung/Mahnwesen) werden am PC beim eigentlichen
// Rechnungserstellen/-versenden gepflegt und bleiben daher bewusst leer --
// ebenso alle Sterbeort-/Bestatter-Spalten bei einer Privatrechnung (PT), da
// es dort begrifflich keinen Sterbeort/Bestatter gibt.
function faelleAlsUebersichtsZeilen(faelle){
  return faelle.map(f=>{
    const w = f.werte;
    const spalten = new Array(25).fill(''); // A..Y
    const {nachname, vorname} = nameAufteilen(w.txtName);
    spalten[0] = f.art==='ls' ? 'L' : 'P';                          // A: L/P
    spalten[1] = w.txtDatumExcel || '';                              // B: Datum LS/HB
    spalten[2] = w.txtZeitLS || '';                                  // C: Uhrzeit LS/HB
    spalten[5] = nachname;                                           // F: Name
    spalten[6] = vorname;                                            // G: Vorname
    spalten[7] = w.txtGeda || '';                                    // H: Geburtsdatum
    spalten[8] = w.txtPAdresse1 || '';                                // I: Adresse1 Patient
    spalten[9] = w.txtPAdresse2 || '';                                // J: Adresse2 Patient
    if(f.art==='ls'){
      spalten[3] = w.txtSterbedatum || '';                           // D: Datum Tod
      spalten[4] = w.txtTodeszeit || '';                             // E: Uhrzeit Tod
      // Sterbeort: wie am PC (AktiverAdressBlock) gilt bei ausgefuelltem
      // "Sterbeort abweichend"-Block DIESER als Sterbeort. Ist der Block
      // NICHT ausgefuellt, ist der Sterbeort per Definition derselbe wie
      // die Patientenadresse -- genau wie am PC steht dafuer aber NICHT
      // die Adresse nochmal ausgeschrieben in der Spalte, sondern wörtlich
      // "idem" (Adresse1 UND Adresse2), unabhängig davon, ob die
      // Patientenadresse selbst ausgefuellt ist.
      spalten[10] = w.txtSterbeAdr1 || 'idem';                        // K: Adresse1 Sterbeort
      spalten[11] = w.txtSterbeAdr2 || 'idem';                        // L: Adresse2 Sterbeort
      spalten[12] = w.txtBName || '';                                 // M: Bestatter
      spalten[13] = w.txtAdresse1 || '';                              // N: Adresse1 Bestatter
      spalten[14] = w.txtAdresse2 || '';                              // O: Adresse2 Bestatter
    }
    // KORREKTUR: Spalte M bleibt bei einer Privatrechnung LEER -- das echte
    // PC-seitige Zurueckschreiben in die Uebersicht (SchreibeInUebersicht in
    // Modul1, beim Absenden-Klick) schreibt dort NICHTS hinein, das ICD-
    // Kuerzel steht bereits vollstaendig in Spalte U (siehe spalten[20]
    // unten). Vorher stand hier zusaetzlich/faelschlich das ICD-Kuerzel,
    // das von der echten Rechnungserstellung nie ueberschrieben wurde und
    // so als falscher Eintrag in der Uebersicht stehen blieb.
    const diagKuerzel = f.art==='pt' ? diagnosenKuerzel(w.diagnosen) : '';
    spalten[15] = w.txtBetrag || '';                                  // P: Betrag
    spalten[16] = f.rechnungsnummer || '';                            // Q: Rechnungsnummer
    // Spalte U: Rechnungspositionen + km, EXAKT im Format von SpalteUBauen()
    // am PC ("POS:<Ziffer1,Ziffer2,...> | KM:<kmWert>" [+ " | ICD:<Kuerzel>"
    // bei PT], Modul1 LS/PT) -- wird dort normalerweise erst beim
    // tatsaechlichen Rechnungserstellen aus dem Blattzustand gebaut, hier
    // stattdessen direkt aus den am Handy gewaehlten Positionen
    // (f.positionen), dem km-Feld und (bei PT) den Diagnosen. Dadurch kann
    // die Excel-Rechnungserstellung (UserFormRechnung) beim Öffnen
    // automatisch "Rechnungspositionen aus Spalte U wiederherstellen" (siehe
    // dortiger Kommentar) -- am PC muss nichts davon nochmal manuell
    // eingetragen werden. SpalteUZerlegen() sucht nur "POS:"/"KM:"/"ICD:"
    // jeweils bis zum naechsten "|" -- ein spaeter von der HTA angehaengtes
    // "| LXP:..."-Flag (LxpFlagSetzen, ebenfalls Spalte U) stoert das nicht.
    spalten[20] = 'POS:'+(f.positionen||[]).join(',')+' | KM:'+(w.txtKm||'0')
      + (diagKuerzel ? ' | ICD:'+diagKuerzel : '');                   // U: Rechnungspositionen + km (+ ICD bei PT)
    // R,S,T,V..Y: bewusst leer, siehe Kommentar oben.
    return spalten.join('\t');
  }).join('\n');
}

// Vergibt für alle übergebenen Fälle, die noch keine Rechnungsnummer
// besitzen, eine neue -- exakt nach PC-Schema und mit lokal fortgeführtem
// Zaehler (siehe rechnungsnummerBerechnen/rnZaehlerAusRenu). Bereits
// vergebene Nummern (z.B. bei erneutem Kopieren desselben Falls) werden
// nie überschrieben, damit keine Dopplungen/Lücken in der Übersicht
// entstehen. Persistiert die vergebenen Nummern zurück in den jeweiligen
// Fall (ls/pt) sowie den erhöhten Zaehler in den Einstellungen.
// Gibt zurück, wie viele Fälle KEINE Nummer erhalten konnten (weil noch
// kein Zaehler-Abgleich in den Einstellungen hinterlegt ist).
async function rechnungsnummernVergeben(faelleAusw){
  let zaehler = await naechsterRenuZaehlerErmitteln();
  let ohneNummer = 0;
  const faelleNachArt = {ls: ladeFaelle('ls'), pt: ladeFaelle('pt')};
  let geaendert = {ls:false, pt:false};
  faelleAusw.forEach(f=>{
    if(f.rechnungsnummer){ return; } // bereits vergeben, nicht erneut vergeben
    if(!zaehler){ ohneNummer++; return; }
    const {nachname, vorname} = nameAufteilen(f.werte.txtName);
    const datumNorm = normalisiereDatum(f.werte.txtDatumExcel);
    const nummer = rechnungsnummerBerechnen(nachname, vorname, datumNorm, zaehler);
    if(!nummer){ ohneNummer++; return; }
    f.rechnungsnummer = nummer;
    faelleNachArt[f.art][f.idx].rechnungsnummer = nummer;
    geaendert[f.art] = true;
    zaehler++;
  });
  if(geaendert.ls) speichereFaelle('ls', faelleNachArt.ls);
  if(geaendert.pt) speichereFaelle('pt', faelleNachArt.pt);
  const eNeu = ladeEinstellungen();
  if(zaehler !== eNeu.rnNaechsterZaehler){
    eNeu.rnNaechsterZaehler = zaehler;
    speichereEinstellungen(eNeu);
  }
  return ohneNummer;
}

  if(msGraphStatus==='angemeldet') lokaleFaelleBereitsUebernommenEntfernen(alle);

  }
  app.innerHTML = `
    <div class="leer-hinweis" style="margin-bottom:10px;">Automatisch vor jedem Sync-Versuch angelegt (letzte ${BACKUP_MAX} Stände). "Wiederherstellen" ersetzt die aktuellen lokalen Rechnungen durch diesen Stand. Zum Ansehen der enthaltenen Rechnungen auf die Zeile tippen.</div>
    <div id="backupsListe">
      ${liste.map((b,i)=>{
        const stand = JSON.parse(b.inhalt);
        return `<div class="backup-eintrag-wrapper" data-i="${i}">
          <div class="fall-zeile backup-zeile" data-i="${i}">
            <div class="inhalt">
              <div class="name">${new Date(b.zeitstempel).toLocaleString('de-DE')}</div>
              <div class="info">${stand.ls.length} LS, ${stand.pt.length} PT</div>
            </div>
            <button type="button" class="btn-sekundaer btn-backup-wiederherstellen" data-i="${i}">Wiederherstellen</button>
          </div>
          <div class="backup-rechnungen" id="backupRechnungen${i}" style="display:none;"></div>
        </div>`;
      }).join('')}
    </div>
    <div class="warnhinweis" id="backupsHinweis"></div>`;

  const zeigeHinweisBackup = (txt)=>{
    const el = document.getElementById('backupsHinweis');
    if(!txt){ el.classList.remove('aktiv'); el.innerHTML=''; return; }
    el.innerHTML = txt; el.classList.add('aktiv');
  };

  // NUTZERWUNSCH: "Wiederherstellen" soll unabhaengig davon funktionieren,
  // ob die Zeile gerade auf- oder zugeklappt ist -- deshalb in eine
  // gemeinsame Funktion ausgelagert, die sowohl vom Button oben in der
  // Kopfzeile als auch von einem zweiten Button unten im aufgeklappten
  // Panel aufgerufen wird (siehe dort), statt nur EINEN Button zu verdrahten.
  const wiederherstellenAusloesen = (i)=>{
    const stand = JSON.parse(liste[i].inhalt);
    const zeitpunkt = new Date(liste[i].zeitstempel).toLocaleString('de-DE');
    zeigeHinweisBackup(`Stand vom ${zeitpunkt} wiederherstellen (${stand.ls.length} LS, ${stand.pt.length} PT)? Die AKTUELL lokal gespeicherten Rechnungen werden dabei ersetzt.
      <div class="aktionen">
        <button data-akt="backupJa">Ja, wiederherstellen</button>
        <button data-akt="backupNein">Abbrechen</button>
      </div>`);
    const hinweisEl = document.getElementById('backupsHinweis');
    hinweisEl.querySelector('[data-akt="backupNein"]').onclick = ()=> zeigeHinweisBackup('');
    hinweisEl.querySelector('[data-akt="backupJa"]').onclick = ()=>{
      speichereFaelle('ls', stand.ls);
      speichereFaelle('pt', stand.pt);
      appToastAnzeigen('Backup wiederhergestellt.', 2200);
      ansichtKorrigieren();
    };
  };

  // NUTZERWUNSCH: Klick auf die Backup-Zeile (nicht auf "Wiederherstellen")
  // klappt die im Stand enthaltenen Rechnungen (LS + PT, mit Name/Datum)
  // darunter auf/zu -- rein informativ, keine Aktion auf den Eintraegen
  // selbst. Wird nur beim ersten Aufklappen befuellt (Lazy-Rendering).
  // Der zweite "Wiederherstellen"-Button unten im Panel wird HIER mit
  // befuellt (dynamisch eingefuegt), deshalb direkt beim Erzeugen verdrahtet
  // statt ueber ein spaeteres querySelectorAll.
  app.querySelectorAll('.backup-zeile').forEach(zeile=>{
    zeile.style.cursor = 'pointer';
    zeile.onclick = (ev)=>{
      if(ev.target.closest('.btn-backup-wiederherstellen')) return;
      const i = parseInt(zeile.dataset.i,10);
      const panel = document.getElementById('backupRechnungen'+i);
      if(!panel) return;
      const eingeklappt = panel.style.display === 'none';
      if(eingeklappt && !panel.dataset.befuellt){
        const stand = JSON.parse(liste[i].inhalt);
        const eintraege = [
          ...stand.ls.map(f=>({...f, art:'ls'})),
          ...stand.pt.map(f=>({...f, art:'pt'}))
        ];
        panel.innerHTML = (eintraege.length
          ? eintraege.map(f=>`
              <div class="backup-rechnung-zeile">
                <span class="badge-neu ${f.art}">${f.art==='ls'?'L':'P'}</span>
                <span class="name">${(f.werte && f.werte.txtName) || '(ohne Namen)'}</span>
                <span class="info">${(f.werte && f.werte.txtDatum) || ''}${f.rechnungsnummer ? ' &middot; Nr. ' + f.rechnungsnummer : ''}</span>
              </div>`).join('')
          : '<div class="leer-hinweis">Dieser Stand enthält keine Rechnungen.</div>')
          + '<button type="button" class="btn-sekundaer btn-backup-wiederherstellen backup-wiederherstellen-panel" data-i="'+i+'">Wiederherstellen</button>';
        panel.querySelector('.backup-wiederherstellen-panel').onclick = (ev2)=>{
          ev2.stopPropagation();
          wiederherstellenAusloesen(i);
        };
        panel.dataset.befuellt = '1';
      }
      panel.style.display = eingeklappt ? 'block' : 'none';
    };
  });

  app.querySelectorAll('.fall-zeile.backup-zeile .btn-backup-wiederherstellen').forEach(btn=>{
    btn.onclick = (ev)=>{
      ev.stopPropagation();
      wiederherstellenAusloesen(parseInt(btn.dataset.i,10));
    };
  });
}

// Prueft fuer alle uebergebenen (lokalen) Faelle per Graph-API/Fingerabdruck,
// ob sie bereits in der Rechnungsuebersicht stehen (exakt dieselbe Logik wie
// beim Einlesen "Aus Handy einlesen" am PC) -- und entfernt Treffer aus dem
// lokalen Speicher: sobald ein Fall am PC uebernommen wurde, gehoert er in
// die Rechnungsverwaltung (dort ist er per Definition schon vorhanden;
// Vollstaendigkeit/rote Markierung wird dort, nicht hier, angezeigt), nicht
// mehr in "Lokale Rechnungen". Analog zum Loeschen ueber "Ausgewaehlte
// loeschen": je Art absteigend nach idx loeschen, damit sich Indizes der
// noch zu loeschenden Eintraege nicht verschieben.
async function lokaleFaelleBereitsUebernommenEntfernen(alle){
  const map = await msGraphUebersichtFingerprintsLaden();
  if(!map) return; // kein Login/kein Netz/Fehler -- lokale Liste bleibt unveraendert

  const gefunden = alle.filter(f=> map.has(fallFingerprintBauen(f)));
  if(!gefunden.length) return;

  // NICHT allein anhand "Zeile existiert in der Uebersicht" loeschen: die
  // Zeile kann auch dann schon angelegt sein, wenn die stille Erzeugung am
  // PC den Fall uebersprungen hat (Pflichtfeld/Betrag/Jahr unklar, siehe
  // StillFallUebersprungen) -- genau dieser Fall wird dort dann per
  // Warnhinweis rot markiert und braucht ggf. noch manuelle Anpassungen.
  // Wuerde man den lokalen Fall trotzdem schon loeschen, waere er komplett
  // weg, sobald die Uebersicht-Zeile einmal existiert. Deshalb zusaetzlich
  // pruefen, ob am Ziel-PDF-Ordner tatsaechlich schon eine fertige PDF
  // liegt (wie schon fuer die "unvollstaendig"-Markierung in
  // ansichtAlleRechnungen genutzt) -- nur dann wirklich eine fertige
  // Rechnung, erst dann lokal loeschen.
  const uebernommen = [];
  for(const f of gefunden){
    const eintrag = map.get(fallFingerprintBauen(f));
    const renu = eintrag && eintrag.renu;
    if(!renu) continue;
    const pdfUrl = await msGraphPdfWebUrlLaden(renu);
    if(pdfUrl) uebernommen.push(f);
  }
  if(!uebernommen.length) return;

  // Vor dem Loeschen zusaetzlich sichern -- auch bei erfolgreicher
  // Uebernahme schadet ein Backup nicht und deckt den Fall ab, dass die
  // PDF-Pruefung selbst (Netzwerk) mal einen Fehlalarm liefert.
  backupVorSyncAnlegen();

  ['ls','pt'].forEach(art=>{
    const idxListe = uebernommen.filter(f=>f.art===art).map(f=>f.idx).sort((a,b)=>b-a);
    if(!idxListe.length) return;
    const arr = ladeFaelle(art);
    idxListe.forEach(i=> arr.splice(i,1));
    speichereFaelle(art, arr);
  });

  appToastAnzeigen(`${uebernommen.length} Rechnung(en) wurden bereits am PC übernommen (PDF vorhanden) und sind jetzt in der Rechnungsverwaltung zu finden.`, 3000);
  // Nur neu rendern, wenn diese Ansicht (inzwischen) noch aktiv ist -- ein
  // schneller Wegklick waehrend die Graph-Antwort noch unterwegs war soll
  // nicht versehentlich eine andere, laengst geoeffnete Ansicht ueberschreiben.
  if(document.getElementById('korrigierenListe')) ansichtKorrigieren();
}

// Eigenstaendige Ansicht (Start -> "Rechnungsverwaltung"): zeigt WIRKLICH
// jede Zeile der Excel-Rechnungsuebersicht per Graph-API, unabhaengig davon,
// ob der Fall lokal auf dem Handy gespeichert ist -- im Unterschied zur
// "Lokale Rechnungen"-Liste (ansichtKorrigieren), die nur lokal gespeicherte,
// noch nicht am PC uebernommene Faelle zeigt (und deren Eintraege nach
// erfolgtem PC-Sync automatisch von dort verschwinden). Grundsaetzlich rein
// lesend (Suchen/Filtern, PDFs oeffnen) -- siehe Begruendung im Kommentar bei
// msGraphAlleZeilenLaden weiter oben. EINZIGE Ausnahme: eine "unvollstaendige"
// Zeile, zu der noch ein lokal gespeicherter Fall existiert, ist antippbar
// und oeffnet diesen zum Bearbeiten (siehe alsUnvollstaendigMarkieren /
// lokalenFallFuerZeileFinden weiter unten) -- fuer alle anderen Zeilen bleibt
// es bei reiner Anzeige. PDF-Links werden erst beim Antippen einer Zeile
// nachgeladen, nicht vorab
// fuer die ganze (potenziell lange) Liste -- Ausnahme: fuer ein begrenztes
// Fenster der zuletzt hinzugekommenen Zeilen wird die PDF-Pruefung eager
// vorgezogen, um unvollstaendige (von der stillen Erzeugung am PC
// uebersprungene) Faelle zeitnah rot zu markieren, ohne bei einer langen
// Liste auf einen Schlag hunderte Graph-Anfragen abzufeuern.
let alleRechnungenCache = null; // pro App-Sitzung gecacht, "Neu laden" erzwingt Refresh
async function ansichtAlleRechnungen(){
  vorbereiteRuecksprung = ()=>{ ruecksprungAusEinstellungen = ()=>ansichtAlleRechnungen(); };
  setzeTitel('Rechnungsverwaltung', ansichtStart);
  app.innerHTML = `
    <div class="feld" style="margin-bottom:6px;">
      <input type="text" id="txtAlleSuche" autocomplete="off" placeholder="Suche: Name oder Rechnungsnummer">
    </div>
    <button class="btn-sekundaer" id="btnAlleNeuLaden" style="margin-bottom:12px;">Neu laden</button>
    <div id="alleRechnungenListe"><div class="leer-hinweis">Lade Rechnungsübersicht...</div></div>`;

  const suchfeld = document.getElementById('txtAlleSuche');
  suchfeld.oninput = ()=> alleRechnungenListeRendern(alleRechnungenCache, suchfeld.value);
  document.getElementById('btnAlleNeuLaden').onclick = async ()=>{
    document.getElementById('alleRechnungenListe').innerHTML = '<div class="leer-hinweis">Lade Rechnungsübersicht...</div>';
    alleRechnungenCache = await msGraphAlleZeilenLaden();
    alleRechnungenListeRendern(alleRechnungenCache, suchfeld.value);
  };

  if(!alleRechnungenCache) alleRechnungenCache = await msGraphAlleZeilenLaden();
  alleRechnungenListeRendern(alleRechnungenCache, suchfeld.value);
}

function alleRechnungenListeRendern(cache, suchtext){
  const zielEl = document.getElementById('alleRechnungenListe');
  if(!zielEl) return;
  if(cache === null){
    const grund = rnLiveFehler ? String(rnLiveFehler).replace(/&/g,'&amp;').replace(/</g,'&lt;') : 'kein Netz oder nicht angemeldet';
    zielEl.innerHTML = '<div class="leer-hinweis">Rechnungsübersicht konnte nicht geladen werden (' + grund + '). Bitte "Neu laden" versuchen.</div>';
    return;
  }
  const liste = cache.liste, blattName = cache.blattName;
  const suche = (suchtext||'').trim().toLowerCase();
  const gefiltert = suche ? liste.filter(f=>
    (f.nachname+' '+f.vorname).toLowerCase().includes(suche) || f.renu.toLowerCase().includes(suche)
  ) : liste;

  if(!gefiltert.length){
    zielEl.innerHTML = '<div class="leer-hinweis">Keine Treffer.</div>';
    return;
  }
  // Lange Listen nicht komplett auf einmal rendern -- erste 150 Treffer,
  // Rest durch Eingrenzen der Suche statt endlosem Scrollen erreichbar.
  const MAX_ANZEIGE = 150;
  const anzuzeigen = gefiltert.slice(0, MAX_ANZEIGE);

  zielEl.innerHTML = anzuzeigen.map((f,i)=>`
    <div class="fall-zeile ${f.art==='L'?'ls':'pt'}" data-i="${i}">
      <div class="inhalt">
        <div class="name"><span class="badge-neu ${f.art==='L'?'ls':'pt'}">${f.art==='L'?'L':'P'}</span>${f.nachname}, ${f.vorname}</div>
        <div class="info">${f.datum || ''}${f.betrag ? ' &middot; ' + f.betrag + ' €' : ''}${f.renu ? ' &middot; Nr. ' + f.renu : ' &middot; ohne Rechnungsnummer'}</div>
      </div>
      <div class="fall-icons"><span class="brief-platz"></span><span class="pdf-platz"></span></div>
    </div>`).join('') +
    (gefiltert.length > MAX_ANZEIGE ? `<div class="leer-hinweis">${gefiltert.length - MAX_ANZEIGE} weitere Treffer -- bitte Suche eingrenzen.</div>` : '');

  // "unvollstaendig" markieren (roter Name + rotes Warnsymbol rechts): der
  // Fall wurde von der stillen Erzeugung am PC (gStillModus, Modul1.bas)
  // noch NICHT zu einer fertigen Rechnung gemacht -- entweder weil noch
  // keine Rechnungsnummer gezogen wurde (Spalte Q leer, ohne Renu ist keine
  // Erzeugung moeglich), oder weil trotz Renu noch kein passendes PDF im
  // Zielordner liegt (uebersprungener Fall: Pflichtfeld/Datum/Betrag/Jahr
  // etc. -- siehe StillFallUebersprungen).
  // NUTZERWUNSCH: existiert zu dieser Zeile noch ein lokal auf dem Handy
  // gespeicherter Fall (lokalenFallFuerZeileFinden -- moeglich, weil ein
  // solcher Fall bei Sync-Problemen NICHT geloescht wird, siehe
  // lokaleFaelleBereitsUebernommenEntfernen), wird die Zeile stattdessen
  // direkt zum Bearbeiten antippbar (oeffnet denselben Bearbeiten-Dialog wie
  // in "Lokale Rechnungen") -- die vollstaendigen Angaben (Adresse,
  // Diagnosen, Positionen) sind dort ja noch vorhanden, in der schmalen
  // Uebersichtszeile dagegen nicht. Ohne lokalen Fund bleibt es beim reinen
  // Warnhinweis, Korrektur dann weiterhin manuell am PC.
  const alsUnvollstaendigMarkieren = (el, f)=>{
    el.classList.add('unvollstaendig');
    const platz = el.querySelector('.pdf-platz');
    const lokal = lokalenFallFuerZeileFinden(f);
    if(lokal){
      platz.innerHTML = '<span class="badge-unvollstaendig" title="Noch nicht als Rechnung erzeugt -- lokal auf dem Handy vorhanden, zum Bearbeiten antippen.">&#9998;</span>';
      el.style.cursor = 'pointer';
      el.onclick = ()=> ansichtMaske(lokal.art, lokal.idx);
    } else {
      platz.innerHTML = '<span class="badge-unvollstaendig" title="Noch nicht als Rechnung erzeugt -- bitte am PC über &quot;Rechnung korrigieren&quot; prüfen und ergänzen.">&#9888;</span>';
    }
  };

  // Eager-Fenster: fuer die ersten paar sichtbaren Zeilen wird der PDF-Status
  // sofort mitgeladen (statt erst beim Antippen), damit unvollstaendige
  // Faelle zeitnah rot auffallen -- ohne bei einer langen Liste auf einen
  // Schlag hunderte Graph-Anfragen abzufeuern. Darueber hinaus bleibt es
  // beim bewaehrten lazy Laden per Antippen.
  const EAGER_FENSTER = 40;

  zielEl.querySelectorAll('.fall-zeile').forEach(el=>{
    const i = parseInt(el.dataset.i,10);
    const f = anzuzeigen[i];
    if(!f.renu){
      // Ohne Rechnungsnummer sicher noch kein PDF vorhanden -- sofort rot.
      alsUnvollstaendigMarkieren(el, f);
      return;
    }
    el.style.cursor = 'pointer';
    el.onclick = async ()=>{
      const platz = el.querySelector('.pdf-platz');
      if(el.dataset.geladen === '1'){
        if(el.dataset.url) window.open(el.dataset.url, '_blank');
        return;
      }
      platz.innerHTML = ' <span style="font-size:12px; color:var(--text-schwach);">lädt…</span>';
      const url = await msGraphPdfWebUrlLaden(f.renu);
      el.dataset.geladen = '1';
      if(url){
        el.dataset.url = url;
        platz.innerHTML = '<span class="badge-pdf" title="Rechnung als PDF ansehen">&#128196;</span>';
        window.open(url, '_blank');
      } else {
        el.classList.remove('unvollstaendig');
        alsUnvollstaendigMarkieren(el, f);
      }
    };

    if(i < EAGER_FENSTER){
      msGraphPdfWebUrlLaden(f.renu).then(url=>{
        el.dataset.geladen = '1';
        if(url){
          el.dataset.url = url;
          const pdfBadge = document.createElement('span');
          pdfBadge.className = 'badge-pdf';
          pdfBadge.title = 'Rechnung als PDF ansehen';
          pdfBadge.innerHTML = '&#128196;';
          el.querySelector('.pdf-platz').appendChild(pdfBadge);
        } else {
          alsUnvollstaendigMarkieren(el, f);
        }
      });
      // Brief-Status (fett formatierte Spalte R = tatsaechlich per
      // LetterXpress versendet) separat und unabhaengig vom PDF-Status
      // nachladen -- eigener Graph-Aufruf pro Zeile, siehe
      // msGraphBriefVersendetLaden weiter oben.
      if(f.zeile){
        msGraphBriefVersendetLaden(blattName, f.zeile).then(versendet=>{
          if(versendet){
            const briefPlatz = el.querySelector('.brief-platz');
            if(briefPlatz) briefPlatz.innerHTML = '<span class="badge-brief" title="Rechnung wurde bereits versendet">&#128232;</span>';
          }
        });
      }
    }
  });
}

const RD_SONDER = {0x20AC:224, 0x2013:225, 0x2014:226, 0x201E:227, 0x201C:228, 0x2019:229};
// Geschaetzte Textbreite in pt (Arial, Groesse in pt)
function rdTextBreite(text, groesse, fett){
  const tab = fett ? RD_ARIAL_BREITEN.b : RD_ARIAL_BREITEN.r;
  let summe = 0;
  for(const ch of String(text)){
    const c = ch.codePointAt(0);
    let i = (c >= 32 && c <= 255) ? c - 32 : RD_SONDER[c];
    summe += (i !== undefined ? tab[i] : 556);
  }
  return summe / 1000 * groesse;
}

// ---------- Zahlenformate wie in Excel (deutsche Darstellung) ----------
function rdRunden2(v){ return Math.round((v + (v >= 0 ? 1e-9 : -1e-9)) * 100) / 100; }
function rdZahl(v, format){
  if(v === '' || v === null || v === undefined) return '';
  if(typeof v !== 'number'){ const n = Number(String(v).replace(',', '.')); if(isNaN(n)) return String(v); v = n; }
  if(format === 'general'){
    // Excel "Standard": so viele Nachkommastellen wie noetig (max. 9)
    let s = String(Math.round(v * 1e9) / 1e9);
    return s.replace('.', ',');
  }
  const mitTausender = format.indexOf('#,##0') === 0;
  const r = rdRunden2(Math.abs(v));
  let [ganz, dez] = r.toFixed(2).split('.');
  if(mitTausender) ganz = ganz.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  let s = (v < 0 ? '-' : '') + ganz + ',' + dez;
  if(format.indexOf('€') >= 0) s += ' €';
  return s;
}
function rdXml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ---------- Vorlage (Excel-Werte) in Positionsbloecke zerlegen ----------
// zeilen: 2D-Array ab Zelle A1 (wie Graph range(...).values)
function rdVorlageZerlegen(zeilen, art){
  const L = RECHNUNG_LAYOUT[art], o = L.ersteSpalte;
  const zelle = (r, i)=>{ const v = r[o + i]; return (v === null || v === undefined) ? '' : v; };
  const kopf = [0,1,2,3,4].map(i=> String(zelle(zeilen[0] || [], i)));
  const bloecke = [];
  let akt = null;
  for(let i = 1; i < zeilen.length; i++){
    const r = zeilen[i] || [];
    const bez = String(zelle(r, L.sp.bez)).trim();
    const zif = String(zelle(r, L.sp.ziffer)).trim();
    if(/^gesamt/i.test(bez)) break;
    const leer = [0,1,2,3,4].every(k=> String(zelle(r,k)).trim() === '');
    if(leer){ akt = null; continue; }
    if(zif !== ''){
      let typ = 'pos';
      if(/^reiseentsch/i.test(zif)) typ = 'reise';
      else if(/26 cent/i.test(bez)) typ = 'km';
      akt = { ziffer: zif, typ, zeilen: [r.slice(o, o + 5).map(v=> v === null || v === undefined ? '' : v)] };
      bloecke.push(akt);
    } else if(akt){
      akt.zeilen.push(r.slice(o, o + 5).map(v=> v === null || v === undefined ? '' : v));
    }
  }
  return {kopf, bloecke};
}

// Eigene (von Hand angelegte) Positionen als Bloecke wie aus der Vorlage:
// Bezeichnung wird passend zur Spaltenbreite auf mehrere Zeilen umbrochen.
function rdBezUmbrechen(text, breitePt){
  const zeilen = [];
  String(text || '').split(/\r\n|\n|\r/).forEach(absatz=>{
    let akt = '';
    absatz.split(/\s+/).filter(Boolean).forEach(wort=>{
      const probe = akt ? akt + ' ' + wort : wort;
      if(!akt || rdTextBreite(probe, 10, false) <= breitePt) akt = probe;
      else { zeilen.push(akt); akt = wort; }
    });
    zeilen.push(akt);
  });
  return zeilen.length ? zeilen : [''];
}
function rdBezBreite(art){
  const L = RECHNUNG_LAYOUT[art];
  return L.cols[L.sp.bez] - 2 * RECHNUNG_ZELLRAND_TWIPS / 20 - 1;
}
// Begruendung (bei Faktor ueber dem Schwellenwert) als Tabellenzeilen-Texte;
// leer -> keine Zeilen (dann steht auch kein "Begründung:" in der Rechnung)
function rdBegruendungZeilen(text, art){
  const t = String(text == null ? '' : text).replace(/\s+/g, ' ').trim();
  return t ? rdBezUmbrechen(t, rdBezBreite(art)) : [];
}
function rdBegruendungsBlock(L, zeilenTexte){
  return zeilenTexte.map((t, i)=>{
    const z = ['', '', '', '', ''];
    if(i === 0) z[L.sp.faktor] = 'Begründung:';
    z[L.sp.bez] = t;
    return z;
  });
}
function rdEigeneBloecke(eigene, art, begruendungen){
  const L = RECHNUNG_LAYOUT[art];
  const breite = rdBezBreite(art);
  return (eigene || []).map(p=>{
    const faktorZahl = Number(String(p.faktor == null ? '' : p.faktor).replace(',', '.'));
    const faktor = String(p.faktor == null ? '' : p.faktor).trim() === '' ? '' : (isNaN(faktorZahl) ? String(p.faktor) : faktorZahl);
    const zeilen = rdBezUmbrechen(p.bez, breite).map((t, i)=>{
      const z = ['', '', '', '', ''];
      z[L.sp.bez] = t;
      if(i === 0){ z[L.sp.ziffer] = String(p.ziffer || ''); z[L.sp.faktor] = faktor; z[L.sp.betrag] = Math.round(Number(p.betrag) * 100) / 100; }
      return z;
    });
    const schl = String(p.schluessel || p.id);
    if(begruendungen) zeilen.push(...rdBegruendungsBlock(L, rdBegruendungZeilen(begruendungen[schl.toUpperCase()], art)));
    return { ziffer: schl, nr: String(p.ziffer || ''), typ: 'pos', eigene: true, zeilen };
  });
}
// Faktor/Betrag und Begruendung je Fall in die Bloecke der Vorlage einsetzen.
// posDetails: {ZIFFER: {faktor, betrag}} (nur geaenderte Faktoren)
// begruendungen: {ZIFFER: text} -- ist das Objekt vorhanden, gilt es fuer
// alle Positionen (fehlender Eintrag = keine Begruendung). Ohne Objekt
// (aeltere Faelle) bleibt die Vorlage unveraendert.
const RD_VARIANTEN = { '7': ['Brustorganen', 'Bauchorganen', 'Stütz- und Bewegungsorganen', 'Hautorgan'] };
function rdBloeckeAnpassen(bloecke, fall){
  const L = RECHNUNG_LAYOUT[fall.art], S = L.sp;
  const det = fall.posDetails || {}, beg = fall.begruendungen;
  return bloecke.map(b=>{
    if(b.typ !== 'pos' || b.eigene) return b;
    const z = b.ziffer.toUpperCase();
    let zeilen = b.zeilen.map(r=> r.slice());
    const d = det[z];
    // Ziffer 7: gewaehltes Organsystem statt des Textes aus der Vorlage
    const vari = (fall.varianten || {})[z];
    if(vari && RD_VARIANTEN[z]){
      zeilen = zeilen.map(r=>{ const t = String(r[S.bez] || ''); const alt = RD_VARIANTEN[z].find(v=> t.indexOf(v) >= 0); if(!alt) return r; const n = r.slice(); n[S.bez] = t.replace(alt, vari); return n; });
    }
    if(d && d.faktor !== undefined && d.faktor !== null && d.faktor !== ''){
      zeilen[0][S.faktor] = Number(d.faktor);
      zeilen[0][S.betrag] = Math.round(Number(d.betrag) * 100) / 100;
    }
    if(beg){
      let ab = zeilen.findIndex((r, k)=> k > 0 && /^begr/i.test(String(r[S.faktor]).trim()));
      if(ab < 0) ab = zeilen.length;
      const datumAlt = zeilen.slice(ab).map(r=> r[S.datum]).find(v=> String(v).trim() !== '');
      zeilen = zeilen.slice(0, ab).concat(rdBegruendungsBlock(L, rdBegruendungZeilen(beg[z], fall.art)));
      // "UHRZEIT" (zweite Tabellenzeile) nicht mit der Begruendung verlieren
      if(datumAlt !== undefined && zeilen.length > 1 && String(zeilen[1][S.datum]).trim() === '') zeilen[1][S.datum] = datumAlt;
    }
    return { ...b, zeilen };
  });
}

// ---------- Tabellenzeilen fuer einen Fall bestimmen ----------
// fall: {art, positionen:[...], datum:'TT.MM.JJJJ', zeit:'HH:MM', km:Zahl}
function rdTabelleBauen(vorlage, fall){
  const L = RECHNUNG_LAYOUT[fall.art];
  const gewaehlt = new Set((fall.positionen || []).map(z=> String(z).trim().toUpperCase()));
  const reise = gewaehlt.has('REISE');
  const zeilen = [];
  const fehlend = [];
  let summe = 0;
  // Faktor/Begruendung je Fall
  vorlage = { kopf: vorlage.kopf, bloecke: rdBloeckeAnpassen(vorlage.bloecke, fall) };
  // eigene Positionen vor dem Wegegeld einreihen (wie eine Zeile der Vorlage)
  const eigene = rdEigeneBloecke((fall.eigene || []).filter(p=> gewaehlt.has(String(p.schluessel || p.id).toUpperCase())), fall.art, fall.begruendungen);
  if(eigene.length){
    const bl = vorlage.bloecke.slice();
    let pos = bl.findIndex(b=> b.typ !== 'pos' || /^W[TN]\d/i.test(b.ziffer));
    if(pos < 0) pos = bl.length;
    // eingebaute Zuschlaege (A-E) "unmittelbar im Anschluss an die
    // zugrundeliegende Leistung" (GOÄ), die uebrigen vor dem Wegegeld
    const zuschlaege = eigene.filter(b=> /^EIGZ/i.test(b.ziffer)), sonst = eigene.filter(b=> !/^EIGZ/i.test(b.ziffer));
    bl.splice(pos, 0, ...sonst);
    const nrVon = (b)=> String(b.nr || b.ziffer).toUpperCase();
    const istGrund = (b, z)=> {
      const n = nrVon(b), zahl = /^\d+$/.test(n) ? Number(n) : NaN;
      return /^EIGZE$/i.test(z.ziffer) ? ((zahl >= 45 && zahl <= 62) || n === '100' || n === '101') : ['1','3','4','5','6','7','8'].includes(n);
    };
    let nach = -1;
    zuschlaege.forEach(z=>{
      let i = nach >= 0 ? nach : bl.findIndex(b=> b.typ === 'pos' && gewaehlt.has(String(b.ziffer).toUpperCase()) && istGrund(b, z));
      if(i < 0){ i = bl.findIndex(b=> b.typ !== 'pos' || /^W[TN]\d/i.test(b.ziffer)); if(i < 0) i = bl.length; bl.splice(i, 0, z); nach = i; return; }
      bl.splice(i + 1, 0, z); nach = i + 1;
    });
    vorlage = { kopf: vorlage.kopf, bloecke: bl };
  }
  // Pruefen, ob jede gewaehlte Ziffer in der Vorlage vorkommt
  gewaehlt.forEach(z=>{
    if(z === 'REISE') { if(!vorlage.bloecke.some(b=> b.typ==='reise')) fehlend.push('Reiseentschädigung'); return; }
    if(!vorlage.bloecke.some(b=> b.typ==='pos' && b.ziffer.toUpperCase() === z)) fehlend.push(z);
  });
  vorlage.bloecke.forEach((b, blockNr)=>{
    const nimm = b.typ === 'pos' ? gewaehlt.has(b.ziffer.toUpperCase()) : reise;
    if(!nimm) return;
    // Anzahl > 1 (mehrfach erbrachte Leistung, z.B. 56 je angefangene halbe
    // Stunde): Positionszeile(n) entsprechend oft, Begruendung einmal danach
    const anzahl = b.typ === 'pos' ? Math.min(99, Math.max(1, Math.floor(Number((fall.anzahl || {})[b.ziffer.toUpperCase()]) || 1))) : 1;
    let reihen = b.zeilen.map((r, k)=> ({ r, erste: k === 0, block: blockNr }));
    if(anzahl > 1){
      let ab = b.zeilen.findIndex((r, k)=> k > 0 && /^begr/i.test(String(r[L.sp.faktor]).trim()));
      if(ab < 0) ab = b.zeilen.length;
      reihen = [];
      for(let i = 0; i < anzahl; i++){
        b.zeilen.slice(0, ab).forEach((r, k)=>{
          const kopie = r.slice();
          if(i > 0 && /UHRZEIT/i.test(String(kopie[L.sp.datum] || ''))) kopie[L.sp.datum] = '';
          reihen.push({ r: kopie, erste: k === 0, block: blockNr + '.' + i });
        });
      }
      b.zeilen.slice(ab).forEach(r=> reihen.push({ r, erste: false, block: blockNr + '.' + (anzahl - 1) }));
    }
    reihen.forEach(({ r: roh, erste, block }, k)=>{
      const z = roh.slice();
      if(b.typ === 'km'){
        const km = Math.ceil(Number(fall.km) || 0);
        const betrag = km * 0.26;
        z[L.sp.ziffer] = km; z[L.sp.betrag] = betrag;
        summe += betrag;
        zeilen.push({typ:'km', zellen: z, block: 'reise'});
        return;
      }
      if(erste && typeof z[L.sp.betrag] === 'number') summe += z[L.sp.betrag];
      zeilen.push({typ: b.typ === 'reise' ? 'reise' : 'pos', zellen: z, ersteZeile: erste, block: b.typ === 'reise' ? 'reise' : block});
    });
  });
  // Datum (erste Zeile) und Uhrzeit (zweite Zeile) in der Datumsspalte
  if(zeilen[0]) zeilen[0].zellen[L.sp.datum] = fall.datum || '';
  if(zeilen[1]){
    const alt = String(zeilen[1].zellen[L.sp.datum] || '');
    if(/UHRZEIT/i.test(alt) || alt === '') zeilen[1].zellen[L.sp.datum] = fall.zeit ? (fall.zeit + ' Uhr') : '';
  }
  return {zeilen, summe, fehlend};
}

// ---------- Word-XML der Tabelle ----------
function rdTabelleXml(kopf, tab, art, gesamtLabel, zeilenGesamt){
  const L = RECHNUNG_LAYOUT[art];
  const tw = L.cols.map(w=> Math.round(w * 20));
  const linie = (an)=> an ? 'w:val="single" w:sz="6" w:space="0" w:color="000000"' : 'w:val="nil"';
  const zelleXml = (text, breiteTw, ausr, rand, opts={})=>{
    const fett = opts.fett ? '<w:b/><w:bCs/>' : '';
    const span = opts.span ? `<w:gridSpan w:val="${opts.span}"/>` : '';
    // Passt der Text nicht in die Zelle (in Excel ragte er einfach etwas
    // hinaus), erst den Innenabstand weglassen, dann notfalls die Schrift
    // minimal schmaler laufen lassen -- ein Umbruch wuerde in der festen
    // Zeilenhoehe abgeschnitten.
    let mar = '', schmal = '';
    if(String(text) !== ''){
      const verfuegbar = breiteTw / 20 - 2 * RECHNUNG_ZELLRAND_TWIPS / 20 - 0.5;
      const breite = rdTextBreite(text, 10, !!opts.fett);
      if(breite > verfuegbar){
        mar = '<w:tcMar><w:left w:w="0" w:type="dxa"/><w:right w:w="0" w:type="dxa"/></w:tcMar>';
        const ohneRand = breiteTw / 20 - 1;
        if(breite > ohneRand) schmal = `<w:w w:val="${Math.max(75, Math.floor(ohneRand / breite * 100))}"/>`;
      }
    }
    return `<w:tc><w:tcPr><w:tcW w:w="${breiteTw}" w:type="dxa"/>${span}<w:tcBorders>` +
      `<w:top ${linie(rand.t)}/><w:left ${linie(rand.l)}/><w:bottom ${linie(rand.b)}/><w:right ${linie(rand.r)}/>` +
      `</w:tcBorders>${mar}<w:noWrap/><w:vAlign w:val="bottom"/></w:tcPr>` +
      `<w:p><w:pPr>${opts.zusammen ? '<w:keepNext/>' : ''}<w:spacing w:before="0" w:after="0" w:line="240" w:lineRule="auto"/><w:jc w:val="${ausr}"/>` +
      `<w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:cs="Arial"/><w:sz w:val="20"/></w:rPr></w:pPr>` +
      (String(text) === '' ? '' :
        `<w:r><w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:cs="Arial"/>${fett}${schmal}<w:sz w:val="20"/><w:szCs w:val="20"/></w:rPr>` +
        `<w:t xml:space="preserve">${rdXml(text)}</w:t></w:r>`) +
      `</w:p></w:tc>`;
  };
  // Mehrseitige Rechnung (sehr viele Positionen): Kopfzeile wiederholt sich
  // auf jeder Seite, eine Position wird nie ueber den Seitenwechsel getrennt
  // und die letzte Position bleibt bei der Gesamtzeile.
  const zeileXml = (zellen, kopfzeile)=> `<w:tr><w:trPr><w:cantSplit/><w:trHeight w:val="${RECHNUNG_ZEILENHOEHE_TWIPS}" w:hRule="exact"/>${kopfzeile ? '<w:tblHeader/>' : ''}</w:trPr>${zellen.join('')}</w:tr>`;
  const S = L.sp;
  const fmtZelle = (v, spalte)=>{
    if(spalte === S.betrag) return rdZahl(v, L.betragFormat);
    if(spalte === S.faktor && typeof v === 'number') return rdZahl(v, 'general');
    if(typeof v === 'number') return rdZahl(v, 'general');
    return String(v);
  };
  const xml = [];
  // Kopfzeile
  xml.push(zeileXml(kopf.map((t,i)=> zelleXml(t, tw[i], 'center', {t:1,b:1,l:i===0,r:1}, {fett:true, zusammen:true})), true));
  // Positionen
  tab.zeilen.forEach((z, idx)=>{
    const c = z.zellen;
    const naechste = tab.zeilen[idx + 1];
    const zus = !naechste || naechste.block === z.block;  // mit Folgezeile (bzw. Gesamtzeile) zusammenhalten
    const zx = (t, w, a, r, o={})=> zelleXml(t, w, a, r, {...o, zusammen: zus});
    if(z.typ === 'reise'){
      // Ziffer- und Faktorspalte verbunden: "Reiseentschädigung"
      xml.push(zeileXml([
        zx(fmtZelle(c[0],0), tw[0], 'center', {l:1,r:1}),
        zx(String(c[S.ziffer]), tw[1] + tw[2], 'center', {l:1,r:1}, {span:2}),
        zx(String(c[S.bez]), tw[3], 'left', {l:1,r:1}),
        zx(fmtZelle(c[S.betrag], S.betrag), tw[4], 'right', {l:1,r:1})
      ]));
      return;
    }
    if(z.typ === 'km'){
      // "86 km": Zahl rechtsbuendig in der Ziffer-, "km" linksbuendig in der Faktorspalte, ohne Trennlinie
      xml.push(zeileXml([
        zx('', tw[0], 'center', {l:1,r:1,b:1}),
        zx(String(c[S.ziffer]), tw[1], 'right', {l:1,r:0,b:1}),
        zx(String(c[S.faktor] || 'km'), tw[2], 'left', {l:0,r:1,b:1}),
        zx(String(c[S.bez]), tw[3], 'left', {l:1,r:1,b:1}),
        zx(rdZahl(c[S.betrag], '0.00'), tw[4], 'right', {l:1,r:1,b:1})
      ]));
      return;
    }
    const datumAusr = (idx < 2) ? 'right' : 'center';
    xml.push(zeileXml([0,1,2,3,4].map(i=>
      zx(fmtZelle(c[i], i), tw[i], i === 0 ? datumAusr : L.ausr[i], {l:1,r:1})
    )));
  });
  // Gesamtzeile
  xml.push(zeileXml([
    zelleXml('', tw[0], 'center', {t:1}),
    zelleXml('', tw[1], 'center', {t:1}),
    zelleXml('', tw[2], 'center', {t:1}),
    zelleXml(gesamtLabel, tw[3], 'right', {t:1,r:1}, {fett:true}),
    zelleXml(rdZahl(tab.summe, L.gesamtFormat), tw[4], 'right', {t:1,b:1,l:1,r:1}, {fett:true})
  ]));
  // Auffuellen auf die bisherige Bildhoehe (unsichtbare Leerzeilen)
  const belegt = tab.zeilen.length + 2;
  const zielZeilen = zeilenGesamt || L.zeilenGesamt;
  for(let i = belegt; i < zielZeilen; i++){
    xml.push(zeileXml(tw.map(w=> zelleXml('', w, 'left', {}))));
  }
  const grid = tw.map(w=> `<w:gridCol w:w="${w}"/>`).join('');
  const gesamtBreite = tw.reduce((a,b)=> a+b, 0);
  return `<w:tbl><w:tblPr><w:tblW w:w="${gesamtBreite}" w:type="dxa"/>` +
    `<w:tblInd w:w="${Math.round(L.einzug * 20)}" w:type="dxa"/>` +
    `<w:tblLayout w:type="fixed"/>` +
    `<w:tblCellMar><w:top w:w="0" w:type="dxa"/><w:left w:w="${RECHNUNG_ZELLRAND_TWIPS}" w:type="dxa"/>` +
    `<w:bottom w:w="0" w:type="dxa"/><w:right w:w="${RECHNUNG_ZELLRAND_TWIPS}" w:type="dxa"/></w:tblCellMar>` +
    `<w:tblLook w:val="0000"/></w:tblPr><w:tblGrid>${grid}</w:tblGrid>${xml.join('')}</w:tbl>`;
}

// ---------- Platzhalter ersetzen ----------
// Absatz: entweder leer/selbstschliessend (<w:p .../>) oder mit Inhalt
const RD_ABSATZ_RE = /<w:p(?:\s[^>]*?)?\/>|<w:p(?:\s[^>]*?)?>[\s\S]*?<\/w:p>/g;
// Wie ErsetzeAllePlatzhalter am PC: betroffene Absaetze werden mit dem
// Format des ersten Textstuecks neu geschrieben (so verhaelt sich auch
// "rng.Text = ..." in Word). Zeilenumbrueche (\n) werden zu <w:br/>.
function rdAbsatzText(p){
  return (p.match(/<w:t(?: [^>]*)?>[^<]*<\/w:t>/g) || []).map(t=> t.replace(/<[^>]+>/g,'')).join('')
    .replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&amp;/g,'&');
}
function rdPlatzhalterInXml(xml, platzhalter){
  return xml.replace(RD_ABSATZ_RE, (p)=>{
    if(/\/>$/.test(p) && !/<\/w:p>$/.test(p)) return p; // leerer Absatz
    if(/<w:object|<w:drawing|<w:fldChar|<w:instrText|<w:txbxContent/.test(p)) return p;
    const alt = rdAbsatzText(p);
    let neu = alt;
    platzhalter.forEach(([k, v])=>{ if(neu.indexOf(k) >= 0) neu = neu.split(k).join(v); });
    if(neu === alt) return p;
    const kopfEnde = p.indexOf('>') + 1;
    const pTag = p.slice(0, kopfEnde);
    const pPr = (p.match(/<w:pPr>[\s\S]*?<\/w:pPr>/) || [''])[0];
    const ersterRun = p.match(/<w:r(?=[ >])[^>]*>(?:(?!<\/w:r>)[\s\S])*?<w:t(?: [^>]*)?>/);
    const rPr = ersterRun ? ((ersterRun[0].match(/<w:rPr>[\s\S]*?<\/w:rPr>/) || [''])[0]) : '';
    const teile = String(neu).split(/\r\n|\n|\r|\u000b/);
    const inhalt = teile.map((t, i)=> (i ? '<w:br/>' : '') + `<w:t xml:space="preserve">${rdXml(t)}</w:t>`).join('');
    return `${pTag}${pPr}<w:r>${rPr}${inhalt}</w:r></w:p>`;
  });
}
function rdAbsatzEntfernen(xml, enthaelt){
  return xml.replace(RD_ABSATZ_RE, (p)=> (/<\/w:p>$/.test(p) && rdAbsatzText(p).indexOf(enthaelt) >= 0) ? '' : p);
}

// ---------- Hauptfunktion ----------
// vorlageDocm: ArrayBuffer der Word-Vorlage
// excelZeilen: 2D-Array der Excel-Vorlage ab A1 (Werte)
// daten: {art, positionen, datum, zeit, km, rechnungsdatum, vname, padresse1,
//         padresse2, geda, diag, bname, badresse1, badresse2, betrag, renu,
//         arzt:{titel,name,funktion,adresse1,adresse2,email,bank,bic,iban,kontoinhaber}}
// Liefert {blob|uint8, summe, warnungen}
async function rechnungDocxErzeugen(vorlageDocm, excelZeilen, daten, ausgabeTyp){
  const ZipKlasse = (typeof JSZip !== 'undefined') ? JSZip : require('jszip');
  const zip = await ZipKlasse.loadAsync(vorlageDocm);
  const vorlage = rdVorlageZerlegen(excelZeilen, daten.art);
  const tab = rdTabelleBauen(vorlage, daten);
  if(tab.fehlend.length){
    throw new Error('Diese Positionen fehlen in der Excel-Vorlage: ' + tab.fehlend.join(', '));
  }
  const gesamtLabel = daten.art === 'ls' ? 'Gesamt:' : 'Gesamt';
  // Hoehe des Excel-Bildes aus dem Verknuepfungsbereich der Vorlage
  // (z. B. Tabelle1!Z1S1:Z21S5 = 21 Zeilen), damit App und PC gleich aussehen
  let zeilenAusVorlage = 0;
  try {
    const rels = await zip.file('word/_rels/document.xml.rels').async('string');
    const m = rels.match(/oleObject"[^>]*Target="[^"]*![^"!]*!Z(\d+)S\d+:Z(\d+)S\d+"/) || rels.match(/Target="[^"]*![^"!]*!Z(\d+)S\d+:Z(\d+)S\d+"/);
    if(m) zeilenAusVorlage = Math.max(0, parseInt(m[2], 10) - parseInt(m[1], 10) + 1);
  } catch(e){}
  const tabelleXml = rdTabelleXml(vorlage.kopf, tab, daten.art, gesamtLabel, zeilenAusVorlage);

  const a = daten.arzt || {};
  const platzhalterKoerper = [
    ['DATE', daten.rechnungsdatum], ['VNAME', daten.vname], ['PADRESSE1', daten.padresse1 || ''],
    ['PADRESSE2', daten.padresse2 || ''], ['GEDA', daten.geda || '']
  ];
  if(daten.art === 'ls'){
    platzhalterKoerper.push(['BNAME', daten.bname || ''], ['BADRESSE1', daten.badresse1 || ''],
      ['BADRESSE2', daten.badresse2 || ''], ['BETRAG', daten.betrag || '']);
  } else {
    platzhalterKoerper.push(['DIAG', daten.diag || '']);
  }
  platzhalterKoerper.push(['RENU', daten.renu], ['ATITEL', a.titel || ''], ['ANAME', a.name || ''],
    ['AFUNKTION', a.funktion || ''], ['AADRESSE1', a.adresse1 || ''], ['AADRESSE2', a.adresse2 || ''],
    ['AEMAIL', a.email || '']);
  const platzhalterFuss = [['BANAME', a.bank || ''], ['BABIC', a.bic || ''], ['BAIBAN', a.iban || ''], ['ENAME', a.kontoinhaber || '']];

  // Hauptdokument
  let doc = await zip.file('word/document.xml').async('string');
  const objPara = (doc.match(RD_ABSATZ_RE) || []).filter(p=> p.indexOf('<w:object') >= 0).map(p=> [p])[0];
  if(!objPara) throw new Error('In der Word-Vorlage wurde die verknüpfte Excel-Tabelle nicht gefunden.');
  const relIds = (objPara[0].match(/r:id="(rId\d+)"/g) || []).map(s=> s.slice(6, -1));
  doc = doc.replace(objPara[0], tabelleXml);
  doc = rdPlatzhalterInXml(doc, platzhalterKoerper);
  if(daten.art === 'ls' && !String(daten.bname || '').trim()) doc = rdAbsatzEntfernen(doc, 'c/o Bestattungsinstitut');
  zip.file('word/document.xml', doc);

  // Kopf-/Fusszeilen
  for(const name of Object.keys(zip.files)){
    if(/^word\/(footer|header)\d+\.xml$/.test(name)){
      const x = await zip.file(name).async('string');
      const y = rdPlatzhalterInXml(x, name.indexOf('footer') >= 0 ? platzhalterFuss.concat(platzhalterKoerper) : platzhalterKoerper);
      if(y !== x) zip.file(name, y);
    }
  }

  // Dokumenteigenschaften: das Kopffeld "ATITEL ANAME" ist in der Vorlage an
  // dc:subject gebunden -- Word zeigt beim Oeffnen den Wert von dort an.
  if(zip.file('docProps/core.xml')){
    let core = await zip.file('docProps/core.xml').async('string');
    platzhalterKoerper.forEach(([k, v])=>{ core = core.split(k).join(rdXml(String(v).replace(/[\r\n\u000b]+/g, ' '))); });
    core = core.replace(/<dcterms:modified([^>]*)>[^<]*<\/dcterms:modified>/, `<dcterms:modified$1>${new Date().toISOString().replace(/\.\d+Z$/, 'Z')}</dcterms:modified>`);
    zip.file('docProps/core.xml', core);
  }

  // Verknuepfung zur Excel-Datei + Vorschaubild + Makros entfernen
  let rels = await zip.file('word/_rels/document.xml.rels').async('string');
  relIds.forEach(id=>{
    const m = rels.match(new RegExp(`<Relationship [^>]*Id="${id}"[^>]*/>`));
    if(m){
      const ziel = (m[0].match(/Target="([^"]+)"/) || [])[1];
      if(ziel && !/^file:/i.test(ziel) && zip.file('word/' + ziel)) zip.remove('word/' + ziel);
      rels = rels.replace(m[0], '');
    }
  });
  rels = rels.replace(/<Relationship [^>]*Type="[^"]*vbaProject"[^>]*\/>/g, '');
  zip.file('word/_rels/document.xml.rels', rels);
  ['word/vbaProject.bin', 'word/vbaData.xml', 'word/_rels/vbaProject.bin.rels'].forEach(f=>{ if(zip.file(f)) zip.remove(f); });
  let ct = await zip.file('[Content_Types].xml').async('string');
  ct = ct.replace('application/vnd.ms-word.document.macroEnabled.main+xml', 'application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml')
         .replace('application/vnd.ms-word.template.macroEnabledTemplate.main+xml', 'application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml')
         .replace(/<Override [^>]*PartName="\/word\/vbaData\.xml"[^>]*\/>/g, '')
         .replace(/<Default [^>]*Extension="bin"[^>]*ContentType="application\/vnd\.ms-office\.vbaProject"[^>]*\/>/g, '');
  if(!zip.file('word/media/image1.emf') && !/<Relationship [^>]*\.emf"/.test(rels)) ct = ct.replace(/<Default [^>]*Extension="emf"[^>]*\/>/g, '');
  zip.file('[Content_Types].xml', ct);

  const inhalt = await zip.generateAsync({type: ausgabeTyp || 'blob', compression: 'DEFLATE',
    mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
  const warnungen = [];
  const betragApp = Number(String(daten.betrag || '').replace(/\./g,'').replace(',', '.'));
  if(daten.betrag && !isNaN(betragApp) && Math.abs(rdRunden2(tab.summe) - betragApp) > 0.005){
    warnungen.push('Summe laut Vorlage ' + rdZahl(tab.summe, '0.00') + ' € weicht vom Betrag in der App (' + daten.betrag + ' €) ab.');
  }
  return {inhalt, summe: rdRunden2(tab.summe), warnungen, zeilen: tab.zeilen.length};
}



// =====================================================================
// BETA: Rechnung (Word + PDF) direkt am Handy erstellen + Testbrief
// =====================================================================
// Ablauf je Fall:
//   1. Arztdaten aus der einstellungen.ini (wie am PC)
//   2. Word-Vorlage (…_Makros_v4.docm) und Excel-Vorlage (Positionen) aus
//      OneDrive laden
//   3. .docx erzeugen (siehe rechnungDocxErzeugen) und hochladen
//   4. PDF von Microsoft aus der .docx erzeugen lassen und daneben ablegen
//   5. Zeile in die Rechnungsuebersicht schreiben (wie SchreibeInUebersicht)
// Wohin geschrieben wird, entscheidet betaZiel(): Testablage (Standard) oder
// Echtbetrieb (Schalter in den Einstellungen).
const BETA_ZIEL_ORDNER = 'KVBW Onedrive/Beta-Test/fertige Rechnungen';
const MSGRAPH_PFAD_WORDVORLAGE = {
  ls: 'KVBW Onedrive/Vorlage_Abrechnung_Leichenschau_Makros_v4.docm',
  pt: 'KVBW Onedrive/Vorlage_Abrechnung_Privatpatienten_Makros_v4.docm'
};
const EXCELVORLAGE_SNAPSHOT_BLATT = { ls: 'LS_Snapshot', pt: 'PR_Snapshot' };

function renuDateiname(renu){
  const t = String(renu||'').split('-');
  return t.length === 2 ? t[1] + '-' + t[0] : String(renu||'');
}

// Wie EintragMitFlags/DiagnosenText am PC: ";G"/";V" vor "]", bei V "V.a. " davor
function diagnosenVolltext(diagnosen){
  return (diagnosen||[]).map(d=>{
    let t = d.text || '';
    const fl = d.flags || '';
    let marker = '';
    if(fl.indexOf('G') >= 0) marker += ';G';
    if(fl.indexOf('V') >= 0) marker += ';V';
    if(marker){
      const p = t.lastIndexOf(']');
      t = p >= 0 ? t.slice(0, p) + marker + t.slice(p) : t + ' [' + marker.slice(1) + ']';
      if(fl.indexOf('V') >= 0) t = 'V.a. ' + t;
    }
    return t;
  }).join(', ');
}

// Fuehrt einen Arbeitsschritt aus und benennt ihn im Fehlerfall -- statt
// eines nackten "Failed to fetch" steht dann da, WELCHER Zugriff scheiterte.
async function schritt(name, fn){
  try{ return await fn(); }
  catch(e){
    const msg = (e && e.message) || String(e);
    if(e instanceof TypeError || /failed to fetch|networkerror|load failed|network request failed/i.test(msg)){
      throw new Error(name + ': keine Antwort von Microsoft (' + msg + '). Internet prüfen bzw. Einstellungen > OneDrive > „Verbindungstest“.');
    }
    if(msg.indexOf(name) === 0) throw e;
    throw new Error(name + ': ' + msg);
  }
}

async function graphDateiLaden(token, pfad){
  const r = await fetch(msGraphPfadUrl(pfad) + '/content', { headers:{ Authorization:'Bearer ' + token }, cache:'no-store' });
  if(!r.ok) throw new Error('„' + pfad.split('/').pop() + '“ konnte nicht aus OneDrive geladen werden (HTTP ' + r.status + ').');
  return r.arrayBuffer();
}

async function excelVorlageZeilenLaden(token, art){
  const pfad = art === 'ls' ? MSGRAPH_PFAD_VORLAGE_LS : MSGRAPH_PFAD_VORLAGE_PT;
  const basis = msGraphPfadUrl(pfad);
  // Bevorzugt die unveraenderte Snapshot-Kopie (vollstaendiger Katalog),
  // sonst Tabelle1
  let letzterFehler = '';
  for(const blatt of [EXCELVORLAGE_SNAPSHOT_BLATT[art], 'Tabelle1']){
    try{
      const url = basis + "/workbook/worksheets('" + encodeURIComponent(blatt) + "')/range(address='A1:F120')?$select=values";
      const r = await fetch(url, { headers:{ Authorization:'Bearer ' + token } });
      if(!r.ok){ letzterFehler = 'HTTP ' + r.status; continue; }
      const d = await r.json();
      const zeilen = d.values || [];
      const kopf = (zeilen[0] || []).map(v=> String(v));
      if(kopf.some(v=> /bezeichnung/i.test(v))) return {zeilen, blatt};
    }catch(e){ letzterFehler = (e && e.message) || String(e); /* naechstes Blatt versuchen */ }
  }
  throw new Error('Die Positionen konnten nicht aus der Excel-Vorlage gelesen werden' + (letzterFehler ? ' (' + letzterFehler + ')' : '') + '.');
}

async function arztdatenLaden(){
  const ini = await iniVonOneDriveLaden();
  const w = ini.werte;
  const ja = k => String(w[k]||'').trim() === '1';
  let titel = '';
  if(ja('TITEL_PROF')) titel += 'Prof. ';
  if(ja('TITEL_PRIVDOZ')) titel += 'Priv.-Doz. ';
  if(ja('TITEL_DR')) titel += 'Dr. ';
  if(ja('TITEL_DRMED')) titel += 'Dr. med. ';
  const a = {
    titel: titel.trim(), name: w.ARZTNAME || '', funktion: String(w.ARZTFUNKTION||'').split('~NL~').join('\n'),
    adresse1: w.ARZTADRESSE1 || '', adresse2: w.ARZTADRESSE2 || '', email: w.ARZTEMAIL || '',
    bank: w.ARZTBANKNAME || '', bic: w.ARZTBIC || '', iban: w.ARZTIBAN || '', kontoinhaber: w.ARZTKONTOINHABER || ''
  };
  const fehlt = [['ARZTNAME','Name'],['ARZTFUNKTION','Funktion'],['ARZTADRESSE1','Adresse 1'],['ARZTADRESSE2','Adresse 2'],['ARZTEMAIL','E-Mail']]
    .filter(([k])=> !String(w[k]||'').trim()).map(([,l])=> l);
  if(fehlt.length) throw new Error('In den Arztinfos fehlen: ' + fehlt.join(', ') + ' (Einstellungen > Arztinfos).');
  return {arzt: a, ini: w};
}

function fallRechnungsdaten(f, arzt){
  const w = f.werte || {};
  const {nachname, vorname} = nameAufteilen(w.txtName);
  if(!nachname || !vorname) throw new Error('Name bitte als „Nachname, Vorname“ oder „Vorname Nachname“ eintragen.');
  const heute = new Date(), p2 = n=> String(n).padStart(2,'0');
  const rechnungsdatum = normalisiereDatum(w.txtDatum || '') || (p2(heute.getDate()) + '.' + p2(heute.getMonth()+1) + '.' + heute.getFullYear());
  const daten = {
    art: f.art, positionen: f.positionen || [],
    datum: normalisiereDatum(w.txtDatumExcel || '') || '', zeit: (w.txtZeitLS || '').trim(),
    km: Number(String(w.txtKm || '0').replace(',', '.')) || 0,
    rechnungsdatum, vname: vorname + ' ' + nachname,
    padresse1: w.txtPAdresse1 || '', padresse2: w.txtPAdresse2 || '',
    geda: normalisiereDatum(w.txtGeda || '') || (w.txtGeda || ''),
    betrag: w.txtBetrag || '', renu: f.rechnungsnummer, arzt
  };
  if(f.art === 'pt'){
    daten.diag = diagnosenVolltext(w.diagnosen);
  } else {
    const bestatter = String(w.txtBName || '').trim();
    if(bestatter){
      daten.bname = bestatter; daten.badresse1 = w.txtAdresse1 || ''; daten.badresse2 = w.txtAdresse2 || '';
    } else {
      // wie am PC: ohne Bestatter an die Patientenadresse, "c/o"-Zeile entfaellt
      daten.bname = ''; daten.badresse1 = daten.padresse1; daten.badresse2 = daten.padresse2;
    }
  }
  daten.eigene = (typeof betaEigeneFuerFall === 'function') ? betaEigeneFuerFall(f) : [];
  // Faktoren und Begruendungen des Falls
  if(typeof betaDetailsFuerGenerator === 'function'){
    const g = betaDetailsFuerGenerator(f);
    daten.posDetails = g.posDetails; daten.begruendungen = g.begruendungen; daten.anzahl = g.anzahl || {}; daten.varianten = g.varianten || {};
    daten.eigene = betaEigeneMitDetails(f, daten.eigene);
  }
  if(!daten.datum) throw new Error('Datum der Leichenschau bzw. des Hausbesuchs fehlt.');
  if(!daten.positionen.length) throw new Error('Es sind keine Rechnungspositionen ausgewählt.');
  return daten;
}
